// SECTION 20: MAIN GAME CLASS
// ============================================

class Game {
    constructor() {
        this.canvas = document.getElementById('mainCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.uiCanvas = document.getElementById('uiCanvas');
        this.uiCtx = this.uiCanvas.getContext('2d');
        this.camera = new Camera();
        this.stage = new StageData(200, 27);
        this.editor = new Editor();
        this.entityManager = new EntityManager();
        this.mode = 'edit'; // edit, preview, play
        this.running = true;
        this.time = 0;
        this.gameTime = 0;
        this.gameTimer = 0;
        this.goalReached = false;
        this.goalTimer = 0;
        this.playStageBackup = null;
        /** プレイ中: 移動で周囲タイル破壊・無敵。F9 で切替 */
        this.cheatMode = false;

        this.lastFrameTime = 0;
        this.deltaTime = 0;
        this.fps = 60;
        this.fpsCounter = 0;
        this.fpsTimer = 0;
        this.fpsDisplay = 60;

        this.resizeHandler = this.resize.bind(this);
        window.addEventListener('resize', this.resizeHandler);
    }

    init() {
        this.resize();
        this.stage.generateDefault();
        this.camera.setWorldSize(this.stage.width * TILE_SIZE, this.stage.height * TILE_SIZE);
        this.camera.fitToStage(this.stage.width, this.stage.height);
        this.camera.editorMode = true;
        this.setupToolbar();
        audio.init();
        this.editor.updatePalette();
        document.getElementById('statusTileCount').textContent = this.stage.countTiles() + ' パーツ';
    }

    resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        this.canvas.width = w;
        this.canvas.height = h;
        this.uiCanvas.width = w;
        this.uiCanvas.height = h;
        this.camera.setViewport(w, h);
    }

    setupToolbar() {
        document.getElementById('btnEdit').addEventListener('click', () => this.switchToEdit());
        document.getElementById('btnPreview').addEventListener('click', () => this.togglePreviewMode());
        document.getElementById('btnPlay').addEventListener('click', () => this.switchToPlay());
        document.getElementById('btnStop').addEventListener('click', () => this.switchToEdit());
        document.getElementById('btnUndo').addEventListener('click', () => this.editor.performUndo(this.stage));
        document.getElementById('btnRedo').addEventListener('click', () => this.editor.performRedo(this.stage));
        document.getElementById('btnTheme').addEventListener('click', () => showThemeModal());
        document.getElementById('btnSettings').addEventListener('click', () => showSettingsModal());
        document.getElementById('btnSave').addEventListener('click', () => saveStage());
        document.getElementById('btnLoad').addEventListener('click', () => showLoadModal());
        document.getElementById('btnNew').addEventListener('click', () => showNewStageConfirm());
        document.getElementById('zoomIn').addEventListener('click', () => this.camera.zoomIn());
        document.getElementById('zoomOut').addEventListener('click', () => this.camera.zoomOut());
        document.getElementById('zoomFit').addEventListener('click', () => this.camera.fitToStage(this.stage.width, this.stage.height));

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

            if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') {
                e.preventDefault();
                saveStage();
            }
            if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
                e.preventDefault();
                if (e.shiftKey) {
                    this.editor.performRedo(this.stage);
                } else {
                    this.editor.performUndo(this.stage);
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.code === 'KeyY') {
                e.preventDefault();
                this.editor.performRedo(this.stage);
            }
            if (e.code === 'KeyP' && (this.mode === 'edit' || this.mode === 'preview')) {
                this.switchToPlay();
            }
            if (e.code === 'KeyE' && (this.mode === 'play' || this.mode === 'preview')) {
                this.switchToEdit();
            }
            if (e.code === 'KeyV' && this.mode === 'edit') {
                this.switchToPreview();
            }
            if (e.code === 'KeyV' && this.mode === 'preview') {
                this.switchToEdit();
            }
            if (e.code === 'Escape') {
                if (this.mode === 'play' || this.mode === 'preview') this.switchToEdit();
                hideModal();
            }
            if (e.code === 'F9') {
                e.preventDefault();
                this.cheatMode = !this.cheatMode;
                showToast(this.cheatMode ? 'チートON：無敵＋移動で周囲が崩壊（F9でOFF）' : 'チートOFF', this.cheatMode ? 'info' : 'success');
                const row = document.getElementById('hudCheatRow');
                if (row) row.style.display = (this.cheatMode && this.mode === 'play') ? '' : 'none';
            }
        });

        // Right panel inputs
        document.getElementById('stageName').addEventListener('change', (e) => {
            this.stage.name = e.target.value.trim() || 'Untitled';
        });
        document.getElementById('stageWidth').addEventListener('change', (e) => {
            const w = parseInt(e.target.value);
            if (w >= 20 && w <= 500 && w !== this.stage.width) {
                this.stage.resize(w, this.stage.height);
                this.camera.setWorldSize(this.stage.width * TILE_SIZE, this.stage.height * TILE_SIZE);
                stageRenderer.clearCache();
            }
        });
        document.getElementById('stageHeight').addEventListener('change', (e) => {
            const h = parseInt(e.target.value);
            if (h >= 15 && h <= 40 && h !== this.stage.height) {
                this.stage.resize(this.stage.width, h);
                this.camera.setWorldSize(this.stage.width * TILE_SIZE, this.stage.height * TILE_SIZE);
                stageRenderer.clearCache();
            }
        });
        document.getElementById('timeLimit').addEventListener('change', (e) => {
            this.stage.timeLimit = parseInt(e.target.value) || 300;
        });
    }

    switchToPlay() {
        if (this.mode === 'play') return;
        if (this.mode !== 'edit' && this.mode !== 'preview') return;
        audio.init();
        audio.resume();

        document.body.classList.remove('preview-mode');

        // Backup stage for restoration
        this.playStageBackup = this.stage.clone();

        this.mode = 'play';
        this.goalReached = false;
        this.goalTimer = 0;
        this.gameTime = 0;
        this.gameTimer = this.stage.timeLimit;

        // Spawn entities from stage
        this.entityManager.spawnFromStage(this.stage);

        // Find player spawn
        const spawn = this.stage.findPlayerSpawn();
        this.entityManager.player.reset(spawn.x, spawn.y);
        this.entityManager.player.coins = 0;
        this.entityManager.player.score = 0;

        // Camera follows player
        this.camera.editorMode = false;
        this.camera.targetZoom = PLAY_CAMERA_ZOOM;
        this.camera.zoom = PLAY_CAMERA_ZOOM;
        const pl = this.entityManager.player;
        this.camera.snapToPlayerPlayStart(pl.x, pl.y, pl.w, pl.h);

        // UI updates
        document.getElementById('btnEdit').classList.remove('active');
        document.getElementById('btnPreview').classList.remove('active');
        document.getElementById('btnPlay').style.display = 'none';
        document.getElementById('btnStop').style.display = '';
        document.getElementById('leftPanel').classList.add('collapsed');
        document.getElementById('rightPanel').classList.add('collapsed');
        document.getElementById('gameHud').style.display = '';
        document.getElementById('statusMode').textContent = 'プレイモード';

        particles.clear();
        showToast('プレイモード開始！', 'success');
    }

    switchToPreview() {
        if (this.mode !== 'edit') return;
        this.mode = 'preview';
        document.body.classList.add('preview-mode');
        document.getElementById('btnEdit').classList.remove('active');
        document.getElementById('btnPreview').classList.add('active');
        document.getElementById('statusMode').textContent = '閲覧モード（見るだけ）';
        this.editor.isDrawing = false;
        this.editor.selectionRect = null;
        showToast('見るだけモード：矢印キー・ズーム・パンで閲覧。E または「エディタ」で編集に戻れます', 'info');
    }

    togglePreviewMode() {
        if (this.mode === 'preview') {
            this.switchToEdit();
        } else if (this.mode === 'edit') {
            this.switchToPreview();
        }
    }

    switchToEdit() {
        if (this.mode === 'edit') return;

        this.goalReached = false;
        this.goalTimer = 0;
        document.body.classList.remove('preview-mode');

        if (this.mode === 'play') {
            // Restore stage from backup (so enemies reappear, blocks restored)
            if (this.playStageBackup) {
                this.stage = this.playStageBackup;
                this.playStageBackup = null;
            }
            this.entityManager.clear();
        }

        this.mode = 'edit';

        this.camera.editorMode = true;
        this.camera.targetZoom = 1.0;

        // UI updates
        document.getElementById('btnEdit').classList.add('active');
        document.getElementById('btnPreview').classList.remove('active');
        document.getElementById('btnPlay').style.display = '';
        document.getElementById('btnStop').style.display = 'none';
        document.getElementById('leftPanel').classList.remove('collapsed');
        document.getElementById('rightPanel').classList.remove('collapsed');
        document.getElementById('gameHud').style.display = 'none';
        document.getElementById('statusMode').textContent = 'エディタモード';

        stageRenderer.clearCache();
        sprites.clearCache();
        particles.clear();
        this.editor.updatePalette();
        showToast('エディタモードに戻りました', 'success');
    }

    handleGoalReached() {
        if (this.goalReached) return;
        this.goalReached = true;
        this.goalTimer = 0;
        audio.playGoal();

        const p = this.entityManager.player;
        particles.emitGoal(p.x + p.w / 2, p.y);

        // Score bonus for remaining time
        p.score += this.gameTimer * 50;
    }

    /** チート: プレイ中のみ、移動中に周囲のタイルを連続で AIR にする */
    applyCheatDestruction() {
        if (!this.cheatMode || this.mode !== 'play' || this.goalReached) return;
        const p = this.entityManager.player;
        if (!p || !p.alive) return;
        const moving = Math.abs(p.vx) > 0.12 || Math.abs(p.vy) > 0.35;
        if (!moving) return;

        const stage = this.stage;
        const cx = Math.floor((p.x + p.w / 2) / TILE_SIZE);
        const cy = Math.floor((p.y + p.h / 2) / TILE_SIZE);
        const speed = Math.min(1.2, Math.hypot(p.vx, p.vy) / 5);
        const maxBreak = Math.min(28, 10 + Math.floor(speed * 16));
        const radius = 5 + Math.floor(speed * 5);
        const skip = new Set([TILE_TYPES.AIR, TILE_TYPES.GOAL, TILE_TYPES.PLAYER_SPAWN, TILE_TYPES.CHECKPOINT]);
        let broke = 0;
        const attempts = maxBreak * 5;
        for (let i = 0; i < attempts && broke < maxBreak; i++) {
            const dx = Math.floor((Math.random() - 0.5) * 2 * radius);
            const dy = Math.floor((Math.random() - 0.5) * 2 * radius);
            const tx = cx + dx;
            const ty = cy + dy;
            if (tx < 0 || ty < 0 || tx >= stage.width || ty >= stage.height) continue;
            const t = stage.getTile(tx, ty);
            if (skip.has(t)) continue;
            stage.setTile(tx, ty, TILE_TYPES.AIR);
            if (typeof donutTracker !== 'undefined') donutTracker.activeBlocks.delete(`${tx},${ty}`);
            if (broke % 2 === 0) {
                particles.emitBrickBreak(tx * TILE_SIZE + TILE_SIZE / 2, ty * TILE_SIZE + TILE_SIZE / 2);
            }
            broke++;
        }
        if (broke > 0) stageRenderer.clearCache();
    }

    update() {
        this.time++;

        if (this.mode === 'edit' || this.mode === 'preview') {
            this.updateEditor();
        } else {
            this.updatePlay();
        }

        this.camera.update();
        particles.update();

        // Update zoom display
        document.getElementById('zoomLevel').textContent = this.camera.getZoomPercent() + '%';
    }

    updateEditor() {
        this.editor.handleMouseInput(this.camera, this.stage);
    }

    updatePlay() {
        if (this.goalReached) {
            this.goalTimer++;
            if (this.goalTimer > 180) {
                // After 3 seconds, return to editor
                showToast('クリア！スコア: ' + this.entityManager.player.score, 'success');
                this.switchToEdit();
                return;
            }
        }

        // Game timer
        this.gameTime++;
        if (this.gameTime % 60 === 0 && !this.goalReached) {
            this.gameTimer--;
            if (this.gameTimer <= 0) {
                this.entityManager.player.die();
            }
        }

        // Update entities
        this.entityManager.update(this.stage);

        this.applyCheatDestruction();

        // Camera follow
        const p = this.entityManager.player;
        if (p.alive) {
            this.camera.followPlayer(p.x, p.y, p.w, p.h);
        }

        // Player death -> respawn or back to editor
        if (!p.alive && p.deathTimer > 90) {
            if (p.lives > 0) {
                // Respawn
                const spawn = p.checkpointX >= 0 ?
                    { x: p.checkpointX * TILE_SIZE, y: p.checkpointY * TILE_SIZE } :
                    this.stage.findPlayerSpawn();
                p.reset(spawn.x, spawn.y);
                // Restore stage
                if (this.playStageBackup) {
                    for (let y = 0; y < this.stage.height; y++) {
                        for (let x = 0; x < this.stage.width; x++) {
                            this.stage.tiles[y][x] = this.playStageBackup.tiles[y][x];
                        }
                    }
                }
                this.entityManager.spawnFromStage(this.stage);
                this.gameTimer = this.stage.timeLimit;
                stageRenderer.clearCache();
                this.camera.snapToPlayerPlayStart(p.x, p.y, p.w, p.h);
            } else {
                showToast('ゲームオーバー...', 'error');
                this.switchToEdit();
            }
        }

        // HUD update
        document.getElementById('hudCoins').textContent = p.coins;
        document.getElementById('hudScore').textContent = p.score;
        document.getElementById('hudTime').textContent = Math.max(0, this.gameTimer);

        let livesStr = '';
        for (let i = 0; i < Math.min(p.lives, 10); i++) livesStr += '♥';
        document.getElementById('hudLives').textContent = livesStr || '💀';
        const cheatRow = document.getElementById('hudCheatRow');
        if (cheatRow) cheatRow.style.display = this.cheatMode ? '' : 'none';
    }

    render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        bgRenderer.render(ctx, this.camera, w, h, this.stage.theme, this.time);

        // Stage tiles
        stageRenderer.render(ctx, this.stage, this.camera, this.time);

        // Entities (play mode)
        if (this.mode === 'play') {
            this.entityManager.render(ctx, this.camera);
        }

        // Particles
        particles.render(ctx, this.camera);

        // Editor overlay
        if (this.mode === 'edit' || this.mode === 'preview') {
            this.editor.renderEditorOverlay(ctx, this.camera, this.stage);
        }

        // Goal reached celebration overlay（プレイ中のみ。エディタに戻ったあと残さない）
        if (this.mode === 'play' && this.goalReached) {
            this.renderGoalOverlay(ctx, w, h);
        }

        // Minimap (editor / preview)
        if (this.mode === 'edit' || this.mode === 'preview') {
            minimapRenderer.update(this.stage, this.camera);
        }

        // FPS counter
        this.fpsCounter++;
        const now = performance.now();
        if (now - this.fpsTimer >= 1000) {
            this.fpsDisplay = this.fpsCounter;
            this.fpsCounter = 0;
            this.fpsTimer = now;
        }
    }

    renderGoalOverlay(ctx, w, h) {
        const alpha = Math.min(1, this.goalTimer / 30);

        // Semi-transparent overlay
        ctx.fillStyle = `rgba(0,0,0,${alpha * 0.3})`;
        ctx.fillRect(0, 0, w, h);

        // "GOAL!" text
        const scale = 1 + Math.sin(this.goalTimer * 0.05) * 0.05;
        ctx.save();
        ctx.translate(w / 2, h * 0.35);
        ctx.scale(scale, scale);

        ctx.font = 'bold 72px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Text shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillText('GOAL!', 3, 3);

        // Rainbow text
        const gradient = ctx.createLinearGradient(-100, 0, 100, 0);
        const hueOffset = (this.goalTimer * 5) % 360;
        gradient.addColorStop(0, `hsl(${hueOffset}, 100%, 60%)`);
        gradient.addColorStop(0.25, `hsl(${(hueOffset + 90) % 360}, 100%, 60%)`);
        gradient.addColorStop(0.5, `hsl(${(hueOffset + 180) % 360}, 100%, 60%)`);
        gradient.addColorStop(0.75, `hsl(${(hueOffset + 270) % 360}, 100%, 60%)`);
        gradient.addColorStop(1, `hsl(${hueOffset}, 100%, 60%)`);
        ctx.fillStyle = gradient;
        ctx.fillText('GOAL!', 0, 0);

        ctx.restore();

        // Score display
        if (this.goalTimer > 30) {
            const scoreAlpha = Math.min(1, (this.goalTimer - 30) / 20);
            ctx.globalAlpha = scoreAlpha;
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`SCORE: ${this.entityManager.player.score}`, w / 2, h * 0.5);

            ctx.fillStyle = '#fff';
            ctx.font = '20px sans-serif';
            ctx.fillText(`コイン: ${this.entityManager.player.coins}  タイムボーナス: ${Math.max(0, this.gameTimer) * 50}`, w / 2, h * 0.58);
            ctx.globalAlpha = 1;
        }

        // "Press ESC to return" text
        if (this.goalTimer > 90) {
            const blinkAlpha = 0.5 + Math.sin(this.goalTimer * 0.1) * 0.5;
            ctx.globalAlpha = blinkAlpha;
            ctx.fillStyle = '#fff';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ESC or E でエディタに戻る', w / 2, h * 0.7);
            ctx.globalAlpha = 1;
        }

        // Emit celebration particles periodically
        if (this.goalTimer % 8 === 0) {
            const px = Math.random() * w;
            const py = Math.random() * h * 0.3;
            const worldPos = this.camera.screenToWorld(px, py);
            particles.emitGoal(worldPos.x, worldPos.y);
        }
    }

    // Main loop
    loop(timestamp) {
        if (!this.running) return;

        this.deltaTime = timestamp - this.lastFrameTime;
        this.lastFrameTime = timestamp;

        // Cap delta to prevent spiral of death
        if (this.deltaTime > 50) this.deltaTime = 50;

        this.update();
        this.render();

        input.endFrame();
        input.pollGamepad();

        requestAnimationFrame((t) => this.loop(t));
    }

    start() {
        this.lastFrameTime = performance.now();
        this.fpsTimer = performance.now();
        this.loop(this.lastFrameTime);
    }
}


// ============================================
// SECTION 21: LOADING SCREEN & INITIALIZATION
// ============================================

let game = null;

function updateLoadingBar(percent, text) {
    const bar = document.getElementById('loadingBar');
    const label = document.getElementById('loadingText');
    if (bar) bar.style.width = percent + '%';
    if (label) label.textContent = text;
}

async function initGame() {
    updateLoadingBar(10, 'エンジン初期化中...');
    await sleep(100);

    game = new Game();

    updateLoadingBar(30, 'スプライト生成中...');
    await sleep(50);

    // Pre-generate commonly used sprites to avoid hitches later
    const pregenTiles = [
        TILE_TYPES.GROUND, TILE_TYPES.GROUND_TOP, TILE_TYPES.BRICK,
        TILE_TYPES.QUESTION, TILE_TYPES.HARD_BLOCK,
        TILE_TYPES.PIPE_TL, TILE_TYPES.PIPE_TR, TILE_TYPES.PIPE_BL, TILE_TYPES.PIPE_BR,
        TILE_TYPES.COIN, TILE_TYPES.SPIKE,
        TILE_TYPES.GOOMBA, TILE_TYPES.KOOPA,
        TILE_TYPES.MUSHROOM_ITEM, TILE_TYPES.FIRE_FLOWER,
        TILE_TYPES.PLATFORM_WOOD, TILE_TYPES.PLATFORM_STONE,
        TILE_TYPES.WATER, TILE_TYPES.WATER_TOP,
        TILE_TYPES.LAVA, TILE_TYPES.LAVA_TOP,
    ];

    const themes = Object.keys(THEMES);
    let pregenCount = 0;
    const totalPregen = pregenTiles.length * themes.length;

    for (const themeKey of themes) {
        for (const tileType of pregenTiles) {
            sprites.getCachedTile(tileType, themeKey, 0);
            pregenCount++;
            const pct = 30 + (pregenCount / totalPregen) * 40;
            if (pregenCount % 10 === 0) {
                updateLoadingBar(pct, `テーマ「${THEMES[themeKey].name}」のスプライト生成中...`);
                await sleep(1);
            }
        }
    }

    updateLoadingBar(75, 'ステージ初期化中...');
    await sleep(50);

    game.init();

    updateLoadingBar(90, 'UI構築中...');
    await sleep(50);

    updateLoadingBar(100, '準備完了！');
    await sleep(300);

    // Hide loading screen

// SECTION 22: MINIMAP CLICK NAVIGATION
// ============================================

(function setupMinimapNavigation() {
    const minimap = document.getElementById('minimap');
    if (!minimap) return;

    let draggingMinimap = false;

    function handleMinimapInput(e) {
        if (!game || (game.mode !== 'edit' && game.mode !== 'preview')) return;

        const rect = minimap.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const mw = rect.width;
        const mh = rect.height;

        // Convert to world position
        const scaleX = mw / (game.stage.width * TILE_SIZE);
        const scaleY = mh / (game.stage.height * TILE_SIZE);
        const scale = Math.min(scaleX, scaleY);

        const offsetX = (mw - game.stage.width * TILE_SIZE * scale) / 2;
        const offsetY = (mh - game.stage.height * TILE_SIZE * scale) / 2;

        const worldX = (mx - offsetX) / scale;
        const worldY = (my - offsetY) / scale;

        // Center camera on clicked position
        const viewW = game.camera.width / game.camera.zoom;
        const viewH = game.camera.height / game.camera.zoom;
        game.camera.targetX = worldX - viewW / 2;
        game.camera.targetY = worldY - viewH / 2;
    }

    minimap.addEventListener('mousedown', (e) => {
        e.preventDefault();
        draggingMinimap = true;
        handleMinimapInput(e);
    });

    window.addEventListener('mousemove', (e) => {
        if (draggingMinimap) {
            handleMinimapInput(e);
        }
    });

    window.addEventListener('mouseup', () => {
        draggingMinimap = false;
    });
})();

(function setupAdditionalKeys() {
    window.addEventListener('keydown', (e) => {
        if (!game || game.mode !== 'edit') return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

        // Delete key: clear selection or erase current tile
        if (e.code === 'Delete' || e.code === 'Backspace') {
            if (game.editor.selectionRect) {
                const sr = game.editor.selectionRect;
                const actions = [];
                for (let y = sr.y; y < sr.y + sr.h; y++) {
                    for (let x = sr.x; x < sr.x + sr.w; x++) {
                        const oldTile = game.stage.getTile(x, y);
                        if (oldTile !== TILE_TYPES.AIR) {
                            actions.push({ x, y, oldTile });
                            game.stage.setTile(x, y, TILE_TYPES.AIR);
                        }
                    }
                }
                if (actions.length > 0) {
                    game.editor.undoRedo.push({
                        type: 'fill',
                        actions: actions,
                        newTile: TILE_TYPES.AIR,
                    });
                    stageRenderer.clearCache();
                    showToast('選択範囲を削除しました', 'success');
                }
                game.editor.selectionRect = null;
            }
        }

        // Ctrl+C: copy selection
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyC') {
            if (game.editor.selectionRect) {
                const sr = game.editor.selectionRect;
                const clipboard = [];
                for (let y = 0; y < sr.h; y++) {
                    clipboard[y] = [];
                    for (let x = 0; x < sr.w; x++) {
                        clipboard[y][x] = game.stage.getTile(sr.x + x, sr.y + y);
                    }
                }
                game.editor.clipboardData = { data: clipboard, w: sr.w, h: sr.h };
                showToast('コピーしました', 'success');
            }
        }

        // Ctrl+V: paste at hover position
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyV') {
            if (game.editor.clipboardData) {
                const cb = game.editor.clipboardData;
                const startX = game.editor.hoverTX;
                const startY = game.editor.hoverTY;
                const actions = [];
                for (let y = 0; y < cb.h; y++) {
                    for (let x = 0; x < cb.w; x++) {
                        const tx = startX + x;
                        const ty = startY + y;
                        if (tx >= 0 && tx < game.stage.width && ty >= 0 && ty < game.stage.height) {
                            const oldTile = game.stage.getTile(tx, ty);
                            const newTile = cb.data[y][x];
                            if (oldTile !== newTile) {
                                actions.push({ x: tx, y: ty, oldTile });
                                game.stage.setTile(tx, ty, newTile);
                            }
                        }
                    }
                }
                if (actions.length > 0) {
                    game.editor.undoRedo.push({
                        type: 'fill',
                        actions: actions,
                        newTile: -1, // mixed
                    });
                    stageRenderer.clearCache();
                    showToast('ペーストしました', 'success');
                }
            }
        }

        // Ctrl+X: cut selection
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyX') {
            if (game.editor.selectionRect) {
                const sr = game.editor.selectionRect;
                const clipboard = [];
                const actions = [];
                for (let y = 0; y < sr.h; y++) {
                    clipboard[y] = [];
                    for (let x = 0; x < sr.w; x++) {
                        const tile = game.stage.getTile(sr.x + x, sr.y + y);
                        clipboard[y][x] = tile;
                        if (tile !== TILE_TYPES.AIR) {
                            actions.push({ x: sr.x + x, y: sr.y + y, oldTile: tile });
                            game.stage.setTile(sr.x + x, sr.y + y, TILE_TYPES.AIR);
                        }
                    }
                }
                game.editor.clipboardData = { data: clipboard, w: sr.w, h: sr.h };
                if (actions.length > 0) {
                    game.editor.undoRedo.push({
                        type: 'fill',
                        actions: actions,
                        newTile: TILE_TYPES.AIR,
                    });
                    stageRenderer.clearCache();
                }
                game.editor.selectionRect = null;
                showToast('カットしました', 'success');
            }
        }

        // Ctrl+A: select all
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyA') {
            e.preventDefault();
            game.editor.selectionRect = {
                x: 0,
                y: 0,
                w: game.stage.width,
                h: game.stage.height,
            };
            game.editor.activeTool = 'select';
            game.editor.setTool('select');
            showToast('全選択', 'success');
        }

        // Ctrl+E: export
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyE') {
            e.preventDefault();
            exportStageFile();
        }
    });
})();


// ============================================
// SECTION 24: DONUT BLOCK BEHAVIOR (PLAY)
// ============================================

class DonutBlockTracker {
    constructor() {
        this.activeBlocks = new Map(); // key "x,y" -> { timer, falling, vy, originalY }
    }

    clear() {
        this.activeBlocks.clear();
    }

    update(stage, player) {
        if (!player.alive || !player.onGround) return;

        // Check if player is standing on any donut blocks
        const footTX1 = Math.floor(player.x / TILE_SIZE);
        const footTX2 = Math.floor((player.x + player.w - 1) / TILE_SIZE);
        const footTY = Math.floor((player.y + player.h - 0.02) / TILE_SIZE);

        for (let tx = footTX1; tx <= footTX2; tx++) {
            const tile = stage.getTile(tx, footTY);
            if (tile === TILE_TYPES.DONUT_BLOCK) {
                const key = `${tx},${footTY}`;
                if (!this.activeBlocks.has(key)) {
                    this.activeBlocks.set(key, {
                        timer: 0,
                        falling: false,
                        vy: 0,
                        tx: tx,
                        ty: footTY,
                        originalY: footTY * TILE_SIZE,
                    });
                }
            }
        }

        // Update active donut blocks
        const toRemove = [];
        this.activeBlocks.forEach((block, key) => {
            block.timer++;

            // Shake phase (visual only, handled in renderer)
            if (block.timer > 30 && !block.falling) {
                // Start falling
                block.falling = true;
                stage.setTile(block.tx, block.ty, TILE_TYPES.AIR);
                stageRenderer.clearCache();
            }

            if (block.falling) {
                block.vy += GRAVITY;
                block.originalY += block.vy;
                if (block.originalY > stage.height * TILE_SIZE + 100) {
                    toRemove.push(key);
                }
            }
        });

        toRemove.forEach(key => this.activeBlocks.delete(key));
    }

    render(ctx, camera) {
        this.activeBlocks.forEach((block) => {
            if (!block.falling) {
                // Shake effect
                const shakeX = (Math.random() - 0.5) * Math.min(block.timer * 0.1, 3);
                const sx = (block.tx * TILE_SIZE - camera.x + shakeX) * camera.zoom;
                const sy = (block.ty * TILE_SIZE - camera.y) * camera.zoom;
                const ss = TILE_SIZE * camera.zoom;
                const tileCanvas = sprites.getCachedTile(TILE_TYPES.DONUT_BLOCK, game.stage.theme, 0);
                ctx.drawImage(tileCanvas, sx, sy, ss, ss);
            } else {
                // Falling donut
                const sx = (block.tx * TILE_SIZE - camera.x) * camera.zoom;
                const sy = (block.originalY - camera.y) * camera.zoom;
                const ss = TILE_SIZE * camera.zoom;
                const tileCanvas = sprites.getCachedTile(TILE_TYPES.DONUT_BLOCK, game.stage.theme, 0);
                ctx.globalAlpha = Math.max(0, 1 - (block.originalY - block.ty * TILE_SIZE) / 300);
                ctx.drawImage(tileCanvas, sx, sy, ss, ss);
                ctx.globalAlpha = 1;
            }
        });
    }
}

const donutTracker = new DonutBlockTracker();


// ============================================
// SECTION 25: FIRE BAR SYSTEM
// ============================================

class FireBarSystem {
    constructor() {
        this.bars = [];
    }

    clear() {
        this.bars = [];
    }

    initFromStage(stage) {
        this.bars = [];
        for (let y = 0; y < stage.height; y++) {
            for (let x = 0; x < stage.width; x++) {
                if (stage.getTile(x, y) === TILE_TYPES.FIRE_BAR) {
                    this.bars.push({
                        cx: x * TILE_SIZE + TILE_SIZE / 2,
                        cy: y * TILE_SIZE + TILE_SIZE / 2,
                        angle: Math.random() * Math.PI * 2,
                        speed: 0.03 + Math.random() * 0.02,
                        length: 4, // number of fire orbs
                        orbSpacing: 10,
                    });
                }
            }
        }
    }

    update(player) {
        this.bars.forEach(bar => {
            bar.angle += bar.speed;

            // Check collision with player
            if (!player.alive || player.invincibleTimer > 0 || player.starTimer > 0) return;

            for (let i = 1; i <= bar.length; i++) {
                const orbX = bar.cx + Math.cos(bar.angle) * i * bar.orbSpacing;
                const orbY = bar.cy + Math.sin(bar.angle) * i * bar.orbSpacing;
                const orbR = 5;

                // Simple circle-rect overlap
                const closestX = Math.max(player.x, Math.min(orbX, player.x + player.w));
                const closestY = Math.max(player.y, Math.min(orbY, player.y + player.h));
                const dx = orbX - closestX;
                const dy = orbY - closestY;
                if (dx * dx + dy * dy < orbR * orbR) {
                    player.takeDamage();
                    return;
                }
            }
        });
    }

    render(ctx, camera) {
        this.bars.forEach(bar => {
            const zoom = camera.zoom;
            const bcx = (bar.cx - camera.x) * zoom;
            const bcy = (bar.cy - camera.y) * zoom;

            // Center block
            ctx.fillStyle = '#888';
            const blockSize = 8 * zoom;
            ctx.fillRect(bcx - blockSize/2, bcy - blockSize/2, blockSize, blockSize);

            // Fire orbs
            for (let i = 1; i <= bar.length; i++) {
                const orbX = bcx + Math.cos(bar.angle) * i * bar.orbSpacing * zoom;
                const orbY = bcy + Math.sin(bar.angle) * i * bar.orbSpacing * zoom;
                const orbR = 5 * zoom;

                // Glow
                const glow = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, orbR * 2);
                glow.addColorStop(0, 'rgba(255,200,50,0.6)');
                glow.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbR * 2, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = '#FFE040';
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbR, 0, Math.PI * 2);
                ctx.fill();

                // Hot center
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(orbX, orbY, orbR * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }
}

class AutoTiler {
    // Determines if ground blocks should show a "top" variant
    static getGroundVariant(stage, tx, ty) {
        const tile = stage.getTile(tx, ty);
        if (tile !== TILE_TYPES.GROUND) return tile;

        const above = stage.getTile(tx, ty - 1);
        if (above === TILE_TYPES.AIR || above === TILE_TYPES.COIN ||
            ENTITY_TILES.has(above) || SEMI_SOLID_TILES.has(above)) {
            return TILE_TYPES.GROUND; // top surface (GROUND draws with grass)
        }
        return TILE_TYPES.GROUND; // underground (could return GROUND_BOTTOM)
    }

    // Auto-place pipe set (2x2)
    static placePipe(stage, tx, ty, editor) {
        const height = 2; // default pipe height
        for (let h = 0; h < height; h++) {
            const row = h === 0 ? 0 : 1;
            const tl = row === 0 ? TILE_TYPES.PIPE_TL : TILE_TYPES.PIPE_BL;
            const tr = row === 0 ? TILE_TYPES.PIPE_TR : TILE_TYPES.PIPE_BR;
            editor.placeTile(stage, tx, ty + h, tl);
            editor.placeTile(stage, tx + 1, ty + h, tr);
        }
    }
}


// ============================================
// SECTION 29: PERFORMANCE MONITOR
// ============================================

class PerfMonitor {
    constructor() {
        this.frameTimes = [];
        this.maxSamples = 60;
    }

    recordFrame(dt) {
        this.frameTimes.push(dt);
        if (this.frameTimes.length > this.maxSamples) {
            this.frameTimes.shift();
        }
    }

    getAverageFPS() {
        if (this.frameTimes.length === 0) return 60;
        const avg = this.frameTimes.reduce((a, b) => a + b, 0) / this.frameTimes.length;
        return Math.round(1000 / Math.max(avg, 1));
    }

    getMinFPS() {
        if (this.frameTimes.length === 0) return 60;
        const maxDt = Math.max(...this.frameTimes);
        return Math.round(1000 / Math.max(maxDt, 1));
    }
}

const perfMonitor = new PerfMonitor();

// Patch the game loop to track performance
const originalLoop = Game.prototype.loop;
Game.prototype.loop = function(timestamp) {
    if (!this.running) return;

    const dt = timestamp - this.lastFrameTime;
    this.deltaTime = dt;
    this.lastFrameTime = timestamp;
    perfMonitor.recordFrame(dt);

    if (dt > 50) this.deltaTime = 50;

    this.update();
    this.render();

    input.endFrame();
    input.pollGamepad();

    requestAnimationFrame((t) => this.loop(t));
};

class TooltipSystem {
    constructor() {
        this.element = document.createElement('div');
        this.element.className = 'tooltip';
        document.body.appendChild(this.element);
        this.visible = false;
        this.setupListeners();

        this.visible = false;
    }

// ============================================
// SECTION 31: SCREEN TRANSITION EFFECTS
// ============================================

class ScreenTransition {
    constructor() {
        this.active = false;
        this.type = 'fade'; // fade, circle, slide
        this.progress = 0;
        this.speed = 0.03;
        this.phase = 'out'; // out, hold, in
        this.holdTime = 0;
        this.maxHold = 30;
        this.callback = null;
    }

    start(type, callback) {
        this.active = true;
        this.type = type || 'fade';
        this.progress = 0;
        this.phase = 'out';
        this.holdTime = 0;
        this.callback = callback;
    }

    update() {
        if (!this.active) return;

        switch (this.phase) {
            case 'out':
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.progress = 1;
                    this.phase = 'hold';
                    this.holdTime = 0;
                    if (this.callback) this.callback();
                }
                break;
            case 'hold':
                this.holdTime++;
                if (this.holdTime >= this.maxHold) {
                    this.phase = 'in';
                }
                break;
            case 'in':
                this.progress -= this.speed;
                if (this.progress <= 0) {
                    this.progress = 0;
                    this.active = false;
                }
                break;
        }
    }

    render(ctx, w, h) {
        if (!this.active) return;

        switch (this.type) {
            case 'fade':
                ctx.fillStyle = `rgba(0,0,0,${this.progress})`;
                ctx.fillRect(0, 0, w, h);
                break;
            case 'circle':
                const maxR = Math.sqrt(w * w + h * h) / 2;
                const radius = maxR * (1 - this.progress);
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.rect(0, 0, w, h);
                ctx.arc(w / 2, h / 2, Math.max(0, radius), 0, Math.PI * 2, true);
                ctx.fill('evenodd');
                break;
            case 'slide':
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w * this.progress, h);
                break;
        }
    }
}
