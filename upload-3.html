        hillGrad.addColorStop(0, '#5DAA3A');
        hillGrad.addColorStop(1, '#3D8A2A');
        ctx.fillStyle = hillGrad;
        ctx.beginPath();
        ctx.arc(S/2, S, S*0.6, Math.PI, Math.PI*2);
        ctx.fill();

        // Detail spots
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.arc(S*0.4, S*0.7, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(S*0.6, S*0.75, 3, 0, Math.PI*2);
        ctx.fill();
    }

    drawDecoCloud(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.shadowColor = 'rgba(0,0,0,0.05)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetY = 2;

        ctx.beginPath();
        ctx.arc(S*0.3, S*0.55, 7, 0, Math.PI*2);
        ctx.arc(S/2, S*0.45, 9, 0, Math.PI*2);
        ctx.arc(S*0.7, S*0.55, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Cloud highlight
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(S*0.45, S*0.38, 4, 0, Math.PI*2);
        ctx.fill();
    }

    drawSemiSolid(ctx, S, part, T) {
        ctx.clearRect(0, 0, S, S);
        if (part === 'top') {
            // Decorative top platform
            const grad = ctx.createLinearGradient(0, 0, 0, S);
            grad.addColorStop(0, T.platformColor || '#A07848');
            grad.addColorStop(1, 'rgba(160,120,72,0.6)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, S, S);

            // Top edge
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(0, 0, S, 4);

            // Columns
            ctx.fillStyle = 'rgba(0,0,0,0.08)';
            ctx.fillRect(0, 4, 3, S-4);
            ctx.fillRect(S-3, 4, 3, S-4);
            ctx.fillRect(S/2-1, 4, 2, S-4);

            // Decorative pattern on top
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let x = 4; x < S-4; x += 8) {
                ctx.fillRect(x, 1, 4, 2);
            }
        } else {
            // Middle / support part
            ctx.fillStyle = 'rgba(160,120,72,0.4)';
            ctx.fillRect(0, 0, S, S);

            // Columns
            ctx.fillStyle = 'rgba(0,0,0,0.06)';
            ctx.fillRect(0, 0, 3, S);
            ctx.fillRect(S-3, 0, 3, S);
            ctx.fillRect(S/2-1, 0, 2, S);

            // Cross hatching
            ctx.strokeStyle = 'rgba(0,0,0,0.04)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(S, S);
            ctx.moveTo(S, 0); ctx.lineTo(0, S);
            ctx.stroke();
        }
    }

    drawArrowSign(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Pole
        ctx.fillStyle = '#8B6914';
        ctx.fillRect(S*0.45, S*0.5, S*0.1, S*0.45);

        // Sign board
        ctx.fillStyle = '#DAA520';
        ctx.fillRect(2, S*0.15, S-4, S*0.38);

        // Border
        ctx.strokeStyle = '#8B6914';
        ctx.lineWidth = 2;
        ctx.strokeRect(2, S*0.15, S-4, S*0.38);

        // Arrow
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(S*0.7, S*0.34);
        ctx.lineTo(S*0.85, S*0.34);
        ctx.lineTo(S*0.85, S*0.25);
        ctx.lineTo(S*0.95, S*0.37);
        ctx.lineTo(S*0.85, S*0.49);
        ctx.lineTo(S*0.85, S*0.4);
        ctx.lineTo(S*0.7, S*0.4);
        ctx.closePath();
        ctx.fill();
    }

    drawMovingPlatform(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Platform body
        const grad = ctx.createLinearGradient(0, 0, 0, S*0.5);
        grad.addColorStop(0, '#5588CC');
        grad.addColorStop(1, '#3366AA');
        ctx.fillStyle = grad;
        ctx.fillRect(0, S*0.25, S, S*0.5);

        // Top shine
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(0, S*0.25, S, 3);

        // Arrow indicators
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.moveTo(4, S*0.5);
        ctx.lineTo(10, S*0.4);
        ctx.lineTo(10, S*0.6);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(S-4, S*0.5);
        ctx.lineTo(S-10, S*0.4);
        ctx.lineTo(S-10, S*0.6);
        ctx.fill();

        // Bottom shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, S*0.72, S, 3);

        // Rivets
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.arc(6, S*0.5, 2, 0, Math.PI*2);
        ctx.arc(S-6, S*0.5, 2, 0, Math.PI*2);
        ctx.fill();
    }

    drawFallingPlatform(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Platform body (slightly reddish/brown = fragile)
        const grad = ctx.createLinearGradient(0, S*0.25, 0, S*0.75);
        grad.addColorStop(0, '#CC8855');
        grad.addColorStop(1, '#AA6633');
        ctx.fillStyle = grad;
        ctx.fillRect(0, S*0.25, S, S*0.5);

        // Crack lines to show fragility
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(S*0.3, S*0.3);
        ctx.lineTo(S*0.5, S*0.5);
        ctx.lineTo(S*0.4, S*0.65);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(S*0.7, S*0.35);
        ctx.lineTo(S*0.6, S*0.55);
        ctx.stroke();

        // Top shine
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, S*0.25, S, 2);

        // Warning dashes on side
        ctx.fillStyle = 'rgba(255,200,50,0.4)';
        ctx.fillRect(1, S*0.3, 3, 4);
        ctx.fillRect(1, S*0.45, 3, 4);
        ctx.fillRect(1, S*0.6, 3, 4);

        // Downward arrow hint
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.moveTo(S/2, S*0.65);
        ctx.lineTo(S/2-4, S*0.55);
        ctx.lineTo(S/2+4, S*0.55);
        ctx.fill();
    }

    drawOnOffBlock(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const isOn = variant % 2 === 0;

        // Block body
        const color = isOn ? '#4488FF' : '#FF4444';
        const darkColor = isOn ? '#2266CC' : '#CC2222';
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, color);
        grad.addColorStop(1, darkColor);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Border
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, S-2, S-2);

        // ON/OFF text
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${S*0.35}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(isOn ? 'ON' : 'OFF', S/2, S/2);

        // Corner highlights
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(2, 2, S-4, 3);
        ctx.fillRect(2, 2, 3, S-4);
    }

    drawOnOffSwitch(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const isOn = variant % 2 === 0;

        // Platform/base
        ctx.fillStyle = '#666';
        ctx.fillRect(4, S*0.6, S-8, S*0.35);

        // Switch body
        const switchColor = isOn ? '#4488FF' : '#FF4444';
        ctx.fillStyle = switchColor;
        ctx.beginPath();
        ctx.arc(S/2, S*0.45, S*0.3, 0, Math.PI*2);
        ctx.fill();

        // ! mark
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${S*0.4}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', S/2, S*0.42);

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(S*0.42, S*0.35, 5, 0, Math.PI*2);
        ctx.fill();

        // Base shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(4, S*0.9, S-8, 3);
    }

    drawNoteBlock(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);

        // Body (pinkish/light)
        const pulse = 0.9 + Math.sin(variant * 0.15) * 0.1;
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, `rgb(${Math.floor(240*pulse)},${Math.floor(210*pulse)},${Math.floor(170*pulse)})`);
        grad.addColorStop(1, `rgb(${Math.floor(200*pulse)},${Math.floor(170*pulse)},${Math.floor(130*pulse)})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Border
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, S-2, S-2);

        // Note symbol ♪
        ctx.fillStyle = 'rgba(80,60,40,0.6)';
        ctx.font = `${S*0.55}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♪', S/2, S/2);

        // Highlights
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(2, 2, S-4, 3);
        ctx.fillRect(2, 2, 3, S-4);
    }

    drawDonutBlock(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Donut shape (rounded block with center)
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#E8C878');
        grad.addColorStop(0.5, '#D4A850');
        grad.addColorStop(1, '#C09838');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Inner circle (slightly indented center)
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.beginPath();
        ctx.arc(S/2, S/2, S*0.2, 0, Math.PI*2);
        ctx.fill();

        // Decorative lines (donut segments)
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(S*0.3, S*0.3);
        ctx.moveTo(S, 0); ctx.lineTo(S*0.7, S*0.3);
        ctx.moveTo(0, S); ctx.lineTo(S*0.3, S*0.7);
        ctx.moveTo(S, S); ctx.lineTo(S*0.7, S*0.7);
        ctx.stroke();

        // Border highlights
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, 0, S, 2);
        ctx.fillRect(0, 0, 2, S);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(S-2, 0, 2, S);
        ctx.fillRect(0, S-2, S, 2);
    }

    drawInvisibleBlock(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Semi-transparent dashed outline (editor only view)
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(2, 2, S-4, S-4);
        ctx.setLineDash([]);

        // Question mark in center
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = `bold ${S*0.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', S/2, S/2);
    }

    drawMushroomPlatTop(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Mushroom cap (red with white spots)
        const capGrad = ctx.createRadialGradient(S/2, S*0.4, 2, S/2, S*0.4, S*0.5);
        capGrad.addColorStop(0, '#FF5544');
        capGrad.addColorStop(1, '#CC2211');
        ctx.fillStyle = capGrad;
        ctx.fillRect(0, S*0.2, S, S*0.5);

        // Rounded top edge
        ctx.beginPath();
        ctx.arc(S/2, S*0.2, S/2, Math.PI, Math.PI*2);
        ctx.fill();

        // White spots
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.3, S*0.3, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(S*0.65, S*0.25, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(S*0.5, S*0.45, 3.5, 0, Math.PI*2);
        ctx.fill();

        // Bottom edge
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, S*0.68, S, 3);

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(S*0.35, S*0.15, 5, 0, Math.PI*2);
        ctx.fill();
    }

    drawMushroomPlatStem(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Stem
        const stemGrad = ctx.createLinearGradient(S*0.3, 0, S*0.7, 0);
        stemGrad.addColorStop(0, '#E8D8C0');
        stemGrad.addColorStop(0.5, '#F5EDE0');
        stemGrad.addColorStop(1, '#E0D0B8');
        ctx.fillStyle = stemGrad;
        ctx.fillRect(S*0.3, 0, S*0.4, S);

        // Stem detail lines
        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(S*0.4, 0); ctx.lineTo(S*0.4, S);
        ctx.moveTo(S*0.55, 0); ctx.lineTo(S*0.55, S);
        ctx.stroke();

        // Left/right edge shadow
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.fillRect(S*0.3, 0, 2, S);
        ctx.fillRect(S*0.68, 0, 2, S);
    }

    drawCastleBlock(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#999');
        grad.addColorStop(1, '#666');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Brick pattern
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, S/2); ctx.lineTo(S, S/2);
        ctx.moveTo(S/2, 0); ctx.lineTo(S/2, S/2);
        ctx.moveTo(S/4, S/2); ctx.lineTo(S/4, S);
        ctx.moveTo(S*3/4, S/2); ctx.lineTo(S*3/4, S);
        ctx.stroke();

        // Subtle highlight
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(0, 0, S, 1);
        ctx.fillRect(0, 0, 1, S);
    }

    drawCastleWall(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        ctx.fillStyle = '#777';
        ctx.fillRect(0, 0, S, S);

        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        for (let i = 0; i < 10; i++) {
            ctx.fillRect((i*5+1)%S, (i*7+2)%S, 3, 2);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(0, 0, S, 1);
    }

    drawWing(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const flapAngle = Math.sin(variant * 0.2) * 0.3;

        ctx.save();
        ctx.translate(S/2, S/2);
        ctx.rotate(flapAngle);

        // Wing shape
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.quadraticCurveTo(-8, -10, -14, -6);
        ctx.quadraticCurveTo(-10, 0, 0, 4);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.quadraticCurveTo(8, -10, 14, -6);
        ctx.quadraticCurveTo(10, 0, 0, 4);
        ctx.fill();

        // Feather details
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(-4, 0); ctx.lineTo(-10, -4);
        ctx.moveTo(-2, -2); ctx.lineTo(-8, -6);
        ctx.moveTo(4, 0); ctx.lineTo(10, -4);
        ctx.moveTo(2, -2); ctx.lineTo(8, -6);
        ctx.stroke();

        ctx.restore();
    }

    drawMuncher(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const chomp = variant % 2;

        // Body (dark plant)
        ctx.fillStyle = '#1A1A1A';
        ctx.beginPath();
        ctx.arc(S/2, S*0.55, S*0.35, 0, Math.PI*2);
        ctx.fill();

        // Petals/teeth (dark purple-ish)
        ctx.fillStyle = '#2A2A3A';
        const petalCount = 6;
        for (let i = 0; i < petalCount; i++) {
            const angle = (i / petalCount) * Math.PI * 2 + (chomp ? 0.15 : 0);
            const px = S/2 + Math.cos(angle) * S * 0.32;
            const py = S*0.55 + Math.sin(angle) * S * 0.32;
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI*2);
            ctx.fill();
        }

        // Center (red/dark)
        ctx.fillStyle = '#442222';
        ctx.beginPath();
        ctx.arc(S/2, S*0.55, S*0.15, 0, Math.PI*2);
        ctx.fill();

        // Evil eyes
        ctx.fillStyle = '#FF4444';
        ctx.beginPath();
        ctx.arc(S*0.42, S*0.48, 2, 0, Math.PI*2);
        ctx.arc(S*0.58, S*0.48, 2, 0, Math.PI*2);
        ctx.fill();
    }

    // ====== PLAYER SPRITE RENDERING ======

    renderPlayer(ctx, x, y, w, h, state, facingRight, frame, powerState) {
        ctx.save();
        ctx.translate(x + w/2, y + h/2);
        if (!facingRight) ctx.scale(-1, 1);
        ctx.translate(-w/2, -h/2);

        const isBig = (powerState === 'big' || powerState === 'fire');
        const isFire = (powerState === 'fire');

        // Shadow under player
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(w/2, h + 2, w*0.4, 3, 0, 0, Math.PI*2);
        ctx.fill();

        if (isBig) {
            this.renderBigPlayer(ctx, w, h, state, frame, isFire);
        } else {
            this.renderSmallPlayer(ctx, w, h, state, frame);
        }

        ctx.restore();
    }

    renderSmallPlayer(ctx, w, h, state, frame) {
        // Hat
        const hatGrad = ctx.createLinearGradient(0, 0, w, 0);
        hatGrad.addColorStop(0, '#E83030');
        hatGrad.addColorStop(0.5, '#FF4040');
        hatGrad.addColorStop(1, '#D02828');
        ctx.fillStyle = hatGrad;
        ctx.beginPath();
        ctx.arc(w/2, h*0.22, w*0.42, Math.PI, Math.PI*2);
        ctx.fill();
        ctx.fillRect(w*0.08, h*0.15, w*0.84, h*0.12);

        // Hat brim
        ctx.fillStyle = '#CC2020';
        ctx.fillRect(w*0.5, h*0.08, w*0.45, h*0.1);

        // Face
        ctx.fillStyle = '#FFDAB9';
        ctx.beginPath();
        ctx.arc(w/2, h*0.38, w*0.35, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(w*0.55, h*0.34, 2, 2.5, 0, 0, Math.PI*2);
        ctx.fill();

        // Eye white highlight
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(w*0.56, h*0.32, 0.8, 0, Math.PI*2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#E8A080';
        ctx.beginPath();
        ctx.arc(w*0.62, h*0.4, 2.5, 0, Math.PI*2);
        ctx.fill();

        // Mustache
        ctx.fillStyle = '#4A2800';
        ctx.beginPath();
        ctx.ellipse(w*0.55, h*0.45, 6, 2, 0, 0, Math.PI);
        ctx.fill();

        // Body (overalls)
        ctx.fillStyle = '#4444DD';
        ctx.fillRect(w*0.15, h*0.52, w*0.7, h*0.3);

        // Shirt underneath (red)
        ctx.fillStyle = '#FF3333';
        ctx.fillRect(w*0.1, h*0.48, w*0.8, h*0.12);

        // Overall straps
        ctx.fillStyle = '#3333CC';
        ctx.fillRect(w*0.22, h*0.48, w*0.12, h*0.15);
        ctx.fillRect(w*0.66, h*0.48, w*0.12, h*0.15);

        // Buttons
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(w*0.28, h*0.58, 1.5, 0, Math.PI*2);
        ctx.arc(w*0.72, h*0.58, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Arms
        ctx.fillStyle = '#FF3333';
        if (state === 'jump') {
            // Arms up
            ctx.fillRect(w*-0.05, h*0.35, w*0.18, h*0.15);
            ctx.fillRect(w*0.87, h*0.35, w*0.18, h*0.15);
        } else {
            ctx.fillRect(w*-0.05, h*0.5, w*0.18, h*0.15);
            ctx.fillRect(w*0.87, h*0.5, w*0.18, h*0.15);
        }

        // Gloves
        ctx.fillStyle = '#fff';
        if (state === 'jump') {
            ctx.beginPath();
            ctx.arc(w*-0.02, h*0.35, 3.5, 0, Math.PI*2);
            ctx.arc(w*1.02, h*0.35, 3.5, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(w*-0.02, h*0.58, 3.5, 0, Math.PI*2);
            ctx.arc(w*1.02, h*0.58, 3.5, 0, Math.PI*2);
            ctx.fill();
        }

        // Legs / shoes
        ctx.fillStyle = '#4A2800';
        const legFrame = (state === 'walk') ? frame % 2 : 0;
        if (legFrame === 0) {
            ctx.fillRect(w*0.15, h*0.8, w*0.28, h*0.2);
            ctx.fillRect(w*0.57, h*0.8, w*0.28, h*0.2);
        } else {
            ctx.fillRect(w*0.08, h*0.78, w*0.28, h*0.22);
            ctx.fillRect(w*0.64, h*0.82, w*0.28, h*0.18);
        }

        // Shoe highlights
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(w*0.15, h*0.8, w*0.28, 2);
        ctx.fillRect(w*0.57, h*0.8, w*0.28, 2);
    }

    renderBigPlayer(ctx, w, h, state, frame, isFire) {
        const hatColor1 = isFire ? '#EEEEEE' : '#E83030';
        const hatColor2 = isFire ? '#DDDDDD' : '#FF4040';
        const hatColor3 = isFire ? '#CCCCCC' : '#D02828';
        const shirtColor = isFire ? '#FF3333' : '#FF3333';
        const overallColor = isFire ? '#FF3333' : '#4444DD';
        const overallDark = isFire ? '#DD2222' : '#3333CC';

        // Hat
        const hatGrad = ctx.createLinearGradient(0, 0, w, 0);
        hatGrad.addColorStop(0, hatColor3);
        hatGrad.addColorStop(0.5, hatColor2);
        hatGrad.addColorStop(1, hatColor3);
        ctx.fillStyle = hatGrad;
        ctx.beginPath();
        ctx.arc(w/2, h*0.12, w*0.42, Math.PI, Math.PI*2);
        ctx.fill();
        ctx.fillRect(w*0.08, h*0.08, w*0.84, h*0.07);

        // Hat brim
        ctx.fillStyle = hatColor3;
        ctx.fillRect(w*0.5, h*0.04, w*0.45, h*0.06);

        // "M" logo on hat
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${w*0.25}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('M', w*0.48, h*0.1);

        // Face
        ctx.fillStyle = '#FFDAB9';
        ctx.beginPath();
        ctx.arc(w/2, h*0.23, w*0.35, 0, Math.PI*2);
        ctx.fill();

        // Sideburn
        ctx.fillStyle = '#6A3400';
        ctx.beginPath();
        ctx.arc(w*0.2, h*0.25, 3, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(w*0.52, h*0.2, 3, 3.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#2266CC';
        ctx.beginPath();
        ctx.ellipse(w*0.54, h*0.2, 2, 2.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(w*0.55, h*0.2, 1.2, 1.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(w*0.53, h*0.18, 0.8, 0, Math.PI*2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#E8A080';
        ctx.beginPath();
        ctx.arc(w*0.62, h*0.26, 3, 0, Math.PI*2);
        ctx.fill();

        // Mustache
        ctx.fillStyle = '#4A2800';
        ctx.beginPath();
        ctx.ellipse(w*0.55, h*0.3, 8, 3, 0, 0, Math.PI);
        ctx.fill();

        // Ear
        ctx.fillStyle = '#FFDAB9';
        ctx.beginPath();
        ctx.arc(w*0.15, h*0.22, 3, 0, Math.PI*2);
        ctx.fill();

        // Body (shirt area)
        ctx.fillStyle = shirtColor;
        ctx.fillRect(w*0.1, h*0.33, w*0.8, h*0.12);

        // Overalls
        ctx.fillStyle = overallColor;
        ctx.fillRect(w*0.12, h*0.42, w*0.76, h*0.32);

        // Overall bib
        ctx.fillStyle = overallColor;
        ctx.fillRect(w*0.25, h*0.36, w*0.5, h*0.1);

        // Straps
        ctx.fillStyle = overallDark;
        ctx.fillRect(w*0.22, h*0.33, w*0.12, h*0.12);
        ctx.fillRect(w*0.66, h*0.33, w*0.12, h*0.12);

        // Buttons
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(w*0.28, h*0.42, 2, 0, Math.PI*2);
        ctx.arc(w*0.72, h*0.42, 2, 0, Math.PI*2);
        ctx.fill();

        // Arms
        ctx.fillStyle = shirtColor;
        if (state === 'jump') {
            ctx.save();
            ctx.translate(w*0.05, h*0.3);
            ctx.rotate(-0.6);
            ctx.fillRect(0, 0, w*0.18, h*0.18);
            ctx.restore();
            ctx.save();
            ctx.translate(w*0.85, h*0.28);
            ctx.rotate(0.6);
            ctx.fillRect(0, 0, w*0.18, h*0.18);
            ctx.restore();
        } else {
            ctx.fillRect(w*-0.05, h*0.36, w*0.18, h*0.18);
            ctx.fillRect(w*0.87, h*0.36, w*0.18, h*0.18);
        }

        // Gloves
        ctx.fillStyle = '#fff';
        if (state === 'jump') {
            ctx.beginPath();
            ctx.arc(w*-0.02, h*0.28, 4, 0, Math.PI*2);
            ctx.arc(w*1.02, h*0.28, 4, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(w*-0.02, h*0.48, 4, 0, Math.PI*2);
            ctx.arc(w*1.02, h*0.48, 4, 0, Math.PI*2);
            ctx.fill();
        }

        // Legs
        ctx.fillStyle = overallColor;
        const legFrame = (state === 'walk') ? frame % 2 : 0;
        if (state === 'jump') {
            // Legs spread
            ctx.save();
            ctx.translate(w*0.2, h*0.72);
            ctx.rotate(-0.2);
            ctx.fillRect(0, 0, w*0.22, h*0.18);
            ctx.restore();
            ctx.save();
            ctx.translate(w*0.6, h*0.72);
            ctx.rotate(0.2);
            ctx.fillRect(0, 0, w*0.22, h*0.18);
            ctx.restore();
        } else if (legFrame === 0) {
            ctx.fillRect(w*0.15, h*0.72, w*0.28, h*0.16);
            ctx.fillRect(w*0.57, h*0.72, w*0.28, h*0.16);
        } else {
            ctx.fillRect(w*0.08, h*0.7, w*0.28, h*0.18);
            ctx.fillRect(w*0.64, h*0.74, w*0.28, h*0.14);
        }

        // Shoes
        ctx.fillStyle = '#6A3400';
        if (state === 'jump') {
            ctx.beginPath();
            ctx.ellipse(w*0.18, h*0.92, 7, 5, -0.2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(w*0.82, h*0.92, 7, 5, 0.2, 0, Math.PI*2);
            ctx.fill();
        } else if (legFrame === 0) {
            ctx.fillRect(w*0.1, h*0.88, w*0.35, h*0.12);
            ctx.fillRect(w*0.52, h*0.88, w*0.35, h*0.12);
        } else {
            ctx.fillRect(w*0.02, h*0.86, w*0.35, h*0.14);
            ctx.fillRect(w*0.58, h*0.88, w*0.35, h*0.12);
        }

        // Shoe highlight
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        if (state !== 'jump') {
            ctx.fillRect(w*0.1, h*0.88, w*0.35, 2);
            ctx.fillRect(w*0.52, h*0.88, w*0.35, 2);
        }

        // Fire power extra: fireball glow on hand
        if (isFire && state === 'walk') {
            const fireGlow = ctx.createRadialGradient(w*1.05, h*0.48, 1, w*1.05, h*0.48, 6);
            fireGlow.addColorStop(0, 'rgba(255,200,50,0.6)');
            fireGlow.addColorStop(1, 'rgba(255,100,0,0)');
            ctx.fillStyle = fireGlow;
            ctx.beginPath();
            ctx.arc(w*1.05, h*0.48, 6, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

const sprites = new SpriteGenerator();


// ============================================
// SECTION 4: BACKGROUND RENDERER
// ============================================

class BackgroundRenderer {
    constructor() {
        this.parallaxLayers = [];
        this.stars = [];
        this.clouds = [];
        this.initClouds();
        this.initStars();
    }

    initClouds() {
        this.clouds = [];
        for (let i = 0; i < 12; i++) {
            this.clouds.push({
                x: Math.random() * 3000,
                y: 30 + Math.random() * 200,
                w: 60 + Math.random() * 120,
                h: 25 + Math.random() * 40,
                speed: 0.1 + Math.random() * 0.3,
                opacity: 0.3 + Math.random() * 0.5,
            });
        }
    }

    initStars() {
        this.stars = [];
        for (let i = 0; i < 80; i++) {
            this.stars.push({
                x: Math.random() * 3000,
                y: Math.random() * 600,
                size: 0.5 + Math.random() * 2,
                twinkle: Math.random() * Math.PI * 2,
                speed: 0.02 + Math.random() * 0.05,
            });
        }
    }

    render(ctx, camera, canvasWidth, canvasHeight, themeKey, time) {
        const T = THEMES[themeKey] || THEMES.OVERWORLD;

        // Sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
        T.bgGradient.forEach((color, i) => {
            skyGrad.addColorStop(i / (T.bgGradient.length - 1), color);
        });
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        // Stars (for night / underground / castle)
        if (themeKey === 'NIGHT' || themeKey === 'UNDERGROUND' || themeKey === 'CASTLE') {
            this.renderStars(ctx, camera, canvasWidth, canvasHeight, time);
        }

        // Sun or Moon
        if (themeKey === 'OVERWORLD' || themeKey === 'DESERT' || themeKey === 'SNOW') {
            this.renderSun(ctx, canvasWidth, time);
        } else if (themeKey === 'NIGHT') {
            this.renderMoon(ctx, canvasWidth, time);
        }

        // Clouds
        if (themeKey !== 'UNDERGROUND' && themeKey !== 'CASTLE') {
            this.renderClouds(ctx, camera, canvasWidth, canvasHeight, T, time);
        }

        // Distant hills (parallax)
        if (themeKey === 'OVERWORLD' || themeKey === 'NIGHT' || themeKey === 'SNOW' || themeKey === 'DESERT') {
            this.renderDistantHills(ctx, camera, canvasWidth, canvasHeight, T);
        }

        // Near hills (closer parallax)
        if (themeKey === 'OVERWORLD' || themeKey === 'NIGHT' || themeKey === 'SNOW') {
            this.renderNearHills(ctx, camera, canvasWidth, canvasHeight, T);
        }

        // Castle background elements
        if (themeKey === 'CASTLE') {
            this.renderCastleBg(ctx, camera, canvasWidth, canvasHeight, time);
        }

        // Underground background
        if (themeKey === 'UNDERGROUND') {
            this.renderUndergroundBg(ctx, camera, canvasWidth, canvasHeight);
        }
    }

    renderStars(ctx, camera, cw, ch, time) {
        this.stars.forEach(star => {
            const sx = ((star.x - camera.x * 0.05) % cw + cw) % cw;
            const sy = star.y;
            const twinkle = 0.5 + 0.5 * Math.sin(time * star.speed + star.twinkle);
            ctx.fillStyle = `rgba(255,255,255,${twinkle * 0.8})`;
            ctx.beginPath();
            ctx.arc(sx, sy, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    renderSun(ctx, cw, time) {
        const sx = cw * 0.8;
        const sy = 60;
        const pulse = 1 + Math.sin(time * 0.005) * 0.05;

        // Outer glow
        const sunGlow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 80);
        sunGlow.addColorStop(0, 'rgba(255,240,150,0.3)');
        sunGlow.addColorStop(1, 'rgba(255,240,150,0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sx, sy, 80 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Sun body
        const sunGrad = ctx.createRadialGradient(sx, sy, 5, sx, sy, 28);
        sunGrad.addColorStop(0, '#FFFDE8');
        sunGrad.addColorStop(0.7, '#FFE040');
        sunGrad.addColorStop(1, '#FFC800');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sx, sy, 28 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Rays
        ctx.strokeStyle = 'rgba(255,230,100,0.15)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2 + time * 0.002;
            const r1 = 32 * pulse;
            const r2 = 50 * pulse;
            ctx.beginPath();
            ctx.moveTo(sx + Math.cos(angle) * r1, sy + Math.sin(angle) * r1);
            ctx.lineTo(sx + Math.cos(angle) * r2, sy + Math.sin(angle) * r2);
            ctx.stroke();
        }
    }

    renderMoon(ctx, cw, time) {
        const mx = cw * 0.75;
        const my = 70;

        // Moon glow
        const moonGlow = ctx.createRadialGradient(mx, my, 15, mx, my, 60);
        moonGlow.addColorStop(0, 'rgba(200,210,255,0.15)');
        moonGlow.addColorStop(1, 'rgba(200,210,255,0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(mx, my, 60, 0, Math.PI*2);
        ctx.fill();

        // Moon body
        ctx.fillStyle = '#E8E8F0';
        ctx.beginPath();
        ctx.arc(mx, my, 22, 0, Math.PI*2);
        ctx.fill();

        // Crescent shadow (to make crescent moon)
        ctx.fillStyle = THEMES.NIGHT.skyColor;
        ctx.beginPath();
        ctx.arc(mx + 8, my - 3, 18, 0, Math.PI*2);
        ctx.fill();

        // Moon surface craters
        ctx.fillStyle = 'rgba(180,180,200,0.3)';
        ctx.beginPath();
        ctx.arc(mx - 5, my - 3, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(mx - 8, my + 5, 2, 0, Math.PI*2);
        ctx.fill();
    }

    renderClouds(ctx, camera, cw, ch, T, time) {
        this.clouds.forEach(cloud => {
            const cx = ((cloud.x - camera.x * 0.15) % (cw + cloud.w * 2) + (cw + cloud.w * 2)) % (cw + cloud.w * 2) - cloud.w;
            const cy = cloud.y;

            ctx.fillStyle = T.cloudColor || '#fff';
            ctx.globalAlpha = cloud.opacity;

            // Multi-circle cloud shape
            const numBumps = Math.floor(cloud.w / 30) + 2;
            ctx.beginPath();
            for (let i = 0; i < numBumps; i++) {
                const bx = cx + (i / (numBumps - 1)) * cloud.w;
                const by = cy + Math.sin(i * 0.7) * cloud.h * 0.2;
                const br = cloud.h * 0.5 + Math.sin(i * 1.3) * cloud.h * 0.2;
                ctx.moveTo(bx + br, by);
                ctx.arc(bx, by, br, 0, Math.PI * 2);
            }
            ctx.fill();

            // Cloud bottom fill
            ctx.fillRect(cx, cy, cloud.w, cloud.h * 0.3);

            ctx.globalAlpha = 1;
        });
    }

    renderDistantHills(ctx, camera, cw, ch, T) {
        const parallax = 0.1;
        const offsetX = -(camera.x * parallax) % cw;
        const hillY = ch * 0.65;

        ctx.fillStyle = T.hillColor || '#4A8C2E';
        ctx.globalAlpha = 0.4;

        ctx.beginPath();
        ctx.moveTo(offsetX - 100, ch);
        for (let x = -100; x <= cw + 200; x += 5) {
            const worldX = x - offsetX;
            const y = hillY + Math.sin(worldX * 0.003) * 60 + Math.sin(worldX * 0.007) * 30;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(cw + 200, ch);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    renderNearHills(ctx, camera, cw, ch, T) {
        const parallax = 0.25;
        const offsetX = -(camera.x * parallax) % cw;
        const hillY = ch * 0.75;

        ctx.fillStyle = T.hillColor || '#4A8C2E';
        ctx.globalAlpha = 0.25;

        ctx.beginPath();
        ctx.moveTo(offsetX - 100, ch);
        for (let x = -100; x <= cw + 200; x += 5) {
            const worldX = x - offsetX;
            const y = hillY + Math.sin(worldX * 0.005 + 1) * 40 + Math.sin(worldX * 0.012 + 2) * 20;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(cw + 200, ch);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    renderCastleBg(ctx, camera, cw, ch, time) {
        const parallax = 0.08;
        const offsetX = -(camera.x * parallax);

        // Chains hanging from ceiling
        ctx.strokeStyle = 'rgba(100,100,100,0.3)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
            const cx = ((i * 180 + offsetX) % (cw + 200)) - 50;
            const chainLen = 60 + Math.sin(i * 2.3) * 30;
            ctx.beginPath();
            ctx.moveTo(cx, 0);
            for (let y = 0; y < chainLen; y += 8) {
                ctx.lineTo(cx + (y % 16 < 8 ? 3 : -3), y);
            }
            ctx.stroke();
        }

        // Lava glow at bottom
        const lavaGlow = ctx.createLinearGradient(0, ch - 100, 0, ch);
        lavaGlow.addColorStop(0, 'rgba(255,60,0,0)');
        lavaGlow.addColorStop(0.5, 'rgba(255,60,0,0.05)');
        lavaGlow.addColorStop(1, 'rgba(255,60,0,0.15)');
        ctx.fillStyle = lavaGlow;
        ctx.fillRect(0, ch - 100, cw, 100);

        // Torch-like light sources
        for (let i = 0; i < 5; i++) {
            const tx = ((i * 250 + offsetX * 1.5) % (cw + 300)) - 50;
            const ty = 80 + Math.sin(i * 1.7) * 30;
            const flicker = 0.8 + Math.sin(time * 0.03 + i * 2) * 0.2;

            const torchGlow = ctx.createRadialGradient(tx, ty, 2, tx, ty, 40 * flicker);
            torchGlow.addColorStop(0, `rgba(255,180,50,${0.15 * flicker})`);
            torchGlow.addColorStop(1, 'rgba(255,180,50,0)');
            ctx.fillStyle = torchGlow;
            ctx.beginPath();
            ctx.arc(tx, ty, 40 * flicker, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    renderUndergroundBg(ctx, camera, cw, ch) {
        const parallax = 0.06;
        const offsetX = -(camera.x * parallax);

        // Subtle brick wall pattern in background
        ctx.fillStyle = 'rgba(40,40,70,0.3)';
        const brickW = 32;
        const brickH = 16;
        for (let y = 0; y < ch; y += brickH) {
            const rowOff = (Math.floor(y / brickH) % 2) * (brickW / 2);
            for (let x = -brickW; x < cw + brickW; x += brickW) {
                const bx = ((x + rowOff + offsetX) % (cw + brickW * 2)) - brickW;
                ctx.strokeStyle = 'rgba(60,60,100,0.15)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(bx, y, brickW, brickH);
            }
        }

        // Dripping water effects
        ctx.fillStyle = 'rgba(100,150,255,0.15)';
        for (let i = 0; i < 6; i++) {
            const dx = ((i * 200 + 50 + offsetX * 2) % (cw + 100)) - 50;
            const dripY = (Date.now() * 0.02 + i * 100) % ch;
            ctx.beginPath();
            ctx.ellipse(dx, dripY, 1.5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

class Particle {
    constructor(x, y, vx, vy, life, color, size, type = 'square') {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.size = size;
        this.type = type;
        this.gravity = 0.15;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
        this.fadeStart = 0.3; // Start fading at 30% life remaining
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.life--;
        this.rotation += this.rotSpeed;
        this.vx *= 0.99;
        return this.life > 0;
    }

    render(ctx, camera) {
        const sx = this.x - camera.x;
        const sy = this.y - camera.y;
        const alpha = Math.min(1, this.life / (this.maxLife * this.fadeStart));

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(sx, sy);
        ctx.rotate(this.rotation);

        ctx.fillStyle = this.color;

        switch (this.type) {
            case 'square':
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                break;
            case 'circle':
                ctx.beginPath();
                ctx.arc(0, 0, this.size/2, 0, Math.PI*2);
                ctx.fill();
                break;
            case 'star':
                ctx.beginPath();
                sprites.drawStarShape(ctx, 0, 0, this.size, this.size*0.4, 5);
                ctx.fill();
                break;
            case 'text':
                ctx.font = `bold ${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text || '', 0, 0);
                break;
        }

        ctx.restore();
    }
}

class ParticleSystem {

    update() {

class StageData {
    constructor(width = 200, height = 27) {
        this.name = 'My Stage';
        this.width = width;
        this.height = height;
        this.theme = 'OVERWORLD';
        this.timeLimit = 300;
        this.tiles = [];
        this.entityData = [];
        this.metadata = {};
        this.initTiles();
    }

    initTiles() {
        this.tiles = new Array(this.height);
        for (let y = 0; y < this.height; y++) {
            this.tiles[y] = new Uint8Array(this.width);
        }
    }

    getTile(x, y) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height) return TILE_TYPES.AIR;
        return this.tiles[y][x];
    }

    setTile(x, y, type) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height) return;
        this.tiles[y][x] = type;
    }

    resize(newWidth, newHeight) {
        const oldTiles = this.tiles;
        const oldW = this.width;
        const oldH = this.height;
        this.width = newWidth;
        this.height = newHeight;
        this.initTiles();
        const copyW = Math.min(oldW, newWidth);
        const copyH = Math.min(oldH, newHeight);
        for (let y = 0; y < copyH; y++) {
            for (let x = 0; x < copyW; x++) {
                this.tiles[y][x] = oldTiles[y][x];
            }
        }
    }

    countTiles() {
        let count = 0;
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                if (this.tiles[y][x] !== TILE_TYPES.AIR) count++;
            }
        }
        return count;
    }

    findPlayerSpawn() {
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                if (this.tiles[y][x] === TILE_TYPES.PLAYER_SPAWN) {
                    return { x: x * TILE_SIZE, y: y * TILE_SIZE };
                }
            }
        }
        return { x: 3 * TILE_SIZE, y: (this.height - 4) * TILE_SIZE };
    }

    findGoalPositions() {
        const goals = [];
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                if (this.tiles[y][x] === TILE_TYPES.GOAL) {
                    goals.push({ x: x * TILE_SIZE, y: y * TILE_SIZE });
                }
            }
        }
        return goals;
    }

    serialize() {
        const data = {
            name: this.name,
            width: this.width,
            height: this.height,
            theme: this.theme,
            timeLimit: this.timeLimit,
            tiles: [],
            entityData: this.entityData,
            metadata: this.metadata,
            version: 1,
        };
        for (let y = 0; y < this.height; y++) {
            data.tiles.push(Array.from(this.tiles[y]));
        }
        return JSON.stringify(data);
    }

    static deserialize(json) {
        try {
            const data = JSON.parse(json);
            const stage = new StageData(data.width, data.height);
            stage.name = data.name || 'Untitled';
            stage.theme = data.theme || 'OVERWORLD';
            stage.timeLimit = data.timeLimit || 300;
            stage.entityData = data.entityData || [];
            stage.metadata = data.metadata || {};
            for (let y = 0; y < data.height && y < data.tiles.length; y++) {
                for (let x = 0; x < data.width && x < data.tiles[y].length; x++) {
                    stage.tiles[y][x] = data.tiles[y][x];
                }
            }
            return stage;
        } catch(e) {
            console.error('Failed to deserialize stage:', e);
            return null;
        }
    }

    clone() {
        const copy = new StageData(this.width, this.height);
        copy.name = this.name;
        copy.theme = this.theme;
        copy.timeLimit = this.timeLimit;
        copy.entityData = JSON.parse(JSON.stringify(this.entityData));
        copy.metadata = JSON.parse(JSON.stringify(this.metadata));
        for (let y = 0; y < this.height; y++) {
            copy.tiles[y] = new Uint8Array(this.tiles[y]);
        }
        return copy;
    }

    generateDefault() {
        // Ground floor
        for (let x = 0; x < this.width; x++) {
            for (let y = this.height - 2; y < this.height; y++) {
                this.tiles[y][x] = TILE_TYPES.GROUND;
            }
            // Top layer of ground
            this.tiles[this.height - 3][x] = TILE_TYPES.GROUND;
        }

        // Player spawn
        this.tiles[this.height - 4][2] = TILE_TYPES.PLAYER_SPAWN;

        // Some basic decorations
        this.tiles[this.height - 4][8] = TILE_TYPES.QUESTION;
        this.tiles[this.height - 4][10] = TILE_TYPES.QUESTION;
        this.tiles[this.height - 4][12] = TILE_TYPES.QUESTION;

        // A few bricks
        this.tiles[this.height - 7][15] = TILE_TYPES.BRICK;
        this.tiles[this.height - 7][16] = TILE_TYPES.BRICK;
        this.tiles[this.height - 7][17] = TILE_TYPES.BRICK;
        this.tiles[this.height - 7][18] = TILE_TYPES.BRICK;
        this.tiles[this.height - 7][19] = TILE_TYPES.BRICK;

        // Some coins
        this.tiles[this.height - 8][16] = TILE_TYPES.COIN;
        this.tiles[this.height - 8][17] = TILE_TYPES.COIN;
        this.tiles[this.height - 8][18] = TILE_TYPES.COIN;

        // A pipe
        this.tiles[this.height - 5][25] = TILE_TYPES.PIPE_TL;
        this.tiles[this.height - 5][26] = TILE_TYPES.PIPE_TR;
        this.tiles[this.height - 4][25] = TILE_TYPES.PIPE_BL;
        this.tiles[this.height - 4][26] = TILE_TYPES.PIPE_BR;

        // An enemy
        this.tiles[this.height - 4][20] = TILE_TYPES.GOOMBA;
        this.tiles[this.height - 4][30] = TILE_TYPES.KOOPA;

        // Gap in the ground
        for (let y = this.height - 3; y < this.height; y++) {
            this.tiles[y][35] = TILE_TYPES.AIR;
            this.tiles[y][36] = TILE_TYPES.AIR;
            this.tiles[y][37] = TILE_TYPES.AIR;
        }

        // More platforms after gap
        this.tiles[this.height - 6][40] = TILE_TYPES.PLATFORM_WOOD;
        this.tiles[this.height - 6][41] = TILE_TYPES.PLATFORM_WOOD;
        this.tiles[this.height - 6][42] = TILE_TYPES.PLATFORM_WOOD;

        // Goal at end area
        this.tiles[this.height - 4][55] = TILE_TYPES.GOAL;

        // Some decorations
        this.tiles[this.height - 4][5] = TILE_TYPES.DECO_BUSH1;
        this.tiles[this.height - 4][45] = TILE_TYPES.DECO_FLOWER;

        // Spring
        this.tiles[this.height - 4][48] = TILE_TYPES.SPRING;

        // Mushroom in a ? block
        this.tiles[this.height - 7][9] = TILE_TYPES.QUESTION;
    }
}


// ============================================
// SECTION 7: UNDO/REDO SYSTEM
// ============================================

class UndoRedoManager {
    constructor(maxHistory = 100) {
        this.undoStack = [];
        this.redoStack = [];
        this.maxHistory = maxHistory;
    }

    push(action) {
        this.undoStack.push(action);
        this.redoStack = [];
        if (this.undoStack.length > this.maxHistory) {
            this.undoStack.shift();
        }
    }

    undo() {
        if (this.undoStack.length === 0) return null;
        const action = this.undoStack.pop();
        this.redoStack.push(action);
        return action;
    }

    redo() {
        if (this.redoStack.length === 0) return null;
        const action = this.redoStack.pop();
        this.undoStack.push(action);
        return action;
    }

    canUndo() { return this.undoStack.length > 0; }
    canRedo() { return this.redoStack.length > 0; }

    clear() {
        this.undoStack = [];
        this.redoStack = [];
    }
}


// ============================================
// SECTION 8: CAMERA SYSTEM
// ============================================

class Camera {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.targetX = 0;
        this.targetY = 0;
        this.zoom = 1.0;
        this.targetZoom = 1.0;
        this.minZoom = 0.25;
        this.maxZoom = 3.0;
        this.smoothing = CAMERA_SMOOTH;
        this.shakeAmount = 0;
        this.shakeDecay = 0.9;
        this.shakeX = 0;
        this.shakeY = 0;
        this.width = 0;
        this.height = 0;
        this.worldWidth = 0;
        this.worldHeight = 0;
        this.editorMode = true;
        // Editor panning
        this.panStartX = 0;
        this.panStartY = 0;
        this.isPanning = false;
    }

    setViewport(w, h) {
        this.width = w;
        this.height = h;
    }

    setWorldSize(w, h) {
        this.worldWidth = w;
        this.worldHeight = h;
    }

    update() {
        if (this.editorMode) {
            // Smooth approach in editor mode
            this.x += (this.targetX - this.x) * 0.15;
            this.y += (this.targetY - this.y) * 0.15;
            this.zoom += (this.targetZoom - this.zoom) * 0.15;
        } else {
            // Smoother following in play mode
            this.x += (this.targetX - this.x) * this.smoothing;
            this.y += (this.targetY - this.y) * this.smoothing;
            this.zoom += (this.targetZoom - this.zoom) * 0.1;
        }

        // Clamp
        const viewW = this.width / this.zoom;
        const viewH = this.height / this.zoom;

        if (!this.editorMode) {
            this.x = Math.max(0, Math.min(this.worldWidth - viewW, this.x));
            this.y = Math.max(0, Math.min(this.worldHeight - viewH, this.y));
        }

        // Shake
        if (this.shakeAmount > 0.5) {
            this.shakeX = (Math.random() - 0.5) * this.shakeAmount;
            this.shakeY = (Math.random() - 0.5) * this.shakeAmount;
            this.shakeAmount *= this.shakeDecay;
        } else {
            this.shakeX = 0;
            this.shakeY = 0;
            this.shakeAmount = 0;
        }
    }

    followPlayer(playerX, playerY, playerW, playerH) {
        const viewW = this.width / this.zoom;
        const viewH = this.height / this.zoom;
        this.targetX = playerX + playerW / 2 - viewW / 2;
        // 横は従来どおり。縦は「画面端に近づいたときだけ」スクロール（常時キャラ中心に寄せない）
        const pcy = playerY + playerH / 2;
        const marginTop = viewH * 0.2;
        const marginBottom = viewH * 0.32;
        const top = this.targetY;
        const bottom = this.targetY + viewH;
        if (pcy < top + marginTop) {
            this.targetY -= (top + marginTop - pcy);
        } else if (pcy > bottom - marginBottom) {
            this.targetY += (pcy - (bottom - marginBottom));
        }
    }

    /** プレイ開始・リスポーン時: プレイヤーが画面内に確実に入るよう一度だけ合わせる */
    snapToPlayerPlayStart(playerX, playerY, playerW, playerH) {
        const viewW = this.width / this.zoom;
        const viewH = this.height / this.zoom;
        const pcy = playerY + playerH / 2;
        this.targetX = playerX + playerW / 2 - viewW / 2;
        this.targetY = Math.max(0, Math.min(this.worldHeight - viewH, pcy - viewH * 0.42));
        this.x = this.targetX;
        this.y = this.targetY;
    }

    screenToWorld(sx, sy) {
        return {
            x: sx / this.zoom + this.x + this.shakeX,
            y: sy / this.zoom + this.y + this.shakeY,
        };
    }

    worldToScreen(wx, wy) {
        return {
            x: (wx - this.x - this.shakeX) * this.zoom,
            y: (wy - this.y - this.shakeY) * this.zoom,
        };
    }

    shake(amount) {
        this.shakeAmount = Math.max(this.shakeAmount, amount);
    }

    zoomIn() {
        this.targetZoom = Math.min(this.maxZoom, this.targetZoom * 1.05);
    }

    zoomOut() {
        this.targetZoom = Math.max(this.minZoom, this.targetZoom / 1.05);
    }

    fitToStage(stageWidth, stageHeight) {
        const zx = this.width / (stageWidth * TILE_SIZE);
        const zy = this.height / (stageHeight * TILE_SIZE);
        this.targetZoom = Math.min(zx, zy) * 0.95;
        this.targetX = (stageWidth * TILE_SIZE - this.width / this.targetZoom) / 2;
        this.targetY = (stageHeight * TILE_SIZE - this.height / this.targetZoom) / 2;
    }

    getZoomPercent() {
        return Math.round(this.zoom * 100);
    }
}


// ============================================
// SECTION 9: INPUT MANAGER
// ============================================

class InputManager {
    constructor() {
        this.keys = {};
        this.keysJustPressed = {};
        this.mouse = { x: 0, y: 0, down: false, button: 0, wheel: 0, justDown: false, justUp: false };
        this.prevMouse = { x: 0, y: 0, down: false };
        this.touches = [];
        this.gamepad = null;
        this.setupListeners();
    }

    setupListeners() {
        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
            if (!this.keys[e.code]) {
                this.keysJustPressed[e.code] = true;
            }
            this.keys[e.code] = true;

            // Prevent default for game keys
            const preventDefaults = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'];
            if (preventDefaults.includes(e.code)) {
                e.preventDefault();
            }

            // Ctrl+S save, Ctrl+Z undo, Ctrl+Y redo
            if (e.ctrlKey || e.metaKey) {
                if (e.code === 'KeyS') { e.preventDefault(); }
                if (e.code === 'KeyZ') { e.preventDefault(); }
                if (e.code === 'KeyY') { e.preventDefault(); }
            }
        });

        window.addEventListener('keyup', (e) => {
            this.keys[e.code] = false;
        });

        // Mouse
        const canvas = document.getElementById('mainCanvas');

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            this.mouse.down = true;
            this.mouse.justDown = true;
            this.mouse.button = e.button;
            this.updateMousePos(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            this.updateMousePos(e);
        });

        canvas.addEventListener('mouseup', (e) => {
            this.mouse.down = false;
            this.mouse.justUp = true;
            this.updateMousePos(e);
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            this.mouse.wheel = e.deltaY;
        }, { passive: false });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.handleTouchStart(e);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            this.handleTouchMove(e);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            this.handleTouchEnd(e);
        }, { passive: false });

        // Focus lost -> clear keys
        window.addEventListener('blur', () => {
            this.keys = {};
            this.mouse.down = false;
        });
    }

    updateMousePos(e) {
        const rect = document.getElementById('mainCanvas').getBoundingClientRect();
        this.mouse.x = e.clientX - rect.left;
        this.mouse.y = e.clientY - rect.top;
    }

    handleTouchStart(e) {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
            const t = touches[i];
            const rect = document.getElementById('mainCanvas').getBoundingClientRect();
            this.touches.push({
                id: t.identifier,
                x: t.clientX - rect.left,
                y: t.clientY - rect.top,
                startX: t.clientX - rect.left,
                startY: t.clientY - rect.top,
            });
        }
        if (this.touches.length === 1) {
            this.mouse.x = this.touches[0].x;
            this.mouse.y = this.touches[0].y;
            this.mouse.down = true;
            this.mouse.justDown = true;
            this.mouse.button = 0;
        }
    }

    handleTouchMove(e) {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
            const t = touches[i];
            const rect = document.getElementById('mainCanvas').getBoundingClientRect();
            const existing = this.touches.find(tt => tt.id === t.identifier);
            if (existing) {
                existing.x = t.clientX - rect.left;
                existing.y = t.clientY - rect.top;
            }
        }
        if (this.touches.length === 1) {
            this.mouse.x = this.touches[0].x;
            this.mouse.y = this.touches[0].y;
        }
        // Pinch to zoom with two fingers
        if (this.touches.length === 2) {
            const dx = this.touches[0].x - this.touches[1].x;
            const dy = this.touches[0].y - this.touches[1].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (this._lastPinchDist) {
                const delta = dist - this._lastPinchDist;
                this.mouse.wheel = -delta * 3;
            }
            this._lastPinchDist = dist;
        }
    }

    handleTouchEnd(e) {
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
            const t = touches[i];
            this.touches = this.touches.filter(tt => tt.id !== t.identifier);
        }
        if (this.touches.length === 0) {
            this.mouse.down = false;
            this.mouse.justUp = true;
            this._lastPinchDist = null;
        }
        if (this.touches.length < 2) {
            this._lastPinchDist = null;
        }
    }

    isKeyDown(code) {
        return !!this.keys[code];
    }

    isKeyJustPressed(code) {
        return !!this.keysJustPressed[code];
    }

    // Call at end of each frame
    endFrame() {
        this.keysJustPressed = {};
        this.mouse.justDown = false;
        this.mouse.justUp = false;
        this.mouse.wheel = 0;
        this.prevMouse.x = this.mouse.x;
        this.prevMouse.y = this.mouse.y;
        this.prevMouse.down = this.mouse.down;
    }

    // Gamepad polling
    pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        this.gamepad = gamepads[0] || null;
    }

    getGamepadAxis(index) {
        if (!this.gamepad) return 0;
        const val = this.gamepad.axes[index] || 0;
        return Math.abs(val) > 0.15 ? val : 0; // deadzone
    }

    isGamepadButtonDown(index) {
        if (!this.gamepad) return false;
        return this.gamepad.buttons[index] && this.gamepad.buttons[index].pressed;
    }

    // Helper: check if any "left" input
    isLeft() {
        return this.isKeyDown('ArrowLeft') || this.isKeyDown('KeyA') || this.getGamepadAxis(0) < -0.3;
    }
    isRight() {
        return this.isKeyDown('ArrowRight') || this.isKeyDown('KeyD') || this.getGamepadAxis(0) > 0.3;
    }
    isUp() {
        return this.isKeyDown('ArrowUp') || this.isKeyDown('KeyW') || this.getGamepadAxis(1) < -0.3;
    }
    isDown() {
        return this.isKeyDown('ArrowDown') || this.isKeyDown('KeyS') || this.getGamepadAxis(1) > 0.3;
    }
    isJump() {
        return this.isKeyDown('Space') || this.isKeyDown('ArrowUp') || this.isKeyDown('KeyW') || this.isGamepadButtonDown(0);
    }
    isJumpJustPressed() {
        return this.isKeyJustPressed('Space') || this.isKeyJustPressed('ArrowUp') || this.isKeyJustPressed('KeyW');
    }
    isRun() {
        return this.isKeyDown('ShiftLeft') || this.isKeyDown('ShiftRight') || this.isKeyDown('KeyX') || this.isGamepadButtonDown(2);
    }
    isFireJustPressed() {
        return this.isKeyJustPressed('KeyZ') || this.isKeyJustPressed('KeyX');
    }
}

const input = new InputManager();


// ============================================
// SECTION 10: PHYSICS HELPERS
// ============================================

class PhysicsHelper {
    static isSolid(tileType) {
        return SOLID_TILES.has(tileType);
    }

    /** ON/OFFブロックが「オフ」のときはすり抜ける */
    static blocksAsSolid(stage, tx, ty, tileType) {
        if (tileType === TILE_TYPES.ON_OFF_BLOCK && stage.metadata && stage.metadata.onOffState === false) {
            return false;
        }
        return this.isSolid(tileType);
    }

    static isSemiSolid(tileType) {
        return SEMI_SOLID_TILES.has(tileType);
    }

    static isHazard(tileType) {
        return HAZARD_TILES.has(tileType);
    }

    static isClimbable(tileType) {
        return tileType === TILE_TYPES.VINE || tileType === TILE_TYPES.LADDER;
    }

    static isWater(tileType) {
        return tileType === TILE_TYPES.WATER || tileType === TILE_TYPES.WATER_TOP;
    }

    static isLava(tileType) {
        return tileType === TILE_TYPES.LAVA || tileType === TILE_TYPES.LAVA_TOP;
    }

    static isConveyor(tileType) {
        return tileType === TILE_TYPES.CONVEYOR_LEFT || tileType === TILE_TYPES.CONVEYOR_RIGHT;
    }

    static isSlope(tileType) {
        return tileType === TILE_TYPES.SLOPE_LEFT || tileType === TILE_TYPES.SLOPE_RIGHT;
    }

    static getSlopeHeight(tileType, localX) {
        const norm = localX / TILE_SIZE;
        if (tileType === TILE_TYPES.SLOPE_LEFT) {
            return TILE_SIZE * norm; // left is low, right is high
        } else if (tileType === TILE_TYPES.SLOPE_RIGHT) {
            return TILE_SIZE * (1 - norm); // right is low, left is high
        }
        return 0;
    }

    // AABB collision detection
    static aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    // Tile collision for a rectangular entity
    static getTileCollisions(stage, x, y, w, h) {
        const results = [];
        const startTX = Math.floor(x / TILE_SIZE);
        const endTX = Math.floor((x + w - 1) / TILE_SIZE);
        const startTY = Math.floor(y / TILE_SIZE);
        const endTY = Math.floor((y + h - 1) / TILE_SIZE);

        for (let ty = startTY; ty <= endTY; ty++) {
            for (let tx = startTX; tx <= endTX; tx++) {
                const tile = stage.getTile(tx, ty);
                if (tile !== TILE_TYPES.AIR) {
                    results.push({ x: tx, y: ty, type: tile });
                }
            }
        }
        return results;
    }

    // Move entity with tile collision
    static moveWithCollision(stage, entity, dx, dy) {
        let resultX = entity.x;
        let resultY = entity.y;
        let hitWallX = false;
        let hitCeiling = false;
        let onGround = false;
        let groundTileType = TILE_TYPES.AIR;

        // Move X
        resultX += dx;
        const xCollisions = this.getTileCollisions(stage, resultX, entity.y, entity.w, entity.h);
        for (const col of xCollisions) {
            if (this.blocksAsSolid(stage, col.x, col.y, col.type)) {
                const tileLeft = col.x * TILE_SIZE;
                const tileRight = tileLeft + TILE_SIZE;
                if (dx > 0) {
                    resultX = tileLeft - entity.w;
                    hitWallX = true;
                } else if (dx < 0) {
                    resultX = tileRight;
                    hitWallX = true;
                }
            }
        }

        // Move Y（複数タイルと重なるとき、最後の1枚だけ採用すると接地がフレームごとに入れ替わりバウンドしやすい）
        resultY += dy;
        const yCollisions = this.getTileCollisions(stage, resultX, resultY, entity.w, entity.h);
        const prevBottom = entity.y + entity.h;

        if (dy > 0) {
            let minPlayerY = Infinity;
            let bestGroundType = TILE_TYPES.AIR;
            for (const col of yCollisions) {
                const tileTop = col.y * TILE_SIZE;
                const tileBottom = tileTop + TILE_SIZE;

                if (this.blocksAsSolid(stage, col.x, col.y, col.type)) {
                    const candY = tileTop - entity.h;
                    if (candY < minPlayerY) {
                        minPlayerY = candY;
                        bestGroundType = col.type;
                    }
                } else if (this.isSemiSolid(col.type)) {
                    if (prevBottom <= tileTop + 8) {
                        const candY = tileTop - entity.h;
                        if (candY < minPlayerY) {
                            minPlayerY = candY;
                            bestGroundType = col.type;
                        }
                    }
                } else if (this.isSlope(col.type)) {
                    const localX = (resultX + entity.w / 2) - col.x * TILE_SIZE;
                    const clampedLocalX = Math.max(0, Math.min(TILE_SIZE, localX));
                    const slopeH = this.getSlopeHeight(col.type, clampedLocalX);
                    const slopeY = tileBottom - slopeH;
                    const entityBottom = resultY + entity.h;
                    if (entityBottom > slopeY && resultY + entity.h - dy <= slopeY + 4) {
                        const candY = slopeY - entity.h;
                        if (candY < minPlayerY) {
                            minPlayerY = candY;
                            bestGroundType = col.type;
                        }
                    }
                }
            }
            if (minPlayerY !== Infinity) {
                resultY = minPlayerY;
                onGround = true;
                groundTileType = bestGroundType;
            }
        } else if (dy < 0) {
            let maxPlayerY = -Infinity;
            for (const col of yCollisions) {
                if (this.blocksAsSolid(stage, col.x, col.y, col.type)) {
                    const tileBottom = (col.y + 1) * TILE_SIZE;
                    if (tileBottom > maxPlayerY) {
                        maxPlayerY = tileBottom;
                        hitCeiling = true;
                    }
                }
            }
            if (maxPlayerY !== -Infinity) {
                resultY = maxPlayerY;
            }
        }

        return {
            x: resultX,
            y: resultY,
            hitWallX,
            hitCeiling,
            onGround,
            groundTileType,
        };
    }

    // Check if a point is inside a solid tile
    static pointIsSolid(stage, px, py) {
        const tx = Math.floor(px / TILE_SIZE);
        const ty = Math.floor(py / TILE_SIZE);
        const t = stage.getTile(tx, ty);
        return this.blocksAsSolid(stage, tx, ty, t);
    }

    // Raycast downward to find ground
    static raycastDown(stage, x, startY, maxDist) {
        for (let dy = 0; dy < maxDist; dy++) {
            const ty = Math.floor((startY + dy) / TILE_SIZE);
            const tx = Math.floor(x / TILE_SIZE);
            const tile = stage.getTile(tx, ty);
            if (this.blocksAsSolid(stage, tx, ty, tile) || this.isSemiSolid(tile)) {
                return { y: ty * TILE_SIZE, tile };
            }
        }
        return null;
    }
}


// ============================================
// SECTION 11: PLAYER ENTITY (GAMEPLAY)
// ============================================

class Player {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.w = 14;
        this.h = 24;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.facingRight = true;
        this.state = 'idle'; // idle, walk, jump, fall, dead, climb, swim
        this.powerState = 'small'; // small, big, fire
        this.invincibleTimer = 0;
        this.starTimer = 0;
        this.jumpHeld = false;
        this.jumpTimer = 0;
        this.maxJumpTimer = 12;
        this.animFrame = 0;
        this.animTimer = 0;
        this.alive = true;
        this.deathTimer = 0;
        this.coins = 0;
        this.score = 0;
        this.lives = 3;
        this.hasKey = false;
        this.checkpointX = -1;
        this.checkpointY = -1;
        this.inWater = false;
        this.onIce = false;
        this.climbingVine = false;
        this.fireballCooldown = 0;
        this.coyoteTime = 0; // grace frames for jumping after leaving edge
        this.jumpBufferTime = 0; // grace frames for pressing jump before landing
        this.wallSlideTimer = 0;
        this.bounceNextFrame = false;
        this.bounceForce = 0;
        this.groundTileType = TILE_TYPES.AIR;
        this.prevGroundTileType = TILE_TYPES.AIR;
        this.justLanded = false;
        this.springCooldown = 0;
        this.airFromSpringTimer = 0;
        this.vyApproachLast = 0;
        this.prevFootCellX = -1;
        this.prevFootCellY = -1;

        // Visual
        this.squashX = 1;
        this.squashY = 1;
        this.squashVelX = 0;
        this.squashVelY = 0;
        this.renderW = 20;
        this.renderH = 28;
        this.trail = [];
    }

    reset(spawnX, spawnY) {
        this.x = spawnX;
        this.y = spawnY;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.alive = true;
        this.deathTimer = 0;
        this.state = 'idle';
        this.jumpHeld = false;
        this.jumpTimer = 0;
        this.invincibleTimer = 0;
        this.inWater = false;
        this.climbingVine = false;
        this.hasKey = false;
        this.fireballCooldown = 0;
        this.coyoteTime = 0;
        this.jumpBufferTime = 0;
        this.squashX = 1;
        this.squashY = 1;
        this.trail = [];
        this.justLanded = false;
        this.prevGroundTileType = TILE_TYPES.AIR;
        this.springCooldown = 0;
        this.airFromSpringTimer = 0;
        this.vyApproachLast = 0;
        this.prevFootCellX = -1;
        this.prevFootCellY = -1;
        this.updateHitbox();
    }

    updateHitbox() {
        if (this.powerState === 'small') {
            this.w = 14;
            this.h = 24;
            this.renderW = 20;
            this.renderH = 28;
        } else {
            this.w = 14;
            this.h = 44;
            this.renderW = 22;
            this.renderH = 48;
        }
    }

    update(stage, entities) {
        if (!this.alive) {
            this.deathTimer++;
            this.vy += GRAVITY * 0.5;
            this.y += this.vy;
            return;
        }

        // Timers
        if (this.invincibleTimer > 0) this.invincibleTimer--;
        if (this.starTimer > 0) this.starTimer--;
        if (this.springCooldown > 0) this.springCooldown--;
        if (this.airFromSpringTimer > 0) this.airFromSpringTimer--;
        if (this.fireballCooldown > 0) this.fireballCooldown--;
        if (this.coyoteTime > 0) this.coyoteTime--;
        if (this.jumpBufferTime > 0) this.jumpBufferTime--;

        this.updateHitbox();

        // Check water/vine state
        this.checkEnvironment(stage);

        // Handle input
        this.handleInput(stage, entities);

        // Apply physics
        this.applyPhysics(stage);

        // Check hazards & items
        this.checkTileInteractions(stage, entities);

        // Update animation
        this.updateAnimation();

        // スター残像（毎フレーム大量 push + filter は重いので間引き・本数制限）
        if (this.starTimer > 0) {
            if (this.animTimer % 3 === 0) {
                this.trail.push({ x: this.x, y: this.y, life: 5 });
            }
            for (let i = this.trail.length - 1; i >= 0; i--) {
                this.trail[i].life--;
                if (this.trail[i].life <= 0) this.trail.splice(i, 1);
            }
            while (this.trail.length > 6) this.trail.shift();
        } else {
            this.trail = [];
        }

        this.prevGroundTileType = this.groundTileType;
        this.prevFootCellX = Math.floor((this.x + this.w / 2) / TILE_SIZE);
        this.prevFootCellY = Math.floor((this.y + this.h - 0.02) / TILE_SIZE);

        // Update squash/stretch
        this.squashVelX += (1 - this.squashX) * 0.3;
        this.squashVelY += (1 - this.squashY) * 0.3;
        this.squashVelX *= 0.7;
        this.squashVelY *= 0.7;
        this.squashX += this.squashVelX;
        this.squashY += this.squashVelY;

        // Fall off screen = death（チート時は底へ戻して落下死なし）
        if (this.y > stage.height * TILE_SIZE + 100) {
            if (typeof game !== 'undefined' && game && game.cheatMode) {
                this.y = stage.height * TILE_SIZE - TILE_SIZE * 2;
                this.vy = 0;
                this.vx *= 0.5;
            } else {
                this.die();
            }
        }
    }

    checkEnvironment(stage) {
        const centerTX = Math.floor((this.x + this.w / 2) / TILE_SIZE);
        const centerTY = Math.floor((this.y + this.h / 2) / TILE_SIZE);
        const tile = stage.getTile(centerTX, centerTY);

        this.inWater = PhysicsHelper.isWater(tile);
        this.climbingVine = false;

        // Check if near vine/ladder
        if (PhysicsHelper.isClimbable(tile)) {
            if (input.isUp() || input.isDown()) {
                this.climbingVine = true;
            }
        }
    }

    handleInput(stage, entities) {
        const speed = input.isRun() ? PLAYER_RUN_SPEED : PLAYER_WALK_SPEED;
        const accel = this.onGround ? 0.5 : 0.3;
        const waterMult = this.inWater ? 0.6 : 1.0;
        const iceFriction = this.onIce ? 0.97 : (this.onGround ? FRICTION_GROUND : FRICTION_AIR);

        // Horizontal movement
        if (input.isLeft()) {
            this.vx -= accel * waterMult;
            this.facingRight = false;
        } else if (input.isRight()) {
            this.vx += accel * waterMult;
            this.facingRight = true;
        }

        // Clamp horizontal speed
        const maxSpeed = speed * waterMult;
        this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));

        // Friction
        if (!input.isLeft() && !input.isRight()) {
            this.vx *= iceFriction;
            if (Math.abs(this.vx) < 0.1) this.vx = 0;
        }

        // Climbing
        if (this.climbingVine) {
            this.vy = 0;
            if (input.isUp()) this.vy = -2.5;
            if (input.isDown()) this.vy = 2.5;
            this.state = 'climb';
            return;
        }

        // Swimming
        if (this.inWater) {
            if (input.isJumpJustPressed()) {
                this.vy = -3.5;
                audio.playJump();
            }
            // Slow sinking in water
            if (this.vy > 2) this.vy = 2;
            this.state = 'swim';
        }

        // Jump buffer: remember jump press for a few frames
        if (input.isJumpJustPressed()) {
            this.jumpBufferTime = 8;
        }

        // Jumping (with coyote time and jump buffer)
        if (this.jumpBufferTime > 0 && (this.onGround || this.coyoteTime > 0) && !this.inWater) {
            const jumpForce = input.isRun() ? PLAYER_HIGH_JUMP : PLAYER_JUMP_FORCE;
            this.vy = jumpForce;
            this.onGround = false;
            this.jumpHeld = true;
            this.jumpTimer = 0;
            this.coyoteTime = 0;
            this.jumpBufferTime = 0;
            audio.playJump();

            // Squash effect
            this.squashX = 0.8;
            this.squashY = 1.3;

            // Dust particles
            particles.emitDust(this.x + this.w / 2, this.y + this.h, this.facingRight ? -1 : 1);
        }

        // Variable jump height (hold to jump higher)
        if (this.jumpHeld && input.isJump() && this.jumpTimer < this.maxJumpTimer) {
            this.jumpTimer++;
            // Sustain upward momentum
            this.vy -= 0.4;
        }
        if (!input.isJump()) {
            this.jumpHeld = false;
        }

        // Bounce (from spring or enemy stomp)
        if (this.bounceNextFrame) {
            this.vy = this.bounceForce;
            this.bounceNextFrame = false;
            this.onGround = false;
            this.jumpHeld = true;
            this.jumpTimer = 0;
        }

        // Fireball
        if (this.powerState === 'fire' && input.isFireJustPressed() && this.fireballCooldown <= 0) {
            this.shootFireball(entities);
        }
    }

    shootFireball(entities) {
        if (this.fireballCooldown > 0) return;
        this.fireballCooldown = 15;
        const dir = this.facingRight ? 1 : -1;
        const fb = new Fireball(
            this.x + (this.facingRight ? this.w : -8),
            this.y + this.h * 0.4,
            dir
        );
        entities.push(fb);
        audio.playFireball();
        particles.emitFireball(fb.x, fb.y, dir);
    }

    applyPhysics(stage) {
        // Gravity
        if (!this.climbingVine) {
            const gravMult = this.inWater ? 0.3 : 1.0;
            this.vy += GRAVITY * gravMult;

            // Fast fall (not holding jump while ascending)
            if (this.vy < 0 && !this.jumpHeld && !this.inWater) {
                this.vy += GRAVITY * 0.5; // extra gravity for shorter jumps
            }

            this.vy = Math.min(this.vy, this.inWater ? 3 : MAX_FALL_SPEED);
        }

        // Conveyor belt push
        if (this.onGround) {
            const footTX = Math.floor((this.x + this.w / 2) / TILE_SIZE);
            const footTY = Math.floor((this.y + this.h - 0.02) / TILE_SIZE);
            const footTile = stage.getTile(footTX, footTY);
            if (footTile === TILE_TYPES.CONVEYOR_LEFT) {
                this.vx -= 0.3;
            } else if (footTile === TILE_TYPES.CONVEYOR_RIGHT) {
                this.vx += 0.3;
            }
        }

        // Record onGround before collision
        const wasOnGround = this.onGround;
        const vyApproach = this.vy;

        // Move with collision
        const result = PhysicsHelper.moveWithCollision(stage, this, this.vx, this.vy);
        this.vyApproachLast = vyApproach;
        this.x = result.x;
        this.y = result.y;
        this.onGround = result.onGround;
        this.groundTileType = result.groundTileType;
        this.onIce = (result.groundTileType === TILE_TYPES.ICE);

        // Hit wall -> zero vx
        if (result.hitWallX) {
            this.vx = 0;
        }

        // Hit ceiling -> zero vy, bump effect
        if (result.hitCeiling) {
            this.vy = 0;
            this.jumpHeld = false;
            // Check if we hit a ? block or brick above
            this.handleCeilingBump(stage);
        }

        // Coyote time: a few grace frames after leaving platform
        if (wasOnGround && !this.onGround && this.vy >= 0) {
            this.coyoteTime = 6;
        }

        // Landing squash effect
        if (!wasOnGround && this.onGround) {
            this.squashX = 1.3;
            this.squashY = 0.7;
            if (this.vy > 5) {
                particles.emitDust(this.x + this.w / 2, this.y + this.h, -1);
                particles.emitDust(this.x + this.w / 2, this.y + this.h, 1);
            }
        }

        if (this.onGround) {
            this.vy = 0;
        }
