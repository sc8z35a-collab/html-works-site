        this.justLanded = !wasOnGround && this.onGround;

        // Update state
        if (this.climbingVine) {
            this.state = 'climb';
        } else if (this.inWater) {
            this.state = 'swim';
        } else if (!this.onGround) {
            this.state = this.vy < 0 ? 'jump' : 'fall';
        } else if (Math.abs(this.vx) > 0.5) {
            this.state = 'walk';
        } else {
            this.state = 'idle';
        }
    }

    handleCeilingBump(stage) {
        // Check the tile directly above the player's head
        const headTX1 = Math.floor(this.x / TILE_SIZE);
        const headTX2 = Math.floor((this.x + this.w - 1) / TILE_SIZE);
        const headTY = Math.floor((this.y - 1) / TILE_SIZE);

        for (let tx = headTX1; tx <= headTX2; tx++) {
            const tile = stage.getTile(tx, headTY);
            if (tile === TILE_TYPES.QUESTION) {
                // Spawn item from ? block, turn into hard block
                stage.setTile(tx, headTY, TILE_TYPES.HARD_BLOCK);
                sprites.clearCache();
                particles.emitBlockBump(tx * TILE_SIZE + TILE_SIZE / 2, headTY * TILE_SIZE);
                audio.playCoin();
                this.coins++;
                this.score += 200;
                break;
            } else if (tile === TILE_TYPES.BRICK) {
                if (this.powerState !== 'small') {
                    // Break brick
                    stage.setTile(tx, headTY, TILE_TYPES.AIR);
                    sprites.clearCache();
                    particles.emitBrickBreak(tx * TILE_SIZE + TILE_SIZE / 2, headTY * TILE_SIZE + TILE_SIZE / 2);
                    audio.playBrick();
                    this.score += 50;
                } else {
                    // Just bump it
                    particles.emitBlockBump(tx * TILE_SIZE + TILE_SIZE / 2, headTY * TILE_SIZE);
                    audio.playHit();
                }
                break;
            } else if (tile === TILE_TYPES.NOTE_BLOCK) {
                // Bounce!
                this.bounceNextFrame = true;
                this.bounceForce = PLAYER_HIGH_JUMP;
                particles.emitBlockBump(tx * TILE_SIZE + TILE_SIZE / 2, headTY * TILE_SIZE);
                audio.playSpring();
                break;
            } else if (tile === TILE_TYPES.INVISIBLE_BLOCK) {
                // Reveal!
                stage.setTile(tx, headTY, TILE_TYPES.HARD_BLOCK);
                sprites.clearCache();
                particles.emitPowerUp(tx * TILE_SIZE + TILE_SIZE / 2, headTY * TILE_SIZE + TILE_SIZE / 2);
                audio.playCoin();
                this.coins++;
                this.score += 200;
                break;
            }
        }
    }

    checkTileInteractions(stage, entities) {
        // Check tiles the player overlaps
        const tiles = PhysicsHelper.getTileCollisions(stage, this.x, this.y, this.w, this.h);
        let onOffHandled = false;
        for (const col of tiles) {
            const tile = col.type;

            // Coins
            if (tile === TILE_TYPES.COIN) {
                stage.setTile(col.x, col.y, TILE_TYPES.AIR);
                this.coins++;
                this.score += 200;
                audio.playCoin();
                particles.emitCoinCollect(col.x * TILE_SIZE + TILE_SIZE / 2, col.y * TILE_SIZE + TILE_SIZE / 2);
            }

            // Key
            if (tile === TILE_TYPES.KEY) {
                stage.setTile(col.x, col.y, TILE_TYPES.AIR);
                this.hasKey = true;
                audio.playPowerUp();
                particles.emitPowerUp(col.x * TILE_SIZE + TILE_SIZE / 2, col.y * TILE_SIZE + TILE_SIZE / 2);
            }

            // Checkpoint
            if (tile === TILE_TYPES.CHECKPOINT) {
                if (this.checkpointX !== col.x || this.checkpointY !== col.y) {
                    this.checkpointX = col.x;
                    this.checkpointY = col.y;
                    audio.playCheckpoint();
                    particles.emitCheckpoint(col.x * TILE_SIZE + TILE_SIZE / 2, col.y * TILE_SIZE);
                }
            }

            // Goal
            if (tile === TILE_TYPES.GOAL) {
                this.reachGoal();
            }

            // Door (needs key)
            if (tile === TILE_TYPES.DOOR && this.hasKey && input.isUp()) {
                this.reachGoal();
            }

            // Hazards（チート時は無敵のためスキップ）
            if (PhysicsHelper.isHazard(tile) && this.invincibleTimer <= 0 &&
                !(typeof game !== 'undefined' && game && game.cheatMode)) {
                if (PhysicsHelper.isLava(tile)) {
                    this.die();
                    particles.emitLavaHit(this.x + this.w/2, this.y + this.h);
                } else {
                    this.takeDamage();
                }
            }

            // ON/OFF スイッチ（足元1マス・1フレーム1回。ループ内の col 複数で二重トグルしない）
            if (!onOffHandled && tile === TILE_TYPES.ON_OFF_SWITCH && this.onGround) {
                const walkFromOther = this.prevGroundTileType !== TILE_TYPES.ON_OFF_SWITCH &&
                    this.prevGroundTileType !== TILE_TYPES.AIR;
                const chainCell = this.prevGroundTileType === TILE_TYPES.ON_OFF_SWITCH &&
                    (this.prevFootCellX !== col.x || this.prevFootCellY !== col.y);
                const stompLand = this.justLanded && this.vyApproachLast > 2.0;
                if (walkFromOther || chainCell || stompLand) {
                    onOffHandled = true;
                    this.toggleOnOffBlocks(stage);
                    audio.playHit();
                }
            }
        }

        this.handleSpringPad(stage);
    }

    /** ばねは足元1マスのみ。prev!==SPRING だけだと「前フレーム AIR」で毎着地ごとに弾んで無限バウンドする */
    handleSpringPad(stage) {
        if (!this.onGround || this.springCooldown > 0) return;
        const ftX = Math.floor((this.x + this.w / 2) / TILE_SIZE);
        const ftY = Math.floor((this.y + this.h - 0.02) / TILE_SIZE);
        if (stage.getTile(ftX, ftY) !== TILE_TYPES.SPRING) return;

        // 草地など「足元がブロックだった」→ ばね
        const fromOtherTile = this.prevGroundTileType !== TILE_TYPES.SPRING &&
            this.prevGroundTileType !== TILE_TYPES.AIR;
        // 連続ばねマスを地上で歩いて渡る
        const springToSpring = this.prevGroundTileType === TILE_TYPES.SPRING &&
            (ftX !== this.prevFootCellX || ftY !== this.prevFootCellY);
        // 高所からの落下のみ（2.2 だとばねジャンプの着地でも true になり、prev が AIR で連発する）
        const fellFromAbove = this.justLanded &&
            this.vyApproachLast > 6.5 &&
            this.airFromSpringTimer === 0;
        const firstStand = this.prevFootCellX < 0 && this.justLanded;

        if (!fromOtherTile && !springToSpring && !fellFromAbove && !firstStand) return;

        this.springCooldown = 32;
        this.airFromSpringTimer = 45;
        const springForce = input.isJump() ? -14 : -10;
        this.vy = springForce;
        this.onGround = false;
        this.jumpHeld = true;
        this.jumpTimer = 0;
        audio.playSpring();
        particles.emitSpring(ftX * TILE_SIZE + TILE_SIZE / 2, ftY * TILE_SIZE);
        this.squashX = 0.7;
        this.squashY = 1.4;
    }

    toggleOnOffBlocks(stage) {
        if (!stage.metadata) stage.metadata = {};
        const solid = stage.metadata.onOffState !== false;
        stage.metadata.onOffState = !solid;
    }

    takeDamage() {
        if (typeof game !== 'undefined' && game && game.cheatMode) return;
        if (this.invincibleTimer > 0 || this.starTimer > 0) return;

        if (this.powerState === 'fire') {
            this.powerState = 'big';
            this.invincibleTimer = 90;
            this.updateHitbox();
            audio.playHit();
        } else if (this.powerState === 'big') {
            this.powerState = 'small';
            this.invincibleTimer = 90;
            this.updateHitbox();
            audio.playHit();
        } else {
            this.die();
        }
    }

    die() {
        if (typeof game !== 'undefined' && game && game.cheatMode) return;
        if (!this.alive) return;
        this.alive = false;
        this.vy = PLAYER_JUMP_FORCE;
        this.vx = 0;
        this.deathTimer = 0;
        this.lives--;
        audio.playDeath();
        particles.emitDeath(this.x + this.w / 2, this.y + this.h / 2);
    }

    reachGoal() {
        // Signal the game that player reached the goal
        if (game && game.mode === 'play') {
            game.handleGoalReached();
        }
    }

    powerUp(type) {
        if (type === 'mushroom') {
            if (this.powerState === 'small') {
                this.powerState = 'big';
                this.updateHitbox();
                this.y -= 20; // push up so we don't clip into ground
                audio.playPowerUp();
                particles.emitPowerUp(this.x + this.w/2, this.y + this.h/2);
                this.squashX = 0.6;
                this.squashY = 1.4;
            }
            this.score += 1000;
        } else if (type === 'fire_flower') {
            if (this.powerState === 'small') {
                this.powerState = 'big';
                this.updateHitbox();
                this.y -= 20;
            }
            this.powerState = 'fire';
            audio.playPowerUp();
            particles.emitPowerUp(this.x + this.w/2, this.y + this.h/2);
            this.score += 1000;
        } else if (type === 'star') {
            this.starTimer = 600; // 10 seconds
            audio.playPowerUp();
            particles.emitPowerUp(this.x + this.w/2, this.y + this.h/2);
            this.score += 1000;
        } else if (type === '1up') {
            this.lives++;
            audio.playOneUp();
            particles.emitOneUp(this.x + this.w/2, this.y);
        }
    }

    updateAnimation() {
        this.animTimer++;
        if (this.animTimer >= 6) {
            this.animTimer = 0;
            this.animFrame++;
        }
    }

    render(ctx, camera) {
        if (!this.alive && this.deathTimer > 60) return;

        const sx = (this.x - camera.x) * camera.zoom + camera.shakeX;
        const sy = (this.y - camera.y) * camera.zoom + camera.shakeY;
        const sw = this.renderW * camera.zoom;
        const sh = this.renderH * camera.zoom;

        // Invincible blink
        if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 3) % 2 === 0) return;

        // Star trail（Date.now / 毎ドット計算は重いので game.time ベース・本数も制限済み）
        if (this.starTimer > 0 && this.trail.length > 0) {
            const hueBase = ((typeof game !== 'undefined' && game) ? game.time * 6 : 0) % 360;
            for (let i = 0; i < this.trail.length; i++) {
                const t = this.trail[i];
                const tx = (t.x - camera.x) * camera.zoom + camera.shakeX;
                const ty = (t.y - camera.y) * camera.zoom + camera.shakeY;
                const alpha = (t.life / 5) * 0.35;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = `hsl(${(hueBase + i * 50) % 360}, 95%, 58%)`;
                ctx.fillRect(tx - sw * 0.28, ty - sh * 0.08, sw * 0.55, sh * 0.5);
            }
            ctx.globalAlpha = 1;
        }

        ctx.save();

        // Center rendering offset
        const offsetX = (this.renderW - this.w) / 2;
        const offsetY = (this.renderH - this.h);

        const rx = sx - offsetX * camera.zoom;
        const ry = sy - offsetY * camera.zoom;

        // Squash & stretch
        ctx.translate(rx + sw / 2, ry + sh);
        ctx.scale(this.squashX, this.squashY);
        ctx.translate(-(rx + sw / 2), -(ry + sh));

        // Star power: hue-rotate フィルタは Canvas で非常に重いので軽い加算グローに変更
        if (this.starTimer > 0) {
            const ph = ((typeof game !== 'undefined' && game) ? game.time * 5 : 0) % 360;
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = `hsla(${ph}, 85%, 55%, 0.22)`;
            ctx.fillRect(rx, ry, sw, sh);
            ctx.globalCompositeOperation = 'source-over';
        }

        // Death visual
        if (!this.alive) {
            ctx.globalAlpha = Math.max(0, 1 - this.deathTimer / 60);
        }

        sprites.renderPlayer(ctx, rx, ry, sw, sh, this.state, this.facingRight, this.animFrame, this.powerState);

        ctx.restore();
        ctx.filter = 'none';
    }
}


// ============================================
// SECTION 12: FIREBALL ENTITY
// ============================================

class Fireball {
    constructor(x, y, dir) {
        this.x = x;
        this.y = y;
        this.w = 8;
        this.h = 8;
        this.vx = dir * 6;
        this.vy = -2;
        this.dir = dir;
        this.alive = true;
        this.bounceCount = 0;
        this.maxBounces = 4;
        this.lifeTimer = 0;
        this.maxLife = 120;
        this.type = 'fireball';
    }

    update(stage) {
        if (!this.alive) return;

        this.lifeTimer++;
        if (this.lifeTimer > this.maxLife) {
            this.alive = false;
            return;
        }

        this.vy += GRAVITY;
        this.vy = Math.min(this.vy, 8);

        const result = PhysicsHelper.moveWithCollision(stage, this, this.vx, this.vy);
        this.x = result.x;
        this.y = result.y;

        // Bounce off ground
        if (result.onGround) {
            this.vy = -5;
            this.bounceCount++;
        }

        // Hit wall -> die
        if (result.hitWallX) {
            this.alive = false;
            particles.emitFireball(this.x, this.y, 0);
        }

        if (this.bounceCount > this.maxBounces) {
            this.alive = false;
        }

        // Trail particles
        particles.emitFireball(this.x + this.w/2, this.y + this.h/2, this.dir);
    }

    render(ctx, camera) {
        if (!this.alive) return;
        const sx = (this.x - camera.x) * camera.zoom;
        const sy = (this.y - camera.y) * camera.zoom;
        const ss = 8 * camera.zoom;

        // Fire glow
        const glow = ctx.createRadialGradient(sx + ss/2, sy + ss/2, 1, sx + ss/2, sy + ss/2, ss);
        glow.addColorStop(0, '#FFE800');
        glow.addColorStop(0.5, '#FF8800');
        glow.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx + ss/2, sy + ss/2, ss, 0, Math.PI * 2);
        ctx.fill();

        // Core
        ctx.fillStyle = '#FFE800';
        ctx.beginPath();
        ctx.arc(sx + ss/2, sy + ss/2, ss*0.3, 0, Math.PI * 2);
        ctx.fill();
    }
}


// ============================================
// SECTION 13: ENEMY BASE & ENEMY ENTITIES
// ============================================

class Enemy {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.w = TILE_SIZE - 4;
        this.h = TILE_SIZE - 4;
        this.vx = 0;
        this.vy = 0;
        this.type = type;
        this.alive = true;
        this.active = false;
        this.facingRight = false;
        this.animFrame = 0;
        this.animTimer = 0;
        this.stompable = true;
        this.fireable = true;
        this.deathTimer = 0;
        this.spawnX = x;
        this.spawnY = y;
        this.onGround = false;
        this.activationDistance = 600; // pixels from camera to become active
    }

    checkActivation(cameraX, cameraWidth) {
        const screenDist = Math.abs(this.x - (cameraX + cameraWidth / 2));
        if (screenDist < this.activationDistance + cameraWidth / 2) {
            if (!this.active) {
                this.active = true;
                this.onActivate();
            }
        }
    }

    onActivate() {
        // Override in subclasses for initial behavior
    }

    update(stage, player) {
        if (!this.alive) {
            this.deathTimer++;
            this.vy += GRAVITY;
            this.y += this.vy;
            return this.deathTimer < 60;
        }

        if (!this.active) return true;

        this.animTimer++;
        if (this.animTimer >= 8) {
            this.animTimer = 0;
            this.animFrame++;
        }

        this.applyAI(stage, player);
        this.applyPhysics(stage);

        // Remove if fallen off screen
        if (this.y > stage.height * TILE_SIZE + 200) {
            return false;
        }

        return true;
    }

    applyAI(stage, player) {
        // Override per enemy type
    }

    applyPhysics(stage) {
        this.vy += GRAVITY;
        this.vy = Math.min(this.vy, MAX_FALL_SPEED);

        const result = PhysicsHelper.moveWithCollision(stage, this, this.vx, this.vy);
        this.x = result.x;
        this.y = result.y;
        this.onGround = result.onGround;

        if (result.hitWallX) {
            this.vx = -this.vx;
            this.facingRight = !this.facingRight;
        }

        if (this.onGround) {
            this.vy = 0;
        }
    }

    takeStomp(player) {
        if (!this.stompable) return false;
        this.alive = false;
        this.vy = -3;
        player.score += 100;
        audio.playStomp();
        particles.emitStomp(this.x + this.w / 2, this.y);
        return true;
    }

    takeFireball() {
        if (!this.fireable) return false;
        this.alive = false;
        this.vy = -4;
        this.vx = 2;
        return true;
    }

    takeStar(player) {
        this.alive = false;
        this.vy = -5;
        player.score += 200;
        particles.emitStomp(this.x + this.w/2, this.y);
    }

    render(ctx, camera) {
        const sx = (this.x - camera.x) * camera.zoom;
        const sy = (this.y - camera.y) * camera.zoom;
        const sw = this.w * camera.zoom;
        const sh = this.h * camera.zoom;

        if (!this.alive) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - this.deathTimer / 30);
            ctx.translate(sx + sw/2, sy + sh/2);
            ctx.scale(1, -1); // flip upside down
            ctx.translate(-sx - sw/2, -sy - sh/2);
        }

        // Draw the enemy sprite using the cached tile
        const tileType = this.getTileType();
        const tileCanvas = sprites.getCachedTile(tileType, 'OVERWORLD', this.animFrame);
        ctx.drawImage(tileCanvas, sx, sy, sw, sh);

        if (!this.alive) {
            ctx.restore();
        }
    }

    getTileType() {
        return this.type;
    }
}


class GoombaEnemy extends Enemy {
    constructor(x, y) {
        super(x, y, TILE_TYPES.GOOMBA);
        this.speed = 1;
    }

    onActivate() {
        this.vx = -this.speed;
    }

    applyAI(stage, player) {
        // Simple walk, turn at edges
        if (this.onGround) {
            const checkX = this.facingRight ? this.x + this.w + 2 : this.x - 2;
            const checkY = this.y + this.h + 4;
            const tbx = Math.floor(checkX / TILE_SIZE);
            const tby = Math.floor(checkY / TILE_SIZE);
            const tileBelow = stage.getTile(tbx, tby);
            if (!PhysicsHelper.blocksAsSolid(stage, tbx, tby, tileBelow) && !PhysicsHelper.isSemiSolid(tileBelow)) {
                this.vx = -this.vx;
                this.facingRight = !this.facingRight;
            }
        }
    }
}

class KoopaEnemy extends Enemy {
    constructor(x, y) {
        super(x, y, TILE_TYPES.KOOPA);
        this.speed = 1.2;
        this.isShell = false;
        this.shellSpeed = 6;
        this.shellTimer = 0;
    }

    onActivate() {
        this.vx = -this.speed;
    }

    applyAI(stage, player) {
        if (this.isShell) {
            this.shellTimer++;
            // After a while, the koopa comes back out
            if (this.shellTimer > 300 && this.vx === 0) {
                this.isShell = false;
                this.shellTimer = 0;
                this.vx = -this.speed;
                this.h = TILE_SIZE - 4;
            }
        } else {
            // Turn at edges
            if (this.onGround) {
                const checkX = this.facingRight ? this.x + this.w + 2 : this.x - 2;
                const checkY = this.y + this.h + 4;
                const tbx = Math.floor(checkX / TILE_SIZE);
                const tby = Math.floor(checkY / TILE_SIZE);
                const tileBelow = stage.getTile(tbx, tby);
                if (!PhysicsHelper.blocksAsSolid(stage, tbx, tby, tileBelow) && !PhysicsHelper.isSemiSolid(tileBelow)) {
                    this.vx = -this.vx;
                    this.facingRight = !this.facingRight;
                }
            }
        }
    }

    takeStomp(player) {
        if (this.isShell) {
            // Kick the shell
            if (this.vx === 0) {
                this.vx = player.x < this.x ? this.shellSpeed : -this.shellSpeed;
                player.score += 100;
                audio.playStomp();
            } else {
                this.vx = 0;
                player.score += 100;
                audio.playStomp();
            }
            return true;
        } else {
            // Enter shell mode
            this.isShell = true;
            this.vx = 0;
            this.shellTimer = 0;
            this.h = TILE_SIZE * 0.6;
            this.y += TILE_SIZE * 0.3;
            player.score += 100;
            audio.playStomp();
            particles.emitStomp(this.x + this.w/2, this.y);
            return true;
        }
    }
}

class PiranhaEnemy extends Enemy {
    constructor(x, y) {
        super(x, y, TILE_TYPES.PIRANHA);
        this.stompable = false;
        this.baseY = y;
        this.emergeTimer = 0;
        this.emergePhase = 0; // 0=hidden, 1=emerging, 2=out, 3=retreating
        this.emergeHeight = TILE_SIZE * 1.2;
        this.activationDistance = 400;
    }

    onActivate() {
        this.emergePhase = 0;
        this.emergeTimer = 0;
    }

    applyAI(stage, player) {
        this.emergeTimer++;

        switch (this.emergePhase) {
            case 0: // Hidden
                this.y = this.baseY + TILE_SIZE;
                if (this.emergeTimer > 60) {
                    // Don't emerge if player is directly above
                    const playerDist = Math.abs((player.x + player.w/2) - (this.x + this.w/2));
                    if (playerDist > TILE_SIZE * 1.5) {
                        this.emergePhase = 1;
                        this.emergeTimer = 0;
                    }
                }
                break;
            case 1: // Emerging
                this.y = this.baseY + TILE_SIZE - (this.emergeTimer / 30) * this.emergeHeight;
                if (this.emergeTimer >= 30) {
                    this.emergePhase = 2;
                    this.emergeTimer = 0;
                }
                break;
            case 2: // Out
                if (this.emergeTimer > 90) {
                    this.emergePhase = 3;
                    this.emergeTimer = 0;
                }
                break;
            case 3: // Retreating
                this.y = this.baseY + TILE_SIZE - this.emergeHeight + (this.emergeTimer / 30) * this.emergeHeight;
                if (this.emergeTimer >= 30) {
                    this.emergePhase = 0;
                    this.emergeTimer = 0;
                }
                break;
        }
    }

    applyPhysics(stage) {
        // Piranha doesn't use normal physics
    }
}

class ThwompEnemy extends Enemy {
    constructor(x, y) {
        super(x, y, TILE_TYPES.THWOMP);
        this.w = TILE_SIZE;
        this.h = TILE_SIZE;
        this.stompable = false;
        this.fireable = false;
        this.baseY = y;
        this.state_ai = 'waiting'; // waiting, slamming, recovering
        this.slamSpeed = 8;
        this.recoverSpeed = 1;
        this.waitTimer = 0;
    }

    applyAI(stage, player) {
        const playerDist = Math.abs((player.x + player.w/2) - (this.x + this.w/2));

        switch (this.state_ai) {
            case 'waiting':
                if (playerDist < TILE_SIZE * 3 && player.y > this.y) {
                    this.state_ai = 'slamming';
                }
                break;
            case 'slamming':
                this.vy = this.slamSpeed;
                if (this.onGround) {
                    this.state_ai = 'recovering';
                    this.waitTimer = 0;
                    this.vy = 0;
                    // Screen shake!
                    if (game && game.camera) {
                        game.camera.shake(6);
                    }
                    audio.playHit();
                }
                break;
            case 'recovering':
                this.waitTimer++;
                if (this.waitTimer > 30) {
                    // Float back up
                    if (this.y > this.baseY) {
                        this.y -= this.recoverSpeed;
                        this.vy = 0;
                    } else {
                        this.y = this.baseY;
                        this.state_ai = 'waiting';
                    }
                }
                break;
        }
    }

    applyPhysics(stage) {
        if (this.state_ai === 'slamming') {
            this.vy = this.slamSpeed;
            const result = PhysicsHelper.moveWithCollision(stage, this, 0, this.vy);
            this.y = result.y;
            this.onGround = result.onGround;
        }
        // recovering handled in applyAI
    }
}

class BooEnemy extends Enemy {
    constructor(x, y) {
        super(x, y, TILE_TYPES.BOO);
        this.stompable = false;
        this.speed = 1.5;
        this.activationDistance = 400;
    }

    applyAI(stage, player) {
        // Chase player when they're not looking, freeze when looked at
        const lookingAtBoo = (player.facingRight && this.x > player.x) ||
                              (!player.facingRight && this.x < player.x);

        if (lookingAtBoo) {
            // Freeze!
            this.vx *= 0.8;
            this.vy *= 0.8;
        } else {
            // Chase
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy) || 1;
            this.vx += (dx / dist) * 0.1;
            this.vy += (dy / dist) * 0.1;
            const maxS = this.speed;
            const curSpeed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
            if (curSpeed > maxS) {
                this.vx = (this.vx / curSpeed) * maxS;
                this.vy = (this.vy / curSpeed) * maxS;
            }
        }

        this.facingRight = player.x > this.x;
    }

    applyPhysics(stage) {
        // Boo floats, no normal physics
        this.x += this.vx;
        this.y += this.vy;
    }
}

class BulletBillEnemy extends Enemy {
    /** @param dir 飛行方向 -1=左 1=右（大砲からの発射用） */
    constructor(x, y, dir = -1) {
        super(x, y, TILE_TYPES.BULLET_BILL);
        this.speed = 3;
        this.activationDistance = 500;
        this.billDir = dir >= 0 ? 1 : -1;
    }

    onActivate() {
        this.vx = this.speed * this.billDir;
    }

    applyAI(stage, player) {
        this.facingRight = this.vx > 0;
    }

    applyPhysics(stage) {
        // Bullet Bill flies in a straight line
        this.x += this.vx;
        this.y += this.vy;
    }
}


// ============================================
// SECTION 14: ITEM ENTITIES (spawned from blocks)
// ============================================

class ItemEntity {
    /** @param directPlace エディタで床に置いたとき true（?ブロックから出る演出をスキップ） */
    constructor(x, y, itemType, directPlace = false) {
        this.x = x;
        this.y = y;
        this.w = TILE_SIZE - 8;
        this.h = TILE_SIZE - 8;
        this.vx = 0;
        this.vy = 0;
        this.itemType = itemType; // 'mushroom', 'fire_flower', 'star', '1up'
        this.alive = true;
        this.spawnTimer = 0;
        this.spawning = !directPlace;
        this.spawnY = y;
        this.type = 'item';
        this.onGround = false;
        if (directPlace) {
            if (this.itemType === 'mushroom' || this.itemType === '1up') {
                this.vx = 2;
            } else if (this.itemType === 'star') {
                this.vx = 2.5;
                this.vy = -5;
            }
        }
    }

    update(stage) {
        if (!this.alive) return false;

        // Spawn animation: rise out of block
        if (this.spawning) {
            this.spawnTimer++;
            this.y = this.spawnY - (this.spawnTimer / 20) * TILE_SIZE;
            if (this.spawnTimer >= 20) {
                this.spawning = false;
                if (this.itemType === 'mushroom' || this.itemType === '1up') {
                    this.vx = 2;
                } else if (this.itemType === 'star') {
                    this.vx = 2.5;
                    this.vy = -5;
                }
            }
            return true;
        }

        // Fire flower stays still
        if (this.itemType === 'fire_flower') {
            return true;
        }

        // Mushroom / Star physics
        this.vy += GRAVITY;
        this.vy = Math.min(this.vy, MAX_FALL_SPEED);

        // Star bounces
        if (this.itemType === 'star' && this.onGround) {
            this.vy = -7;
        }

        const result = PhysicsHelper.moveWithCollision(stage, this, this.vx, this.vy);
        this.x = result.x;
        this.y = result.y;
        this.onGround = result.onGround;

        if (result.hitWallX) {
            this.vx = -this.vx;
        }
        if (this.onGround) {
            this.vy = 0;
        }

        // Fall off screen
        if (this.y > stage.height * TILE_SIZE + 100) {
            return false;
        }

        return true;
    }

    render(ctx, camera) {
        if (!this.alive) return;
        const sx = (this.x - camera.x) * camera.zoom;
        const sy = (this.y - camera.y) * camera.zoom;
        const sw = TILE_SIZE * camera.zoom;
        const sh = TILE_SIZE * camera.zoom;

        let tileType;
        switch (this.itemType) {
            case 'mushroom': tileType = TILE_TYPES.MUSHROOM_ITEM; break;
            case 'fire_flower': tileType = TILE_TYPES.FIRE_FLOWER; break;
            case 'star': tileType = TILE_TYPES.STAR_ITEM; break;
            case '1up': tileType = TILE_TYPES.ONE_UP; break;
            default: tileType = TILE_TYPES.MUSHROOM_ITEM;
        }

        const theme = (typeof game !== 'undefined' && game && game.stage) ? game.stage.theme : 'OVERWORLD';
        const tile = sprites.getCachedTile(tileType, theme, this.spawning ? 0 : Math.floor(Date.now() / 100));
        ctx.drawImage(tile, sx, sy, sw, sh);
    }
}


// ============================================
// SECTION 15: ENTITY MANAGER
// ============================================

class EntityManager {
    constructor() {
        this.entities = [];
        this.player = new Player();
        this.cannonSlots = [];
    }

    clear() {
        this.entities = [];
        this.cannonSlots = [];
    }

    spawnFromStage(stage) {
        this.entities = [];
        this.cannonSlots = [];
        for (let y = 0; y < stage.height; y++) {
            for (let x = 0; x < stage.width; x++) {
                const tile = stage.getTile(x, y);
                const px = x * TILE_SIZE + 2;
                const py = y * TILE_SIZE + 2;

                switch (tile) {
                    case TILE_TYPES.GOOMBA:
                        this.entities.push(new GoombaEnemy(px, py));
                        break;
                    case TILE_TYPES.KOOPA:
                        this.entities.push(new KoopaEnemy(px, py));
                        break;
                    case TILE_TYPES.PIRANHA:
                        this.entities.push(new PiranhaEnemy(x * TILE_SIZE, y * TILE_SIZE));
                        break;
                    case TILE_TYPES.THWOMP:
                        this.entities.push(new ThwompEnemy(x * TILE_SIZE, y * TILE_SIZE));
                        break;
                    case TILE_TYPES.BOO:
                        this.entities.push(new BooEnemy(px, py));
                        break;
                    case TILE_TYPES.BULLET_BILL:
                        this.entities.push(new BulletBillEnemy(px, py));
                        break;
                    case TILE_TYPES.CANNON:
                        this.cannonSlots.push({ tx: x, ty: y, cd: 90 });
                        break;
                    case TILE_TYPES.MUSHROOM_ITEM:
                        this.entities.push(new ItemEntity(px, py, 'mushroom', true));
                        break;
                    case TILE_TYPES.FIRE_FLOWER:
                        this.entities.push(new ItemEntity(px, py, 'fire_flower', true));
                        break;
                    case TILE_TYPES.STAR_ITEM:
                        this.entities.push(new ItemEntity(px, py, 'star', true));
                        break;
                    case TILE_TYPES.ONE_UP:
                        this.entities.push(new ItemEntity(px, py, '1up', true));
                        break;
                    // Additional enemies can be added similarly
                }
            }
        }
    }

    update(stage) {
        const p = this.player;
        for (let i = 0; i < this.cannonSlots.length; i++) {
            const c = this.cannonSlots[i];
            if (c.cd > 0) {
                c.cd--;
                continue;
            }
            if (!p.alive) continue;
            const cx = c.tx * TILE_SIZE + TILE_SIZE / 2;
            const cy = c.ty * TILE_SIZE + TILE_SIZE / 2;
            const pc = p.x + p.w / 2;
            if (Math.abs(pc - cx) > 400) continue;
            const dir = pc >= cx ? 1 : -1;
            const bill = new BulletBillEnemy(cx + dir * 20, cy - 2, dir);
            bill.active = true;
            bill.onActivate();
            this.entities.push(bill);
            c.cd = 220;
        }

        // Update entities, remove dead ones
        this.entities = this.entities.filter(e => {
            if (e.checkActivation) {
                e.checkActivation(game.camera.x, game.camera.width);
            }
            return e.update(stage, this.player);
        });

        // Check player-enemy collisions
        if (p.alive) {
            this.checkPlayerEnemyCollisions();
            this.checkPlayerItemCollisions();
        }

        // Check fireball-enemy collisions
        this.checkFireballCollisions();

        // Update player
        this.player.update(stage, this.entities);
    }

    checkPlayerEnemyCollisions() {
        const p = this.player;
        for (const e of this.entities) {
            if (!e.alive || e.type === 'fireball' || e.type === 'item') continue;

            if (PhysicsHelper.aabbOverlap(p.x, p.y, p.w, p.h, e.x, e.y, e.w, e.h)) {
                // Star power kills enemies
                if (p.starTimer > 0) {
                    e.takeStar(p);
                    continue;
                }

                // Check if player is falling on top of enemy (stomp)
                const playerBottom = p.y + p.h;
                const enemyTop = e.y;
                const playerPrevBottom = p.y + p.h - p.vy;

                if (p.vy > 0 && playerBottom - enemyTop < p.h * 0.4 && e.stompable) {
                    if (e.takeStomp(p)) {
                        // Bounce the player up
                        p.vy = -6;
                        p.onGround = false;
                        p.jumpHeld = false;
                        p.squashX = 1.2;
                        p.squashY = 0.8;
                    }
                } else {
                    // Player takes damage
                    if (p.invincibleTimer <= 0) {
                        p.takeDamage();
                    }
                }
            }
        }
    }

    checkPlayerItemCollisions() {
        const p = this.player;
        for (const e of this.entities) {
            if (e.type !== 'item' || !e.alive || e.spawning) continue;

            if (PhysicsHelper.aabbOverlap(p.x, p.y, p.w, p.h, e.x, e.y, e.w, e.h)) {
                p.powerUp(e.itemType);
                e.alive = false;
            }
        }
    }

    checkFireballCollisions() {
        const fireballs = this.entities.filter(e => e.type === 'fireball' && e.alive);
        const enemies = this.entities.filter(e => e.type !== 'fireball' && e.type !== 'item' && e.alive);

        for (const fb of fireballs) {
            for (const enemy of enemies) {
                if (PhysicsHelper.aabbOverlap(fb.x, fb.y, fb.w, fb.h, enemy.x, enemy.y, enemy.w, enemy.h)) {
                    if (enemy.takeFireball()) {
                        this.player.score += 200;
                        audio.playStomp();
                        particles.emitStomp(enemy.x + enemy.w/2, enemy.y);
                    }
                    fb.alive = false;
                    break;
                }
            }
        }
    }

    render(ctx, camera) {
        // Render all entities
        for (const e of this.entities) {
            e.render(ctx, camera);
        }
        // Render player last (on top)
        this.player.render(ctx, camera);
    }
}


// ============================================
// SECTION 16: STAGE RENDERER (Tile Drawing)
// ============================================

class StageRenderer {
    constructor() {
        this.chunkSize = 16; // tiles per chunk
        this.chunkCache = new Map();
        this.lastTheme = '';
        this.animTick = 0;
    }

    clearCache() {
        this.chunkCache.clear();
        sprites.clearCache();
    }

    render(ctx, stage, camera, time) {
        this.animTick = Math.floor(time / 100);
        const zoom = camera.zoom;
        const viewX = camera.x + camera.shakeX;
        const viewY = camera.y + camera.shakeY;
        const viewW = camera.width / zoom;
        const viewH = camera.height / zoom;

        // Determine visible tile range
        const startTX = Math.max(0, Math.floor(viewX / TILE_SIZE) - 1);
        const endTX = Math.min(stage.width - 1, Math.ceil((viewX + viewW) / TILE_SIZE) + 1);
        const startTY = Math.max(0, Math.floor(viewY / TILE_SIZE) - 1);
        const endTY = Math.min(stage.height - 1, Math.ceil((viewY + viewH) / TILE_SIZE) + 1);

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(-viewX, -viewY);

        if (this.lastTheme !== stage.theme) {
            this.clearCache();
            this.lastTheme = stage.theme;
        }

        // Render tiles
        for (let ty = startTY; ty <= endTY; ty++) {
            for (let tx = startTX; tx <= endTX; tx++) {
                const tile = stage.getTile(tx, ty);
                if (tile === TILE_TYPES.AIR) continue;

                const wx = tx * TILE_SIZE;
                const wy = ty * TILE_SIZE;

                // Determine variant for animated tiles
                let variant = 0;
                if (tile === TILE_TYPES.COIN || tile === TILE_TYPES.QUESTION ||
                    tile === TILE_TYPES.WATER_TOP || tile === TILE_TYPES.WATER ||
                    tile === TILE_TYPES.LAVA_TOP || tile === TILE_TYPES.LAVA ||
                    tile === TILE_TYPES.KEY || tile === TILE_TYPES.STAR_ITEM ||
                    tile === TILE_TYPES.FIRE_FLOWER || tile === TILE_TYPES.FIRE_BAR ||
                    tile === TILE_TYPES.CHECKPOINT || tile === TILE_TYPES.GOAL ||
                    tile === TILE_TYPES.NOTE_BLOCK || tile === TILE_TYPES.WING ||
                    tile === TILE_TYPES.MUNCHER || tile === TILE_TYPES.CONVEYOR_LEFT ||
                    tile === TILE_TYPES.CONVEYOR_RIGHT || tile === TILE_TYPES.ON_OFF_BLOCK ||
                    tile === TILE_TYPES.ON_OFF_SWITCH || tile === TILE_TYPES.SPRING) {
                    variant = this.animTick;
                }

                // Skip entity tiles during gameplay (they become entities)
                if (game.mode === 'play' && ENTITY_TILES.has(tile) &&
                    tile !== TILE_TYPES.COIN && tile !== TILE_TYPES.KEY &&
                    tile !== TILE_TYPES.CHECKPOINT && tile !== TILE_TYPES.GOAL &&
                    tile !== TILE_TYPES.FIRE_BAR && tile !== TILE_TYPES.SPRING &&
                    tile !== TILE_TYPES.PLAYER_SPAWN) {
                    continue;
                }

                // In play mode, don't draw spawn marker
                if (game.mode === 'play' && tile === TILE_TYPES.PLAYER_SPAWN) continue;

                const tileCanvas = sprites.getCachedTile(tile, stage.theme, variant);
                ctx.drawImage(tileCanvas, wx, wy, TILE_SIZE, TILE_SIZE);
            }
        }

        ctx.restore();
    }

    renderGrid(ctx, stage, camera) {
        const zoom = camera.zoom;
        const viewX = camera.x + camera.shakeX;
        const viewY = camera.y + camera.shakeY;
        const viewW = camera.width / zoom;
        const viewH = camera.height / zoom;

        const startTX = Math.max(0, Math.floor(viewX / TILE_SIZE));
        const endTX = Math.min(stage.width, Math.ceil((viewX + viewW) / TILE_SIZE));
        const startTY = Math.max(0, Math.floor(viewY / TILE_SIZE));
        const endTY = Math.min(stage.height, Math.ceil((viewY + viewH) / TILE_SIZE));

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(-viewX, -viewY);

        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 0.5 / zoom;

        ctx.beginPath();
        for (let tx = startTX; tx <= endTX; tx++) {
            const x = tx * TILE_SIZE;
            ctx.moveTo(x, startTY * TILE_SIZE);
            ctx.lineTo(x, endTY * TILE_SIZE);
        }
        for (let ty = startTY; ty <= endTY; ty++) {
            const y = ty * TILE_SIZE;
            ctx.moveTo(startTX * TILE_SIZE, y);
            ctx.lineTo(endTX * TILE_SIZE, y);
        }
        ctx.stroke();

        // Stage boundary
        ctx.strokeStyle = 'rgba(233,69,96,0.4)';
        ctx.lineWidth = 2 / zoom;
        ctx.setLineDash([8 / zoom, 4 / zoom]);
        ctx.strokeRect(0, 0, stage.width * TILE_SIZE, stage.height * TILE_SIZE);
        ctx.setLineDash([]);

        ctx.restore();
    }
}

const stageRenderer = new StageRenderer();


// ============================================
// SECTION 17: MINIMAP RENDERER
// ============================================

class MinimapRenderer {
    constructor() {
        this.canvas = document.getElementById('minimapCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.updateInterval = 30; // frames between updates
        this.frameCounter = 0;
    }

    update(stage, camera) {
        this.frameCounter++;
        if (this.frameCounter % this.updateInterval !== 0) return;

        const mw = 200;
        const mh = 80;
        this.canvas.width = mw;
        this.canvas.height = mh;
        const ctx = this.ctx;

        // Background
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, mw, mh);

        // Scale
        const scaleX = mw / (stage.width * TILE_SIZE);
        const scaleY = mh / (stage.height * TILE_SIZE);
        const scale = Math.min(scaleX, scaleY);

        const offsetX = (mw - stage.width * TILE_SIZE * scale) / 2;
        const offsetY = (mh - stage.height * TILE_SIZE * scale) / 2;

        // Draw tiles as tiny pixels
        for (let ty = 0; ty < stage.height; ty++) {
            for (let tx = 0; tx < stage.width; tx++) {
                const tile = stage.getTile(tx, ty);
                if (tile === TILE_TYPES.AIR) continue;

                const px = offsetX + tx * TILE_SIZE * scale;
                const py = offsetY + ty * TILE_SIZE * scale;
                const ps = Math.max(1, TILE_SIZE * scale);

                if (SOLID_TILES.has(tile)) {
                    ctx.fillStyle = '#8B5E3C';
                } else if (SEMI_SOLID_TILES.has(tile)) {
                    ctx.fillStyle = '#A07848';
                } else if (tile === TILE_TYPES.COIN) {
                    ctx.fillStyle = '#FFD700';
                } else if (HAZARD_TILES.has(tile)) {
                    ctx.fillStyle = '#FF4444';
                } else if (tile === TILE_TYPES.PIPE_TL || tile === TILE_TYPES.PIPE_TR ||
                           tile === TILE_TYPES.PIPE_BL || tile === TILE_TYPES.PIPE_BR) {
                    ctx.fillStyle = '#2CB83E';
                } else if (tile === TILE_TYPES.WATER || tile === TILE_TYPES.WATER_TOP) {
                    ctx.fillStyle = 'rgba(30,100,200,0.5)';
                } else if (tile === TILE_TYPES.LAVA || tile === TILE_TYPES.LAVA_TOP) {
                    ctx.fillStyle = 'rgba(255,80,20,0.7)';
                } else if (tile === TILE_TYPES.GOAL) {
                    ctx.fillStyle = '#FF4444';
                } else if (tile === TILE_TYPES.PLAYER_SPAWN) {
                    ctx.fillStyle = '#4ade80';
                } else if (ENTITY_TILES.has(tile)) {
                    ctx.fillStyle = '#FF8800';
                } else {
                    ctx.fillStyle = '#666';
                }

                ctx.fillRect(px, py, ps, ps);
            }
        }

        // Viewport rectangle
        const vpx = offsetX + camera.x * scale;
        const vpy = offsetY + camera.y * scale;
        const vpw = (camera.width / camera.zoom) * scale;
        const vph = (camera.height / camera.zoom) * scale;

        ctx.strokeStyle = '#e94560';
        ctx.lineWidth = 1;
        ctx.strokeRect(vpx, vpy, vpw, vph);

        // Player indicator
        if (game.mode === 'play' && game.entityManager.player.alive) {
            const p = game.entityManager.player;
            const ppx = offsetX + p.x * scale;
            const ppy = offsetY + p.y * scale;
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(ppx - 2, ppy - 2, 4, 4);
        }
    }
}

// SECTION 18: EDITOR SYSTEM
// ============================================

class Editor {
    constructor() {
        this.activeTool = 'place'; // place, erase, select, fill
        this.selectedTile = TILE_TYPES.GROUND;
        this.activeCategory = '地形';
        this.isDrawing = false;
        this.lastDrawTX = -1;
        this.lastDrawTY = -1;
        this.selectionStart = null;
        this.selectionEnd = null;
        this.selectionRect = null;
        this.clipboardData = null;
        this.undoRedo = new UndoRedoManager();
        this.hoverTX = -1;
        this.hoverTY = -1;
        this.showGrid = true;
        this.setupUI();
    }

    setupUI() {
        // Category tabs
        const catContainer = document.getElementById('paletteCategories');
        Object.keys(TILE_CATEGORIES).forEach(catName => {
            const tab = document.createElement('div');
            tab.className = 'category-tab' + (catName === this.activeCategory ? ' active' : '');
            tab.textContent = catName;
            tab.addEventListener('click', () => {
                this.activeCategory = catName;
                catContainer.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                this.updatePalette();
            });
            catContainer.appendChild(tab);
        });

        // Palette grid
        this.updatePalette();

        // Tool buttons
        document.querySelectorAll('.editor-tool-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                this.activeTool = btn.dataset.tool;
                document.querySelectorAll('.editor-tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Keyboard shortcuts for tools
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (game.mode !== 'edit' && game.mode !== 'preview') return;
            switch(e.key) {
                case '1': if (game.mode === 'edit') this.setTool('place'); break;
                case '2': if (game.mode === 'edit') this.setTool('erase'); break;
                case '3': if (game.mode === 'edit') this.setTool('select'); break;
                case '4': if (game.mode === 'edit') this.setTool('fill'); break;
                case 'g': case 'G': this.showGrid = !this.showGrid; break;
            }
        });
    }

    setTool(tool) {
        this.activeTool = tool;
        document.querySelectorAll('.editor-tool-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.tool === tool);
        });
    }

    updatePalette() {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = '';

        const tiles = TILE_CATEGORIES[this.activeCategory] || [];
        tiles.forEach(tileType => {
            const item = document.createElement('div');
            item.className = 'palette-item' + (tileType === this.selectedTile ? ' selected' : '');

            // Render tile preview
            const previewCanvas = document.createElement('canvas');
            previewCanvas.width = 32;
            previewCanvas.height = 32;
            const currentTheme = (game && game.stage) ? game.stage.theme : 'OVERWORLD';
            const tileSprite = sprites.getCachedTile(tileType, currentTheme, 0);
            const pCtx = previewCanvas.getContext('2d');
            pCtx.drawImage(tileSprite, 0, 0, 32, 32);

            item.appendChild(previewCanvas);

            const nameDiv = document.createElement('div');
            nameDiv.className = 'item-name';
            nameDiv.textContent = TILE_NAMES[tileType] || `#${tileType}`;
            item.appendChild(nameDiv);

            item.addEventListener('click', () => {
                this.selectedTile = tileType;
                grid.querySelectorAll('.palette-item').forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
                this.activeTool = 'place'; // Auto-switch to place tool
                this.setTool('place');
            });

            grid.appendChild(item);
        });
    }

    handleMouseInput(camera, stage) {
        const worldPos = camera.screenToWorld(input.mouse.x, input.mouse.y);
        this.hoverTX = Math.floor(worldPos.x / TILE_SIZE);
        this.hoverTY = Math.floor(worldPos.y / TILE_SIZE);

        // Update status bar
        document.getElementById('statusPos').textContent = `${this.hoverTX}, ${this.hoverTY}`;

        // Middle mouse / right mouse = pan
        if (input.mouse.down && (input.mouse.button === 1 || input.mouse.button === 2 || input.isKeyDown('Space'))) {
            if (!camera.isPanning) {
                camera.isPanning = true;
                camera.panStartX = input.mouse.x;
                camera.panStartY = input.mouse.y;
            } else {
                const dx = (input.mouse.x - camera.panStartX) / camera.zoom;
                const dy = (input.mouse.y - camera.panStartY) / camera.zoom;
                camera.targetX -= dx;
                camera.targetY -= dy;
                camera.x -= dx;
                camera.y -= dy;
                camera.panStartX = input.mouse.x;
                camera.panStartY = input.mouse.y;
            }
            return;
        } else {
            camera.isPanning = false;
        }

        // Zoom with mouse wheel
        if (input.mouse.wheel !== 0) {
            const oldWorldPos = camera.screenToWorld(input.mouse.x, input.mouse.y);
            if (input.mouse.wheel < 0) {
                camera.zoomIn();
            } else {
                camera.zoomOut();
            }
            // Zoom toward mouse position
            const newWorldPos = camera.screenToWorld(input.mouse.x, input.mouse.y);
            camera.targetX += (oldWorldPos.x - newWorldPos.x);
            camera.targetY += (oldWorldPos.y - newWorldPos.y);
        }

        if (game && game.mode === 'preview') {
            return;
        }

        // Left click drawing
        if (input.mouse.button === 0) {
            if (input.mouse.justDown) {
                this.startDraw(stage);
            }

            if (input.mouse.down && this.isDrawing) {
                this.continueDraw(stage);
            }

            if (input.mouse.justUp && this.isDrawing) {
                this.endDraw(stage);
            }
        }
    }

    startDraw(stage) {
        this.isDrawing = true;
        this.lastDrawTX = this.hoverTX;
        this.lastDrawTY = this.hoverTY;

        if (this.activeTool === 'place') {
            this.placeTile(stage, this.hoverTX, this.hoverTY, this.selectedTile);
        } else if (this.activeTool === 'erase') {
            this.placeTile(stage, this.hoverTX, this.hoverTY, TILE_TYPES.AIR);
        } else if (this.activeTool === 'fill') {
            this.floodFill(stage, this.hoverTX, this.hoverTY, this.selectedTile);
        } else if (this.activeTool === 'select') {
            this.selectionStart = { x: this.hoverTX, y: this.hoverTY };
            this.selectionEnd = { x: this.hoverTX, y: this.hoverTY };
        }
    }

    continueDraw(stage) {
        if (this.hoverTX === this.lastDrawTX && this.hoverTY === this.lastDrawTY) return;

        if (this.activeTool === 'place') {
            // Draw line from last to current (Bresenham)
            this.drawLine(stage, this.lastDrawTX, this.lastDrawTY, this.hoverTX, this.hoverTY, this.selectedTile);
        } else if (this.activeTool === 'erase') {
            this.drawLine(stage, this.lastDrawTX, this.lastDrawTY, this.hoverTX, this.hoverTY, TILE_TYPES.AIR);
        } else if (this.activeTool === 'select') {
            this.selectionEnd = { x: this.hoverTX, y: this.hoverTY };
        }

        this.lastDrawTX = this.hoverTX;
        this.lastDrawTY = this.hoverTY;
    }

    endDraw(stage) {
        this.isDrawing = false;

        if (this.activeTool === 'select' && this.selectionStart && this.selectionEnd) {
            this.selectionRect = {
                x: Math.min(this.selectionStart.x, this.selectionEnd.x),
                y: Math.min(this.selectionStart.y, this.selectionEnd.y),
                w: Math.abs(this.selectionEnd.x - this.selectionStart.x) + 1,
                h: Math.abs(this.selectionEnd.y - this.selectionStart.y) + 1,
            };
        }

        document.getElementById('statusTileCount').textContent = stage.countTiles() + ' パーツ';
    }

    placeTile(stage, tx, ty, type) {
        if (tx < 0 || tx >= stage.width || ty < 0 || ty >= stage.height) return;
        const oldType = stage.getTile(tx, ty);
        if (oldType === type) return;

        // Record for undo
        this.undoRedo.push({
            type: 'tile',
            x: tx,
            y: ty,
            oldTile: oldType,
            newTile: type,
        });

        stage.setTile(tx, ty, type);
        if (type !== TILE_TYPES.AIR) {
            audio.playPlace();
        } else {
            audio.playErase();
        }
    }

    drawLine(stage, x0, y0, x1, y1, tileType) {
        // Bresenham line algorithm
        const dx = Math.abs(x1 - x0);
        const dy = Math.abs(y1 - y0);
        const sx = x0 < x1 ? 1 : -1;
        const sy = y0 < y1 ? 1 : -1;
        let err = dx - dy;

        while (true) {
            this.placeTile(stage, x0, y0, tileType);
            if (x0 === x1 && y0 === y1) break;
            const e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x0 += sx; }
            if (e2 < dx) { err += dx; y0 += sy; }
        }
    }

    floodFill(stage, startX, startY, newType) {
        if (startX < 0 || startX >= stage.width || startY < 0 || startY >= stage.height) return;
        const targetType = stage.getTile(startX, startY);
        if (targetType === newType) return;

        const fillActions = [];
        const stack = [{ x: startX, y: startY }];
        const visited = new Set();
        const maxFill = 5000;
        let count = 0;

        while (stack.length > 0 && count < maxFill) {
            const { x, y } = stack.pop();
            const key = `${x},${y}`;
            if (visited.has(key)) continue;
            if (x < 0 || x >= stage.width || y < 0 || y >= stage.height) continue;
            if (stage.getTile(x, y) !== targetType) continue;

            visited.add(key);
            fillActions.push({ x, y, oldTile: targetType });
            stage.setTile(x, y, newType);
            count++;

            stack.push({ x: x + 1, y });
            stack.push({ x: x - 1, y });
            stack.push({ x, y: y + 1 });
            stack.push({ x, y: y - 1 });
        }

        // Record fill as single undo action
        if (fillActions.length > 0) {
            this.undoRedo.push({
                type: 'fill',
                actions: fillActions,
                newTile: newType,
            });
            audio.playPlace();
        }

        document.getElementById('statusTileCount').textContent = stage.countTiles() + ' パーツ';
    }

    performUndo(stage) {
        if (game && game.mode === 'preview') return;
        const action = this.undoRedo.undo();
        if (!action) return;

        if (action.type === 'tile') {
            stage.setTile(action.x, action.y, action.oldTile);
        } else if (action.type === 'fill') {
            action.actions.forEach(a => {
                stage.setTile(a.x, a.y, a.oldTile);
            });
        }

        stageRenderer.clearCache();
        showToast('元に戻しました', 'success');
    }

    performRedo(stage) {
        if (game && game.mode === 'preview') return;
        const action = this.undoRedo.redo();
        if (!action) return;

        if (action.type === 'tile') {
            stage.setTile(action.x, action.y, action.newTile);
        } else if (action.type === 'fill') {
            action.actions.forEach(a => {
                stage.setTile(a.x, a.y, action.newTile);
            });
        }

        stageRenderer.clearCache();
        showToast('やり直しました', 'success');
    }

    renderEditorOverlay(ctx, camera, stage) {
        // Grid
        if (this.showGrid) {
            stageRenderer.renderGrid(ctx, stage, camera);
        }

        // Hover tile highlight
        if (this.hoverTX >= 0 && this.hoverTX < stage.width &&
            this.hoverTY >= 0 && this.hoverTY < stage.height) {

            const zoom = camera.zoom;
            const viewX = camera.x + camera.shakeX;
            const viewY = camera.y + camera.shakeY;

            const sx = (this.hoverTX * TILE_SIZE - viewX) * zoom;
            const sy = (this.hoverTY * TILE_SIZE - viewY) * zoom;
            const ss = TILE_SIZE * zoom;

            // Hover highlight
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(sx, sy, ss, ss);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.strokeRect(sx, sy, ss, ss);

            // Ghost preview of tile to place
            if (game.mode !== 'preview' && this.activeTool === 'place') {
                ctx.globalAlpha = 0.5;
                const tileCanvas = sprites.getCachedTile(this.selectedTile, stage.theme, 0);
                ctx.drawImage(tileCanvas, sx, sy, ss, ss);
                ctx.globalAlpha = 1;
            }

            // Erase X indicator
            if (game.mode !== 'preview' && this.activeTool === 'erase') {
                ctx.strokeStyle = 'rgba(255,50,50,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(sx + 4, sy + 4);
                ctx.lineTo(sx + ss - 4, sy + ss - 4);
                ctx.moveTo(sx + ss - 4, sy + 4);
                ctx.lineTo(sx + 4, sy + ss - 4);
                ctx.stroke();
            }
        }

        // Selection rectangle
        if (game.mode !== 'preview' && this.activeTool === 'select' && this.selectionRect) {
            const zoom = camera.zoom;
            const viewX = camera.x + camera.shakeX;
            const viewY = camera.y + camera.shakeY;

            const rx = (this.selectionRect.x * TILE_SIZE - viewX) * zoom;
            const ry = (this.selectionRect.y * TILE_SIZE - viewY) * zoom;
            const rw = this.selectionRect.w * TILE_SIZE * zoom;
            const rh = this.selectionRect.h * TILE_SIZE * zoom;

            ctx.fillStyle = 'rgba(100,150,255,0.15)';
            ctx.fillRect(rx, ry, rw, rh);
            ctx.strokeStyle = 'rgba(100,150,255,0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 3]);
            ctx.strokeRect(rx, ry, rw, rh);
            ctx.setLineDash([]);
        }

        // Active selection during drag
        if (this.activeTool === 'select' && this.isDrawing && this.selectionStart && this.selectionEnd) {
            const zoom = camera.zoom;
            const viewX = camera.x + camera.shakeX;
            const viewY = camera.y + camera.shakeY;

            const sx = Math.min(this.selectionStart.x, this.selectionEnd.x);
            const sy = Math.min(this.selectionStart.y, this.selectionEnd.y);
            const sw = Math.abs(this.selectionEnd.x - this.selectionStart.x) + 1;
            const sh = Math.abs(this.selectionEnd.y - this.selectionStart.y) + 1;

            const rx = (sx * TILE_SIZE - viewX) * zoom;
            const ry = (sy * TILE_SIZE - viewY) * zoom;
            const rw = sw * TILE_SIZE * zoom;
            const rh = sh * TILE_SIZE * zoom;

            ctx.fillStyle = 'rgba(100,150,255,0.1)';
            ctx.fillRect(rx, ry, rw, rh);
            ctx.strokeStyle = 'rgba(100,150,255,0.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(rx, ry, rw, rh);
            ctx.setLineDash([]);
        }
    }
}

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 3000);
}

function showModal(content) {
    const overlay = document.getElementById('modalOverlay');
    const contentDiv = document.getElementById('modalContent');
    contentDiv.innerHTML = content;
    overlay.classList.add('active');
}

function hideModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

function showThemeModal() {
    let html = '<h2>テーマ選択</h2><p>ステージのビジュアルテーマを選んでください。</p>';
    html += '<div class="theme-selector">';
    Object.keys(THEMES).forEach(key => {
        const t = THEMES[key];
        const isActive = game.stage.theme === key;
        html += `<div class="theme-option ${isActive ? 'active' : ''}" onclick="setTheme('${key}')" style="background: linear-gradient(180deg, ${t.bgGradient[0]}, ${t.bgGradient[t.bgGradient.length-1]});" title="${t.name}">
            <div style="position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:rgba(255,255,255,0.8);">${t.name}</div>
        </div>`;
    });
    html += '</div>';
    html += '<div class="modal-actions"><button class="modal-btn" onclick="hideModal()">閉じる</button></div>';
    showModal(html);
}

function setTheme(themeKey) {
    game.stage.theme = themeKey;
    stageRenderer.clearCache();
    sprites.clearCache();
    game.editor.updatePalette();
    hideModal();
    showToast(`テーマを「${THEMES[themeKey].name}」に変更しました`, 'success');
}

function showSettingsModal() {
    let html = '<h2>ステージ設定</h2>';
    html += `<div class="property-section">
        <div class="property-row"><label>ステージ名</label><input type="text" id="modalStageName" value="${game.stage.name}" style="width:180px;"></div>
        <div class="property-row"><label>幅 (タイル)</label><input type="number" id="modalStageW" value="${game.stage.width}" min="20" max="500"></div>
        <div class="property-row"><label>高さ (タイル)</label><input type="number" id="modalStageH" value="${game.stage.height}" min="15" max="40"></div>
        <div class="property-row"><label>制限時間 (秒)</label><input type="number" id="modalTimeLimit" value="${game.stage.timeLimit}" min="10" max="999"></div>
    </div>`;
    html += '<div class="modal-actions">';
    html += '<button class="modal-btn" onclick="hideModal()">キャンセル</button>';
    html += '<button class="modal-btn primary" onclick="applySettings()">適用</button>';
    html += '</div>';
    showModal(html);
}

function applySettings() {
    const name = document.getElementById('modalStageName').value.trim() || 'Untitled';
    const w = parseInt(document.getElementById('modalStageW').value) || 200;
    const h = parseInt(document.getElementById('modalStageH').value) || 27;
    const time = parseInt(document.getElementById('modalTimeLimit').value) || 300;

    game.stage.name = name;
    game.stage.timeLimit = time;

    if (w !== game.stage.width || h !== game.stage.height) {
        game.stage.resize(
            Math.max(20, Math.min(500, w)),
            Math.max(15, Math.min(40, h))
        );
        game.camera.setWorldSize(game.stage.width * TILE_SIZE, game.stage.height * TILE_SIZE);
        stageRenderer.clearCache();
    }

    document.getElementById('stageName').value = name;
    document.getElementById('stageWidth').value = game.stage.width;
    document.getElementById('stageHeight').value = game.stage.height;
    document.getElementById('timeLimit').value = time;

    hideModal();
    showToast('設定を適用しました', 'success');
}

function showNewStageConfirm() {
    let html = '<h2>新規ステージ</h2>';
    html += '<p>現在のステージを破棄して新しいステージを作成しますか？未保存の変更は失われます。</p>';
    html += '<div class="modal-actions">';
    html += '<button class="modal-btn" onclick="hideModal()">キャンセル</button>';
    html += '<button class="modal-btn primary" onclick="createNewStage()">作成</button>';
    html += '</div>';
    showModal(html);
}

function createNewStage() {
    game.stage = new StageData(200, 27);
    game.stage.generateDefault();
    game.camera.setWorldSize(game.stage.width * TILE_SIZE, game.stage.height * TILE_SIZE);
    game.camera.fitToStage(game.stage.width, game.stage.height);
    game.editor.undoRedo.clear();
    stageRenderer.clearCache();
    sprites.clearCache();
    game.editor.updatePalette();
    hideModal();
    showToast('新しいステージを作成しました', 'success');
    document.getElementById('statusTileCount').textContent = game.stage.countTiles() + ' パーツ';
}

function saveStage() {
    try {
        const json = game.stage.serialize();
        localStorage.setItem('stagemaker_stage_' + game.stage.name, json);

        // Also update saved list
        let savedList = JSON.parse(localStorage.getItem('stagemaker_list') || '[]');
        if (!savedList.includes(game.stage.name)) {
            savedList.push(game.stage.name);
        }
        localStorage.setItem('stagemaker_list', JSON.stringify(savedList));

        showToast(`「${game.stage.name}」を保存しました`, 'success');
    } catch(e) {
        showToast('保存に失敗しました: ' + e.message, 'error');
    }
}

function showLoadModal() {
    let html = '<h2>ステージ読込</h2>';

    const savedList = JSON.parse(localStorage.getItem('stagemaker_list') || '[]');

    if (savedList.length === 0) {
        html += '<p>保存されたステージはありません。</p>';
    } else {
        html += '<div class="stage-list">';
        savedList.forEach(name => {
            html += `<div class="stage-list-item" onclick="loadStage('${name.replace(/'/g, "\\'")}')">
                <div class="stage-thumb"></div>
                <div class="stage-info">
                    <div class="stage-name">${name}</div>
                    <div class="stage-meta">クリックして読み込み</div>
                </div>
            </div>`;
        });
        html += '</div>';
    }

    html += '<div style="margin-top:16px;">';
    html += '<p style="font-size:12px;color:var(--ui-text-dim);">JSONファイルからの読込:</p>';
    html += '<input type="file" id="fileInput" accept=".json" style="margin-top:8px;" onchange="loadFromFile(event)">';
    html += '</div>';

    html += '<div class="modal-actions">';
    html += '<button class="modal-btn" onclick="hideModal()">閉じる</button>';
    html += '</div>';
    showModal(html);
}

function loadStage(name) {
    try {
        const json = localStorage.getItem('stagemaker_stage_' + name);
        if (!json) {
            showToast('ステージが見つかりません', 'error');
            return;
        }
        const stage = StageData.deserialize(json);
        if (!stage) {
            showToast('ステージの読込に失敗しました', 'error');
            return;
        }
        game.stage = stage;
        game.camera.setWorldSize(game.stage.width * TILE_SIZE, game.stage.height * TILE_SIZE);
        game.camera.fitToStage(game.stage.width, game.stage.height);
        game.editor.undoRedo.clear();
        stageRenderer.clearCache();
        sprites.clearCache();
        game.editor.updatePalette();

        document.getElementById('stageName').value = game.stage.name;
        document.getElementById('stageWidth').value = game.stage.width;
        document.getElementById('stageHeight').value = game.stage.height;
        document.getElementById('timeLimit').value = game.stage.timeLimit;

        hideModal();
        showToast(`「${name}」を読み込みました`, 'success');
        document.getElementById('statusTileCount').textContent = game.stage.countTiles() + ' パーツ';
    } catch (e) {
        showToast('読込エラー: ' + e.message, 'error');
    }
}

function loadFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const stage = StageData.deserialize(e.target.result);
            if (!stage) {
                showToast('ファイルの解析に失敗しました', 'error');
                return;
            }
            game.stage = stage;
            game.camera.setWorldSize(game.stage.width * TILE_SIZE, game.stage.height * TILE_SIZE);
            game.camera.fitToStage(game.stage.width, game.stage.height);
            game.editor.undoRedo.clear();
            stageRenderer.clearCache();
            sprites.clearCache();
            game.editor.updatePalette();

            document.getElementById('stageName').value = game.stage.name;
            document.getElementById('stageWidth').value = game.stage.width;
            document.getElementById('stageHeight').value = game.stage.height;
            document.getElementById('timeLimit').value = game.stage.timeLimit;

            hideModal();
            showToast(`「${game.stage.name}」をファイルから読み込みました`, 'success');
        } catch (err) {
            showToast('ファイル読込エラー: ' + err.message, 'error');
        }
    };
    reader.readAsText(file);
}

function exportStageFile() {
    const json = game.stage.serialize();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (game.stage.name || 'stage') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('ステージをエクスポートしました', 'success');
}
