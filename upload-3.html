<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Stage Maker - Beautiful Edition</title>
<style>
/* ============================================
   GLOBAL STYLES & RESET
   ============================================ */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --ui-bg: #1a1a2e;
    --ui-bg-light: #16213e;
    --ui-accent: #e94560;
    --ui-accent2: #0f3460;
    --ui-text: #eee;
    --ui-text-dim: #999;
    --ui-border: #333;
    --ui-success: #4ade80;
    --ui-warning: #fbbf24;
    --ui-danger: #ef4444;
    --editor-grid: rgba(255,255,255,0.08);
    --shadow-heavy: 0 8px 32px rgba(0,0,0,0.5);
    --shadow-light: 0 2px 8px rgba(0,0,0,0.3);
    --radius: 8px;
    --radius-lg: 16px;
    --transition: 0.2s ease;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--ui-bg);
    color: var(--ui-text);
    user-select: none;
    -webkit-user-select: none;
}

/* ============================================
   CANVAS CONTAINER
   ============================================ */
#gameContainer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
}

canvas#mainCanvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    image-rendering: auto;
}

canvas#uiCanvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
}

/* ============================================
   LOADING SCREEN
   ============================================ */
#loadingScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a2a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: opacity 0.5s ease;
}

#loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
}

#loadingScreen h1 {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 30px;
    text-shadow: none;
    letter-spacing: 2px;
}

.loading-bar-container {
    width: 400px;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
}

.loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e94560, #ffd93d, #4d96ff);
    border-radius: 4px;
    transition: width 0.3s ease;
}

.loading-text {
    margin-top: 15px;
    color: var(--ui-text-dim);
    font-size: 14px;
}

/* ============================================
   TOP TOOLBAR
   ============================================ */
#topToolbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: linear-gradient(180deg, rgba(20,20,40,0.97) 0%, rgba(20,20,40,0.92) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    padding: 0 16px;
    z-index: 1000;
    gap: 8px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
}

#topToolbar .logo {
    font-size: 20px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-right: 16px;
    white-space: nowrap;
}

.toolbar-separator {
    width: 1px;
    height: 32px;
    background: rgba(255,255,255,0.1);
    margin: 0 8px;
}

.toolbar-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    color: var(--ui-text);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
}

.toolbar-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
}

.toolbar-btn.active {
    background: var(--ui-accent);
    border-color: var(--ui-accent);
    color: #fff;
    box-shadow: 0 0 15px rgba(233,69,96,0.3);
}

.toolbar-btn.play-btn {
    background: linear-gradient(135deg, #4ade80, #22c55e);
    border-color: #22c55e;
    color: #fff;
    font-weight: 700;
}

.toolbar-btn.play-btn:hover {
    box-shadow: 0 0 20px rgba(74,222,128,0.4);
    transform: translateY(-1px);
}

.toolbar-btn.stop-btn {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-color: #dc2626;
    color: #fff;
    font-weight: 700;
}

.toolbar-btn svg, .toolbar-btn .icon {
    width: 18px;
    height: 18px;
}

.toolbar-spacer {
    flex: 1;
}

/* ============================================
   LEFT PANEL (TILE PALETTE)
   ============================================ */
#leftPanel {
    position: absolute;
    top: 56px;
    left: 0;
    width: 260px;
    bottom: 48px;
    background: linear-gradient(180deg, rgba(20,20,40,0.96) 0%, rgba(16,16,36,0.98) 100%);
    backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255,255,255,0.08);
    z-index: 900;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.3s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,0.2);
}

#leftPanel.collapsed {
    transform: translateX(-260px);
}

.panel-header {
    padding: 14px 16px;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ui-text-dim);
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.palette-categories {
    display: flex;
    padding: 8px;
    gap: 4px;
    flex-wrap: wrap;
}

.category-tab {
    padding: 6px 12px;
    font-size: 11px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all var(--transition);
    color: var(--ui-text-dim);
}

.category-tab:hover {
    background: rgba(255,255,255,0.1);
    color: var(--ui-text);
}

.category-tab.active {
    background: var(--ui-accent);
    border-color: var(--ui-accent);
    color: #fff;
}

.palette-grid {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    align-content: start;
}

.palette-grid::-webkit-scrollbar {
    width: 6px;
}

.palette-grid::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
}

.palette-item {
    aspect-ratio: 1;
    border-radius: var(--radius);
    background: rgba(255,255,255,0.04);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px;
    position: relative;
    overflow: hidden;
}

.palette-item:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    transform: scale(1.05);
}

.palette-item.selected {
    border-color: var(--ui-accent);
    background: rgba(233,69,96,0.15);
    box-shadow: 0 0 12px rgba(233,69,96,0.3);
}

.palette-item canvas {
    width: 36px;
    height: 36px;
    image-rendering: pixelated;
}

.palette-item .item-name {
    font-size: 8px;
    color: var(--ui-text-dim);
    margin-top: 2px;
    text-align: center;
    line-height: 1.1;
}

/* ============================================
   RIGHT PANEL (PROPERTIES)
   ============================================ */
#rightPanel {
    position: absolute;
    top: 56px;
    right: 0;
    width: 280px;
    bottom: 48px;
    background: linear-gradient(180deg, rgba(20,20,40,0.96) 0%, rgba(16,16,36,0.98) 100%);
    backdrop-filter: blur(20px);
    border-left: 1px solid rgba(255,255,255,0.08);
    z-index: 900;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.3s ease;
    box-shadow: -4px 0 20px rgba(0,0,0,0.2);
}

#rightPanel.collapsed {
    transform: translateX(280px);
}

.property-section {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.property-section h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ui-text-dim);
    margin-bottom: 10px;
}

.property-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

.property-row label {
    font-size: 12px;
    color: var(--ui-text-dim);
}

.property-row input[type="number"],
.property-row input[type="text"],
.property-row select {
    width: 100px;
    padding: 4px 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: var(--ui-text);
    font-size: 12px;
    outline: none;
}

.property-row input:focus,
.property-row select:focus {
    border-color: var(--ui-accent);
}

.property-row input[type="range"] {
    width: 100px;
    accent-color: var(--ui-accent);
}

.property-row input[type="checkbox"] {
    accent-color: var(--ui-accent);
}

.right-panel-scroll {
    flex: 1;
    overflow-y: auto;
}

.right-panel-scroll::-webkit-scrollbar {
    width: 6px;
}

.right-panel-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
}

/* ============================================
   BOTTOM BAR
   ============================================ */
#bottomBar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 48px;
    background: linear-gradient(0deg, rgba(15,15,30,0.98) 0%, rgba(20,20,40,0.95) 100%);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    padding: 0 16px;
    z-index: 1000;
    gap: 12px;
    font-size: 12px;
    color: var(--ui-text-dim);
}

.status-item {
    display: flex;
    align-items: center;
    gap: 4px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ui-success);
    box-shadow: 0 0 8px rgba(74,222,128,0.5);
}

.zoom-control {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
}

.zoom-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: var(--ui-text);
    cursor: pointer;
    font-size: 16px;
    transition: all var(--transition);
}

.zoom-btn:hover {
    background: rgba(255,255,255,0.12);
}

#zoomLevel {
    min-width: 45px;
    text-align: center;
    font-size: 12px;
    color: var(--ui-text-dim);
}

/* ============================================
   MODAL / DIALOG
   ============================================ */
.modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    pointer-events: all;
}

.modal-content {
    background: linear-gradient(135deg, #1a1a3e 0%, #0f0f2e 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-lg);
    padding: 32px;
    min-width: 400px;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow-heavy);
    transform: scale(0.9);
    transition: transform 0.3s ease;
}

.modal-overlay.active .modal-content {
    transform: scale(1);
}

.modal-content h2 {
    font-size: 24px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.modal-content p {
    color: var(--ui-text-dim);
    line-height: 1.6;
    margin-bottom: 12px;
}

.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
}

.modal-btn {
    padding: 10px 24px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: var(--ui-text);
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
}

.modal-btn:hover {
    background: rgba(255,255,255,0.12);
}

.modal-btn.primary {
    background: var(--ui-accent);
    border-color: var(--ui-accent);
}

.modal-btn.primary:hover {
    background: #d63a54;
}

/* ============================================
   THEME SELECT
   ============================================ */
.theme-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.theme-option {
    width: 60px;
    height: 60px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all var(--transition);
    overflow: hidden;
    position: relative;
}

.theme-option:hover {
    transform: scale(1.1);
    border-color: rgba(255,255,255,0.3);
}

.theme-option.active {
    border-color: var(--ui-accent);
    box-shadow: 0 0 15px rgba(233,69,96,0.4);
}

/* ============================================
   NOTIFICATIONS / TOAST
   ============================================ */
#toastContainer {
    position: fixed;
    top: 70px;
    right: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    padding: 12px 20px;
    background: rgba(30,30,60,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    color: var(--ui-text);
    font-size: 13px;
    box-shadow: var(--shadow-heavy);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    max-width: 300px;
}

.toast.success {
    border-left: 3px solid var(--ui-success);
}

.toast.warning {
    border-left: 3px solid var(--ui-warning);
}

.toast.error {
    border-left: 3px solid var(--ui-danger);
}

@keyframes toastIn {
    from { opacity: 0; transform: translateX(50px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes toastOut {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(50px); }
}

/* ============================================
   MINI MAP
   ============================================ */
#minimap {
    position: absolute;
    bottom: 56px;
    right: 8px;
    width: 200px;
    height: 80px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    z-index: 800;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-light);
}

#minimap canvas {
    width: 100%;
    height: 100%;
}

.minimap-viewport {
    position: absolute;
    border: 1px solid var(--ui-accent);
    background: rgba(233,69,96,0.15);
    pointer-events: none;
}

/* ============================================
   TOOLTIP
   ============================================ */
.tooltip {
    position: fixed;
    padding: 6px 12px;
    background: rgba(0,0,0,0.9);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    font-size: 11px;
    color: #fff;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s ease;
}

.tooltip.visible {
    opacity: 1;
}

/* ============================================
   HUD (in-game)
   ============================================ */
.game-hud {
    position: absolute;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    z-index: 800;
    pointer-events: none;
}

.hud-item {
    text-align: center;
}

.hud-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 2px;
}

.hud-value {
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

/* ============================================
   ANIMATIONS
   ============================================ */
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}

.editing-mode #rightPanel,
.editing-mode #leftPanel,
.editing-mode #minimap,
.editing-mode #bottomBar {
    display: flex;
}

.playing-mode #leftPanel,
.playing-mode #rightPanel,
.playing-mode #minimap {
    display: none !important;
}

/* 閲覧モード（見るだけ）: パレットは操作不可の見た目 */
body.preview-mode #editorToolsBar,
body.preview-mode .palette-categories,
body.preview-mode .palette-grid {
    pointer-events: none;
    opacity: 0.55;
    filter: grayscale(0.25);
}
body.preview-mode #propertiesPanel input,
body.preview-mode #propertiesPanel select {
    pointer-events: none;
    opacity: 0.65;
}
body.preview-mode #btnUndo,
body.preview-mode #btnRedo {
    pointer-events: none;
    opacity: 0.45;
}

/* ============================================
   STAGE LIST MODAL
   ============================================ */
.stage-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
}

.stage-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
}

.stage-list-item:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
}

.stage-list-item .stage-thumb {
    width: 80px;
    height: 48px;
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    overflow: hidden;
}

.stage-list-item .stage-info {
    flex: 1;
}

.stage-list-item .stage-name {
    font-size: 14px;
    font-weight: 600;
}

.stage-list-item .stage-meta {
    font-size: 11px;
    color: var(--ui-text-dim);
    margin-top: 2px;
}

/* ============================================
   SCROLLBAR GLOBAL
   ============================================ */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.2);
}

/* Tab bar for editor tools */
.editor-tools-bar {
    display: flex;
    padding: 6px 8px;
    gap: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.editor-tool-btn {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ui-text-dim);
    cursor: pointer;
    transition: all var(--transition);
}

.editor-tool-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--ui-text);
}

.editor-tool-btn.active {
    background: rgba(233,69,96,0.2);
    border-color: var(--ui-accent);
    color: var(--ui-accent);
}

.editor-tool-btn .tool-icon {
    font-size: 18px;
    display: block;
    margin-bottom: 2px;
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen">
    <h1>SUPER STAGE MAKER</h1>
    <div class="loading-bar-container">
        <div class="loading-bar" id="loadingBar"></div>
    </div>
    <div class="loading-text" id="loadingText">初期化中...</div>
</div>

<!-- Main Game Container -->
<div id="gameContainer">
    <canvas id="mainCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>
</div>

<!-- Top Toolbar -->
<div id="topToolbar">
    <div class="logo">★ STAGE MAKER</div>
    <div class="toolbar-separator"></div>

    <button class="toolbar-btn active" id="btnEdit" title="エディタモード (E)">
        <span class="icon">✏️</span> エディタ
    </button>
    <button class="toolbar-btn" id="btnPreview" title="閲覧モード・見るだけ (V)">
        <span class="icon">👁</span> 見るだけ
    </button>
    <button class="toolbar-btn play-btn" id="btnPlay" title="プレイ (P)">

// SECTION 2: AUDIO ENGINE (Procedural Sound)
// ============================================

class AudioEngine {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        this.masterGain = null;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.3;
            this.masterGain.connect(this.ctx.destination);
            this.initialized = true;
        } catch(e) {
            console.warn('AudioContext not available');
            this.enabled = false;
        }
    }

    resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, duration, type = 'square', volume = 0.3) {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(this.ctx.currentTime);
        osc.stop(this.ctx.currentTime + duration);
    }

    playJump() {
        this.playTone(350, 0.1, 'square', 0.2);
        setTimeout(() => this.playTone(500, 0.1, 'square', 0.15), 50);
    }

    playCoin() {
        this.playTone(988, 0.05, 'square', 0.2);
        setTimeout(() => this.playTone(1319, 0.15, 'square', 0.2), 60);
    }

    playStomp() {
        this.playTone(400, 0.05, 'square', 0.25);
        setTimeout(() => this.playTone(600, 0.08, 'square', 0.2), 30);
    }

    playPowerUp() {
        const notes = [523, 659, 784, 1047];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 0.1, 'square', 0.2), i * 80);
        });
    }

    playDeath() {
        const notes = [494, 440, 370, 330, 262, 196];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 0.15, 'triangle', 0.25), i * 120);
        });
    }

    playHit() {
        this.playTone(200, 0.08, 'sawtooth', 0.2);
    }

    playBrick() {
        this.playTone(180, 0.06, 'square', 0.25);
    }

    playSpring() {
        this.playTone(300, 0.05, 'square', 0.2);
        setTimeout(() => this.playTone(700, 0.1, 'square', 0.2), 40);
        setTimeout(() => this.playTone(1100, 0.08, 'square', 0.15), 80);
    }

    playGoal() {
        const notes = [523, 659, 784, 1047, 784, 1047, 1319];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 0.2, 'square', 0.2), i * 100);
        });
    }

    playPlace() {
        this.playTone(600, 0.04, 'sine', 0.15);
    }

    playErase() {
        this.playTone(300, 0.04, 'sine', 0.1);
    }

    playCheckpoint() {
        this.playTone(660, 0.1, 'square', 0.2);
        setTimeout(() => this.playTone(880, 0.15, 'square', 0.2), 100);
    }

    playOneUp() {
        const notes = [330,392,523,659,784,1047];
        notes.forEach((n,i) => {
            setTimeout(() => this.playTone(n, 0.08, 'square', 0.18), i*60);
        });
    }

    playFireball() {
        this.playTone(800, 0.03, 'sawtooth', 0.15);
        setTimeout(() => this.playTone(500, 0.05, 'sawtooth', 0.1), 30);
    }
}

class SpriteGenerator {

    // Create an offscreen canvas for tile rendering
    createCanvas(w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        return c;
    }

    getCachedTile(type, theme, variant = 0) {
        const key = `${type}_${theme}_${variant}`;
        if (this.cache.has(key)) return this.cache.get(key);
        const canvas = this.renderTile(type, theme, variant);
        this.cache.set(key, canvas);
        return canvas;
    }

    clearCache() {
        this.cache.clear();
    }

    // ====== TILE DRAWING METHODS ======

    drawGround(ctx, S, T, type) {
        // Beautiful gradient ground with detail
        const isTop = (type === TILE_TYPES.GROUND_TOP || type === TILE_TYPES.GROUND);
        const grad = ctx.createLinearGradient(0, 0, 0, S);

        if (isTop) {
            grad.addColorStop(0, T.groundTopColor);
            grad.addColorStop(0.25, T.groundTopDarkColor);
            grad.addColorStop(0.25, T.groundColor);
            grad.addColorStop(1, T.groundDarkColor);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, S, S);
            // Grass detail on top
            ctx.fillStyle = T.groundTopColor;
            for (let x = 0; x < S; x += 4) {
                const h = 2 + Math.sin(x * 0.8) * 2;
                ctx.fillRect(x, 0, 3, h);
            }
        } else {
            grad.addColorStop(0, T.groundColor);
            grad.addColorStop(1, T.groundDarkColor);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, S, S);
        }

        // Subtle texture
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        for (let i = 0; i < 6; i++) {
            const x = (i * 7 + 3) % S;
            const y = (i * 11 + 5) % S;
            ctx.fillRect(x, y, 2, 2);
        }

        // Edge highlights
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(0, 0, S, 1);
        ctx.fillRect(0, 0, 1, S);
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(S-1, 0, 1, S);
        ctx.fillRect(0, S-1, S, 1);
    }

    drawBrick(ctx, S, T) {
        // Base
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, T.brickColor);
        grad.addColorStop(1, T.brickDarkColor);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Brick pattern
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        // Horizontal lines
        ctx.beginPath();
        ctx.moveTo(0, S/2); ctx.lineTo(S, S/2);
        ctx.stroke();
        // Vertical lines (offset per row)
        ctx.beginPath();
        ctx.moveTo(S/2, 0); ctx.lineTo(S/2, S/2);
        ctx.moveTo(0, S/2); ctx.lineTo(0, S);
        ctx.moveTo(S, S/2); ctx.lineTo(S, S);
        ctx.moveTo(S/4, S/2); ctx.lineTo(S/4, S);
        ctx.moveTo(S*3/4, S/2); ctx.lineTo(S*3/4, S);
        ctx.stroke();

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(1, 1, S/2-2, S/2-2);
        ctx.fillRect(S/4+1, S/2+1, S/2-2, S/2-2);

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.fillRect(S-1, 0, 1, S);
        ctx.fillRect(0, S-1, S, 1);
    }

    drawQuestion(ctx, S, T, variant) {
        // Animated: variant controls brightness
        const pulse = 0.8 + 0.2 * Math.sin(variant * 0.15);
        const r = Math.floor(255 * pulse);
        const g = Math.floor(200 * pulse);
        const b = Math.floor(50 * pulse);

        // Base
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, `rgb(${r},${g},${b})`);
        grad.addColorStop(1, `rgb(${Math.floor(r*0.7)},${Math.floor(g*0.7)},${Math.floor(b*0.7)})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Border
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, S-2, S-2);

        // Inner border highlight
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(2, 2, S-4, 2);
        ctx.fillRect(2, 2, 2, S-4);

        // ? mark
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 2;
        ctx.font = `bold ${S*0.6}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', S/2, S/2 + 1);
        ctx.shadowBlur = 0;

        // Rivet corners
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        const rv = 3;
        ctx.beginPath(); ctx.arc(5, 5, rv, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(S-5, 5, rv, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(5, S-5, rv, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(S-5, S-5, rv, 0, Math.PI*2); ctx.fill();
    }

    drawHardBlock(ctx, S, T) {
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#888');
        grad.addColorStop(1, '#555');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // X pattern
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(S, S);
        ctx.moveTo(S, 0); ctx.lineTo(0, S);
        ctx.stroke();

        // Border
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, 0, S, 2);
        ctx.fillRect(0, 0, 2, S);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(S-2, 0, 2, S);
        ctx.fillRect(0, S-2, S, 2);
    }

    drawPipe(ctx, S, type) {
        const isTop = (type === TILE_TYPES.PIPE_TL || type === TILE_TYPES.PIPE_TR);
        const isLeft = (type === TILE_TYPES.PIPE_TL || type === TILE_TYPES.PIPE_BL);

        // Main color
        const grad = ctx.createLinearGradient(0, 0, S, 0);
        grad.addColorStop(0, '#1fa834');
        grad.addColorStop(0.3, '#4ee860');
        grad.addColorStop(0.7, '#2cb83e');
        grad.addColorStop(1, '#188828');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        if (isTop) {
            // Lip of the pipe
            const lipGrad = ctx.createLinearGradient(0, 0, S, 0);
            lipGrad.addColorStop(0, '#168828');
            lipGrad.addColorStop(0.3, '#4ee860');
            lipGrad.addColorStop(0.7, '#2cb83e');
            lipGrad.addColorStop(1, '#0e6820');
            ctx.fillStyle = lipGrad;
            ctx.fillRect(isLeft ? 0 : 0, 0, S, S * 0.4);

            // Lip border
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0, S * 0.38, S, 2);

            // Extra highlight on top
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(isLeft ? 0 : 0, 0, S, 3);
        }

        // Shine line
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(S * 0.25, isTop ? S * 0.42 : 0, 3, isTop ? S * 0.58 : S);

        // Border
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        if (isLeft) {
            ctx.fillRect(0, 0, 2, S);
        } else {
            ctx.fillRect(S-2, 0, 2, S);
        }
    }

    drawCoin(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const shimmer = Math.sin(variant * 0.2) * 0.3;
        const scaleX = 0.6 + 0.4 * Math.abs(Math.cos(variant * 0.1));

        ctx.save();
        ctx.translate(S/2, S/2);
        ctx.scale(scaleX, 1);

        // Outer glow
        const glowGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 12);
        glowGrad.addColorStop(0, `rgba(255,220,50,${0.5 + shimmer})`);
        glowGrad.addColorStop(1, 'rgba(255,220,50,0)');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(-14, -14, 28, 28);

        // Coin body
        const coinGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, 10);
        coinGrad.addColorStop(0, '#FFE878');
        coinGrad.addColorStop(0.6, '#FFC800');
        coinGrad.addColorStop(1, '#CC9900');
        ctx.fillStyle = coinGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();

        // Inner ring
        ctx.strokeStyle = 'rgba(200,150,0,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.stroke();

        // $ symbol or star
        ctx.fillStyle = '#CC9900';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', 0, 1);

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(-3, -4, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    drawSpike(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Base
        ctx.fillStyle = '#888';
        ctx.fillRect(0, S * 0.7, S, S * 0.3);

        // Spikes
        const spikeGrad = ctx.createLinearGradient(0, 0, 0, S * 0.7);
        spikeGrad.addColorStop(0, '#ddd');
        spikeGrad.addColorStop(1, '#888');

        for (let i = 0; i < 4; i++) {
            const x = i * S / 4 + S / 8;
            ctx.fillStyle = spikeGrad;
            ctx.beginPath();
            ctx.moveTo(x - S/8, S * 0.7);
            ctx.lineTo(x, S * 0.15);
            ctx.lineTo(x + S/8, S * 0.7);
            ctx.fill();

            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.moveTo(x - S/16, S * 0.5);
            ctx.lineTo(x, S * 0.15);
            ctx.lineTo(x + 1, S * 0.5);
            ctx.fill();
        }
    }

    drawPlatformWood(ctx, S, T) {
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#C0884A');
        grad.addColorStop(0.15, '#A07040');
        grad.addColorStop(0.3, '#B07848');
        grad.addColorStop(1, '#906838');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Wood grain
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 1;
        for (let y = 4; y < S; y += 6) {
            ctx.beginPath();
            ctx.moveTo(0, y + Math.sin(y) * 2);
            ctx.lineTo(S, y + Math.cos(y) * 2);
            ctx.stroke();
        }

        // Top highlight
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, 0, S, 3);
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, S-2, S, 2);
    }

    drawPlatformStone(ctx, S, T) {
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#AAA');
        grad.addColorStop(1, '#777');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, 0, S, 2);
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, S-2, S, 2);

        // Stone texture
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        for (let i = 0; i < 8; i++) {
            ctx.fillRect((i*5+2)%S, (i*7+3)%S, 3, 2);
        }
    }

    drawCloudPlatform(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Fluffy cloud
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.1)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;
        ctx.beginPath();
        ctx.arc(S/2, S/2, S*0.4, 0, Math.PI*2);
        ctx.arc(S*0.25, S*0.55, S*0.25, 0, Math.PI*2);
        ctx.arc(S*0.75, S*0.55, S*0.25, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Subtle shading
        ctx.fillStyle = 'rgba(180,220,255,0.3)';
        ctx.beginPath();
        ctx.arc(S/2, S*0.6, S*0.3, 0, Math.PI);
        ctx.fill();
    }

    drawBridge(ctx, S, T) {
        ctx.clearRect(0, 0, S, S);
        // Planks
        ctx.fillStyle = '#A07848';
        ctx.fillRect(0, 2, S, S * 0.35);

        // Plank lines
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        for (let x = 0; x < S; x += 8) {
            ctx.beginPath();
            ctx.moveTo(x, 2);
            ctx.lineTo(x, 2 + S * 0.35);
            ctx.stroke();
        }

        // Rope below
        ctx.strokeStyle = '#886';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, S * 0.5);
        ctx.quadraticCurveTo(S/2, S * 0.65, S, S * 0.5);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, 2, S, 2);
    }

    drawWater(ctx, S, T, isTop, variant) {
        if (isTop) {
            ctx.fillStyle = 'rgba(30,100,200,0.5)';
            ctx.fillRect(0, S/2, S, S/2);

            // Wave
            const waveGrad = ctx.createLinearGradient(0, 0, 0, S);
            waveGrad.addColorStop(0, 'rgba(100,180,255,0)');
            waveGrad.addColorStop(0.4, 'rgba(100,180,255,0.3)');
            waveGrad.addColorStop(0.5, 'rgba(60,140,230,0.6)');
            waveGrad.addColorStop(1, 'rgba(30,100,200,0.5)');
            ctx.fillStyle = waveGrad;
            ctx.fillRect(0, 0, S, S);

            // Wave lines
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x <= S; x += 2) {
                const y = S * 0.4 + Math.sin((x + variant * 3) * 0.15) * 4;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        } else {
            ctx.fillStyle = 'rgba(20,80,180,0.55)';
            ctx.fillRect(0, 0, S, S);

            // Subtle bubbles
            ctx.fillStyle = 'rgba(100,180,255,0.15)';
            const bx = (variant * 7 + 10) % S;
            const by = (variant * 3 + 5) % S;
            ctx.beginPath();
            ctx.arc(bx, by, 2, 0, Math.PI*2);
            ctx.fill();
        }
    }

    drawLava(ctx, S, T, isTop, variant) {
        if (isTop) {
            const grad = ctx.createLinearGradient(0, 0, 0, S);
            grad.addColorStop(0, 'rgba(255,200,0,0.7)');
            grad.addColorStop(0.3, 'rgba(255,100,0,0.8)');
            grad.addColorStop(1, 'rgba(200,50,0,0.9)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, S, S);

            // Glow wave
            ctx.strokeStyle = 'rgba(255,255,100,0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let x = 0; x <= S; x += 2) {
                const y = S * 0.3 + Math.sin((x + variant * 4) * 0.2) * 5;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        } else {
            const grad = ctx.createLinearGradient(0, 0, 0, S);
            grad.addColorStop(0, 'rgba(220,60,0,0.85)');
            grad.addColorStop(1, 'rgba(180,30,0,0.9)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, S, S);

            // Bubbles
            ctx.fillStyle = 'rgba(255,200,50,0.3)';
            const bx = (variant * 11 + 8) % S;
            const by = (variant * 5 + 3) % S;
            ctx.beginPath();
            ctx.arc(bx, by, 3, 0, Math.PI*2);
            ctx.fill();
        }
    }

    drawVine(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Stem
        ctx.fillStyle = '#2a8a2a';
        ctx.fillRect(S/2 - 3, 0, 6, S);

        // Leaves
        ctx.fillStyle = '#3ab83a';
        // Left leaf
        ctx.beginPath();
        ctx.ellipse(S/2 - 8, S * 0.3, 7, 4, -0.3, 0, Math.PI*2);
        ctx.fill();
        // Right leaf
        ctx.beginPath();
        ctx.ellipse(S/2 + 8, S * 0.7, 7, 4, 0.3, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(S/2 - 3, 0, 2, S);
    }

    drawLadder(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Side rails
        ctx.fillStyle = '#A07040';
        ctx.fillRect(4, 0, 4, S);
        ctx.fillRect(S - 8, 0, 4, S);

        // Rungs
        ctx.fillStyle = '#B88050';
        ctx.fillRect(4, 4, S - 8, 3);
        ctx.fillRect(4, S/2 - 1, S - 8, 3);
        ctx.fillRect(4, S - 7, S - 8, 3);

        // Highlights
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(4, 0, 2, S);
    }

    drawIce(ctx, S) {
        const grad = ctx.createLinearGradient(0, 0, S, S);
        grad.addColorStop(0, '#B0E0FF');
        grad.addColorStop(0.5, '#88CCF0');
        grad.addColorStop(1, '#70B8E8');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(4, 4);
        ctx.lineTo(12, 4);
        ctx.lineTo(4, 12);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.moveTo(S-10, S-10);
        ctx.lineTo(S-4, S-10);
        ctx.lineTo(S-10, S-4);
        ctx.fill();

        // Border
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 1;
        ctx.strokeRect(0.5, 0.5, S-1, S-1);
    }

    drawSand(ctx, S) {
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#E8C878');
        grad.addColorStop(1, '#D0A850');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, S, S);

        // Sand dots
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        for (let i = 0; i < 12; i++) {
            const x = (i * 7 + 3) % S;
            const y = (i * 11 + 2) % S;
            ctx.fillRect(x, y, 1, 1);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(0, 0, S, 2);
    }

    drawSlope(ctx, S, dir) {
        ctx.clearRect(0, 0, S, S);
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#5DAA3A');
        grad.addColorStop(0.3, '#8B5E3C');
        grad.addColorStop(1, '#6B4226');
        ctx.fillStyle = grad;
        ctx.beginPath();
        if (dir === 'left') {
            ctx.moveTo(S, 0);
            ctx.lineTo(S, S);
            ctx.lineTo(0, S);
        } else {
            ctx.moveTo(0, 0);
            ctx.lineTo(S, S);
            ctx.lineTo(0, S);
        }
        ctx.fill();

        // Top edge highlight
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (dir === 'left') {
            ctx.moveTo(S, 0);
            ctx.lineTo(0, S);
        } else {
            ctx.moveTo(0, 0);
            ctx.lineTo(S, S);
        }
        ctx.stroke();
    }

    drawSpring(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const compress = variant ? 0.7 : 1.0;

        // Base
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(4, S - 6, S - 8, 6);

        // Coil
        ctx.strokeStyle = '#AAA';
        ctx.lineWidth = 3;
        const coilTop = S * (1 - 0.6 * compress);
        for (let i = 0; i < 4; i++) {
            const y1 = S - 6 - (S - 6 - coilTop) * (i / 4);
            const y2 = S - 6 - (S - 6 - coilTop) * ((i + 0.5) / 4);
            ctx.beginPath();
            ctx.moveTo(6, y1);
            ctx.lineTo(S - 6, y2);
            ctx.stroke();
        }

        // Top plate
        ctx.fillStyle = '#FF4444';
        const topY = coilTop - 4;
        ctx.fillRect(2, topY, S - 4, 6);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(2, topY, S - 4, 2);
    }

    drawConveyor(ctx, S, dir, variant) {
        // Belt
        ctx.fillStyle = '#666';
        ctx.fillRect(0, S*0.3, S, S*0.4);

        // Rollers at ends
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.arc(4, S*0.5, 4, 0, Math.PI*2);
        ctx.arc(S-4, S*0.5, 4, 0, Math.PI*2);
        ctx.fill();

        // Arrow indicators
        ctx.fillStyle = '#FFD700';
        const offset = (variant * 3) % 16;
        for (let x = -16 + offset; x < S + 16; x += 16) {
            ctx.beginPath();
            if (dir === 'left') {
                ctx.moveTo(x + 6, S*0.4);
                ctx.lineTo(x, S*0.5);
                ctx.lineTo(x + 6, S*0.6);
            } else {
                ctx.moveTo(x - 6, S*0.4);
                ctx.lineTo(x, S*0.5);
                ctx.lineTo(x - 6, S*0.6);
            }
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(0, S*0.3, S, 2);
    }

    drawDoor(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Door frame
        ctx.fillStyle = '#8B6914';
        ctx.fillRect(2, 0, S-4, S);

        // Door body
        const grad = ctx.createLinearGradient(4, 0, S-4, 0);
        grad.addColorStop(0, '#B8860B');
        grad.addColorStop(0.5, '#DAA520');
        grad.addColorStop(1, '#B8860B');
        ctx.fillStyle = grad;
        ctx.fillRect(4, 2, S-8, S-2);

        // Panels
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(7, 5, S-14, S*0.35);
        ctx.strokeRect(7, S*0.5, S-14, S*0.35);

        // Knob
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(S*0.7, S*0.55, 3, 0, Math.PI*2);
        ctx.fill();
    }

    drawKey(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const bob = Math.sin(variant * 0.1) * 2;

        ctx.save();
        ctx.translate(S/2, S/2 + bob);

        // Key bow (circle part)
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#DAA520';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -4, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        // Key shaft
        ctx.fillRect(-2, 3, 4, 10);

        // Teeth
        ctx.fillRect(2, 9, 4, 3);
        ctx.fillRect(2, 6, 3, 3);

        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(-2, -6, 3, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    drawCheckpoint(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        // Pole
        ctx.fillStyle = '#888';
        ctx.fillRect(S/2 - 2, 4, 4, S - 4);

        // Flag
        const flagColor = variant ? '#4ade80' : '#ffd700';
        ctx.fillStyle = flagColor;
        ctx.beginPath();
        ctx.moveTo(S/2 + 2, 4);
        ctx.lineTo(S - 4, 10);
        ctx.lineTo(S/2 + 2, 16);
        ctx.fill();

        // Base
        ctx.fillStyle = '#666';
        ctx.fillRect(S/2 - 6, S - 6, 12, 6);
    }

    drawGoal(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        // Pole
        ctx.fillStyle = '#444';
        ctx.fillRect(S/2 - 2, 0, 4, S);

        // Flag top
        const wave = Math.sin(variant * 0.15) * 3;
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.moveTo(S/2 + 2, 2);
        ctx.lineTo(S - 2 + wave, 8);
        ctx.lineTo(S/2 + 2, 14);
        ctx.fill();

        // Star on top
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        this.drawStarShape(ctx, S/2, 2, 4, 2, 5);
        ctx.fill();

        // Base
        ctx.fillStyle = '#666';
        ctx.fillRect(S/2 - 8, S - 4, 16, 4);
    }

    drawPlayerSpawn(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Arrow down indicator
        ctx.fillStyle = 'rgba(74,222,128,0.3)';
        ctx.fillRect(0, 0, S, S);

        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.moveTo(S/2, S - 4);
        ctx.lineTo(S - 6, S/2);
        ctx.lineTo(S/2 + 4, S/2);
        ctx.lineTo(S/2 + 4, 4);
        ctx.lineTo(S/2 - 4, 4);
        ctx.lineTo(S/2 - 4, S/2);
        ctx.lineTo(6, S/2);
        ctx.fill();

        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 1;
        ctx.strokeRect(1, 1, S-2, S-2);
    }

    // ====== ENEMY DRAWING ======

    drawGoomba(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const walk = variant % 2;

        // Body
        const grad = ctx.createRadialGradient(S/2, S*0.55, 2, S/2, S*0.55, S*0.4);
        grad.addColorStop(0, '#D4884A');
        grad.addColorStop(1, '#A06030');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.55, S*0.38, S*0.35, 0, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(S*0.38, S*0.42, 4, 5, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.62, S*0.42, 4, 5, 0, 0, Math.PI*2);
        ctx.fill();

        // Pupils
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.4, S*0.43, 2, 0, Math.PI*2);
        ctx.arc(S*0.6, S*0.43, 2, 0, Math.PI*2);
        ctx.fill();

        // Eyebrows (angry)
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(S*0.28, S*0.32);
        ctx.lineTo(S*0.42, S*0.36);
        ctx.moveTo(S*0.72, S*0.32);
        ctx.lineTo(S*0.58, S*0.36);
        ctx.stroke();

        // Mouth
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.6, 5, 3, 0, 0, Math.PI);
        ctx.fill();

        // Feet
        ctx.fillStyle = '#333';
        const footOffset = walk ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(S*0.35 + footOffset, S*0.85, 6, 4, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.65 - footOffset, S*0.85, 6, 4, 0, 0, Math.PI*2);
        ctx.fill();
    }

    drawKoopa(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const walk = variant % 2;

        // Shell
        const shellGrad = ctx.createRadialGradient(S/2, S*0.55, 2, S/2, S*0.55, S*0.35);
        shellGrad.addColorStop(0, '#50D050');
        shellGrad.addColorStop(1, '#208820');
        ctx.fillStyle = shellGrad;
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.55, S*0.35, S*0.3, 0, 0, Math.PI*2);
        ctx.fill();

        // Shell pattern
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(S/2, S*0.28);
        ctx.lineTo(S/2, S*0.82);
        ctx.stroke();

        // Head
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(S*0.35, S*0.3, 7, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.3, S*0.27, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.28, S*0.27, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Feet
        ctx.fillStyle = '#FFD700';
        const fOff = walk ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(S*0.35 + fOff, S*0.82, 5, 3, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.6 - fOff, S*0.82, 5, 3, 0, 0, Math.PI*2);
        ctx.fill();
    }

    drawPiranha(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const openMouth = variant % 2;

        // Stem
        ctx.fillStyle = '#2a8a2a';
        ctx.fillRect(S/2 - 3, S*0.5, 6, S*0.5);

        // Head
        const headGrad = ctx.createRadialGradient(S/2, S*0.35, 2, S/2, S*0.35, 12);
        headGrad.addColorStop(0, '#FF4444');
        headGrad.addColorStop(1, '#CC2222');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.35, 12, 10, 0, 0, Math.PI*2);
        ctx.fill();

        // White spots
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(S*0.35, S*0.3, 3, 0, Math.PI*2);
        ctx.arc(S*0.6, S*0.25, 2, 0, Math.PI*2);
        ctx.fill();

        // Mouth / teeth
        if (openMouth) {
            ctx.fillStyle = '#800';
            ctx.beginPath();
            ctx.ellipse(S/2, S*0.4, 8, 4, 0, 0, Math.PI);
            ctx.fill();

            ctx.fillStyle = '#fff';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(S*0.32 + i*6, S*0.38);
                ctx.lineTo(S*0.35 + i*6, S*0.44);
                ctx.lineTo(S*0.38 + i*6, S*0.38);
                ctx.fill();
            }
        }

        // Leaves
        ctx.fillStyle = '#3ab83a';
        ctx.beginPath();
        ctx.ellipse(S/2 - 8, S*0.5, 5, 3, -0.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(S/2 + 8, S*0.5, 5, 3, 0.5, 0, Math.PI*2);
        ctx.fill();
    }

    drawThwomp(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Body
        const grad = ctx.createLinearGradient(0, 0, 0, S);
        grad.addColorStop(0, '#AAA');
        grad.addColorStop(1, '#666');
        ctx.fillStyle = grad;
        ctx.fillRect(2, 2, S-4, S-4);

        // Rocky texture
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(8, 8); ctx.lineTo(S-8, S*0.4);
        ctx.moveTo(4, S*0.6); ctx.lineTo(S-4, S*0.7);
        ctx.stroke();

        // Angry eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(S*0.2, S*0.3, 8, 8);
        ctx.fillRect(S*0.6, S*0.3, 8, 8);

        ctx.fillStyle = '#f00';
        ctx.fillRect(S*0.24, S*0.34, 4, 4);
        ctx.fillRect(S*0.64, S*0.34, 4, 4);

        // Mouth
        ctx.fillStyle = '#333';
        ctx.fillRect(S*0.25, S*0.6, S*0.5, 4);

        // Spiky edges
        ctx.fillStyle = '#888';
        for (let i = 0; i < 4; i++) {
            const x = 4 + i * (S-8) / 3;
            ctx.beginPath();
            ctx.moveTo(x, S-2);
            ctx.lineTo(x + (S-8)/6, S + 4);
            ctx.lineTo(x + (S-8)/3, S-2);
            ctx.fill();
        }
    }

    drawBoo(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const alpha = 0.7 + Math.sin(variant * 0.1) * 0.2;

        ctx.globalAlpha = alpha;

        // Body
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.45, S*0.4, S*0.35, 0, 0, Math.PI*2);
        ctx.fill();

        // Tail
        ctx.beginPath();
        ctx.moveTo(S*0.7, S*0.55);
        ctx.quadraticCurveTo(S*0.9, S*0.65, S*0.8, S*0.8);
        ctx.quadraticCurveTo(S*0.7, S*0.7, S*0.65, S*0.6);
        ctx.fill();

        // Shadow
        ctx.fillStyle = 'rgba(200,200,220,0.5)';
        ctx.beginPath();
        ctx.ellipse(S*0.55, S*0.55, S*0.25, S*0.2, 0, 0, Math.PI);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(S*0.38, S*0.38, 4, 5, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.58, S*0.38, 4, 5, 0, 0, Math.PI*2);
        ctx.fill();

        // Mouth
        ctx.beginPath();
        ctx.arc(S*0.48, S*0.55, 6, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // Teeth
        ctx.fillStyle = '#fff';
        ctx.fillRect(S*0.42, S*0.52, 3, 4);
        ctx.fillRect(S*0.48, S*0.54, 3, 3);

        ctx.globalAlpha = 1;
    }

    drawBulletBill(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Body
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.ellipse(S/2, S/2, S*0.4, S*0.35, 0, 0, Math.PI*2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.ellipse(S*0.75, S/2, S*0.15, S*0.28, 0, 0, Math.PI*2);
        ctx.fill();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.55, S*0.4, 4, 0, Math.PI*2);
        ctx.fill();

        // Bullet Bill - arm band / belt
        ctx.fillStyle = '#555';
        ctx.fillRect(S*0.25, S*0.32, 4, S*0.36);

        // Highlight on body
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.ellipse(S*0.45, S*0.38, 6, 4, -0.3, 0, Math.PI*2);
        ctx.fill();
    }

    drawHammerBro(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const frame = variant % 2;

        // Body (green shell)
        const shellGrad = ctx.createRadialGradient(S/2, S*0.6, 2, S/2, S*0.6, S*0.32);
        shellGrad.addColorStop(0, '#48C848');
        shellGrad.addColorStop(1, '#1A881A');
        ctx.fillStyle = shellGrad;
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.6, S*0.32, S*0.28, 0, 0, Math.PI*2);
        ctx.fill();

        // Belly
        ctx.fillStyle = '#F5DEB3';
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.63, S*0.18, S*0.16, 0, 0, Math.PI*2);
        ctx.fill();

        // Head / helmet
        ctx.fillStyle = '#2A8A2A';
        ctx.beginPath();
        ctx.arc(S/2, S*0.28, 9, 0, Math.PI*2);
        ctx.fill();

        // Face
        ctx.fillStyle = '#F5DEB3';
        ctx.beginPath();
        ctx.arc(S/2, S*0.32, 6, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.42, S*0.3, 2.5, 0, Math.PI*2);
        ctx.arc(S*0.58, S*0.3, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.43, S*0.3, 1.2, 0, Math.PI*2);
        ctx.arc(S*0.57, S*0.3, 1.2, 0, Math.PI*2);
        ctx.fill();

        // Hammer (alternates position based on frame)
        ctx.fillStyle = '#8B4513';
        if (frame === 0) {
            ctx.fillRect(S*0.65, S*0.05, 3, 18);
            ctx.fillStyle = '#888';
            ctx.fillRect(S*0.6, S*0.02, 12, 8);
        } else {
            ctx.fillRect(S*0.6, S*0.1, 3, 16);
            ctx.fillStyle = '#888';
            ctx.fillRect(S*0.55, S*0.02, 12, 8);
        }

        // Feet
        ctx.fillStyle = '#F5DEB3';
        const fOff = frame ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(S*0.37 + fOff, S*0.88, 6, 4, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.63 - fOff, S*0.88, 6, 4, 0, 0, Math.PI*2);
        ctx.fill();
    }

    drawLakitu(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);

        // Cloud
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.15)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;
        ctx.beginPath();
        ctx.arc(S/2, S*0.7, 10, 0, Math.PI*2);
        ctx.arc(S*0.35, S*0.72, 7, 0, Math.PI*2);
        ctx.arc(S*0.65, S*0.72, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Cloud face (eyes)
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.42, S*0.72, 1.5, 0, Math.PI*2);
        ctx.arc(S*0.58, S*0.72, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Lakitu body
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.42, 8, 7, 0, 0, Math.PI*2);
        ctx.fill();

        // Shell on head (green)
        ctx.fillStyle = '#2A8A2A';
        ctx.beginPath();
        ctx.arc(S/2, S*0.32, 7, Math.PI, Math.PI*2);
        ctx.fill();

        // Goggles
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(S*0.42, S*0.38, 4, 3, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.58, S*0.38, 4, 3, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.43, S*0.39, 1.5, 0, Math.PI*2);
        ctx.arc(S*0.57, S*0.39, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Goggle frame
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(S*0.42, S*0.38, 4, 3, 0, 0, Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(S*0.58, S*0.38, 4, 3, 0, 0, Math.PI*2);
        ctx.stroke();

        // Mouth
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S/2, S*0.47, 3, 0, Math.PI);
        ctx.fill();

        // Hands holding spiny egg (optional bobbing)
        const bobVal = Math.sin(variant * 0.15) * 2;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(S*0.35, S*0.52 + bobVal, 3, 0, Math.PI*2);
        ctx.arc(S*0.65, S*0.52 + bobVal, 3, 0, Math.PI*2);
        ctx.fill();
    }

    drawBuzzyBeetle(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const walk = variant % 2;

        // Shell (dark blue)
        const shellGrad = ctx.createRadialGradient(S/2, S*0.55, 2, S/2, S*0.55, S*0.38);
        shellGrad.addColorStop(0, '#4466AA');
        shellGrad.addColorStop(1, '#223366');
        ctx.fillStyle = shellGrad;
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.55, S*0.38, S*0.32, 0, 0, Math.PI*2);
        ctx.fill();

        // Shell highlight
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.ellipse(S*0.4, S*0.42, 6, 4, -0.5, 0, Math.PI*2);
        ctx.fill();

        // Eyes peeking out
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.35, S*0.5, 3, 0, Math.PI*2);
        ctx.arc(S*0.5, S*0.48, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.34, S*0.5, 1.5, 0, Math.PI*2);
        ctx.arc(S*0.49, S*0.48, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Feet
        ctx.fillStyle = '#D4884A';
        const off = walk ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(S*0.35 + off, S*0.84, 5, 3, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.62 - off, S*0.84, 5, 3, 0, 0, Math.PI*2);
        ctx.fill();
    }

    drawSpiny(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const walk = variant % 2;

        // Body (red shell)
        const shellGrad = ctx.createRadialGradient(S/2, S*0.6, 2, S/2, S*0.6, S*0.35);
        shellGrad.addColorStop(0, '#FF6644');
        shellGrad.addColorStop(1, '#CC3322');
        ctx.fillStyle = shellGrad;
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.6, S*0.35, S*0.28, 0, 0, Math.PI*2);
        ctx.fill();

        // Spines on top
        ctx.fillStyle = '#FFD700';
        const spinePositions = [
            {x: S*0.3, y: S*0.35},
            {x: S*0.45, y: S*0.28},
            {x: S*0.6, y: S*0.3},
            {x: S*0.72, y: S*0.38},
            {x: S*0.25, y: S*0.5},
            {x: S*0.75, y: S*0.5},
        ];
        spinePositions.forEach(sp => {
            ctx.beginPath();
            ctx.moveTo(sp.x, sp.y);
            ctx.lineTo(sp.x - 2, sp.y + 5);
            ctx.lineTo(sp.x + 2, sp.y + 5);
            ctx.fill();
        });

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.4, S*0.55, 3, 0, Math.PI*2);
        ctx.arc(S*0.55, S*0.53, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.39, S*0.55, 1.5, 0, Math.PI*2);
        ctx.arc(S*0.54, S*0.53, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Feet
        ctx.fillStyle = '#D4884A';
        const fOff = walk ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(S*0.38 + fOff, S*0.86, 5, 3, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.62 - fOff, S*0.86, 5, 3, 0, 0, Math.PI*2);
        ctx.fill();
    }

    drawBlooper(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const squish = 1.0 + Math.sin(variant * 0.2) * 0.15;

        ctx.save();
        ctx.translate(S/2, S/2);
        ctx.scale(1, squish);
        ctx.translate(-S/2, -S/2);

        // Body (white squid)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.4, S*0.3, S*0.32, 0, 0, Math.PI*2);
        ctx.fill();

        // Top dome
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.25, S*0.22, S*0.18, 0, Math.PI, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(S*0.4, S*0.38, 3, 5, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.6, S*0.38, 3, 5, 0, 0, Math.PI*2);
        ctx.fill();

        // Eye whites (highlight)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.39, S*0.35, 1, 0, Math.PI*2);
        ctx.arc(S*0.59, S*0.35, 1, 0, Math.PI*2);
        ctx.fill();

        // Tentacles
        ctx.fillStyle = '#fff';
        const tentacleSpread = Math.sin(variant * 0.2) * 3;
        ctx.beginPath();
        ctx.moveTo(S*0.3 - tentacleSpread, S*0.55);
        ctx.quadraticCurveTo(S*0.25, S*0.75, S*0.3 - tentacleSpread * 0.5, S*0.85);
        ctx.lineTo(S*0.35, S*0.55);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(S*0.45, S*0.58);
        ctx.quadraticCurveTo(S*0.45, S*0.75, S*0.47, S*0.88);
        ctx.lineTo(S*0.53, S*0.88);
        ctx.quadraticCurveTo(S*0.55, S*0.75, S*0.55, S*0.58);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(S*0.65, S*0.55);
        ctx.quadraticCurveTo(S*0.75, S*0.75, S*0.7 + tentacleSpread * 0.5, S*0.85);
        ctx.lineTo(S*0.7 + tentacleSpread, S*0.55);
        ctx.fill();

        ctx.restore();
    }

    drawCheepCheep(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const swim = Math.sin(variant * 0.2) * 2;

        // Body
        const bodyGrad = ctx.createRadialGradient(S/2, S/2, 2, S/2, S/2, S*0.38);
        bodyGrad.addColorStop(0, '#FF8888');
        bodyGrad.addColorStop(1, '#FF4444');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(S/2, S/2, S*0.38, S*0.3, 0, 0, Math.PI*2);
        ctx.fill();

        // Tail fin
        ctx.fillStyle = '#FF6666';
        ctx.beginPath();
        ctx.moveTo(S*0.15, S*0.5);
        ctx.lineTo(S*0.02, S*0.3 + swim);
        ctx.lineTo(S*0.02, S*0.7 - swim);
        ctx.fill();

        // Dorsal fin
        ctx.fillStyle = '#FF5555';
        ctx.beginPath();
        ctx.moveTo(S*0.4, S*0.22);
        ctx.lineTo(S*0.55, S*0.1);
        ctx.lineTo(S*0.6, S*0.25);
        ctx.fill();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.6, S*0.42, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.62, S*0.42, 2.5, 0, Math.PI*2);
        ctx.fill();

        // Mouth
        ctx.strokeStyle = '#CC2222';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(S*0.72, S*0.52, 3, -0.5, 0.5);
        ctx.stroke();

        // Belly highlight
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.ellipse(S*0.52, S*0.55, S*0.2, S*0.1, 0, 0, Math.PI*2);
        ctx.fill();

        // Pectoral fin
        ctx.fillStyle = '#FF6666';
        ctx.beginPath();
        ctx.ellipse(S*0.5, S*0.6 + swim, 5, 3, 0.4 + swim * 0.05, 0, Math.PI*2);
        ctx.fill();
    }

    drawFireBar(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);

        // Center block
        ctx.fillStyle = '#888';
        ctx.fillRect(S*0.3, S*0.3, S*0.4, S*0.4);
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(S*0.3, S*0.3, S*0.4, S*0.4);

        // Fire orb indicator
        const angle = (variant * 0.08) % (Math.PI * 2);
        const orbX = S/2 + Math.cos(angle) * 10;
        const orbY = S/2 + Math.sin(angle) * 10;

        const fireGrad = ctx.createRadialGradient(orbX, orbY, 1, orbX, orbY, 6);
        fireGrad.addColorStop(0, '#FFE800');
        fireGrad.addColorStop(0.5, '#FF8800');
        fireGrad.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = fireGrad;
        ctx.beginPath();
        ctx.arc(orbX, orbY, 6, 0, Math.PI*2);
        ctx.fill();

        // Rotation arrow indicator
        ctx.strokeStyle = 'rgba(255,150,0,0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.arc(S/2, S/2, 10, 0, Math.PI * 1.5);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    drawCannon(ctx, S) {
        ctx.clearRect(0, 0, S, S);

        // Base block
        ctx.fillStyle = '#444';
        ctx.fillRect(2, S*0.5, S-4, S*0.5);

        // Cannon barrel
        const barrelGrad = ctx.createLinearGradient(0, 0, S, 0);
        barrelGrad.addColorStop(0, '#555');
        barrelGrad.addColorStop(0.5, '#777');
        barrelGrad.addColorStop(1, '#555');
        ctx.fillStyle = barrelGrad;
        ctx.fillRect(S*0.2, S*0.15, S*0.6, S*0.45);

        // Barrel opening
        ctx.fillStyle = '#222';
        ctx.fillRect(S*0.25, S*0.2, S*0.5, S*0.15);

        // Rim around barrel opening
        ctx.fillStyle = '#666';
        ctx.fillRect(S*0.15, S*0.12, S*0.7, 4);

        // Skull decoration
        ctx.fillStyle = '#AAA';
        ctx.beginPath();
        ctx.arc(S/2, S*0.65, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#444';
        ctx.beginPath();
        ctx.arc(S*0.46, S*0.63, 1.5, 0, Math.PI*2);
        ctx.arc(S*0.54, S*0.63, 1.5, 0, Math.PI*2);
        ctx.fill();

        // Metal shine
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(S*0.22, S*0.15, 3, S*0.4);

        // Bottom shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(2, S - 4, S - 4, 4);
    }

    // ====== ITEM DRAWING ======

    drawMushroom(ctx, S, color) {
        ctx.clearRect(0, 0, S, S);

        // Stem
        ctx.fillStyle = '#F5E8C8';
        ctx.fillRect(S*0.35, S*0.5, S*0.3, S*0.35);

        // Stem highlights
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(S*0.35, S*0.5, S*0.1, S*0.35);

        // Cap
        const capColor = color === 'red' ? '#FF3333' : '#33CC33';
        const capDark = color === 'red' ? '#CC0000' : '#229922';
        const capGrad = ctx.createRadialGradient(S/2, S*0.35, 2, S/2, S*0.35, S*0.38);
        capGrad.addColorStop(0, capColor);
        capGrad.addColorStop(1, capDark);
        ctx.fillStyle = capGrad;
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.38, S*0.42, S*0.25, 0, Math.PI, Math.PI*2);
        ctx.fill();
        // Bottom of cap
        ctx.beginPath();
        ctx.ellipse(S/2, S*0.38, S*0.42, S*0.08, 0, 0, Math.PI);
        ctx.fill();

        // White spots
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(S*0.35, S*0.28, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(S*0.6, S*0.22, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(S*0.5, S*0.32, 3, 0, Math.PI*2);
        ctx.fill();

        // Eyes on stem
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(S*0.42, S*0.55, 2, 3, 0, 0, Math.PI*2);
        ctx.ellipse(S*0.58, S*0.55, 2, 3, 0, 0, Math.PI*2);
        ctx.fill();

        // Cap highlight
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.ellipse(S*0.38, S*0.25, 6, 3, -0.5, 0, Math.PI*2);
        ctx.fill();
    }

    drawFireFlower(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const pulse = Math.sin(variant * 0.15) * 0.1;

        // Stem
        ctx.fillStyle = '#2A8A2A';
        ctx.fillRect(S/2 - 2, S*0.55, 4, S*0.35);

        // Leaves
        ctx.fillStyle = '#3AB83A';
        ctx.beginPath();
        ctx.ellipse(S/2 - 6, S*0.65, 5, 3, -0.4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(S/2 + 6, S*0.72, 5, 3, 0.4, 0, Math.PI*2);
        ctx.fill();

        // Petals (orange/red)
        const petalColors = ['#FF6622', '#FF4400', '#FF8844', '#FF3300'];
        const petalCount = 5;
        for (let i = 0; i < petalCount; i++) {
            const angle = (i / petalCount) * Math.PI * 2 + variant * 0.05;
            const px = S/2 + Math.cos(angle) * 9;
            const py = S*0.35 + Math.sin(angle) * 9;
            ctx.fillStyle = petalColors[i % petalColors.length];
            ctx.globalAlpha = 0.9 + pulse;
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Center of flower
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(S/2, S*0.35, 5, 0, Math.PI*2);
        ctx.fill();

        // Center detail (eyes)
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(S*0.47, S*0.34, 1, 0, Math.PI*2);
        ctx.arc(S*0.53, S*0.34, 1, 0, Math.PI*2);
        ctx.fill();

        // Sparkle
        ctx.fillStyle = 'rgba(255,255,200,0.6)';
        ctx.beginPath();
        ctx.arc(S*0.35, S*0.22, 2, 0, Math.PI*2);
        ctx.fill();
    }

    drawStar(ctx, S, variant) {
        ctx.clearRect(0, 0, S, S);
        const pulse = 0.85 + Math.sin(variant * 0.2) * 0.15;
        const rot = variant * 0.03;

        // Glow
        const glowGrad = ctx.createRadialGradient(S/2, S/2, 2, S/2, S/2, S*0.5);
        glowGrad.addColorStop(0, `rgba(255,240,100,${0.3 * pulse})`);
        glowGrad.addColorStop(1, 'rgba(255,240,100,0)');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(0, 0, S, S);

        // Star body
        ctx.save();
        ctx.translate(S/2, S/2);
        ctx.rotate(rot);

        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#DAA520';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        this.drawStarShape(ctx, 0, 0, 13 * pulse, 6 * pulse, 5);
        ctx.fill();
        ctx.stroke();

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(-2, -3, 4, 0, Math.PI*2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-3, -1, 1.5, 0, Math.PI*2);
        ctx.arc(3, -1, 1.5, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    drawStarShape(ctx, cx, cy, outerR, innerR, points) {
        let rot2 = (Math.PI / 2) * 3;
        const step = Math.PI / points;
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < points; i++) {
            let x = cx + Math.cos(rot2) * outerR;
            let y = cy + Math.sin(rot2) * outerR;
            ctx.lineTo(x, y);
            rot2 += step;
            x = cx + Math.cos(rot2) * innerR;
            y = cy + Math.sin(rot2) * innerR;
            ctx.lineTo(x, y);
            rot2 += step;
        }
        ctx.lineTo(cx, cy - outerR);
        ctx.closePath();
    }

    // ====== DECORATION DRAWING ======

    drawDecoBush(ctx, S, size) {
        ctx.clearRect(0, 0, S, S);
        const bushColor = '#3DAA3D';
        const bushLight = '#5AC85A';

        if (size === 'small') {
            ctx.fillStyle = bushColor;
            ctx.beginPath();
            ctx.arc(S/2, S*0.7, 10, Math.PI, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = bushLight;
            ctx.beginPath();
            ctx.arc(S*0.4, S*0.68, 4, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = bushColor;
            ctx.beginPath();
            ctx.arc(S*0.3, S*0.7, 9, Math.PI, Math.PI*2);
            ctx.arc(S/2, S*0.65, 11, Math.PI, Math.PI*2);
            ctx.arc(S*0.7, S*0.7, 9, Math.PI, Math.PI*2);
            ctx.fill();
            // fill bottom
            ctx.fillRect(S*0.05, S*0.65, S*0.9, S*0.1);

            ctx.fillStyle = bushLight;
            ctx.beginPath();
            ctx.arc(S*0.45, S*0.6, 4, 0, Math.PI*2);
            ctx.fill();
        }
    }

    drawDecoFlower(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Stem
        ctx.fillStyle = '#2A8A2A';
        ctx.fillRect(S/2 - 1, S*0.5, 2, S*0.4);

        // Leaves
        ctx.fillStyle = '#3DAA3D';
        ctx.beginPath();
        ctx.ellipse(S/2 - 4, S*0.65, 4, 2, -0.4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(S/2 + 4, S*0.7, 4, 2, 0.4, 0, Math.PI*2);
        ctx.fill();

        // Petals
        const petalColors = ['#FF6688', '#FF4466', '#FF88AA', '#FF5577', '#FF7799'];
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2 - Math.PI/2;
            const px = S/2 + Math.cos(angle) * 6;
            const py = S*0.38 + Math.sin(angle) * 6;
            ctx.fillStyle = petalColors[i];
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI*2);
            ctx.fill();
        }

        // Center
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(S/2, S*0.38, 3, 0, Math.PI*2);
        ctx.fill();
    }

    drawDecoTree(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Trunk
        ctx.fillStyle = '#8B6914';
        ctx.fillRect(S*0.4, S*0.5, S*0.2, S*0.45);

        // Bark detail
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(S*0.45, S*0.55, 2, S*0.35);
        ctx.fillRect(S*0.52, S*0.6, 2, S*0.3);

        // Canopy layers
        ctx.fillStyle = '#2A8A2A';
        ctx.beginPath();
        ctx.arc(S/2, S*0.35, S*0.35, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#35A535';
        ctx.beginPath();
        ctx.arc(S*0.4, S*0.3, S*0.22, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#40B840';
        ctx.beginPath();
        ctx.arc(S*0.55, S*0.25, S*0.18, 0, Math.PI*2);
        ctx.fill();

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.arc(S*0.4, S*0.25, 6, 0, Math.PI*2);
        ctx.fill();
    }

    drawDecoFence(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        ctx.fillStyle = '#C0A070';

        // Posts
        ctx.fillRect(2, S*0.2, 4, S*0.7);
        ctx.fillRect(S-6, S*0.2, 4, S*0.7);
        ctx.fillRect(S/2-2, S*0.2, 4, S*0.7);

        // Post tops (pointed)
        ctx.beginPath();
        ctx.moveTo(2, S*0.2);
        ctx.lineTo(4, S*0.1);
        ctx.lineTo(6, S*0.2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(S-6, S*0.2);
        ctx.lineTo(S-4, S*0.1);
        ctx.lineTo(S-2, S*0.2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(S/2-2, S*0.2);
        ctx.lineTo(S/2, S*0.1);
        ctx.lineTo(S/2+2, S*0.2);
        ctx.fill();

        // Horizontal rails
        ctx.fillRect(0, S*0.35, S, 3);
        ctx.fillRect(0, S*0.6, S, 3);

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, S*0.35, S, 1);
        ctx.fillRect(0, S*0.6, S, 1);
    }

    drawDecoHill(ctx, S) {
        ctx.clearRect(0, 0, S, S);
        // Big rounded hill
        const hillGrad = ctx.createRadialGradient(S/2, S, 2, S/2, S, S*0.9);
