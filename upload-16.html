let entityIdCounter = 0;

class Entity extends EventEmitter {
    constructor(type, x, y) {
        super();
        this.id = ++entityIdCounter;
        this.type = type;
        this.position = new Vec2(x, y);
        this.velocity = new Vec2(0, 0);
        this.scale = 1;
        this.rotation = 0;
        this.active = true;
        this.visible = true;
        this.zIndex = 0;
        this.tags = new Set();
        this.components = {};
    }

    addComponent(name, component) {
        this.components[name] = component;
        component.entity = this;
        if (component.init) component.init();
        return this;
    }

    getComponent(name) {
        return this.components[name];
    }

    update(dt) {
        for (const key in this.components) {
            if (this.components[key].update) {
                this.components[key].update(dt);
            }
        }
    }

    render(ctx) {
        for (const key in this.components) {
            if (this.components[key].render) {
                this.components[key].render(ctx);
            }
        }
    }

    destroy() {
        this.active = false;
        this.emit('destroy', this);
    }
}

class CombatComponent {
    constructor(config) {
        this.entity = null;
        this.hp = new HPBar(config.maxHP || 100, config.hpBarWidth || 60, config.hpBarHeight || 6);
        this.attack = config.attack || 10;
        this.defense = config.defense || 0;
        this.attackRange = config.attackRange || 80;
        this.detectRange = config.detectRange || 150;
        this.attackSpeed = config.attackSpeed || 1;
        this.attackCooldown = 0;
        this.moveSpeed = config.moveSpeed || 60;
        this.knockback = config.knockback || 0;
        this.knockbackResist = config.knockbackResist || 0;
        this.critRate = config.critRate || 0.05;
        this.critMultiplier = config.critMultiplier || 2;
        this.isKnockedBack = false;
        this.knockbackVelocity = 0;
        this.knockbackTimer = 0;
        this.invincibleTimer = 0;
        this.damageFlash = 0;
        this.team = config.team || 'cat';
        this.targetEntity = null;
        this.state = ANIMATION_STATES.IDLE;
        this.stateTimer = 0;
        this.cost = config.cost || 50;
        this.cooldown = config.cooldown || 2;
        this.abilities = config.abilities || [];
    }

    init() {}

    update(dt) {
        this.hp.update(dt);

        if (this.attackCooldown > 0) {
            this.attackCooldown -= dt;
        }

        if (this.invincibleTimer > 0) {
            this.invincibleTimer -= dt;
        }

        if (this.damageFlash > 0) {
            this.damageFlash -= dt * 4;
        }

        if (this.isKnockedBack) {
            this.knockbackTimer -= dt;
            this.entity.position.x += this.knockbackVelocity * dt;
            this.knockbackVelocity *= 0.9;
            if (this.knockbackTimer <= 0 || Math.abs(this.knockbackVelocity) < 1) {
                this.isKnockedBack = false;
                this.knockbackVelocity = 0;
            }
        }
    }

    takeDamage(amount, attacker = null) {
        if (this.invincibleTimer > 0) return 0;

        const actualDamage = Math.max(1, amount - this.defense);
        this.hp.damage(actualDamage);
        this.damageFlash = 1;

        if (attacker && attacker.getComponent('combat')) {
            const attackerCombat = attacker.getComponent('combat');
            if (attackerCombat.knockback > 0 && !this.isKnockedBack) {
                const kb = attackerCombat.knockback * (1 - this.knockbackResist);
                if (kb > 0) {
                    this.isKnockedBack = true;
                    this.knockbackVelocity = this.team === 'cat' ? -kb : kb;
                    this.knockbackTimer = 0.3;
                }
            }
        }

        this.entity.emit('damage', { amount: actualDamage, attacker });

        if (this.hp.isDead()) {
            this.state = ANIMATION_STATES.DEATH;
            this.entity.emit('death', this.entity);
        }

        return actualDamage;
    }

    tryAttack(target) {
        if (this.attackCooldown > 0 || this.isKnockedBack) return false;
        if (this.state === ANIMATION_STATES.DEATH) return false;

        const targetCombat = target.getComponent('combat');
        if (!targetCombat || targetCombat.hp.isDead()) return false;

        let damage = this.attack;
        let isCritical = false;

        if (Math.random() < this.critRate) {
            damage *= this.critMultiplier;
            isCritical = true;
        }

        this.state = ANIMATION_STATES.ATTACK;
        this.stateTimer = 0;
        this.attackCooldown = 1 / this.attackSpeed;

        const actualDamage = targetCombat.takeDamage(damage, this.entity);

        this.entity.emit('attack', { target, damage: actualDamage, isCritical });

        return true;
    }

    isInRange(target) {
        const dx = Math.abs(this.entity.position.x - target.position.x);
        return dx <= this.attackRange;
    }

    isInDetectRange(target) {
        const dx = Math.abs(this.entity.position.x - target.position.x);
        return dx <= this.detectRange;
    }

    isDead() { return this.hp.isDead(); }
    isAlive() { return !this.hp.isDead(); }
}

class AIComponent {
    constructor(config = {}) {
        this.entity = null;
        this.behavior = config.behavior || 'advance';
        this.target = null;
        this.decisionTimer = 0;
        this.decisionInterval = config.decisionInterval || 0.5;
        this.aggroRange = config.aggroRange || 300;
        this.retreatHP = config.retreatHP || 0;
        this.idleTime = 0;
        this.patrolRange = config.patrolRange || 0;
    }

    init() {}

    update(dt) {
        this.decisionTimer += dt;
        if (this.decisionTimer >= this.decisionInterval) {
            this.decisionTimer = 0;
            this.makeDecision();
        }
    }

    makeDecision() {
        const combat = this.entity.getComponent('combat');
        if (!combat || combat.isDead()) return;

        if (combat.isKnockedBack) return;

        switch (this.behavior) {
            case 'advance':
                this._advanceBehavior(combat);
                break;
            case 'aggressive':
                this._aggressiveBehavior(combat);
                break;
            case 'defensive':
                this._defensiveBehavior(combat);
                break;
            case 'boss':
                this._bossBehavior(combat);
                break;
        }
    }

    _advanceBehavior(combat) {
        if (this.target && this.target.active) {
            const targetCombat = this.target.getComponent('combat');
            if (targetCombat && targetCombat.isAlive()) {
                if (combat.isInRange(this.target)) {
                    combat.state = ANIMATION_STATES.ATTACK;
                } else {
                    combat.state = ANIMATION_STATES.WALK;
                }
                return;
            }
        }
        combat.state = ANIMATION_STATES.WALK;
    }

    _aggressiveBehavior(combat) {
        if (this.target && this.target.active) {
            if (combat.isInRange(this.target)) {
                combat.state = ANIMATION_STATES.ATTACK;
            } else {
                combat.state = ANIMATION_STATES.WALK;
                combat.moveSpeed *= 1.2;
            }
        } else {
            combat.state = ANIMATION_STATES.WALK;
        }
    }

    _defensiveBehavior(combat) {
        if (combat.hp.getRatio() < 0.3) {
            combat.state = ANIMATION_STATES.IDLE;
            return;
        }
        this._advanceBehavior(combat);
    }

    _bossBehavior(combat) {
        if (this.target && this.target.active) {
            const targetCombat = this.target.getComponent('combat');
            if (targetCombat && targetCombat.isAlive()) {
                if (combat.isInRange(this.target)) {
                    if (combat.hp.getRatio() < 0.3 && Math.random() < 0.3) {
                        combat.state = ANIMATION_STATES.SPECIAL;
                    } else {
                        combat.state = ANIMATION_STATES.ATTACK;
                    }
                } else {
                    combat.state = ANIMATION_STATES.WALK;
                }
                return;
            }
        }
        combat.state = ANIMATION_STATES.WALK;
    }
}

class RenderComponent {
    constructor(config = {}) {
        this.entity = null;
        this.characterType = config.characterType || 'cat';
        this.enemyType = config.enemyType || 'dog';
        this.color = config.color || ColorPalette.catWhite;
        this.expression = 'normal';
        this.walkPhase = 0;
        this.attackPhase = -1;
        this.attackAnimTimer = 0;
        this.attackAnimDuration = 0.5;
        this.damageFlash = 0;
        this.breathePhase = 0;
        this.squash = 1;
        this.stretch = 1;
        this.opacity = 1;
        this.accessory = config.accessory || null;
        this.deathTimer = 0;
        this.spawnTimer = 0;
        this.spawnDuration = 0.4;
        this.isSpawning = true;
        this.facingRight = config.facingRight !== undefined ? config.facingRight : true;
        this.shadowScale = config.shadowScale || 1;
        this.renderScale = config.renderScale || 1.5;
    }

    init() {
        this.spawnTimer = 0;
        this.isSpawning = true;
    }

    update(dt) {
        const combat = this.entity.getComponent('combat');

        this.breathePhase += dt * 3;

        // スポーンアニメ
        if (this.isSpawning) {
            this.spawnTimer += dt;
            const t = MathUtils.clamp(this.spawnTimer / this.spawnDuration, 0, 1);
            this.opacity = EASING.easeOutBack(t);
            this.squash = 1 + (1 - t) * 0.3;
            this.stretch = 1 - (1 - t) * 0.2;
            if (t >= 1) {
                this.isSpawning = false;
                this.opacity = 1;
                this.squash = 1;
                this.stretch = 1;
            }
            return;
        }

        if (combat) {
            this.damageFlash = combat.damageFlash;

            switch (combat.state) {
                case ANIMATION_STATES.WALK:
                    this.walkPhase += dt * 3;
                    this.expression = 'determined';
                    this.attackPhase = -1;
                    this.attackAnimTimer = 0;
                    break;

                case ANIMATION_STATES.ATTACK:
                    this.walkPhase = 0;
                    this.attackAnimTimer += dt;
                    this.attackPhase = MathUtils.clamp(this.attackAnimTimer / this.attackAnimDuration, 0, 1);
                    this.expression = 'angry';

                    if (this.attackPhase >= 1) {
                        this.attackPhase = -1;
                        this.attackAnimTimer = 0;
                        combat.state = ANIMATION_STATES.IDLE;
                    }
                    break;

                case ANIMATION_STATES.DAMAGE:
                    this.expression = 'hurt';
                    this.walkPhase = 0;
                    combat.stateTimer += dt;
                    if (combat.stateTimer > 0.3) {
                        combat.state = ANIMATION_STATES.IDLE;
                    }
                    break;

                case ANIMATION_STATES.DEATH:
                    this.expression = 'dead';
                    this.deathTimer += dt;
                    this.opacity = Math.max(0, 1 - this.deathTimer / 1.0);
                    this.squash = 1 + this.deathTimer * 0.5;
                    this.stretch = Math.max(0.1, 1 - this.deathTimer * 0.8);
                    if (this.deathTimer > 1.2) {
                        this.entity.destroy();
                    }
                    break;

                case ANIMATION_STATES.IDLE:
                    this.expression = 'normal';
                    this.walkPhase = 0;
                    this.attackPhase = -1;
                    break;

                case ANIMATION_STATES.CELEBRATE:
                    this.expression = 'happy';
                    this.walkPhase += dt * 2;
                    break;
            }

            // ダメージフラッシュ中
            if (this.damageFlash > 0.5) {
                this.expression = 'hurt';
            }
        }
    }

    render(ctx) {
        if (!this.entity.visible) return;

        const pos = this.entity.position;
        const s = this.entity.scale * this.renderScale;

        ctx.save();

        if (!this.facingRight) {
            ctx.translate(pos.x, pos.y);
            ctx.scale(-1, 1);
            ctx.translate(-pos.x, -pos.y);
        }

        if (this.characterType === 'cat') {
            characterRenderer.drawFullCat(ctx, pos.x, pos.y, s, this.color, {
                expression: this.expression,
                walkPhase: this.walkPhase,
                attackPhase: this.attackPhase,
                damageFlash: this.damageFlash,
                squash: this.squash,
                stretch: this.stretch,
                breathePhase: this.breathePhase,
                opacity: this.opacity,
                accessory: this.accessory,
            });
        } else if (this.characterType === 'enemy') {
            characterRenderer.drawEnemyBasic(ctx, pos.x, pos.y, s, this.enemyType, {
                expression: this.expression,
                walkPhase: this.walkPhase,
                attackPhase: this.attackPhase,
                damageFlash: this.damageFlash,
                squash: this.squash,
                stretch: this.stretch,
                opacity: this.opacity,
                hpRatio: this.entity.getComponent('combat') ? this.entity.getComponent('combat').hp.getRatio() : 1,
            });
        }

        ctx.restore();

        // HPバー
        if (this.opacity > 0.5) {
            const combat = this.entity.getComponent('combat');
            if (combat && combat.hp.getRatio() < 1 && combat.isAlive()) {
                combat.hp.render(ctx, pos.x - 30, pos.y - 55 * s);
            }
        }
    }
}

// ──────────────────────────────────────────
// セクション22: 基地（タワー）クラス
// ──────────────────────────────────────────

class Base extends Entity {
    constructor(team, x, y, hp = 5000) {
        super(ENTITY_TYPES.BASE, x, y);
        this.team = team;
        this.maxHP = hp;
        this.currentHP = hp;
        this.hpBar = new HPBar(hp, 120, 10);
        this.shakeTimer = 0;
        this.scale = 1;
        this.width = 80;
        this.height = 120;
        this.damageFlash = 0;
        this.destroyed = false;
        this.destructionTimer = 0;
    }

    takeDamage(amount) {
        if (this.destroyed) return;
        this.currentHP = Math.max(0, this.currentHP - amount);
        this.hpBar.setHP(this.currentHP);
        this.shakeTimer = 0.3;
        this.damageFlash = 1;
        if (this.currentHP <= 0) {
            this.destroyed = true;
            this.emit('destroyed', this);
        }
    }

    update(dt) {
        this.hpBar.update(dt);
        if (this.shakeTimer > 0) this.shakeTimer -= dt;
        if (this.damageFlash > 0) this.damageFlash -= dt * 3;
        if (this.destroyed) {
            this.destructionTimer += dt;
        }
    }

    render(ctx) {
        const x = this.position.x;
        const y = this.position.y;
        const shakeX = this.shakeTimer > 0 ? MathUtils.random(-3, 3) : 0;
        const shakeY = this.shakeTimer > 0 ? MathUtils.random(-3, 3) : 0;

        ctx.save();
        ctx.translate(x + shakeX, y + shakeY);

        if (this.destroyed) {
            const t = MathUtils.clamp(this.destructionTimer / 2, 0, 1);
            ctx.globalAlpha = 1 - t;
            ctx.rotate(Math.sin(this.destructionTimer * 5) * 0.05 * (1 - t));
        }

        if (this.damageFlash > 0) {
            ctx.filter = `brightness(${1 + this.damageFlash})`;
        }

        const w = this.width;
        const h = this.height;

        // タワー影
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, h * 0.1, w * 0.7, 8, 0, 0, MathUtils.TAU);
        ctx.fill();

        if (this.team === 'cat') {
            this._drawCatBase(ctx, w, h);
        } else {
            this._drawEnemyBase(ctx, w, h);
        }

        ctx.restore();

        // HPバー
        if (!this.destroyed) {
            this.hpBar.render(ctx, x - 60, y - h - 20);
        }
    }

    _drawCatBase(ctx, w, h) {
        // 台座
        const baseGrad = ctx.createLinearGradient(-w * 0.6, 0, w * 0.6, 0);
        baseGrad.addColorStop(0, '#888');
        baseGrad.addColorStop(0.5, '#bbb');
        baseGrad.addColorStop(1, '#888');
        ctx.fillStyle = baseGrad;
        DrawUtils.roundRect(ctx, -w * 0.6, -10, w * 1.2, 20, 5);
        ctx.fill();

        // 塔本体
        const towerGrad = ctx.createLinearGradient(-w * 0.4, -h, w * 0.4, 0);
        towerGrad.addColorStop(0, '#e8ddd0');
        towerGrad.addColorStop(0.5, '#f5efe6');
        towerGrad.addColorStop(1, '#d8cdc0');
        ctx.fillStyle = towerGrad;
        ctx.beginPath();
        ctx.moveTo(-w * 0.5, -10);
        ctx.lineTo(-w * 0.35, -h * 0.85);
        ctx.lineTo(w * 0.35, -h * 0.85);
        ctx.lineTo(w * 0.5, -10);
        ctx.closePath();
        ctx.fill();

        // 窓
        ctx.fillStyle = 'rgba(100,150,200,0.6)';
        ctx.beginPath();
        ctx.arc(0, -h * 0.5, 12, 0, MathUtils.TAU);
        ctx.fill();
        ctx.strokeStyle = '#a09080';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 屋根
        ctx.fillStyle = '#d44';
        ctx.beginPath();
        ctx.moveTo(-w * 0.45, -h * 0.85);
        ctx.lineTo(0, -h * 1.15);
        ctx.lineTo(w * 0.45, -h * 0.85);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#b33';
        ctx.beginPath();
        ctx.moveTo(-w * 0.45, -h * 0.85);
        ctx.lineTo(0, -h * 1.15);
        ctx.lineTo(0, -h * 0.85);
        ctx.closePath();
        ctx.fill();

        // 猫のシンボル
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -h * 0.7, 8, 0, MathUtils.TAU);
        ctx.fill();

        // 猫耳シンボル
        ctx.beginPath();
        ctx.moveTo(-8, -h * 0.7 - 5);
        ctx.lineTo(-12, -h * 0.7 - 15);
        ctx.lineTo(-3, -h * 0.7 - 8);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(8, -h * 0.7 - 5);
        ctx.lineTo(12, -h * 0.7 - 15);
        ctx.lineTo(3, -h * 0.7 - 8);
        ctx.closePath();
        ctx.fill();

        // 旗
        const flagWave = Math.sin(performance.now() * 0.003) * 0.15;
        ctx.save();
        ctx.translate(0, -h * 1.15);
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -30);
        ctx.stroke();

        ctx.fillStyle = '#ff6';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.quadraticCurveTo(12, -25 + flagWave * 30, 20, -22);
        ctx.quadraticCurveTo(12, -18 + flagWave * 20, 0, -15);
        ctx.closePath();
        ctx.fill();

        // 旗の猫肉球マーク
        ctx.fillStyle = '#f88';
        ctx.beginPath();
        ctx.arc(10, -22, 3, 0, MathUtils.TAU);
        ctx.fill();
        ctx.restore();
    }

    _drawEnemyBase(ctx, w, h) {
        // 台座（暗い）
        const baseGrad = ctx.createLinearGradient(-w * 0.6, 0, w * 0.6, 0);
        baseGrad.addColorStop(0, '#444');
        baseGrad.addColorStop(0.5, '#666');
        baseGrad.addColorStop(1, '#444');
        ctx.fillStyle = baseGrad;
        DrawUtils.roundRect(ctx, -w * 0.6, -10, w * 1.2, 20, 5);
        ctx.fill();

        // 塔本体（暗い色合い）
        const towerGrad = ctx.createLinearGradient(-w * 0.4, -h, w * 0.4, 0);
        towerGrad.addColorStop(0, '#3a2a3a');
        towerGrad.addColorStop(0.5, '#4a3548');
        towerGrad.addColorStop(1, '#2a1a28');
        ctx.fillStyle = towerGrad;
        ctx.beginPath();
        ctx.moveTo(-w * 0.5, -10);
        ctx.lineTo(-w * 0.4, -h * 0.85);
        ctx.lineTo(w * 0.4, -h * 0.85);
        ctx.lineTo(w * 0.5, -10);
        ctx.closePath();
        ctx.fill();

        // 邪悪な窓（光る目）
        const glowPhase = (Math.sin(performance.now() * 0.004) + 1) / 2;
        ctx.fillStyle = `rgba(255, 50, 50, ${0.5 + glowPhase * 0.5})`;
        ctx.beginPath();
        ctx.ellipse(-10, -h * 0.55, 8, 12, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(10, -h * 0.55, 8, 12, 0, 0, MathUtils.TAU);
        ctx.fill();

        // グロー
        ctx.fillStyle = `rgba(255, 50, 50, ${0.1 + glowPhase * 0.1})`;
        ctx.beginPath();
        ctx.arc(0, -h * 0.55, 30, 0, MathUtils.TAU);
        ctx.fill();

        // 尖った屋根
        ctx.fillStyle = '#2a1a28';
        ctx.beginPath();
        ctx.moveTo(-w * 0.45, -h * 0.85);
        ctx.lineTo(-w * 0.15, -h * 1.25);
        ctx.lineTo(0, -h * 0.9);
        ctx.lineTo(w * 0.15, -h * 1.25);
        ctx.lineTo(w * 0.45, -h * 0.85);
        ctx.closePath();
        ctx.fill();

        // ドクロマーク
        ctx.fillStyle = '#ccc';
        ctx.beginPath();
        ctx.arc(0, -h * 0.35, 10, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = '#3a2a3a';
        ctx.beginPath();
        ctx.arc(-4, -h * 0.36, 3, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(4, -h * 0.36, 3, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -h * 0.32, 2, 0, Math.PI);
        ctx.fill();

        // 鎖
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            const chainX = -w * 0.3 + i * w * 0.3;
            ctx.beginPath();
            for (let j = 0; j < 4; j++) {
                const cy = -h * 0.2 + j * 8;
                ctx.ellipse(chainX, cy, 3, 4, 0, 0, MathUtils.TAU);
            }
            ctx.stroke();
        }
    }

    getHPRatio() { return this.currentHP / this.maxHP; }
}

const characterRenderer = new CharacterRenderer();

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.width = CONFIG.CANVAS_WIDTH;
        this.height = CONFIG.CANVAS_HEIGHT;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        this.state = GAME_STATES.LOADING;
        this.previousState = null;
        this.stateTimer = 0;

        this.camera = new Camera(this.width, this.height);
        this.input = new InputManager(this.canvas);
        this.particleSystem = new ParticleSystem();
        this.damageNumbers = new DamageNumberManager();
        this.screenEffects = new ScreenEffects(this.width, this.height);
        this.background = new ParallaxBackground(this.width, this.height);

        this.entities = [];
        this.catBase = null;
        this.enemyBase = null;

        this.money = CONFIG.STARTING_MONEY;
        this.moneyRate = CONFIG.MONEY_RATE;
        this.moneyTimer = 0;
        this.moneyLevel = 1;

        this.currentStage = null;
        this.currentStageIndex = 0;
        this.waveIndex = 0;
        this.battleTimer = 0;
        this.battleStarted = false;

        this.catCooldowns = {};
        this.selectedUnit = null;

        this.groundY = this.height * CONFIG.GROUND_Y_RATIO;

        this.lastFrameTime = 0;
        this.deltaTime = 0;
        this.fps = 0;
        this.frameCount = 0;
        this.fpsTimer = 0;

        this.uiButtons = [];
        this.uiState = {
            menuHover: -1,
            stageHover: -1,
            titleAlpha: 0,
            titleScale: 0,
        };

        this.loadProgress = 0;
        this.loadTotal = 100;
    }

    async init() {
        this._updateLoadingProgress(10, 'システム初期化中...');
        await this._delay(100);

        this._updateLoadingProgress(30, 'サウンド生成中...');
        soundManager.init();
        await this._delay(100);

        this._updateLoadingProgress(50, 'グラフィック準備中...');
        await this._delay(100);

        this._updateLoadingProgress(70, 'ステージデータ読み込み中...');
        await this._delay(100);

        this._updateLoadingProgress(90, 'UIセットアップ中...');
        await this._delay(100);

        this._updateLoadingProgress(100, '完了！');
        await this._delay(500);

        document.getElementById('loadingScreen').classList.add('hidden');
        this.state = GAME_STATES.TITLE;
        this.stateTimer = 0;

        this.start();
    }

    _delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    _updateLoadingProgress(percent, text) {
        this.loadProgress = percent;
        document.getElementById('loadingBar').style.width = percent + '%';
        document.getElementById('loadingText').textContent = text;
    }

    start() {
        this.lastFrameTime = performance.now();
        requestAnimationFrame((t) => this.gameLoop(t));
    }

    gameLoop(timestamp) {
    const rawDelta = timestamp - this.lastFrameTime;
    this.lastFrameTime = timestamp;
    this.deltaTime = Math.min(rawDelta, CONFIG.MAX_DELTA) / 1000;

    this.frameCount++;
    this.fpsTimer += rawDelta;
    if (this.fpsTimer >= 1000) {
        this.fps = this.frameCount;
        this.frameCount = 0;
        this.fpsTimer = 0;
    }

    // ★ ヒットストップタイマーは実時間で先に進める
    this.camera.updateHitStop(this.deltaTime);

    const effectiveDt = this.deltaTime * this.screenEffects.getTimeScale();
    const gameDt = this.camera.isHitStopped() ? 0 : effectiveDt;

    this.update(gameDt);
    this.render();

    this.input.lateUpdate();

    requestAnimationFrame((t) => this.gameLoop(t));
}

    update(dt) {
        this.stateTimer += dt;
        this.input.update(this.camera);
        characterRenderer.updateTime(dt);

        switch (this.state) {
            case GAME_STATES.TITLE:
                this._updateTitle(dt);
                break;
            case GAME_STATES.STAGE_SELECT:
                this._updateStageSelect(dt);
                break;
            case GAME_STATES.BATTLE:
                this._updateBattle(dt);
                break;
            case GAME_STATES.RESULT:
                this._updateResult(dt);
                break;
            case GAME_STATES.GAME_OVER:
                this._updateGameOver(dt);
                break;
            case GAME_STATES.PAUSE:
                break;
        }

        TweenManager.update(dt);
        this.screenEffects.update(dt);
    }

    render() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        switch (this.state) {
            case GAME_STATES.TITLE:
                this._renderTitle();
                break;
            case GAME_STATES.STAGE_SELECT:
                this._renderStageSelect();
                break;
            case GAME_STATES.BATTLE:
                this._renderBattle();
                break;
            case GAME_STATES.RESULT:
                this._renderResult();
                break;
            case GAME_STATES.GAME_OVER:
                this._renderGameOver();
                break;
            case GAME_STATES.PAUSE:
                this._renderBattle();
                this._renderPauseOverlay();
                break;
        }

        // FPS表示（デバッグ）
        if (CONFIG.DEBUG_MODE) {
            this.camera.resetTransform(this.ctx);
            this.ctx.fillStyle = '#0f0';
            this.ctx.font = '14px monospace';
            this.ctx.textAlign = 'left';
            this.ctx.fillText(`FPS: ${this.fps} | Entities: ${this.entities.length} | Particles: ${this.particleSystem.getTotalParticleCount()}`, 10, 20);
        }
    }

    // ──── タイトル画面 ────

    _updateTitle(dt) {
        this.uiState.titleAlpha = Math.min(1, this.uiState.titleAlpha + dt * 2);
        this.uiState.titleScale = MathUtils.lerp(this.uiState.titleScale, 1, 0.05);
        this.background.update(dt);

        if (this.input.isMouseJustPressed() || this.input.isKeyJustPressed('Space') || this.input.isKeyJustPressed('Enter')) {
            soundManager.init();
            soundManager.play('menuClick');
            this._transitionTo(GAME_STATES.STAGE_SELECT);
        }
    }

    _renderTitle() {
        const ctx = this.ctx;
        this.background.render(ctx, this.camera);

        // 暗いオーバーレイ
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(0, 0, this.width, this.height);

        ctx.save();
        ctx.globalAlpha = this.uiState.titleAlpha;

        // タイトルロゴ
        const centerX = this.width / 2;
        const centerY = this.height * 0.35;
        const scale = this.uiState.titleScale;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(scale, scale);

        // タイトル背景
        const titleGrad = ctx.createLinearGradient(-300, -50, 300, 50);
        titleGrad.addColorStop(0, 'rgba(255,100,30,0.9)');
        titleGrad.addColorStop(0.5, 'rgba(255,150,50,0.95)');
        titleGrad.addColorStop(1, 'rgba(255,100,30,0.9)');
        ctx.fillStyle = titleGrad;
        DrawUtils.roundRect(ctx, -320, -65, 640, 130, 20);
        ctx.fill();

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        DrawUtils.roundRect(ctx, -320, -65, 640, 130, 20);
        ctx.stroke();

        // メインタイトル
        DrawUtils.drawTextWithOutline(ctx, 'にゃんこバトル大戦争', 0, -10, '#fff', '#993300', 6, 'bold 56px sans-serif');
        DrawUtils.drawTextWithOutline(ctx, '~ Nyanko Battle Wars ~', 0, 35, '#ffe', '#885500', 3, 'bold 22px sans-serif');

        ctx.restore();

        // 猫キャラ装飾
        const catY = this.height * 0.35;
        const bounce = Math.sin(performance.now() * 0.003) * 8;
        characterRenderer.drawFullCat(ctx, centerX - 400, catY + bounce + 30, 2.5, ColorPalette.catOrange, {
            expression: 'happy',
            walkPhase: performance.now() * 0.001,
            breathePhase: performance.now() * 0.003,
        });
        characterRenderer.drawFullCat(ctx, centerX + 400, catY - bounce + 30, 2.5, ColorPalette.catWhite, {
            expression: 'determined',
            walkPhase: performance.now() * 0.001 + 0.5,
            breathePhase: performance.now() * 0.003 + 1,
            accessory: 'helmet',
        });

        // スタートメッセージ
        const blink = Math.sin(performance.now() * 0.004) > 0;
        if (blink) {
            DrawUtils.drawTextWithOutline(ctx, 'クリックでスタート', centerX, this.height * 0.65, '#fff', '#000', 4, 'bold 30px sans-serif');
        }

        // バージョン表記
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('v1.0 - Motion Engine Powered', centerX, this.height - 30);

        ctx.restore();
    }

    // ──── ステージ選択 ────

    _updateStageSelect(dt) {
        this.background.update(dt);
        if (this.input.isKeyJustPressed('Escape')) {
            this._transitionTo(GAME_STATES.TITLE);
        }
    }

    _renderStageSelect() {
        const ctx = this.ctx;
        this.background.render(ctx, this.camera);

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, this.width, this.height);

        const centerX = this.width / 2;

        // ヘッダー
        DrawUtils.drawTextWithOutline(ctx, 'ステージ選択', centerX, 80, '#fff', '#333', 5, 'bold 48px sans-serif');

        // ステージボタン
        const startY = 180;
        const cardWidth = 400;
        const cardHeight = 140;
        const spacing = 20;

        for (let i = 0; i < STAGES.length; i++) {
            const stage = STAGES[i];
            const cardX = centerX - cardWidth / 2;
            const cardY = startY + i * (cardHeight + spacing);

            const mousePos = this.input.getMousePos();
            const isHover = mousePos.x >= cardX && mousePos.x <= cardX + cardWidth &&
                           mousePos.y >= cardY && mousePos.y <= cardY + cardHeight;

            if (isHover && this.input.isMouseJustPressed()) {
                soundManager.play('menuClick');
                this._startStage(i);
                return;
            }

            // カード背景
            const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX + cardWidth, cardY + cardHeight);
            if (isHover) {
                cardGrad.addColorStop(0, 'rgba(255,180,80,0.9)');
                cardGrad.addColorStop(1, 'rgba(255,130,50,0.9)');
            } else {
                cardGrad.addColorStop(0, 'rgba(60,60,80,0.85)');
                cardGrad.addColorStop(1, 'rgba(40,40,60,0.85)');
            }

            ctx.fillStyle = cardGrad;
            DrawUtils.roundRect(ctx, cardX, cardY, cardWidth, cardHeight, 15);
            ctx.fill();

            ctx.strokeStyle = isHover ? '#ffa500' : 'rgba(255,255,255,0.3)';
            ctx.lineWidth = isHover ? 3 : 1;
            DrawUtils.roundRect(ctx, cardX, cardY, cardWidth, cardHeight, 15);
            ctx.stroke();

            // ステージ番号
            ctx.fillStyle = isHover ? '#fff' : '#ffa500';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`${stage.id}`, cardX + 25, cardY + 55);

            // ステージ名
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText(stage.name, cardX + 70, cardY + 50);

            // 説明
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '18px sans-serif';
            ctx.fillText(stage.description, cardX + 70, cardY + 80);

            // Wave数
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '14px sans-serif';
            ctx.fillText(`Wave: ${stage.waves.length}`, cardX + 70, cardY + 110);
        }

        // 戻るボタン
        ctx.textAlign = 'center';
        DrawUtils.drawTextWithOutline(ctx, '← ESCで戻る', centerX, this.height - 50, 'rgba(255,255,255,0.6)', 'rgba(0,0,0,0.5)', 2, '18px sans-serif');
    }

    // ──── バトル開始 ────

    _startStage(index) {
        this.currentStageIndex = index;
        this.currentStage = STAGES[index];

        this.entities = [];
        this.money = this.currentStage.startingMoney;
        this.moneyRate = this.currentStage.moneyRate;
        this.moneyTimer = 0;
        this.moneyLevel = 1;
        this.waveIndex = 0;
        this.battleTimer = 0;
        this.battleStarted = true;

        this.particleSystem.clear();
        this.damageNumbers.clear();
        TweenManager.clear();

        this.catCooldowns = {};
        for (const key in CAT_UNITS) {
            this.catCooldowns[key] = 0;
        }

        const fieldWidth = this.currentStage.fieldWidth;
        const groundY = this.groundY;

        // 基地配置
        this.catBase = new Base('cat', 150, groundY - 10, this.currentStage.baseHP);
        this.enemyBase = new Base('enemy', fieldWidth - 150, groundY - 10, this.currentStage.enemyBaseHP);

        this.catBase.on('destroyed', () => this._onBaseDestroyed('cat'));
        this.enemyBase.on('destroyed', () => this._onBaseDestroyed('enemy'));

        // カメラ設定
        this.camera.position.set(0, 0);
        this.camera.targetPosition.set(0, 0);
        this.camera.setBounds(0, 0, fieldWidth, this.height);
        this.camera.zoom = 1;
        this.camera.targetZoom = 1;

        this._transitionTo(GAME_STATES.BATTLE);
    }

    _spawnCatUnit(unitKey) {
        const unitData = CAT_UNITS[unitKey];
        if (!unitData) return null;

        if (this.money < unitData.cost) return null;
        if (this.catCooldowns[unitKey] > 0) return null;

        this.money -= unitData.cost;
        this.catCooldowns[unitKey] = unitData.cooldown;

        const entity = new Entity(ENTITY_TYPES.CAT, this.catBase.position.x + 80, this.groundY);
        entity.scale = 1;

        entity.addComponent('combat', new CombatComponent({
            ...unitData,
            team: 'cat',
        }));

        entity.addComponent('ai', new AIComponent({
            behavior: 'advance',
        }));

        entity.addComponent('render', new RenderComponent({
            characterType: 'cat',
            color: unitData.color,
            accessory: unitData.accessory,
            facingRight: true,
        }));

        entity.on('attack', (data) => {
            this.damageNumbers.spawn(
                data.target.position.x + MathUtils.random(-10, 10),
                data.target.position.y - 40 + MathUtils.random(-10, 10),
                data.damage,
                { isCritical: data.isCritical }
            );
            soundManager.playRandomPitch(data.isCritical ? 'critical' : 'hit', 0.85, 1.15);

            if (data.isCritical) {
                this.camera.shake(5);
                this.camera.hitStop(40);
                this.screenEffects.addSpeedLines(5, 0.15);
            }
        });

        entity.on('death', () => {
            soundManager.play('death');
            this._spawnDeathEffect(entity.position.x, entity.position.y);
        });

        this.entities.push(entity);
        soundManager.play('deploy');
        return entity;
    }

    _spawnEnemyUnit(type) {
        const unitData = ENEMY_UNITS[type];
        if (!unitData) return null;

        const entity = new Entity(ENTITY_TYPES.ENEMY, this.enemyBase.position.x - 80, this.groundY);
        entity.scale = 1;

        entity.addComponent('combat', new CombatComponent({
            ...unitData,
            team: 'enemy',
        }));

        entity.addComponent('ai', new AIComponent({
            behavior: unitData.behavior || 'advance',
        }));

        entity.addComponent('render', new RenderComponent({
            characterType: 'enemy',
            enemyType: unitData.enemyType,
            facingRight: false,
            renderScale: type === 'boss_bear' ? 1.8 : 1.5,
        }));

        entity.on('attack', (data) => {
            this.damageNumbers.spawn(
                data.target.position.x + MathUtils.random(-10, 10),
                data.target.position.y - 40,
                data.damage,
                { isCritical: data.isCritical, color: '#ff6644' }
            );
            soundManager.playRandomPitch(data.isCritical ? 'critical' : 'hit');

            if (data.isCritical) {
                this.camera.shake(4);
                this.screenEffects.triggerDamageVignette(0.2);
            }
        });

        entity.on('death', () => {
            soundManager.play('death');
            this._spawnDeathEffect(entity.position.x, entity.position.y);
            this.money += MathUtils.randomInt(10, 30);
        });

        this.entities.push(entity);
        soundManager.play('spawn');
        return entity;
    }

    _spawnDeathEffect(x, y) {
        const emitter = this.particleSystem.createEmitter({
            position: new Vec2(x, y),
            emissionRate: 0,
            burst: 15,
            burstInterval: 0,
            maxParticles: 30,
            duration: 0.1,
            loop: false,
            speed: { min: 80, max: 200 },
            angle: { min: -Math.PI, max: 0 },
            life: { min: 0.3, max: 0.8 },
            size: { min: 3, max: 8 },
            endSize: { min: 0, max: 0 },
            startColor: new Color(1, 0.9, 0.3, 1),
            endColor: new Color(1, 0.3, 0.1, 0),
            colorVariance: 0.1,
            gravityScale: 0.5,
            shape: 'star',
        });
        emitter.emit(15);
    }

    // ──── バトル更新 ────

    _updateBattle(dt) {
        this.battleTimer += dt;
        this.background.update(dt);
        this.camera.update(dt);

        // お金増加
        this.moneyTimer += dt;
        if (this.moneyTimer >= 1) {
            this.moneyTimer -= 1;
            this.money = Math.min(CONFIG.MAX_MONEY, this.money + this.moneyRate * this.moneyLevel);
        }

        // クールダウン
        for (const key in this.catCooldowns) {
            if (this.catCooldowns[key] > 0) {
                this.catCooldowns[key] -= dt;
            }
        }

        // Wave管理
        this._processWaves(dt);

        // エンティティ更新
        this._updateEntities(dt);

        // 基地更新
        this.catBase.update(dt);
        this.enemyBase.update(dt);

        // パーティクル
        this.particleSystem.update(dt);
        this.damageNumbers.update(dt);

        // UI入力処理
        this._processBattleInput();

        // カメラ自動追従
        this._updateBattleCamera();

        // ポーズ
        if (this.input.isKeyJustPressed('Escape') || this.input.isKeyJustPressed('KeyP')) {
            this._transitionTo(GAME_STATES.PAUSE);
        }
    }

    _processWaves(dt) {
        if (this.waveIndex >= this.currentStage.waves.length) return;

        const wave = this.currentStage.waves[this.waveIndex];
        if (this.battleTimer >= wave.time) {
            soundManager.play('wave');

            for (const enemyGroup of wave.enemies) {
                let spawnDelay = 0;
                for (let i = 0; i < enemyGroup.count; i++) {
                    setTimeout(() => {
                        if (this.state === GAME_STATES.BATTLE) {
                            this._spawnEnemyUnit(enemyGroup.type);
                        }
                    }, spawnDelay * 1000);
                    spawnDelay += enemyGroup.interval;
                }
            }
            this.waveIndex++;
        }
    }

    _updateEntities(dt) {
        // 敵味方のリスト
        const cats = this.entities.filter(e => e.type === ENTITY_TYPES.CAT && e.active);
        const enemies = this.entities.filter(e => e.type === ENTITY_TYPES.ENEMY && e.active);

        for (const entity of this.entities) {
            if (!entity.active) continue;

            const combat = entity.getComponent('combat');
            const ai = entity.getComponent('ai');
            const render = entity.getComponent('render');

            if (combat && ai) {
                // ターゲット探索
                const targetList = combat.team === 'cat' ? enemies : cats;
                const targetBase = combat.team === 'cat' ? this.enemyBase : this.catBase;

                let closestTarget = null;
                let closestDist = Infinity;
                for (const t of targetList) {
                    const tc = t.getComponent('combat');
                    if (tc && tc.isAlive()) {
                        const dist = Math.abs(entity.position.x - t.position.x);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestTarget = t;
                        }
                    }
                }

                ai.target = closestTarget;

                // 基地への攻撃判定
                const distToBase = Math.abs(entity.position.x - targetBase.position.x);
                if (!closestTarget || closestDist > distToBase) {
                    if (distToBase < combat.attackRange && !targetBase.destroyed) {
                        if (combat.attackCooldown <= 0 && combat.state !== ANIMATION_STATES.DEATH && !combat.isKnockedBack) {
                            combat.attackCooldown = 1 / combat.attackSpeed;
                            combat.state = ANIMATION_STATES.ATTACK;
                            combat.stateTimer = 0;
                            targetBase.takeDamage(combat.attack);
                            this.damageNumbers.spawn(
                                targetBase.position.x + MathUtils.random(-20, 20),
                                targetBase.position.y - 60,
                                combat.attack
                            );
                            soundManager.playRandomPitch('hit');
                            this.camera.shake(3);
                        }
                    }
                }

                // ユニット同士の攻撃
                if (closestTarget && combat.isInRange(closestTarget)) {
                    combat.tryAttack(closestTarget);
                }

                // 移動
                if (combat.state === ANIMATION_STATES.WALK && !combat.isKnockedBack) {
                    const dir = combat.team === 'cat' ? 1 : -1;
                    entity.position.x += combat.moveSpeed * dir * dt;
                }
            }

            entity.update(dt);
        }

        // 死んだエンティティ削除
        this.entities = this.entities.filter(e => e.active);
    }

    _processBattleInput() {
        // ユニット配置ボタン（数字キー or クリック）
        const unitKeys = Object.keys(CAT_UNITS);
        for (let i = 0; i < unitKeys.length && i < 8; i++) {
            if (this.input.isKeyJustPressed(`Digit${i + 1}`)) {
                this._spawnCatUnit(unitKeys[i]);
            }
        }

        // お金レベルアップ
        if (this.input.isKeyJustPressed('KeyQ')) {
            const upgradeCost = this.moneyLevel * 100;
            if (this.money >= upgradeCost && this.moneyLevel < 8) {
                this.money -= upgradeCost;
                this.moneyLevel++;
                soundManager.play('levelUp');
            }
        }

        // カメラ操作
        if (this.input.isKeyDown('ArrowLeft') || this.input.isKeyDown('KeyA')) {
            this.camera.targetPosition.x -= 400 * this.deltaTime;
        }
        if (this.input.isKeyDown('ArrowRight') || this.input.isKeyDown('KeyD')) {
            this.camera.targetPosition.x += 400 * this.deltaTime;
        }
    }

    _updateBattleCamera() {
        // 戦闘の中心付近にカメラ追従
        const cats = this.entities.filter(e => e.type === ENTITY_TYPES.CAT && e.active);
        const enemies = this.entities.filter(e => e.type === ENTITY_TYPES.ENEMY && e.active);

        if (cats.length > 0 && enemies.length > 0) {
            let frontCat = cats.reduce((a, b) => a.position.x > b.position.x ? a : b);
            let frontEnemy = enemies.reduce((a, b) => a.position.x < b.position.x ? a : b);

            const battleCenter = (frontCat.position.x + frontEnemy.position.x) / 2;
            this.camera.targetPosition.x = MathUtils.lerp(this.camera.targetPosition.x, battleCenter - this.width / 2, 0.02);
        }
    }

    _onBaseDestroyed(team) {
        if (team === 'enemy') {
            // プレイヤー勝利
            this.camera.shake(15);
            soundManager.play('victory');
            this.screenEffects.addSpeedLines(20, 0.5);

            // 勝利パーティクル
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const emitter = this.particleSystem.createEmitter({
                        position: new Vec2(MathUtils.random(200, this.width - 200), MathUtils.random(100, 400)),
                        emissionRate: 0,
                        burst: 20,
                        duration: 0.1,
                        loop: false,
                        speed: { min: 100, max: 300 },
                        angle: { min: -Math.PI, max: 0 },
                        life: { min: 0.5, max: 1.5 },
                        size: { min: 3, max: 6 },
                        endSize: { min: 0, max: 0 },
                        startColor: Color.fromHSL(Math.random(), 0.8, 0.6),
                        endColor: Color.fromHSL(Math.random(), 0.8, 0.6, 0),
                        shape: MathUtils.randomElement(['star', 'circle', 'heart']),
                        gravityScale: 0.3,
                    });
                    emitter.emit(20);
                }, i * 300);
            }

            setTimeout(() => {
                this._transitionTo(GAME_STATES.RESULT);
            }, 2000);
        } else {
            // プレイヤー敗北
            this.camera.shake(10);
            soundManager.play('defeat');
            this.screenEffects.triggerDamageVignette(0.8);

            setTimeout(() => {
                this._transitionTo(GAME_STATES.GAME_OVER);
            }, 2000);
        }
    }

    // ──── バトル描画 ────

    _renderBattle() {
        const ctx = this.ctx;

        // 背景
        this.background.render(ctx, this.camera);

        // カメラ適用
        this.camera.applyTransform(ctx);

        // 基地
        this.catBase.render(ctx);
        this.enemyBase.render(ctx);

        // エンティティ（Z-sortで描画）
        const sortedEntities = [...this.entities].sort((a, b) => a.position.y - b.position.y);
        for (const entity of sortedEntities) {
            const render = entity.getComponent('render');
            if (render) {
                render.render(ctx);
            }
        }

        // パーティクル
        this.particleSystem.render(ctx);

        // ダメージ数字
        this.damageNumbers.render(ctx);

        // フォアグラウンド
        this.background.renderForeground(ctx, this.camera);

        // カメラエフェクト
        this.camera.renderFlash(ctx);
        this.camera.renderVignette(ctx);

        // スクリーンエフェクト
        this.camera.resetTransform(ctx);
        this.screenEffects.render(ctx);

        // バトルUI
        this._renderBattleUI(ctx);
    }

    _renderBattleUI(ctx) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        // 上部情報バー
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, this.width, 50);

        // お金表示
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`💰 ${Math.floor(this.money)}`, 20, 35);

        // お金レベル
        ctx.fillStyle = '#aaf';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Lv.${this.moneyLevel} (Q)`, 200, 35);

        // Wave表示
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Wave ${this.waveIndex}/${this.currentStage.waves.length}`, this.width / 2, 35);

        // タイマー
        ctx.textAlign = 'right';
        const min = Math.floor(this.battleTimer / 60);
        const sec = Math.floor(this.battleTimer % 60);
        ctx.fillText(`${min}:${sec.toString().padStart(2, '0')}`, this.width - 20, 35);

        // 基地HP
        // 味方基地HP
        const catHPRatio = this.catBase.currentHP / this.catBase.maxHP;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        DrawUtils.roundRect(ctx, 20, 55, 200, 14, 7);
        ctx.fill();
        const catHPColor = catHPRatio > 0.5 ? '#4a4' : catHPRatio > 0.25 ? '#aa4' : '#a44';
        ctx.fillStyle = catHPColor;
        DrawUtils.roundRect(ctx, 20, 55, 200 * catHPRatio, 14, 7);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`味方基地 ${Math.floor(this.catBase.currentHP)}/${this.catBase.maxHP}`, 120, 65);

        // 敵基地HP
        const enemyHPRatio = this.enemyBase.currentHP / this.enemyBase.maxHP;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        DrawUtils.roundRect(ctx, this.width - 220, 55, 200, 14, 7);
        ctx.fill();
        ctx.fillStyle = '#a44';
        DrawUtils.roundRect(ctx, this.width - 220, 55, 200 * enemyHPRatio, 14, 7);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`敵基地 ${Math.floor(this.enemyBase.currentHP)}/${this.enemyBase.maxHP}`, this.width - 120, 65);

        // ユニット配置ボタン
        this._renderUnitButtons(ctx);
    }

    _renderUnitButtons(ctx) {
        const unitKeys = Object.keys(CAT_UNITS);
        const buttonW = 100;
        const buttonH = 80;
        const spacing = 8;
        const startX = (this.width - (unitKeys.length * (buttonW + spacing) - spacing)) / 2;
        const startY = this.height - buttonH - 15;

        const mousePos = this.input.getMousePos();

        for (let i = 0; i < unitKeys.length; i++) {
            const key = unitKeys[i];
            const unit = CAT_UNITS[key];
            const x = startX + i * (buttonW + spacing);
            const y = startY;

            const isHover = mousePos.x >= x && mousePos.x <= x + buttonW &&
                          mousePos.y >= y && mousePos.y <= y + buttonH;
            const canAfford = this.money >= unit.cost;
            const isReady = this.catCooldowns[key] <= 0;
            const isUsable = canAfford && isReady;

            // ボタン背景
            if (isUsable && isHover) {
                ctx.fillStyle = 'rgba(255,200,100,0.85)';
            } else if (isUsable) {
                ctx.fillStyle = 'rgba(60,60,80,0.85)';
            } else {
                ctx.fillStyle = 'rgba(40,40,50,0.7)';
            }
            DrawUtils.roundRect(ctx, x, y, buttonW, buttonH, 10);
            ctx.fill();

            ctx.strokeStyle = isUsable ? 'rgba(255,200,100,0.6)' : 'rgba(100,100,100,0.4)';
            ctx.lineWidth = isHover && isUsable ? 2 : 1;
            DrawUtils.roundRect(ctx, x, y, buttonW, buttonH, 10);
            ctx.stroke();

            // キー番号
            ctx.fillStyle = isUsable ? '#ff8' : '#666';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${i + 1}`, x + buttonW / 2, y + 16);

            // ユニット名
            ctx.fillStyle = isUsable ? '#fff' : '#888';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(unit.name, x + buttonW / 2, y + 35);

            // コスト
            ctx.fillStyle = canAfford ? '#ffd700' : '#f44';
            ctx.font = '12px sans-serif';
            ctx.fillText(`💰${unit.cost}`, x + buttonW / 2, y + 52);

            // クールダウン
            if (!isReady) {
                const cdRatio = this.catCooldowns[key] / unit.cooldown;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(x, y, buttonW, buttonH * cdRatio);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(this.catCooldowns[key].toFixed(1), x + buttonW / 2, y + buttonH / 2);
            }

            // クリック処理
            if (isHover && this.input.isMouseJustPressed() && isUsable) {
                this._spawnCatUnit(key);
            }
        }
    }

    // ──── リザルト画面 ────

    _updateResult(dt) {
        this.background.update(dt);
        this.particleSystem.update(dt);
        if (this.input.isMouseJustPressed() && this.stateTimer > 1) {
            this._transitionTo(GAME_STATES.STAGE_SELECT);
        }
    }

    _renderResult() {
        const ctx = this.ctx;
        this.background.render(ctx, this.camera);

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, this.width, this.height);

        this.camera.resetTransform(ctx);
        this.particleSystem.render(ctx);

        const centerX = this.width / 2;
        const centerY = this.height / 2;

        // 勝利テキスト
        const scale = Math.min(1, this.stateTimer * 3);
        ctx.save();
        ctx.translate(centerX, centerY - 80);
        ctx.scale(scale, scale);
        DrawUtils.drawTextWithOutline(ctx, '🎉 勝利！ 🎉', 0, 0, '#ffd700', '#884400', 6, 'bold 64px sans-serif');
        ctx.restore();

        if (this.stateTimer > 0.5) {
            ctx.globalAlpha = Math.min(1, (this.stateTimer - 0.5) * 3);
            DrawUtils.drawTextWithOutline(ctx, `ステージ ${this.currentStage.name} クリア！`, centerX, centerY + 20, '#fff', '#333', 3, 'bold 28px sans-serif');

            const timeStr = `クリアタイム: ${Math.floor(this.battleTimer / 60)}:${Math.floor(this.battleTimer % 60).toString().padStart(2, '0')}`;
            DrawUtils.drawTextWithOutline(ctx, timeStr, centerX, centerY + 60, '#aaf', '#333', 2, '22px sans-serif');
            ctx.globalAlpha = 1;
        }

        if (this.stateTimer > 1) {
            const blink = Math.sin(performance.now() * 0.005) > 0;
            if (blink) {
                DrawUtils.drawTextWithOutline(ctx, 'クリックで続ける', centerX, centerY + 140, 'rgba(255,255,255,0.7)', 'rgba(0,0,0,0.5)', 2, '20px sans-serif');
            }
        }
    }

    // ──── ゲームオーバー画面 ────

    _updateGameOver(dt) {
        this.background.update(dt);
        if (this.input.isMouseJustPressed() && this.stateTimer > 1) {
            this._transitionTo(GAME_STATES.STAGE_SELECT);
        }
    }

    _renderGameOver() {
        const ctx = this.ctx;
        this.background.render(ctx, this.camera);

        ctx.fillStyle = 'rgba(30,0,0,0.7)';
        ctx.fillRect(0, 0, this.width, this.height);

        const centerX = this.width / 2;
        const centerY = this.height / 2;

        const scale = Math.min(1, this.stateTimer * 3);
        ctx.save();
        ctx.translate(centerX, centerY - 60);
        ctx.scale(scale, scale);
        DrawUtils.drawTextWithOutline(ctx, '敗北...', 0, 0, '#ff4444', '#440000', 6, 'bold 64px sans-serif');
        ctx.restore();

        if (this.stateTimer > 0.5) {
            ctx.globalAlpha = Math.min(1, (this.stateTimer - 0.5) * 3);
            DrawUtils.drawTextWithOutline(ctx, '基地が破壊されました', centerX, centerY + 30, '#faa', '#333', 3, '24px sans-serif');
            ctx.globalAlpha = 1;
        }

        if (this.stateTimer > 1) {
            const blink = Math.sin(performance.now() * 0.005) > 0;
            if (blink) {
                DrawUtils.drawTextWithOutline(ctx, 'クリックでステージ選択に戻る', centerX, centerY + 120, 'rgba(255,255,255,0.7)', 'rgba(0,0,0,0.5)', 2, '20px sans-serif');
            }
        }
    }

    // ──── ポーズ画面 ────

    _renderPauseOverlay() {
        const ctx = this.ctx;
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, this.width, this.height);

        const centerX = this.width / 2;
        const centerY = this.height / 2;

        DrawUtils.drawTextWithOutline(ctx, '⏸ ポーズ中', centerX, centerY - 30, '#fff', '#333', 5, 'bold 48px sans-serif');
        DrawUtils.drawTextWithOutline(ctx, 'ESC / P で再開', centerX, centerY + 30, 'rgba(255,255,255,0.6)', 'rgba(0,0,0,0.5)', 2, '22px sans-serif');

        // ポーズ中も入力チェック
        if (this.input.isKeyJustPressed('Escape') || this.input.isKeyJustPressed('KeyP')) {
            this.state = GAME_STATES.BATTLE;
        }
    }

    // ──── ステート遷移 ────

    _transitionTo(newState) {
        this.previousState = this.state;
        this.state = newState;
        this.stateTimer = 0;
    }
}

// ──────────────────────────────────────────
// セクション26: ゲーム起動
// ──────────────────────────────────────────

const game = new Game();
game.init().catch(err => console.error('Game init error:', err));

</script>
