class Camera {
    constructor(width, height) {
        this.position = new Vec2(0, 0);
        this.targetPosition = new Vec2(0, 0);
        this.width = width;
        this.height = height;
        this.zoom = 1;
        this.targetZoom = 1;
        this.rotation = 0;
        this.smoothing = CONFIG.CAMERA_SMOOTHING;
        this.shakeIntensity = 0;
        this.shakeDecay = CONFIG.SCREEN_SHAKE_DECAY;
        this.shakeOffset = new Vec2(0, 0);
        this.bounds = null;
        this.matrix = new Matrix3x3();
        this.flashColor = null;
        this.flashAlpha = 0;
        this.flashDuration = 0;
        this.flashElapsed = 0;
        this.hitStopTimer = 0;
        this.hitStopDuration = 0;
        this.chromaticAberration = 0;
        this.vignetteIntensity = 0;
        this.zoomPulse = 0;
        this.zoomPulseSpeed = 0;
        this.zoomPulseDecay = 0;
    }

    follow(target, smoothing = null) {
        this.targetPosition.set(target.x - this.width / 2 / this.zoom, target.y - this.height / 2 / this.zoom);
        if (smoothing !== null) this.smoothing = smoothing;
    }

    lookAt(x, y) {
        this.targetPosition.set(x - this.width / 2 / this.zoom, y - this.height / 2 / this.zoom);
    }

    setBounds(minX, minY, maxX, maxY) {
        this.bounds = { minX, minY, maxX, maxY };
    }

    shake(intensity, duration = 0.3) {
        this.shakeIntensity = Math.max(this.shakeIntensity, intensity);
    }

    flash(color, duration = 0.15) {
        this.flashColor = color;
        this.flashAlpha = 1;
        this.flashDuration = duration;
        this.flashElapsed = 0;
    }

    hitStop(duration = CONFIG.HIT_STOP_DURATION) {
        this.hitStopTimer = 0;
        this.hitStopDuration = duration / 1000;
    }
    // ★ ここに追加
    updateHitStop(realDt) {
        if (this.hitStopTimer < this.hitStopDuration) {
            this.hitStopTimer += realDt;
        }
    }

    isHitStopped() {
        return this.hitStopTimer < this.hitStopDuration;
    }

    pulseZoom(amount = 0.05, speed = 15, decay = 0.92) {
        this.zoomPulse = amount;
        this.zoomPulseSpeed = speed;
        this.zoomPulseDecay = decay;
    }

    update(dt) { 
        this.position.lerpSelf(this.targetPosition, 1 - Math.pow(1 - this.smoothing, dt * 60));
        this.zoom = MathUtils.lerp(this.zoom, this.targetZoom, 0.1);

        if (this.zoomPulse > 0.001) {
            this.zoomPulse *= this.zoomPulseDecay;
        } else {
            this.zoomPulse = 0;
        }

        if (this.shakeIntensity > 0.1) {
            this.shakeOffset.set(
                MathUtils.random(-this.shakeIntensity, this.shakeIntensity),
                MathUtils.random(-this.shakeIntensity, this.shakeIntensity)
            );
            this.shakeIntensity *= this.shakeDecay;
        } else {
            this.shakeIntensity = 0;
            this.shakeOffset.set(0, 0);
        }

        if (this.bounds) {
            this.position.x = MathUtils.clamp(this.position.x, this.bounds.minX, this.bounds.maxX - this.width / this.zoom);
            this.position.y = MathUtils.clamp(this.position.y, this.bounds.minY, this.bounds.maxY - this.height / this.zoom);
        }

        if (this.flashAlpha > 0) {
            this.flashElapsed += dt;
            this.flashAlpha = MathUtils.clamp(1 - this.flashElapsed / this.flashDuration, 0, 1);
        }

        this.chromaticAberration *= 0.92;
        this.vignetteIntensity *= 0.95;
    }

    applyTransform(ctx) {
        const effectiveZoom = this.zoom + Math.sin(performance.now() * 0.001 * this.zoomPulseSpeed) * this.zoomPulse;
        ctx.setTransform(effectiveZoom, 0, 0, effectiveZoom,
            -(this.position.x + this.shakeOffset.x) * effectiveZoom,
            -(this.position.y + this.shakeOffset.y) * effectiveZoom);
    }

    resetTransform(ctx) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    renderFlash(ctx) {
        if (this.flashAlpha > 0 && this.flashColor) {
            this.resetTransform(ctx);
            ctx.fillStyle = new Color(this.flashColor.r, this.flashColor.g, this.flashColor.b, this.flashAlpha * 0.4).toCSS();
            ctx.fillRect(0, 0, this.width, this.height);
        }
    }

    renderVignette(ctx) {
        if (this.vignetteIntensity > 0.01) {
            this.resetTransform(ctx);
            const gradient = ctx.createRadialGradient(
                this.width / 2, this.height / 2, this.width * 0.3,
                this.width / 2, this.height / 2, this.width * 0.8
            );
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, `rgba(0,0,0,${this.vignetteIntensity})`);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, this.width, this.height);
        }
    }

    worldToScreen(worldPos) {
        return new Vec2(
            (worldPos.x - this.position.x) * this.zoom,
            (worldPos.y - this.position.y) * this.zoom
        );
    }

    screenToWorld(screenPos) {
        return new Vec2(
            screenPos.x / this.zoom + this.position.x,
            screenPos.y / this.zoom + this.position.y
        );
    }

    isInView(x, y, margin = 100) {
        return x >= this.position.x - margin &&
            x <= this.position.x + this.width / this.zoom + margin &&
            y >= this.position.y - margin &&
            y <= this.position.y + this.height / this.zoom + margin;
    }
}

// ──────────────────────────────────────────
// セクション14: 入力管理
// ──────────────────────────────────────────

class InputManager {
    constructor(canvas) {
        this.canvas = canvas;
        this.mouse = {
            position: new Vec2(0, 0),
            worldPosition: new Vec2(0, 0),
            isDown: false,
            wasDown: false,
            justPressed: false,
            justReleased: false,
            button: -1,
        };
        this.touches = [];
        this.keys = {};
        this.keysJustPressed = {};
        this.keysJustReleased = {};

        this._setupEventListeners();
    }

    _setupEventListeners() {
        this.canvas.addEventListener('mousedown', (e) => this._onMouseDown(e));
        this.canvas.addEventListener('mouseup', (e) => this._onMouseUp(e));
        this.canvas.addEventListener('mousemove', (e) => this._onMouseMove(e));
        this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        this.canvas.addEventListener('touchstart', (e) => this._onTouchStart(e), { passive: false });
        this.canvas.addEventListener('touchend', (e) => this._onTouchEnd(e), { passive: false });
        this.canvas.addEventListener('touchmove', (e) => this._onTouchMove(e), { passive: false });

        window.addEventListener('keydown', (e) => this._onKeyDown(e));
        window.addEventListener('keyup', (e) => this._onKeyUp(e));
    }

    _getCanvasPos(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        const scaleX = this.canvas.width / rect.width;
        const scaleY = this.canvas.height / rect.height;
        return new Vec2(
            (clientX - rect.left) * scaleX,
            (clientY - rect.top) * scaleY
        );
    }

    _onMouseDown(e) {
        this.mouse.position = this._getCanvasPos(e.clientX, e.clientY);
        this.mouse.isDown = true;
        this.mouse.justPressed = true;
        this.mouse.button = e.button;
    }

    _onMouseUp(e) {
        this.mouse.position = this._getCanvasPos(e.clientX, e.clientY);
        this.mouse.isDown = false;
        this.mouse.justReleased = true;
    }

    _onMouseMove(e) {
        this.mouse.position = this._getCanvasPos(e.clientX, e.clientY);
    }

    _onTouchStart(e) {
        e.preventDefault();
        this.touches = Array.from(e.touches).map(t => ({
            id: t.identifier,
            position: this._getCanvasPos(t.clientX, t.clientY)
        }));
        if (this.touches.length > 0) {
            this.mouse.position = this.touches[0].position.clone();
            this.mouse.isDown = true;
            this.mouse.justPressed = true;
        }
    }

    _onTouchEnd(e) {
        e.preventDefault();
        this.touches = Array.from(e.touches).map(t => ({
            id: t.identifier,
            position: this._getCanvasPos(t.clientX, t.clientY)
        }));
        if (this.touches.length === 0) {
            this.mouse.isDown = false;
            this.mouse.justReleased = true;
        }
    }

    _onTouchMove(e) {
        e.preventDefault();
        this.touches = Array.from(e.touches).map(t => ({
            id: t.identifier,
            position: this._getCanvasPos(t.clientX, t.clientY)
        }));
        if (this.touches.length > 0) {
            this.mouse.position = this.touches[0].position.clone();
        }
    }

    _onKeyDown(e) {
        if (!this.keys[e.code]) {
            this.keysJustPressed[e.code] =this.keysJustPressed[e.code] = true;
        }
        this.keys[e.code] = true;
    }

    _onKeyUp(e) {
        this.keys[e.code] = false;
        this.keysJustReleased[e.code] = true;
    }

    update(camera) {
        this.mouse.worldPosition = camera.screenToWorld(this.mouse.position);
    }

    lateUpdate() {
        this.mouse.justPressed = false;
        this.mouse.justReleased = false;
        this.mouse.wasDown = this.mouse.isDown;
        this.keysJustPressed = {};
        this.keysJustReleased = {};
    }

    isKeyDown(code) { return !!this.keys[code]; }
    isKeyJustPressed(code) { return !!this.keysJustPressed[code]; }
    isKeyJustReleased(code) { return !!this.keysJustReleased[code]; }
    isMouseDown() { return this.mouse.isDown; }
    isMouseJustPressed() { return this.mouse.justPressed; }
    isMouseJustReleased() { return this.mouse.justReleased; }
    getMousePos() { return this.mouse.position; }
    getMouseWorldPos() { return this.mouse.worldPosition; }
}

// ──────────────────────────────────────────
// セクション15: サウンドマネージャー（Web Audio API）
// ──────────────────────────────────────────

class SoundManager {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.sfxGain = null;
        this.bgmGain = null;
        this.sounds = {};
        this.currentBGM = null;
        this.initialized = false;
        this.masterVolume = 0.7;
        this.sfxVolume = 0.8;
        this.bgmVolume = 0.5;
    }

    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = this.masterVolume;
            this.masterGain.connect(this.ctx.destination);

            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.value = this.sfxVolume;
            this.sfxGain.connect(this.masterGain);

            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.value = this.bgmVolume;
            this.bgmGain.connect(this.masterGain);

            this.initialized = true;
            this._generateSounds();
        } catch (e) {
            console.warn('Web Audio API not supported');
        }
    }

    _generateSounds() {
        this.sounds.hit = this._createHitSound();
        this.sounds.deploy = this._createDeploySound();
        this.sounds.coin = this._createCoinSound();
        this.sounds.explosion = this._createExplosionSound();
        this.sounds.levelUp = this._createLevelUpSound();
        this.sounds.menuClick = this._createMenuClickSound();
        this.sounds.death = this._createDeathSound();
        this.sounds.victory = this._createVictorySound();
        this.sounds.defeat = this._createDefeatSound();
        this.sounds.special = this._createSpecialSound();
        this.sounds.charge = this._createChargeSound();
        this.sounds.spawn = this._createSpawnSound();
        this.sounds.critical = this._createCriticalSound();
        this.sounds.block = this._createBlockSound();
        this.sounds.wave = this._createWaveAlertSound();
    }

    _createBuffer(duration, fn) {
        const sampleRate = this.ctx.sampleRate;
        const length = Math.floor(sampleRate * duration);
        const buffer = this.ctx.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        fn(data, sampleRate, length);
        return buffer;
    }

    _createHitSound() {
        return this._createBuffer(0.15, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 35);
                data[i] = (Math.sin(t * 800 * Math.PI * 2) * 0.5 +
                           Math.sin(t * 1200 * Math.PI * 2) * 0.3 +
                           (Math.random() * 2 - 1) * 0.2) * env * 0.6;
            }
        });
    }

    _createDeploySound() {
        return this._createBuffer(0.25, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const freq = 300 + t * 2000;
                const env = Math.exp(-t * 10) * Math.sin(t * Math.PI / 0.25);
                data[i] = Math.sin(t * freq * Math.PI * 2) * env * 0.4;
            }
        });
    }

    _createCoinSound() {
        return this._createBuffer(0.2, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 15);
                data[i] = (Math.sin(t * 1500 * Math.PI * 2) * 0.5 +
                           Math.sin(t * 2250 * Math.PI * 2) * 0.3) * env * 0.35;
            }
        });
    }

    _createExplosionSound() {
        return this._createBuffer(0.5, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 6);
                const bass = Math.sin(t * 60 * Math.PI * 2) * 0.5;
                const noise = (Math.random() * 2 - 1) * 0.8;
                const mid = Math.sin(t * 200 * Math.PI * 2 * Math.exp(-t * 5)) * 0.3;
                data[i] = (bass + noise + mid) * env * 0.5;
            }
        });
    }

    _createLevelUpSound() {
        return this._createBuffer(0.6, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.sin(t * Math.PI / 0.6) * Math.exp(-t * 2);
                const freq1 = 400 + t * 800;
                const freq2 = 600 + t * 1200;
                data[i] = (Math.sin(t * freq1 * Math.PI * 2) * 0.4 +
                           Math.sin(t * freq2 * Math.PI * 2) * 0.3) * env * 0.4;
            }
        });
    }

    _createMenuClickSound() {
        return this._createBuffer(0.08, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 60);
                data[i] = Math.sin(t * 2000 * Math.PI * 2) * env * 0.3;
            }
        });
    }

    _createDeathSound() {
        return this._createBuffer(0.4, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 5);
                const freq = 500 * Math.exp(-t * 8);
                data[i] = (Math.sin(t * freq * Math.PI * 2) * 0.5 +
                           (Math.random() * 2 - 1) * 0.3) * env * 0.5;
            }
        });
    }

    _createVictorySound() {
        return this._createBuffer(1.0, (data, sr, len) => {
            const notes = [523.25, 659.25, 783.99, 1046.5];
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                let val = 0;
                for (let n = 0; n < notes.length; n++) {
                    const noteStart = n * 0.15;
                    const noteT = t - noteStart;
                    if (noteT >= 0) {
                        const env = Math.exp(-noteT * 3) * Math.min(noteT * 50, 1);
                        val += Math.sin(noteT * notes[n] * Math.PI * 2) * env * 0.25;
                    }
                }
                data[i] = val * 0.5;
            }
        });
    }

    _createDefeatSound() {
        return this._createBuffer(0.8, (data, sr, len) => {
            const notes = [400, 350, 300, 200];
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                let val = 0;
                for (let n = 0; n < notes.length; n++) {
                    const noteStart = n * 0.15;
                    const noteT = t - noteStart;
                    if (noteT >= 0) {
                        const env = Math.exp(-noteT * 4) * Math.min(noteT * 30, 1);
                        val += Math.sin(noteT * notes[n] * Math.PI * 2) * env * 0.25;
                    }
                }
                data[i] = val * 0.5;
            }
        });
    }

    _createSpecialSound() {
        return this._createBuffer(0.7, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.sin(t * Math.PI / 0.7);
                const sweep = Math.sin(t * (300 + t * 3000) * Math.PI * 2);
                const shimmer = Math.sin(t * 5000 * Math.PI * 2) * Math.sin(t * 20 * Math.PI * 2);
                data[i] = (sweep * 0.4 + shimmer * 0.2) * env * 0.45;
            }
        });
    }

    _createChargeSound() {
        return this._createBuffer(0.8, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = t / 0.8;
                const freq = 100 + t * t * 3000;
                data[i] = Math.sin(t * freq * Math.PI * 2) * env * 0.35;
            }
        });
    }

    _createSpawnSound() {
        return this._createBuffer(0.2, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 12);
                const freq = 800 + Math.sin(t * 30) * 200;
                data[i] = Math.sin(t * freq * Math.PI * 2) * env * 0.3;
            }
        });
    }

    _createCriticalSound() {
        return this._createBuffer(0.35, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 10);
                const crack = t < 0.02 ? (Math.random() * 2 - 1) * 1.0 : 0;
                const ring = Math.sin(t * 1500 * Math.PI * 2) * 0.4 +
                             Math.sin(t * 2000 * Math.PI * 2) * 0.3;
                data[i] = (crack + ring * env) * 0.5;
            }
        });
    }

    _createBlockSound() {
        return this._createBuffer(0.12, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.exp(-t * 40);
                data[i] = (Math.sin(t * 400 * Math.PI * 2) * 0.3 +
                           (Math.random() * 2 - 1) * 0.5) * env * 0.4;
            }
        });
    }

    _createWaveAlertSound() {
        return this._createBuffer(0.5, (data, sr, len) => {
            for (let i = 0; i < len; i++) {
                const t = i / sr;
                const env = Math.sin(t * Math.PI / 0.5);
                const siren = Math.sin(t * (600 + Math.sin(t * 8) * 200) * Math.PI * 2);
                data[i] = siren * env * 0.35;
            }
        });
    }

    play(name, options = {}) {
        if (!this.initialized || !this.sounds[name]) return null;
        const source = this.ctx.createBufferSource();
        source.buffer = this.sounds[name];

        const gainNode = this.ctx.createGain();
        gainNode.gain.value = options.volume !== undefined ? options.volume : 1;

        if (options.playbackRate) source.playbackRate.value = options.playbackRate;
        if (options.detune) source.detune.value = options.detune;

        source.connect(gainNode);
        gainNode.connect(this.sfxGain);
        source.start(0);
        return source;
    }

    playRandomPitch(name, minPitch = 0.9, maxPitch = 1.1) {
        return this.play(name, { playbackRate: MathUtils.random(minPitch, maxPitch) });
    }

    setMasterVolume(v) { this.masterVolume = v; if (this.masterGain) this.masterGain.gain.value = v; }
    setSFXVolume(v) { this.sfxVolume = v; if (this.sfxGain) this.sfxGain.gain.value = v; }
    setBGMVolume(v) { this.bgmVolume = v; if (this.bgmGain) this.bgmGain.gain.value = v; }

    resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
}
