// ──────────────────────────────────────────
// セクション16: プロシージャルグラフィック描画ユーティリティ
// ──────────────────────────────────────────

const DrawUtils = {
    roundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    },

    capsule(ctx, x1, y1, x2, y2, radius) {
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len === 0) {
            ctx.beginPath();
            ctx.arc(x1, y1, radius, 0, MathUtils.TAU);
            return;
        }
        const nx = -dy / len * radius, ny = dx / len * radius;
        const angle = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.arc(x1, y1, radius, angle + MathUtils.HALF_PI, angle - MathUtils.HALF_PI);
        ctx.lineTo(x2 + nx, y2 + ny);
        ctx.arc(x2, y2, radius, angle - MathUtils.HALF_PI, angle + MathUtils.HALF_PI);
        ctx.lineTo(x1 - nx, y1 - ny);
        ctx.closePath();
    },

    ellipse(ctx, cx, cy, rx, ry, rotation = 0) {
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, rotation, 0, MathUtils.TAU);
    },

    star(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        ctx.beginPath();
        for (let i = 0; i < spikes * 2; i++) {
            const radius = i % 2 === 0 ? outerRadius : innerRadius;
            const angle = (i / (spikes * 2)) * MathUtils.TAU - MathUtils.HALF_PI;
            const x = cx + Math.cos(angle) * radius;
            const y = cy + Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
    },

    heart(ctx, cx, cy, size) {
        ctx.beginPath();
        const topCurveHeight = size * 0.3;
        ctx.moveTo(cx, cy + size * 0.25);
        ctx.bezierCurveTo(cx, cy, cx - size / 2, cy, cx - size / 2, cy + topCurveHeight);
        ctx.bezierCurveTo(cx - size / 2, cy + (size + topCurveHeight) / 2, cx, cy + size * 0.8, cx, cy + size);
        ctx.bezierCurveTo(cx, cy + size * 0.8, cx + size / 2, cy + (size + topCurveHeight) / 2, cx + size / 2, cy + topCurveHeight);
        ctx.bezierCurveTo(cx + size / 2, cy, cx, cy, cx, cy + size * 0.25);
        ctx.closePath();
    },

    cloud(ctx, cx, cy, width, height) {
        ctx.beginPath();
        const bumps = 5;
        const bumpWidth = width / bumps;
        ctx.moveTo(cx - width / 2, cy);
        for (let i = 0; i < bumps; i++) {
            const x = cx - width / 2 + bumpWidth * (i + 0.5);
            const bh = height * (0.6 + Math.sin(i * 1.5) * 0.4);
            ctx.arc(x, cy - bh * 0.3, bumpWidth * 0.6, Math.PI, 0);
        }
        ctx.lineTo(cx + width / 2, cy);
        ctx.closePath();
    },

    speech_bubble(ctx, x, y, w, h, tailX, tailY, radius = 10) {
        DrawUtils.roundRect(ctx, x, y, w, h, radius);
        ctx.moveTo(tailX - 10, y + h);
        ctx.lineTo(tailX, tailY);
        ctx.lineTo(tailX + 10, y + h);
    },

    gradient(ctx, x, y, w, h, color1, color2, vertical = true) {
        const grad = vertical
            ? ctx.createLinearGradient(x, y, x, y + h)
            : ctx.createLinearGradient(x, y, x + w, y);
        grad.addColorStop(0, color1.toCSS());
        grad.addColorStop(1, color2.toCSS());
        return grad;
    },

    radialGradient(ctx, cx, cy, innerR, outerR, color1, color2) {
        const grad = ctx.createRadialGradient(cx, cy, innerR, cx, cy, outerR);
        grad.addColorStop(0, color1.toCSS());
        grad.addColorStop(1, color2.toCSS());
        return grad;
    },

    createShadow(ctx, offsetX, offsetY, blur, color) {
        ctx.shadowOffsetX = offsetX;
        ctx.shadowOffsetY = offsetY;
        ctx.shadowBlur = blur;
        ctx.shadowColor = color.toCSS();
    },

    clearShadow(ctx) {
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
    },

    drawTextWithOutline(ctx, text, x, y, fillColor, strokeColor, lineWidth = 3, font = '24px sans-serif') {
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeColor;
        ctx.fillStyle = fillColor;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillText(text, x, y);
    },

    drawNumberPopup(ctx, number, x, y, color, fontSize = 28) {
        const text = number > 0 ? `+${number}` : `${number}`;
        DrawUtils.drawTextWithOutline(ctx, text, x, y, color, 'rgba(0,0,0,0.7)', 4, `bold ${fontSize}px sans-serif`);
    },

    blobShape(ctx, cx, cy, radius, irregularity = 0.2, numPoints = 12, time = 0) {
        ctx.beginPath();
        for (let i = 0; i <= numPoints; i++) {
            const angle = (i / numPoints) * MathUtils.TAU;
            const noise = perlin.noise2D(Math.cos(angle) * 2 + time, Math.sin(angle) * 2 + time);
            const r = radius * (1 + noise * irregularity);
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
    },

    wavyLine(ctx, x1, y1, x2, y2, amplitude, frequency, time = 0) {
        const dx = x2 - x1, dy = y2 - y1;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const steps = Math.max(Math.floor(dist / 5), 10);
        const angle = Math.atan2(dy, dx);
        const perpX = -Math.sin(angle);
        const perpY = Math.cos(angle);

        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const baseX = MathUtils.lerp(x1, x2, t);
            const baseY = MathUtils.lerp(y1, y2, t);
            const wave = Math.sin(t * frequency * MathUtils.TAU + time) * amplitude;
            const px = baseX + perpX * wave;
            const py = baseY + perpY * wave;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
    },

    featherEdge(ctx, x, y, w, h, featherSize) {
        const grad = ctx.createLinearGradient(x, y, x, y + featherSize);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,1)');
        return grad;
    }
};

// ──────────────────────────────────────────
// セクション17: プロシージャルキャラクタージェネレーター
// ──────────────────────────────────────────

class CharacterRenderer {
    constructor() {
        this.time = 0;
        this.cache = new Map();
    }

    updateTime(dt) {
        this.time += dt;
    }

    drawCatBody(ctx, x, y, scale, color, squash = 1, stretch = 1, breathe = 0) {
        const s = scale;
        const bodyW = 32 * s * squash;
        const bodyH = 24 * s * stretch;
        const breatheOffset = Math.sin(breathe) * 1.5 * s;

        ctx.save();
        ctx.translate(x, y);

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, bodyH * 0.5 + 5 * s, bodyW * 0.8, 4 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 尻尾
        this._drawTail(ctx, -bodyW * 0.7, -bodyH * 0.1, s, color);

        // 後ろ足
        this._drawLeg(ctx, -bodyW * 0.3, bodyH * 0.3, s, color, -0.1);
        this._drawLeg(ctx, bodyW * 0.25, bodyH * 0.3, s, color, 0.05);

        // 胴体
        const bodyGrad = ctx.createRadialGradient(0, -breatheOffset, bodyW * 0.1, 0, 0, bodyW);
        bodyGrad.addColorStop(0, color.brighten(0.15).toCSS());
        bodyGrad.addColorStop(0.7, color.toCSS());
        bodyGrad.addColorStop(1, color.darken(0.1).toCSS());

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(0, -breatheOffset, bodyW, bodyH + breatheOffset, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 体の縞模様（オレンジ猫の場合）
        if (color.r > 0.8 && color.g > 0.5 && color.g < 0.75) {
            this._drawTabbyStripes(ctx, 0, -breatheOffset, bodyW, bodyH, s, color);
        }

        // お腹の白い部分
        ctx.fillStyle = new Color(1, 0.98, 0.95, 0.6).toCSS();
        ctx.beginPath();
        ctx.ellipse(0, bodyH * 0.1 - breatheOffset, bodyW * 0.55, bodyH * 0.6, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 前足
        this._drawLeg(ctx, -bodyW * 0.45, bodyH * 0.25, s, color, 0.08);
        this._drawLeg(ctx, bodyW * 0.35, bodyH * 0.25, s, color, -0.05);

        ctx.restore();
    }

    _drawTabbyStripes(ctx, cx, cy, bodyW, bodyH, scale, baseColor) {
        const stripeColor = baseColor.darken(0.2);
        stripeColor.a = 0.4;
        ctx.fillStyle = stripeColor.toCSS();

        for (let i = -2; i <= 2; i++) {
            ctx.save();
            ctx.translate(cx + i * bodyW * 0.22, cy);
            ctx.rotate(i * 0.1);
            ctx.beginPath();
            ctx.ellipse(0, 0, bodyW * 0.06, bodyH * 0.7, 0, 0, MathUtils.TAU);
            ctx.fill();
            ctx.restore();
        }
    }

    _drawTail(ctx, startX, startY, scale, color) {
        const segments = 8;
        const tailLength = 40 * scale;
        const segLen = tailLength / segments;
        const waveTime = this.time * 3;

        ctx.strokeStyle = color.toCSS();
        ctx.lineWidth = 6 * scale;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);

        let px = startX, py = startY;
        for (let i = 1; i <= segments; i++) {
            const t = i / segments;
            const wave = Math.sin(waveTime + t * 3) * 12 * scale * t;
            const nx = startX - segLen * i;
            const ny = startY - tailLength * 0.5 * t + wave;
            const cpx = (px + nx) / 2 + wave * 0.5;
            const cpy = (py + ny) / 2;
            ctx.quadraticCurveTo(cpx, cpy, nx, ny);
            px = nx; py = ny;
        }
        ctx.stroke();

        // 尻尾の先端
        ctx.fillStyle = color.darken(0.1).toCSS();
        ctx.beginPath();
        ctx.arc(px, py, 4 * scale, 0, MathUtils.TAU);
        ctx.fill();
    }

    _drawLeg(ctx, x, y, scale, color, angleOffset = 0) {
        const legLength = 14 * scale;
        const legWidth = 5 * scale;
        const pawSize = 6 * scale;
        const angle = MathUtils.HALF_PI + angleOffset;

        const endX = x + Math.cos(angle) * legLength;
        const endY = y + Math.sin(angle) * legLength;

        // 足
        ctx.fillStyle = color.darken(0.05).toCSS();
        DrawUtils.capsule(ctx, x, y, endX, endY, legWidth);
        ctx.fill();

        // 肉球
        ctx.fillStyle = new Color(1, 0.7, 0.75, 1).toCSS();
        ctx.beginPath();
        ctx.ellipse(endX, endY + pawSize * 0.3, pawSize, pawSize * 0.7, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 肉球パッド
        ctx.fillStyle = new Color(1, 0.55, 0.6, 0.8).toCSS();
        const padSize = pawSize * 0.25;
        for (let p = -1; p <= 1; p++) {
            ctx.beginPath();
            ctx.arc(endX + p * padSize * 1.5, endY + pawSize * 0.05, padSize, 0, MathUtils.TAU);
            ctx.fill();
        }
        ctx.beginPath();
        ctx.ellipse(endX, endY + pawSize * 0.45, padSize * 1.2, padSize * 0.9, 0, 0, MathUtils.TAU);
        ctx.fill();
    }

    drawCatHead(ctx, x, y, scale, color, expression = 'normal', headTilt = 0) {
        const s = scale;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(headTilt);

        const headW = 28 * s;
        const headH = 24 * s;

        // 耳（後ろ）
        this._drawEar(ctx, -headW * 0.55, -headH * 0.6, s, color, -0.3, false);
        this._drawEar(ctx, headW * 0.55, -headH * 0.6, s, color, 0.3, true);

        // 頭の形状
        const headGrad = ctx.createRadialGradient(-headW * 0.1, -headH * 0.1, headW * 0.2, 0, 0, headW);
        headGrad.addColorStop(0, color.brighten(0.12).toCSS());
        headGrad.addColorStop(1, color.darken(0.05).toCSS());
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, headW, headH, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 頬
        ctx.fillStyle = new Color(1, 0.75, 0.78, 0.35).toCSS();
        ctx.beginPath();
        ctx.ellipse(-headW * 0.55, headH * 0.15, 8 * s, 5 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(headW * 0.55, headH * 0.15, 8 * s, 5 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 顔のパーツ
        this._drawFace(ctx, 0, 0, s, expression);

        // ヒゲ
        this._drawWhiskers(ctx, 0, headH * 0.1, s);

        ctx.restore();
    }

    _drawEar(ctx, x, y, scale, color, angle, flip) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        const earW = 12 * scale;
        const earH = 18 * scale;

        // 外耳
        ctx.fillStyle = color.darken(0.05).toCSS();
        ctx.beginPath();
        ctx.moveTo(0, earH * 0.3);
        ctx.bezierCurveTo(-earW, -earH * 0.2, -earW * 0.3, -earH, 0, -earH);
        ctx.bezierCurveTo(earW * 0.3, -earH, earW, -earH * 0.2, 0, earH * 0.3);
        ctx.fill();

        // 内耳
        ctx.fillStyle = new Color(1, 0.7, 0.75, 0.7).toCSS();
        ctx.beginPath();
        ctx.moveTo(0, earH * 0.1);
        ctx.bezierCurveTo(-earW * 0.6, -earH * 0.1, -earW * 0.2, -earH * 0.75, 0, -earH * 0.7);
        ctx.bezierCurveTo(earW * 0.2, -earH * 0.75, earW * 0.6, -earH * 0.1, 0, earH * 0.1);
        ctx.fill();

        ctx.restore();
    }

    _drawFace(ctx, cx, cy, scale, expression) {
        const s = scale;
        const eyeSpacing = 12 * s;
        const eyeY = cy - 3 * s;
        const eyeSize = 6 * s;

        switch (expression) {
            case 'normal':
                this._drawEyeNormal(ctx, cx - eyeSpacing, eyeY, eyeSize);
                this._drawEyeNormal(ctx, cx + eyeSpacing, eyeY, eyeSize);
                this._drawMouth(ctx, cx, cy + 8 * s, s, 'normal');
                break;
            case 'happy':
                this._drawEyeHappy(ctx, cx - eyeSpacing, eyeY, eyeSize);
                this._drawEyeHappy(ctx, cx + eyeSpacing, eyeY, eyeSize);
                this._drawMouth(ctx, cx, cy + 8 * s, s, 'happy');
                break;
            case 'angry':
                this._drawEyeAngry(ctx, cx - eyeSpacing, eyeY, eyeSize, false);
                this._drawEyeAngry(ctx, cx + eyeSpacing, eyeY, eyeSize, true);
                this._drawMouth(ctx, cx, cy + 8 * s, s, 'angry');
                break;
            case 'hurt':
                this._drawEyeHurt(ctx, cx - eyeSpacing, eyeY, eyeSize);
                this._drawEyeHurt(ctx, cx + eyeSpacing, eyeY, eyeSize);
                this._drawMouth(ctx, cx, cy + 10 * s, s, 'hurt');
                break;
            case 'dead':
                this._drawEyeDead(ctx, cx - eyeSpacing, eyeY, eyeSize);
                this._drawEyeDead(ctx, cx + eyeSpacing, eyeY, eyeSize);
                this._drawMouth(ctx, cx, cy + 10 * s, s, 'dead');
                break;
            case 'determined':
                this._drawEyeDetermined(ctx, cx - eyeSpacing, eyeY, eyeSize, false);
                this._drawEyeDetermined(ctx, cx + eyeSpacing, eyeY, eyeSize, true);
                this._drawMouth(ctx, cx, cy + 8 * s, s, 'determined');
                break;
            case 'surprised':
                this._drawEyeSurprised(ctx, cx - eyeSpacing, eyeY, eyeSize);
                this._drawEyeSurprised(ctx, cx + eyeSpacing, eyeY, eyeSize);
                this._drawMouth(ctx, cx, cy + 10 * s, s, 'surprised');
                break;
        }

        // 鼻
        ctx.fillStyle = new Color(1, 0.6, 0.65, 0.9).toCSS();
        ctx.beginPath();
        ctx.moveTo(cx, cy + 2 * s);
        ctx.lineTo(cx - 3 * s, cy + 5 * s);
        ctx.lineTo(cx + 3 * s, cy + 5 * s);
        ctx.closePath();
        ctx.fill();
    }

    _drawEyeNormal(ctx, x, y, size) {
        // 白目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x, y, size, size * 1.1, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 瞳
        const pupilSize = size * 0.65;
        const grad = ctx.createRadialGradient(x - pupilSize * 0.2, y - pupilSize * 0.2, pupilSize * 0.1, x, y, pupilSize);
        grad.addColorStop(0, '#333');
        grad.addColorStop(0.6, '#111');
        grad.addColorStop(1, '#000');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(x, y + size * 0.05, pupilSize, pupilSize * 1.1, 0, 0, MathUtils.TAU);
        ctx.fill();

        // ハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(x + size * 0.2, y - size * 0.25, size * 0.25, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - size * 0.15, y + size * 0.15, size * 0.12, 0, MathUtils.TAU);
        ctx.fill();
    }

    _drawEyeHappy(ctx, x, y, size) {
        ctx.strokeStyle = '#222';
        ctx.lineWidth = size * 0.35;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(x, y + size * 0.2, size * 0.7, Math.PI + 0.3, -0.3);
        ctx.stroke();
    }

    _drawEyeAngry(ctx, x, y, size, flip) {
        // 白目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x, y, size, size * 0.9, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 瞳（小さめ）
        ctx.fillStyle = '#a00';
        ctx.beginPath();
        ctx.ellipse(x, y, size * 0.5, size * 0.55, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = '#300';
        ctx.beginPath();
        ctx.arc(x, y, size * 0.3, 0, MathUtils.TAU);
        ctx.fill();

        // ハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(x + size * 0.15, y - size * 0.2, size * 0.15, 0, MathUtils.TAU);
        ctx.fill();

        // 眉毛
        ctx.strokeStyle = '#222';
        ctx.lineWidth = size * 0.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (flip) {
            ctx.moveTo(x - size * 1.1, y - size * 0.8);
            ctx.lineTo(x + size * 0.8, y - size * 1.3);
        } else {
            ctx.moveTo(x + size * 1.1, y - size * 0.8);
            ctx.lineTo(x - size * 0.8, y - size * 1.3);
        }
        ctx.stroke();
    }

    _drawEyeHurt(ctx, x, y, size) {
        ctx.strokeStyle = '#444';
        ctx.lineWidth = size * 0.3;
        ctx.lineCap = 'round';
        // X eyes
        ctx.beginPath();
        ctx.moveTo(x - size * 0.5, y - size * 0.5);
        ctx.lineTo(x + size * 0.5, y + size * 0.5);
        ctx.moveTo(x + size * 0.5, y - size * 0.5);
        ctx.lineTo(x - size * 0.5, y + size * 0.5);
        ctx.stroke();
    }

    _drawEyeDead(ctx, x, y, size) {
        ctx.strokeStyle = '#666';
        ctx.lineWidth = size * 0.3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - size * 0.6, y - size * 0.6);
        ctx.lineTo(x + size * 0.6, y + size * 0.6);
        ctx.moveTo(x + size * 0.6, y - size * 0.6);
        ctx.lineTo(x - size * 0.6, y + size * 0.6);
        ctx.stroke();

        // 渦巻き目
        ctx.strokeStyle = '#888';
        ctx.lineWidth = size * 0.15;
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
            const angle = i * MathUtils.TAU / 3 + this.time * 2;
            const r = size * 0.2 * (i + 1) / 3;
            ctx.arc(x, y, r, angle, angle + 2);
        }
        ctx.stroke();
    }

    _drawEyeDetermined(ctx, x, y, size, flip) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x, y, size, size * 0.85, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 瞳（キラキラ）
        const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 0.6);
        grad.addColorStop(0, '#ff8800');
        grad.addColorStop(0.5, '#cc4400');
        grad.addColorStop(1, '#661100');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, size * 0.55, 0, MathUtils.TAU);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x, y + size * 0.05, size * 0.3, 0, MathUtils.TAU);
        ctx.fill();

        // 大きなハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.arc(x + size * 0.18, y - size * 0.18, size * 0.22, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - size * 0.12, y + size * 0.18, size * 0.1, 0, MathUtils.TAU);
        ctx.fill();

        // 眉毛
        ctx.strokeStyle = '#333';
        ctx.lineWidth = size * 0.35;
        ctx.lineCap = 'round';
        ctx.beginPath();
        const browOffset = flip ? 0.15 : -0.15;
        ctx.moveTo(x - size, y - size * 1.1 + browOffset * size);
        ctx.lineTo(x + size, y - size * 1.1 - browOffset * size);
        ctx.stroke();
    }

    _drawEyeSurprised(ctx, x, y, size) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, size * 1.2, 0, MathUtils.TAU);
        ctx.fill();

        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(x, y, size * 0.5, 0, MathUtils.TAU);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(x + size * 0.25, y - size * 0.3, size * 0.25, 0, MathUtils.TAU);
        ctx.fill();
    }

    _drawMouth(ctx, x, y, scale, type) {
        const s = scale;
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5 * s;
        ctx.lineCap = 'round';

        switch (type) {
            case 'normal':
                // 猫口（ω）
                ctx.beginPath();
                ctx.moveTo(x - 5 * s, y);
                ctx.quadraticCurveTo(x - 2 * s, y + 4 * s, x, y + 1 * s);
                ctx.quadraticCurveTo(x + 2 * s, y + 4 * s, x + 5 * s, y);
                ctx.stroke();
                break;
            case 'happy':
                ctx.beginPath();
                ctx.moveTo(x - 7 * s, y - 1 * s);
                ctx.quadraticCurveTo(x - 3 * s, y + 6 * s, x, y + 3 * s);
                ctx.quadraticCurveTo(x + 3 * s, y + 6 * s, x + 7 * s, y - 1 * s);
                ctx.stroke();
                break;
            case 'angry':
                ctx.lineWidth = 2 * s;
                ctx.beginPath();
                ctx.moveTo(x - 6 * s, y + 2 * s);
                ctx.lineTo(x - 2 * s, y);
                ctx.lineTo(x + 2 * s, y);
                ctx.lineTo(x + 6 * s, y + 2 * s);
                ctx.stroke();
                // 牙
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(x - 4 * s, y);
                ctx.lineTo(x - 3 * s, y + 4 * s);
                ctx.lineTo(x - 2 * s, y);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 2 * s, y);
                ctx.lineTo(x + 3 * s, y + 4 * s);
                ctx.lineTo(x + 4 * s, y);
                ctx.fill();
                break;
            case 'hurt':
                ctx.beginPath();
                ctx.arc(x, y + 2 * s, 4 * s, 0, Math.PI, true);
                ctx.stroke();
                break;
            case 'dead':
                ctx.beginPath();
                ctx.moveTo(x - 5 * s, y + 2 * s);
                ctx.quadraticCurveTo(x, y - 2 * s, x + 5 * s, y + 2 * s);
                ctx.stroke();
                // 魂が出る
                ctx.fillStyle = 'rgba(200,200,255,0.4)';
                const soulY = y - 15 * s - Math.sin(this.time * 3) * 5 * s;
                ctx.beginPath();
                ctx.ellipse(x, soulY, 5 * s, 7 * s, 0, 0, MathUtils.TAU);
                ctx.fill();
                break;
            case 'determined':
                ctx.lineWidth = 2 * s;
                ctx.beginPath();
                ctx.moveTo(x - 4 * s, y + 1 * s);
                ctx.lineTo(x, y - 1 * s);
                ctx.lineTo(x + 4 * s, y + 1 * s);
                ctx.stroke();
                break;
            case 'surprised':
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.ellipse(x, y + 2 * s, 4 * s, 5 * s, 0, 0, MathUtils.TAU);
                ctx.fill();
                ctx.fillStyle = new Color(0.8, 0.2, 0.25, 0.8).toCSS();
                ctx.beginPath();
                ctx.ellipse(x, y + 2 * s, 3 * s, 4 * s, 0, 0, MathUtils.TAU);
                ctx.fill();
                break;
        }
    }

    _drawWhiskers(ctx, cx, cy, scale) {
        const s = scale;
        const whiskerLength = 22 * s;

        ctx.strokeStyle = 'rgba(80,70,60,0.5)';
        ctx.lineWidth = 1 * s;
        ctx.lineCap = 'round';

        const wave = Math.sin(this.time * 2) * 0.05;
        const whiskerData = [
            { x: -8 * s, y: -2 * s, angle: Math.PI + 0.3 + wave, len: whiskerLength },
            { x: -8 * s, y: 2 * s, angle: Math.PI - 0.1 + wave, len: whiskerLength * 0.9 },
            { x: -8 * s, y: 6 * s, angle: Math.PI - 0.4 + wave, len: whiskerLength * 0.8 },
            { x: 8 * s, y: -2 * s, angle: -0.3 - wave, len: whiskerLength },
            { x: 8 * s, y: 2 * s, angle: 0.1 - wave, len: whiskerLength * 0.9 },
            { x: 8 * s, y: 6 * s, angle: 0.4 - wave, len: whiskerLength * 0.8 },
        ];

        for (const w of whiskerData) {
            ctx.beginPath();
            ctx.moveTo(cx + w.x, cy + w.y);
            const endX = cx + w.x + Math.cos(w.angle) * w.len;
            const endY = cy + w.y + Math.sin(w.angle) * w.len;
            const cpX = cx + w.x + Math.cos(w.angle) * w.len * 0.5;
            const cpY = cy + w.y + Math.sin(w.angle + 0.1) * w.len * 0.5;
            ctx.quadraticCurveTo(cpX, cpY, endX, endY);
            ctx.stroke();
        }
    }

    drawFullCat(ctx, x, y, scale, color, state = {}) {
        const {
            expression = 'normal',
            walkPhase = 0,
            attackPhase = -1,
            damageFlash = 0,
            squash = 1,
            stretch = 1,
            headTilt = 0,
            breathePhase = 0,
            opacity = 1,
            bodyOffsetY = 0,
            headOffsetX = 0,
            headOffsetY = 0,
            accessory = null,
        } = state;

        ctx.save();
        ctx.globalAlpha = opacity;

        if (damageFlash > 0) {
            ctx.filter = `brightness(${1 + damageFlash * 2}) saturate(${1 - damageFlash * 0.5})`;
        }

        // 歩行アニメーション
        let legBounce = 0;
        if (walkPhase >= 0) {
            legBounce = Math.sin(walkPhase * MathUtils.TAU) * 3 * scale;
        }

        // 攻撃モーション
        let attackStretch = 1;
        let attackSquash = 1;
        let attackLunge = 0;
        if (attackPhase >= 0 && attackPhase <= 1) {
            if (attackPhase < 0.2) {
                // 予備動作（溜め）
                const t = attackPhase / 0.2;
                attackStretch = 1 - t * 0.15;
                attackSquash = 1 + t * 0.2;
                attackLunge = -t * 8 * scale;
            } else if (attackPhase < 0.4) {
                // 攻撃
                const t = (attackPhase - 0.2) / 0.2;
                const ease = EASING.easeOutBack(t);
                attackStretch = 0.85 + ease * 0.3;
                attackSquash = 1.2 - ease * 0.3;
                attackLunge = -8 * scale + ease * 25 * scale;
            } else {
                // フォロースルー
                const t = (attackPhase - 0.4) / 0.6;
                const ease = EASING.easeOutElastic(t);
                attackStretch = 1.15 - ease * 0.15;
                attackSquash = 0.9 + ease * 0.1;
                attackLunge = 17 * scale * (1 - ease);
            }
        }

        const totalSquash = squash * attackSquash;
        const totalStretch = stretch * attackStretch;

        // 体を描画
        this.drawCatBody(ctx,
            x + attackLunge,
            y + bodyOffsetY + legBounce,
            scale,
            color,
            totalSquash,
            totalStretch,
            breathePhase
        );

        // 頭を描画
        const headBaseY = y - 28 * scale * totalStretch + bodyOffsetY + legBounce;
        const headBaseX = x + attackLunge * 0.7 + headOffsetX;
        this.drawCatHead(ctx,
            headBaseX,
            headBaseY + headOffsetY,
            scale,
            color,
            expression,
            headTilt + Math.sin(walkPhase * MathUtils.TAU) * 0.05
        );

        // アクセサリー
        if (accessory) {
            this._drawAccessory(ctx, headBaseX, headBaseY + headOffsetY, scale, accessory);
        }

        ctx.restore();
    }

    _drawAccessory(ctx, x, y, scale, type) {
        const s = scale;
        switch (type) {
            case 'helmet':
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.ellipse(x, y - 15 * s, 20 * s, 12 * s, 0, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#aaa';
                ctx.beginPath();
                ctx.ellipse(x, y - 22 * s, 5 * s, 8 * s, 0, 0, MathUtils.TAU);
                ctx.fill();
                break;
            case 'crown':
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.moveTo(x - 15 * s, y - 15 * s);
                ctx.lineTo(x - 12 * s, y - 28 * s);
                ctx.lineTo(x - 5 * s, y - 20 * s);
                ctx.lineTo(x, y - 32 * s);
                ctx.lineTo(x + 5 * s, y - 20 * s);
                ctx.lineTo(x + 12 * s, y - 28 * s);
                ctx.lineTo(x + 15 * s, y - 15 * s);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(x, y - 25 * s, 2.5 * s, 0, MathUtils.TAU);
                ctx.fill();
                break;
            case 'bandana':
                ctx.fillStyle = '#e22';
                ctx.beginPath();
                ctx.ellipse(x, y - 2 * s, 22 * s, 4 * s, 0.1, 0, MathUtils.TAU);
                ctx.fill();
                // 結び目
                ctx.beginPath();
                ctx.moveTo(x + 18 * s, y - 2 * s);
                ctx.lineTo(x + 30 * s, y - 10 * s);
                ctx.lineTo(x + 25 * s, y + 2 * s);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 18 * s, y - 2 * s);
                ctx.lineTo(x + 28 * s, y + 5 * s);
                ctx.lineTo(x + 22 * s, y + 8 * s);
                ctx.closePath();
                ctx.fill();
                break;
            case 'wizard_hat':
                ctx.fillStyle = '#3333aa';
                ctx.beginPath();
                ctx.moveTo(x - 18 * s, y - 12 * s);
                ctx.quadraticCurveTo(x - 5 * s, y - 15 * s, x + 5 * s, y - 50 * s);
                ctx.quadraticCurveTo(x + 5 * s, y - 15 * s, x + 18 * s, y - 12 * s);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                DrawUtils.star(ctx, x + 2 * s, y - 30 * s, 5, 5 * s, 2.5 * s);
                ctx.fill();
                break;
            case 'ribbon':
                ctx.fillStyle = '#ff69b4';
                ctx.beginPath();
                ctx.ellipse(x + 12 * s, y - 20 * s, 8 * s, 5 * s, 0.3, 0, MathUtils.TAU);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + 12 * s, y - 14 * s, 6 * s, 4 * s, -0.2, 0, MathUtils.TAU);
                ctx.fill();
                ctx.fillStyle = '#ff1493';
                ctx.beginPath();
                ctx.arc(x + 12 * s, y - 17 * s, 3 * s, 0, MathUtils.TAU);
                ctx.fill();
                break;
        }
    }

    // ──── 敵キャラクター描画 ────

    drawEnemyBasic(ctx, x, y, scale, type = 'dog', state = {}) {
        const {
            expression = 'angry',
            walkPhase = 0,
            attackPhase = -1,
            damageFlash = 0,
            squash = 1,
            stretch = 1,
            opacity = 1,
            hpRatio = 1,
        } = state;

        ctx.save();
        ctx.globalAlpha = opacity;

        if (damageFlash > 0) {
            ctx.filter = `brightness(${1 + damageFlash * 2})`;
        }

        switch (type) {
            case 'dog': this._drawDogEnemy(ctx, x, y, scale, state); break;
            case 'snake': this._drawSnakeEnemy(ctx, x, y, scale, state); break;
            case 'bird': this._drawBirdEnemy(ctx, x, y, scale, state); break;
            case 'boss_bear': this._drawBossEnemy(ctx, x, y, scale, state); break;
            case 'slime': this._drawSlimeEnemy(ctx, x, y, scale, state); break;
            case 'robot': this._drawRobotEnemy(ctx, x, y, scale, state); break;
            default: this._drawDogEnemy(ctx, x, y, scale, state); break;
        }

        ctx.restore();
    }

    _drawDogEnemy(ctx, x, y, scale, state) {
        const s = scale;
        const bounce = Math.sin((state.walkPhase || 0) * MathUtils.TAU) * 3 * s;
        const breathe = Math.sin(this.time * 2.5) * 1.5 * s;

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x, y + 25 * s, 25 * s, 5 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 尻尾
        ctx.strokeStyle = ColorPalette.enemyRed.darken(0.1).toCSS();
        ctx.lineWidth = 5 * s;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + 20 * s, y - 5 * s + bounce);
        const tailWave = Math.sin(this.time * 5) * 10 * s;
        ctx.quadraticCurveTo(x + 35 * s, y - 20 * s + tailWave, x + 30 * s, y - 35 * s + tailWave);
        ctx.stroke();

        // 後ろ足
        ctx.fillStyle = ColorPalette.enemyRed.darken(0.15).toCSS();
        const backLegAng = Math.sin((state.walkPhase || 0) * MathUtils.TAU + Math.PI) * 0.3;
        this._drawEnemyLeg(ctx, x + 12 * s, y + 12 * s + bounce, s * 0.9, backLegAng);
        this._drawEnemyLeg(ctx, x - 8 * s, y + 12 * s + bounce, s * 0.9, -backLegAng);

        // 体
        const bodyGrad = ctx.createRadialGradient(x - 5 * s, y - 8 * s + bounce, 5 * s, x, y + bounce, 28 * s);
        bodyGrad.addColorStop(0, ColorPalette.enemyRed.brighten(0.1).toCSS());
        bodyGrad.addColorStop(1, ColorPalette.enemyRed.darken(0.15).toCSS());
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(x, y + bounce - breathe, 28 * s * (state.squash || 1), 20 * s * (state.stretch || 1), 0, 0, MathUtils.TAU);
        ctx.fill();

        // お腹
        ctx.fillStyle = ColorPalette.enemyRed.brighten(0.25).toCSS();
        ctx.globalAlpha *= 0.5;
        ctx.beginPath();
        ctx.ellipse(x, y + 5 * s + bounce - breathe, 16 * s, 12 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.globalAlpha /= 0.5;

        // 前足
        const frontLegAng = Math.sin((state.walkPhase || 0) * MathUtils.TAU) * 0.3;
        ctx.fillStyle = ColorPalette.enemyRed.toCSS();
        this._drawEnemyLeg(ctx, x - 15 * s, y + 10 * s + bounce, s * 0.9, frontLegAng);
        this._drawEnemyLeg(ctx, x + 5 * s, y + 10 * s + bounce, s * 0.9, -frontLegAng);

        // 頭
        const headY = y - 25 * s + bounce - breathe;
        const headX = x - 8 * s;

        // 耳
        ctx.fillStyle = ColorPalette.enemyRed.darken(0.05).toCSS();
        ctx.beginPath();
        ctx.moveTo(headX - 14 * s, headY - 5 * s);
        ctx.lineTo(headX - 20 * s, headY - 22 * s);
        ctx.lineTo(headX - 5 * s, headY - 10 * s);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(headX + 14 * s, headY - 5 * s);
        ctx.lineTo(headX + 20 * s, headY - 22 * s);
        ctx.lineTo(headX + 5 * s, headY - 10 * s);
        ctx.closePath();
        ctx.fill();

        // 頭本体
        const headGrad = ctx.createRadialGradient(headX - 3 * s, headY - 5 * s, 3 * s, headX, headY, 18 * s);
        headGrad.addColorStop(0, ColorPalette.enemyRed.brighten(0.1).toCSS());
        headGrad.addColorStop(1, ColorPalette.enemyRed.darken(0.1).toCSS());
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.ellipse(headX, headY, 18 * s, 15 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 鼻
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.ellipse(headX - 16 * s, headY + 2 * s, 5 * s, 4 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(headX - 17 * s, headY, 1.5 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 目
        const eyeX = headX - 5 * s;
        const eyeY = headY - 3 * s;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(eyeX, eyeY, 6 * s, 5.5 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(eyeX - 1 * s, eyeY + 0.5 * s, 3 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(eyeX + 1 * s, eyeY - 1.5 * s, 1.2 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 眉毛（怒り）
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2.5 * s;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(eyeX - 7 * s, eyeY - 8 * s);
        ctx.lineTo(eyeX + 5 * s, eyeY - 6 * s);
        ctx.stroke();

        // 口
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5 * s;
        ctx.beginPath();
        ctx.moveTo(headX - 14 * s, headY + 6 * s);
        ctx.quadraticCurveTo(headX - 8 * s, headY + 10 * s, headX, headY + 7 * s);
        ctx.stroke();

        // 牙
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(headX - 12 * s, headY + 6 * s);
        ctx.lineTo(headX - 10 * s, headY + 11 * s);
        ctx.lineTo(headX - 8 * s, headY + 6 * s);
        ctx.fill();
    }

    _drawEnemyLeg(ctx, x, y, scale, angle) {
        const s = scale;
        const legLen = 16 * s;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.beginPath();
        DrawUtils.capsule(ctx, 0, 0, 0, legLen, 4 * s);
        ctx.fill();

        // 足先
        ctx.fillStyle = ctx.fillStyle;
        ctx.beginPath();
        ctx.ellipse(0, legLen, 5 * s, 3 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        ctx.restore();
    }

    _drawSnakeEnemy(ctx, x, y, scale, state) {
        const s = scale;
        const segments = 12;
        const segLen = 12 * s;

        // 蛇の体をサイン波で描画
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let i = segments; i >= 0; i--) {
            const t = i / segments;
            const wave = Math.sin(this.time * 4 + t * 4) * 15 * s;
            const sx = x + t * segLen * segments * 0.5;
            const sy = y + wave;
            const thickness = MathUtils.lerp(8, 3, t) * s;

            const colorT = t * 0.3;
            const segColor = ColorPalette.enemyGreen.lerp(ColorPalette.enemyGreen.brighten(0.2), Math.sin(t * 5 + this.time) * 0.5 + 0.5);

            ctx.fillStyle = segColor.toCSS();
            ctx.beginPath();
            ctx.arc(sx, sy, thickness, 0, MathUtils.TAU);
            ctx.fill();

            // 模様
            if (i % 3 === 0) {
                ctx.fillStyle = ColorPalette.enemyGreen.darken(0.3).toCSS();
                ctx.beginPath();
                ctx.arc(sx, sy, thickness * 0.5, 0, MathUtils.TAU);
                ctx.fill();
            }
        }

        // 頭
        const headX = x;
        const headY = y + Math.sin(this.time * 4) * 15 * s;

        ctx.fillStyle = ColorPalette.enemyGreen.brighten(0.05).toCSS();
        ctx.beginPath();
        ctx.ellipse(headX, headY, 12 * s, 10 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 目
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.ellipse(headX - 5 * s, headY - 3 * s, 4 * s, 5 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(headX - 5 * s, headY - 3 * s, 1.5 * s, 4 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 舌
        const tonguePhase = Math.sin(this.time * 6);
        if (tonguePhase > 0.3) {
            ctx.strokeStyle = '#e33';
            ctx.lineWidth = 1.5 * s;
            ctx.beginPath();
            ctx.moveTo(headX - 12 * s, headY + 2 * s);
            ctx.quadraticCurveTo(headX - 18 * s, headY + tonguePhase * 5 * s, headX - 22 * s, headY - 2 * s);
            ctx.moveTo(headX - 18 * s, headY + tonguePhase * 3 * s);
            ctx.quadraticCurveTo(headX - 20 * s, headY + tonguePhase * 8 * s, headX - 24 * s, headY + 4 * s);
            ctx.stroke();
        }
    }

    _drawBirdEnemy(ctx, x, y, scale, state) {
        const s = scale;
        const flapPhase = this.time * 6;
        const wingAngle = Math.sin(flapPhase) * 0.6;
        const bobY = Math.sin(this.time * 3) * 5 * s;

        // 影（地面）
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(x, y + 40 * s, 20 * s, 4 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        const birdY = y - 15 * s + bobY;

        // 翼（後ろ）
        ctx.fillStyle = ColorPalette.enemyPurple.darken(0.1).toCSS();
        ctx.save();
        ctx.translate(x + 5 * s, birdY);
        ctx.rotate(wingAngle + 0.2);
        ctx.beginPath();
        ctx.ellipse(0, -10 * s, 8 * s, 22 * s, 0.3, 0, MathUtils.TAU);
        ctx.fill();
        ctx.restore();

        // 体
        const bodyGrad = ctx.createRadialGradient(x - 3 * s, birdY - 3 * s, 3 * s, x, birdY, 16 * s);
        bodyGrad.addColorStop(0, ColorPalette.enemyPurple.brighten(0.1).toCSS());
        bodyGrad.addColorStop(1, ColorPalette.enemyPurple.darken(0.1).toCSS());
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(x, birdY, 15 * s, 12 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // お腹
        ctx.fillStyle = ColorPalette.enemyPurple.brighten(0.3).toCSS();
        ctx.globalAlpha *= 0.5;
        ctx.beginPath();
        ctx.ellipse(x, birdY + 3 * s, 9 * s, 7 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.globalAlpha /= 0.5;

        // 翼（前）
        ctx.fillStyle = ColorPalette.enemyPurple.toCSS();
        ctx.save();
        ctx.translate(x - 5 * s, birdY);
        ctx.rotate(-wingAngle - 0.2);
        ctx.beginPath();
        ctx.ellipse(0, -12 * s, 9 * s, 24 * s, -0.3, 0, MathUtils.TAU);
        ctx.fill();
        ctx.restore();

        // 頭
        ctx.fillStyle = ColorPalette.enemyPurple.brighten(0.05).toCSS();
        ctx.beginPath();
        ctx.arc(x - 10 * s, birdY - 10 * s, 10 * s, 0, MathUtils.TAU);
        ctx.fill();

        // くちばし
        ctx.fillStyle = '#f90';
        ctx.beginPath();
        ctx.moveTo(x - 20 * s, birdY - 12 * s);
        ctx.lineTo(x - 28 * s, birdY - 10 * s);
        ctx.lineTo(x - 20 * s, birdY - 7 * s);
        ctx.closePath();
        ctx.fill();

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - 13 * s, birdY - 12 * s, 4 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x - 14 * s, birdY - 12 * s, 2 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - 13 * s, birdY - 13 * s, 1 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 足
        ctx.strokeStyle = '#f90';
        ctx.lineWidth = 1.5 * s;
        ctx.beginPath();
        ctx.moveTo(x - 3 * s, birdY + 10 * s);
        ctx.lineTo(x - 5 * s, birdY + 22 * s);
        ctx.moveTo(x - 5 * s, birdY + 22 * s);
        ctx.lineTo(x - 8 * s, birdY + 24 * s);
        ctx.moveTo(x - 5 * s, birdY + 22 * s);
        ctx.lineTo(x - 2 * s, birdY + 24 * s);

        ctx.moveTo(x + 3 * s, birdY + 10 * s);
        ctx.lineTo(x + 1 * s, birdY + 22 * s);
        ctx.moveTo(x + 1 * s, birdY + 22 * s);
        ctx.lineTo(x - 2 * s, birdY + 24 * s);
        ctx.moveTo(x + 1 * s, birdY + 22 * s);
        ctx.lineTo(x + 4 * s, birdY + 24 * s);
        ctx.stroke();
    }

    _drawSlimeEnemy(ctx, x, y, scale, state) {
        const s = scale;
        const squishTime = this.time * 2;
        const squish = 1 + Math.sin(squishTime) * 0.1;
        const antiSquish = 1 - Math.sin(squishTime) * 0.08;

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath();
        ctx.ellipse(x, y + 18 * s, 22 * s * squish, 4 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // スライム本体
        const slimeColor = ColorPalette.enemyBlue;
        const bodyGrad = ctx.createRadialGradient(x - 5 * s, y - 10 * s, 3 * s, x, y, 25 * s);
        bodyGrad.addColorStop(0, slimeColor.brighten(0.3).toCSS());
        bodyGrad.addColorStop(0.5, slimeColor.toCSS());
        bodyGrad.addColorStop(1, slimeColor.darken(0.2).toCSS());
        ctx.fillStyle = bodyGrad;

        // ブロブ形状
        ctx.beginPath();
        const blobPoints = 16;
        for (let i = 0; i <= blobPoints; i++) {
            const angle = (i / blobPoints) * MathUtils.TAU;
            const baseR = 20 * s;
            let r = baseR;

            // 上下で半径を変えてスライムっぽく
            if (angle > Math.PI) {
                r *= 1.1 * squish; // 下部は広く
            } else {
                r *= antiSquish * 0.85; // 上部は狭く
            }

            const noise = perlin.noise2D(Math.cos(angle) * 2 + this.time, Math.sin(angle) * 2) * 3 * s;
            r += noise;

            const px = x + Math.cos(angle) * r;
            const py = y + Math.sin(angle) * r * 0.8;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // 光沢
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.ellipse(x - 6 * s, y - 8 * s, 8 * s, 6 * s, -0.3, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(x - 5 * s, y - 10 * s, 3 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x - 7 * s, y - 5 * s, 5 * s, 6 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + 5 * s, y - 5 * s, 5 * s, 6 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        ctx.fillStyle = '#111';
        const lookX = Math.sin(this.time) * 1.5 * s;
        ctx.beginPath();
        ctx.arc(x - 7 * s + lookX, y - 4 * s, 3 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 5 * s + lookX, y - 4 * s, 3 * s, 0, MathUtils.TAU);
        ctx.fill();

        // ハイライト
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - 6 * s, y - 6 * s, 1.2 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 6 * s, y - 6 * s, 1.2 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 口
        ctx.strokeStyle = '#114';
        ctx.lineWidth = 1.5 * s;
        ctx.beginPath();
        ctx.arc(x - 1 * s, y + 3 * s, 4 * s, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }

    _drawBossEnemy(ctx, x, y, scale, state) {
        const s = scale * 1.8;
        const breathe = Math.sin(this.time * 1.5) * 2 * s;
        const bounce = Math.sin((state.walkPhase || 0) * MathUtils.TAU) * 4 * s;

        // 巨大な影
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(x, y + 40 * s, 40 * s, 8 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 後ろ足
        ctx.fillStyle = ColorPalette.enemyDark.brighten(0.05).toCSS();
        this._drawBossLeg(ctx, x + 18 * s, y + 20 * s + bounce, s, 0.1);
        this._drawBossLeg(ctx, x - 10 * s, y + 20 * s + bounce, s, -0.1);

        // 体
        const bodyGrad = ctx.createRadialGradient(x - 8 * s, y - 10 * s + bounce, 10 * s, x, y + bounce, 40 * s);
        bodyGrad.addColorStop(0, ColorPalette.enemyDark.brighten(0.15).toCSS());
        bodyGrad.addColorStop(1, ColorPalette.enemyDark.darken(0.1).toCSS());
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(x, y + bounce - breathe, 35 * s, 28 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 腹
        ctx.fillStyle = ColorPalette.enemyDark.brighten(0.25).toCSS();
        ctx.globalAlpha *= 0.4;
        ctx.beginPath();
        ctx.ellipse(x, y + 8 * s + bounce - breathe, 22 * s, 18 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.globalAlpha /= 0.4;

        // 傷跡
        ctx.strokeStyle = ColorPalette.enemyDark.brighten(0.3).toCSS();
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        ctx.moveTo(x + 10 * s, y - 5 * s + bounce);
        ctx.lineTo(x + 18 * s, y + 10 * s + bounce);
        ctx.moveTo(x + 12 * s, y - 3 * s + bounce);
        ctx.lineTo(x + 20 * s, y + 8 * s + bounce);
        ctx.stroke();

        // 前足
        ctx.fillStyle = ColorPalette.enemyDark.toCSS();
        this._drawBossLeg(ctx, x - 22 * s, y + 18 * s + bounce, s, 0.05);
        this._drawBossLeg(ctx, x + 8 * s, y + 18 * s + bounce, s, -0.05);

        // 頭
        const headY = y - 32 * s + bounce - breathe;
        const headX = x - 5 * s;
        ctx.fillStyle = ColorPalette.enemyDark.brighten(0.05).toCSS();
        ctx.beginPath();
        ctx.ellipse(headX, headY, 24 * s, 20 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 耳
        ctx.beginPath();
        ctx.arc(headX - 18 * s, headY - 14 * s, 8 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(headX + 18 * s, headY - 14 * s, 8 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 目（赤く光る）
        const eyeGlow = 0.5 + Math.sin(this.time * 3) * 0.3;
        ctx.fillStyle = `rgba(255, ${Math.round(50 * eyeGlow)}, 0, ${0.8 + eyeGlow * 0.2})`;
        ctx.beginPath();
        ctx.ellipse(headX - 10 * s, headY - 2 * s, 6 * s, 5 * s, 0, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(headX + 10 * s, headY - 2 * s, 6 * s, 5 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        // 目のハイライト
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(headX - 8 * s, headY - 4 * s, 2 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(headX + 12 * s, headY - 4 * s, 2 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 口
        ctx.fillStyle = '#200';
        ctx.beginPath();
        ctx.ellipse(headX, headY + 10 * s, 12 * s, 6 * s, 0, 0, Math.PI);
        ctx.fill();

        // 牙
        ctx.fillStyle = '#eee';
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(headX + i * 5 * s - 2 * s, headY + 10 * s);
            ctx.lineTo(headX + i * 5 * s, headY + 16 * s);
            ctx.lineTo(headX + i * 5 * s + 2 * s, headY + 10 * s);
            ctx.fill();
        }

        // 怒りマーク
        if ((state.hpRatio || 1) < 0.5) {
            this._drawAngerMark(ctx, headX + 20 * s, headY - 20 * s, 10 * s);
        }
    }

    _drawBossLeg(ctx, x, y, scale, angle) {
        const s = scale;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        DrawUtils.capsule(ctx, 0, 0, 0, 22 * s, 7 * s);
        ctx.fill();

        // 爪
        ctx.fillStyle = '#333';
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 4 * s, 22 * s);
            ctx.lineTo(i * 3 * s - 2 * s, 28 * s);
            ctx.lineTo(i * 3 * s + 2 * s, 28 * s);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    _drawRobotEnemy(ctx, x, y, scale, state) {
        const s = scale;
        const hover = Math.sin(this.time * 2) * 3 * s;
        const glowPhase = (Math.sin(this.time * 4) + 1) / 2;

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x, y + 30 * s, 18 * s, 4 * s, 0, 0, MathUtils.TAU);
        ctx.fill();

        const ry = y + hover;

        // 脚部
        ctx.fillStyle = '#555';
        ctx.fillRect(x - 10 * s, ry + 10 * s, 6 * s, 18 * s);
        ctx.fillRect(x + 4 * s, ry + 10 * s, 6 * s, 18 * s);
        ctx.fillStyle = '#777';
        ctx.fillRect(x - 12 * s, ry + 26 * s, 10 * s, 4 * s);
        ctx.fillRect(x + 2 * s, ry + 26 * s, 10 * s, 4 * s);

        // 胴体
        const bodyGrad = ctx.createLinearGradient(x - 20 * s, ry - 15 * s, x + 20 * s, ry + 15 * s);
        bodyGrad.addColorStop(0, '#888');
        bodyGrad.addColorStop(0.5, '#aaa');
        bodyGrad.addColorStop(1, '#666');
        ctx.fillStyle = bodyGrad;
        DrawUtils.roundRect(ctx, x - 18 * s, ry - 15 * s, 36 * s, 28 * s, 5 * s);
        ctx.fill();

        // 胸のライト
        ctx.fillStyle = `rgba(0, 200, 255, ${0.5 + glowPhase * 0.5})`;
        ctx.beginPath();
        ctx.arc(x, ry, 5 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.fillStyle = `rgba(0, 200, 255, ${0.2 + glowPhase * 0.2})`;
        ctx.beginPath();
        ctx.arc(x, ry, 8 * s, 0, MathUtils.TAU);
        ctx.fill();

        // 腕
        ctx.fillStyle = '#777';
        const armAngle = Math.sin(this.time * 2) * 0.2;
        ctx.save();
        ctx.translate(x - 20 * s, ry - 8 * s);
        ctx.rotate(-0.3 + armAngle);
        ctx.fillRect(-3 * s, 0, 6 * s, 20 * s);
        ctx.fillStyle = '#999';
        ctx.beginPath();
        ctx.arc(0, 22 * s, 5 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#777';
        ctx.save();
        ctx.translate(x + 20 * s, ry - 8 * s);
        ctx.rotate(0.3 - armAngle);
        ctx.fillRect(-3 * s, 0, 6 * s, 20 * s);
        ctx.fillStyle = '#999';
        ctx.beginPath();
        ctx.arc(0, 22 * s, 5 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.restore();

        // 頭
        const headY2 = ry - 25 * s;
        ctx.fillStyle = '#999';
        DrawUtils.roundRect(ctx, x - 14 * s, headY2 - 12 * s, 28 * s, 22 * s, 4 * s);
        ctx.fill();

        // バイザー（目）
        ctx.fillStyle = '#222';
        DrawUtils.roundRect(ctx, x - 11 * s, headY2 - 5 * s, 22 * s, 10 * s, 3 * s);
        ctx.fill();

        // 目のグロウ
        ctx.fillStyle = `rgba(255, 50, 50, ${0.7 + glowPhase * 0.3})`;
        ctx.beginPath();
        ctx.arc(x - 5 * s, headY2, 3 * s, 0, MathUtils.TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 5 * s, headY2, 3 * s, 0, MathUtils.TAU);
        ctx.fill();

        // アンテナ
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        ctx.moveTo(x, headY2 - 12 * s);
        ctx.lineTo(x, headY2 - 22 * s);
        ctx.stroke();
        ctx.fillStyle = `rgba(255, 100, 100, ${0.5 + glowPhase * 0.5})`;
        ctx.beginPath();
        ctx.arc(x, headY2 - 22 * s, 3 * s, 0, MathUtils.TAU);
        ctx.fill();
    }

    _drawAngerMark(ctx, x, y, size) {
        ctx.fillStyle = '#f33';
        ctx.beginPath();
        const arm = size * 0.15;
        // 十字
        ctx.moveTo(x - arm, y - size);
        ctx.lineTo(x + arm, y - size);
        ctx.lineTo(x + arm, y - arm);
        ctx.lineTo(x + size, y - arm);
        ctx.lineTo(x + size, y + arm);
        ctx.lineTo(x + arm, y + arm);
        ctx.lineTo(x + arm, y + size);
        ctx.lineTo(x - arm, y + size);
        ctx.lineTo(x - arm, y + arm);
        ctx.lineTo(x - size, y + arm);
        ctx.lineTo(x - size, y - arm);
        ctx.lineTo(x - arm, y - arm);
        ctx.closePath();
        ctx.fill();
    }
}

// ──────────────────────────────────────────
// セクション18: 背景・パララックスレンダラー
// ──────────────────────────────────────────

class ParallaxBackground {
    constructor(width, height) {
        this.width = width;
        this.height = height;
        this.layers = [];
        this.groundY = height * CONFIG.GROUND_Y_RATIO;
        this.time = 0;
        this.cloudPositions = [];
        this.grassPatches = [];
        this.treesData = [];
        this.mountainPoints = [];
        this._generateStaticElements();
    }

    _generateStaticElements() {
        // 雲を生成
        for (let i = 0; i < 8; i++) {
            this.cloudPositions.push({
                x: MathUtils.random(-200, this.width * 3),
                y: MathUtils.random(30, 200),
                scale: MathUtils.random(0.5, 1.5),
                speed: MathUtils.random(8, 25),
                opacity: MathUtils.random(0.4, 0.8),
            });
        }

        // 草むらを生成
        for (let i = 0; i < 60; i++) {
            this.grassPatches.push({
                x: MathUtils.random(-100, this.width * 3),
                height: MathUtils.random(8, 25),
                width: MathUtils.random(3, 8),
                color: Color.fromHSL(
                    MathUtils.random(0.25, 0.35),
                    MathUtils.random(0.4, 0.7),
                    MathUtils.random(0.3, 0.5)
                ),
                phase: MathUtils.random(0, MathUtils.TAU),
            });
        }

        // 木を生成
        for (let i = 0; i < 12; i++) {
            this.treesData.push({
                x: MathUtils.random(-100, this.width * 3),
                height: MathUtils.random(80, 180),
                trunkWidth: MathUtils.random(8, 18),
                canopyRadius: MathUtils.random(30, 60),
                canopyColor: Color.fromHSL(
                    MathUtils.random(0.22, 0.38),
                    MathUtils.random(0.35, 0.65),
                    MathUtils.random(0.25, 0.45)
                ),
                trunkColor: Color.fromHSL(0.07, 0.45, MathUtils.random(0.2, 0.35)),
                layer: MathUtils.randomInt(0, 2),
                swayPhase: MathUtils.random(0, MathUtils.TAU),
            });
        }

        // 山脈ポイント
        for (let i = 0; i < 30; i++) {
            this.mountainPoints.push({
                x: (i / 29) * this.width * 3 - 200,
                height: perlin.fbm(i * 0.3, 0, 4) * 150 + 100,
            });
        }
    }

    update(dt) {
        this.time += dt;
        for (const cloud of this.cloudPositions) {
            cloud.x -= cloud.speed * dt;
            if (cloud.x < -200) {
                cloud.x = this.width * 3 + 100;
                cloud.y = MathUtils.random(30, 200);
            }
        }
    }

    render(ctx, camera) {
        this._renderSky(ctx, camera);
        this._renderMountains(ctx, camera);
        this._renderClouds(ctx, camera);
        this._renderFarTrees(ctx, camera);
        this._renderGround(ctx, camera);
        this._renderGrass(ctx, camera);
        this._renderNearTrees(ctx, camera);
    }

    _renderSky(ctx, camera) {
        camera.resetTransform(ctx);
        const gradient = ctx.createLinearGradient(0, 0, 0, this.groundY);
        gradient.addColorStop(0, ColorPalette.skyTop.toCSS());
        gradient.addColorStop(0.6, ColorPalette.skyBottom.toCSS());
        gradient.addColorStop(1, new Color(0.85, 0.9, 0.95, 1).toCSS());
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, this.width, this.groundY + 50);

        // 太陽
        const sunX = this.width * 0.8;
        const sunY = 100;
        const sunGrad = ctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 120);
        sunGrad.addColorStop(0, 'rgba(255,255,200,0.9)');
        sunGrad.addColorStop(0.3, 'rgba(255,220,100,0.3)');
        sunGrad.addColorStop(1, 'rgba(255,200,50,0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(sunX - 120, sunY - 120, 240, 240);

        ctx.fillStyle = 'rgba(255,255,220,0.95)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 25, 0, MathUtils.TAU);
        ctx.fill();
    }

    _renderMountains(ctx, camera) {
        camera.resetTransform(ctx);
        const parallax = 0.15;
        const offsetX = -camera.position.x * parallax;

        // 遠景の山（暗い）
        ctx.fillStyle = 'rgba(100, 120, 160, 0.4)';
        ctx.beginPath();
        ctx.moveTo(0, this.groundY);
        for (const mp of this.mountainPoints) {
            ctx.lineTo(mp.x * 0.5 + offsetX * 0.5, this.groundY - mp.height * 0.6);
        }
        ctx.lineTo(this.width, this.groundY);
        ctx.closePath();
        ctx.fill();

        // 近景の山（明るい）
        ctx.fillStyle = 'rgba(120, 150, 130, 0.35)';
        ctx.beginPath();
        ctx.moveTo(0, this.groundY);
        for (const mp of this.mountainPoints) {
            ctx.lineTo(mp.x * 0.7 + offsetX, this.groundY - mp.height * 0.4);
        }
        ctx.lineTo(this.width, this.groundY);
        ctx.closePath();
        ctx.fill();
    }

    _renderClouds(ctx, camera) {
        camera.resetTransform(ctx);
        const parallax = 0.1;
        const offsetX = -camera.position.x * parallax;

        for (const cloud of this.cloudPositions) {
            const cx = cloud.x + offsetX;
            const cy = cloud.y;
            ctx.globalAlpha = cloud.opacity;
            ctx.fillStyle = '#fff';

            const s = cloud.scale;
            ctx.beginPath();
            ctx.arc(cx, cy, 20 * s, 0, MathUtils.TAU);
            ctx.arc(cx + 25 * s, cy - 5, 25 * s, 0, MathUtils.TAU);
            ctx.arc(cx + 50 * s, cy, 18 * s, 0, MathUtils.TAU);
            ctx.arc(cx + 15 * s, cy + 5, 15 * s, 0, MathUtils.TAU);
            ctx.arc(cx + 35 * s, cy + 3, 16 * s, 0, MathUtils.TAU);
            ctx.fill();

            ctx.globalAlpha = 1;
        }
    }

    _renderFarTrees(ctx, camera) {
        const parallax = 0.3;
        camera.resetTransform(ctx);
        const offsetX = -camera.position.x * parallax;

        for (const tree of this.treesData) {
            if (tree.layer > 0) continue;
            this._renderTree(ctx, tree.x + offsetX, this.groundY, tree, 0.6);
        }
    }

    _renderNearTrees(ctx, camera) {
        camera.applyTransform(ctx);

        for (const tree of this.treesData) {
            if (tree.layer === 0) continue;
            this._renderTree(ctx, tree.x, this.groundY, tree, 1);
        }
    }

    _renderTree(ctx, x, groundY, tree, opacity) {
        const sway = Math.sin(this.time * 1.2 + tree.swayPhase) * 3;
        ctx.globalAlpha = opacity;

        // 幹
        ctx.fillStyle = tree.trunkColor.toCSS();
        ctx.beginPath();
        ctx.moveTo(x - tree.trunkWidth / 2, groundY);
        ctx.lineTo(x - tree.trunkWidth / 3 + sway * 0.3, groundY - tree.height);
        ctx.lineTo(x + tree.trunkWidth / 3 + sway * 0.3, groundY - tree.height);
        ctx.lineTo(x + tree.trunkWidth / 2, groundY);
        ctx.closePath();
        ctx.fill();

        // 樹冠
        const canopyY = groundY - tree.height - tree.canopyRadius * 0.3;
        const canopyX = x + sway;
        const numBumps = 5;
        for (let i = 0; i < numBumps; i++) {
            const angle = (i / numBumps) * MathUtils.TAU;
            const bumpX = canopyX + Math.cos(angle) * tree.canopyRadius * 0.4;
            const bumpY = canopyY + Math.sin(angle) * tree.canopyRadius * 0.3;
            const bumpR = tree.canopyRadius * MathUtils.random(0.5, 0.8);

            const lightFactor = Math.sin(angle + 1) * 0.1;
            ctx.fillStyle = tree.canopyColor.brighten(lightFactor).toCSS();
            ctx.beginPath();
            ctx.arc(bumpX, bumpY, bumpR, 0, MathUtils.TAU);
            ctx.fill();
        }

        // メインの樹冠
        ctx.fillStyle = tree.canopyColor.toCSS();
        ctx.beginPath();
        ctx.arc(canopyX, canopyY, tree.canopyRadius * 0.7, 0, MathUtils.TAU);
        ctx.fill();

        // ハイライト
        ctx.fillStyle = tree.canopyColor.brighten(0.15).toCSS();
        ctx.globalAlpha *= 0.6;
        ctx.beginPath();
        ctx.arc(canopyX - tree.canopyRadius * 0.2, canopyY - tree.canopyRadius * 0.2, tree.canopyRadius * 0.35, 0, MathUtils.TAU);
        ctx.fill();
        ctx.globalAlpha /= 0.6;

        ctx.globalAlpha = 1;
    }

    _renderGround(ctx, camera) {
        camera.applyTransform(ctx);

        // メイン地面
        const groundGrad = ctx.createLinearGradient(0, this.groundY - 10, 0, this.groundY + 200);
        groundGrad.addColorStop(0, ColorPalette.grassGreen.brighten(0.1).toCSS());
        groundGrad.addColorStop(0.05, ColorPalette.grassGreen.toCSS());
        groundGrad.addColorStop(0.3, ColorPalette.grassGreen.darken(0.1).toCSS());
        groundGrad.addColorStop(0.6, ColorPalette.dirtBrown.toCSS());
        groundGrad.addColorStop(1, ColorPalette.dirtBrown.darken(0.2).toCSS());

        ctx.fillStyle = groundGrad;
        ctx.fillRect(-500, this.groundY - 5, this.width * 3 + 1000, this.height - this.groundY + 200);

        // 地面のテクスチャー
        ctx.fillStyle = 'rgba(0,0,0,0.03)';
        for (let i = 0; i < 40; i++) {
            const dx = (i * 137 + 50) % (this.width * 3) - 200;
            const dy = this.groundY + 20 + (i * 73) % 150;
            const dw = 30 + (i * 41) % 60;
            ctx.beginPath();
            ctx.ellipse(dx, dy, dw, 3, 0, 0, MathUtils.TAU);
            ctx.fill();
        }

        // 地面のエッジライン
        ctx.strokeStyle = ColorPalette.grassGreen.darken(0.15).toCSS();
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-500, this.groundY);
        for (let xp = -500; xp < this.width * 3 + 500; xp += 20) {
            const wave = Math.sin(xp * 0.05 + this.time * 0.5) * 2;
            ctx.lineTo(xp, this.groundY + wave);
        }
        ctx.stroke();
    }

    _renderGrass(ctx, camera) {
        camera.applyTransform(ctx);

        for (const grass of this.grassPatches) {
            const sway = Math.sin(this.time * 2 + grass.phase) * 3;
            ctx.strokeStyle = grass.color.toCSS();
            ctx.lineWidth = grass.width * 0.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(grass.x, this.groundY);
            ctx.quadraticCurveTo(
                grass.x + sway,
                this.groundY - grass.height * 0.6,
                grass.x + sway * 1.5,
                this.groundY - grass.height
            );
            ctx.stroke();
        }
    }

    renderForeground(ctx, camera) {
        camera.resetTransform(ctx);

        // 軽いフォグ効果
        const fogGrad = ctx.createLinearGradient(0, this.groundY + 50, 0, this.height);
        fogGrad.addColorStop(0, 'rgba(200,210,220,0)');
        fogGrad.addColorStop(1, 'rgba(200,210,220,0.15)');
        ctx.fillStyle = fogGrad;
        ctx.fillRect(0, this.groundY + 50, this.width, this.height - this.groundY);
    }
}

// ──────────────────────────────────────────
// セクション19: スクリーンエフェクトシステム
// ──────────────────────────────────────────

class ScreenEffects {
    constructor(width, height) {
        this.width = width;
        this.height = height;
        this.effects = [];
        this.time = 0;
        this.slowMotionFactor = 1;
        this.slowMotionTarget = 1;
        this.damageVignette = 0;
        this.speedLines = [];
        this.impactFrames = [];
    }

    update(dt) {
        this.time += dt;
        this.slowMotionFactor = MathUtils.lerp(this.slowMotionFactor, this.slowMotionTarget, 0.1);

        for (let i = this.effects.length - 1; i >= 0; i--) {
            this.effects[i].time += dt;
            if (this.effects[i].time >= this.effects[i].duration) {
                this.effects.splice(i, 1);
            }
        }

        if (this.damageVignette > 0) {
            this.damageVignette *= 0.95;
        }

        for (let i = this.speedLines.length - 1; i >= 0; i--) {
            this.speedLines[i].life -= dt;
            if (this.speedLines[i].life <= 0) {
                this.speedLines.splice(i, 1);
            }
        }
    }

    addSpeedLines(count = 8, duration = 0.3) {
        for (let i = 0; i < count; i++) {
            this.speedLines.push({
                x: MathUtils.random(0, this.width),
                y: MathUtils.random(0, this.height),
                angle: MathUtils.random(-0.3, 0.3),
                length: MathUtils.random(100, 300),
                width: MathUtils.random(1, 3),
                life: duration,
                maxLife: duration,
            });
        }
    }

    addImpactFrame(x, y, radius = 200, duration = 0.08) {
        this.impactFrames.push({
            x, y, radius, duration, time: 0
        });
    }

    triggerSlowMotion(factor = 0.3, duration = 0.5) {
        this.slowMotionTarget = factor;
        setTimeout(() => { this.slowMotionTarget = 1; }, duration * 1000);
    }

    triggerDamageVignette(intensity = 0.5) {
        this.damageVignette = Math.max(this.damageVignette, intensity);
    }

    render(ctx) {
        // スピードライン
        for (const line of this.speedLines) {
            const alpha = (line.life / line.maxLife) * 0.5;
            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
            ctx.lineWidth = line.width;
            ctx.beginPath();
            const cos = Math.cos(line.angle);
            const sin = Math.sin(line.angle);
            ctx.moveTo(line.x - cos * line.length / 2, line.y - sin * line.length / 2);
            ctx.lineTo(line.x + cos * line.length / 2, line.y + sin * line.length / 2);
            ctx.stroke();
        }

        // インパクトフレーム
        for (let i = this.impactFrames.length - 1; i >= 0; i--) {
            const imp = this.impactFrames[i];
            imp.time += 0.016;
            const t = imp.time / imp.duration;
            if (t >= 1) {
                this.impactFrames.splice(i, 1);
                continue;
            }
            const alpha = (1 - t) * 0.8;
            const r = imp.radius * (1 + t * 0.5);
            const grad = ctx.createRadialGradient(imp.x, imp.y, 0, imp.x, imp.y, r);
            grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
            grad.addColorStop(0.5, `rgba(255,255,200,${alpha * 0.5})`);
            grad.addColorStop(1, 'rgba(255,255,200,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(imp.x - r, imp.y - r, r * 2, r * 2);
        }

        // ダメージビネット
        if (this.damageVignette > 0.01) {
            const grad = ctx.createRadialGradient(
                this.width / 2, this.height / 2, this.width * 0.2,
                this.width / 2, this.height / 2, this.width * 0.7
            );
            grad.addColorStop(0, 'rgba(255,0,0,0)');
            grad.addColorStop(1, `rgba(180,0,0,${this.damageVignette})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, this.width, this.height);
        }
    }

    getTimeScale() {
        return this.slowMotionFactor;
    }
}

// ──────────────────────────────────────────
// セクション20: HPバー・ダメージ数字表示
// ──────────────────────────────────────────

class DamageNumber {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = 0;
        this.y = 0;
        this.value = 0;
        this.color = '#fff';
        this.fontSize = 20;
        this.life = 0;
        this.maxLife = 0.8;
        this.velocityX = 0;
        this.velocityY = 0;
        this.alive = false;
        this.isCritical = false;
        this.isHeal = false;
        this.scale = this.scale = 1;
        this.rotation = 0;
    }

    init(x, y, value, options = {}) {
        this.x = x;
        this.y = y;
        this.value = value;
        this.color = options.color || (value > 0 ? '#ff4444' : '#44ff44');
        this.fontSize = options.fontSize || 20;
        this.life = options.life || 0.8;
        this.maxLife = this.life;
        this.velocityX = MathUtils.random(-30, 30);
        this.velocityY = MathUtils.random(-180, -120);
        this.alive = true;
        this.isCritical = options.isCritical || false;
        this.isHeal = options.isHeal || false;
        this.scale = this.isCritical ? 1.5 : 1;
        this.rotation = MathUtils.random(-0.2, 0.2);

        if (this.isCritical) {
            this.fontSize *= 1.4;
            this.color = '#ffdd00';
        }
        if (this.isHeal) {
            this.color = '#44ff88';
        }
    }

    update(dt) {
        if (!this.alive) return;
        this.life -= dt;
        if (this.life <= 0) {
            this.alive = false;
            return;
        }
        this.x += this.velocityX * dt;
        this.y += this.velocityY * dt;
        this.velocityY += 300 * dt;

        const lifeRatio = this.life / this.maxLife;
        if (lifeRatio < 0.3) {
            this.scale = lifeRatio / 0.3;
        } else if (lifeRatio > 0.85) {
            const t = (lifeRatio - 0.85) / 0.15;
            this.scale = (this.isCritical ? 1.5 : 1) * EASING.easeOutBack(1 - t);
        }
    }

    render(ctx) {
        if (!this.alive) return;
        const lifeRatio = this.life / this.maxLife;
        const alpha = lifeRatio < 0.3 ? lifeRatio / 0.3 : 1;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * (1 - lifeRatio));
        ctx.scale(this.scale, this.scale);
        ctx.globalAlpha = alpha;

        const text = Math.abs(this.value).toString();
        const font = `bold ${this.fontSize}px 'Segoe UI', sans-serif`;

        if (this.isCritical) {
            ctx.font = font;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // クリティカルのグロー
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffdd00';
            ctx.fillText(text, 0, 0);
            ctx.shadowBlur = 0;

            DrawUtils.drawTextWithOutline(ctx, text, 0, 0, '#ffdd00', '#883300', 4, font);

            // 「CRITICAL!」テキスト
            const critFont = `bold ${this.fontSize * 0.5}px sans-serif`;
            DrawUtils.drawTextWithOutline(ctx, 'CRITICAL!', 0, -this.fontSize * 0.8, '#ff6600', '#441100', 2, critFont);
        } else {
            DrawUtils.drawTextWithOutline(ctx, text, 0, 0, this.color, 'rgba(0,0,0,0.7)', 3, font);
        }

        ctx.restore();
    }
}

class DamageNumberManager {
    constructor() {
        this.pool = new ObjectPool(() => new DamageNumber(), 50);
    }

    spawn(x, y, value, options = {}) {
        const dn = this.pool.acquire();
        dn.init(x, y, value, options);
        return dn;
    }

    update(dt) {
        const active = this.pool.getActive();
        for (let i = active.length - 1; i >= 0; i--) {
            active[i].update(dt);
            if (!active[i].alive) {
                this.pool.release(active[i]);
            }
        }
    }

    render(ctx) {
        const active = this.pool.getActive();
        for (const dn of active) {
            dn.render(ctx);
        }
    }

    clear() {
        this.pool.releaseAll();
    }
}

class HPBar {
    constructor(maxHP, width = 60, height = 6) {
        this.maxHP = maxHP;
        this.currentHP = maxHP;
        this.displayHP = maxHP;
        this.width = width;
        this.height = height;
        this.shakeTimer = 0;
        this.shakeIntensity = 0;
        this.flashTimer = 0;
        this.visible = true;
        this.damageQueue = 0;
    }

    setHP(value) {
        const prev = this.currentHP;
        this.currentHP = MathUtils.clamp(value, 0, this.maxHP);
        if (this.currentHP < prev) {
            this.shakeTimer = 0.2;
            this.shakeIntensity = 3;
            this.flashTimer = 0.1;
        }
    }

    damage(amount) {
        this.setHP(this.currentHP - amount);
    }

    heal(amount) {
        this.setHP(this.currentHP + amount);
    }

    update(dt) {
        this.displayHP = MathUtils.lerp(this.displayHP, this.currentHP, 0.1);

        if (this.shakeTimer > 0) {
            this.shakeTimer -= dt;
            this.shakeIntensity *= 0.9;
        }
        if (this.flashTimer > 0) {
            this.flashTimer -= dt;
        }
    }

    render(ctx, x, y) {
        if (!this.visible) return;

        const shakeX = this.shakeTimer > 0 ? MathUtils.random(-this.shakeIntensity, this.shakeIntensity) : 0;
        const shakeY = this.shakeTimer > 0 ? MathUtils.random(-this.shakeIntensity, this.shakeIntensity) : 0;
        const px = x + shakeX;
        const py = y + shakeY;

        // 背景
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        DrawUtils.roundRect(ctx, px - 1, py - 1, this.width + 2, this.height + 2, 3);
        ctx.fill();

        // HP量計算
        const hpRatio = MathUtils.clamp(this.displayHP / this.maxHP, 0, 1);
        const fillWidth = this.width * hpRatio;

        // 色（HP量で変化）
        let barColor;
        if (hpRatio > 0.6) {
            barColor = ColorPalette.uiSuccess;
        } else if (hpRatio > 0.3) {
            barColor = ColorPalette.uiGold;
        } else {
            barColor = ColorPalette.uiDanger;
        }

        // フラッシュ
        if (this.flashTimer > 0) {
            barColor = barColor.brighten(0.4);
        }

        // HP バー本体
        if (fillWidth > 0) {
            const barGrad = ctx.createLinearGradient(px, py, px, py + this.height);
            barGrad.addColorStop(0, barColor.brighten(0.2).toCSS());
            barGrad.addColorStop(0.5, barColor.toCSS());
            barGrad.addColorStop(1, barColor.darken(0.15).toCSS());
            ctx.fillStyle = barGrad;
            DrawUtils.roundRect(ctx, px, py, fillWidth, this.height, 2);
            ctx.fill();

            // ハイライト
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            DrawUtils.roundRect(ctx, px, py, fillWidth, this.height * 0.4, 2);
            ctx.fill();
        }

        // 遅延ダメージバー
        const delayedRatio = MathUtils.clamp(this.displayHP / this.maxHP, 0, 1);
        const actualRatio = MathUtils.clamp(this.currentHP / this.maxHP, 0, 1);
        if (delayedRatio > actualRatio) {
            const delayStart = this.width * actualRatio;
            const delayWidth = this.width * (delayedRatio - actualRatio);
            ctx.fillStyle = 'rgba(255,100,100,0.6)';
            ctx.fillRect(px + delayStart, py, delayWidth, this.height);
        }
    }

    getRatio() { return this.currentHP / this.maxHP; }
    isDead() { return this.currentHP <= 0; }
}
