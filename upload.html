<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>
<style>
/* ============================================================
   RESET & BASE STYLES (Section 1/5)
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --yt-bg:#0f0f0f;
  --yt-header-bg:#0f0f0f;
  --yt-sidebar-bg:#0f0f0f;
  --yt-text:#f1f1f1;
  --yt-text-secondary:#aaa;
  --yt-hover:#272727;
  --yt-chip-bg:#333;
  --yt-chip-active-bg:#f1f1f1;
  --yt-chip-active-text:#0f0f0f;
  --yt-red:#ff0000;
  --yt-border:#333;
  --yt-card-bg:#0f0f0f;
  --yt-overlay-bg:rgba(0,0,0,0.6);
  --sidebar-width:72px;
  --header-height:56px;
  --chip-height:42px;
  font-family:"Roboto","Noto Sans JP","Yu Gothic",Arial,sans-serif;
  font-size:14px;
  color:var(--yt-text);
  background:var(--yt-bg);
}
html{scrollbar-width:thin;scrollbar-color:#555 var(--yt-bg)}
body{overflow-x:hidden;background:var(--yt-bg);min-height:100vh}
a{color:inherit;text-decoration:none}
button{border:none;background:none;color:inherit;cursor:pointer;font:inherit}
img,svg{display:block}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--yt-bg)}
::-webkit-scrollbar-thumb{background:#555;border-radius:4px}

/* ============================================================
   HEADER
   ============================================================ */
.yt-header{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:var(--header-height);
  background:var(--yt-header-bg);
  display:flex;align-items:center;
  padding:0 16px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.yt-header-left{display:flex;align-items:center;gap:16px;min-width:200px}
.yt-hamburger{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer}
.yt-hamburger:hover{background:var(--yt-hover)}
.yt-hamburger svg{fill:#fff;width:24px;height:24px}
.yt-logo{display:flex;align-items:center;gap:1px;cursor:pointer}
.yt-logo-icon{width:90px;height:20px}
.yt-logo-jp{font-size:10px;color:#aaa;position:relative;top:-8px;left:0px}
.yt-header-center{flex:1;display:flex;align-items:center;justify-content:center;max-width:640px;margin:0 auto}
.yt-search-box{display:flex;align-items:center;width:100%;max-width:572px}
.yt-search-input{
  flex:1;height:40px;
  background:#121212;border:1px solid #303030;
  border-radius:20px 0 0 20px;
  padding:0 16px;color:#fff;font-size:16px;
  outline:none;
}
.yt-search-input:focus{border-color:#1c62b9}
.yt-search-input::placeholder{color:#888}
.yt-search-btn{
  width:64px;height:40px;
  background:#222;border:1px solid #303030;border-left:none;
  border-radius:0 20px 20px 0;
  display:flex;align-items:center;justify-content:center;
}
.yt-search-btn:hover{background:#333}
.yt-search-btn svg{fill:#fff;width:24px;height:24px}
.yt-voice-btn{width:40px;height:40px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;margin-left:8px}
.yt-voice-btn:hover{background:#333}
.yt-voice-btn svg{fill:#fff;width:24px;height:24px}
.yt-header-right{display:flex;align-items:center;gap:8px;min-width:200px;justify-content:flex-end}
.yt-header-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.yt-header-btn:hover{background:var(--yt-hover)}
.yt-header-btn svg{fill:#fff;width:24px;height:24px}
.yt-create-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;font-size:14px;font-weight:500}
.yt-create-btn:hover{background:var(--yt-hover)}
.yt-create-btn svg{fill:#fff;width:24px;height:24px}
.yt-notif-btn{position:relative}
.yt-notif-badge{position:absolute;top:2px;right:2px;background:var(--yt-red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:500}
.yt-avatar-btn{width:32px;height:32px;border-radius:50%;overflow:hidden;cursor:pointer;background:#555;display:flex;align-items:center;justify-content:center}
.yt-avatar-btn svg{fill:#fff;width:20px;height:20px}

/* ============================================================
   SIDEBAR
   ============================================================ */
.yt-sidebar{
  position:fixed;left:0;top:var(--header-height);bottom:0;
  width:var(--sidebar-width);
  background:var(--yt-sidebar-bg);
  z-index:500;
  display:flex;flex-direction:column;align-items:center;
  padding-top:4px;
  overflow-y:auto;
  scrollbar-width:none;
}
.yt-sidebar::-webkit-scrollbar{display:none}
.yt-sidebar-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:64px;min-height:74px;
  border-radius:10px;cursor:pointer;
  padding:4px 0;
  gap:4px;
}
.yt-sidebar-item:hover{background:var(--yt-hover)}
.yt-sidebar-item.active{color:#fff}
.yt-sidebar-item svg{fill:#fff;width:24px;height:24px}
.yt-sidebar-label{font-size:10px;color:#f1f1f1;text-align:center;line-height:1.2}

/* ============================================================
   CHIP BAR (Category filters)
   ============================================================ */
.yt-chips-wrapper{
  position:fixed;top:var(--header-height);
  left:var(--sidebar-width);right:0;
  height:var(--chip-height);
  background:var(--yt-bg);
  z-index:400;
  display:flex;align-items:center;
  padding:0 24px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  overflow-x:hidden;
}
.yt-chips-scroll{
  display:flex;gap:12px;
  overflow-x:auto;scrollbar-width:none;
  -ms-overflow-style:none;
  padding:4px 0;
}
.yt-chips-scroll::-webkit-scrollbar{display:none}
.yt-chip{
  white-space:nowrap;
  padding:6px 12px;
  border-radius:8px;
  background:var(--yt-chip-bg);
  color:#fff;font-size:14px;font-weight:400;
  cursor:pointer;
  flex-shrink:0;
  transition:background 0.15s;
}
.yt-chip:hover{background:#555}
.yt-chip.active{background:var(--yt-chip-active-bg);color:var(--yt-chip-active-text);font-weight:500}

/* ============================================================
   MAIN CONTENT AREA
   ============================================================ */
.yt-main{
  margin-left:var(--sidebar-width);
  margin-top:calc(var(--header-height) + var(--chip-height));
  padding:16px 16px 40px 16px;
  min-height:calc(100vh - var(--header-height) - var(--chip-height));
}

/* ============================================================
   VIDEO GRID (Virtualized)
   ============================================================ */
.yt-grid-container{
  position:relative;
  width:100%;
}
.yt-video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:16px 16px;
}
.yt-video-card{
  cursor:pointer;
  border-radius:12px;
  overflow:hidden;
  transition:transform 0.15s;
}
.yt-video-card:hover{transform:scale(1.02)}
.yt-thumb-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#222;
  border-radius:12px;
  overflow:hidden;
}
.yt-thumb-wrap svg{width:100%;height:100%;display:block}
.yt-duration{
  position:absolute;bottom:6px;right:6px;
  background:rgba(0,0,0,0.8);
  color:#fff;font-size:12px;font-weight:500;
  padding:2px 6px;border-radius:4px;
  pointer-events:none;
}
.yt-progress-bar{
  position:absolute;bottom:0;left:0;
  height:3px;background:var(--yt-red);
  border-radius:0 0 0 0;
}
.yt-card-info{display:flex;gap:12px;padding:12px 4px 0 0}
.yt-card-avatar{
  width:36px;height:36px;border-radius:50%;
  flex-shrink:0;overflow:hidden;background:#444;
  display:flex;align-items:center;justify-content:center;
}
.yt-card-avatar svg{width:100%;height:100%}
.yt-card-meta{flex:1;min-width:0}
.yt-card-title{
  font-size:14px;font-weight:500;line-height:1.4;
  color:var(--yt-text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-overflow:ellipsis;
  margin-bottom:4px;
}
.yt-card-channel{font-size:12px;color:var(--yt-text-secondary);display:flex;align-items:center;gap:4px}
.yt-card-channel .verified{display:inline-flex;align-items:center}
.yt-card-channel .verified svg{width:14px;height:14px;fill:#aaa}
.yt-card-stats{font-size:12px;color:var(--yt-text-secondary)}
.yt-card-menu{
  position:absolute;top:8px;right:-4px;
  width:24px;height:24px;display:none;align-items:center;justify-content:center;
  border-radius:50%;
}
.yt-video-card:hover .yt-card-menu{display:flex}

/* ============================================================
   VIDEO PLAYER OVERLAY
   ============================================================ */
.yt-player-overlay{
  display:none;
  position:fixed;top:0;left:0;right:0;bottom:0;
  z-index:2000;background:var(--yt-bg);
  overflow-y:auto;
}
.yt-player-overlay.active{display:block}
.yt-player-top{
  width:100%;max-width:1280px;margin:0 auto;
  padding:0 24px;
}
.yt-player-back{
  display:flex;align-items:center;gap:8px;
  padding:12px 0;cursor:pointer;color:#fff;font-size:14px;
}
.yt-player-back:hover{color:#aaa}
.yt-player-back svg{fill:#fff;width:24px;height:24px}
.yt-player-video{
  width:100%;aspect-ratio:16/9;
  background:#000;border-radius:12px;
  overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.yt-player-video svg{width:60%;height:60%;opacity:0.3}
.yt-player-controls{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.8));
  padding:8px 12px;display:flex;align-items:center;gap:12px;
}
.yt-player-progress{flex:1;height:4px;background:#555;border-radius:2px;cursor:pointer;position:relative}
.yt-player-progress-fill{height:100%;background:var(--yt-red);border-radius:2px;width:35%}
.yt-player-time{font-size:12px;color:#ddd}
.yt-ctrl-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.yt-ctrl-btn:hover{background:rgba(255,255,255,0.1)}
.yt-ctrl-btn svg{fill:#fff;width:24px;height:24px}
.yt-player-content{
  width:100%;max-width:1280px;margin:0 auto;
  padding:16px 24px;display:flex;gap:24px;
}
.yt-player-primary{flex:1;min-width:0}
.yt-player-secondary{width:400px;flex-shrink:0}
.yt-video-title-big{font-size:20px;font-weight:600;line-height:1.4;margin-bottom:12px}
.yt-video-actions{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.yt-action-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:20px;
  background:rgba(255,255,255,0.1);
  font-size:14px;font-weight:500;
}
.yt-action-btn:hover{background:rgba(255,255,255,0.2)}
.yt-action-btn svg{fill:#fff;width:24px;height:24px}
.yt-action-btn.like-active{background:#3ea6ff;color:#000}
.yt-action-btn.like-active svg{fill:#000}
.yt-channel-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.yt-channel-avatar-lg{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#444}
.yt-channel-avatar-lg svg{width:100%;height:100%}
.yt-channel-info{flex:1}
.yt-channel-name-big{font-size:16px;font-weight:500;display:flex;align-items:center;gap:4px}
.yt-channel-subs{font-size:12px;color:var(--yt-text-secondary)}
.yt-subscribe-btn{
  padding:10px 20px;border-radius:20px;
  background:#fff;color:#000;
  font-size:14px;font-weight:600;
  cursor:pointer;
}
.yt-subscribe-btn:hover{background:#d9d9d9}
.yt-description-box{
  background:rgba(255,255,255,0.1);
  border-radius:12px;padding:12px 16px;
  margin-bottom:24px;font-size:14px;line-height:1.5;
  color:var(--yt-text-secondary);
  white-space:pre-wrap;
}
.yt-desc-stats{font-size:14px;font-weight:500;color:#fff;margin-bottom:8px}

/* ============================================================
   COMMENTS SECTION
   ============================================================ */
.yt-comments-section{margin-top:24px}
.yt-comments-header{font-size:16px;font-weight:600;margin-bottom:20px}
.yt-comment-input-row{display:flex;gap:12px;margin-bottom:24px;align-items:flex-start}
.yt-comment-input-row .yt-card-avatar{width:40px;height:40px}
.yt-comment-input{
  flex:1;background:transparent;border:none;
  border-bottom:1px solid #555;
  padding:8px 0;color:#fff;font-size:14px;outline:none;
}
.yt-comment-input:focus{border-bottom-color:#fff}
.yt-comment-input::placeholder{color:#888}
.yt-comment{display:flex;gap:12px;margin-bottom:20px;align-items:flex-start}
.yt-comment-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#444;flex-shrink:0}
.yt-comment-avatar svg{width:100%;height:100%}
.yt-comment-body{flex:1}
.yt-comment-author{font-size:13px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.yt-comment-author span{color:var(--yt-text-secondary);font-size:12px;font-weight:400}
.yt-comment-text{font-size:14px;line-height:1.5;color:#ddd;margin-bottom:8px}
.yt-comment-actions{display:flex;align-items:center;gap:8px}
.yt-comment-actions button{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--yt-text-secondary);padding:4px 8px;border-radius:16px}
.yt-comment-actions button:hover{background:rgba(255,255,255,0.1)}
.yt-comment-actions svg{fill:#aaa;width:20px;height:20px}

/* ============================================================
   SIDEBAR RECOMMENDATIONS (in player)
   ============================================================ */
.yt-rec-card{display:flex;gap:8px;margin-bottom:8px;cursor:pointer;border-radius:8px;padding:4px}
.yt-rec-card:hover{background:var(--yt-hover)}
.yt-rec-thumb{width:168px;min-width:168px;aspect-ratio:16/9;background:#222;border-radius:8px;overflow:hidden;position:relative}
.yt-rec-thumb svg{width:100%;height:100%}
.yt-rec-dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.8);color:#fff;font-size:11px;padding:1px 4px;border-radius:3px}
.yt-rec-info{flex:1;min-width:0;padding-top:4px}
.yt-rec-title{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.yt-rec-channel{font-size:12px;color:var(--yt-text-secondary)}
.yt-rec-stats{font-size:12px;color:var(--yt-text-secondary)}

/* ============================================================
   LOADING SKELETON
   ============================================================ */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton{
  background:linear-gradient(90deg,#222 25%,#333 50%,#222 75%);
  background-size:800px 100%;
  animation:shimmer 1.5s infinite linear;
  border-radius:8px;
}
.skel-thumb{width:100%;aspect-ratio:16/9;border-radius:12px}
.skel-text{height:14px;margin:6px 0;width:80%}
.skel-text-sm{height:12px;margin:4px 0;width:50%}
.skel-avatar{width:36px;height:36px;border-radius:50%}

/* ============================================================
   VIRTUAL SCROLL SENTINEL
   ============================================================ */
.yt-sentinel{height:1px;width:100%}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:1024px){
  .yt-player-secondary{width:340px}
  .yt-video-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
}
@media(max-width:800px){
  .yt-sidebar{display:none}
  .yt-main{margin-left:0}
  .yt-chips-wrapper{left:0}
  .yt-player-content{flex-direction:column}
  .yt-player-secondary{width:100%}
  .yt-rec-thumb{width:120px;min-width:120px}
}
@media(max-width:550px){
  .yt-video-grid{grid-template-columns:1fr}
  .yt-header-center{display:none}
}
</style>

<!-- hw-mobile-shim: smartphone support injected by hub build -->
<style id="hw-mobile-shim-style">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas,img,svg,video{max-width:100%}
input,select,textarea{font-size:16px}
@media (pointer:coarse){button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}}
</style>
<script id="hw-mobile-shim-script">
(function(){
  function setVh(){document.documentElement.style.setProperty("--hw-vh",(window.innerHeight*0.01)+"px");}
  setVh();window.addEventListener("resize",setVh);window.addEventListener("orientationchange",setVh);
  document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
})();
</script>
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="yt-header">
  <div class="yt-header-left">
    <button class="yt-hamburger" aria-label="メニュー">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <a class="yt-logo" href="#" onclick="closePlayer();return false;">
      <svg class="yt-logo-icon" viewBox="0 0 90 20" fill="none">
        <rect x="0" y="2" width="28" height="16" rx="4" fill="#FF0000"/>
        <polygon points="11,6 11,14 19,10" fill="#FFF"/>
        <text x="32" y="15.5" font-size="15" font-weight="700" fill="#FFF" font-family="Roboto,Arial">YouTube</text>
      </svg>
      <span class="yt-logo-jp">JP</span>
    </a>
  </div>
  <div class="yt-header-center">
    <div class="yt-search-box">
      <input class="yt-search-input" type="text" placeholder="検索" id="searchInput">
      <button class="yt-search-btn" aria-label="検索" onclick="handleSearch()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
    <button class="yt-voice-btn" aria-label="音声検索">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c0 3.31-2.69 6-6 6s-6-2.69-6-6H4c0 3.76 2.86 6.87 6.56 7.25V21h2.88v-2.75C17.14 17.87 20 14.76 20 11h-2.09z"/></svg>
    </button>
  </div>
  <div class="yt-header-right">
    <button class="yt-create-btn">
      <svg viewBox="0 0 24 24"><path d="M14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2zm3-6H3v12h14v-6.39l4 1.83V8.56l-4 1.83V7m1-1v2.83L22 7v10l-4-1.83V18H2V6h16z"/></svg>
      <span>作成</span>
    </button>
    <button class="yt-header-btn yt-notif-btn" aria-label="通知">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 002 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
      <span class="yt-notif-badge">3</span>
    </button>
    <div class="yt-avatar-btn" aria-label="アカウント">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2a7.2 7.2 0 01-6-3.22c.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08a7.2 7.2 0 01-6 3.22z"/></svg>
    </div>
  </div>
</header>

<!-- ============================================================
     SIDEBAR
     ============================================================ -->
<nav class="yt-sidebar">
  <div class="yt-sidebar-item active">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span class="yt-sidebar-label">ホーム</span>

<script>
// ============================================================
// SECTION 1: ULTRA-LIGHT VIRTUAL RENDERING ENGINE (VRE)
// ============================================================
// This custom engine ensures that only visible DOM nodes exist.
// It uses IntersectionObserver for lazy-load, recycles DOM nodes
// via an object pool, and batches all DOM writes into a single
// requestAnimationFrame to avoid layout thrashing.

const VRE = {
  pool: [],
  activeNodes: new Map(),
  batchQueue: [],
  frameRequested: false,
  observer: null,
  PAGE_SIZE: 12,
  currentPage: 0,
  totalItems: 0,
  renderFn: null,
  containerEl: null,
  sentinelEl: null,

  init(container, sentinel, total, renderFn) {
    this.containerEl = container;
    this.sentinelEl = sentinel;
    this.totalItems = total;
    this.renderFn = renderFn;
    this.currentPage = 0;

    // Clear
    container.innerHTML = '';
    this.pool = [];
    this.activeNodes.clear();

    // Setup IntersectionObserver for infinite scroll
    if (this.observer) this.observer.disconnect();
    this.observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          this.loadNextPage();
        }
      }
    }, { rootMargin: '400px' });
    this.observer.observe(sentinel);

    // Initial load
    this.loadNextPage();
  },

  loadNextPage() {
    const start = this.currentPage * this.PAGE_SIZE;
    if (start >= this.totalItems) return;
    const end = Math.min(start + this.PAGE_SIZE, this.totalItems);
    this.currentPage++;

    for (let i = start; i < end; i++) {
      this.scheduleRender(i);
    }
    this.flush();
  },

  scheduleRender(index) {
    this.batchQueue.push(index);
    if (!this.frameRequested) {
      this.frameRequested = true;
      requestAnimationFrame(() => this.flush());
    }
  },

  flush() {
    const fragment = document.createDocumentFragment();
    while (this.batchQueue.length > 0) {
      const idx = this.batchQueue.shift();
      if (this.activeNodes.has(idx)) continue;
      const node = this.acquireNode();
      this.renderFn(node, idx);
      node.dataset.idx = idx;
      this.activeNodes.set(idx, node);
      fragment.appendChild(node);
    }
    this.containerEl.appendChild(fragment);
    this.frameRequested = false;
  },

  acquireNode() {
    if (this.pool.length > 0) {
      const n = this.pool.pop();
      n.innerHTML = '';
      n.className = 'yt-video-card';
      n.style.display = '';
      return n;
    }
    const n = document.createElement('div');
    n.className = 'yt-video-card';
    return n;
  },

  releaseNode(node) {
    node.style.display = 'none';
    this.pool.push(node);
  },

  reset() {
    this.batchQueue = [];
    this.currentPage = 0;
    this.activeNodes.clear();
    if (this.containerEl) this.containerEl.innerHTML = '';
  }
};

// SECTION 2: SVG THUMBNAIL GENERATOR
// ============================================================
// Generates unique SVG thumbnails for each video with:
// - Gradient backgrounds
// - Geometric shapes
// - Stylized text overlays
// - Color palettes derived from video ID for consistency

const ThumbnailGen = {
  palettes: [
    ['#ff6b6b','#ee5a24','#fad390'],
    ['#6c5ce7','#a29bfe','#dfe6e9'],
    ['#00cec9','#81ecec','#55efc4'],
    ['#fd79a8','#e84393','#fdcb6e'],
    ['#0984e3','#74b9ff','#dfe6e9'],
    ['#e17055','#fab1a0','#ffeaa7'],
    ['#00b894','#55efc4','#b2bec3'],
    ['#636e72','#b2bec3','#dfe6e9'],
    ['#d63031','#ff7675','#ffeaa7'],
    ['#6c5ce7','#fd79a8','#ffeaa7'],
    ['#2d3436','#636e72','#dfe6e9'],
    ['#e84393','#fd79a8','#a29bfe'],
    ['#fdcb6e','#f39c12','#e74c3c'],
    ['#1abc9c','#2ecc71','#3498db'],
    ['#9b59b6','#8e44ad','#2c3e50'],
    ['#e74c3c','#c0392b','#ecf0f1'],
    ['#16a085','#27ae60','#f1c40f'],
    ['#2980b9','#3498db','#1abc9c'],
    ['#f39c12','#e67e22','#d35400'],
    ['#1a1a2e','#16213e','#e94560'],
  ],

  shapes: ['circles','rectangles','triangles','waves','grid','diamond','star','cross','hexagon','lines'],

  generateSVG(videoId, title) {
    const palette = this.palettes[videoId % this.palettes.length];
    const shape = this.shapes[videoId % this.shapes.length];
    const seed = videoId * 7 + 13;

    let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">`;
    svgContent += `<defs><linearGradient id="bg${videoId}" x1="0%" y1="0%" x2="100%" y2="100%">`;
    svgContent += `<stop offset="0%" stop-color="${palette[0]}"/>`;
    svgContent += `<stop offset="100%" stop-color="${palette[1]}"/>`;
    svgContent += `</linearGradient></defs>`;
    svgContent += `<rect width="320" height="180" fill="url(#bg${videoId})"/>`;

    svgContent += this.drawShape(shape, palette, seed, videoId);

    // Text overlay
    const shortTitle = title.length > 12 ? title.substring(0, 12) + '…' : title;
    svgContent += `<rect x="10" y="130" width="300" height="42" rx="6" fill="rgba(0,0,0,0.5)"/>`;
    svgContent += `<text x="160" y="158" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="sans-serif">${this.escapeXml(shortTitle)}</text>`;

    svgContent += `</svg>`;
    return svgContent;
  },

  drawShape(shape, palette, seed, vid) {
    let s = '';
    const r = (max) => ((seed * (vid+1) * 31 + 17) % max);
    switch(shape) {
      case 'circles':
        for(let i=0;i<5;i++){
          const cx=40+i*60+r(30);const cy=40+r(60);const cr=15+r(30);
          s+=`<circle cx="${cx}" cy="${cy}" r="${cr}" fill="${palette[2]}" opacity="0.4"/>`;
        }
        s+=`<circle cx="160" cy="90" r="40" fill="rgba(255,255,255,0.15)"/>`;
        // play icon
        s+=`<polygon points="148,70 148,110 180,90" fill="rgba(255,255,255,0.8)"/>`;
        break;
      case 'rectangles':
        for(let i=0;i<6;i++){
          const x=20+i*50;const y=20+r(40)+i*5;
          s+=`<rect x="${x}" y="${y}" width="${30+r(20)}" height="${20+r(30)}" rx="4" fill="${palette[2]}" opacity="0.3" transform="rotate(${r(30)-15},${x+15},${y+15})"/>`;
        }
        s+=`<rect x="120" y="55" width="80" height="50" rx="8" fill="rgba(255,255,255,0.15)"/>`;
        s+=`<polygon points="148,68 148,92 172,80" fill="rgba(255,255,255,0.8)"/>`;
        break;
      case 'triangles':
        for(let i=0;i<4;i++){
          const x=30+i*75;const y=100;
          s+=`<polygon points="${x},${y-40-r(20)} ${x-25},${y+10} ${x+25},${y+10}" fill="${palette[2]}" opacity="0.35"/>`;
        }
        s+=`<polygon points="145,65 145,105 185,85" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>`;
        break;
      case 'waves':
        s+=`<path d="M0,100 Q40,${60+r(30)} 80,100 T160,100 T240,100 T320,100 V180 H0 Z" fill="${palette[2]}" opacity="0.3"/>`;
        s+=`<path d="M0,120 Q50,${80+r(30)} 100,120 T200,120 T320,120 V180 H0 Z" fill="${palette[1]}" opacity="0.2"/>`;
        s+=`<circle cx="160" cy="75" r="30" fill="rgba(255,255,255,0.15)"/>`;
        s+=`<polygon points="150,60 150,90 175,75" fill="rgba(255,255,255,0.8)"/>`;
        break;
      case 'grid':
        for(let x=0;x<8;x++)for(let y=0;y<5;y++){
          s+=`<rect x="${x*42+5}" y="${y*38+5}" width="36" height="32" rx="3" fill="${(x+y)%2===0?palette[2]:palette[1]}" opacity="0.15"/>`;
        }
        s+=`<circle cx="160" cy="85" r="35" fill="rgba(0,0,0,0.3)"/>`;
        s+=`<polygon points="150,70 150,100 178,85" fill="rgba(255,255,255,0.9)"/>`;
        break;
      case 'diamond':
        s+=`<polygon points="160,20 260,90 160,160 60,90" fill="${palette[2]}" opacity="0.25" stroke="${palette[2]}" stroke-width="2"/>`;
        s+=`<polygon points="160,45 230,90 160,135 90,90" fill="rgba(255,255,255,0.1)"/>`;
        s+=`<polygon points="150,75 150,105 175,90" fill="rgba(255,255,255,0.8)"/>`;
        break;
      case 'star':
        const cx=160,cy=80,or=50,ir=25;
        let pts=[];
        for(let i=0;i<10;i++){
          const a=Math.PI/2+i*Math.PI/5;
          const R=i%2===0?or:ir;
          pts.push(`${cx+R*Math.cos(a)},${cy-R*Math.sin(a)}`);
        }
        s+=`<polygon points="${pts.join(' ')}" fill="${palette[2]}" opacity="0.3"/>`;
        s+=`<polygon points="150,70 150,100 178,85" fill="rgba(255,255,255,0.8)"/>`;
        break;
      case 'cross':
        s+=`<rect x="130" y="30" width="60" height="120" rx="6" fill="${palette[2]}" opacity="0.25"/>`;
        s+=`<rect x="70" y="60" width="180" height="60" rx="6" fill="${palette[2]}" opacity="0.25"/>`;
        s+=`<circle cx="160" cy="90" r="28" fill="rgba(0,0,0,0.3)"/>`;
        s+=`<polygon points="150,76 150,104 175,90" fill="rgba(255,255,255,0.8)"/>`;
        break;
      case 'hexagon':
        const hx=160,hy=85,hr=55;
        let hp=[];
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3-Math.PI/6;
          hp.push(`${hx+hr*Math.cos(a)},${hy+hr*Math.sin(a)}`);
        }
        s+=`<polygon points="${hp.join(' ')}" fill="${palette[2]}" opacity="0.25" stroke="${palette[2]}" stroke-width="2"/>`;
        let hp2=[];
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3-Math.PI/6;
          hp2.push(`${hx+(hr-15)*Math.cos(a)},${hy+(hr-15)*Math.sin(a)}`);
        }
        s+=`<polygon points="${hp2.join(' ')}" fill="rgba(255,255,255,0.08)"/>`;
        s+=`<polygon points="150,75 150,100 175,87" fill="rgba(255,255,255,0.8)"/>`;
        break;
      case 'lines':
        for(let i=0;i<12;i++){
          s+=`<line x1="${i*28}" y1="0" x2="${i*28+40}" y2="180" stroke="${palette[2]}" stroke-width="2" opacity="0.2"/>`;
        }
        s+=`<circle cx="160" cy="85" r="32" fill="rgba(0,0,0,0.35)"/>`;
        s+=`<polygon points="150,72 150,98 175,85" fill="rgba(255,255,255,0.8)"/>`;
        break;
    }
    return s;
  },

  escapeXml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  },

  // Generate a small avatar SVG
  generateAvatarSVG(channelId) {
    const colors = ['#ff6b6b','#6c5ce7','#00cec9','#fd79a8','#0984e3','#e17055','#00b894','#636e72','#d63031','#e84393','#fdcb6e','#1abc9c','#9b59b6','#e74c3c','#2980b9','#f39c12'];
    const bg = colors[channelId % colors.length];
    const letter = String.fromCharCode(65 + (channelId % 26));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><circle cx="18" cy="18" r="18" fill="${bg}"/><text x="18" y="24" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="sans-serif">${letter}</text></svg>`;
  }
};

// ============================================================
// SECTION 5: CHIP CATEGORIES
// ============================================================

const CATEGORIES = ['すべて','音楽','ゲーム','ライブ','コント','アニメーション','料理','最近アップロードされた動画','新しい動画の発見'];

function renderChips() {
  const scroll = document.getElementById('chipsScroll');
  scroll.innerHTML = '';
  CATEGORIES.forEach((cat, i) => {
    const chip = document.createElement('button');
    chip.className = 'yt-chip' + (i === 0 ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => filterByCategory(cat, chip);
    scroll.appendChild(chip);
  });
}

let currentCategory = 'すべて';

function filterByCategory(cat, chipEl) {
  currentCategory = cat;
  document.querySelectorAll('.yt-chip').forEach(c => c.classList.remove('active'));
  chipEl.classList.add('active');

  const filtered = getFilteredVideos();
  VRE.reset();
  VRE.init(
    document.getElementById('videoGrid'),
    document.getElementById('sentinel'),
    filtered.length,
    (node, idx) => renderVideoCard(node, filtered[idx])
  );
}

function getFilteredVideos() {
  if (currentCategory === 'すべて') return VIDEOS;
  if (currentCategory === '最近アップロードされた動画') {
    return VIDEOS.filter(v => v.time.includes('時間前') || v.time.includes('日前') || v.time.includes('1週間前'));
  }
  if (currentCategory === '新しい動画の発見') {
    // Shuffle-ish: return reversed
    return [...VIDEOS].reverse();
  }
  return VIDEOS.filter(v => v.category === currentCategory);
}

// SECTION 6: VIDEO CARD RENDERER
// ============================================================

function renderVideoCard(node, video) {
  const ch = CHANNELS[video.ch];
  const thumbSVG = ThumbnailGen.generateSVG(video.id, video.title);
  const avatarSVG = ThumbnailGen.generateAvatarSVG(ch.id);
  const verifiedIcon = ch.verified ? `<span class="verified"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></span>` : '';

  node.innerHTML = `
    <div class="yt-thumb-wrap">
      ${thumbSVG}
      <span class="yt-duration">${video.dur}</span>
      ${video.progress > 0 ? `<div class="yt-progress-bar" style="width:${video.progress}%"></div>` : ''}
    </div>
    <div class="yt-card-info">
      <div class="yt-card-avatar">${avatarSVG}</div>
      <div class="yt-card-meta">
        <div class="yt-card-title">${video.title}</div>
        <div class="yt-card-channel">${ch.name} ${verifiedIcon}</div>
        <div class="yt-card-stats">${video.views}回視聴・${video.time}</div>
      </div>
    </div>
  `;
  node.onclick = () => openPlayer(video.id);
}

// ============================================================
// SECTION 8: SEARCH FUNCTIONALITY
// ============================================================

function handleSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) {
    // Reset to all
    currentCategory = 'すべて';
    document.querySelectorAll('.yt-chip').forEach((c, i) => {
      c.classList.toggle('active', i === 0);
    });
    VRE.reset();
    VRE.init(
      document.getElementById('videoGrid'),
      document.getElementById('sentinel'),
      VIDEOS.length,
      (node, idx) => renderVideoCard(node, VIDEOS[idx])
    );
    return;
  }
  
  const results = VIDEOS.filter(v => {
    const ch = CHANNELS[v.ch];
    return v.title.toLowerCase().includes(query) ||
           ch.name.toLowerCase().includes(query) ||
           v.desc.toLowerCase().includes(query) ||
           v.category.toLowerCase().includes(query);
  });
  
  // Deselect chips
  document.querySelectorAll('.yt-chip').forEach(c => c.classList.remove('active'));
  
  VRE.reset();
  VRE.init(
    document.getElementById('videoGrid'),
    document.getElementById('sentinel'),
    results.length,
    (node, idx) => renderVideoCard(node, results[idx])
  );
}

document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleSearch();
});

// ============================================================
// SECTION 9: INITIALIZATION
// ============================================================

function init() {
  renderChips();
  VRE.init(
    document.getElementById('videoGrid'),
    document.getElementById('sentinel'),
    VIDEOS.length,
    (node, idx) => renderVideoCard(node, VIDEOS[idx])
  );
}

// Keyboard shortcut: Escape to close player
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePlayer();
});

// Start
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();

</script>
