<script>
'use strict';
const FH=6,BW=50,BD=50,BMW=70,WT=.4,EH=1.7,EW=4,ED=4;
const FL={'B5':-30,'B4':-24,'B3':-18,'B2':-12,'B1':-6,'1F':0,'2F':FH,'3F':FH*2,'4F':FH*3,'5F':FH*4,'6F':FH*5,'7F':FH*6};
const FN={'B5':'B5-極秘実験室Ω','B4':'B4-極秘実験室Δ','B3':'B3-極秘実験室Γ','B2':'B2-極秘実験室Β','B1':'B1-極秘実験室Α','1F':'1F-エントランス','2F':'2F-サーバールーム','3F':'3F-食堂&オフィス','4F':'4F-迷路フロア','5F':'5F-システム管理室','6F':'6F-民泊施設','7F':'7F-シェルター'};
const FO=['B5','B4','B3','B2','B1','1F','2F','3F','4F','5F','6F','7F'];
const S={hp:100,mhp:100,cf:'1F',inElev:false,ef:'1F',eMoving:false,eTgtY:0,panel:null,locked:true,msgs:[],sys:{},monsters:[],iacts:[],lObjs:{},clk:new THREE.Clock(),keys:{},euler:new THREE.Euler(0,0,0,'YXZ'),vel:new THREE.Vector3(),onG:true,aCd:0,dCd:0};
FO.forEach(f=>{S.sys[f+'_l']=true});S.sys.elev=true;S.sys.pwr=true;S.sys.emrg=false;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x6699cc);scene.fog=new THREE.FogExp2(0x5588aa,.004);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,500);cam.position.set(0,EH,28);
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(R.domElement);
scene.add(new THREE.AmbientLight(0x556677,.4));
const sun=new THREE.DirectionalLight(0xffeedd,.7);sun.position.set(60,100,40);sun.castShadow=true;sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const rc=new THREE.Raycaster();rc.far=5;
const M={};
function mm(c,o){const m=new THREE.MeshStandardMaterial({color:c,...o});return m}
M.gray=mm(0x888888);M.dg=mm(0x555555);M.fl=mm(0xccccbb);M.cl=mm(0xeeeeee);M.wl=mm(0xddddcc);M.wd=mm(0x445566);M.wo=mm(0x8B6914);M.wk=mm(0x5C4033);M.mt=mm(0x999999,{metalness:.7,roughness:.3});M.bk=mm(0x222222);M.wh=mm(0xffffff);M.rd=mm(0xcc0000);M.gn=mm(0x00aa00);M.bl=mm(0x0044cc);M.cy=mm(0x00aacc);M.or=mm(0xff8800);M.yl=mm(0xffcc00);M.pu=mm(0x6600aa);M.pk=mm(0xff66aa);M.gl=mm(0x88ccff,{transparent:true,opacity:.3});M.sc=mm(0x003366,{emissive:0x003366,emissiveIntensity:.5});M.so=mm(0x00ff88,{emissive:0x00ff88,emissiveIntensity:1});M.lo=mm(0xffffee,{emissive:0xffffcc,emissiveIntensity:2});M.lf=mm(0x333333);M.gr=mm(0x338833);M.tr=mm(0x225522);M.tk=mm(0x664422);M.cn=mm(0x777777);M.cp=mm(0x446688);M.lbf=mm(0x334455);M.dn=mm(0xaa0000,{emissive:0x330000,emissiveIntensity:.5});M.gw=mm(0x00ffaa,{emissive:0x00ff88,emissiveIntensity:2,transparent:true,opacity:.7});M.ed=mm(0x888899,{metalness:.8,roughness:.2});
const FD=[mm(0xff6633),mm(0xffcc66),mm(0xff3333),mm(0x66cc33),mm(0xcc9933),mm(0xff9966),mm(0x996633),mm(0xffff66),mm(0x33cc99),mm(0xff6699)];

function bx(w,h,d,m,x,y,z){const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);g.position.set(x,y,z);g.castShadow=true;g.receiveShadow=true;return g}
function mk(mesh,type,data){mesh.userData={...mesh.userData,ii:true,type,...data};S.iacts.push(mesh);return mesh}
function afc(g,w,d,y,fm,cm){g.add(bx(w,.2,d,fm||M.fl,0,y,0));g.add(bx(w,.15,d,cm||M.cl,0,y+FH-.1,0))}
function al(g,x,y,z,c,i,fk){const l=new THREE.PointLight(c||0xffffee,i||.6,18);l.position.set(x,y,z);g.add(l);const f=bx(.5,.08,.5,M.lo,x,y+.05,z);g.add(f);if(!S.lObjs[fk])S.lObjs[fk]=[];S.lObjs[fk].push({l,f,oi:i||.6});return l}
function msg(t,c){const lg=document.getElementById('msg-log'),dv=document.createElement('div');dv.style.color=c||'#fff';dv.textContent=t;lg.appendChild(dv);S.msgs.push({dv,t:Date.now()});if(S.msgs.length>6){S.msgs.shift().dv.remove()}setTimeout(()=>dv.style.opacity='0',3000);setTimeout(()=>dv.remove(),4000)}

/* ELEVATOR */
const EG=new THREE.Group();
const ef=bx(EW,.2,ED,M.mt,0,.1,0),ec=bx(EW,.1,ED,M.mt,0,FH-.4,0);
const eb=bx(EW,FH-.5,WT,M.mt,0,FH/2,-ED/2);
const el=bx(WT,FH-.5,ED,M.mt,-EW/2,FH/2,0);
const er=bx(WT,FH-.5,ED,M.mt,EW/2,FH/2,0);
const edl=bx(EW/2-.1,FH-.5,.12,M.ed,-EW/4,FH/2,ED/2);
const edr=bx(EW/2-.1,FH-.5,.12,M.ed,EW/4,FH/2,ED/2);
const ep=bx(.35,.5,.08,M.sc,EW/2-.25,1.5,-ED/2+.15);mk(ep,'epnl',{label:'エレベーターパネル'});
const eil=new THREE.PointLight(0xffffee,.5,8);eil.position.set(0,FH-1,0);
EG.add(ef,ec,eb,el,er,edl,edr,ep,eil);
const EPX=-BW/2+EW/2+3,EPZ=0;
EG.position.set(EPX,0,EPZ);scene.add(EG);
let edO=false,edA=0;
function aed(o){edO=o}
function ued(dt){const tg=edO?1:0;edA+=(tg-edA)*4*dt;edl.position.x=-EW/4-edA*(EW/4+.5);edr.position.x=EW/4+edA*(EW/4+.5)}
function mElev(tf){if(S.eMoving||tf===S.ef||!S.sys.elev)return;if(!S.sys.elev){msg('エレベーター停止中','#f88');return}S.eMoving=true;S.eTgtY=FL[tf];msg(FN[tf]+'へ移動中...','#0af');aed(false);document.getElementById('elev-panel').classList.add('hidden');S.panel=null}
function uElev(dt){if(!S.eMoving)return;const cy=EG.position.y,ty=S.eTgtY,df=ty-cy,sp=7;if(Math.abs(df)<.05){EG.position.y=ty;S.eMoving=false;for(const[k,v]of Object.entries(FL))if(v===ty){S.ef=k;break}msg(FN[S.ef]+'に到着','#0f0');aed(true);uEP()}else{const mv=Math.sign(df)*Math.min(sp*dt,Math.abs(df));EG.position.y+=mv;if(S.inElev)cam.position.y+=mv}}

/* BUILD */
const BG=new THREE.Group();scene.add(BG);

function mkExt(){
const g=new THREE.Group(),h=FH*7+1,yc=h/2;
g.add(bx(BW,h,WT,M.gray,0,yc,-BD/2));
const dw=(BW-4)/2;g.add(bx(dw,h,WT,M.gray,-(BW+4)/4,yc,BD/2));g.add(bx(dw,h,WT,M.gray,(BW+4)/4,yc,BD/2));g.add(bx(4,h-4,WT,M.gray,0,yc+2,BD/2));
g.add(bx(WT,h,BD,M.gray,BW/2,yc,0));g.add(bx(WT,h,BD,M.gray,-BW/2,yc,0));
g.add(bx(BW+2,.5,BD+2,M.dg,0,h+.25,0));
const md=bx(3.5,3.8,.25,M.gl,0,1.9,BD/2-.3);mk(md,'door',{label:'正面入口',open:false});g.add(md);
const ed=bx(2.5,3.5,.25,M.rd,15,1.75,-BD/2+.3);mk(ed,'door',{label:'非常口',open:false});g.add(ed);
FO.forEach(f=>{const y=FL[f];const b=bx(.25,.25,.08,M.so,EPX+EW/2+1,y+1.3,EPZ+ED/2+.4);mk(b,'ecall',{label:'EV呼出',floor:f});g.add(b)});
return g}

function mk1F(){
const g=new THREE.Group(),y=FL['1F'];
afc(g,BW-1,BD-1,y);
g.add(bx(5,1.1,1.8,M.wo,5,y+.55,10));g.add(bx(5.2,.08,2,M.wk,5,y+1.12,10));
const mon=bx(.9,.6,.08,M.sc,5,y+1.5,9.3);mk(mon,'pc',{label:'受付PC',ms:'ようこそ！ビルエクスプローラーへ'});g.add(mon);
g.add(bx(.25,.08,.18,M.bk,7,y+1.18,10));
for(let i=0;i<3;i++){const sx=11+i*4;g.add(bx(2.8,.55,1.3,M.bl,sx,y+.28,16));g.add(bx(2.8,.7,.25,M.bl,sx,y+.7,16.7))}
g.add(bx(1.8,.45,.9,M.wk,13,y+.23,13));g.add(bx(.35,.04,.25,M.rd,12.7,y+.47,13));g.add(bx(.35,.04,.25,M.bl,13.3,y+.47,13));
for(let i=0;i<4;i++){const px=[2,22,2,22][i],pz=[4,4,20,20][i];g.add(bx(.35,.5,.35,M.wk,px,y+.25,pz));g.add(bx(.7,1,0.7,M.gn,px,y+1,pz))}
g.add(bx(.25,FH-1,14,M.wl,8,y+(FH-1)/2,-10));g.add(bx(14,FH-1,.25,M.wl,16,y+(FH-1)/2,-4));
const sd=bx(1.8,3.2,.25,M.wk,8,y+1.6,-7);mk(sd,'door',{label:'倉庫',open:false});g.add(sd);
const iNames=['工具箱','掃除用品','書類ファイル','段ボール箱','ペンキ缶','非常用品','予備部品','バッテリー','ケーブル類','テープ','洗剤','ヘルメット','懐中電灯','ロープ','消火器','救急箱','フィルター','スプレー','接着剤','タオル','ドライバー','ハンマー','予備ランプ'];
for(let i=0;i<5;i++){const sz=-5-i*2.2;g.add(bx(3.5,2.8,.4,M.wo,17,y+1.4,sz));for(let j=0;j<5;j++){const it=bx(.4+Math.random()*.2,.35+Math.random()*.2,.35,[M.rd,M.bl,M.gn,M.yl,M.or,M.pu,M.cy][Math.floor(Math.random()*7)],15+j*.9,y+.4+Math.floor(j/3)*1.1,sz);mk(it,'item',{label:iNames[(i*5+j)%iNames.length]});g.add(it)}}
al(g,0,y+FH-.4,5,0xffffee,.7,'1F');al(g,10,y+FH-.4,5,0xffffee,.5,'1F');al(g,-10,y+FH-.4,0,0xffffee,.5,'1F');al(g,15,y+FH-.4,-8,0xffffee,.4,'1F');
return g}

function mk2F(){
const g=new THREE.Group(),y=FL['2F'];
afc(g,BW-1,BD-1,y,M.lbf,M.dg);
for(let r=0;r<4;r++)for(let c=0;c<5;c++){const rx=-6+c*5,rz=-14+r*7;g.add(bx(1.2,3.5,.8,M.bk,rx,y+1.75,rz));for(let li=0;li<4;li++){const lb=bx(.08,.06,.04,M.so,rx+.45,y+.4+li*.7,rz+.45);lb.userData={blink:true,br:.5+Math.random()*2};g.add(lb)}mk(g.children[g.children.length-5],'srv',{label:'サーバー'+String.fromCharCode(65+r)+(c+1),ms:'CPU:'+Math.floor(Math.random()*80+20)+'% MEM:'+Math.floor(Math.random()*64+16)+'GB'})}
for(let i=0;i<3;i++){const tx=-12+i*10;g.add(bx(1.8,.75,.9,M.wk,tx,y+.38,18));const m=bx(.8,.55,.08,M.sc,tx,y+1.05,17.5);mk(m,'pc',{label:'監視端末',ms:'サーバー稼働率:'+Math.floor(Math.random()*10+90)+'%'});g.add(m)}
for(let i=0;i<2;i++){const cx=-16+i*32;g.add(bx(1.8,2.5,1.2,M.cy,cx,y+1.25,-20))}
al(g,0,y+FH-.4,0,0x4488ff,.6,'2F');al(g,-10,y+FH-.4,-10,0x4488ff,.4,'2F');al(g,10,y+FH-.4,10,0x4488ff,.4,'2F');

function mk3F(){
const g=new THREE.Group(),y=FL['3F'];
afc(g,BW-1,BD-1,y);
g.add(bx(.2,FH-2,18,M.gl,0,y+(FH-2)/2,-2));
g.add(bx(14,1.1,1.3,M.wh,0,y+.55,-18));g.add(bx(14.2,.08,1.5,M.mt,0,y+1.12,-18));
const fn=['カレーライス','ラーメン','寿司','サラダ','天丼','天ぷら','ステーキ','オムライス','蕎麦','デザート'];
for(let i=0;i<10;i++){const fx=-5.5+i*1.3;g.add(bx(.6,.04,.6,M.wh,fx,y+1.14,-18));const f=bx(.4,.25,.4,FD[i],fx,y+1.3,-18);mk(f,'food',{label:fn[i],heal:10});g.add(f)}
for(let i=0;i<6;i++){const tx=-10+(i%3)*9,tz=-12+Math.floor(i/3)*5;g.add(bx(2.5,.7,1.8,M.wo,tx,y+.35,tz));for(let c=0;c<4;c++){const cx=tx+[-1.2,1.2,-1.2,1.2][c],cz=tz+[-1.3,-1.3,1.3,1.3][c];g.add(bx(.4,.4,.4,M.wk,cx,y+.2,cz))}}
for(let r=0;r<4;r++)for(let c=0;c<5;c++){const dx=-14+c*6.5,dz=4+r*3.8;g.add(bx(2,.7,1,M.wo,dx,y+.35,dz));const m=bx(.7,.45,.06,M.sc,dx,y+.98,dz-.35);mk(m,'pc',{label:'デスク'+(r*5+c+1)+' PC',ms:'社員用コンピューター'});g.add(m);g.add(bx(.5,.04,.18,M.dg,dx,y+.72,dz+.1));g.add(bx(.4,.08,.4,M.bk,dx,y+.44,dz+.8))}
const wc=bx(.45,1,.45,M.cy,20,y+.5,7);mk(wc,'food',{label:'給水器',heal:5});g.add(wc);g.add(bx(.35,.25,.35,M.bl,20,y+1.12,7));
al(g,-5,y+FH-.4,-10,0xffffee,.8,'3F');al(g,10,y+FH-.4,-10,0xffffee,.8,'3F');al(g,-5,y+FH-.4,10,0xffffee,.6,'3F');al(g,10,y+FH-.4,10,0xffffee,.6,'3F');
return g}

function mk4F(){
const g=new THREE.Group(),y=FL['4F'];

/* PLAYER */
function uPl(dt){if(S.locked||S.panel)return;
const sp=10,fw=new THREE.Vector3();cam.getWorldDirection(fw);fw.y=0;fw.normalize();
const rt=new THREE.Vector3().crossVectors(fw,new THREE.Vector3(0,1,0)).normalize();
const mv=new THREE.Vector3();
if(S.keys['KeyW'])mv.add(fw);if(S.keys['KeyS'])mv.sub(fw);if(S.keys['KeyD'])mv.add(rt);if(S.keys['KeyA'])mv.sub(rt);
if(mv.length()>0)mv.normalize().multiplyScalar(sp*dt);
cam.position.add(mv);
if(S.keys['Space']&&S.onG){S.vel.y=7;S.onG=false}
S.vel.y-=22*dt;cam.position.y+=S.vel.y*dt;
const fy=gFY();if(cam.position.y<fy+EH){cam.position.y=fy+EH;S.vel.y=0;S.onG=true}
cam.position.x=Math.max(-195,Math.min(195,cam.position.x));cam.position.z=Math.max(-195,Math.min(195,cam.position.z));
const ep2=EG.position;S.inElev=Math.abs(cam.position.x-ep2.x)<EW/2&&Math.abs(cam.position.z-ep2.z)<ED/2&&cam.position.y>ep2.y+EH-1&&cam.position.y<ep2.y+FH+EH;
if(S.dCd>0)S.dCd-=dt;if(S.aCd>0)S.aCd-=dt;uFLabel()}

function gFY(){if(S.inElev)return EG.position.y;
const py=cam.position.y-EH,inB=Math.abs(cam.position.x)<BW/2&&Math.abs(cam.position.z)<BD/2,inBM=Math.abs(cam.position.x)<BMW/2&&Math.abs(cam.position.z)<BMW/2&&py<0;
if(inB||inBM){let best=-30;for(const[,fy]of Object.entries(FL)){if(fy<=py+1&&fy>best)best=fy}return Math.max(best,-30)}return 0}

function uFLabel(){const py=cam.position.y-EH;let cf='1F';
for(const[k,fy]of Object.entries(FL)){if(py>=fy-.5&&py<fy+FH){cf=k;break}}
S.cf=cf;const inB=Math.abs(cam.position.x)<BW/2+2&&Math.abs(cam.position.z)<BD/2+2;
const inBM=Math.abs(cam.position.x)<BMW/2+2&&Math.abs(cam.position.z)<BMW/2+2&&py<0;
document.getElementById('fl').textContent=(inB||inBM||S.inElev)?FN[cf]||cf:'屋外 - 森林';
document.getElementById('pos').textContent='X:'+cam.position.x.toFixed(0)+' Y:'+cam.position.y.toFixed(1)+' Z:'+cam.position.z.toFixed(0)}

document.getElementById('hpf').style.background=p>50?'linear-gradient(90deg,#0a0,#0f0)':p>25?'linear-gradient(90deg,#aa0,#ff0)':'linear-gradient(90deg,#a00,#f00)'}

const fy=FL[m.fl],onF=Math.abs(cam.position.y-EH-fy)<4;
if(onF){const dx=cam.position.x-m.g.position.x,dz=cam.position.z-m.g.position.z,ds=Math.sqrt(dx*dx+dz*dz);
if(ds>1.2){const s=m.t.sp*dt;m.g.position.x+=dx/ds*s;m.g.position.z+=dz/ds*s}
m.g.lookAt(cam.position.x,m.g.position.y,cam.position.z);
if(ds<1.8&&S.dCd<=0){S.hp-=m.t.dm;S.dCd=.8;msg(m.t.n+'の攻撃！ -'+m.t.dm+'HP','#f00');uHP();
document.getElementById('dmg-flash').style.opacity='1';setTimeout(()=>document.getElementById('dmg-flash').style.opacity='0',150);
if(S.hp<=0){S.hp=0;uHP();msg('やられた...リスポーン中','#f00');setTimeout(()=>{S.hp=S.mhp;uHP();cam.position.set(0,EH,28);msg('エントランスに復帰','#0f0')},1500)}}}
else{m.wt-=dt;if(m.wt<=0){m.wa+=(Math.random()-.5)*2;m.wt=2+Math.random()*3}const ws=m.t.sp*.2*dt;m.g.position.x+=Math.cos(m.wa)*ws;m.g.position.z+=Math.sin(m.wa)*ws;
const bn=BMW/2-3;m.g.position.x=Math.max(-bn,Math.min(bn,m.g.position.x));m.g.position.z=Math.max(-bn,Math.min(bn,m.g.position.z))}
m.g.position.y=fy+Math.sin(time*3+m.g.id)*.08})}

/* BLINK */
function uBlink(t){scene.traverse(o=>{if(o.userData&&o.userData.blink){const on=Math.sin(t*(o.userData.br||1)*Math.PI*2)>0;o.material=on?M.so:M.lf}})}

/* ELEVATOR DOOR AUTO */
let edTimer=0;
aed(true);

/* LOOP */
function loop(){requestAnimationFrame(loop);const dt=Math.min(S.clk.getDelta(),.1),t=S.clk.elapsedTime;
uPl(dt);uElev(dt);ued(dt);uMon(dt);uBlink(t);chkH();
if(!S.eMoving&&S.inElev&&!edO)aed(true);
if(!S.eMoving&&!S.inElev){edTimer+=dt;if(edTimer>3){aed(false);edTimer=0}}else edTimer=0;
R.render(scene,cam)}
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
loop();
