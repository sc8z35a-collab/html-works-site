/**
 * AccessibilityModule
 * --------------------
 * Enhances calculator accessibility with:
 *   - ARIA labels and live regions
 *   - Screen reader announcements
 *   - High contrast mode detection
 *   - Keyboard navigation improvements
 */
class AccessibilityModule {
    constructor() {
        this.announcer = null;
        this.highContrastMode = false;
        this.reducedMotion = false;

        this._createAnnouncer();
        this._enhanceButtonAccessibility();
        this._detectAccessibilityPreferences();
        this._setupKeyboardNavigation();
    }

    /**
     * _createAnnouncer - Creates a live region for screen reader announcements
     */
    _createAnnouncer() {
        this.announcer = document.createElement('div');
        this.announcer.id = 'sr-announcer';
        this.announcer.setAttribute('role', 'status');
        this.announcer.setAttribute('aria-live', 'polite');
        this.announcer.setAttribute('aria-atomic', 'true');
        this.announcer.style.cssText = `
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        `;
        document.body.appendChild(this.announcer);
    }

    /**
     * announce - Makes a screen reader announcement
     * @param {string} message
     */
    announce(message) {
        if (!this.announcer) return;
        this.announcer.textContent = '';
        requestAnimationFrame(() => {
            this.announcer.textContent = message;
        });
    }

    /**
     * _enhanceButtonAccessibility - Adds ARIA attributes to buttons
     */
    _enhanceButtonAccessibility() {
        const buttons = document.querySelectorAll('.calc-btn');
        buttons.forEach(btn => {
            btn.setAttribute('role', 'button');
            btn.setAttribute('tabindex', '0');

            /* Add descriptive labels */
            const action = btn.getAttribute('data-action');
            const key = btn.getAttribute('data-key');

            if (key) {
                btn.setAttribute('aria-label', `数字 ${key}`);
            } else if (action) {
                const labels = {
                    'ac': 'オールクリア',
                    'plusminus': 'プラスマイナス切替',
                    'percent': 'パーセント',
                    'divide': '割る',
                    'multiply': '掛ける',
                    'subtract': '引く',
                    'add': '足す',
                    'equals': 'イコール',
                    'dot': '小数点',
                    'mc': 'メモリクリア',
                    'mr': 'メモリ呼び出し',
                    'm+': 'メモリ加算',
                    'm-': 'メモリ減算'
                };
                if (labels[action]) {
                    btn.setAttribute('aria-label', labels[action]);
                }
            }

            /* Handle Enter/Space key as click */
            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
                }
            });
        });

        /* Add ARIA to display */
        const display = document.getElementById('display-value');
        if (display) {
            display.setAttribute('role', 'status');
            display.setAttribute('aria-live', 'polite');
            display.setAttribute('aria-label', '計算結果表示');
        }

        /* Calculator landmark */
        const calcBody = document.getElementById('calculator-body');
        if (calcBody) {
            calcBody.setAttribute('role', 'application');
            calcBody.setAttribute('aria-label', '電卓');
        }
    }

    /**
     * _detectAccessibilityPreferences - Detects OS accessibility settings
     */
    _detectAccessibilityPreferences() {
        /* Detect reduced motion preference */
        if (window.matchMedia) {
            const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            this.reducedMotion = motionQuery.matches;

            motionQuery.addEventListener('change', (e) => {
                this.reducedMotion = e.matches;
                this._applyReducedMotion();
            });

            /* Detect high contrast */
            const contrastQuery = window.matchMedia('(prefers-contrast: high)');
            this.highContrastMode = contrastQuery.matches;

            contrastQuery.addEventListener('change', (e) => {
                this.highContrastMode = e.matches;
                this._applyHighContrast();
            });
        }

        if (this.reducedMotion) this._applyReducedMotion();
        if (this.highContrastMode) this._applyHighContrast();
    }

    /**
     * _applyReducedMotion - Reduces animations for motion sensitivity
     */
    _applyReducedMotion() {
        if (this.reducedMotion) {
            document.documentElement.style.setProperty('--animation-speed', '0');
            console.log('[Accessibility] Reduced motion mode activated');
        } else {
            document.documentElement.style.removeProperty('--animation-speed');
        }
    }

    /**
     * _applyHighContrast - Increases contrast for visibility
     */
    _applyHighContrast() {
        if (this.highContrastMode) {
            document.body.classList.add('high-contrast');
            console.log('[Accessibility] High contrast mode activated');
        } else {
            document.body.classList.remove('high-contrast');
        }
    }

    /**
     * _setupKeyboardNavigation - Enhances keyboard navigation within calculator
     */
    _setupKeyboardNavigation() {
        const buttons = Array.from(document.querySelectorAll('.calc-btn'));
        if (buttons.length === 0) return;

        const grid = [];
        const cols = 4;
        for (let i = 0; i < buttons.length; i += cols) {
            grid.push(buttons.slice(i, i + cols));
        }

        buttons.forEach((btn, index) => {
            btn.addEventListener('keydown', (e) => {
                const row = Math.floor(index / cols);
                const col = index % cols;
                let targetRow = row;
                let targetCol = col;

                switch (e.key) {
                    case 'ArrowUp':
                        targetRow = Math.max(0, row - 1);
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        targetRow = Math.min(grid.length - 1, row + 1);
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        targetCol = Math.max(0, col - 1);
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        targetCol = Math.min(cols - 1, col + 1);
                        e.preventDefault();
                        break;
                    case 'Home':
                        targetCol = 0;
                        e.preventDefault();
                        break;
                    case 'End':
                        targetCol = cols - 1;
                        e.preventDefault();
                        break;
                    default:
                        return;
                }

                if (grid[targetRow] && grid[targetRow][targetCol]) {
                    grid[targetRow][targetCol].focus();
                }
            });
        });
    }
}


/* ============================================================
   PART 18: THEME & APPEARANCE MANAGER
   ============================================================ */

/**
 * ThemeManager
 * Manages visual theme settings and dark/light mode
 */
class ThemeManager {
    constructor() {
        this.currentTheme = 'default';
        this.themes = {
            default: {
                bodyGradient: 'linear-gradient(165deg, #c8c4bc 0%, #b8b4ac 25%, #a8a49c 50%, #9e9a92 75%, #908c84 100%)',
                displayBg: 'linear-gradient(180deg, #b8c8a0 0%, #a8b890 30%, #a0b088 50%, #98a880 80%, #90a078 100%)',
                displayTextColor: '#2a3a18',
                envBg: 'radial-gradient(ellipse at 50% 50%, #1e1e32 0%, #12121e 100%)',
                deskColor: 'linear-gradient(180deg, #2a2520 0%, #1e1a16 100%)'
            }
        };
    }

    /**
     * getTheme - Returns current theme properties
     * @returns {Object}
     */
    getTheme() {
        return this.themes[this.currentTheme] || this.themes.default;
    }

    /**
     * setTheme - Switches to a named theme
     * @param {string} themeName
     */
    setTheme(themeName) {
        if (!this.themes[themeName]) {
            console.warn('[ThemeManager] Unknown theme:', themeName);
            return;
        }
        this.currentTheme = themeName;
        this._applyTheme();
    }

    /**
     * _applyTheme - Applies current theme to DOM
     */
    _applyTheme() {
        const theme = this.getTheme();

        const body = document.getElementById('calculator-body');
        if (body) {
            body.style.background = theme.bodyGradient;
        }

        const display = document.getElementById('display-screen');
        if (display) {
            display.style.background = theme.displayBg;
        }

        const displayValue = document.getElementById('display-value');
        if (displayValue) {
            displayValue.style.color = theme.displayTextColor;
        }
    }
}


/* ============================================================
   PART 19: FINAL INITIALIZATION - BOOTSTRAP ALL SYSTEMS
   ============================================================ */

/**
 * This block executes AFTER the initial DOMContentLoaded handler.
 * It connects all the extended subsystems together.
 *
 * Execution order:
 * 1. DOMContentLoaded → UIController, VisualEffectsModule, GeometryDetailModule
 * 2. load → SystemIntegrator, HapticFeedback, Accessibility, ThemeManager
 */
window.addEventListener('load', () => {
    /* Wait for initial modules to be ready */
    setTimeout(() => {
        const app = window.__calculator ? window.__calculator.app : null;

        if (!app) {
            console.error('[Bootstrap] UIController not found. Aborting extended initialization.');
            return;
        }

        console.log('%c[Bootstrap] Initializing extended subsystems...', 'color: #80c060;');

        /* Initialize System Integrator (shadows, materials, environment, precision math) */
        const integrator = new SystemIntegrator(app);

        /* Initialize Haptic Feedback */
        const haptics = new HapticFeedbackSystem();

        /* Initialize Accessibility Module */
        const accessibility = new AccessibilityModule();

        /* Initialize Theme Manager */
        const themeManager = new ThemeManager();

        /* Connect haptics to button presses */
        const originalClickHandler = app._handleButtonClick.bind(app);
        app._handleButtonClick = function(button, e) {
            /* Determine haptic pattern */
            let hapticPattern = 'numberPress';
            if (button.classList.contains('btn-operator')) hapticPattern = 'operatorPress';
            else if (button.classList.contains('btn-clear')) hapticPattern = 'clearPress';
            else if (button.classList.contains('btn-equals')) hapticPattern = 'equalsPress';
            else if (button.classList.contains('btn-function')) hapticPattern = 'functionPress';

            haptics.trigger(hapticPattern);

            /* Call original handler */
            originalClickHandler(button, e);

            /* Announce to screen readers */
            const displayValue = document.getElementById('display-value');
            if (displayValue) {
                accessibility.announce(displayValue.textContent);
            }
        };

        /* Connect error haptic */
        const originalErrorCallback = app.calculator.onError;
        app.calculator.onError = () => {
            haptics.trigger('errorBuzz');
            if (originalErrorCallback) originalErrorCallback();
            accessibility.announce('エラー。ACキーでクリアしてください。');
        };

        /* Connect memory haptics */
        const originalMemoryFlash = app.calculator.onMemoryFlash;
        app.calculator.onMemoryFlash = () => {
            haptics.trigger('memoryStore');
            if (originalMemoryFlash) originalMemoryFlash();
        };

        /* Extend global debug reference */
        window.__calculator.integrator = integrator;
        window.__calculator.haptics = haptics;
        window.__calculator.accessibility = accessibility;
        window.__calculator.themeManager = themeManager;
        window.__calculator.precisionMath = integrator.precisionMath;
        window.__calculator.shadowEngine = integrator.shadowEngine;
        window.__calculator.materialSystem = integrator.materialSystem;
        window.__calculator.envMap = integrator.envMapSimulator;
        window.__calculator.getPerformance = () => integrator.getPerformanceReport();

        /* Final startup log */
        console.log('%c╔══════════════════════════════════════════════╗', 'color: #60c080;');
        console.log('%c║  3D Calculator - ALL SYSTEMS OPERATIONAL     ║', 'color: #60c080; font-weight: bold;');
        console.log('%c║  ─────────────────────────────────────────   ║', 'color: #60c080;');
        console.log('%c║  ✓ Calculator Engine (Precision Math)        ║', 'color: #60c080;');
        console.log('%c║  ✓ Audio Engine (Web Audio Synthesis)        ║', 'color: #60c080;');
        console.log('%c║  ✓ 3D Interaction (Mouse/Touch Rotation)     ║', 'color: #60c080;');
        console.log('%c║  ✓ UI Controller (Full DOM Management)       ║', 'color: #60c080;');
        console.log('%c║  ✓ Visual Effects (PBR/Specular/Caustics)    ║', 'color: #60c080;');
        console.log('%c║  ✓ Geometry Details (Micro-detail Meshes)    ║', 'color: #60c080;');
        console.log('%c║  ✓ Shadow Render Engine (Multi-layer Soft)   ║', 'color: #60c080;');
        console.log('%c║  ✓ Material System (12 PBR Materials)        ║', 'color: #60c080;');
        console.log('%c║  ✓ Environment Maps (CSS Simulation)         ║', 'color: #60c080;');
        console.log('%c║  ✓ Haptic Feedback (Device Vibration)        ║', 'color: #60c080;');
        console.log('%c║  ✓ Accessibility (ARIA + SR + Nav)           ║', 'color: #60c080;');
        console.log('%c║  ✓ Theme Manager (Appearance Control)        ║', 'color: #60c080;');
        console.log('%c║  ✓ Performance Monitor (Auto Quality)        ║', 'color: #60c080;');
        console.log('%c╚══════════════════════════════════════════════╝', 'color: #60c080;');
        console.log('%c[3D Calculator] Use window.__calculator for full API access', 'color: #aaa;');

        /* Performance baseline */
        setTimeout(() => {
            const report = integrator.getPerformanceReport();
            console.log('[Performance Baseline]', report);
        }, 3000);

    }, 100);
});


/* ============================================================
   PART 20: CLEANUP & MEMORY MANAGEMENT
   ============================================================ */

/**
 * Handles page unload to clean up resources
 */
window.addEventListener('beforeunload', () => {
    /* Clean up audio context */
    if (window.__calculator && window.__calculator.audio) {
        const audioCtx = window.__calculator.audio.audioContext;
        if (audioCtx && audioCtx.state !== 'closed') {
            try {
                audioCtx.close();
            } catch (e) {
                /* Silently fail */
            }
        }
    }

    /* Clean up particle pool */
    if (window.__calculator && window.__calculator.app) {
        const app = window.__calculator.app;
        if (app.particlePool) {
            app.particlePool.forEach(p => {
                if (p.parentNode) p.parentNode.removeChild(p);
            });
            app.particlePool = [];
        }
    }

    /* Cancel all animation frames */
    /* (Browsers handle this on unload, but being explicit) */

    console.log('[3D Calculator] Cleanup complete');
});

/**
 * Handle visibility change to pause/resume expensive operations
 */
document.addEventListener('visibilitychange', () => {
    if (window.__calculator && window.__calculator.app) {
        if (document.hidden) {
            /* Page hidden - reduce activity */
            console.log('[3D Calculator] Page hidden - reducing activity');
        } else {
            /* Page visible - resume */
            console.log('[3D Calculator] Page visible - resuming');
            if (window.__calculator.audio) {
                window.__calculator.audio.resume();
            }
        }
    }
});
