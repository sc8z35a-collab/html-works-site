<script>
/* ============================================================
   PART 1: CALCULATOR ENGINE - CORE STATE MANAGEMENT
   ============================================================ */

/**
 * CalculatorEngine
 * ----------------
 * This class encapsulates ALL calculator logic:
 *   - Number input handling
 *   - Arithmetic operations (+, -, *, /)
 *   - Memory functions (MC, MR, M+, M-)
 *   - Percent calculation
 *   - Plus/minus toggle
 *   - Error handling
 *   - Display formatting
 *   - Chain calculations
 *   - Repeat-equals functionality
 */
class CalculatorEngine {
    constructor() {
        /* --------------------------------------------------------
           Core State Properties
           -------------------------------------------------------- */
        this.currentValue = '0';          // The string shown on display
        this.previousValue = null;         // Value before operator was pressed
        this.pendingOperator = null;       // The operator waiting to be applied
        this.isNewInput = true;            // Whether next digit starts fresh
        this.hasDecimal = false;           // Whether current input has a decimal
        this.memory = 0;                   // Memory register
        this.hasMemory = false;            // Whether memory has been set
        this.isError = false;              // Whether display shows error
        this.lastOperator = null;          // For repeat-equals
        this.lastOperand = null;           // For repeat-equals
        this.justPressedEquals = false;    // Flag for equals repeat behavior
        this.operationText = '';           // Text shown in operation display
        this.maxDigits = 12;              // Maximum displayable digits
        this.maxDisplayLength = 15;       // Maximum display string length including separators

        /* --------------------------------------------------------
           History / Logging
           -------------------------------------------------------- */
        this.history = [];                 // Calculation history array
        this.historyMaxLength = 100;       // Max history entries

        /* --------------------------------------------------------
           Callback Hooks
           -------------------------------------------------------- */
        this.onDisplayUpdate = null;       // Called when display value changes
        this.onOperationUpdate = null;     // Called when operation text changes
        this.onMemoryUpdate = null;        // Called when memory status changes
        this.onError = null;              // Called when error occurs
        this.onClear = null;              // Called on AC
        this.onMemoryFlash = null;        // Called for memory animation

        /* --------------------------------------------------------
           Internal Precision Constants
           -------------------------------------------------------- */
        this.PRECISION = 14;              // Internal calculation precision
        this.DISPLAY_PRECISION = 10;      // Maximum decimal display precision

        /* --------------------------------------------------------
           Initialize display
           -------------------------------------------------------- */
        this._updateDisplay();
    }

    /* ============================================================
       SECTION: NUMBER INPUT METHODS
       ============================================================ */

    /**
     * inputDigit - Handles digit key press (0-9)
     * @param {string} digit - The digit character
     */
    inputDigit(digit) {
        if (this.isError) {
            this.allClear();
        }

        /* If we just pressed equals, start fresh */
        if (this.justPressedEquals) {
            this.justPressedEquals = false;
            this.previousValue = null;
            this.pendingOperator = null;
            this.operationText = '';
            this._notifyOperationUpdate();
        }

        if (this.isNewInput) {
            /* Starting new number entry */
            if (digit === '0') {
                this.currentValue = '0';
            } else {
                this.currentValue = digit;
            }
            this.isNewInput = false;
            this.hasDecimal = false;
        } else {
            /* Continuing current number entry */
            /* Count actual digits (excluding minus sign and decimal point) */
            const digitCount = this.currentValue.replace(/[^0-9]/g, '').length;

            if (digitCount >= this.maxDigits) {
                /* Maximum digits reached - ignore input */
                return;
            }

            if (this.currentValue === '0' && digit !== '0') {
                /* Replace leading zero */
                this.currentValue = digit;
            } else if (this.currentValue === '0' && digit === '0') {
                /* Don't add extra leading zeros */
                return;
            } else {
                this.currentValue += digit;
            }
        }

        this._updateDisplay();
    }

    /**
     * inputDoubleZero - Handles '00' key press
     */
    inputDoubleZero() {
        if (this.isError) {
            this.allClear();
        }

        if (this.justPressedEquals) {
            this.justPressedEquals = false;
            this.previousValue = null;
            this.pendingOperator = null;
            this.operationText = '';
            this._notifyOperationUpdate();
        }

        if (this.isNewInput) {
            this.currentValue = '0';
            this.isNewInput = false;
            this.hasDecimal = false;
        } else {
            if (this.currentValue === '0') {
                /* Don't add zeros to a bare zero */
                return;
            }

            const digitCount = this.currentValue.replace(/[^0-9]/g, '').length;

            if (digitCount >= this.maxDigits - 1) {
                /* At most add one zero if close to limit */
                if (digitCount < this.maxDigits) {
                    this.currentValue += '0';
                }
            } else {
                this.currentValue += '00';
            }
        }

        this._updateDisplay();
    }

    /**
     * inputDecimal - Handles '.' key press
     */
    inputDecimal() {
        if (this.isError) {
            this.allClear();
        }

        if (this.justPressedEquals) {
            this.justPressedEquals = false;
            this.previousValue = null;
            this.pendingOperator = null;
            this.operationText = '';
            this._notifyOperationUpdate();
        }

        if (this.isNewInput) {
            this.currentValue = '0.';
            this.isNewInput = false;
            this.hasDecimal = true;
            this._updateDisplay();
            return;
        }

        /* Only add decimal if not already present */
        if (!this.currentValue.includes('.')) {
            this.currentValue += '.';
            this.hasDecimal = true;
            this._updateDisplay();
        }
    }

    /* ============================================================
       SECTION: OPERATOR INPUT METHODS
       ============================================================ */

    /**
     * inputOperator - Handles +, -, *, / operator press
     * @param {string} operator - One of '+', '-', '*', '/'
     */
    inputOperator(operator) {
        if (this.isError) {
            this.allClear();
        }

        this.justPressedEquals = false;

        const currentNum = this._parseCurrentValue();

        if (this.previousValue !== null && this.pendingOperator && !this.isNewInput) {
            /* There's a pending calculation - execute it first */
            const result = this._calculate(this.previousValue, this.pendingOperator, currentNum);

            if (result === null) {
                /* Error occurred */
                this._setError();
                return;
            }

            this.previousValue = result;
            this.currentValue = this._formatResult(result);
        } else {
            this.previousValue = currentNum;
        }

        this.pendingOperator = operator;
        this.isNewInput = true;

        /* Update operation display text */
        this.operationText = this._formatForDisplay(this.previousValue) + ' ' + this._operatorSymbol(operator);
        this._notifyOperationUpdate();
        this._updateDisplay();
    }

    /**
     * inputEquals - Handles = key press
     */
    inputEquals() {
        if (this.isError) {
            this.allClear();
            return;
        }

        const currentNum = this._parseCurrentValue();

        if (this.justPressedEquals && this.lastOperator && this.lastOperand !== null) {
            /* Repeat the last operation */
            const result = this._calculate(currentNum, this.lastOperator, this.lastOperand);

            if (result === null) {
                this._setError();
                return;
            }

            /* Update operation text for repeat */
            this.operationText = this._formatForDisplay(currentNum) + ' ' +
                this._operatorSymbol(this.lastOperator) + ' ' +
                this._formatForDisplay(this.lastOperand) + ' =';

            this.currentValue = this._formatResult(result);
            this.previousValue = null;
            this.pendingOperator = null;
            this.isNewInput = true;
            this.justPressedEquals = true;

            /* Log to history */
            this._addHistory(this.operationText, this.currentValue);

            this._notifyOperationUpdate();
            this._updateDisplay();
            return;
        }

        if (this.previousValue !== null && this.pendingOperator) {
            /* Perform the pending calculation */
            const result = this._calculate(this.previousValue, this.pendingOperator, currentNum);

            if (result === null) {
                this._setError();
                return;
            }

            /* Store for repeat-equals */
            this.lastOperator = this.pendingOperator;
            this.lastOperand = currentNum;

            /* Update operation text */
            this.operationText = this._formatForDisplay(this.previousValue) + ' ' +
                this._operatorSymbol(this.pendingOperator) + ' ' +
                this._formatForDisplay(currentNum) + ' =';

            this.currentValue = this._formatResult(result);
            this.previousValue = null;
            this.pendingOperator = null;
            this.isNewInput = true;
            this.justPressedEquals = true;

            /* Log to history */
            this._addHistory(this.operationText, this.currentValue);

            this._notifyOperationUpdate();
            this._updateDisplay();
        }
    }

    /* ============================================================
       SECTION: FUNCTION KEY METHODS
       ============================================================ */

    /**
     * allClear - Resets calculator to initial state
     */
    allClear() {
        this.currentValue = '0';
        this.previousValue = null;
        this.pendingOperator = null;
        this.isNewInput = true;
        this.hasDecimal = false;
        this.isError = false;
        this.lastOperator = null;
        this.lastOperand = null;
        this.justPressedEquals = false;
        this.operationText = '';

        this._notifyOperationUpdate();
        this._updateDisplay();

        if (this.onClear) {
            this.onClear();
        }
    }

    /**
     * toggleSign - Toggles positive/negative
     */
    toggleSign() {
        if (this.isError) return;

        if (this.currentValue === '0' || this.currentValue === '0.') return;

        if (this.currentValue.startsWith('-')) {
            this.currentValue = this.currentValue.substring(1);
        } else {
            this.currentValue = '-' + this.currentValue;
        }

        this._updateDisplay();
    }

    /**
     * inputPercent - Handles % key
     * Behavior depends on context:
     *   - If there's a pending operation: calculates percentage of previousValue
     *   - If standalone: divides by 100
     */
    inputPercent() {
        if (this.isError) return;

        const currentNum = this._parseCurrentValue();

        if (this.previousValue !== null && this.pendingOperator) {
            /* Context-sensitive percent */
            /* e.g., 200 + 10% should give 200 + 20 = 220 */
            let percentValue;

            if (this.pendingOperator === '+' || this.pendingOperator === '-') {
                percentValue = this.previousValue * (currentNum / 100);
            } else {
                percentValue = currentNum / 100;
            }

            this.currentValue = this._formatResult(percentValue);
            this.isNewInput = true;
        } else {
            /* Simple percent: divide by 100 */
            const result = currentNum / 100;
            this.currentValue = this._formatResult(result);
            this.isNewInput = true;
        }

        this._updateDisplay();
    }

    /**
     * backspace - Removes last digit
     */
    backspace() {
        if (this.isError) {
            this.allClear();
            return;
        }

        if (this.isNewInput) return;

        if (this.currentValue.length <= 1 ||
            (this.currentValue.length === 2 && this.currentValue.startsWith('-'))) {
            this.currentValue = '0';
            this.isNewInput = true;
            this.hasDecimal = false;
        } else {
            const removed = this.currentValue.slice(-1);
            this.currentValue = this.currentValue.slice(0, -1);

            if (removed === '.') {
                this.hasDecimal = false;
            }
        }

        this._updateDisplay();
    }

    /* ============================================================
       SECTION: MEMORY METHODS
       ============================================================ */

    /**
     * memoryClear - Clears memory register
     */
    memoryClear() {
        this.memory = 0;
        this.hasMemory = false;

        if (this.onMemoryUpdate) {
            this.onMemoryUpdate(false);
        }
    }

    /**
     * memoryRecall - Recalls memory value to display
     */
    memoryRecall() {
        if (this.isError) {
            this.allClear();
        }

        this.currentValue = this._formatResult(this.memory);
        this.isNewInput = true;
        this._updateDisplay();
    }

    /**
     * memoryAdd - Adds current display value to memory
     */
    memoryAdd() {
        if (this.isError) return;

        const currentNum = this._parseCurrentValue();
        this.memory += currentNum;
        this.hasMemory = true;
        this.isNewInput = true;

        if (this.onMemoryUpdate) {
            this.onMemoryUpdate(true);
        }
        if (this.onMemoryFlash) {
            this.onMemoryFlash();
        }
    }

    /**
     * memorySubtract - Subtracts current display value from memory
     */
    memorySubtract() {
        if (this.isError) return;

        const currentNum = this._parseCurrentValue();
        this.memory -= currentNum;
        this.hasMemory = (this.memory !== 0);
        this.isNewInput = true;

        if (this.onMemoryUpdate) {
            this.onMemoryUpdate(this.hasMemory);
        }
        if (this.onMemoryFlash) {
            this.onMemoryFlash();
        }
    }

    /* ============================================================
       SECTION: INTERNAL CALCULATION METHODS
       ============================================================ */

    /**
     * _calculate - Performs arithmetic operation
     * @param {number} a - Left operand
     * @param {string} operator - Operator symbol
     * @param {number} b - Right operand
     * @returns {number|null} - Result or null on error
     */
    _calculate(a, operator, b) {
        let result;

        switch (operator) {
            case '+':
                result = this._preciseAdd(a, b);
                break;
            case '-':
                result = this._preciseSubtract(a, b);
                break;
            case '*':
                result = this._preciseMultiply(a, b);
                break;
            case '/':
                if (b === 0) {
                    /* Division by zero error */
                    return null;
                }
                result = this._preciseDivide(a, b);
                break;
            default:
                return null;
        }

        /* Check for overflow */
        if (!isFinite(result)) {
            return null;
        }

        /* Check for extreme values */
        if (Math.abs(result) > 9999999999999) {
            /* Would overflow display - still calculate but will be formatted in scientific-ish way */
            return result;
        }

        return result;
    }

    /**
     * Precise arithmetic methods to avoid floating point issues
     */
    _preciseAdd(a, b) {
        const factor = Math.pow(10, this.PRECISION);
        return (Math.round(a * factor) + Math.round(b * factor)) / factor;
    }

    _preciseSubtract(a, b) {
        const factor = Math.pow(10, this.PRECISION);
        return (Math.round(a * factor) - Math.round(b * factor)) / factor;
    }

    _preciseMultiply(a, b) {
        /* Use string-based precision detection */
        const aStr = a.toString();
        const bStr = b.toString();
        const aDecimals = aStr.includes('.') ? aStr.split('.')[1].length : 0;
        const bDecimals = bStr.includes('.') ? bStr.split('.')[1].length : 0;
        const totalDecimals = aDecimals + bDecimals;
        const factor = Math.pow(10, totalDecimals);
        const aInt = Math.round(a * Math.pow(10, aDecimals));
        const bInt = Math.round(b * Math.pow(10, bDecimals));
        return (aInt * bInt) / factor;
    }

    _preciseDivide(a, b) {
        const result = a / b;
        /* Round to avoid floating point artifacts */
        return parseFloat(result.toPrecision(this.PRECISION));
    }

    /* ============================================================
       SECTION: FORMATTING & DISPLAY METHODS
       ============================================================ */

    /**
     * _parseCurrentValue - Parses the display string to a number
     * @returns {number}
     */
    _parseCurrentValue() {
        const cleaned = this.currentValue.replace(/,/g, '');
        return parseFloat(cleaned) || 0;
    }

    /**
     * _formatResult - Formats a calculation result for display
     * @param {number} value - The numeric result
     * @returns {string} - Formatted display string
     */
    _formatResult(value) {
        if (value === 0) return '0';

        /* Handle very large numbers */
        if (Math.abs(value) >= 1e13) {
            /* Show in limited format */
            const exp = Math.floor(Math.log10(Math.abs(value)));
            const mantissa = value / Math.pow(10, exp);
            return mantissa.toFixed(6) + 'e' + exp;
        }

        /* Handle very small numbers */
        if (Math.abs(value) < 1e-10 && value !== 0) {
            return value.toExponential(6);
        }

        /* Standard formatting */
        let str = value.toString();

        /* Remove unnecessary trailing zeros after decimal but keep the format clean */
        if (str.includes('.')) {
            /* Limit decimal places */
            const parts = str.split('.');
            if (parts[1] && parts[1].length > this.DISPLAY_PRECISION) {
                str = parseFloat(value.toFixed(this.DISPLAY_PRECISION)).toString();
            }
        }

        /* Check if the string is too long for display */
        const digitCount = str.replace(/[^0-9]/g, '').length;
        if (digitCount > this.maxDigits) {
            /* Truncate decimal places or use exponential */
            if (str.includes('.')) {
                const intPart = str.split('.')[0];
                const intDigits = intPart.replace('-', '').length;
                const availableDecimals = this.maxDigits - intDigits;
                if (availableDecimals > 0) {
                    str = parseFloat(value.toFixed(availableDecimals)).toString();
                } else {
                    str = Math.round(value).toString();
                }
            }
        }

        return str;
    }

    /**
     * _formatForDisplay - Formats a number for operation text display
     * @param {number} value
     * @returns {string}
     */
    _formatForDisplay(value) {
        if (value === null || value === undefined) return '';
        return this._addThousandsSeparators(this._formatResult(value));
    }

    /**
     * _addThousandsSeparators - Adds comma separators to number string
     * @param {string} numStr
     * @returns {string}
     */
    _addThousandsSeparators(numStr) {
        if (!numStr) return '0';

        /* Don't format exponential notation */
        if (numStr.includes('e')) return numStr;

        const isNegative = numStr.startsWith('-');
        let str = isNegative ? numStr.substring(1) : numStr;

        let integerPart, decimalPart;
        if (str.includes('.')) {
            [integerPart, decimalPart] = str.split('.');
        } else {
            integerPart = str;
            decimalPart = null;
        }

        /* Add commas to integer part */
        let formatted = '';
        let count = 0;
        for (let i = integerPart.length - 1; i >= 0; i--) {
            if (count > 0 && count % 3 === 0) {
                formatted = ',' + formatted;
            }
            formatted = integerPart[i] + formatted;
            count++;
        }

        if (decimalPart !== null) {
            formatted += '.' + decimalPart;
        }

        /* Special case: if currentValue ends with '.', keep it */
        if (this.currentValue && this.currentValue.endsWith('.') && !formatted.includes('.')) {
            formatted += '.';
        }

        return (isNegative ? '-' : '') + formatted;
    }

    /**
     * _operatorSymbol - Converts operator to display symbol
     * @param {string} op
     * @returns {string}
     */
    _operatorSymbol(op) {
        switch (op) {
            case '+': return '+';
            case '-': return '−';
            case '*': return '×';
            case '/': return '÷';
            default: return op;
        }
    }

    /**
     * getDisplayValue - Returns the formatted display string
     * @returns {string}
     */
    getDisplayValue() {
        if (this.isError) return 'Error';
        return this._addThousandsSeparators(this.currentValue);
    }

    /**
     * getOperationText - Returns the operation display text
     * @returns {string}
     */
    getOperationText() {
        return this.operationText;
    }

    /* ============================================================
       SECTION: ERROR HANDLING
       ============================================================ */

    /**
     * _setError - Sets calculator to error state
     */
    _setError() {
        this.isError = true;
        this.currentValue = '0';
        this.previousValue = null;
        this.pendingOperator = null;
        this.isNewInput = true;
        this.lastOperator = null;
        this.lastOperand = null;
        this.justPressedEquals = false;
        this.operationText = '';

        this._notifyOperationUpdate();

        if (this.onError) {
            this.onError();
        }

        this._updateDisplay();
    }

    /* ============================================================
       SECTION: NOTIFICATION / CALLBACK METHODS
       ============================================================ */

    /**
     * _updateDisplay - Triggers display update callback
     */
    _updateDisplay() {
        if (this.onDisplayUpdate) {
            this.onDisplayUpdate(this.getDisplayValue());
        }
    }

    /**
     * _notifyOperationUpdate - Triggers operation text update callback
     */
    _notifyOperationUpdate() {
        if (this.onOperationUpdate) {
            this.onOperationUpdate(this.getOperationText());
        }
    }

    /* ============================================================
       SECTION: HISTORY MANAGEMENT
       ============================================================ */

    /**
     * _addHistory - Adds entry to calculation history
     * @param {string} operation - The operation text
     * @param {string} result - The result string
     */
    _addHistory(operation, result) {
        this.history.push({
            operation: operation,
            result: result,
            timestamp: Date.now()
        });

        if (this.history.length > this.historyMaxLength) {
            this.history.shift();
        }
    }

    /**
     * getHistory - Returns calculation history
     * @returns {Array}
     */
    getHistory() {
        return [...this.history];
    }

    /**
     * clearHistory - Clears calculation history
     */
    clearHistory() {
        this.history = [];
    }

    /* ============================================================
       SECTION: STATE INSPECTION (FOR DEBUG / UI)
       ============================================================ */

    /**
     * getState - Returns a snapshot of calculator state
     * @returns {Object}
     */
    getState() {
        return {
            currentValue: this.currentValue,
            previousValue: this.previousValue,
            pendingOperator: this.pendingOperator,
            isNewInput: this.isNewInput,
            hasDecimal: this.hasDecimal,
            memory: this.memory,
            hasMemory: this.hasMemory,
            isError: this.isError,
            lastOperator: this.lastOperator,
            lastOperand: this.lastOperand,
            justPressedEquals: this.justPressedEquals,
            operationText: this.operationText
        };
    }

    /**
     * getPendingOperator - Returns the pending operator for UI highlighting
     * @returns {string|null}
     */
    getPendingOperator() {
        if (this.isNewInput && this.pendingOperator) {
            return this.pendingOperator;
        }
        return null;
    }
}


/* ============================================================
   PART 2: AUDIO ENGINE - SOUND SYNTHESIS
   ============================================================ */

/**
 * AudioEngine
 * -----------
 * Synthesizes realistic button click sounds using Web Audio API.
 * Different sound profiles for different button types:
 *   - Number keys: soft click
 *   - Operator keys: slightly different tone
 *   - Clear: deeper click
 *   - Equals: satisfying thunk
 *   - Function keys: subtle click
 */
class AudioEngine {
    constructor() {
        this.audioContext = null;
        this.isMuted = false;
        this.isInitialized = false;
        this.masterGain = null;

        /* Precomputed noise buffer for realistic click texture */
        this.noiseBuffer = null;

        /* Sound profile configurations */
        this.profiles = {
            number: {
                clickFreq: 3800,
                clickDuration: 0.025,
                clickGain: 0.08,
                noiseGain: 0.03,
                noiseDuration: 0.015,
                releaseFreq: 2200,
                releaseDuration: 0.02,
                releaseGain: 0.04,
                releaseDelay: 0.04
            },
            operator: {
                clickFreq: 3200,
                clickDuration: 0.03,
                clickGain: 0.09,
                noiseGain: 0.035,
                noiseDuration: 0.018,
                releaseFreq: 1800,
                releaseDuration: 0.025,
                releaseGain: 0.05,
                releaseDelay: 0.045
            },
            clear: {
                clickFreq: 2600,
                clickDuration: 0.035,
                clickGain: 0.10,
                noiseGain: 0.04,
                noiseDuration: 0.02,
                releaseFreq: 1500,
                releaseDuration: 0.03,
                releaseGain: 0.05,
                releaseDelay: 0.05
            },
            equals: {
                clickFreq: 3000,
                clickDuration: 0.03,
                clickGain: 0.10,
                noiseGain: 0.04,
                noiseDuration: 0.02,
                releaseFreq: 1800,
                releaseDuration: 0.03,
                releaseGain: 0.05,
                releaseDelay: 0.05
            },
            function: {
                clickFreq: 4200,
                clickDuration: 0.02,
                clickGain: 0.06,
                noiseGain: 0.025,
                noiseDuration: 0.012,
                releaseFreq: 2500,
                releaseDuration: 0.018,
                releaseGain: 0.03,
                releaseDelay: 0.035
            }
        };
    }

    /**
     * init - Initializes the Web Audio API context (must be called from user gesture)
     */
    init() {
        if (this.isInitialized) return;

        try {
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.audioContext.createGain();
            this.masterGain.gain.value = 1.0;
            this.masterGain.connect(this.audioContext.destination);

            /* Generate noise buffer */
            this._generateNoiseBuffer();

            this.isInitialized = true;
        } catch (e) {
            console.warn('Web Audio API not available:', e);
        }
    }

    /**
     * _generateNoiseBuffer - Creates a buffer of white noise for click texture
     */
    _generateNoiseBuffer() {
        const bufferSize = this.audioContext.sampleRate * 0.1; // 100ms of noise
        this.noiseBuffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1);
        }
    }

    /**
     * playClick - Plays a button click sound
     * @param {string} type - Sound profile type ('number', 'operator', 'clear', 'equals', 'function')
     */
    playClick(type) {
        if (!this.isInitialized || this.isMuted) return;

        const profile = this.profiles[type] || this.profiles.number;
        const now = this.audioContext.currentTime;

        /* Slight random variation for realism */
        const freqVariation = 1 + (Math.random() - 0.5) * 0.08;
        const gainVariation = 1 + (Math.random() - 0.5) * 0.15;

        /* --- Click sound (initial contact) --- */
        this._playTone(
            profile.clickFreq * freqVariation,
            profile.clickDuration,
            profile.clickGain * gainVariation,
            now
        );

        /* --- Noise burst (plastic contact texture) --- */
        this._playNoiseBurst(
            profile.noiseDuration,
            profile.noiseGain * gainVariation,
            now
        );

        /* --- Release sound (button coming back up) --- */
        this._playTone(
            profile.releaseFreq * freqVariation,
            profile.releaseDuration,
            profile.releaseGain * gainVariation,
            now + profile.releaseDelay
        );

        /* --- Subtle body resonance --- */
        this._playResonance(
            200 + Math.random() * 100,
            0.04,
            0.015 * gainVariation,
            now + 0.005
        );
    }

    /**
     * _playTone - Plays a single tone
     */
    _playTone(frequency, duration, gain, startTime) {
        const oscillator = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();
        const filterNode = this.audioContext.createBiquadFilter();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, startTime);
        oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.5, startTime + duration);

        filterNode.type = 'highpass';
        filterNode.frequency.setValueAtTime(800, startTime);

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(gain, startTime + 0.001);
        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        oscillator.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(this.masterGain);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.01);
    }

    /**
     * _playNoiseBurst - Plays a short burst of filtered noise
     */
    _playNoiseBurst(duration, gain, startTime) {
        if (!this.noiseBuffer) return;

        const source = this.audioContext.createBufferSource();
        const gainNode = this.audioContext.createGain();
        const filterNode = this.audioContext.createBiquadFilter();

        source.buffer = this.noiseBuffer;

        filterNode.type = 'bandpass';
        filterNode.frequency.setValueAtTime(4000, startTime);
        filterNode.Q.setValueAtTime(2, startTime);

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(gain, startTime + 0.001);
        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        source.connect(filterNode);
        filterNode.connect(gainNode);
        gainNode.connect(this.masterGain);

        source.start(startTime);
        source.stop(startTime + duration + 0.01);
    }

    /**
     * _playResonance - Plays a low-frequency resonance for body vibration feel
     */
    _playResonance(frequency, duration, gain, startTime) {
        const oscillator = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, startTime);

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(gain, startTime + 0.002);
        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        oscillator.connect(gainNode);
        gainNode.connect(this.masterGain);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.01);
    }

    /**
     * toggleMute - Toggles audio mute state
     * @returns {boolean} - New muted state
     */
    toggleMute() {
        this.isMuted = !this.isMuted;
        return this.isMuted;
    }

    /**
     * setMuted - Sets mute state directly
     * @param {boolean} muted
     */
    setMuted(muted) {
        this.isMuted = muted;
    }

    /**
     * resume - Resumes audio context if suspended
     */
    resume() {
        if (this.audioContext && this.audioContext.state === 'suspended') {
            this.audioContext.resume();
        }
    }
}


/* ============================================================
   PART 3: 3D INTERACTION ENGINE - ROTATION & DRAG
   ============================================================ */

/**
 * InteractionEngine
 * -----------------
 * Handles 3D rotation via mouse/touch drag,
 * parallax effects, and interactive hover states.
 */
class InteractionEngine {
    constructor(calculatorWrapper) {
        this.wrapper = calculatorWrapper;
        this.isDragging = false;
        this.startX = 0;
        this.startY = 0;
        this.currentRotX = 18;
        this.currentRotY = -3;
        this.currentRotZ = 0.5;
        this.targetRotX = 18;
        this.targetRotY = -3;
        this.targetRotZ = 0.5;
        this.baseRotX = 18;
        this.baseRotY = -3;
        this.baseRotZ = 0.5;
        this.sensitivity = 0.3;
        this.smoothing = 0.08;
        this.isAnimating = false;
        this.parallaxEnabled = true;
        this.dragOverlay = document.getElementById('drag-overlay');

        /* Rotation limits */
        this.minRotX = -5;
        this.maxRotX = 45;
        this.minRotY = -30;
        this.maxRotY = 30;

        /* Velocity for momentum */
        this.velocityX = 0;
        this.velocityY = 0;
        this.friction = 0.92;

        this._bindEvents();
        this._startAnimationLoop();
    }

    /**
     * _bindEvents - Sets up all event listeners
     */
    _bindEvents() {
        /* Mouse events */
        this.wrapper.addEventListener('mousedown', (e) => this._onMouseDown(e));
        document.addEventListener('mousemove', (e) => this._onMouseMove(e));
        document.addEventListener('mouseup', (e) => this._onMouseUp(e));

        /* Touch events */
        this.wrapper.addEventListener('touchstart', (e) => this._onTouchStart(e), { passive: false });
        document.addEventListener('touchmove', (e) => this._onTouchMove(e), { passive: false });
        document.addEventListener('touchend', (e) => this._onTouchEnd(e));

        /* Parallax on mouse move */
        document.addEventListener('mousemove', (e) => this._onParallax(e));

        /* Double click to reset view */
        this.wrapper.addEventListener('dblclick', (e) => this._resetRotation(e));
    }

    /**
     * _onMouseDown - Starts drag rotation
     */
    _onMouseDown(e) {
        /* Don't start drag if clicking a button */
        if (e.target.closest('.calc-btn')) return;

        this.isDragging = true;
        this.startX = e.clientX;
        this.startY = e.clientY;
        this.velocityX = 0;
        this.velocityY = 0;
        this.wrapper.classList.add('dragging');
        if (this.dragOverlay) this.dragOverlay.classList.add('active');
        e.preventDefault();
    }

    /**
     * _onMouseMove - Updates rotation during drag
     */
    _onMouseMove(e) {
        if (!this.isDragging) return;

        const deltaX = e.clientX - this.startX;
        const deltaY = e.clientY - this.startY;

        this.velocityX = deltaX * this.sensitivity * 0.1;
        this.velocityY = -deltaY * this.sensitivity * 0.1;

        this.targetRotY = this.baseRotY + deltaX * this.sensitivity;
        this.targetRotX = this.baseRotX - deltaY * this.sensitivity;

        /* Clamp rotation */
        this.targetRotX = Math.max(this.minRotX, Math.min(this.maxRotX, this.targetRotX));
        this.targetRotY = Math.max(this.minRotY, Math.min(this.maxRotY, this.targetRotY));
    }

    /**
     * _onMouseUp - Ends drag rotation
     */
    _onMouseUp(e) {
        if (!this.isDragging) return;

        this.isDragging = false;
        this.baseRotX = this.currentRotX;
        this.baseRotY = this.currentRotY;
        this.wrapper.classList.remove('dragging');
        if (this.dragOverlay) this.dragOverlay.classList.remove('active');
    }

    /**
     * _onTouchStart - Touch drag start
     */
    _onTouchStart(e) {
        if (e.target.closest('.calc-btn')) return;
        if (e.touches.length !== 1) return;

        this.isDragging = true;
        this.startX = e.touches[0].clientX;
        this.startY = e.touches[0].clientY;
        this.velocityX = 0;
        this.velocityY = 0;
        this.wrapper.classList.add('dragging');
    }

    /**
     * _onTouchMove - Touch drag move
     */
    _onTouchMove(e) {
        if (!this.isDragging || e.touches.length !== 1) return;

        const deltaX = e.touches[0].clientX - this.startX;
        const deltaY = e.touches[0].clientY - this.startY;

        this.targetRotY = this.baseRotY + deltaX * this.sensitivity;
        this.targetRotX = this.baseRotX - deltaY * this.sensitivity;

        this.targetRotX = Math.max(this.minRotX, Math.min(this.maxRotX, this.targetRotX));
        this.targetRotY = Math.max(this.minRotY, Math.min(this.maxRotY, this.targetRotY));

        e.preventDefault();
    }

    /**
     * _onTouchEnd - Touch drag end
     */
    _onTouchEnd(e) {
        if (!this.isDragging) return;

        this.isDragging = false;
        this.baseRotX = this.currentRotX;
        this.baseRotY = this.currentRotY;
        this.wrapper.classList.remove('dragging');
    }

    /**
     * _onParallax - Subtle parallax rotation on mouse move (when not dragging)
     */
    _onParallax(e) {
        if (this.isDragging || !this.parallaxEnabled) return;

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const offsetX = (e.clientX - centerX) / centerX;
        const offsetY = (e.clientY - centerY) / centerY;

        this.targetRotY = this.baseRotY + offsetX * 2;
        this.targetRotX = this.baseRotX - offsetY * 1.5;
    }

    /**
     * _resetRotation - Resets to default view angle
     */
    _resetRotation(e) {
        if (e.target.closest('.calc-btn')) return;

        this.baseRotX = 18;
        this.baseRotY = -3;
        this.baseRotZ = 0.5;
        this.targetRotX = 18;
        this.targetRotY = -3;
        this.targetRotZ = 0.5;
    }

    /**
     * _startAnimationLoop - Smooth animation loop for rotation interpolation
     */
    _startAnimationLoop() {
        const animate = () => {
            /* Smooth interpolation */
            this.currentRotX += (this.targetRotX - this.currentRotX) * this.smoothing;
            this.currentRotY += (this.targetRotY - this.currentRotY) * this.smoothing;
            this.currentRotZ += (this.targetRotZ - this.currentRotZ) * this.smoothing;

            /* Apply momentum when not dragging */
            if (!this.isDragging) {
                this.velocityX *= this.friction;
                this.velocityY *= this.friction;
            }

            /* Apply transform */
            this.wrapper.style.transform =
                `rotateX(${this.currentRotX}deg) rotateY(${this.currentRotY}deg) rotateZ(${this.currentRotZ}deg)`;

            requestAnimationFrame(animate);
        };

        requestAnimationFrame(animate);
    }
}


/* ============================================================
   PART 4: UI CONTROLLER - DOM INTERACTION & EVENT HANDLING
   ============================================================ */

/**
 * UIController
 * ------------
 * Manages all DOM interactions, button events,
 * keyboard input, display updates, and visual feedback.
 */
class UIController {
    constructor() {
        /* --------------------------------------------------------
           Initialize engines
           -------------------------------------------------------- */
        this.calculator = new CalculatorEngine();
        this.audio = new AudioEngine();
        this.interaction = null; // Initialized after DOM ready

        /* --------------------------------------------------------
           DOM element references
           -------------------------------------------------------- */
        this.displayValue = document.getElementById('display-value');
        this.displayOperation = document.getElementById('display-operation');
        this.displayScreen = document.getElementById('display-screen');
        this.indM = document.getElementById('ind-m');
        this.indMinus = document.getElementById('ind-minus');
        this.indE = document.getElementById('ind-e');
        this.audioToggle = document.getElementById('audio-toggle');
        this.audioIcon = document.getElementById('audio-icon');

        /* All buttons */
        this.buttons = document.querySelectorAll('.calc-btn');
        this.operatorButtons = document.querySelectorAll('.btn-operator');

        /* --------------------------------------------------------
           State tracking
           -------------------------------------------------------- */
        this.audioInitialized = false;
        this.activeOperatorButton = null;
        this.pressedKeys = new Set();
        this.lastClickTime = 0;
        this.clickDebounceMs = 50;
        this.displayAnimationFrame = null;
        this.isDisplayTransitioning = false;
        this.currentDisplayText = '0';
        this.buttonAnimations = new Map();
        this.particlePool = [];
        this.maxParticles = 30;
        this.reflectionUpdateTimer = null;
        this.ambientLightAngle = 0;
        this.ambientLightSpeed = 0.0003;
        this.screenGlowIntensity = 0;
        this.targetScreenGlow = 0;
        this.heatMapData = new Map();
        this.fingerPrintOpacity = new Map();
        this.lastInteractionTime = Date.now();
        this.idleAnimationActive = false;
        this.dustParticles = [];
        this.microScratchSeed = Math.random() * 10000;

        /* --------------------------------------------------------
           Setup all bindings and callbacks
           -------------------------------------------------------- */
        this._setupCalculatorCallbacks();
        this._setupButtonEvents();
        this._setupKeyboardEvents();
        this._setupAudioToggle();
        this._setupAdvancedVisuals();
        this._setupIdleDetection();
        this._setupDisplayEffects();
        this._setupEnvironmentalLighting();
        this._setupFingerPrintSystem();
        this._setupScreenReflections();

        /* Initialize 3D interaction engine */
        const calcWrapper = document.getElementById('calculator-3d-wrapper');
        if (calcWrapper) {
            this.interaction = new InteractionEngine(calcWrapper);
        }

        /* Start the master render loop */
        this._startMasterRenderLoop();

        /* Start ambient animations */
        this._startAmbientAnimations();

        /* Log initialization */
        console.log('%c[3D Calculator] Initialized with ultra-high quality rendering',
            'color: #60a0c0; font-weight: bold; font-size: 12px;');
        console.log('%c[3D Calculator] Engine state:', 'color: #888;', this.calculator.getState());
    }

    /* ============================================================
       SECTION: CALCULATOR CALLBACK SETUP
       ============================================================ */

    /**
     * _setupCalculatorCallbacks - Connects calculator engine events to UI updates
     */
    _setupCalculatorCallbacks() {
        /* Display value changed */
        this.calculator.onDisplayUpdate = (value) => {
            this._animateDisplayUpdate(value);
        };

        /* Operation text changed */
        this.calculator.onOperationUpdate = (text) => {
            if (this.displayOperation) {
                this.displayOperation.textContent = text;
                /* Add subtle fade animation */
                this.displayOperation.style.opacity = '0';
                requestAnimationFrame(() => {
                    this.displayOperation.style.transition = 'opacity 0.15s ease';
                    this.displayOperation.style.opacity = '1';
                });
            }
        };

        /* Memory status changed */
        this.calculator.onMemoryUpdate = (hasMemory) => {
            if (this.indM) {
                if (hasMemory) {
                    this.indM.classList.add('active');
                } else {
                    this.indM.classList.remove('active');
                }
            }
        };

        /* Error occurred */
        this.calculator.onError = () => {
            this._showErrorEffect();
        };

        /* Clear pressed */
        this.calculator.onClear = () => {
            this._showClearEffect();
        };

        /* Memory flash */
        this.calculator.onMemoryFlash = () => {
            this._showMemoryFlashEffect();
        };
    }

    /* ============================================================
       SECTION: DISPLAY ANIMATION SYSTEM
       ============================================================ */

    /**
     * _animateDisplayUpdate - Smoothly animates display value changes
     * Creates a realistic LCD update effect with subtle character transitions
     * @param {string} newValue - The new display text
     */
    _animateDisplayUpdate(newValue) {
        if (!this.displayValue) return;

        const oldValue = this.currentDisplayText;
        this.currentDisplayText = newValue;

        if (oldValue === newValue) {
            this.displayValue.textContent = newValue;
            return;
        }

        /* Cancel any pending animation */
        if (this.displayAnimationFrame) {
            cancelAnimationFrame(this.displayAnimationFrame);
        }

        this.isDisplayTransitioning = true;

        /* Create LCD transition effect */
        this._createLCDTransition(oldValue, newValue);
    }

    /**
     * _createLCDTransition - Creates a realistic LCD digit transition
     * Simulates the way real LCD segments fade in/out
     * @param {string} oldVal - Previous display value
     * @param {string} newVal - New display value
     */
    _createLCDTransition(oldVal, newVal) {
        const transitionDuration = 60; // ms
        const startTime = performance.now();

        const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / transitionDuration, 1);

            /* Use easeOutQuad for natural LCD feel */
            const easedProgress = 1 - (1 - progress) * (1 - progress);

            if (progress < 0.4) {
                /* Phase 1: Fade out old value slightly */
                this.displayValue.style.opacity = 1 - (progress / 0.4) * 0.25;
            } else if (progress < 0.5) {
                /* Phase 2: Switch value at midpoint */
                this.displayValue.textContent = newVal;
                this.displayValue.style.opacity = 0.75;
            } else {
                /* Phase 3: Fade in new value */
                const fadeProgress = (progress - 0.5) / 0.5;
                this.displayValue.style.opacity = 0.75 + fadeProgress * 0.25;
            }

            if (progress < 1) {
                this.displayAnimationFrame = requestAnimationFrame(animate);
            } else {
                this.displayValue.textContent = newVal;
                this.displayValue.style.opacity = 1;
                this.isDisplayTransitioning = false;
                this.displayAnimationFrame = null;

                /* Trigger screen glow pulse on update */
                this._pulseScreenGlow();
            }
        };

        this.displayAnimationFrame = requestAnimationFrame(animate);
    }

    /**
     * _pulseScreenGlow - Creates a subtle glow pulse on the LCD screen
     * Simulates the slight brightness change when LCD segments update
     */
    _pulseScreenGlow() {
        this.targetScreenGlow = 0.08;

        setTimeout(() => {
            this.targetScreenGlow = 0;
        }, 150);
    }

    /**
     * _setupDisplayEffects - Initializes advanced display visual effects
     */
    _setupDisplayEffects() {
        /* Create the LCD afterglow overlay element */
        if (this.displayScreen) {
            const glowOverlay = document.createElement('div');
            glowOverlay.id = 'display-glow-overlay';
            glowOverlay.style.cssText = `
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                border-radius: 3px;
                background: rgba(180, 210, 140, 0);
                pointer-events: none;
                z-index: 7;
                transition: background 0.1s ease;
                mix-blend-mode: screen;
            `;
            this.displayScreen.appendChild(glowOverlay);
            this.displayGlowOverlay = glowOverlay;

            /* Create pixel response time simulation overlay */
            const pixelResponse = document.createElement('div');
            pixelResponse.id = 'pixel-response-overlay';
            pixelResponse.style.cssText = `
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                border-radius: 3px;
                pointer-events: none;
                z-index: 8;
                opacity: 0;
                mix-blend-mode: multiply;
            `;
            this.displayScreen.appendChild(pixelResponse);
            this.pixelResponseOverlay = pixelResponse;

            /* Create ambient light reflection on display */
            const ambientReflect = document.createElement('div');
            ambientReflect.id = 'display-ambient-reflect';
            ambientReflect.style.cssText = `
                position: absolute;
                top: -30%; left: -30%;
                width: 80%; height: 80%;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
                pointer-events: none;
                z-index: 9;
                transform: translate(0, 0);
                transition: transform 2s ease;
            `;
            this.displayScreen.appendChild(ambientReflect);
            this.displayAmbientReflect = ambientReflect;

            /* Create LCD color temperature variation */
            const tempVariation = document.createElement('div');
            tempVariation.id = 'display-temp-variation';
            tempVariation.style.cssText = `
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                border-radius: 3px;
                pointer-events: none;
                z-index: 1;
                background: linear-gradient(135deg,
                    rgba(180,200,160,0.03) 0%,
                    transparent 40%,
                    rgba(140,170,120,0.02) 60%,
                    transparent 100%);
            `;
            this.displayScreen.appendChild(tempVariation);
        }
    }

    /* ============================================================
       SECTION: BUTTON EVENT HANDLING
       ============================================================ */

    /**
     * _setupButtonEvents - Attaches click/touch handlers to all calculator buttons
     */
    _setupButtonEvents() {
        this.buttons.forEach(button => {
            /* Click handler */
            button.addEventListener('click', (e) => {
                e.preventDefault();
                this._handleButtonClick(button, e);
            });

            /* Touch feedback */
            button.addEventListener('touchstart', (e) => {
                this._handleButtonTouchStart(button, e);
            }, { passive: true });

            button.addEventListener('touchend', (e) => {
                this._handleButtonTouchEnd(button, e);
            }, { passive: true });

            /* Mouse enter/leave for hover effects */
            button.addEventListener('mouseenter', (e) => {
                this._handleButtonHoverEnter(button, e);
            });

            button.addEventListener('mouseleave', (e) => {
                this._handleButtonHoverLeave(button, e);
            });

            /* Mousedown visual press */
            button.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    this._visualPress(button);
                }
            });

            button.addEventListener('mouseup', (e) => {
                this._visualRelease(button);
            });

            /* Context menu prevention */
            button.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
        });
    }

    /**
     * _handleButtonClick - Main button click dispatcher
     * @param {HTMLElement} button - The clicked button element
     * @param {Event} e - The click event
     */
    _handleButtonClick(button, e) {
        /* Debounce rapid clicks */
        const now = performance.now();
        if (now - this.lastClickTime < this.clickDebounceMs) return;
        this.lastClickTime = now;

        /* Initialize audio on first interaction */
        if (!this.audioInitialized) {
            this.audio.init();
            this.audioInitialized = true;
        }
        this.audio.resume();

        /* Update last interaction time */
        this.lastInteractionTime = Date.now();
        this.idleAnimationActive = false;

        /* Create visual ripple effect */
        this._createRippleEffect(button, e);

        /* Create micro-particle burst */
        this._createButtonParticles(button);

        /* Add fingerprint mark */
        this._addFingerPrint(button);

        /* Determine button type and action */
        const dataKey = button.getAttribute('data-key');
        const dataAction = button.getAttribute('data-action');
        const dataOp = button.getAttribute('data-op');

        /* Play appropriate sound */
        let soundType = 'number';
        if (button.classList.contains('btn-operator')) soundType = 'operator';
        else if (button.classList.contains('btn-clear')) soundType = 'clear';
        else if (button.classList.contains('btn-equals')) soundType = 'equals';
        else if (button.classList.contains('btn-function')) soundType = 'function';
        this.audio.playClick(soundType);

        /* Route to calculator engine */
        if (dataKey === '00') {
            this.calculator.inputDoubleZero();
        } else if (dataKey && dataKey.length === 1 && '0123456789'.includes(dataKey)) {
            this.calculator.inputDigit(dataKey);
        } else if (dataAction) {
            this._executeAction(dataAction, dataOp);
        }

        /* Update operator button highlighting */
        this._updateOperatorHighlight();

        /* Create subtle screen response */
        this._createScreenResponse();
    }

    /**
     * _executeAction - Executes a named calculator action
     * @param {string} action - The action name
     * @param {string} op - Optional operator symbol
     */
    _executeAction(action, op) {
        switch (action) {
            case 'ac':
                this.calculator.allClear();
                break;
            case 'plusminus':
                this.calculator.toggleSign();
                break;
            case 'percent':
                this.calculator.inputPercent();
                break;
            case 'dot':
                this.calculator.inputDecimal();
                break;
            case 'equals':
                this.calculator.inputEquals();
                this._flashEqualsButton();
                break;
            case 'add':
            case 'subtract':
            case 'multiply':
            case 'divide':
                this.calculator.inputOperator(op);
                break;
            case 'mc':
                this.calculator.memoryClear();
                break;
            case 'mr':
                this.calculator.memoryRecall();
                break;
            case 'm+':
                this.calculator.memoryAdd();
                break;
            case 'm-':
                this.calculator.memorySubtract();
                break;
            default:
                console.warn('[Calculator] Unknown action:', action);
        }
    }

    /* ============================================================
       SECTION: VISUAL FEEDBACK EFFECTS
       ============================================================ */

    /**
     * _createRippleEffect - Creates a material-design-like ripple on button press
     * Enhanced with realistic light diffusion simulation
     * @param {HTMLElement} button - The target button
     * @param {Event} e - The triggering event
     */
    _createRippleEffect(button, e) {
        const rect = button.getBoundingClientRect();
        let x, y;

        if (e.clientX && e.clientY) {
            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
        } else {
            x = rect.width / 2;
            y = rect.height / 2;
        }

        const maxDimension = Math.max(rect.width, rect.height);
        const rippleSize = maxDimension * 2;

        /* Primary ripple */
        const ripple = document.createElement('span');
        ripple.className = 'btn-ripple';
        ripple.style.width = rippleSize + 'px';
        ripple.style.height = rippleSize + 'px';
        ripple.style.left = (x - rippleSize / 2) + 'px';
        ripple.style.top = (y - rippleSize / 2) + 'px';

        /* Color varies by button type */
        if (button.classList.contains('btn-operator')) {
            ripple.style.background = 'rgba(255,255,255,0.2)';
        } else if (button.classList.contains('btn-clear')) {
            ripple.style.background = 'rgba(255,255,255,0.25)';
        } else if (button.classList.contains('btn-equals')) {
            ripple.style.background = 'rgba(255,255,255,0.25)';
        } else {
            ripple.style.background = 'rgba(255,255,255,0.3)';
        }

        button.appendChild(ripple);

        /* Secondary smaller ripple for depth */
        const ripple2 = document.createElement('span');
        ripple2.className = 'btn-ripple';
        ripple2.style.width = (rippleSize * 0.6) + 'px';
        ripple2.style.height = (rippleSize * 0.6) + 'px';
        ripple2.style.left = (x - rippleSize * 0.3) + 'px';
        ripple2.style.top = (y - rippleSize * 0.3) + 'px';
        ripple2.style.background = 'rgba(255,255,255,0.15)';
        ripple2.style.animationDuration = '0.3s';
        ripple2.style.animationDelay = '0.03s';
        button.appendChild(ripple2);

        /* Clean up ripple elements */
        setTimeout(() => {
            if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
            if (ripple2.parentNode) ripple2.parentNode.removeChild(ripple2);
        }, 500);
    }

    /**
     * _createButtonParticles - Spawns micro-particles on button press
     * Simulates tiny dust/light particles being displaced by the button press
     * @param {HTMLElement} button - The pressed button
     */
    _createButtonParticles(button) {
        const rect = button.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const particleCount = 3 + Math.floor(Math.random() * 3);

        for (let i = 0; i < particleCount; i++) {
            this._spawnParticle(centerX, centerY, button);
        }
    }

    /**
     * _spawnParticle - Creates a single animated micro-particle
     * @param {number} x - X position
     * @param {number} y - Y position
     * @param {HTMLElement} sourceButton - The button that spawned this particle
     */
    _spawnParticle(x, y, sourceButton) {
        /* Limit total particles for performance */
        if (this.particlePool.length >= this.maxParticles) {
            const oldest = this.particlePool.shift();
            if (oldest && oldest.parentNode) {
                oldest.parentNode.removeChild(oldest);
            }
        }

        const particle = document.createElement('div');
        const size = 1 + Math.random() * 2;
        const angle = Math.random() * Math.PI * 2;
        const velocity = 15 + Math.random() * 25;
        const lifetime = 300 + Math.random() * 400;

        /* Determine particle color based on button type */
        let particleColor = 'rgba(200,196,188,';
        if (sourceButton.classList.contains('btn-operator')) {
            particleColor = 'rgba(180,180,180,';
        } else if (sourceButton.classList.contains('btn-clear')) {
            particleColor = 'rgba(220,160,140,';
        } else if (sourceButton.classList.contains('btn-equals')) {
            particleColor = 'rgba(160,190,220,';
        }

        particle.style.cssText = `
            position: fixed;
            width: ${size}px;
            height: ${size}px;
            background: ${particleColor}0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            left: ${x}px;
            top: ${y}px;
            box-shadow: 0 0 ${size}px ${particleColor}0.3);
        `;

        document.body.appendChild(particle);
        this.particlePool.push(particle);

        /* Animate the particle */
        const startTime = performance.now();
        const dx = Math.cos(angle) * velocity;
        const dy = Math.sin(angle) * velocity - 20; /* slight upward bias */

        const animateParticle = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = elapsed / lifetime;

            if (progress >= 1) {
                if (particle.parentNode) particle.parentNode.removeChild(particle);
                const index = this.particlePool.indexOf(particle);
                if (index > -1) this.particlePool.splice(index, 1);
                return;
            }

            const eased = 1 - Math.pow(1 - progress, 3);
            const gravity = 30 * progress * progress;
            const currentX = x + dx * eased;
            const currentY = y + dy * eased + gravity;
            const scale = 1 - eased * 0.5;
            const opacity = 0.6 * (1 - eased);

            particle.style.left = currentX + 'px';
            particle.style.top = currentY + 'px';
            particle.style.transform = `scale(${scale})`;
            particle.style.opacity = opacity;

            requestAnimationFrame(animateParticle);
        };

        requestAnimationFrame(animateParticle);
    }

    /**
     * _visualPress - Applies visual pressed state to button
     * @param {HTMLElement} button
     */
    _visualPress(button) {
        button.classList.add('pressed');

        /* Create a subtle shadow reduction effect */
        const baseShadow = button.querySelector('.btn-base-shadow');
        if (baseShadow) {
            baseShadow.style.transition = 'all 0.05s ease';
        }
    }

    /**
     * _visualRelease - Removes visual pressed state
     * @param {HTMLElement} button
     */
    _visualRelease(button) {
        button.classList.remove('pressed');
    }

    /**
     * _handleButtonTouchStart - Touch-specific press handling
     * @param {HTMLElement} button
     * @param {TouchEvent} e
     */
    _handleButtonTouchStart(button, e) {
        this._visualPress(button);

        /* Haptic feedback if available */
        if (navigator.vibrate) {
            navigator.vibrate(5);
        }
    }

    /**
     * _handleButtonTouchEnd - Touch-specific release handling
     * @param {HTMLElement} button
     * @param {TouchEvent} e
     */
    _handleButtonTouchEnd(button, e) {
        setTimeout(() => {
            this._visualRelease(button);
        }, 80);
    }

    /**
     * _handleButtonHoverEnter - Enhanced hover effect
     * Creates a subtle light reflection on the button surface
     * @param {HTMLElement} button
     * @param {MouseEvent} e
     */
    _handleButtonHoverEnter(button, e) {
        /* Create or update hover light element */
        let hoverLight = button.querySelector('.btn-hover-light');
        if (!hoverLight) {
            hoverLight = document.createElement('div');
            hoverLight.className = 'btn-hover-light';
            hoverLight.style.cssText = `
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                border-radius: 5px;
                pointer-events: none;
                z-index: 4;
                opacity: 0;
                transition: opacity 0.2s ease;
                background: radial-gradient(circle at 50% 30%,
                    rgba(255,255,255,0.12) 0%,
                    rgba(255,255,255,0.04) 40%,
                    transparent 70%);
            `;
            button.appendChild(hoverLight);
        }

        hoverLight.style.opacity = '1';

        /* Track mouse position within button for dynamic light */
        button._hoverMoveHandler = (me) => {
            const rect = button.getBoundingClientRect();
            const relX = ((me.clientX - rect.left) / rect.width) * 100;
            const relY = ((me.clientY - rect.top) / rect.height) * 100;

            hoverLight.style.background = `radial-gradient(circle at ${relX}% ${relY}%,
                rgba(255,255,255,0.15) 0%,
                rgba(255,255,255,0.05) 40%,
                transparent 70%)`;
        };

        button.addEventListener('mousemove', button._hoverMoveHandler);
    }

    /**
     * _handleButtonHoverLeave - Removes hover effects
     * @param {HTMLElement} button
     * @param {MouseEvent} e
     */
    _handleButtonHoverLeave(button, e) {
        const hoverLight = button.querySelector('.btn-hover-light');
        if (hoverLight) {
            hoverLight.style.opacity = '0';
        }

        if (button._hoverMoveHandler) {
            button.removeEventListener('mousemove', button._hoverMoveHandler);
            delete button._hoverMoveHandler;
        }
    }

    /**
     * _updateOperatorHighlight - Highlights the active operator button
     */
    _updateOperatorHighlight() {
        const pendingOp = this.calculator.getPendingOperator();

        /* Remove existing highlight */
        this.operatorButtons.forEach(btn => {
            btn.classList.remove('active-op');
        });

        if (pendingOp) {
            /* Find and highlight matching operator */
            this.operatorButtons.forEach(btn => {
                if (btn.getAttribute('data-op') === pendingOp) {
                    btn.classList.add('active-op');
                    this.activeOperatorButton = btn;
                }
            });
        } else {
            this.activeOperatorButton = null;
        }
    }

    /**
     * _flashEqualsButton - Triggers visual flash on equals button press
     */
    _flashEqualsButton() {
        const equalsBtn = document.querySelector('[data-action="equals"]');
        if (equalsBtn) {
            equalsBtn.classList.add('equals-flash');
            setTimeout(() => {
                equalsBtn.classList.remove('equals-flash');
            }, 200);
        }
    }

    /**
     * _showErrorEffect - Displays error visual feedback
     * Shakes the display and shows error indicator
     */
    _showErrorEffect() {
        if (this.displayValue) {
            this.displayValue.classList.add('error-state');
            this.displayValue.textContent = 'Error';

            setTimeout(() => {
                this.displayValue.classList.remove('error-state');
            }, 400);
        }

        /* Activate error indicator */
        if (this.indE) {
            this.indE.classList.add('active');
            setTimeout(() => {
                this.indE.classList.remove('active');
            }, 3000);
        }

        /* Wobble the calculator body */
        const wrapper = document.getElementById('calculator-3d-wrapper');
        if (wrapper) {
            wrapper.classList.add('calc-wobble');
            setTimeout(() => {
                wrapper.classList.remove('calc-wobble');
            }, 400);
        }

        /* Flash the display red briefly */
        if (this.displayScreen) {
            const errorFlash = document.createElement('div');
            errorFlash.style.cssText = `
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                border-radius: 3px;
                background: rgba(180, 60, 40, 0.1);
                pointer-events: none;
                z-index: 20;
                opacity: 1;
                transition: opacity 0.5s ease;
            `;
            this.displayScreen.appendChild(errorFlash);

            requestAnimationFrame(() => {
                errorFlash.style.opacity = '0';
            });

            setTimeout(() => {
                if (errorFlash.parentNode) errorFlash.parentNode.removeChild(errorFlash);
            }, 600);
        }
    }

    /**
     * _showClearEffect - Visual feedback when AC is pressed
     * Creates a "wipe" effect across the display
     */
    _showClearEffect() {
        if (!this.displayScreen) return;

        /* Create wipe overlay */
        const wipeOverlay = document.createElement('div');
        wipeOverlay.style.cssText = `
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg,
                rgba(180,210,140,0.2) 0%,
                rgba(180,210,140,0.05) 100%);
            pointer-events: none;
            z-index: 20;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        `;
        this.displayScreen.appendChild(wipeOverlay);

        requestAnimationFrame(() => {
            wipeOverlay.style.transform = 'translateX(100%)';
        });

        setTimeout(() => {
            if (wipeOverlay.parentNode) wipeOverlay.parentNode.removeChild(wipeOverlay);
        }, 500);

        /* Brief flash of display */
        if (this.displayGlowOverlay) {
            this.displayGlowOverlay.style.background = 'rgba(180, 210, 140, 0.12)';
