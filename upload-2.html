        grd.addColorStop(1, '#7777cc');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = 'rgba(200,200,255,0.5)';
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
    }

    _drawRainbowBlock(ctx, x, y) {
        const hue = ((this.animTime * 60 + x + y) % 360);
        const rgb = ColorUtils.hslToRgb(hue / 360, 0.8, 0.6);
        ctx.fillStyle = ColorUtils.rgbToHex(rgb.r, rgb.g, rgb.b);
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, 4);
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
    }

    _drawMusicBlock(ctx, x, y, tileData) {
        const grd = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
        grd.addColorStop(0, '#FF88CC');
        grd.addColorStop(1, '#CC5599');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♪', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
    }

    _drawCrackedGround(ctx, x, y, tileData) {
        this.base._drawGround(ctx, x, y, tileData);
        // ヒビ
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 4);
        ctx.lineTo(x + 14, y + 12);
        ctx.lineTo(x + 10, y + 20);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 20, y + 2);
        ctx.lineTo(x + 24, y + 14);
        ctx.lineTo(x + 28, y + 18);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 14, y + 12);
        ctx.lineTo(x + 22, y + 10);
        ctx.stroke();
    }

    _drawFakePipe(ctx, x, y) {
        // 見た目はパイプだが実は壁がない（すり抜ける）
        this.base._drawPipe(ctx, x, y, 'tl');
        ctx.fillStyle = 'rgba(255,0,0,0.05)';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    }

    _drawTrapDoor(ctx, x, y, tileData) {
        const open = tileData && tileData.open;
        if (open) {
            // 開いた状態
            ctx.fillStyle = '#333';
            ctx.fillRect(x + 2, y, TILE_SIZE - 4, 4);
            ctx.fillRect(x + 2, y + TILE_SIZE - 4, TILE_SIZE - 4, 4);
        } else {
            // 閉じた状態
            const grd = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
            grd.addColorStop(0, '#AA7744');
            grd.addColorStop(1, '#886633');
            ctx.fillStyle = grd;
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = '#665522';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            // ヒンジ
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(x + 4, y + TILE_SIZE / 2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + TILE_SIZE - 4, y + TILE_SIZE / 2, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawFlameJet(ctx, x, y, tileData) {
        // ベースノズル
        ctx.fillStyle = '#555';
        ctx.fillRect(x + 10, y + 20, 12, 12);
        ctx.fillStyle = '#777';
        ctx.fillRect(x + 8, y + 18, 16, 6);

        // 炎（周期的に噴出）
        const active = tileData && tileData.active;
        if (active) {
            const flicker = Math.sin(this.animTime * 15) * 3;
            for (let i = 0; i < 4; i++) {
                const fy = y + 16 - i * 6;
                const fw = 6 + (4 - i) * 2 + flicker;
                const alpha = 1 - i * 0.2;
                const colors = ['#FF2200', '#FF6600', '#FFAA00', '#FFEE00'];
                ctx.fillStyle = colors[i];
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.ellipse(x + TILE_SIZE / 2 + Math.sin(this.animTime * 10 + i) * 2, fy, fw, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            // グロー
            ctx.fillStyle = 'rgba(255,150,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(x + TILE_SIZE / 2, y, 20, 18, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawSawbladeRail(ctx, x, y, tileData) {
        // レール
        ctx.fillStyle = '#555';
        ctx.fillRect(x, y + TILE_SIZE / 2 - 2, TILE_SIZE, 4);

        // 丸鋸
        const sawX = tileData ? (tileData.sawX || x + 16) : x + 16;
        const sawY = y + TILE_SIZE / 2;
        const rot = this.animTime * 8;

        ctx.save();
        ctx.translate(sawX, sawY);
        ctx.rotate(rot);

        ctx.fillStyle = '#AAAAAA';
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();

        // 歯
        ctx.fillStyle = '#888';
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * 8, Math.sin(angle) * 8);
            ctx.lineTo(Math.cos(angle + 0.2) * 13, Math.sin(angle + 0.2) * 13);
            ctx.lineTo(Math.cos(angle + 0.4) * 8, Math.sin(angle + 0.4) * 8);
            ctx.closePath();
            ctx.fill();
        }

        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    _drawPressurePlate(ctx, x, y, tileData) {
        const pressed = tileData && tileData.pressed;
        const plateY = pressed ? y + TILE_SIZE - 4 : y + TILE_SIZE - 8;

        // ベース
        ctx.fillStyle = '#666';
        ctx.fillRect(x + 4, y + TILE_SIZE - 4, TILE_SIZE - 8, 4);

        // プレート
        const grd = ctx.createLinearGradient(x, plateY, x, plateY + 6);
        grd.addColorStop(0, pressed ? '#CC8800' : '#DDAA22');
        grd.addColorStop(1, pressed ? '#AA6600' : '#BB8811');
        ctx.fillStyle = grd;
        ctx.fillRect(x + 2, plateY, TILE_SIZE - 4, 6);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(x + 2, plateY, TILE_SIZE - 4, 2);
    }

    _drawGateBlock(ctx, x, y, tileData) {
        const open = tileData && tileData.open;
        if (open) {
            ctx.globalAlpha = 0.2;
        }
        const grd = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
        grd.addColorStop(0, '#AA4444');
        grd.addColorStop(1, '#882222');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        // 格子模様
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        for (let i = 0; i < TILE_SIZE; i += 8) {
            ctx.beginPath();
            ctx.moveTo(x + i, y);
            ctx.lineTo(x + i, y + TILE_SIZE);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y + i);
            ctx.lineTo(x + TILE_SIZE, y + i);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    _drawSlimeBlock(ctx, x, y) {
        const wobble = Math.sin(this.animTime * 3 + x * 0.1) * 2;
        const grd = ctx.createRadialGradient(
            x + TILE_SIZE / 2, y + TILE_SIZE / 2 + wobble, 4,
            x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 2 + 2
        );
        grd.addColorStop(0, '#88FF88');
        grd.addColorStop(0.6, '#44CC44');
        grd.addColorStop(1, '#228822');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(
            x + TILE_SIZE / 2, y + TILE_SIZE / 2 + wobble,
            TILE_SIZE / 2, TILE_SIZE / 2 - 1 + wobble * 0.3, 0, 0, Math.PI * 2
        );
        ctx.fill();

        // ハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.ellipse(x + 12, y + 10 + wobble * 0.5, 5, 4, -0.3, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawGravityFlip(ctx, x, y) {
        ctx.fillStyle = 'rgba(100,0,200,0.15)';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        // 矢印アイコン
        ctx.fillStyle = 'rgba(150,100,255,0.5)';
        ctx.beginPath();
        ctx.moveTo(x + 8, y + 20);
        ctx.lineTo(x + 16, y + 6);
        ctx.lineTo(x + 24, y + 20);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + 8, y + 12);
        ctx.lineTo(x + 16, y + 26);
        ctx.lineTo(x + 24, y + 12);
        ctx.closePath();
        ctx.fill();
    }

    _drawAntiGravity(ctx, x, y) {
        const pulse = Math.sin(this.animTime * 4) * 0.15 + 0.15;
        ctx.fillStyle = `rgba(180,100,255,${pulse})`;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        // 浮遊パーティクル
        for (let i = 0; i < 3; i++) {
            const py = y + TILE_SIZE - ((this.animTime * 20 + i * 10) % TILE_SIZE);
            ctx.fillStyle = `rgba(200,150,255,${0.4 - i * 0.1})`;
            ctx.beginPath();
            ctx.arc(x + 8 + i * 8, py, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawBounceWall(ctx, x, y) {
        const grd = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
        grd.addColorStop(0, '#FF6644');
        grd.addColorStop(0.5, '#FF4422');
        grd.addColorStop(1, '#CC2200');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        // バネ模様
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(x + 4, y + 4 + i * 8);
            ctx.lineTo(x + TILE_SIZE - 4, y + 8 + i * 8);
            ctx.stroke();
        }
    }

    _drawTeleporter(ctx, x, y, color, tileData) {
        const pulse = Math.sin(this.animTime * 4) * 0.2 + 0.5;
        const c = ColorUtils.hexToRgb(color);
        ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${pulse})`;
        ctx.beginPath();
        ctx.ellipse(x + TILE_SIZE / 2, y + TILE_SIZE / 2, 14, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        // 渦巻き
        ctx.strokeStyle = `rgba(255,255,255,${pulse * 0.5})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const rot = this.animTime * 3;
        for (let i = 0; i < 20; i++) {
            const t = i / 20;
            const angle = t * Math.PI * 4 + rot;
            const r = t * 12;
            const px = x + TILE_SIZE / 2 + Math.cos(angle) * r;
            const py = y + TILE_SIZE / 2 + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.stroke();
    }

    _drawShrinkBlock(ctx, x, y, tileData) {
        const size = tileData && tileData.currentSize !== undefined ? tileData.currentSize : TILE_SIZE;
        const offset = (TILE_SIZE - size) / 2;
        const grd = ctx.createLinearGradient(x + offset, y + offset, x + offset + size, y + offset + size);
        grd.addColorStop(0, '#8888DD');
        grd.addColorStop(1, '#5555AA');
        ctx.fillStyle = grd;
        ctx.fillRect(x + offset, y + offset, size, size);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('▼', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
    }

    _drawGrowBlock(ctx, x, y, tileData) {
        const grd = ctx.createLinearGradient(x, y, x + TILE_SIZE, y + TILE_SIZE);
        grd.addColorStop(0, '#DD8888');
        grd.addColorStop(1, '#AA5555');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('▲', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
    }

    _drawTextSign(ctx, x, y, tileData) {
        ctx.fillStyle = '#DDCC99';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 8);
        ctx.fillStyle = '#AA8855';
        ctx.fillRect(x + 12, y + TILE_SIZE - 8, 8, 8);
        ctx.strokeStyle = '#886633';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 8);
        // テキスト
        if (tileData && tileData.text) {
            ctx.fillStyle = '#333';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(tileData.text, x + TILE_SIZE / 2, y + TILE_SIZE / 2 - 2);
        }
    }

    _drawTorch(ctx, x, y) {
        // 棒
        ctx.fillStyle = '#886644';
        ctx.fillRect(x + 13, y + 12, 6, 20);
        // 台座
        ctx.fillStyle = '#AA8855';
        ctx.fillRect(x + 10, y + 28, 12, 4);

        // 炎
        const flicker = Math.sin(this.animTime * 10) * 3;
        const flicker2 = Math.cos(this.animTime * 13) * 2;
        ctx.fillStyle = '#FFCC00';
        ctx.beginPath();
        ctx.ellipse(x + 16 + flicker2, y + 8, 6 + flicker, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FF8800';
        ctx.beginPath();
        ctx.ellipse(x + 16 + flicker2 * 0.5, y + 6, 4, 6 + flicker * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFEE88';
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 8, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // グロー
        const glowAlpha = Math.sin(this.animTime * 6) * 0.05 + 0.1;
        ctx.fillStyle = `rgba(255,200,50,${glowAlpha})`;
        ctx.beginPath();
        ctx.arc(x + 16, y + 10, 24, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawRotatingPlatform(ctx, x, y, tileData) {
        const angle = tileData ? (tileData.angle || 0) : this.animTime;
        ctx.save();
        ctx.translate(x + TILE_SIZE / 2, y + TILE_SIZE / 2);
        ctx.rotate(angle);
        ctx.fillStyle = '#BB9955';
        ctx.fillRect(-TILE_SIZE * 1.5, -4, TILE_SIZE * 3, 8);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-TILE_SIZE * 1.5, -4, TILE_SIZE * 3, 3);
        // 中心軸
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    _drawPendulumPlatform(ctx, x, y, tileData) {
        const angle = Math.sin(this.animTime * 2) * 0.8;
        const pivotX = x + TILE_SIZE / 2;
        const pivotY = y;
        const length = 60;

        // 紐
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(pivotX, pivotY);
        ctx.lineTo(pivotX + Math.sin(angle) * length, pivotY + Math.cos(angle) * length);
        ctx.stroke();

        // 支点
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.arc(pivotX, pivotY, 4, 0, Math.PI * 2);
        ctx.fill();

        // 足場
        const platX = pivotX + Math.sin(angle) * length;
        const platY = pivotY + Math.cos(angle) * length;
        ctx.fillStyle = '#BB8844';
        ctx.fillRect(platX - 24, platY - 4, 48, 8);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(platX - 24, platY - 4, 48, 3);
    }

    _drawMirrorBlock(ctx, x, y) {
        ctx.fillStyle = '#CCDDEE';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        // 反射エフェクト
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + TILE_SIZE, y);
        ctx.lineTo(x, y + TILE_SIZE);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(150,200,255,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
    }

    _drawMagnetBlock(ctx, x, y, tileData) {
        // 赤青の磁石
        ctx.fillStyle = '#CC2222';
        ctx.fillRect(x, y, TILE_SIZE / 2, TILE_SIZE);
        ctx.fillStyle = '#2222CC';
        ctx.fillRect(x + TILE_SIZE / 2, y, TILE_SIZE / 2, TILE_SIZE);
        ctx.fillStyle = '#888';
        ctx.fillRect(x + TILE_SIZE / 2 - 3, y + 4, 6, TILE_SIZE - 8);
        // N/S
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('N', x + 8, y + TILE_SIZE / 2);
        ctx.fillText('S', x + 24, y + TILE_SIZE / 2);
        // 引力線
        const pulse = Math.sin(this.animTime * 3) * 3;
        ctx.strokeStyle = 'rgba(255,255,0,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, 20 + pulse, 0, Math.PI * 2);
        ctx.stroke();
    }

    _drawKeyBlock(ctx, x, y, tileData) {
        const unlocked = tileData && tileData.unlocked;
        if (unlocked) {
            ctx.globalAlpha = 0.3;
        }
        ctx.fillStyle = '#DDAA22';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔒', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
        ctx.globalAlpha = 1;
    }

    _drawFakeEnemy(ctx, x, y) {
        // 見た目はクリボーだが実は動かない装飾
        const cx = x + TILE_SIZE / 2;
        const cy = y + TILE_SIZE / 2;
        ctx.fillStyle = '#AA6622';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 12, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(cx - 3, cy - 2, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 5, cy - 2, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}


// ============================================================
// SECTION 30: 拡張トラップマネージャ
// ============================================================

class ExtendedTrapManager {
    constructor(baseTrapManager) {
        this.base = baseTrapManager;
        this.activeExplosions = [];
        this.activeFlameJets = [];
        this.activeSawblades = [];
        this.pressurePlateLinks = [];
        this.trapDoorLinks = [];
    }

    update(dt, level, player, game) {
        this._updateFakeCoins(dt, level, player, game);
        this._updateQuicksand(dt, level, player, game);
        this._updateWindZones(dt, level, player, game);
        this._updatePoisonWater(dt, level, player, game);
        this._updateExplosiveBricks(dt, level, player, game);
        this._updateGhostBlocks(dt, level, player, game);
        this._updateFlameJets(dt, level, player, game);
        this._updateSawblades(dt, level, player, game);
        this._updatePressurePlates(dt, level, player, game);
        this._updateTrapDoors(dt, level, player, game);
        this._updateGravityFlip(dt, level, player, game);
        this._updateAntiGravity(dt, level, player, game);
        this._updateBounceWalls(dt, level, player, game);
        this._updateTeleporters(dt, level, player, game);
        this._updateDarkZones(dt, level, player, game);
        this._updateCrackedGround(dt, level, player, game);
        this._updateSlimeBlocks(dt, level, player, game);
        this._updateMusicBlocks(dt, level, player, game);
        this._updateMagnetBlocks(dt, level, player, game);
        this._updateFakeGoals(dt, level, player, game);
    }

    _updateFakeCoins(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (level.getTile(pcol + dc, prow + dr) === TILE_EX.FAKE_COIN) {
                    const tx = (pcol + dc) * TILE_SIZE;
                    const ty = (prow + dr) * TILE_SIZE;
                    if (MathUtils.rectOverlap(player.x, player.y, player.width, player.height, tx, ty, TILE_SIZE, TILE_SIZE)) {
                        level.setTile(pcol + dc, prow + dr, TILE.EMPTY);
                        player.die('fake_coin', game);
                        if (game) {
                            game.audio.play('trap');
                            game.ui.showFloatingText('偽コイン！', tx, ty - 20, '#ff0000');
                            game.particles.emitExplosion(tx + 16, ty + 16, '#88ff00', 15);
                        }
                    }
                }
            }
        }
    }

    _updateQuicksand(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height) / TILE_SIZE);
        if (level.getTile(pcol, prow) === TILE_EX.QUICKSAND ||
            level.getTile(pcol, prow - 1) === TILE_EX.QUICKSAND) {
            player.vy += 0.3;
            player.vx *= 0.7;
            player.speedMultiplier = 0.4;
            if (player.y + player.height > prow * TILE_SIZE + TILE_SIZE - 4) {
                player.die('quicksand', game);
                if (game) game.ui.showFloatingText('流砂に沈んだ！', player.x, player.y - 20, '#D4A843');
            }
        } else {
            if (player.speedMultiplier < 1) player.speedMultiplier = Math.min(1, player.speedMultiplier + dt * 2);
        }
    }

    _updateWindZones(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        const windStrength = 3.0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                const t = level.getTile(pcol + dc, prow + dr);
                if (t === TILE_EX.WIND_ZONE_LEFT) player.vx -= windStrength * dt;
                if (t === TILE_EX.WIND_ZONE_RIGHT) player.vx += windStrength * dt;
                if (t === TILE_EX.WIND_ZONE_UP) player.vy -= windStrength * 1.5 * dt;
            }
        }
    }

    _updatePoisonWater(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (level.getTile(pcol + dc, prow + dr) === TILE_EX.POISON_WATER) {
                    const tx = (pcol + dc) * TILE_SIZE;
                    const ty = (prow + dr) * TILE_SIZE;
                    if (MathUtils.rectOverlap(player.x, player.y, player.width, player.height, tx, ty, TILE_SIZE, TILE_SIZE)) {
                        player.die('poison', game);
                        if (game) {
                            game.ui.showFloatingText('毒水！', player.x, player.y - 20, '#66CC44');
                            game.particles.emitWaterSplash(player.x + player.width / 2, player.y + player.height);
                        }
                    }
                }
            }
        }
    }

    _updateExplosiveBricks(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.explosive) continue;
            if (data.triggered) {
                data.fuseTimer = (data.fuseTimer || 0) + dt;
                if (data.fuseTimer >= (data.fuseDelay || 1.0)) {
                    const parts = key.split(',');
                    const col = parseInt(parts[0]);
                    const row = parseInt(parts[1]);
                    // 爆発！
                    level.setTile(col, row, TILE.EMPTY);
                    delete level.tileData[key];
                    // 周囲のブロックも破壊
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nt = level.getTile(col + dc, row + dr);
                            if (nt === TILE.BRICK || nt === TILE_EX.EXPLOSIVE_BRICK ||
                                nt === TILE.CRUMBLE_BRICK) {
                                level.setTile(col + dc, row + dr, TILE.EMPTY);
                                if (game) {
                                    game.particles.emitBlockBreak(
                                        (col + dc) * TILE_SIZE + 16,
                                        (row + dr) * TILE_SIZE + 16,
                                        '#CC8844'
                                    );
                                }
                            }
                        }
                    }
                    if (game) {
                        game.particles.emitExplosion(col * TILE_SIZE + 16, row * TILE_SIZE + 16, '#ff4400', 30);
                        game.audio.play('explosion', 0.8);
                        game.camera.shake(10, 0.4);
                    }
                    // 爆風ダメージ
                    const bx = col * TILE_SIZE + 16;
                    const by = row * TILE_SIZE + 16;
                    if (player.alive && MathUtils.distance(player.x + player.width / 2, player.y + player.height / 2, bx, by) < TILE_SIZE * 2.5) {
                        player.die('explosion', game);
                    }
                }
            }
        }
    }

    _updateGhostBlocks(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.ghost) continue;
            const cycle = (Date.now() * 0.001 * 0.5) % 2;
            data.solid = cycle < 1;
        }
    }

    _updateFlameJets(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.flameJet) continue;
            data.flameTimer = (data.flameTimer || 0) + dt;
            const cycle = data.flameTimer % (data.onTime + data.offTime);
            data.active = cycle < data.onTime;

            if (data.active && player.alive) {
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);
                const flameX = col * TILE_SIZE;
                const flameY = row * TILE_SIZE - TILE_SIZE;
                if (MathUtils.rectOverlap(player.x, player.y, player.width, player.height, flameX + 4, flameY, TILE_SIZE - 8, TILE_SIZE)) {
                    player.die('flame', game);
                    if (game) game.ui.showFloatingText('焼けた！', player.x, player.y - 20, '#ff4400');
                }
            }
        }
    }

    _updateSawblades(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.sawblade) continue;
            const parts = key.split(',');
            const col = parseInt(parts[0]);
            const row = parseInt(parts[1]);
            // 丸鋸移動
            data.sawProgress = (data.sawProgress || 0) + dt * (data.sawSpeed || 1);
            if (data.sawProgress > 1) data.sawProgress -= 2;
            const prog = Math.abs(data.sawProgress);
            data.sawX = col * TILE_SIZE + prog * (data.sawRange || TILE_SIZE);

            // プレイヤー衝突
            if (player.alive && !player.invincible) {
                if (MathUtils.distance(player.x + player.width / 2, player.y + player.height / 2,
                    data.sawX, row * TILE_SIZE + TILE_SIZE / 2) < 18) {
                    player.die('sawblade', game);
                    if (game) game.ui.showFloatingText('真っ二つ！', player.x, player.y - 20, '#AAAAAA');
                }
            }
        }
    }

    _updatePressurePlates(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.pressurePlate) continue;
            const parts = key.split(',');
            const col = parseInt(parts[0]);
            const row = parseInt(parts[1]);
            const platX = col * TILE_SIZE;
            const platY = row * TILE_SIZE;

            const wasPressed = data.pressed;
            data.pressed = player.alive && player.onGround &&
                player.x + player.width > platX + 2 && player.x < platX + TILE_SIZE - 2 &&
                Math.abs(player.y + player.height - platY - TILE_SIZE + 8) < 6;

            if (data.pressed && !wasPressed && data.linkedGate) {
                // リンクされたゲートを開閉
                const gateData = level.getTileData(data.linkedGate[0], data.linkedGate[1]);
                if (gateData) {
                    gateData.open = !gateData.open;
                    if (game) game.audio.play('block', 0.4);
                }
            }
        }
    }

    _updateTrapDoors(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.trapDoor) continue;

            if (!data.triggered && player.alive) {
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);
                const tdX = col * TILE_SIZE;
                const tdY = row * TILE_SIZE;

                if (player.onGround &&
                    player.x + player.width > tdX && player.x < tdX + TILE_SIZE &&
                    Math.abs(player.y + player.height - tdY) < 6) {

                    data.triggered = true;
                    data.openTimer = 0;
                }
            }

            if (data.triggered) {
                data.openTimer = (data.openTimer || 0) + dt;
                if (data.openTimer >= (data.openDelay || 0.3)) {
                    data.open = true;
                    const parts = key.split(',');
                    const col = parseInt(parts[0]);
                    const row = parseInt(parts[1]);
                    // ソリッド解除
                    level.setTile(col, row, TILE.EMPTY);
                    if (game) {
                        game.audio.play('trap', 0.4);
                        game.particles.emitDustPuff(col * TILE_SIZE + 16, row * TILE_SIZE + 16);
                    }
                    delete level.tileData[key];
                }
            }
        }
    }

    _updateGravityFlip(dt, level, player, game) {
        // 重力反転ゾーン
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        if (level.getTile(pcol, prow) === TILE_EX.GRAVITY_FLIP) {
            if (!player._gravityFlipped) {
                player._gravityFlipped = true;
                player.vy = -player.vy - 5;
                if (game) {
                    game.audio.play('spring', 0.6);
                    game.camera.shake(3, 0.15);
                    game.particles.emitDustPuff(player.x + player.width / 2, player.y + player.height / 2);
                }
            }
        }
    }

    _updateAntiGravity(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (level.getTile(pcol + dc, prow + dr) === TILE_EX.ANTI_GRAVITY) {
                    player.vy -= GRAVITY * 1.5;
                }
            }
        }
    }

    _updateBounceWalls(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (level.getTile(pcol + dc, prow + dr) === TILE_EX.BOUNCE_WALL) {
                    const wallX = (pcol + dc) * TILE_SIZE;
                    const wallY = (prow + dr) * TILE_SIZE;
                    if (MathUtils.rectOverlap(player.x, player.y, player.width, player.height, wallX, wallY, TILE_SIZE, TILE_SIZE)) {
                        if (Math.abs(player.vx) > 1) {
                            player.vx = -player.vx * 1.5;
                            if (game) {
                                game.audio.play('spring', 0.4, 1.3);
                                game.particles.emitDustPuff(wallX + 16, wallY + 16);
                            }
                        }
                        if (player.vy > 2) {
                            player.vy = -player.vy * 0.8;
                        }
                    }
                }
            }
        }
    }

    _updateTeleporters(dt, level, player, game) {
        if (!player.alive || player._teleportCooldown > 0) {
            if (player._teleportCooldown > 0) player._teleportCooldown -= dt;
            return;
        }
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        if (level.getTile(pcol, prow) === TILE_EX.TELEPORT_IN) {
            const data = level.getTileData(pcol, prow);
            if (data && data.targetCol !== undefined && data.targetRow !== undefined) {
                player.x = data.targetCol * TILE_SIZE;
                player.y = data.targetRow * TILE_SIZE;
                player._teleportCooldown = 1.0;
                if (game) {
                    game.audio.play('pipe', 0.6);
                    game.camera.flash('#4488ff', 0.3);
                    game.particles.emitExplosion(player.x + player.width / 2, player.y + player.height / 2, '#4488ff', 15);
                }
            }
        }
    }

    _updateDarkZones(dt, level, player, game) {
        // 暗闇ゾーンはdraw時に処理
    }

    _updateCrackedGround(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.cracked) continue;

            if (data.stepCount === undefined) data.stepCount = 0;

            const parts = key.split(',');
            const col = parseInt(parts[0]);
            const row = parseInt(parts[1]);
            const tileX = col * TILE_SIZE;
            const tileY = row * TILE_SIZE;

            // プレイヤーが乗っているか
            if (player.alive && player.onGround &&
                player.x + player.width > tileX && player.x < tileX + TILE_SIZE &&
                Math.abs(player.y + player.height - tileY) < 4) {

                if (!data._playerOn) {
                    data._playerOn = true;
                    data.stepCount++;
                    if (data.stepCount >= (data.breakAfter || 3)) {
                        level.setTile(col, row, TILE.EMPTY);
                        delete level.tileData[key];
                        if (game) {
                            game.particles.emitBlockBreak(tileX + 16, tileY + 16, '#8B6914');
                            game.audio.play('break_block', 0.4);
                        }
                    } else if (game) {
                        game.audio.play('block', 0.2);
                        game.camera.shake(1, 0.05);
                    }
                }
            } else {
                data._playerOn = false;
            }
        }
    }

    _updateSlimeBlocks(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height) / TILE_SIZE);
        if (level.getTile(pcol, prow) === TILE_EX.SLIME_BLOCK) {
            player.vy *= 0.6;
            player.vx *= 0.85;
            player.jumpSquash = 0.9;
        }
    }

    _updateMusicBlocks(dt, level, player, game) {
        if (!player.alive) return;
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.musicBlock) continue;
            const parts = key.split(',');
            const col = parseInt(parts[0]);
            const row = parseInt(parts[1]);
            const bx = col * TILE_SIZE;
            const by = row * TILE_SIZE;

            // 下から叩いた場合に音を鳴らす
            if (data.justHit) {
                data.justHit = false;
                const pitch = data.pitch || 1.0;
                if (game) {
                    game.audio.play('coin', 0.4, pitch);
                    game.particles.emitCoinSparkle(bx + 16, by);
                }
            }
        }
    }

    _updateMagnetBlocks(dt, level, player, game) {
        if (!player.alive) return;
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.magnet) continue;
            const parts = key.split(',');
            const col = parseInt(parts[0]);
            const row = parseInt(parts[1]);
            const mx = col * TILE_SIZE + TILE_SIZE / 2;
            const my = row * TILE_SIZE + TILE_SIZE / 2;
            const dist = MathUtils.distance(player.x + player.width / 2, player.y + player.height / 2, mx, my);

            if (dist < (data.magnetRange || 100)) {
                const force = (data.magnetStrength || 2) / Math.max(dist * 0.05, 1);
                const angle = MathUtils.angle(player.x + player.width / 2, player.y + player.height / 2, mx, my);
                const attract = data.magnetType === 'repel' ? -1 : 1;
                player.vx += Math.cos(angle) * force * attract * dt * 60;
                player.vy += Math.sin(angle) * force * attract * dt * 60;
            }
        }
    }

    _updateFakeGoals(dt, level, player, game) {
        if (!player.alive) return;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (level.getTile(pcol + dc, prow + dr) === TILE_EX.FAKE_GOAL) {
                    const gx = (pcol + dc) * TILE_SIZE;
                    const gy = (prow + dr) * TILE_SIZE;
                    if (MathUtils.rectOverlap(player.x, player.y, player.width, player.height, gx, gy, TILE_SIZE, TILE_SIZE)) {
                        level.setTile(pcol + dc, prow + dr, TILE.EMPTY);
                        player.die('fake_goal', game);
                        if (game) {
                            game.audio.play('trap');
                            game.ui.showFloatingText('偽ゴール！(´;ω;`)', gx, gy - 30, '#ff0000', 22);
                            game.camera.shake(8, 0.3);
                            game.particles.emitExplosion(gx + 16, gy + 16, '#cc2222', 20);
                        }
                    }
                }
            }
        }
    }

    drawOverlays(ctx, camera, level, player) {
        const drawX = camera.getDrawX();
        const drawY = camera.getDrawY();

        // ダークゾーンオーバーレイ
        this._drawDarkZoneOverlay(ctx, camera, level, player);
    }

    _drawDarkZoneOverlay(ctx, camera, level, player) {
        // ダークゾーンの領域を検出
        let hasDarkZone = false;
        const pcol = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const prow = Math.floor((player.y + player.height / 2) / TILE_SIZE);

        for (let dr = -3; dr <= 3; dr++) {
            for (let dc = -3; dc <= 3; dc++) {
                if (level.getTile(pcol + dc, prow + dr) === TILE_EX.DARK_ZONE) {
                    hasDarkZone = true;
                    break;
                }
            }
            if (hasDarkZone) break;
        }

        if (hasDarkZone) {
            // 画面を暗くし、プレイヤー周囲だけ見える
            ctx.save();
            const px = player.x + player.width / 2 + camera.getDrawX();
            const py = player.y + player.height / 2 + camera.getDrawY();
            const lightRadius = 80;

            ctx.fillStyle = 'rgba(0,0,0,0.88)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // プレイヤー周囲をくり抜き
            ctx.globalCompositeOperation = 'destination-out';
            const grd = ctx.createRadialGradient(px, py, 0, px, py, lightRadius);
            grd.addColorStop(0, 'rgba(0,0,0,1)');
            grd.addColorStop(0.7, 'rgba(0,0,0,0.8)');
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(px, py, lightRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();
        }
    }
}


// ============================================================
// SECTION 31: 拡張敵システム
// ============================================================

class ExtendedEnemyManager {
    constructor(baseEnemyManager) {
        this.base = baseEnemyManager;
    }

    updateEnemy(enemy, dt, player, level, game) {
        switch (enemy.type) {
            case ENEMY_EX.MEGA_GOOMBA:
                this._updateMegaGoomba(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.GHOST_GOOMBA:
                this._updateGhostGoomba(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.SPRING_ENEMY:
                this._updateSpringEnemy(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.BOMB_ENEMY:
                this._updateBombEnemy(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.NINJA_ENEMY:
                this._updateNinjaEnemy(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.FAKE_PLAYER:
                this._updateFakePlayer(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.WALL_CRAWLER:
                this._updateWallCrawler(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.HOMING_BULLET:
                this._updateHomingBullet(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.LAVA_BUBBLE:
                this._updateLavaBubble(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.ICE_ENEMY:
                this._updateIceEnemy(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.SPLITTER_ENEMY:
                this._updateSplitterEnemy(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.SHIELD_ENEMY:
                this._updateShieldEnemy(enemy, dt, player, level, game);
                break;
            case ENEMY_EX.TORNADO_ENEMY:
                this._updateTornadoEnemy(enemy, dt, player, level, game);
                break;
            default:
                this.base._updateGoomba(enemy, dt, player, level, game);
                break;
        }
    }

    _updateMegaGoomba(enemy, dt, player, level, game) {
        enemy.width = 56;
        enemy.height = 56;
        enemy.vy += GRAVITY;
        if (enemy.vy > MAX_FALL_SPEED) enemy.vy = MAX_FALL_SPEED;
        enemy.x += enemy.vx * 0.7;
        enemy.y += enemy.vy;

        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow) || level.isOneWay(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
            if (game && Math.random() < 0.01) {
                game.camera.shake(2, 0.1);
            }
        }

        // 壁反転
        const leftCol = Math.floor(enemy.x / TILE_SIZE);
        const rightCol = Math.floor((enemy.x + enemy.width) / TILE_SIZE);
        const midRow = Math.floor((enemy.y + enemy.height / 2) / TILE_SIZE);
        if (level.isSolid(leftCol, midRow) || level.isSolid(rightCol, midRow)) {
            enemy.vx = -enemy.vx;
        }
    }

    _updateGhostGoomba(enemy, dt, player, level, game) {
        enemy.stateTimer += dt;
        // 透明化サイクル
        const cycle = enemy.stateTimer % 4;
        enemy.visible = cycle < 2;
        enemy.stompable = enemy.visible;

        if (enemy.visible) {
            this.base._updateGoomba(enemy, dt, player, level, game);
        } else {
            // 透明時はゆっくりプレイヤーに近づく
            const dx = player.x - enemy.x;
            enemy.x += Math.sign(dx) * 0.5;
        }
    }

    _updateSpringEnemy(enemy, dt, player, level, game) {
        enemy.vy += GRAVITY;
        enemy.stateTimer += dt;

        // 定期的にジャンプ
        if (enemy.stateTimer % 2 < dt && enemy.vy === 0) {
            enemy.vy = -12;
            if (game) game.audio.play('spring', 0.2, 1.5);
        }

        enemy.x += enemy.vx;
        enemy.y += enemy.vy;

        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
        }
    }

    _updateBombEnemy(enemy, dt, player, level, game) {
        this.base._updateGoomba(enemy, dt, player, level, game);

        // プレイヤーが近いと点火
        const dist = MathUtils.distance(enemy.x, enemy.y, player.x, player.y);
        if (dist < 80 && !enemy.ignited) {
            enemy.ignited = true;
            enemy.fuseTimer = 0;
        }

        if (enemy.ignited) {
            enemy.fuseTimer += dt;
            enemy.vx = 0; // 立ち止まる

            if (enemy.fuseTimer >= 2.0) {
                // 爆発
                enemy.alive = false;
                if (game) {
                    game.particles.emitExplosion(enemy.x + 14, enemy.y + 14, '#ff4400', 40);
                    game.audio.play('explosion', 0.8);
                    game.camera.shake(8, 0.3);
                }
                // 爆風ダメージ
                if (MathUtils.distance(player.x + player.width / 2, player.y + player.height / 2,
                    enemy.x + 14, enemy.y + 14) < TILE_SIZE * 3) {
                    if (player.alive && !player.invincible) {
                        player.die('bomb', game);
                    }
                }
            }
        }
    }

    _updateNinjaEnemy(enemy, dt, player, level, game) {
        enemy.stateTimer += dt;
        enemy.stompable = true;

        // ダッシュ攻撃
        if (enemy.stateTimer % 3 < dt) {
            const dir = player.x > enemy.x ? 1 : -1;
            enemy.vx = dir * 8;
            enemy.dashTimer = 0.3;
        }

        if (enemy.dashTimer > 0) {
            enemy.dashTimer -= dt;
            enemy.x += enemy.vx;
            // 壁チェック
            const frontCol = Math.floor((enemy.x + (enemy.vx > 0 ? enemy.width : 0)) / TILE_SIZE);
            const midRow = Math.floor((enemy.y + enemy.height / 2) / TILE_SIZE);
            if (level.isSolid(frontCol, midRow)) {
                enemy.vx = 0;
                enemy.dashTimer = 0;
            }
        } else {
            enemy.vx = 0;
        }

        // 重力
        enemy.vy += GRAVITY;
        enemy.y += enemy.vy;
        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
        }
    }

    _updateFakePlayer(enemy, dt, player, level, game) {
        // プレイヤーのミラー動作
        enemy.stompable = false; // 触ると死ぬ
        enemy.vy += GRAVITY;

        // プレイヤーの反対方向に動く
        if (player.vx > 0) enemy.vx = -PLAYER_SPEED * 0.8;
        else if (player.vx < 0) enemy.vx = PLAYER_SPEED * 0.8;
        else enemy.vx = 0;

        enemy.x += enemy.vx;
        enemy.y += enemy.vy;

        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
        }
    }

    _updateWallCrawler(enemy, dt, player, level, game) {
        enemy.stateTimer += dt;
        // 壁に沿って移動
        const speed = 1.5;
        const dir = enemy.crawlDir || 0; // 0=右壁上, 1=天井右, 2=左壁下, 3=床左

        switch (dir) {
            case 0: enemy.y -= speed; break;
            case 1: enemy.x += speed; break;
            case 2: enemy.y += speed; break;
            case 3: enemy.x -= speed; break;
        }

        // 簡易的な方向転換
        if (enemy.stateTimer % 3 < dt) {
            enemy.crawlDir = ((enemy.crawlDir || 0) + 1) % 4;
        }
    }

    _updateHomingBullet(enemy, dt, player, level, game) {
        enemy.stompable = false;
        const angle = MathUtils.angle(enemy.x, enemy.y, player.x, player.y);
        const speed = enemy.bulletSpeed || 3;
        enemy.vx = MathUtils.lerp(enemy.vx, Math.cos(angle) * speed, 0.05);
        enemy.vy = MathUtils.lerp(enemy.vy, Math.sin(angle) * speed, 0.05);
        enemy.x += enemy.vx;
        enemy.y += enemy.vy;

        // 寿命
        enemy.stateTimer += dt;
        if (enemy.stateTimer > (enemy.lifeSpan || 5)) {
            enemy.alive = false;
            if (game) game.particles.emitDustPuff(enemy.x + 14, enemy.y + 14);
        }
    }

    _updateLavaBubble(enemy, dt, player, level, game) {
        enemy.stompable = false;
        enemy.stateTimer += dt;
        // 放物線ジャンプ
        const jumpCycle = enemy.stateTimer % (enemy.jumpInterval || 3);
        if (jumpCycle < 1.5) {
            const t = jumpCycle / 1.5;
            enemy.y = enemy.startY - Math.sin(t * Math.PI) * (enemy.jumpHeight || 150);
        } else {
            enemy.y = enemy.startY;
        }

        // パーティクル
        if (game && jumpCycle < 1.5 && jumpCycle > 0.1) {
            game.particles.emitFireEffect(enemy.x + 14, enemy.y + 20);
        }
    }

    _updateIceEnemy(enemy, dt, player, level, game) {
        this.base._updateGoomba(enemy, dt, player, level, game);

        // 定期的に氷弾を発射
        enemy.stateTimer += dt;
        if (enemy.stateTimer % 2.5 < dt && game) {
            const dir = player.x > enemy.x ? 1 : -1;
            game.enemyManager.projectiles.push({
                x: enemy.x + (dir > 0 ? enemy.width : 0),
                y: enemy.y + enemy.height / 2,
                vx: dir * 4,
                vy: 0,
                width: 8, height: 8,
                life: 3.0,
                type: 'ice'
            });
        }
    }

    _updateSplitterEnemy(enemy, dt, player, level, game) {
        this.base._updateGoomba(enemy, dt, player, level, game);
        // 踏まれた時に分裂（stompイベントで処理するため、ここではフラグだけ設定）
        enemy.splitsOnDeath = true;
        enemy.splitCount = enemy.splitCount || 2;
    }

    _updateShieldEnemy(enemy, dt, player, level, game) {
        this.base._updateGoomba(enemy, dt, player, level, game);
        enemy.stateTimer += dt;
        // シールドを周期的にON/OFF
        const shieldCycle = enemy.stateTimer % 4;
        enemy.shielded = shieldCycle < 2.5;
        enemy.stompable = !enemy.shielded;
    }

    _updateTornadoEnemy(enemy, dt, player, level, game) {
        enemy.stompable = false;
        enemy.stateTimer += dt;
        // 回転しながら移動
        enemy.x += Math.sin(enemy.stateTimer * 2) * 2;
        enemy.y = enemy.startY + Math.sin(enemy.stateTimer * 0.8) * 40;

        // プレイヤーを吸い寄せ
        const dist = MathUtils.distance(enemy.x + 14, enemy.y + 14, player.x + player.width / 2, player.y + player.height / 2);
        if (dist < 100 && player.alive) {
            const angle = MathUtils.angle(player.x, player.y, enemy.x + 14, enemy.y + 14);
            player.vx += Math.cos(angle) * 0.3;
            player.vy += Math.sin(angle) * 0.2;
        }
    }

    drawEnemy(ctx, enemy, x, y) {
        switch (enemy.type) {
            case ENEMY_EX.MEGA_GOOMBA:
                this._drawMegaGoomba(ctx, enemy, x, y);
                break;
            case ENEMY_EX.GHOST_GOOMBA:
                this._drawGhostGoomba(ctx, enemy, x, y);
                break;
            case ENEMY_EX.SPRING_ENEMY:
                this._drawSpringEnemy(ctx, enemy, x, y);
                break;
            case ENEMY_EX.BOMB_ENEMY:
                this._drawBombEnemy(ctx, enemy, x, y);
                break;
            case ENEMY_EX.NINJA_ENEMY:
                this._drawNinjaEnemy(ctx, enemy, x, y);
                break;
            case ENEMY_EX.FAKE_PLAYER:
                this._drawFakePlayer(ctx, enemy, x, y);
                break;
            case ENEMY_EX.HOMING_BULLET:
                this._drawHomingBullet(ctx, enemy, x, y);
                break;
            case ENEMY_EX.LAVA_BUBBLE:
                this._drawLavaBubble(ctx, enemy, x, y);
                break;
            case ENEMY_EX.ICE_ENEMY:
                this._drawIceEnemy(ctx, enemy, x, y);
                break;
            case ENEMY_EX.SHIELD_ENEMY:
                this._drawShieldEnemy(ctx, enemy, x, y);
                break;
            case ENEMY_EX.TORNADO_ENEMY:
                this._drawTornadoEnemy(ctx, enemy, x, y);
                break;
            case ENEMY_EX.SPLITTER_ENEMY:
                this._drawSplitterEnemy(ctx, enemy, x, y);
                break;
            case ENEMY_EX.WALL_CRAWLER:
                this._drawWallCrawler(ctx, enemy, x, y);
                break;
            default:
                this.base._drawGoomba(ctx, enemy, x, y);
                break;
        }
    }

    _drawMegaGoomba(ctx, enemy, x, y) {
        const w = 56;
        const h = 56;
        const cx = x + w / 2;
        const cy = y + h / 2;

        // 巨大な体
        const grd = ctx.createRadialGradient(cx, cy, 5, cx, cy, w / 2);
        grd.addColorStop(0, '#DD9944');
        grd.addColorStop(0.7, '#BB7722');
        grd.addColorStop(1, '#995511');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, cy, w / 2, h / 2 - 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 巨大な足
        ctx.fillStyle = '#775533';
        const legAnim = enemy.animFrame === 0 ? 3 : -3;
        ctx.beginPath();
        ctx.ellipse(cx - 12, y + h - 4 + legAnim, 10, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 12, y + h - 4 - legAnim, 10, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(cx - 10, cy - 8, 8, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 10, cy - 8, 8, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.ellipse(cx - 8, cy - 6, 4, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 12, cy - 6, 4, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // 怒り眉
        ctx.strokeStyle = '#553300';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 18, cy - 18);
        ctx.lineTo(cx - 4, cy - 14);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + 18, cy - 18);
        ctx.lineTo(cx + 4, cy - 14);
        ctx.stroke();

        // 口
        ctx.strokeStyle = '#553300';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy + 6, 8, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }

    _drawGhostGoomba(ctx, enemy, x, y) {
        const alpha = enemy.visible ? 0.9 : 0.15;
        ctx.globalAlpha = alpha;
        this.base._drawGoomba(ctx, enemy, x, y);
        // ゴーストエフェクト
        if (!enemy.visible) {
            ctx.fillStyle = 'rgba(150,150,255,0.2)';
            ctx.beginPath();
            ctx.ellipse(x + 14, y + 14, 18, 16, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    _drawSpringEnemy(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;
        const bounce = Math.sin(Date.now() * 0.006) * 4;

        // バネ体
        ctx.fillStyle = '#ff6644';
        ctx.beginPath();
        ctx.ellipse(cx, cy + bounce, 12, 10 - bounce * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // バネ
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 6, cy + 10 + bounce);
        ctx.lineTo(cx + 6, cy + 14 + bounce);
        ctx.lineTo(cx - 6, cy + 18 + bounce);
        ctx.lineTo(cx + 6, cy + 22 + bounce);
        ctx.stroke();

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 2 + bounce, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 2 + bounce, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(cx - 3, cy - 1 + bounce, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 5, cy - 1 + bounce, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawBombEnemy(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;

        // 体（黒い爆弾）
        const grd = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, 13);
        grd.addColorStop(0, '#444');
        grd.addColorStop(0.7, '#222');
        grd.addColorStop(1, '#000');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();

        // 導火線
        ctx.strokeStyle = '#AA8844';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx + 8, cy - 10);
        ctx.quadraticCurveTo(cx + 14, cy - 16, cx + 10, cy - 18);
        ctx.stroke();

        // 点火中
        if (enemy.ignited) {
            const flicker = Math.sin(Date.now() * 0.02) * 2;
            ctx.fillStyle = '#FFCC00';
            ctx.beginPath();
            ctx.arc(cx + 10, cy - 18, 4 + flicker, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FF6600';
            ctx.beginPath();
            ctx.arc(cx + 10, cy - 18, 2 + flicker * 0.5, 0, Math.PI * 2);
            ctx.fill();
            // カウントダウン表示
            const remaining = Math.max(0, 2.0 - (enemy.fuseTimer || 0));
            ctx.fillStyle = '#FF0000';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(remaining.toFixed(1), cx, cy - 22);
        }

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = enemy.ignited ? '#ff0000' : '#111';
        ctx.beginPath();
        ctx.arc(cx - 3, cy - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 5, cy - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // ハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 6, 4, 3, -0.3, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawNinjaEnemy(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;
        const dashing = enemy.dashTimer > 0;

        // 体
        ctx.fillStyle = dashing ? '#444466' : '#333355';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 11, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // マスク
        ctx.fillStyle = '#222244';
        ctx.fillRect(x + 4, y + 6, 20, 8);

        // 目（赤い）
        ctx.fillStyle = '#FF4444';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 2, 2, 1.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 4, cy - 2, 2, 1.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // ダッシュ時のモーションブラー
        if (dashing) {
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = '#333355';
            ctx.beginPath();
            ctx.ellipse(cx - enemy.vx * 3, cy, 11, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx - enemy.vx * 6, cy, 11, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // 手裏剣（頭の上で回転）
        ctx.save();
        ctx.translate(cx, cy - 16);
        ctx.rotate(Date.now() * 0.01);
        ctx.fillStyle = '#AAAACC';
        for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-1, 0, 2, 6);
        }
        ctx.restore();
    }

    _drawFakePlayer(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;

        // しょぼん猫に似てるが黒い
        ctx.fillStyle = '#333333';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, 14, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // 耳
        ctx.beginPath();
        ctx.moveTo(cx - 10, cy - 8);
        ctx.lineTo(cx - 8, cy - 16);
        ctx.lineTo(cx - 2, cy - 8);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 10, cy - 8);
        ctx.lineTo(cx + 8, cy - 16);
        ctx.lineTo(cx + 2, cy - 8);
        ctx.closePath();
        ctx.fill();

        // 赤い目
        ctx.fillStyle = '#FF0000';
        ctx.beginPath();
        ctx.ellipse(cx - 5, cy - 2, 3, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 5, cy - 2, 3, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 邪悪な笑み
        ctx.strokeStyle = '#CC0000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy + 5, 5, 0.3, Math.PI - 0.3);
        ctx.stroke();
    }

    _drawHomingBullet(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;
        const rot = Math.atan2(enemy.vy, enemy.vx);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);

        // ミサイル型
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // 先端（赤）
        ctx.fillStyle = '#FF4444';
        ctx.beginPath();
        ctx.ellipse(8, 0, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 排気
        ctx.fillStyle = '#FF8800';
        const flicker = Math.sin(Date.now() * 0.02) * 2;
        ctx.beginPath();
        ctx.moveTo(-10, -3);
        ctx.lineTo(-18 - flicker, 0);
        ctx.lineTo(-10, 3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        // 軌跡
        ctx.strokeStyle = 'rgba(255,100,0,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx - enemy.vx * 5, cy - enemy.vy * 5);
        ctx.stroke();
    }

    _drawLavaBubble(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;

        // 溶岩の球
        const grd = ctx.createRadialGradient(cx - 2, cy - 2, 2, cx, cy, 12);
        grd.addColorStop(0, '#FFCC00');
        grd.addColorStop(0.4, '#FF8800');
        grd.addColorStop(0.7, '#FF4400');
        grd.addColorStop(1, '#CC2200');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();

        // グロー
        ctx.fillStyle = 'rgba(255,150,0,0.2)';
        ctx.beginPath();
        ctx.arc(cx, cy, 18, 0, Math.PI * 2);
        ctx.fill();

        // 目
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 2, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 4, cy - 2, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawIceEnemy(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;

        // 氷の体
        const grd = ctx.createRadialGradient(cx - 2, cy - 2, 2, cx, cy, 14);
        grd.addColorStop(0, '#CCEEFF');
        grd.addColorStop(0.5, '#88BBEE');
        grd.addColorStop(1, '#5599CC');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 13, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // 結晶模様
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 8);
        ctx.lineTo(cx, cy + 8);
        ctx.moveTo(cx - 7, cy - 4);
        ctx.lineTo(cx + 7, cy + 4);
        ctx.moveTo(cx - 7, cy + 4);
        ctx.lineTo(cx + 7, cy - 4);
        ctx.stroke();

        // 目
        ctx.fillStyle = '#224488';
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 2, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // 氷のキラキラ
        const sparkle = Math.sin(Date.now() * 0.005) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(200,240,255,${sparkle})`;
        ctx.beginPath();
        ctx.arc(cx + 6, cy - 8, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawShieldEnemy(ctx, enemy, x, y) {
        this.base._drawGoomba(ctx, enemy, x, y);
        // シールド
        if (enemy.shielded) {
            const pulse = Math.sin(Date.now() * 0.005) * 0.1 + 0.3;
            ctx.strokeStyle = `rgba(100,200,255,${pulse + 0.3})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x + 14, y + 14, 18, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = `rgba(100,200,255,${pulse})`;
            ctx.beginPath();
            ctx.arc(x + 14, y + 14, 18, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawTornadoEnemy(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;
        const rot = Date.now() * 0.008;

        // 竜巻
        ctx.save();
        ctx.translate(cx, cy);
        for (let i = 0; i < 5; i++) {
            const r = 6 + i * 3;
            const yOff = i * 5 - 10;
            const alpha = 0.4 - i * 0.06;
            ctx.strokeStyle = `rgba(150,200,220,${alpha})`;
            ctx.lineWidth = 3 - i * 0.4;
            ctx.beginPath();
            ctx.arc(0, yOff, r, rot + i * 0.5, rot + i * 0.5 + Math.PI * 1.5);
            ctx.stroke();
        }
        ctx.restore();

        // 目
        ctx.fillStyle = '#224455';
        ctx.beginPath();
        ctx.arc(cx - 3, cy - 4, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 3, cy - 4, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawSplitterEnemy(ctx, enemy, x, y) {
        this.base._drawGoomba(ctx, enemy, x, y);
        // 分裂線
        ctx.strokeStyle = 'rgba(255,255,0,0.3)';
        ctx.setLineDash([2, 2]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 14, y + 2);
        ctx.lineTo(x + 14, y + 26);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    _drawWallCrawler(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;

        // 虫型
        ctx.fillStyle = '#556633';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 10, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // 足（6本）
        ctx.strokeStyle = '#445522';
        ctx.lineWidth = 2;
        const legWave = Math.sin(Date.now() * 0.008) * 3;
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(cx + i * 6, cy - 6);
            ctx.lineTo(cx + i * 6 - 6, cy - 12 + legWave);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + i * 6, cy + 6);
            ctx.lineTo(cx + i * 6 + 6, cy + 12 - legWave);
            ctx.stroke();
        }

        // 目
        ctx.fillStyle = '#FF8800';
        ctx.beginPath();
        ctx.arc(cx - 3, cy - 2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 3, cy - 2, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

                level.setTile(x, y, TILE_EX.DARK_ZONE);

function generateBonusStage() {
    const level = new Level(80, 20, 'bonus');
    level.bgType = 'sky';
    level.musicType = 'overworld';

    level.playerStartX = 3 * TILE_SIZE;
    level.playerStartY = 16 * TILE_SIZE;

    // スタート
    for (let x = 0; x <= 6; x++) {
        level.setTile(x, 17, TILE.GROUND);
        level.setTile(x, 18, TILE.GROUND);
        level.setTile(x, 19, TILE.GROUND);
    }

    // レインボーロード
    for (let x = 7; x <= 70; x++) {
        level.setTile(x, 15, TILE_EX.RAINBOW_BLOCK);
    }

    // コイン大量配置
    for (let x = 8; x <= 68; x += 2) {
        level.setTile(x, 13, TILE.COIN);
        if (x % 4 === 0) level.setTile(x, 11, TILE.COIN);
    }

    // ★ただし半分は偽コイン
    for (let x = 9; x <= 67; x += 4) {
        level.setTile(x, 13, TILE_EX.FAKE_COIN);
    }

    // ミュージックブロック連続（メロディ）
    const melody = [1.0, 1.12, 1.26, 1.33, 1.5, 1.33, 1.26, 1.12, 1.0, 0.89, 0.79, 0.75, 0.67, 0.75, 0.79, 0.89];
    for (let i = 0; i < melody.length; i++) {
        level.setTile(10 + i * 3, 14, TILE_EX.MUSIC_BLOCK);
        level.tileData[`${10 + i * 3},14`] = { musicBlock: true, pitch: melody[i], justHit: false };
    }

    // ★トラップ: 途中からレインボーブロックが消える
    for (let x = 40; x <= 50; x++) {
        level.setTile(x, 15, TILE_EX.GHOST_BLOCK);
        level.tileData[`${x},15`] = { ghost: true, solid: true, cycleOffset: (x - 40) * 0.15 };
    }

    // 竜巻敵
    level.addEnemy(ENEMY_EX.TORNADO_ENEMY, 30 * TILE_SIZE, 10 * TILE_SIZE, {
        stateTimer: 0, stompable: false, width: 28, height: 28
    });

    // ゴール
    for (let x = 71; x <= 78; x++) {
        level.setTile(x, 17, TILE.GROUND);
        level.setTile(x, 18, TILE.GROUND);
        level.setTile(x, 19, TILE.GROUND);
    }

    level.setTile(75, 10, TILE.GOAL_POLE);
    level.setTile(75, 11, TILE.GOAL_POLE);
    level.setTile(75, 12, TILE.GOAL_POLE);
    level.setTile(75, 13, TILE.GOAL_POLE);
    level.setTile(75, 14, TILE.GOAL_POLE);
    level.setTile(75, 15, TILE.GOAL_POLE);
    level.setTile(75, 16, TILE.GOAL_POLE);
    level.setTile(75, 17, TILE.GOAL_BASE);

    level.goalData = { poleX: 75, trapType: 'none', triggered: false };
    level.trueGoalX = 76 * TILE_SIZE;

    return level;
}
