        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
            const cx = (i * 200 + 100) - (cameraX * 0.08) % 400;
            const swing = Math.sin(this.time * 0.5 + i) * 10;
            ctx.beginPath();
            ctx.moveTo(cx + swing * 0.3, 0);
            for (let j = 0; j < 8; j++) {
                const cy = j * 25;
                const cswing = Math.sin(this.time * 0.5 + i + j * 0.3) * (5 + j * 0.5);
                ctx.lineTo(cx + cswing, cy);
            }
            ctx.stroke();
        }

        // 燃えるパーティクル
        for (const ember of this.castleEmbers) {
            const ex = ember.x - cameraX * 0.05;
            if (ex < -10 || ex > GAME_WIDTH + 10) continue;
            const progress = ember.life / ember.maxLife;
            const alpha = (1 - progress) * ember.brightness * 0.6;
            ctx.fillStyle = `rgba(255,${Math.floor(100 + 100 * (1 - progress))},0,${alpha})`;
            ctx.beginPath();
            ctx.arc(ex, ember.y, ember.size * (1 - progress * 0.5), 0, Math.PI * 2);
            ctx.fill();
        }

        // 窓の光
        for (let i = 0; i < 4; i++) {
            const wx = (i * 350 + 150) - (cameraX * 0.06) % 500;
            const wy = 80 + Math.sin(i * 2) * 40;
            const flicker = 0.3 + Math.sin(this.time * 5 + i * 7) * 0.1;
            ctx.fillStyle = `rgba(255,150,50,${flicker})`;
            ctx.fillRect(wx - 8, wy - 12, 16, 24);
            ctx.fillStyle = `rgba(255,200,100,${flicker * 0.5})`;
            ctx.fillRect(wx - 6, wy - 10, 12, 20);

            const winGlow = ctx.createRadialGradient(wx, wy, 0, wx, wy, 40);
            winGlow.addColorStop(0, `rgba(255,150,50,${flicker * 0.15})`);
            winGlow.addColorStop(1, 'rgba(255,150,50,0)');
            ctx.fillStyle = winGlow;
            ctx.beginPath();
            ctx.arc(wx, wy, 40, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawNight(ctx, cameraX) {
        const nightGrd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        nightGrd.addColorStop(0, '#0a0a2e');
        nightGrd.addColorStop(0.4, '#151544');
        nightGrd.addColorStop(0.8, '#1a1a55');
        nightGrd.addColorStop(1, '#222266');
        ctx.fillStyle = nightGrd;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 月
        const moonX = 200 - cameraX * 0.01;
        const moonY = 100;
        ctx.fillStyle = '#eeeedd';
        ctx.beginPath();
        ctx.arc(moonX, moonY, 35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ddddbb';
        ctx.beginPath();
        ctx.arc(moonX - 5, moonY - 3, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(moonX + 10, moonY + 8, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(moonX - 8, moonY + 12, 4, 0, Math.PI * 2);
        ctx.fill();

        const moonGlow = ctx.createRadialGradient(moonX, moonY, 30, moonX, moonY, 120);
        moonGlow.addColorStop(0, 'rgba(200,200,180,0.1)');
        moonGlow.addColorStop(1, 'rgba(200,200,180,0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(moonX, moonY, 120, 0, Math.PI * 2);
        ctx.fill();

        // 星
        for (const star of this.stars) {
            const sx = (star.x - cameraX * 0.02) % (GAME_WIDTH + 200) - 100;
            const twinkle = (Math.sin(this.time * star.twinkleSpeed + star.twinklePhase) + 1) * 0.5;
            const alpha = star.brightness * (0.5 + twinkle * 0.5);
            ctx.fillStyle = `rgba(255,255,240,${alpha})`;
            ctx.beginPath();
            ctx.arc(sx, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();

            if (star.size > 1.5 && twinkle > 0.7) {
                ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.3})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(sx - star.size * 3, star.y);
                ctx.lineTo(sx + star.size * 3, star.y);
                ctx.moveTo(sx, star.y - star.size * 3);
                ctx.lineTo(sx, star.y + star.size * 3);
                ctx.stroke();
            }
        }

        this._drawClouds(ctx, cameraX, 'rgba(30,30,60,0.4)');
    }

    _drawSky(ctx, cameraX) {
        const skyGrd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        skyGrd.addColorStop(0, '#3377cc');
        skyGrd.addColorStop(0.5, '#55aaee');
        skyGrd.addColorStop(1, '#88ccff');
        ctx.fillStyle = skyGrd;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 大きい雲が下にスクロール
        for (let i = 0; i < 10; i++) {
            const cx = (i * 300 - cameraX * 0.3 + this.time * 15) % 3200 - 300;
            const cy = 300 + i * 50 + Math.sin(this.time * 0.3 + i) * 20;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.ellipse(cx, cy, 80, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx - 30, cy + 5, 50, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 35, cy + 3, 55, 18, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        this._drawClouds(ctx, cameraX);
    }

    _drawClouds(ctx, cameraX, color = null) {
        for (const cloud of this.clouds) {
            const cx = cloud.x - cameraX * cloud.parallax;
            if (cx + cloud.width < -50 || cx - cloud.width > GAME_WIDTH + 50) continue;

            ctx.fillStyle = color || `rgba(255,255,255,${cloud.opacity})`;
            const puffWidth = cloud.width / cloud.puffs;
            for (let i = 0; i < cloud.puffs; i++) {
                const px = cx + i * puffWidth;
                const py = cloud.y + Math.sin(i * 1.2) * (cloud.height * 0.2);
                const pr = puffWidth * 0.6 + Math.sin(i * 0.8 + 1) * puffWidth * 0.15;
                ctx.beginPath();
                ctx.ellipse(px, py, pr, cloud.height * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            if (!color) {
                ctx.fillStyle = `rgba(255,255,255,${cloud.opacity * 0.3})`;
                ctx.beginPath();
                ctx.ellipse(cx + cloud.width * 0.3, cloud.y - cloud.height * 0.2,
                    cloud.width * 0.2, cloud.height * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
}


// ============================================================
// SECTION 12: プレイヤークラス
// ============================================================

class LegacyPlayer {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.width = PLAYER_WIDTH;
        this.height = PLAYER_HEIGHT;
        this.onGround = false;
        this.wasOnGround = false;
        this.facingRight = true;
        this.alive = true;
        this.lives = 3;
        this.score = 0;
        this.coins = 0;
        this.state = 'idle';
        this.animFrame = 0;
        this.animTimer = 0;
        this.jumpHeld = false;
        this.jumpTimer = 0;
        this.maxJumpTime = 0.25;
        this.coyoteTime = 0;
        this.maxCoyoteTime = 0.08;
        this.jumpBufferTime = 0;
        this.maxJumpBuffer = 0.1;
        this.invincibleTimer = 0;
        this.deathTimer = 0;
        this.deathAnimY = 0;
        this.deathAnimVY = 0;
        this.respawnX = 0;
        this.respawnY = 0;
        this.onIce = false;
        this.onConveyor = 0;
        this.inWater = false;
        this.onLadder = false;
        this.canEnterPipe = false;
        this.enteringPipe = false;
        this.pipeTimer = 0;
        this.pipeTargetX = 0;
        this.pipeTargetY = 0;
        this.blinkTimer = 0;
        this.squashX = 1;
        this.squashY = 1;
        this.trailTimer = 0;
        this.eyeState = 'normal';
        this.eyeTimer = 0;
        this.mouthState = 'normal';
        this.catEarWiggle = 0;
        this.tailAngle = 0;
        this.walkCycle = 0;
        this.idleBreathCycle = 0;
        this.celebrateTimer = 0;
        this.speedBoost = 1;
        this.wallSliding = false;
        this.lastGroundY = 0;
        this.fallDistance = 0;
        this.maxFallDistance = 0;
    }

    reset(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.wasOnGround = false;
        this.alive = true;
        this.facingRight = true;
        this.state = 'idle';
        this.animFrame = 0;
        this.jumpHeld = false;
        this.jumpTimer = 0;
        this.coyoteTime = 0;
        this.jumpBufferTime = 0;
        this.invincibleTimer = 0;
        this.deathTimer = 0;
        this.onIce = false;
        this.onConveyor = 0;
        this.inWater = false;
        this.onLadder = false;
        this.enteringPipe = false;
        this.squashX = 1;
        this.squashY = 1;
        this.eyeState = 'normal';
        this.mouthState = 'normal';
        this.wallSliding = false;
        this.fallDistance = 0;
        this.maxFallDistance = 0;
        this.celebrateTimer = 0;
        this.speedBoost = 1;
    }

    setRespawn(x, y) {
        this.respawnX = x;
        this.respawnY = y;
    }

    update(dt, input, level, audio, particles, camera) {
        if (!this.alive) {
            this._updateDeath(dt, camera);
            return;
        }

        if (this.enteringPipe) {
            this._updatePipeEnter(dt);
            return;
        }

        if (this.celebrateTimer > 0) {
            this.celebrateTimer -= dt;
            this._updateCelebrate(dt);
            return;
        }

        if (this.invincibleTimer > 0) {
            this.invincibleTimer -= dt;
            this.blinkTimer += dt;
        }

        this.wasOnGround = this.onGround;

        // -------- 横移動 --------
        const accel = this.onIce ? 0.15 : (this.onGround ? 0.6 : 0.35);
        const friction = this.onIce ? 0.985 : (this.onGround ? 0.82 : 0.92);
        const maxSpeed = PLAYER_SPEED * this.speedBoost;

        if (input.isLeft()) {
            this.vx -= accel;
            this.facingRight = false;
        } else if (input.isRight()) {
            this.vx += accel;
            this.facingRight = true;
        } else {
            this.vx *= friction;
            if (Math.abs(this.vx) < 0.1) this.vx = 0;
        }

        this.vx = MathUtils.clamp(this.vx, -maxSpeed, maxSpeed);

        // コンベア
        if (this.onConveyor !== 0 && this.onGround) {
            this.vx += this.onConveyor * 1.5;
        }

        // -------- 水中制御 --------
        if (this.inWater) {
            this.vy *= 0.92;
            this.vx *= 0.95;
            if (input.isJumpDown()) {
                this.vy -= 0.6;
            }
            this.vy += GRAVITY * 0.3;
            this.vy = MathUtils.clamp(this.vy, -3, 3);
        } else if (this.onLadder) {
            this.vy = 0;
            this.vx *= 0.7;
            if (input.isUp()) this.vy = -3;
            if (input.isDown_key()) this.vy = 3;
            if (input.isJumpPressed()) {
                this.onLadder = false;
                this.vy = PLAYER_JUMP_FORCE * 0.8;
            }
        } else {
            // -------- ジャンプ --------
            if (this.onGround) {
                this.coyoteTime = this.maxCoyoteTime;
            } else {
                this.coyoteTime -= dt;
            }

            if (input.isJumpPressed()) {
                this.jumpBufferTime = this.maxJumpBuffer;
            } else {
                this.jumpBufferTime -= dt;
            }

            if (this.jumpBufferTime > 0 && this.coyoteTime > 0) {
                this.vy = PLAYER_JUMP_FORCE;
                this.jumpHeld = true;
                this.jumpTimer = 0;
                this.coyoteTime = 0;
                this.jumpBufferTime = 0;

                // スクワッシュ & ストレッチ
                this.squashX = 0.7;
                this.squashY = 1.3;

                if (audio) audio.play('jump', 0.5, MathUtils.randomRange(0.9, 1.1));
                if (particles) {
                    particles.emitDustPuff(this.x + this.width / 2, this.y + this.height, 0);
                }
            }

            // 可変ジャンプ高さ
            if (this.jumpHeld && input.isJumpDown() && this.jumpTimer < this.maxJumpTime) {
                this.jumpTimer += dt;
                this.vy += PLAYER_JUMP_FORCE * 0.08;
            } else {
                this.jumpHeld = false;
            }

            if (!input.isJumpDown()) {
                this.jumpHeld = false;
            }

            // 重力
            this.vy += GRAVITY;
            this.vy = MathUtils.clamp(this.vy, -15, MAX_FALL_SPEED);
        }

        // -------- 位置更新と衝突 --------
        this.onIce = false;
        this.onConveyor = 0;
        this.canEnterPipe = false;

        // X軸移動 & 衝突
        this.x += this.vx;
        this._resolveCollisionX(level);

        // Y軸移動 & 衝突
        const prevY = this.y;
        this.y += this.vy;
        this.onGround = false;
        this._resolveCollisionY(level, audio, particles, camera);

        // 落下距離追跡
        if (!this.onGround && this.vy > 0) {
            this.fallDistance += this.vy;
        }

        // 着地エフェクト
        if (this.onGround && !this.wasOnGround) {
            if (this.fallDistance > 60) {
                if (camera) camera.shake(3, 0.15);
            }
            if (this.fallDistance > 20 && particles) {
                particles.emitLandingDust(this.x + this.width / 2, this.y + this.height);
            }
            this.squashX = 1.3;
            this.squashY = 0.7;
            this.fallDistance = 0;
            this.lastGroundY = this.y;
        }

        // -------- 画面外チェック --------
        if (this.y > GAME_HEIGHT + 100) {
            this.die(audio, particles, camera, 'fall');
            return;
        }

        if (this.x < -50) {
            this.x = -50;
            this.vx = 0;
        }

        // -------- パイプ入り口チェック --------
        if (input.isDown_key() && this.onGround && this.canEnterPipe) {
            this._startPipeEnter(audio);
        }

        // -------- アニメーション更新 --------
        this._updateAnimation(dt);
        this._updateSquash(dt);
        this._updateEyes(dt);
    }

    _resolveCollisionX(level) {
        if (!level) return;
        const tileLeft = Math.floor(this.x / TILE_SIZE);
        const tileRight = Math.floor((this.x + this.width) / TILE_SIZE);
        const tileTop = Math.floor(this.y / TILE_SIZE);
        const tileBottom = Math.floor((this.y + this.height - 1) / TILE_SIZE);

        for (let ty = tileTop; ty <= tileBottom; ty++) {
            for (let tx = tileLeft; tx <= tileRight; tx++) {
                const tile = level.getTile(tx, ty);
                if (tile === TILE.EMPTY || tile === undefined) continue;

                if (this._isSolidTile(tile, level, tx, ty)) {
                    const tileX = tx * TILE_SIZE;
                    const tileY = ty * TILE_SIZE;

                    if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                        tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                        if (this.vx > 0) {
                            this.x = tileX - this.width;
                        } else if (this.vx < 0) {
                            this.x = tileX + TILE_SIZE;
                        }
                        this.vx = 0;
                    }
                }
            }
        }
    }

    _resolveCollisionY(level, audio, particles, camera) {
        if (!level) return;
        const tileLeft = Math.floor(this.x / TILE_SIZE);
        const tileRight = Math.floor((this.x + this.width - 1) / TILE_SIZE);
        const tileTop = Math.floor(this.y / TILE_SIZE);
        const tileBottom = Math.floor((this.y + this.height) / TILE_SIZE);

        for (let ty = tileTop; ty <= tileBottom; ty++) {
            for (let tx = tileLeft; tx <= tileRight; tx++) {
                const tile = level.getTile(tx, ty);
                if (tile === TILE.EMPTY || tile === undefined) continue;

                const tileX = tx * TILE_SIZE;
                const tileY = ty * TILE_SIZE;
                const tileData = level.getTileData(tx, ty);

                // 特殊タイル処理
                this._handleSpecialTile(tile, tx, ty, tileData, level, audio, particles, camera);

                // ワンウェイプラットフォーム
                if (tile === TILE.ONEWAY_PLATFORM || tile === TILE.CLOUD_PLATFORM) {
                    if (this.vy >= 0 && this.y + this.height - this.vy <= tileY + 4) {
                        if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                            tileX, tileY, TILE_SIZE, 10)) {
                            this.y = tileY - this.height;
                            this.vy = 0;
                            this.onGround = true;
                        }
                    }
                    continue;
                }

                if (this._isSolidTile(tile, level, tx, ty)) {
                    if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                        tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                        if (this.vy > 0) {
                            this.y = tileY - this.height;
                            this.vy = 0;
                            this.onGround = true;

                            // 表面タイプ
                            if (tile === TILE.ICE) this.onIce = true;
                            if (tile === TILE.CONVEYOR_LEFT) this.onConveyor = -1;
                            if (tile === TILE.CONVEYOR_RIGHT) this.onConveyor = 1;
                        } else if (this.vy < 0) {
                            this.y = tileY + TILE_SIZE;
                            this.vy = 0;

                            // ブロックヒット処理
                            this._hitBlock(tile, tx, ty, tileData, level, audio, particles, camera);
                        }
                    }
                }
            }
        }
    }

    _isSolidTile(tile, level, tx, ty) {
        const solidTiles = [
            TILE.GROUND, TILE.BRICK, TILE.QUESTION, TILE.BLOCK,
            TILE.PIPE_TL, TILE.PIPE_TR, TILE.PIPE_BL, TILE.PIPE_BR,
            TILE.ICE, TILE.CONVEYOR_LEFT, TILE.CONVEYOR_RIGHT,
            TILE.CASTLE_BRICK, TILE.CASTLE_WALL, TILE.CASTLE_FLOOR,
            TILE.UNDERGROUND_BRICK, TILE.RISING_BLOCK, TILE.TRAP_COIN_BLOCK,
            TILE.CRUMBLE_BRICK
        ];

        if (tile === TILE.FAKE_GROUND) return false;
        if (tile === TILE.FALLING_GROUND) {
            const data = level.getTileData(tx, ty);
            return !(data && data.fallen);
        }
        if (tile === TILE.VANISH_BLOCK) {
            const data = level.getTileData(tx, ty);
            return !(data && data.vanished);
        }
        if (tile === TILE.TIMED_BLOCK) {
            const data = level.getTileData(tx, ty);
            return data ? data.phase < 0.5 : true;
        }
        if (tile === TILE.SPIKE_BLOCK) {
            const data = level.getTileData(tx, ty);
            return !(data && data.activated);
        }

        return solidTiles.includes(tile);
    }

    _handleSpecialTile(tile, tx, ty, tileData, level, audio, particles, camera) {
        const tileX = tx * TILE_SIZE;
        const tileY = ty * TILE_SIZE;
        const playerCX = this.x + this.width / 2;
        const playerCY = this.y + this.height / 2;

        switch (tile) {
            case TILE.SPIKE:
            case TILE.HIDDEN_SPIKE:
                if (tile === TILE.HIDDEN_SPIKE) {
                    if (tileData && !tileData.revealed) {
                        // プレイヤーが近づくと出現
                        if (Math.abs(playerCX - (tileX + TILE_SIZE / 2)) < TILE_SIZE * 2) {
                            level.setTileData(tx, ty, { revealed: true });
                            level.setTile(tx, ty, TILE.SPIKE);
                            if (audio) audio.play('trap');
                        }
                        break;
                    }
                }
                if (MathUtils.rectOverlap(this.x + 4, this.y + 4, this.width - 8, this.height - 4,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    this.die(audio, particles, camera, 'spike');
                }
                break;

            case TILE.LAVA:
                if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                    tileX, tileY + 4, TILE_SIZE, TILE_SIZE - 4)) {
                    this.die(audio, particles, camera, 'lava');
                }
                break;

            case TILE.WATER:
                if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    if (!this.inWater && particles) {
                        particles.emitWaterSplash(playerCX, tileY);
                    }
                    this.inWater = true;
                }
                break;

            case TILE.COIN:
                if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    level.setTile(tx, ty, TILE.EMPTY);
                    this.coins++;
                    this.score += 100;
                    if (audio) audio.play('coin', 0.5);
                    if (particles) particles.emitCoinSparkle(tileX + TILE_SIZE / 2, tileY + TILE_SIZE / 2);
                }
                break;

            case TILE.FALLING_GROUND:
                if (this.onGround && this.y + this.height <= tileY + 2 &&
                    MathUtils.rectOverlap(this.x, this.y + this.height - 1, this.width, 4,
                        tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    if (!tileData || !tileData.triggered) {
                        level.setTileData(tx, ty, {
                            triggered: true,
                            shaking: true,
                            timer: 0.5,
                            fallen: false
                        });
                    }
                }
                break;

            case TILE.FAKE_GROUND:
                break;

            case TILE.DEADLY_BACKGROUND:
                if (MathUtils.rectOverlap(this.x + 4, this.y + 4, this.width - 8, this.height - 8,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    this.die(audio, particles, camera, 'trap');
                }
                break;

            case TILE.SPRING:
            case TILE.TRAMPOLINE:
                if (this.vy > 0 &&
                    MathUtils.rectOverlap(this.x, this.y + this.height - 4, this.width, 8,
                        tileX, tileY, TILE_SIZE, TILE_SIZE * 0.6)) {
                    this.vy = PLAYER_JUMP_FORCE * 1.5;
                    this.squashX = 0.6;
                    this.squashY = 1.5;
                    level.setTileData(tx, ty, { compressed: true, bouncing: true, timer: 0.2 });
                    if (audio) audio.play('spring', 0.6);
                }
                break;

            case TILE.LADDER:
                if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                    tileX + 4, tileY, TILE_SIZE - 8, TILE_SIZE)) {
                    if (input && (input.isUp() || input.isDown_key())) {
                        this.onLadder = true;
                    }
                }
                break;

            case TILE.CHECKPOINT:
                if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    if (!tileData || !tileData.activated) {
                        level.setTileData(tx, ty, { activated: true });
                        this.setRespawn(tileX, tileY - this.height);
                        if (audio) audio.play('checkpoint', 0.6);
                        if (particles) particles.emitConfetti(tileX + TILE_SIZE / 2, tileY, 15);
                    }
                }
                break;

            case TILE.WARP_PIPE_ENTRY:
                if (MathUtils.rectOverlap(this.x, this.y + this.height - 4, this.width, 8,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    this.canEnterPipe = true;
                    this._currentPipeEntry = { tx, ty, data: tileData };
                }
                break;

            case TILE.BOSS_TRIGGER:
                if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    if (!tileData || !tileData.triggered) {
                        level.setTileData(tx, ty, { triggered: true });
                        level.triggerBoss();
                    }
                }
                break;

            case TILE.GOAL_POLE:
            case TILE.GOAL_BASE:
                if (MathUtils.rectOverlap(this.x, this.y, this.width, this.height,
                    tileX, tileY, TILE_SIZE, TILE_SIZE)) {
                    if (!tileData || !tileData.touched) {
                        level.setTileData(tx, ty, { touched: true });
                        level.goalReached();
                    }
                }
                break;
        }
    }

    _hitBlock(tile, tx, ty, tileData, level, audio, particles, camera) {
        const tileX = tx * TILE_SIZE;
        const tileY = ty * TILE_SIZE;

        if (tile === TILE.QUESTION || tile === TILE.TRAP_COIN_BLOCK) {
            if (!tileData || !tileData.used) {
                level.setTileData(tx, ty, { used: true, bounceOffset: -8, bounceTimer: 0.2 });
                if (audio) audio.play('block', 0.5);

                if (tile === TILE.TRAP_COIN_BLOCK) {
                    // トラップ: コインブロックが上昇して消える
                    level.setTileData(tx, ty, { used: true, rising: true, riseSpeed: -3 });
                    if (audio) audio.play('trap');
                } else {
                    this.coins++;
                    this.score += 100;
                    if (particles) particles.emitCoinSparkle(tileX + TILE_SIZE / 2, tileY - 16);
                    if (audio) audio.play('coin', 0.4);
                }
            }
        } else if (tile === TILE.RISING_BLOCK) {
            if (!tileData || !tileData.used) {
                level.setTileData(tx, ty, { used: true, rising: true, riseSpeed: -2 });
                if (audio) audio.play('trap');
                if (camera) camera.shake(2, 0.1);
            }
        } else if (tile === TILE.BRICK || tile === TILE.CRUMBLE_BRICK) {
            level.setTile(tx, ty, TILE.EMPTY);
            if (audio) audio.play('break_block', 0.5);
            if (particles) particles.emitBlockBreak(tileX + TILE_SIZE / 2, tileY + TILE_SIZE / 2);
            if (camera) camera.shake(2, 0.1);
        } else if (tile === TILE.SPIKE_BLOCK) {
            if (!tileData || !tileData.activated) {
                level.setTileData(tx, ty, { activated: true });
                if (audio) audio.play('trap');
                if (camera) camera.shake(3, 0.15);
            }
        }
    }

    _startPipeEnter(audio) {
        if (!this._currentPipeEntry) return;
        this.enteringPipe = true;
        this.pipeTimer = 0.6;
        this.vx = 0;
        this.vy = 0;
        if (audio) audio.play('pipe', 0.5);
    }

    _updatePipeEnter(dt) {
        this.pipeTimer -= dt;
        this.y += 1.5;
        if (this.pipeTimer <= 0) {
            this.enteringPipe = false;
            // ワープ先に移動（レベルで設定）
            if (this._currentPipeEntry && this._currentPipeEntry.data) {
                const d = this._currentPipeEntry.data;
                if (d.targetX !== undefined && d.targetY !== undefined) {
                    this.x = d.targetX;
                    this.y = d.targetY;
                }
            }
        }
    }

    _updateDeath(dt, camera) {
        this.deathTimer += dt;
        if (this.deathTimer < 0.3) {
            // 初期フリーズ
        } else {
            if (this.deathTimer < 0.35) {
                this.deathAnimVY = -8;
            }
            this.deathAnimVY += GRAVITY * 0.8;
            this.deathAnimY += this.deathAnimVY;
        }
    }

    _updateCelebrate(dt) {
        this.idleBreathCycle += dt * 8;
        this.squashX = 1 + Math.sin(this.idleBreathCycle) * 0.05;
        this.squashY = 1 - Math.sin(this.idleBreathCycle) * 0.05;
    }

    _updateAnimation(dt) {
        this.animTimer += dt;
        this.idleBreathCycle += dt * 2;

        if (this.onGround) {
            if (Math.abs(this.vx) > 0.5) {
                this.state = 'walk';
                this.walkCycle += Math.abs(this.vx) * dt * 8;
                this.animFrame = Math.floor(this.walkCycle) % 4;
            } else {
                this.state = 'idle';
                this.animFrame = 0;
            }
        } else {
            this.state = this.vy < 0 ? 'jump' : 'fall';
        }

        this.tailAngle = Math.sin(this.animTimer * 4) * 0.4;
        this.catEarWiggle = Math.sin(this.animTimer * 3) * 0.1;
    }

    _updateSquash(dt) {
        this.squashX = MathUtils.lerp(this.squashX, 1, 0.15);
        this.squashY = MathUtils.lerp(this.squashY, 1, 0.15);
    }

    _updateEyes(dt) {
        this.eyeTimer += dt;
        // まばたき
        if (this.eyeState === 'normal' && this.eyeTimer > 3 + Math.random() * 2) {
            this.eyeState = 'blink';
            this.eyeTimer = 0;
        } else if (this.eyeState === 'blink' && this.eyeTimer > 0.1) {
            this.eyeState = 'normal';
            this.eyeTimer = 0;
        }

        // 表情変化
        if (this.vy > 6) {
            this.eyeState = 'scared';
            this.mouthState = 'open';
        } else if (this.state === 'jump') {
            this.mouthState = 'happy';
        } else if (Math.abs(this.vx) > 2) {
            this.mouthState = 'determined';
        } else {
            if (this.eyeState !== 'blink') {
                this.mouthState = 'normal';
            }
        }
    }

    die(audio, particles, camera, cause = 'enemy') {
        if (!this.alive) return;
        if (this.invincibleTimer > 0) return;

        this.alive = false;
        this.lives--;
        this.deathTimer = 0;
        this.deathAnimY = 0;
        this.deathAnimVY = 0;
        this.vx = 0;
        this.vy = 0;

        if (audio) audio.play('death', 0.6);
        if (particles) particles.emitDeathEffect(this.x + this.width / 2, this.y + this.height / 2);
        if (camera) {
            camera.shake(6, 0.3);
            camera.flash('#ff0000', 0.3);
        }
    }

    stomp(audio, particles) {
        this.vy = PLAYER_JUMP_FORCE * 0.6;
        this.squashX = 0.8;
        this.squashY = 1.2;
        this.score += 200;
        if (audio) audio.play('stomp', 0.5);
    }

    addCoin(audio, particles) {
        this.coins++;
        this.score += 100;
        if (this.coins >= 100) {
            this.coins -= 100;
            this.lives++;
            if (audio) audio.play('oneup', 0.6);
        }
        if (audio) audio.play('coin', 0.4);
    }

    celebrate() {
        this.celebrateTimer = 3.0;
        this.vx = 0;
        this.vy = 0;
    }

    draw(ctx, camera) {
        if (!this.alive) {
            this._drawDead(ctx, camera);
            return;
        }

        if (this.invincibleTimer > 0 && Math.floor(this.blinkTimer * 15) % 2 === 0) {
            return;
        }

        const pos = camera.worldToScreen(this.x, this.y);
        const cx = pos.x + this.width / 2;
        const cy = pos.y + this.height / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(this.facingRight ? this.squashX : -this.squashX, this.squashY);
        ctx.translate(-this.width / 2, -this.height / 2);

        this._drawCatBody(ctx);

        ctx.restore();
    }

    _drawCatBody(ctx) {
        const w = this.width;
        const h = this.height;
        const bodyColor = '#ffffff';
        const outlineColor = '#333333';

        // ---- しっぽ ----
        ctx.save();
        ctx.translate(3, h * 0.6);
        ctx.rotate(this.tailAngle);
        ctx.strokeStyle = bodyColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-8, -6 + Math.sin(this.tailAngle * 3) * 3, -12, -10);
        ctx.stroke();
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        // ---- 身体 ----
        const bodyGrd = ctx.createRadialGradient(w / 2, h * 0.5, 2, w / 2, h * 0.5, w * 0.8);
        bodyGrd.addColorStop(0, '#ffffff');
        bodyGrd.addColorStop(1, '#eeeedd');
        ctx.fillStyle = bodyGrd;

        // 身体（丸め四角）
        const bodyX = 3;
        const bodyY = 8;
        const bodyW = w - 6;
        const bodyH = h - 10;
        const radius = 8;

        ctx.beginPath();
        ctx.moveTo(bodyX + radius, bodyY);
        ctx.lineTo(bodyX + bodyW - radius, bodyY);
        ctx.arcTo(bodyX + bodyW, bodyY, bodyX + bodyW, bodyY + radius, radius);
        ctx.lineTo(bodyX + bodyW, bodyY + bodyH - radius);
        ctx.arcTo(bodyX + bodyW, bodyY + bodyH, bodyX + bodyW - radius, bodyY + bodyH, radius);
        ctx.lineTo(bodyX + radius, bodyY + bodyH);
        ctx.arcTo(bodyX, bodyY + bodyH, bodyX, bodyY + bodyH - radius, radius);
        ctx.lineTo(bodyX, bodyY + radius);
        ctx.arcTo(bodyX, bodyY, bodyX + radius, bodyY, radius);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // ---- 足 ----
        const legOffset = this.state === 'walk' ? Math.sin(this.walkCycle * Math.PI) * 3 : 0;
        const legY = bodyY + bodyH - 2;

        // 左足
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(bodyX + 5, legY + 3 + legOffset, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 1;
        ctx.stroke();

        // 右足
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(bodyX + bodyW - 5, legY + 3 - legOffset, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // ---- 耳 ----
        const earY = bodyY - 2;
        const earWiggle = this.catEarWiggle;

        // 左耳
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(bodyX + 3, earY + 4);
        ctx.lineTo(bodyX + 1 + earWiggle * 5, earY - 8);
        ctx.lineTo(bodyX + 10, earY + 4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 耳の内側（ピンク）
        ctx.fillStyle = '#ffaaaa';
        ctx.beginPath();
        ctx.moveTo(bodyX + 4, earY + 2);
        ctx.lineTo(bodyX + 3 + earWiggle * 3, earY - 4);
        ctx.lineTo(bodyX + 8, earY + 2);
        ctx.closePath();
        ctx.fill();

        // 右耳
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(bodyX + bodyW - 10, earY + 4);
        ctx.lineTo(bodyX + bodyW - 1 - earWiggle * 5, earY - 8);
        ctx.lineTo(bodyX + bodyW - 3, earY + 4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#ffaaaa';
        ctx.beginPath();
        ctx.moveTo(bodyX + bodyW - 8, earY + 2);
        ctx.lineTo(bodyX + bodyW - 3 - earWiggle * 3, earY - 4);
        ctx.lineTo(bodyX + bodyW - 4, earY + 2);
        ctx.closePath();
        ctx.fill();

        // ---- 顔 ----
        const faceX = w / 2;
        const faceY = bodyY + bodyH * 0.35;

        // 目
        const eyeSpacing = 5;
        const eyeSize = this.eyeState === 'blink' ? 0.5 : 3;
        const eyeWidth = this.eyeState === 'blink' ? 3 : 3;

        // 左目
        if (this.eyeState === 'blink') {
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(faceX - eyeSpacing - 3, faceY);
            ctx.lineTo(faceX - eyeSpacing + 3, faceY);
            ctx.stroke();
        } else if (this.eyeState === 'scared') {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(faceX - eyeSpacing, faceY, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = '#222222';
            ctx.beginPath();
            ctx.arc(faceX - eyeSpacing, faceY, 2.5, 0, Math.PI * 2);
            ctx.fill();
            // ハイライト
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(faceX - eyeSpacing + 1, faceY - 1.5, 1, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // (´・ω・`) スタイルの目
            ctx.fillStyle = '#222222';
            ctx.beginPath();
            ctx.arc(faceX - eyeSpacing, faceY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(faceX - eyeSpacing + 0.8, faceY - 1, 1.2, 0, Math.PI * 2);
            ctx.fill();
        }

        // 右目（同様）
        if (this.eyeState === 'blink') {
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(faceX + eyeSpacing - 3, faceY);
            ctx.lineTo(faceX + eyeSpacing + 3, faceY);
            ctx.stroke();
        } else if (this.eyeState === 'scared') {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(faceX + eyeSpacing, faceY, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = '#222222';
            ctx.beginPath();
            ctx.arc(faceX + eyeSpacing, faceY, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(faceX + eyeSpacing + 1, faceY - 1.5, 1, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#222222';
            ctx.beginPath();
            ctx.arc(faceX + eyeSpacing, faceY, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(faceX + eyeSpacing + 0.8, faceY - 1, 1.2, 0, Math.PI * 2);
            ctx.fill();
        }

        // 口 (´・ω・`) スタイル
        const mouthY = faceY + 5;
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';

        if (this.mouthState === 'open') {
            ctx.fillStyle = '#ff6666';
            ctx.beginPath();
            ctx.ellipse(faceX, mouthY + 1, 3, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = outlineColor;
            ctx.stroke();
        } else if (this.mouthState === 'happy') {
            ctx.beginPath();
            ctx.moveTo(faceX - 4, mouthY);
            ctx.quadraticCurveTo(faceX, mouthY + 3, faceX + 4, mouthY);
            ctx.stroke();
        } else if (this.mouthState === 'determined') {
            ctx.beginPath();
            ctx.moveTo(faceX - 3, mouthY);
            ctx.lineTo(faceX + 3, mouthY);
            ctx.stroke();
        } else {
            // (ω) 口
            ctx.beginPath();
            ctx.moveTo(faceX - 4, mouthY - 1);
            ctx.quadraticCurveTo(faceX - 2, mouthY + 2, faceX, mouthY);
            ctx.quadraticCurveTo(faceX + 2, mouthY + 2, faceX + 4, mouthY - 1);
            ctx.stroke();
        }

        // ひげ
        ctx.strokeStyle = 'rgba(50,50,50,0.4)';
        ctx.lineWidth = 0.8;
        // 左ひげ
        ctx.beginPath();
        ctx.moveTo(faceX - 5, mouthY - 1);
        ctx.lineTo(faceX - 16, mouthY - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(faceX - 5, mouthY + 1);
        ctx.lineTo(faceX - 15, mouthY + 2);
        ctx.stroke();
        // 右ひげ
        ctx.beginPath();
        ctx.moveTo(faceX + 5, mouthY - 1);
        ctx.lineTo(faceX + 16, mouthY - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(faceX + 5, mouthY + 1);
        ctx.lineTo(faceX + 15, mouthY + 2);
        ctx.stroke();
    }

    _drawDead(ctx, camera) {
        const pos = camera.worldToScreen(this.x, this.y + this.deathAnimY);
        const cx = pos.x + this.width / 2;
        const cy = pos.y + this.height / 2;

        ctx.save();
        ctx.translate(cx, cy);

        const rot = this.deathTimer * 5;
        ctx.rotate(rot);
        ctx.globalAlpha = Math.max(0, 1 - (this.deathTimer - 1.0) * 0.5);

        ctx.scale(this.squashX, this.squashY);
        ctx.translate(-this.width / 2, -this.height / 2);

        // 死亡時は灰色
        ctx.filter = 'grayscale(60%)';
        this.eyeState = 'scared';
        this.mouthState = 'open';
        this._drawCatBody(ctx);
        ctx.filter = 'none';

        // ×目
        const faceX = this.width / 2;
        const faceY = 8 + (this.height - 10) * 0.35;
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        // 左
        ctx.beginPath();
        ctx.moveTo(faceX - 7, faceY - 2);
        ctx.lineTo(faceX - 3, faceY + 2);
        ctx.moveTo(faceX - 3, faceY - 2);
        ctx.lineTo(faceX - 7, faceY + 2);
        ctx.stroke();
        // 右
        ctx.beginPath();
        ctx.moveTo(faceX + 3, faceY - 2);
        ctx.lineTo(faceX + 7, faceY + 2);
        ctx.moveTo(faceX + 7, faceY - 2);
        ctx.lineTo(faceX + 3, faceY + 2);
        ctx.stroke();

        ctx.restore();
    }

    getBounds() {
        return { x: this.x, y: this.y, w: this.width, h: this.height };
    }

    getCenterX() { return this.x + this.width / 2; }
    getCenterY() { return this.y + this.height / 2; }
}


// ============================================================
// SECTION 13: 敵ベースクラス
// ============================================================

class Enemy {
    constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.width = 28;
        this.height = 28;
        this.alive = true;
        this.active = false;
        this.facingRight = false;
        this.onGround = false;
        this.stompable = true;
        this.deadly = true;
        this.animTimer = 0;
        this.animFrame = 0;
        this.deathTimer = 0;
        this.dying = false;
        this.dyingType = 'stomp';
        this.activateDistance = GAME_WIDTH * 0.8;
        this.deactivateDistance = GAME_WIDTH * 1.5;
        this.flashTimer = 0;
        this.knockbackVX = 0;
        this.knockbackVY = 0;
        this.squashX = 1;
        this.squashY = 1;
        this.triggerOnce = false;
        this.triggered = false;
        this.spawnOffsetY = 0;
        this.health = 1;
    }

    activate() {
        this.active = true;
    }

    checkActivation(playerX) {
        if (this.active) return;
        if (Math.abs(this.x - playerX) < this.activateDistance) {
            this.activate();
        }
    }

    update(dt, level, player) {
        if (!this.alive || !this.active) return;

        if (this.dying) {
            this._updateDying(dt);
            return;
        }

        this.animTimer += dt;

        // 基本AI：左に歩く
        if (this.vx === 0 && !this.triggered) {
            this.vx = this.facingRight ? 1.5 : -1.5;
        }

        // 重力
        this.vy += GRAVITY;
        this.vy = MathUtils.clamp(this.vy, -10, MAX_FALL_SPEED);

        // 位置更新
        this.x += this.vx;
        this.y += this.vy;

        // 簡易地形衝突
        this._resolveCollision(level);

        // 画面外チェック
        if (this.y > GAME_HEIGHT + 200) {
            this.alive = false;
        }
    }

    _resolveCollision(level) {
        if (!level) return;
        this.onGround = false;

        // 下方向
        const footY = Math.floor((this.y + this.height) / TILE_SIZE);
        const leftX = Math.floor(this.x / TILE_SIZE);
        const rightX = Math.floor((this.x + this.width) / TILE_SIZE);

        for (let tx = leftX; tx <= rightX; tx++) {
            const tile = level.getTile(tx, footY);
            if (this._isSolidForEnemy(tile, level, tx, footY)) {
                this.y = footY * TILE_SIZE - this.height;
                this.vy = 0;
                this.onGround = true;
                break;
            }
        }

        // 横方向（壁で反転）
        const headY = Math.floor(this.y / TILE_SIZE);
        const midY = Math.floor((this.y + this.height / 2) / TILE_SIZE);

        if (this.vx < 0) {
            const tx = Math.floor(this.x / TILE_SIZE);
            for (let ty = headY; ty <= midY; ty++) {
                const tile = level.getTile(tx, ty);
                if (this._isSolidForEnemy(tile, level, tx, ty)) {
                    this.x = (tx + 1) * TILE_SIZE;
                    this.vx = -this.vx;
                    this.facingRight = !this.facingRight;
                    break;
                }
            }
        } else if (this.vx > 0) {
            const tx = Math.floor((this.x + this.width) / TILE_SIZE);
            for (let ty = headY; ty <= midY; ty++) {
                const tile = level.getTile(tx, ty);
                if (this._isSolidForEnemy(tile, level, tx, ty)) {
                    this.x = tx * TILE_SIZE - this.width;
                    this.vx = -this.vx;
                    this.facingRight = !this.facingRight;
                    break;
                }
            }
        }

        // 崖で反転（一部の敵のみ）
        if (this.onGround && this._turnsAtEdge()) {
            const aheadX = this.vx > 0
                ? Math.floor((this.x + this.width + 2) / TILE_SIZE)
                : Math.floor((this.x - 2) / TILE_SIZE);
            const belowY = Math.floor((this.y + this.height + 4) / TILE_SIZE);
            const tileBelow = level.getTile(aheadX, belowY);
            if (!this._isSolidForEnemy(tileBelow, level, aheadX, belowY)) {
                this.vx = -this.vx;
                this.facingRight = !this.facingRight;
            }
        }
    }

    _isSolidForEnemy(tile, level, tx, ty) {
        const solids = [
            TILE.GROUND, TILE.BRICK, TILE.QUESTION, TILE.BLOCK,
            TILE.PIPE_TL, TILE.PIPE_TR, TILE.PIPE_BL, TILE.PIPE_BR,
            TILE.ICE, TILE.CASTLE_BRICK, TILE.CASTLE_WALL, TILE.CASTLE_FLOOR,
            TILE.UNDERGROUND_BRICK, TILE.CONVEYOR_LEFT, TILE.CONVEYOR_RIGHT
        ];
        return solids.includes(tile);
    }

    _turnsAtEdge() {
        return this.type === ENEMY_TYPE.KOOPA || this.type === ENEMY_TYPE.HAMMER_BRO;
    }

    _updateDying(dt) {
        this.deathTimer += dt;
        if (this.dyingType === 'stomp') {
            this.squashY = MathUtils.lerp(this.squashY, 0.1, 0.2);
            this.squashX = MathUtils.lerp(this.squashX, 1.5, 0.2);
            if (this.deathTimer > 0.5) {
                this.alive = false;
            }
        } else if (this.dyingType === 'fall') {
            this.vy += GRAVITY;
            this.y += this.vy;
            this.x += this.knockbackVX;
            if (this.y > GAME_HEIGHT + 100) {
                this.alive = false;
            }
        }
    }

    onStomp(player, audio, particles) {
        if (!this.stompable) return false;

        this.dying = true;
        this.dyingType = 'stomp';
        this.deathTimer = 0;
        this.vx = 0;
        this.vy = 0;

        if (audio) audio.play('stomp', 0.5);
        if (particles) {
            particles.emitBurst({
                x: this.x + this.width / 2,
                y: this.y + this.height / 2,
                speedRange: [1, 3],
                sizeRange: [2, 4],
                lifeRange: [0.2, 0.5],
                gravity: 0.2,
                colorOptions: ['#ffcc00', '#ff8800', '#ffffff'],
                shape: 'star',
                endSize: 0,
                endAlpha: 0
            }, 8);
        }

        player.stomp(audio, particles);
        player.score += 100;
        return true;
    }

    onKnockback(dirX, audio, particles) {
        this.dying = true;
        this.dyingType = 'fall';
        this.deathTimer = 0;
        this.knockbackVX = dirX * 4;
        this.vy = -6;
        if (audio) audio.play('stomp', 0.4);
    }

    checkCollisionWithPlayer(player) {
        if (!this.alive || !this.active || this.dying) return null;
        if (!player.alive) return null;

        const pb = player.getBounds();
        if (!MathUtils.rectOverlap(pb.x, pb.y, pb.w, pb.h, this.x, this.y, this.width, this.height)) {
            return null;
        }

        // 上から踏んだか判定
        if (player.vy > 0 && pb.y + pb.h - player.vy <= this.y + 8) {
            return 'stomp';
        }

        return 'hit';
    }

    draw(ctx, camera) {
        if (!this.alive || !this.active) return;
        if (!camera.isVisible(this.x, this.y, this.width, this.height)) return;

        const pos = camera.worldToScreen(this.x, this.y);
        ctx.save();
        ctx.translate(pos.x + this.width / 2, pos.y + this.height / 2);
        ctx.scale(this.facingRight ? -1 : 1, 1);
        ctx.scale(this.squashX, this.squashY);
        ctx.translate(-this.width / 2, -this.height / 2);

        this._drawEnemy(ctx);

        ctx.restore();
    }

    _drawEnemy(ctx) {
        // サブクラスでオーバーライド
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(0, 0, this.width, this.height);
    }
}

class Goomba extends Enemy {
    constructor(x, y) {
        super(ENEMY_TYPE.GOOMBA, x, y);
        this.vx = -1.2;
        this.width = 28;
        this.height = 26;
    }

    _drawEnemy(ctx) {
        const w = this.width;
        const h = this.height;
        const walkBob = Math.sin(this.animTimer * 6) * 1.5;

        // 体
        const bodyGrd = ctx.createRadialGradient(w / 2, h * 0.5, 2, w / 2, h * 0.5, w * 0.6);
        bodyGrd.addColorStop(0, '#cc8844');
        bodyGrd.addColorStop(1, '#995522');
        ctx.fillStyle = bodyGrd;
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.55, w * 0.45, h * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#663311';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 足
        const footSpread = Math.sin(this.animTimer * 6) * 3;
        ctx.fillStyle = '#664422';
        ctx.beginPath();
        ctx.ellipse(w * 0.3 - footSpread, h - 3, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w * 0.7 + footSpread, h - 3, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // 怒り眉
        ctx.strokeStyle = '#442200';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w * 0.2, h * 0.3);
        ctx.lineTo(w * 0.4, h * 0.35);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(w * 0.8, h * 0.3);
        ctx.lineTo(w * 0.6, h * 0.35);
        ctx.stroke();

        // 目
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(w * 0.35, h * 0.4, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w * 0.65, h * 0.4, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#222222';
        ctx.beginPath();
        ctx.arc(w * 0.37, h * 0.42, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w * 0.67, h * 0.42, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // 口
        ctx.fillStyle = '#442200';
        ctx.beginPath();
        ctx.moveTo(w * 0.35, h * 0.6);
        ctx.quadraticCurveTo(w * 0.5, h * 0.7, w * 0.65, h * 0.6);
        ctx.quadraticCurveTo(w * 0.5, h * 0.55, w * 0.35, h * 0.6);
        ctx.fill();

        // 牙
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(w * 0.4, h * 0.6);
        ctx.lineTo(w * 0.42, h * 0.65);
        ctx.lineTo(w * 0.44, h * 0.6);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(w * 0.56, h * 0.6);
        ctx.lineTo(w * 0.58, h * 0.65);
        ctx.lineTo(w * 0.6, h * 0.6);
        ctx.fill();
    }
}


class Koopa extends Enemy {
    constructor(x, y) {
        super(ENEMY_TYPE.KOOPA, x, y);
        this.vx = -1.0;
        this.width = 26;
        this.height = 34;
        this.inShell = false;
        this.shellSpeed = 6;
    }

    onStomp(player, audio, particles) {
        if (this.inShell) {
            // 甲羅を蹴る
            this.vx = player.getCenterX() < this.x + this.width / 2 ? this.shellSpeed : -this.shellSpeed;
            player.stomp(audio, particles);
            return true;
        }
        this.inShell = true;
        this.vx = 0;
        this.height = 22;
        player.stomp(audio, particles);
        return true;
    }

    _drawEnemy(ctx) {
        const w = this.width;
        const h = this.height;

        if (this.inShell) {
            // 甲羅
            const shellGrd = ctx.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);
            shellGrd.addColorStop(0, '#44cc44');
            shellGrd.addColorStop(1, '#228822');
            ctx.fillStyle = shellGrd;
            ctx.beginPath();
            ctx.ellipse(w / 2, h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#115511';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 甲羅模様
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(w * 0.3, h * 0.2);
            ctx.lineTo(w * 0.7, h * 0.8);
            ctx.moveTo(w * 0.7, h * 0.2);
            ctx.lineTo(w * 0.3, h * 0.8);
            ctx.stroke();
            return;
        }

        // 足
        const footAnim = Math.sin(this.animTimer * 5) * 2;
        ctx.fillStyle = '#ffcc66';
        ctx.beginPath();
        ctx.ellipse(w * 0.3, h - 3 + footAnim, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w * 0.7, h - 3 - footAnim, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 甲羅（背中）
        const shellGrd = ctx.createRadialGradient(w / 2, h * 0.5, 3, w / 2, h * 0.5, w / 2);
        shellGrd.addColorStop(0, '#44cc44');
        shellGrd.addColorStop(1, '#228822');
        ctx.fillStyle = shellGrd;
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.5, w * 0.45, h * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#115511';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 頭
        ctx.fillStyle = '#ffcc66';
        ctx.beginPath();
        ctx.ellipse(w * 0.75, h * 0.2, 7, 8, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cc9933';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 目
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(w * 0.8, h * 0.17, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#222222';
        ctx.beginPath();
        ctx.arc(w * 0.82, h * 0.18, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}


class SurpriseEnemy extends Enemy {
    constructor(x, y, config = {}) {
        super(ENEMY_TYPE.SURPRISE_ENEMY, x, y);
        this.triggerDistance = config.triggerDistance || 80;
        this.spawnDirection = config.direction || 'up';
        this.hidden = true;
        this.spawnSpeed = config.speed || 8;
        this.childType = config.childType || 'goomba';
        this.active = true;
        this.stompable = false;
        this.deadly = false;
    }

    update(dt, level, player) {
        if (!this.alive) return;

        if (this.hidden && player) {
            const dist = Math.abs(player.getCenterX() - (this.x + this.width / 2));
            if (dist < this.triggerDistance) {
                this.hidden = false;
                this.stompable = true;
                this.deadly = true;
                if (this.spawnDirection === 'up') {
                    this.vy = -this.spawnSpeed;
                } else if (this.spawnDirection === 'left') {
                    this.vx = -this.spawnSpeed;
                } else if (this.spawnDirection === 'right') {
                    this.vx = this.spawnSpeed;
                } else if (this.spawnDirection === 'down') {
                    this.vy = this.spawnSpeed;
                }
            }
        }

        if (!this.hidden) {
            super.update(dt, level, player);
        }
    }

    draw(ctx, camera) {
        if (this.hidden) return;
        super.draw(ctx, camera);
    }

    _drawEnemy(ctx) {
        // サプライズ敵 = クリボーのような見た目だが赤い
        const w = this.width;
        const h = this.height;

        const bodyGrd = ctx.createRadialGradient(w / 2, h * 0.5, 2, w / 2, h * 0.5, w * 0.6);
        bodyGrd.addColorStop(0, '#ee5544');
        bodyGrd.addColorStop(1, '#aa2211');
        ctx.fillStyle = bodyGrd;
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.55, w * 0.45, h * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#881100';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 目（びっくりマーク）
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', w / 2, h * 0.4);
    }
}


class PiranhaPlant extends Enemy {
    constructor(x, y) {
        super(ENEMY_TYPE.PIRANHA, x, y);
        this.width = 26;
        this.height = 32;
        this.stompable = false;
        this.baseY = y;
        this.emergeTimer = 0;
        this.emergePhase = 'hidden';
        this.emergeSpeed = 1;
        this.hiddenY = y + 32;
        this.shownY = y;
        this.active = true;
    }

    update(dt, level, player) {
        if (!this.alive) return;
        this.animTimer += dt;
        this.emergeTimer += dt;

        const cycleTime = 4;
        const t = (this.emergeTimer % cycleTime) / cycleTime;

        if (t < 0.25) {
            this.y = MathUtils.lerp(this.hiddenY, this.shownY, t / 0.25);
            this.emergePhase = 'emerging';
        } else if (t < 0.5) {
            this.y = this.shownY;
            this.emergePhase = 'shown';
        } else if (t < 0.75) {
            this.y = MathUtils.lerp(this.shownY, this.hiddenY, (t - 0.5) / 0.25);
            this.emergePhase = 'hiding';
        } else {
            this.y = this.hiddenY;
            this.emergePhase = 'hidden';
        }
    }

    checkCollisionWithPlayer(player) {
        if (this.emergePhase === 'hidden') return null;
        return super.checkCollisionWithPlayer(player);
    }

    _drawEnemy(ctx) {
        const w = this.width;
        const h = this.height;

        // 茎
        ctx.fillStyle = '#33aa33';
        ctx.fillRect(w / 2 - 4, h * 0.5, 8, h * 0.5);

        // 頭
        const headGrd = ctx.createRadialGradient(w / 2, h * 0.3, 2, w / 2, h * 0.3, 14);
        headGrd.addColorStop(0, '#ff4444');
        headGrd.addColorStop(1, '#cc1111');
        ctx.fillStyle = headGrd;
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.3, 13, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // 白い斑点
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.ellipse(w * 0.35, h * 0.22, 3, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w * 0.65, h * 0.27, 2, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // 口（パクパク）
        const mouthOpen = Math.sin(this.animTimer * 4) * 3;
        ctx.fillStyle = '#220000';
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.35, 8, 2 + Math.abs(mouthOpen), 0, 0, Math.PI * 2);
        ctx.fill();

        // 歯
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 4; i++) {
            const tx = w * 0.3 + i * (w * 0.13);
            ctx.beginPath();
            ctx.moveTo(tx, h * 0.32);
            ctx.lineTo(tx + 2, h * 0.38 + mouthOpen * 0.5);
            ctx.lineTo(tx + 4, h * 0.32);
            ctx.closePath();
            ctx.fill();
        }

        // リップ
        ctx.strokeStyle = '#990000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(w / 2, h * 0.3, 13, 10, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
}


class FakePowerup extends Enemy {

class Bullet extends Enemy {
    constructor(x, y, dirX = -1) {
        super(ENEMY_TYPE.BULLET, x, y);
        this.width = 24;
        this.height = 20;
        this.vx = dirX * 4;
        this.vy = 0;
        this.stompable = true;
        this.active = true;
    }

    update(dt, level, player) {
        if (!this.alive) return;
        if (this.dying) {
            this._updateDying(dt);
            return;
        }
        this.animTimer += dt;
        this.x += this.vx;
        // 弾丸は重力なし
        if (this.x < -100 || this.x > 10000) {
            this.alive = false;
        }
    }

    _resolveCollision(level) {
        // 弾丸は地形を無視
    }

    _drawEnemy(ctx) {
        const w = this.width;
        const h = this.height;

        // 本体
        const bodyGrd = ctx.createLinearGradient(0, 0, 0, h);
        bodyGrd.addColorStop(0, '#444444');
        bodyGrd.addColorStop(0.5, '#222222');
        bodyGrd.addColorStop(1, '#333333');
        ctx.fillStyle = bodyGrd;
        ctx.beginPath();
        ctx.ellipse(w / 2, h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(w * 0.65, h * 0.35, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#222222';
        ctx.beginPath();
        ctx.arc(w * 0.67, h * 0.37, 2, 0, Math.PI * 2);
        ctx.fill();

        // 怒り眉
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w * 0.55, h * 0.25);
        ctx.lineTo(w * 0.75, h * 0.2);
        ctx.stroke();

        // 炎エフェクト
        const flameX = this.vx > 0 ? 0 : w;
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.moveTo(flameX, h * 0.3);
        ctx.lineTo(flameX + (this.vx > 0 ? -8 : 8), h / 2);
        ctx.lineTo(flameX, h * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.moveTo(flameX, h * 0.4);
        ctx.lineTo(flameX + (this.vx > 0 ? -5 : 5), h / 2);
        ctx.lineTo(flameX, h * 0.6);
        ctx.closePath();
        ctx.fill();
    }
}


class Thwomp extends Enemy {
    constructor(x, y) {
        super(ENEMY_TYPE.THWOMP, x, y);
        this.width = 48;
        this.height = 48;
        this.stompable = false;
        this.baseY = y;
        this.state = 'waiting';
        this.fallSpeed = 10;
        this.riseSpeed = 1;
        this.waitTimer = 0;
        this.active = true;
        this.triggerDistance = 64;
    }

    update(dt, level, player) {
        if (!this.alive) return;
        this.animTimer += dt;

        switch (this.state) {
            case 'waiting':
                if (player && Math.abs(player.getCenterX() - (this.x + this.width / 2)) < this.triggerDistance) {
                    this.state = 'falling';
                }
                this.y = this.baseY + Math.sin(this.animTimer * 2) * 2;
                break;
            case 'falling':
                this.vy += 1.5;
                this.y += this.vy;
                // 地面チェック
                const footTile = level.getTile(
                    Math.floor((this.x + this.width / 2) / TILE_SIZE),
                    Math.floor((this.y + this.height) / TILE_SIZE)
                );
                if (this._isSolidForEnemy(footTile, level, 0, 0) ||
                    this.y > this.baseY + 200) {
                    this.state = 'grounded';
                    this.vy = 0;
                    this.waitTimer = 1.5;
                }
                break;
            case 'grounded':
                this.waitTimer -= dt;
                if (this.waitTimer <= 0) {
                    this.state = 'rising';
                }
                break;
            case 'rising':
                this.y -= this.riseSpeed;
                if (this.y <= this.baseY) {
                    this.y = this.baseY;
                    this.state = 'waiting';
                    this.vy = 0;
                }
                break;
        }
    }

    _drawEnemy(ctx) {
        const w = this.width;
        const h = this.height;

        // メイン石ブロック
        const stoneGrd = ctx.createLinearGradient(0, 0, 0, h);
        stoneGrd.addColorStop(0, '#bbbbbb');
        stoneGrd.addColorStop(0.5, '#999999');
        stoneGrd.addColorStop(1, '#777777');
        ctx.fillStyle = stoneGrd;
        ctx.fillRect(2, 2, w - 4, h - 4);

        ctx.strokeStyle = '#666666';
        ctx.lineWidth = 2;
        ctx.strokeRect(2, 2, w - 4, h - 4);

        // スパイク（下）
        for (let i = 0; i < 4; i++) {
            const sx = 6 + i * 11;
            ctx.fillStyle = '#aaaaaa';
            ctx.beginPath();
            ctx.moveTo(sx, h - 2);
            ctx.lineTo(sx + 5, h + 6);
            ctx.lineTo(sx + 10, h - 2);
            ctx.closePath();
            ctx.fill();
        }

        // 怒った顔
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(w * 0.3, h * 0.35, 6, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(w * 0.7, h * 0.35, 6, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#222222';
        const lookDir = this.state === 'falling' ? 2 : 0;
        ctx.beginPath();
        ctx.arc(w * 0.3, h * 0.37 + lookDir, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w * 0.7, h * 0.37 + lookDir, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // 眉毛
        ctx.strokeStyle = '#555555';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w * 0.15, h * 0.22);
        ctx.lineTo(w * 0.4, h * 0.28);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(w * 0.85, h * 0.22);
        ctx.lineTo(w * 0.6, h * 0.28);
        ctx.stroke();

        // 口
        ctx.fillStyle = '#444444';
        ctx.beginPath();
        ctx.moveTo(w * 0.3, h * 0.6);
        ctx.quadraticCurveTo(w * 0.5, h * 0.7, w * 0.7, h * 0.6);
        ctx.lineTo(w * 0.7, h * 0.65);
        ctx.quadraticCurveTo(w * 0.5, h * 0.75, w * 0.3, h * 0.65);
        ctx.closePath();
        ctx.fill();

        // 石テクスチャ
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        for (let i = 0; i < 5; i++) {
            ctx.fillRect(5 + i * 10, 5 + (i % 3) * 12, 6, 4);
        }
    }
}

class LegacyLevel {
    constructor() {
        this.tiles = [];
        this.tileData = {};
        this.enemies = [];
        this.width = 0;
        this.height = 20;
        this.theme = 'overworld';
        this.playerStartX = 100;
        this.playerStartY = 400;
        this.events = new EventEmitter();
        this.stageNumber = 1;
        this.bossActive = false;
        this.bossDefeated = false;
        this.goalReachedFlag = false;
        this.dynamicTiles = [];
        this.movingPlatforms = [];
        this.warps = {};
        this.trapTriggers = [];
        this.timedBlockTimer = 0;
        this.risingBlocks = [];
    }

    init(stageNum) {
        this.stageNumber = stageNum;
        this.tiles = [];
        this.tileData = {};
        this.enemies = [];
        this.dynamicTiles = [];
        this.movingPlatforms = [];
        this.risingBlocks = [];
        this.bossActive = false;
        this.bossDefeated = false;
        this.goalReachedFlag = false;
        this.timedBlockTimer = 0;
    }

    setSize(cols, rows) {
        this.width = cols;
        this.height = rows || 20;
        this.tiles = new Array(cols * this.height).fill(TILE.EMPTY);
    }

    getTile(x, y) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height) return TILE.EMPTY;
        return this.tiles[y * this.width + x];
    }

    setTile(x, y, type) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height) return;
        this.tiles[y * this.width + x] = type;
    }

    getTileData(x, y) {
        const key = `${x},${y}`;
        return this.tileData[key] || null;
    }

    setTileData(x, y, data) {
        const key = `${x},${y}`;
        this.tileData[key] = { ...(this.tileData[key] || {}), ...data };
    }

    addEnemy(enemy) {
        this.enemies.push(enemy);
    }

    triggerBoss() {
        this.bossActive = true;
        this.events.emit('bossStart');
    }

    goalReached() {
        if (this.goalReachedFlag) return;
        this.goalReachedFlag = true;
        this.events.emit('goalReached');
    }

    update(dt, player) {
        this.timedBlockTimer += dt;

        // 落下床の更新
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                const tile = this.getTile(x, y);
                const data = this.getTileData(x, y);
                if (!data) continue;

                if (tile === TILE.FALLING_GROUND && data.triggered && !data.fallen) {
                    data.timer -= dt;
                    if (data.timer <= 0) {
                        data.fallen = true;
                        data.shaking = false;
                    }
                }

                // バウンスアニメーション（?ブロック）
                if (data.bounceOffset && data.bounceOffset < 0) {
                    data.bounceOffset = MathUtils.lerp(data.bounceOffset, 0, 0.15);
                    if (Math.abs(data.bounceOffset) < 0.5) data.bounceOffset = 0;
                }

                // 上昇ブロック
                if (data.rising) {
                    data.riseOffset = (data.riseOffset || 0) + (data.riseSpeed || -2);
                    // 実際にタイルを移動
                    if (data.riseOffset < -200) {
                        this.setTile(x, y, TILE.EMPTY);
                        data.rising = false;
                    }
                }

                // スプリング復帰
                if ((tile === TILE.SPRING || tile === TILE.TRAMPOLINE) && data.timer !== undefined) {
                    data.timer -= dt;
                    if (data.timer <= 0) {
                        data.compressed = false;
                        data.bouncing = false;
                    }
                }

                // タイムドブロック
                if (tile === TILE.TIMED_BLOCK) {
                    data.phase = ((this.timedBlockTimer + (data.offset || 0)) % 3) / 3;
                }

                // 消えるブロック
                if (tile === TILE.VANISH_BLOCK && data.vanishing) {
                    data.alpha = (data.alpha || 1) - dt * 2;
                    if (data.alpha <= 0) {
                        data.vanished = true;
                        data.vanishing = false;
                        data.reappearTimer = 3;
                    }
                }
                if (tile === TILE.VANISH_BLOCK && data.vanished) {
                    data.reappearTimer -= dt;
                    if (data.reappearTimer <= 0) {
                        data.vanished = false;
                        data.alpha = 1;
                    }
                }
            }
        }

        // 敵の更新
        for (const enemy of this.enemies) {
            if (!enemy.alive) continue;
            enemy.checkActivation(player ? player.x : 0);
            enemy.update(dt, this, player);
        }

        // 死亡した敵の除去
        this.enemies = this.enemies.filter(e => e.alive || (e.dying && e.deathTimer < 2));
    }

    draw(ctx, camera, tileRenderer) {
        const drawX = camera.getDrawX();
        const startCol = Math.max(0, Math.floor(-drawX / TILE_SIZE) - 1);
        const endCol = Math.min(this.width, startCol + TILE_COLS_VISIBLE + 2);

        for (let y = 0; y < this.height; y++) {
            for (let x = startCol; x < endCol; x++) {
                const tile = this.getTile(x, y);
                if (tile === TILE.EMPTY) continue;

                let tileX = x * TILE_SIZE + drawX;
                let tileY = y * TILE_SIZE + camera.getDrawY();

                const data = this.getTileData(x, y);

                // 上昇ブロックのオフセット
                if (data && data.riseOffset) {
                    tileY += data.riseOffset;
                }

                if (tileX > GAME_WIDTH + TILE_SIZE || tileX < -TILE_SIZE * 2) continue;
                if (tileY > GAME_HEIGHT + TILE_SIZE || tileY < -TILE_SIZE * 2) continue;

                tileRenderer.drawTile(ctx, tile, tileX, tileY, data);
            }
        }
    }

    drawEnemies(ctx, camera) {
        for (const enemy of this.enemies) {
            enemy.draw(ctx, camera);
        }
    }

    getPixelWidth() {
        return this.width * TILE_SIZE;
    }
}
