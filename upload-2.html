class GameExtension {
    constructor(game) {
        this.game = game;
        this.extTileRenderer = new ExtendedTileRenderer(game.tileRenderer);
        this.extTrapManager = new ExtendedTrapManager(game.trapManager);
        this.extEnemyManager = new ExtendedEnemyManager(game.enemyManager);
        this.deathMessages = [
            '(´;ω;`) しょぼーん...',
            '(´・ω・`) まだまだだね',
            '(；´д`) ぐはっ！',
            '(´;ω;`) なんでやねん...',
            '( ﾟдﾟ) そんな...',
            '(´・ω・`) 知ってた',
            '(´;ω;`) 理不尽！',
            '(；\'∀\') あちゃー',
            '(´・ω・`) ドンマイ',
            '(´;ω;`) 覚えたぞ...',
            '(´・ω・`) 初見殺し...',
            '( ；∀；) もう嫌だ',
            '(´;ω;`) 全てが罠',
            '(´・ω・`) 信じたのに...',
            '(；つД`) うわあぁぁ',
            '(´・ω・`) これは酷い'
        ];
        this.deathCount = 0;
        this.totalDeaths = 0;
        this.stageDeaths = {};
        this.achievements = [];
        this.achievementDefs = this._initAchievements();
        this.comboRecord = 0;
        this.speedrunTimer = 0;
        this.speedrunActive = false;
        this.hintsEnabled = true;
        this.hintTimer = 0;
        this.trapHistory = [];
    }

    _initAchievements() {
        return [
            { id: 'first_death', name: '初死亡', desc: '初めて死んだ', condition: () => this.totalDeaths >= 1 },
            { id: 'die_10', name: '死の洗礼', desc: '10回死んだ', condition: () => this.totalDeaths >= 10 },
            { id: 'die_50', name: '不屈の精神', desc: '50回死んだ', condition: () => this.totalDeaths >= 50 },
            { id: 'die_100', name: 'しょぼんマスター', desc: '100回死んだ', condition: () => this.totalDeaths >= 100 },
            { id: 'combo_3', name: 'コンボ初心者', desc: '3コンボ達成', condition: () => this.comboRecord >= 3 },
            { id: 'combo_5', name: 'コンボマスター', desc: '5コンボ達成', condition: () => this.comboRecord >= 5 },
            { id: 'no_coin', name: '無欲', desc: 'コインを1枚も取らずにクリア', condition: () => false },
            { id: 'speedrun', name: 'スピードランナー', desc: '5分以内にクリア', condition: () => false },
            { id: 'fake_coin_death', name: '欲張り', desc: '偽コインで死んだ', condition: () => this.trapHistory.includes('fake_coin') },
            { id: 'fake_goal_death', name: '早とちり', desc: '偽ゴールで死んだ', condition: () => this.trapHistory.includes('fake_goal') },
            { id: 'lava_death', name: '熱い！', desc: '溶岩で死んだ', condition: () => this.trapHistory.includes('lava') },
            { id: 'trap_all', name: 'トラップコレクター', desc: '全種類のトラップで死んだ', condition: () => this.trapHistory.length >= 10 },
            { id: 'boss_kill', name: 'オニオンスレイヤー', desc: 'オニオンキングを倒した', condition: () => false },
            { id: 'stage1_clear', name: 'ステージ1クリア', desc: 'ステージ1をクリアした', condition: () => false },
            { id: 'all_clear', name: '完全制覇', desc: '全ステージクリア', condition: () => false }
        ];
    }

    update(dt) {
        const game = this.game;
        this.extTileRenderer.update(dt);

        if (game.state === STATE.PLAYING && game.level) {
            this.extTrapManager.update(dt, game.level, game.player, game);

            // 拡張敵の更新
            for (const enemy of game.enemyManager.enemies) {
                if (!enemy.alive || !enemy.active) continue;
                if (enemy.type >= 25) {
                    this.extEnemyManager.updateEnemy(enemy, dt, game.player, game.level, game);
                }
            }

            // スピードラン
            if (this.speedrunActive) {
                this.speedrunTimer += dt;
            }

            // ヒントシステム
            this._updateHints(dt, game);

            // 実績チェック
            this._checkAchievements(game);
        }
    }

    _updateHints(dt, game) {
        if (!this.hintsEnabled) return;
        this.hintTimer += dt;

        // 同じ場所で何度も死んだらヒント表示
        if (game.player.alive === false && this.deathCount > 0) {
            const deathX = Math.floor(game.player.x / TILE_SIZE);
            const key = `${game.currentStage}_${deathX}`;
            if (!this.stageDeaths[key]) this.stageDeaths[key] = 0;
            this.stageDeaths[key]++;

            if (this.stageDeaths[key] >= 3 && this.stageDeaths[key] % 3 === 0) {
                const hints = [
                    'ヒント: 地面が全て安全とは限らない',
                    'ヒント: ?ブロックにも罠がある',
                    'ヒント: ゴールに見えても信じるな',
                    'ヒント: 敵が出てくる場所を覚えよう',
                    'ヒント: 見えないブロックがあるかも',
                    'ヒント: 矢印看板は信じるな',
                    'ヒント: キラキラしたコインは偽物かも',
                    'ヒント: 上からも下からも攻撃が来る'
                ];
                const hint = hints[Math.floor(Math.random() * hints.length)];
                game.ui.showNotification(hint, 3.0);
            }
        }
    }

    _checkAchievements(game) {
        for (const ach of this.achievementDefs) {
            if (this.achievements.includes(ach.id)) continue;
            if (ach.condition()) {
                this.achievements.push(ach.id);
                game.ui.showNotification(`🏆 実績解除: ${ach.name}`, 3.0);
                game.audio.play('oneup', 0.6);
            }
        }
    }

    onPlayerDeath(deathType) {
        this.deathCount++;
        this.totalDeaths++;
        if (deathType && !this.trapHistory.includes(deathType)) {
            this.trapHistory.push(deathType);
        }
        // コンボ記録
        if (this.game.player.comboCount > this.comboRecord) {
            this.comboRecord = this.game.player.comboCount;
        }
    }

    getRandomDeathMessage() {
        return this.deathMessages[Math.floor(Math.random() * this.deathMessages.length)];
    }

    drawExtendedTiles(ctx, level, camera) {
        if (!level) return;
        const drawX = camera.getDrawX();
        const drawY = camera.getDrawY();
        const startCol = Math.max(0, Math.floor(-drawX / TILE_SIZE) - 1);
        const endCol = Math.min(level.width, startCol + TILE_COLS_VISIBLE + 2);

        for (let row = 0; row < level.height; row++) {
            for (let col = startCol; col < endCol; col++) {
                const tile = level.getTile(col, row);
                if (tile >= 51) {
                    const data = level.getTileData(col, row);
                    const x = col * TILE_SIZE + drawX;
                    const y = row * TILE_SIZE + drawY;
                    this.extTileRenderer.drawTile(ctx, tile, x, y, data);
                }
            }
        }
    }

    drawExtendedEnemies(ctx, camera) {
        const drawX = camera.getDrawX();
        const drawY = camera.getDrawY();

        for (const enemy of this.game.enemyManager.enemies) {
            if (!enemy.active || enemy.hidden) continue;
            if (enemy.type < 25) continue;
            const sx = enemy.x + drawX;
            const sy = enemy.y + drawY;
            if (sx < -60 || sx > GAME_WIDTH + 60 || sy < -60 || sy > GAME_HEIGHT + 60) continue;

            if (!enemy.alive) {
                if (enemy.deathTimer < 0.5) {
                    ctx.save();
                    ctx.globalAlpha = 1 - enemy.deathTimer * 2;
                    ctx.translate(sx + (enemy.width || 28) / 2, sy + (enemy.height || 28) / 2);
                    ctx.scale(1, -1);
                    this.extEnemyManager.drawEnemy(ctx, enemy, -(enemy.width || 28) / 2, -(enemy.height || 28) / 2);
                    ctx.restore();
                }
                continue;
            }

            this.extEnemyManager.drawEnemy(ctx, enemy, sx, sy);
        }
    }

    drawExtendedOverlays(ctx, camera, level, player) {
        this.extTrapManager.drawOverlays(ctx, camera, level, player);
    }

    drawDeathScreen(ctx, player) {
        if (!player.alive) {
            const msg = this.getRandomDeathMessage();
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(GAME_WIDTH / 2 - 180, GAME_HEIGHT / 2 + 50, 360, 40);
            ctx.font = '18px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffaaaa';
            ctx.fillText(msg, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 70);
            ctx.restore();
        }
    }

    drawStats(ctx) {
        ctx.save();
        ctx.font = '14px "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(`Deaths: ${this.totalDeaths}`, 20, GAME_HEIGHT - 20);
        if (this.speedrunActive) {
            const mins = Math.floor(this.speedrunTimer / 60);
            const secs = Math.floor(this.speedrunTimer % 60);
            const ms = Math.floor((this.speedrunTimer % 1) * 100);
            ctx.fillText(`Time: ${mins}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`, 20, GAME_HEIGHT - 40);
        }
        ctx.restore();
    }

    drawAchievementList(ctx) {
        if (this.achievements.length === 0) return;
        ctx.save();
        ctx.font = '12px "Segoe UI", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,215,0,0.6)';
        let ay = GAME_HEIGHT - 20;
        for (let i = this.achievements.length - 1; i >= Math.max(0, this.achievements.length - 3); i--) {
            const ach = this.achievementDefs.find(a => a.id === this.achievements[i]);
            if (ach) {
                ctx.fillText(`🏆 ${ach.name}`, GAME_WIDTH - 20, ay);
                ay -= 18;
            }
        }
        ctx.restore();
    }
}

// SECTION 38: 天候エフェクトシステム
// ============================================================

class WeatherSystem {
    constructor() {
        this.type = 'none';
        this.particles = [];
        this.windX = 0;
        this.windY = 0;
        this.intensity = 1.0;
        this.time = 0;
        this.lightningTimer = 0;
        this.lightningFlash = 0;
        this.fogAlpha = 0;
    }

    setWeather(type, intensity = 1.0) {
        this.type = type;
        this.intensity = intensity;
        this.particles = [];
        this._initParticles();
    }

    _initParticles() {
        const count = Math.floor(this.intensity * 100);
        for (let i = 0; i < count; i++) {
            this.particles.push(this._createParticle());
        }
    }

    _createParticle() {
        switch (this.type) {
            case 'rain':
                return {
                    x: MathUtils.randomRange(-50, GAME_WIDTH + 50),
                    y: MathUtils.randomRange(-50, GAME_HEIGHT),
                    vx: this.windX + MathUtils.randomRange(-0.5, 0.5),
                    vy: MathUtils.randomRange(8, 14) * this.intensity,
                    length: MathUtils.randomRange(8, 16),
                    alpha: MathUtils.randomRange(0.2, 0.5)
                };
            case 'snow':
                return {
                    x: MathUtils.randomRange(-20, GAME_WIDTH + 20),
                    y: MathUtils.randomRange(-20, GAME_HEIGHT),
                    vx: MathUtils.randomRange(-1, 1) + this.windX * 0.3,
                    vy: MathUtils.randomRange(0.5, 2) * this.intensity,
                    size: MathUtils.randomRange(2, 5),
                    alpha: MathUtils.randomRange(0.4, 0.9),
                    wobble: MathUtils.randomRange(0, Math.PI * 2),
                    wobbleSpeed: MathUtils.randomRange(1, 3)
                };
            case 'storm':
                return {
                    x: MathUtils.randomRange(-100, GAME_WIDTH + 100),
                    y: MathUtils.randomRange(-50, GAME_HEIGHT),
                    vx: this.windX * 2 + MathUtils.randomRange(-2, 2),
                    vy: MathUtils.randomRange(12, 20) * this.intensity,
                    length: MathUtils.randomRange(12, 24),
                    alpha: MathUtils.randomRange(0.3, 0.7)
                };
            case 'fog':
                return {
                    x: MathUtils.randomRange(0, GAME_WIDTH),
                    y: MathUtils.randomRange(0, GAME_HEIGHT),
                    vx: MathUtils.randomRange(-0.3, 0.3),
                    vy: MathUtils.randomRange(-0.1, 0.1),
                    size: MathUtils.randomRange(80, 200),
                    alpha: MathUtils.randomRange(0.05, 0.15)
                };
            case 'ash':
                return {
                    x: MathUtils.randomRange(0, GAME_WIDTH),
                    y: MathUtils.randomRange(-20, GAME_HEIGHT),
                    vx: MathUtils.randomRange(-0.5, 0.5),
                    vy: MathUtils.randomRange(0.3, 1.5),
                    size: MathUtils.randomRange(1, 4),
                    alpha: MathUtils.randomRange(0.2, 0.5),
                    color: MathUtils.randomRange(0, 1) > 0.5 ? '#888' : '#aa6633'
                };
            default:
                return { x: 0, y: 0, vx: 0, vy: 0 };
        }
    }

    update(dt) {
        this.time += dt;
        if (this.type === 'none') return;

        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (this.type === 'snow') {
                p.wobble += p.wobbleSpeed * dt;
                p.x += Math.sin(p.wobble) * 0.5;
            }

            // 画面外で再配置
            if (p.y > GAME_HEIGHT + 30 || p.x > GAME_WIDTH + 100 || p.x < -100) {
                this.particles[i] = this._createParticle();
                this.particles[i].y = -MathUtils.randomRange(10, 50);
            }
        }

        // 嵐の稲光
        if (this.type === 'storm') {
            this.lightningTimer += dt;
            if (this.lightningTimer > MathUtils.randomRange(3, 8)) {
                this.lightningTimer = 0;
                this.lightningFlash = 0.8;
            }
            if (this.lightningFlash > 0) {
                this.lightningFlash -= dt * 3;
                if (this.lightningFlash < 0) this.lightningFlash = 0;
            }
        }
    }

    draw(ctx) {
        if (this.type === 'none') return;

        switch (this.type) {
            case 'rain':
            case 'storm':
                this._drawRain(ctx);
                break;
            case 'snow':
                this._drawSnow(ctx);
                break;
            case 'fog':
                this._drawFog(ctx);
                break;
            case 'ash':
                this._drawAsh(ctx);
                break;
        }

        // 稲光
        if (this.lightningFlash > 0) {
            ctx.fillStyle = `rgba(255,255,255,${this.lightningFlash})`;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }
    }

    _drawRain(ctx) {
        ctx.strokeStyle = 'rgba(150,180,220,0.6)';
        ctx.lineWidth = 1.5;
        for (const p of this.particles) {
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.vx * 0.5, p.y + p.length);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    _drawSnow(ctx) {
        for (const p of this.particles) {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    _drawFog(ctx) {
        for (const p of this.particles) {
            ctx.globalAlpha = p.alpha;
            const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
            grd.addColorStop(0, 'rgba(200,200,220,0.15)');
            grd.addColorStop(1, 'rgba(200,200,220,0)');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    _drawAsh(ctx) {
        for (const p of this.particles) {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color || '#888';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}


// ============================================================
// SECTION 39: パララックス背景拡張
// ============================================================

class ParallaxBackground {
    constructor() {
        this.layers = [];
        this.type = 'overworld';
    }

    init(type) {
        this.type = type;
        this.layers = [];

        switch (type) {
            case 'overworld':
                this._initOverworldLayers();
                break;
            case 'underground':
                this._initUndergroundLayers();
                break;
            case 'sky':
                this._initSkyLayers();
                break;
            case 'castle':
                this._initCastleLayers();
                break;
        }
    }

    _initOverworldLayers() {
        // Layer 0: 空（最遠景）
        this.layers.push({
            parallax: 0,
            draw: (ctx, offset) => {
                const grd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                grd.addColorStop(0, '#4488DD');
                grd.addColorStop(0.35, '#66AAEE');
                grd.addColorStop(0.65, '#99CCFF');
                grd.addColorStop(1, '#CCEECC');
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
        });

        // Layer 1: 遠い山
        this.layers.push({
            parallax: 0.05,
            mountains: this._generateMountains(6, 0.3, '#667799', '#556688'),
            draw: function(ctx, offset) {
                for (const m of this.mountains) {
                    const x = m.x + offset * this.parallax;
                    ctx.fillStyle = m.color;
                    ctx.beginPath();
                    ctx.moveTo(x - m.w / 2, GAME_HEIGHT - 80);
                    ctx.quadraticCurveTo(x, GAME_HEIGHT - 80 - m.h, x + m.w / 2, GAME_HEIGHT - 80);
                    ctx.fill();
                }
            }
        });

        // Layer 2: 近い山
        this.layers.push({
            parallax: 0.12,
            mountains: this._generateMountains(8, 0.5, '#558866', '#447755'),
            draw: function(ctx, offset) {
                for (const m of this.mountains) {
                    const x = m.x + offset * this.parallax;
                    ctx.fillStyle = m.color;
                    ctx.beginPath();
                    ctx.moveTo(x - m.w / 2, GAME_HEIGHT - 60);
                    ctx.quadraticCurveTo(x - m.w * 0.15, GAME_HEIGHT - 60 - m.h * 0.7, x, GAME_HEIGHT - 60 - m.h);
                    ctx.quadraticCurveTo(x + m.w * 0.15, GAME_HEIGHT - 60 - m.h * 0.8, x + m.w / 2, GAME_HEIGHT - 60);
                    ctx.fill();
                }
            }
        });

        // Layer 3: 森林
        this.layers.push({
            parallax: 0.2,
            trees: this._generateTrees(25),
            draw: function(ctx, offset) {
                for (const t of this.trees) {
                    const x = t.x + offset * this.parallax;
                    if (x < -50 || x > GAME_WIDTH + 50) continue;
                    // 幹
                    ctx.fillStyle = '#664422';
                    ctx.fillRect(x - 3, GAME_HEIGHT - 40 - t.h + t.crownH, 6, t.h - t.crownH);
                    // 葉
                    ctx.fillStyle = t.color;
                    ctx.beginPath();
                    ctx.ellipse(x, GAME_HEIGHT - 40 - t.h + t.crownH / 2, t.crownW / 2, t.crownH / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        });

        // Layer 4: 近景の草
        this.layers.push({
            parallax: 0.35,
            draw: (ctx, offset) => {
                const grassY = GAME_HEIGHT - 30;
                ctx.fillStyle = '#44AA44';
                ctx.fillRect(0, grassY, GAME_WIDTH, 30);
                ctx.fillStyle = '#55BB55';
                for (let gx = 0; gx < GAME_WIDTH; gx += 12) {
                    const realX = gx - (offset * 0.35) % 12;
                    const grassH = 4 + Math.sin(realX * 0.3) * 3;
                    ctx.fillRect(realX, grassY - grassH, 3, grassH);
                }
            }
        });
    }

    _initUndergroundLayers() {
        this.layers.push({
            parallax: 0,
            draw: (ctx, offset) => {
                ctx.fillStyle = '#0a0a18';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
        });
        this.layers.push({
            parallax: 0.05,
            stalactites: Array.from({ length: 30 }, () => ({
                x: MathUtils.randomRange(0, 5000),
                y: 0,
                h: MathUtils.randomRange(20, 80),
                w: MathUtils.randomRange(6, 20),
                color: `rgba(${MathUtils.randomInt(40, 80)},${MathUtils.randomInt(40, 80)},${MathUtils.randomInt(60, 100)},0.5)`
            })),
            draw: function(ctx, offset) {
                for (const s of this.stalactites) {
                    const x = s.x + offset * this.parallax;
                    if (x < -30 || x > GAME_WIDTH + 30) continue;
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.moveTo(x - s.w / 2, 0);
                    ctx.lineTo(x, s.h);
                    ctx.lineTo(x + s.w / 2, 0);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        });
        this.layers.push({
            parallax: 0.1,
            draw: (ctx, offset) => {
                // 光の粒
                for (let i = 0; i < 15; i++) {
                    const px = (Math.sin(Date.now() * 0.0003 + i * 1.5) * 0.5 + 0.5) * GAME_WIDTH;
                    const py = (Math.cos(Date.now() * 0.0002 + i * 2.1) * 0.5 + 0.5) * GAME_HEIGHT;
                    const alpha = Math.sin(Date.now() * 0.001 + i) * 0.15 + 0.15;
                    ctx.fillStyle = `rgba(80,120,180,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(px, py, MathUtils.randomRange(1, 3), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        });
    }

    _initSkyLayers() {
        this.layers.push({
            parallax: 0,
            draw: (ctx, offset) => {
                const grd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                grd.addColorStop(0, '#2266BB');
                grd.addColorStop(0.4, '#4488DD');
                grd.addColorStop(0.7, '#88BBFF');
                grd.addColorStop(1, '#BBDDFF');
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
        });
        // 遠い雲
        this.layers.push({
            parallax: 0.03,
            clouds: Array.from({ length: 20 }, () => ({
                x: MathUtils.randomRange(-200, 5000),
                y: MathUtils.randomRange(50, GAME_HEIGHT - 100),
                w: MathUtils.randomRange(100, 250),
                h: MathUtils.randomRange(30, 70),
                alpha: MathUtils.randomRange(0.3, 0.6)
            })),
            draw: function(ctx, offset) {
                for (const c of this.clouds) {
                    const x = c.x + offset * this.parallax;
                    if (x < -300 || x > GAME_WIDTH + 300) continue;
                    ctx.globalAlpha = c.alpha;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.ellipse(x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(x - c.w * 0.2, c.y + c.h * 0.15, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        });
        // 近い雲
        this.layers.push({
            parallax: 0.15,
            clouds: Array.from({ length: 10 }, () => ({
                x: MathUtils.randomRange(-100, 4000),
                y: MathUtils.randomRange(200, GAME_HEIGHT + 100),
                w: MathUtils.randomRange(150, 350),
                h: MathUtils.randomRange(40, 80),
                alpha: MathUtils.randomRange(0.2, 0.45)
            })),
            draw: function(ctx, offset) {
                for (const c of this.clouds) {
                    const x = c.x + offset * this.parallax;
                    if (x < -400 || x > GAME_WIDTH + 400) continue;
                    ctx.globalAlpha = c.alpha;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.ellipse(x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        });
    }

    _initCastleLayers() {
        this.layers.push({
            parallax: 0,
            draw: (ctx, offset) => {
                const grd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
                grd.addColorStop(0, '#120808');
                grd.addColorStop(0.5, '#1a0c0c');
                grd.addColorStop(1, '#100505');
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
        });
        this.layers.push({
            parallax: 0.05,
            pillars: Array.from({ length: 12 }, (_, i) => ({
                x: i * 400 + MathUtils.randomRange(-50, 50),
                w: MathUtils.randomRange(30, 60),
                color: `rgba(${MathUtils.randomInt(30, 60)},${MathUtils.randomInt(15, 35)},${MathUtils.randomInt(15, 35)},0.4)`
            })),
            draw: function(ctx, offset) {
                for (const p of this.pillars) {
                    const x = p.x + offset * this.parallax;
                    if (x < -80 || x > GAME_WIDTH + 80) continue;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(x - p.w / 2, 0, p.w, GAME_HEIGHT);
                    ctx.fillStyle = 'rgba(255,255,255,0.03)';
                    ctx.fillRect(x - p.w / 2, 0, p.w * 0.3, GAME_HEIGHT);
                }
            }
        });
        this.layers.push({
            parallax: 0.08,
            draw: (ctx, offset) => {
                // 溶岩のグロー
                const t = Date.now() * 0.001;
                const glow = Math.sin(t * 2) * 0.03 + 0.08;
                const grd = ctx.createLinearGradient(0, GAME_HEIGHT - 120, 0, GAME_HEIGHT);
                grd.addColorStop(0, `rgba(255,40,0,0)`);
                grd.addColorStop(0.5, `rgba(255,60,0,${glow * 0.5})`);
                grd.addColorStop(1, `rgba(255,40,0,${glow})`);
                ctx.fillStyle = grd;
                ctx.fillRect(0, GAME_HEIGHT - 120, GAME_WIDTH, 120);
            }
        });
    }

    _generateMountains(count, sizeMultiplier, color1, color2) {
        const mountains = [];
        for (let i = 0; i < count; i++) {
            mountains.push({
                x: i * (4500 / count) + MathUtils.randomRange(-200, 200),
                w: MathUtils.randomRange(300, 600) * sizeMultiplier,
                h: MathUtils.randomRange(80, 200) * sizeMultiplier,
                color: Math.random() > 0.5 ? color1 : color2
            });
        }
        return mountains;
    }

    _generateTrees(count) {
        const trees = [];
        for (let i = 0; i < count; i++) {
            trees.push({
                x: i * (4500 / count) + MathUtils.randomRange(-30, 30),
                h: MathUtils.randomRange(40, 100),
                crownW: MathUtils.randomRange(20, 50),
                crownH: MathUtils.randomRange(25, 55),
                color: `hsl(${MathUtils.randomRange(100, 145)}, ${MathUtils.randomRange(35, 65)}%, ${MathUtils.randomRange(28, 48)}%)`
            });
        }
        return trees;
    }

    draw(ctx, cameraX) {
        const offset = cameraX;
        for (const layer of this.layers) {
            layer.draw(ctx, offset);
        }
    }
}


// ============================================================
// SECTION 40: ゲームの拡張統合（パート1との接続コード）
// ============================================================

// 既存のGameクラスを拡張するラッパー
function applyGameExtensions(game) {
    const ext = new GameExtension(game);
    const weather = new WeatherSystem();
    const parallax = new ParallaxBackground();

    // 既存の_startStageを拡張
    const originalStartStage = game._startStage.bind(game);
    game._startStage = function(stageNum) {
        originalStartStage(stageNum);

        // 拡張レベルデータ適用
        switch (stageNum) {
            case 1:
                extendStage1(game.level);
                weather.setWeather('none');
                break;
            case 2:
                extendStage2(game.level);
                weather.setWeather('fog', 0.6);
                break;
            case 3:
                extendStage3(game.level);
                weather.setWeather('none');
                break;
            case 4:
                extendStage4(game.level);
                weather.setWeather('ash', 0.8);
                weather.windX = 1;
                break;
        }

        parallax.init(game.level.bgType);
        ext.deathCount = 0;
        ext.speedrunActive = true;
    };

    // 既存の_updatePlayingを拡張
    const originalUpdatePlaying = game._updatePlaying.bind(game);
    game._updatePlaying = function(dt) {
        originalUpdatePlaying(dt);
        ext.update(dt);
        weather.update(dt);
    };

    // 既存のプレイヤー死亡を拡張
    const originalPlayerDie = game.player.die.bind(game.player);
    game.player.die = function(type, gameRef) {
        originalPlayerDie(type, gameRef);
        ext.onPlayerDeath(type);
    };

    // 既存のdrawGameを拡張
    const originalDrawGame = game._drawGame.bind(game);
    game._drawGame = function(ctx) {
        // パララックス背景（元の背景の代わり）
        parallax.draw(ctx, game.camera.x);

        ctx.save();

        // タイル描画
        game._drawTiles(ctx);

        // 拡張タイル描画
        ext.drawExtendedTiles(ctx, game.level, game.camera);

        // 動く足場
        game.movingPlatforms.draw(ctx, game.camera);

        // 敵描画
        game.enemyManager.draw(ctx, game.camera);

        // 拡張敵描画
        ext.drawExtendedEnemies(ctx, game.camera);

        // プレイヤー描画
        game.player.draw(ctx, game.camera);

        // ボス描画
        game.bossManager.draw(ctx, game.camera);

        // トラップオーバーレイ
        game.trapManager.drawOverlays(ctx, game.camera, game.level);

        // 拡張トラップオーバーレイ
        ext.drawExtendedOverlays(ctx, game.camera, game.level, game.player);

        // パーティクル
        game.particles.draw(ctx, game.camera);

        // フローティングテキスト
        game.ui.drawFloatingTexts(ctx, game.camera);

        ctx.restore();

        // 天候エフェクト
        weather.draw(ctx);

        // HUD
        game.ui.drawHUD(ctx, game.player, game.currentStage);

        // 通知
        game.ui.drawNotifications(ctx);

        // 拡張死亡メッセージ
        ext.drawDeathScreen(ctx, game.player);

        // 統計
        ext.drawStats(ctx);

        // 実績表示
        ext.drawAchievementList(ctx);

        // 死亡時のリスポーンメッセージ
        if (game.state === STATE.DEATH && game.deathRespawnTimer >= game.deathRespawnDelay) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, GAME_HEIGHT / 2 - 35, GAME_WIDTH, 70);
            ctx.font = 'bold 24px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Press ENTER or SPACE to respawn', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 5);
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.fillStyle = '#ffaaaa';
            ctx.fillText(ext.getRandomDeathMessage(), GAME_WIDTH / 2, GAME_HEIGHT / 2 + 22);
        }
    };

    // 既存のdrawTitleを拡張
    const originalDrawTitle = game._drawTitle.bind(game);
    game._drawTitle = function(ctx) {
        originalDrawTitle(ctx);

        // 統計情報を追加
        if (ext.totalDeaths > 0) {
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillText(`Total Deaths: ${ext.totalDeaths} | Achievements: ${ext.achievements.length}/${ext.achievementDefs.length}`, GAME_WIDTH / 2, 508);
        }
    };

    // Level.isSolidを拡張して拡張タイル対応
    const originalIsSolid = Level.prototype.isSolid;
    Level.prototype.isSolid = function(col, row) {
        const tile = this.getTile(col, row);
        const data = this.getTileData(col, row);

        // 拡張タイルの固体判定
        if (tile === TILE_EX.GHOST_BLOCK && data) {
            return data.solid;
        }
        if (tile === TILE_EX.GATE_BLOCK && data) {
            return !data.open;
        }
        if (tile === TILE_EX.TRAP_DOOR && data) {
            return !data.open;
        }
        if (tile === TILE_EX.EXPLOSIVE_BRICK) return true;
        if (tile === TILE_EX.BOUNCE_WALL) return true;
        if (tile === TILE_EX.SLIME_BLOCK) return true;
        if (tile === TILE_EX.RAINBOW_BLOCK) return true;
        if (tile === TILE_EX.MUSIC_BLOCK) return true;
        if (tile === TILE_EX.MIRROR_BLOCK) return true;
        if (tile === TILE_EX.KEY_BLOCK && data && !data.unlocked) return true;
        if (tile === TILE_EX.CRACKED_GROUND) return true;
        if (tile === TILE_EX.MAGNET_BLOCK) return true;
        if (tile === TILE_EX.SHRINK_BLOCK) return true;
        if (tile === TILE_EX.GROW_BLOCK) return true;
        if (tile === TILE_EX.INVISIBLE_WALL) return true;
        if (tile === TILE_EX.PRESSURE_PLATE) return true;

        // 非固体の拡張タイル
        if (tile === TILE_EX.FAKE_COIN || tile === TILE_EX.QUICKSAND ||
            tile === TILE_EX.DARK_ZONE || tile === TILE_EX.WIND_ZONE_LEFT ||
            tile === TILE_EX.WIND_ZONE_RIGHT || tile === TILE_EX.WIND_ZONE_UP ||
            tile === TILE_EX.POISON_WATER || tile === TILE_EX.FAKE_SPIKE ||
            tile === TILE_EX.ANTI_GRAVITY || tile === TILE_EX.GRAVITY_FLIP ||
            tile === TILE_EX.TELEPORT_IN || tile === TILE_EX.TELEPORT_OUT ||
            tile === TILE_EX.FAKE_GOAL || tile === TILE_EX.FAKE_PIPE ||
            tile === TILE_EX.FLAME_JET || tile === TILE_EX.SAWBLADE_RAIL ||
            tile === TILE_EX.ARROW_SIGN || tile === TILE_EX.TEXT_SIGN ||
            tile === TILE_EX.DECORATION_TORCH || tile === TILE_EX.FAKE_ENEMY ||
            tile === TILE_EX.ROTATING_PLATFORM || tile === TILE_EX.PENDULUM_PLATFORM) {
            return false;
        }

        return originalIsSolid.call(this, col, row);
    };

    // Level.isDangerousを拡張
    const originalIsDangerous = Level.prototype.isDangerous;
    Level.prototype.isDangerous = function(col, row) {
        const tile = this.getTile(col, row);
        if (tile === TILE_EX.POISON_WATER) return true;
        return originalIsDangerous.call(this, col, row);
    };

    // 爆発ブロックの頭突き処理
    const originalOnHeadHit = game.player._onHeadHit.bind(game.player);
    game.player._onHeadHit = function(col, row, tile, data, level, gameRef) {
        if (tile === TILE_EX.EXPLOSIVE_BRICK && data && data.explosive && !data.triggered) {
            data.triggered = true;
            if (gameRef) {
                gameRef.audio.play('warning', 0.5);
                gameRef.ui.showFloatingText('💣!', col * TILE_SIZE, row * TILE_SIZE - 20, '#ff4400', 20);
                gameRef.camera.shake(2, 0.1);
            }
            return;
        }
        if (tile === TILE_EX.MUSIC_BLOCK && data && data.musicBlock) {
            data.justHit = true;
            data.bounceOffset = -6;
            if (gameRef) {
                gameRef.audio.play('coin', 0.4, data.pitch || 1.0);
                gameRef.particles.emitCoinSparkle(col * TILE_SIZE + 16, row * TILE_SIZE);
            }
            return;
        }
        originalOnHeadHit(col, row, tile, data, level, gameRef);
    };

    // ゲームオブジェクトに保存
    game.extension = ext;
    game.weather = weather;
    game.parallaxBG = parallax;

    return game;
}


// ============================================================
// SECTION 41: 初期化コードの上書き（パート1のDOMContentLoadedを拡張）
// ============================================================

// パート1のGame.initを上書きして拡張を適用
const _originalGameInit = Game.prototype.init;
Game.prototype.init = async function() {
    await _originalGameInit.call(this);
    applyGameExtensions(this);
    console.log('[SyobonAction HD] Part 2 Extensions loaded successfully');
    console.log(`  - Extended tiles: ${Object.keys(TILE_EX).length}`);
    console.log(`  - Extended enemies: ${Object.keys(ENEMY_EX).length}`);
    console.log(`  - Total trap types: ${Object.keys(TILE_EX).length + 30}+`);
};
</script>
