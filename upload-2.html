        ctx.moveTo(cx - 10, cy + wobble + 6);
        ctx.quadraticCurveTo(cx - 16, cy + wobble + 14, cx - 8, cy + wobble + 16);
        ctx.quadraticCurveTo(cx - 4, cy + wobble + 12, cx - 2, cy + wobble + 10);
        ctx.fillStyle = '#EEEEFF';
        ctx.fill();

        ctx.globalAlpha = 1;

        // 顔 - プレイヤーが見てるかで変わる
        if (enemy.vx === 0 && enemy.vy === 0) {
            // 隠れ顔（恥ずかしい）
            ctx.fillStyle = '#FF8888';
            ctx.beginPath();
            ctx.ellipse(cx - 4, cy + wobble + 2, 3, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 6, cy + wobble + 2, 3, 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // 閉じた目
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx - 3, cy + wobble - 2, 3, 0.2, Math.PI - 0.2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + 5, cy + wobble - 2, 3, 0.2, Math.PI - 0.2);
            ctx.stroke();
        } else {
            // 襲い顔
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.ellipse(cx - 4, cy + wobble - 2, 3, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 5, cy + wobble - 2, 3, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // 口（大きく開いた）
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.ellipse(cx + 1, cy + wobble + 5, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // 舌
            ctx.fillStyle = '#FF6688';
            ctx.beginPath();
            ctx.ellipse(cx + 1, cy + wobble + 7, 3, 3, 0, 0, Math.PI);
            ctx.fill();
        }
    }

    _drawDryBones(ctx, enemy, x, y) {
        if (enemy.collapsed) {
            // 崩壊状態
            ctx.fillStyle = '#CCCCAA';
            ctx.fillRect(x + 4, y + 20, 20, 6);
            ctx.fillRect(x + 8, y + 16, 4, 4);
            ctx.fillRect(x + 16, y + 14, 4, 6);
            return;
        }

        const cx = x + 14;
        const cy = y + 14;

        // 骨の体
        ctx.fillStyle = '#EEEECC';
        ctx.fillRect(cx - 4, cy - 6, 8, 16);

        // 頭蓋骨
        ctx.beginPath();
        ctx.ellipse(cx, cy - 8, 8, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目（暗い穴）
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.ellipse(cx - 3, cy - 9, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy - 9, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // 肋骨
        ctx.strokeStyle = '#DDDDBB';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(cx - 5, cy - 2 + i * 4);
            ctx.lineTo(cx + 5, cy - 2 + i * 4);
            ctx.stroke();
        }

        // 足
        ctx.fillStyle = '#EEEECC';
        const legAnim = enemy.animFrame === 0 ? 2 : -2;
        ctx.fillRect(cx - 6, cy + 8 + legAnim, 4, 8);
        ctx.fillRect(cx + 2, cy + 8 - legAnim, 4, 8);
    }

    _drawChainChomp(ctx, enemy, x, y) {
        const cx = x + 16;
        const cy = y + 16;

        // チェーン
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 3;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(enemy.startX + 16, enemy.startY + 16);
        ctx.lineTo(cx, cy);
        ctx.stroke();
        ctx.setLineDash([]);

        // 杭
        ctx.fillStyle = '#888';
        ctx.fillRect(enemy.startX + 12, enemy.startY + 12, 8, 12);

        // 体（黒い球）
        const grd = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, 16);
        grd.addColorStop(0, '#555555');
        grd.addColorStop(0.5, '#222222');
        grd.addColorStop(1, '#000000');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(cx, cy, 14, 0, Math.PI * 2);
        ctx.fill();

        // 目（白い大きな目）
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(cx - 3, cy - 4, 6, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 7, cy - 4, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(cx - 1, cy - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 9, cy - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        // 口
        ctx.fillStyle = '#882222';
        ctx.beginPath();
        ctx.ellipse(cx + 2, cy + 6, 10, 5, 0, 0, Math.PI);
        ctx.fill();

        // 牙
        ctx.fillStyle = '#fff';
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(cx + 2 + i * 4 - 1, cy + 4);
            ctx.lineTo(cx + 2 + i * 4, cy + 8);
            ctx.lineTo(cx + 2 + i * 4 + 1, cy + 4);
            ctx.closePath();
            ctx.fill();
        }

        // ハイライト
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.ellipse(cx - 5, cy - 8, 5, 3, -0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawHammerBro(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;

        // 体（緑のシェル）
        ctx.fillStyle = '#33BB33';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 4, 12, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // ヘルメット
        ctx.fillStyle = '#228822';
        ctx.beginPath();
        ctx.ellipse(cx, cy - 6, 10, 8, 0, Math.PI, 0);
        ctx.fill();

        // 顔
        ctx.fillStyle = '#FFCC88';
        ctx.beginPath();
        ctx.ellipse(cx, cy - 2, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(cx - 3, cy - 3, 3, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy - 3, 3, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(cx - 2, cy - 2, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 2, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // ハンマー（手に持っている）
        const hammerAngle = Math.sin(Date.now() * 0.005) * 0.5;
        ctx.save();
        ctx.translate(cx + 12, cy - 4);
        ctx.rotate(hammerAngle);
        ctx.fillStyle = '#886644';
        ctx.fillRect(-2, -12, 4, 14);
        ctx.fillStyle = '#AAAAAA';
        ctx.fillRect(-4, -18, 8, 8);
        ctx.restore();
    }

    _drawFakePowerup(ctx, enemy, x, y) {
        // マッシュルーム風（でも毒）
        const cx = x + 14;
        const cy = y + 14;
        const bob = Math.sin(Date.now() * 0.003) * 2;

        // 茎
        ctx.fillStyle = '#EEEECC';
        ctx.fillRect(cx - 5, cy + 2 + bob, 10, 8);

        // かさ（紫色=毒）
        const capGrd = ctx.createRadialGradient(cx, cy - 4 + bob, 2, cx, cy - 2 + bob, 14);
        capGrd.addColorStop(0, '#BB44BB');
        capGrd.addColorStop(0.6, '#882288');
        capGrd.addColorStop(1, '#661166');
        ctx.fillStyle = capGrd;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 2 + bob, 14, 10, 0, Math.PI, 0);
        ctx.fill();

        // 斑点
        ctx.fillStyle = '#EEDDEE';
        ctx.beginPath();
        ctx.arc(cx - 5, cy - 6 + bob, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 8 + bob, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 1, cy - 4 + bob, 2, 0, Math.PI * 2);
        ctx.fill();

        // 目（邪悪）
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(cx - 3, cy + 3 + bob, 2.5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy + 3 + bob, 2.5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FF0000';
        ctx.beginPath();
        ctx.arc(cx - 3, cy + 4 + bob, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 3, cy + 4 + bob, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawTrapStar(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;
        const bob = Math.sin(Date.now() * 0.004) * 3;
        const rot = Date.now() * 0.002;

        ctx.save();
        ctx.translate(cx, cy + bob);
        ctx.rotate(rot);

        // 星型（金色だが罠）
        const grd = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
        grd.addColorStop(0, '#FFFF44');
        grd.addColorStop(0.5, '#FFDD00');
        grd.addColorStop(1, '#CCAA00');
        ctx.fillStyle = grd;

        // 星を描画
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const outerAngle = (i * 2 * Math.PI / 5) - Math.PI / 2;
            const innerAngle = outerAngle + Math.PI / 5;
            const ox = Math.cos(outerAngle) * 13;
            const oy = Math.sin(outerAngle) * 13;
            const ix = Math.cos(innerAngle) * 5;
            const iy = Math.sin(innerAngle) * 5;
            if (i === 0) ctx.moveTo(ox, oy);
            else ctx.lineTo(ox, oy);
            ctx.lineTo(ix, iy);
        }
        ctx.closePath();
        ctx.fill();

        // 邪悪な目（よく見ないと分からない）
        ctx.fillStyle = 'rgba(100,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(-3, -1, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(3, -1, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 輝きエフェクト
        const sparkle = Math.sin(Date.now() * 0.006) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255,255,200,${sparkle * 0.4})`;
        ctx.beginPath();
        ctx.arc(cx, cy + bob, 18, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawFallingSpike(ctx, enemy, x, y) {
        const cx = x + 14;
        const wobble = enemy.falling ? 0 : Math.sin(Date.now() * 0.01) * 1;

        // スパイク本体
        const grd = ctx.createLinearGradient(cx - 8, y, cx + 8, y);
        grd.addColorStop(0, '#AAAAAA');
        grd.addColorStop(0.5, '#DDDDDD');
        grd.addColorStop(1, '#AAAAAA');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.moveTo(cx + wobble, y + 28);
        ctx.lineTo(cx - 10 + wobble, y);
        ctx.lineTo(cx + 10 + wobble, y);
        ctx.closePath();
        ctx.fill();

        // 先端の光沢
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.moveTo(cx + wobble, y + 24);
        ctx.lineTo(cx - 3 + wobble, y + 6);
        ctx.lineTo(cx + wobble, y + 8);
        ctx.closePath();
        ctx.fill();

        if (!enemy.falling) {
            // 警告の揺れ
            ctx.fillStyle = 'rgba(255,100,0,0.15)';
            ctx.beginPath();
            ctx.arc(cx, y + 14, 16, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawBlooper(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;
        const swim = Math.sin(Date.now() * 0.004) * 3;

        // 体
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(cx, cy + swim, 10, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // 触手
        ctx.strokeStyle = '#DDDDDD';
        ctx.lineWidth = 2;
        for (let i = -2; i <= 2; i++) {
            const tentWave = Math.sin(Date.now() * 0.005 + i) * 4;
            ctx.beginPath();
            ctx.moveTo(cx + i * 4, cy + 10 + swim);
            ctx.quadraticCurveTo(cx + i * 4 + tentWave, cy + 20 + swim, cx + i * 4 + tentWave * 0.5, cy + 26 + swim);
            ctx.stroke();
        }

        // 目
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 2 + swim, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 4, cy - 2 + swim, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawBuzzyBeetle(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;

        // 甲羅（青い）
        const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, 14);
        grd.addColorStop(0, '#4466CC');
        grd.addColorStop(0.7, '#3355AA');
        grd.addColorStop(1, '#224488');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, 14, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 2, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 4, cy - 2, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(cx - 3, cy - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 5, cy - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // 足
        ctx.fillStyle = '#FFCC77';
        const legAnim = enemy.animFrame === 0 ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(cx - 8, cy + 10 + legAnim, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 8, cy + 10 - legAnim, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    clear() {
        this.enemies = [];
        this.projectiles = [];
    }
}


// ============================================================
// SECTION 22: トラップシステム（タイル動的更新）
// ============================================================

class TrapManager {
    constructor() {
        this.activeFallingTiles = [];
        this.activeRisingBlocks = [];
        this.flyingPipes = [];
        this.goalTrapTriggered = false;
        this.goalTrapTimer = 0;
        this.risingLavaX = 0;
        this.risingLavaActive = false;
    }

    update(dt, level, player, game) {
        // 偽地面の処理
        this._updateFakeGround(dt, level, game);

        // 崩れるブロック
        this._updateCrumbleBlocks(dt, level, game);

        // 消える雲
        this._updateVanishingClouds(dt, level, game);

        // 上昇ブロック
        this._updateRisingBlocks(dt, level, game);

        // タイムドブロック
        this._updateTimedBlocks(dt, level);

        // ?ブロックのバウンス
        this._updateBlockBounce(dt, level);

        // ゴールトラップ
        this._updateGoalTrap(dt, level, player, game);

        // 追跡溶岩
        this._updateRisingLava(dt, level, player, game);

        // キャノン
        this._updateCannons(dt, level, player, game);

        // 飛ぶパイプ
        this._updateFlyingPipes(dt, level, player, game);
    }

    _updateFakeGround(dt, level, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.fake || !data.triggered) continue;

            data.fallTimer = (data.fallTimer || 0) + dt;

            if (data.fallTimer < (data.fallDelay || 0.15)) {
                data.shaking = true;
            } else {
                data.shaking = false;
                data.vy = (data.vy || 0) + GRAVITY * 0.5;
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);

                if (data.vy > 1) {
                    level.setTile(col, row, TILE.EMPTY);
                    if (game) {
                        game.particles.emitBlockBreak(
                            col * TILE_SIZE + TILE_SIZE / 2,
                            row * TILE_SIZE + TILE_SIZE / 2,
                            '#8B6914'
                        );
                        game.audio.play('break_block', 0.3);
                    }
                    delete level.tileData[key];
                }
            }
        }
    }

    _updateCrumbleBlocks(dt, level, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.crumbling) continue;

            data.crumbleProgress = (data.crumbleProgress || 0) + dt * 1.5;

            if (data.crumbleProgress >= 1.0) {
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);
                level.setTile(col, row, TILE.EMPTY);
                if (game) {
                    game.particles.emitBlockBreak(
                        col * TILE_SIZE + TILE_SIZE / 2,
                        row * TILE_SIZE + TILE_SIZE / 2,
                        '#CC8844'
                    );
                    game.audio.play('break_block', 0.3);
                    game.camera.shake(2, 0.1);
                }
                delete level.tileData[key];
            }
        }
    }

    _updateVanishingClouds(dt, level, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.vanishOnStep || !data.vanishing) continue;

            data.vanishTimer = (data.vanishTimer || 0) + dt;
            data.alpha = Math.max(0, 1.0 - data.vanishTimer / 1.5);

            if (data.alpha <= 0) {
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);
                level.setTile(col, row, TILE.EMPTY);
                if (game) {
                    game.particles.emitDustPuff(
                        col * TILE_SIZE + TILE_SIZE / 2,
                        row * TILE_SIZE + TILE_SIZE / 2
                    );
                }
                delete level.tileData[key];
            }
        }
    }

    _updateRisingBlocks(dt, level, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.rising) continue;

            data.risingSpeed = (data.risingSpeed || -6);
            const parts = key.split(',');
            const col = parseInt(parts[0]);
            const row = parseInt(parts[1]);

            // ブロックを消す（飛んでいく演出）
            level.setTile(col, row, TILE.EMPTY);
            if (game) {
                game.particles.emitBlockBreak(
                    col * TILE_SIZE + TILE_SIZE / 2,
                    row * TILE_SIZE + TILE_SIZE / 2,
                    '#FFD700'
                );
                // 上に飛んでいくパーティクル
                for (let i = 0; i < 5; i++) {
                    game.particles.emit({
                        x: col * TILE_SIZE + TILE_SIZE / 2,
                        y: row * TILE_SIZE,
                        vx: MathUtils.randomRange(-1, 1),
                        vy: data.risingSpeed + MathUtils.randomRange(-2, 0),
                        size: 6,
                        endSize: 2,
                        maxLife: 1.5,
                        alpha: 1,
                        endAlpha: 0,
                        color: '#FFD700',
                        shape: 'square',
                        gravity: -0.1,
                        rotationSpeed: MathUtils.randomRange(-5, 5)
                    });
                }
            }
            delete level.tileData[key];
        }
    }

    _updateTimedBlocks(dt, level) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (data && data.cycleTime !== undefined) {
                data.phase = ((data.phase || 0) + dt / data.cycleTime) % 1.0;
            }
        }
    }

    _updateBlockBounce(dt, level) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (data && data.bounceOffset && data.bounceOffset < 0) {
                data.bounceOffset += 0.5;
                if (data.bounceOffset > 0) data.bounceOffset = 0;
            }
        }
    }

    _updateGoalTrap(dt, level, player, game) {
        if (!level.goalData || level.goalData.triggered) return;

        const goalX = level.goalData.poleX * TILE_SIZE;
        if (Math.abs(player.x - goalX) < 40 && player.alive) {
            level.goalData.triggered = true;
            this.goalTrapTriggered = true;
            this.goalTrapTimer = 0;

            if (game) {
                game.audio.play('trap');
                game.camera.shake(6, 0.4);
            }

            if (level.goalData.trapType === 'fall_over') {
                // ポールが倒れてくるトラップ
                this._startPoleFallTrap(level, player, game);
            } else if (level.goalData.trapType === 'laser') {
                // レーザートラップ
                this._startLaserTrap(level, player, game);
            }
        }
    }

    _startPoleFallTrap(level, player, game) {
        const poleX = level.goalData.poleX;
        let angle = 0;
        const fallInterval = setInterval(() => {
            angle += 0.05;
            level.goalData.fallAngle = angle;

            // ポールのタイルを動かす（簡易：一定角度で消す）
            if (angle > Math.PI / 2) {
                clearInterval(fallInterval);
                // ポールが倒れた先にプレイヤーがいたらダメージ
                for (let row = 10; row <= 17; row++) {
                    level.setTile(poleX, row, TILE.EMPTY);
                }
                // 横にスパイク配置（倒れた先）
                const fallDir = player.x > poleX * TILE_SIZE ? 1 : -1;
                for (let i = 1; i <= 7; i++) {
                    const dangerCol = poleX + fallDir * i;
                    const dangerRow = 17;
                    if (dangerCol >= 0 && dangerCol < level.width) {
                        level.setTile(dangerCol, dangerRow, TILE.SPIKE);
                    }
                }
                if (game) {
                    game.camera.shake(10, 0.5);
                    game.audio.play('thwomp');
                    game.ui.showNotification('ポールが倒れてきた！本当のゴールはこの先！');
                }
                // 数秒後にスパイク消去
                setTimeout(() => {
                    const fallDir2 = player.x > poleX * TILE_SIZE ? 1 : -1;
                    for (let i = 1; i <= 7; i++) {
                        const dc = poleX + fallDir2 * i;
                        if (dc >= 0 && dc < level.width) {
                            level.setTile(dc, 17, TILE.GROUND);
                        }
                    }
                }, 2000);
            }
        }, 30);
    }

    _startLaserTrap(level, player, game) {
        level.goalData.laserFiring = true;
        if (game) {
            game.audio.play('laser', 0.7);
            game.camera.flash('#ff0000', 0.3);
            game.ui.showNotification('レーザー！避けろ！');
        }
        // レーザーは一定時間で消える
        setTimeout(() => {
            if (level.goalData) {
                level.goalData.laserFiring = false;
            }
        }, 2000);
    }

    _updateRisingLava(dt, level, player, game) {
        if (!level.risingLava || !level.risingLava.active) {
            // トリガーチェック
            if (level.risingLava && player.x > level.risingLava.startX) {
                level.risingLava.active = true;
                level.risingLava.lavaX = level.risingLava.startX - GAME_WIDTH;
                if (game) {
                    game.ui.showNotification('溶岩が迫ってくる！走れ！');
                    game.audio.play('warning');
                    game.camera.shake(4, 0.5);
                }
            }
            return;
        }

        level.risingLava.lavaX += level.risingLava.lavaSpeed;

        // プレイヤーが溶岩に追いつかれたらダメージ
        if (player.x < level.risingLava.lavaX && player.alive) {
            player.die('lava', game);
        }
    }

    _updateCannons(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || data.fireInterval === undefined) continue;

            data.fireTimer = (data.fireTimer || 0) + dt;
            if (data.fireTimer >= data.fireInterval) {
                data.fireTimer = 0;
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);
                const bx = col * TILE_SIZE + TILE_SIZE / 2;
                const by = row * TILE_SIZE;
                const dir = player.x > bx ? 1 : -1;

                if (game) {
                    game.enemyManager.projectiles.push({
                        x: bx, y: by,
                        vx: dir * 4, vy: 0,
                        width: 10, height: 10,
                        life: 5.0,
                        type: 'cannonball'
                    });
                    game.audio.play('fireball', 0.4);
                    game.particles.emitDustPuff(bx, by);
                }
            }
        }
    }

    _updateFlyingPipes(dt, level, player, game) {
        for (const key in level.tileData) {
            const data = level.tileData[key];
            if (!data || !data.flyingPipe) continue;

            if (!data.triggered) {
                // プレイヤーがパイプの上に乗ったらトリガー
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);
                const pipeTop = row * TILE_SIZE;

                if (player.onGround &&
                    player.y + player.height >= pipeTop - 2 &&
                    player.y + player.height <= pipeTop + 4 &&
                    player.x + player.width > col * TILE_SIZE &&
                    player.x < (col + 1) * TILE_SIZE) {
                    data.triggered = true;
                    data.vy = -3;
                    if (game) {
                        game.audio.play('spring', 0.5);
                        game.ui.showFloatingText('!?', col * TILE_SIZE, pipeTop - 20, '#ff4444');
                    }
                }
            } else {
                // パイプが上に飛んでいく
                data.vy = (data.vy || -3) - 0.1;
                const parts = key.split(',');
                const col = parseInt(parts[0]);
                const row = parseInt(parts[1]);

                // 一定以上飛んだら消す
                if (Math.abs(data.vy) > 15) {
                    level.setTile(col, row, TILE.EMPTY);
                    // 隣のパイプも消す
                    const neighborKey = `${col + 1},${row}`;
                    if (level.tileData[neighborKey] && level.tileData[neighborKey].flyingPipe) {
                        level.setTile(col + 1, row, TILE.EMPTY);
                        delete level.tileData[neighborKey];
                    }
                    if (game) {
                        game.particles.emitExplosion(
                            col * TILE_SIZE + TILE_SIZE,
                            row * TILE_SIZE,
                            '#33CC33', 15
                        );
                    }
                    delete level.tileData[key];
                }
            }
        }
    }

    drawOverlays(ctx, camera, level) {
        const drawX = camera.getDrawX();
        const drawY = camera.getDrawY();

        // ゴールポール倒れアニメーション
        if (level.goalData && level.goalData.triggered && level.goalData.trapType === 'fall_over') {
            const angle = level.goalData.fallAngle || 0;
            if (angle > 0 && angle < Math.PI / 2) {
                const poleX = level.goalData.poleX * TILE_SIZE + TILE_SIZE / 2;
                const poleBaseY = 18 * TILE_SIZE;

                ctx.save();
                ctx.translate(poleX + drawX, poleBaseY + drawY);
                ctx.rotate(angle);

                // 倒れるポール描画
                ctx.fillStyle = '#999';
                ctx.fillRect(-2, -8 * TILE_SIZE, 4, 8 * TILE_SIZE);

                // 旗
                ctx.fillStyle = '#22cc22';
                ctx.beginPath();
                ctx.moveTo(4, -8 * TILE_SIZE + 4);
                ctx.lineTo(20, -8 * TILE_SIZE + 12);
                ctx.lineTo(4, -8 * TILE_SIZE + 20);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // レーザー描画
        if (level.goalData && level.goalData.laserFiring) {
            const laserX = level.goalData.poleX * TILE_SIZE + TILE_SIZE / 2 + drawX;
            const laserY = 12 * TILE_SIZE + drawY;
            const flicker = Math.sin(Date.now() * 0.02) * 0.3 + 0.7;

            ctx.save();
            ctx.globalAlpha = flicker;
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(laserX, laserY - 3, 300, 6);
            ctx.fillStyle = '#FF8888';
            ctx.fillRect(laserX, laserY - 1, 300, 2);
            ctx.fillStyle = 'rgba(255,0,0,0.2)';
            ctx.fillRect(laserX, laserY - 10, 300, 20);
            ctx.restore();
        }

        // 追跡溶岩描画
        if (level.risingLava && level.risingLava.active) {
            const lavaScreenX = level.risingLava.lavaX + drawX;
            const grd = ctx.createLinearGradient(lavaScreenX - 40, 0, lavaScreenX, 0);
            grd.addColorStop(0, 'rgba(255,50,0,0)');
            grd.addColorStop(0.5, 'rgba(255,80,0,0.7)');
            grd.addColorStop(1, 'rgba(255,30,0,0.95)');
            ctx.fillStyle = grd;
            ctx.fillRect(lavaScreenX - 200, 0, 200, GAME_HEIGHT);
            ctx.fillStyle = 'rgba(255,30,0,0.95)';
            ctx.fillRect(0, 0, Math.max(0, lavaScreenX - 200), GAME_HEIGHT);

            // 溶岩のディテール
            const wave = Math.sin(Date.now() * 0.003) * 5;
            ctx.fillStyle = 'rgba(255,200,0,0.3)';
            ctx.fillRect(lavaScreenX - 10 + wave, 0, 10, GAME_HEIGHT);
        }
    }

    reset() {
        this.goalTrapTriggered = false;
        this.goalTrapTimer = 0;
        this.risingLavaActive = false;
    }
}


// ============================================================
// SECTION 23: ボスシステム
// ============================================================

class BossManager {
    constructor() {
        this.active = false;
        this.boss = null;
        this.hp = 0;
        this.maxHp = 0;
        this.phase = 0;
        this.attackTimer = 0;
        this.patternIndex = 0;
        this.invincible = false;
        this.invincibleTimer = 0;
        this.x = 0;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.baseY = 0;
        this.stateTimer = 0;
        this.currentAttack = '';
        this.defeated = false;
        this.defeatTimer = 0;
        this.width = 64;
        this.height = 64;
        this.animTimer = 0;
        this.flashTimer = 0;
        this.shakeX = 0;
    }

    init(bossData) {
        if (!bossData) return;
        this.active = false;
        this.boss = bossData;
        this.hp = bossData.hp;
        this.maxHp = bossData.maxHp;
        this.x = bossData.x;
        this.y = bossData.y;
        this.baseY = bossData.y;
        this.vx = 0;
        this.vy = 0;
        this.phase = 0;
        this.attackTimer = 0;
        this.patternIndex = 0;
        this.invincible = false;
        this.defeated = false;
        this.defeatTimer = 0;
        this.currentAttack = '';
    }

    activate(game) {
        this.active = true;
        if (game) {
            game.audio.stopBGM();
            game.audio.playBGM('boss');
            game.camera.shake(5, 0.5);
            game.ui.showNotification('オニオンキング現る！');
        }
    }

    update(dt, player, level, game) {
        if (!this.active || this.boss === null) return;

        if (this.defeated) {
            this._updateDefeat(dt, game);
            return;
        }

        this.animTimer += dt;
        this.stateTimer += dt;
        this.attackTimer += dt;

        // 無敵時間
        if (this.invincible) {
            this.invincibleTimer -= dt;
            this.flashTimer += dt;
            this.shakeX = Math.sin(this.flashTimer * 30) * 3;
            if (this.invincibleTimer <= 0) {
                this.invincible = false;
                this.shakeX = 0;
            }
        }

        // フェーズ遷移
        if (this.hp <= this.maxHp * 0.3 && this.phase < 2) {
            this.phase = 2;
            if (game) game.ui.showNotification('オニオンキング怒り状態！');
        } else if (this.hp <= this.maxHp * 0.6 && this.phase < 1) {
            this.phase = 1;
        }

        // 攻撃パターン実行
        const attackInterval = this.phase === 2 ? 1.5 : (this.phase === 1 ? 2.5 : 3.5);
        if (this.attackTimer >= attackInterval) {
            this.attackTimer = 0;
            this._executeAttack(player, level, game);
        }

        // 基本移動（浮遊）
        this.y = this.baseY + Math.sin(this.animTimer * 1.5) * 15;
        this.x += this.vx;

        // 壁バウンド
        const bossLeftLimit = 97 * TILE_SIZE;
        const bossRightLimit = 128 * TILE_SIZE;
        if (this.x < bossLeftLimit || this.x + this.width > bossRightLimit) {
            this.vx = -this.vx;
        }

        // プレイヤーとの衝突チェック
        if (player.alive && !player.invincible) {
            if (MathUtils.rectOverlap(
                player.x, player.y, player.width, player.height,
                this.x + this.shakeX, this.y, this.width, this.height
            )) {
                // 上から踏んだ
                if (player.vy > 0 && player.y + player.height < this.y + this.height * 0.4 && !this.invincible) {
                    this._takeDamage(player, game);
                } else {
                    player.die('boss', game);
                }
            }
        }
    }

    _executeAttack(player, level, game) {
        const patterns = this.boss.patterns || ['jump_slam'];
        const pattern = patterns[this.patternIndex % patterns.length];
        this.patternIndex++;
        this.currentAttack = pattern;

        switch (pattern) {
            case 'jump_slam':
                this._attackJumpSlam(player, game);
                break;
            case 'throw_minions':
                this._attackThrowMinions(player, level, game);
                break;
            case 'charge':
                this._attackCharge(player, game);
                break;
            case 'rain_fire':
                this._attackRainFire(player, level, game);
                break;
            case 'laser_sweep':
                this._attackLaserSweep(player, game);
                break;
        }
    }

    _attackJumpSlam(player, game) {
        this.vy = -12;
        const targetX = player.x;
        this.vx = (targetX - this.x) * 0.02;

        setTimeout(() => {
            this.vy = 15;
            setTimeout(() => {
                this.vy = 0;
                this.vx = 0;
                this.y = this.baseY;
                if (game) {
                    game.camera.shake(8, 0.3);
                    game.audio.play('thwomp');
                    game.particles.emitLandingDust(this.x + this.width / 2, this.y + this.height);
                }
            }, 400);
        }, 500);
    }

    _attackThrowMinions(player, level, game) {
        if (!game) return;
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                game.enemyManager.enemies.push({
                    type: ENEMY_TYPE.GOOMBA,
                    x: this.x + MathUtils.randomRange(-20, 20),
                    y: this.y - 10,
                    startX: this.x,
                    startY: this.y,
                    vx: (player.x > this.x ? 1 : -1) * MathUtils.randomRange(1, 3),
                    vy: -5,
                    width: 28, height: 28,
                    alive: true, active: true, hidden: false,
                    stompable: true, animTimer: 0, animFrame: 0,
                    deathTimer: 0, stateTimer: 0, dir: player.x > this.x ? 1 : -1
                });
                if (game) game.audio.play('fireball', 0.3);
            }, i * 300);
        }
    }

    _attackCharge(player, game) {
        const dir = player.x > this.x ? 1 : -1;
        this.vx = dir * 6;
        if (game) game.audio.play('warning', 0.5);

        setTimeout(() => {
            this.vx = 0;
        }, 1500);
    }

    _attackRainFire(player, level, game) {
        if (!game) return;
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const fx = player.x + MathUtils.randomRange(-100, 100);
                game.enemyManager.projectiles.push({
                    x: fx, y: 2 * TILE_SIZE,
                    vx: 0, vy: 4 + i * 0.5,
                    width: 12, height: 12,
                    life: 4.0,
                    type: 'fireball',
                    gravity: 0.1
                });
                game.particles.emitFireEffect(fx, 2 * TILE_SIZE);
            }, i * 200);
        }
    }

    _attackLaserSweep(player, game) {
        if (!game) return;
        game.audio.play('laser', 0.6);
        game.camera.flash('#ff3300', 0.2);

        // レーザーを弾として発射
        game.enemyManager.projectiles.push({
            x: this.x + this.width / 2,
            y: this.y + this.height / 2,
            vx: player.x > this.x ? 8 : -8,
            vy: 0,
            width: 200, height: 8,
            life: 1.0,
            type: 'laser'
        });
    }

    _takeDamage(player, game) {
        this.hp--;
        this.invincible = true;
        this.invincibleTimer = 1.0;
        this.flashTimer = 0;
        player.vy = -10;

        if (game) {
            game.audio.play('boss_hit', 0.7);
            game.camera.shake(4, 0.2);
            game.particles.emitExplosion(this.x + this.width / 2, this.y + this.height / 2, '#ff8800', 15);
            game.ui.showFloatingText(`HP: ${this.hp}/${this.maxHp}`, this.x + this.width / 2, this.y - 20, '#ff4444', 18);
        }

        if (this.hp <= 0) {
            this.defeated = true;
            this.defeatTimer = 0;
            if (game) {
                game.audio.play('boss_death');
                game.camera.shake(15, 1.0);
                game.camera.flash('#ffffff', 0.8);
            }
        }
    }

    _updateDefeat(dt, game) {
        this.defeatTimer += dt;
        this.shakeX = Math.sin(this.defeatTimer * 20) * (10 - this.defeatTimer * 3);

        // 連続爆発
        if (this.defeatTimer < 3.0 && Math.random() < 0.15) {
            if (game) {
                game.particles.emitExplosion(
                    this.x + MathUtils.randomRange(0, this.width),
                    this.y + MathUtils.randomRange(0, this.height),
                    MathUtils.randomRange(0, 1) > 0.5 ? '#ff4400' : '#ffcc00',
                    8
                );
                game.audio.play('explosion', 0.3, MathUtils.randomRange(0.8, 1.2));
            }
        }

        // 最終爆発
        if (this.defeatTimer >= 3.0 && this.defeatTimer - dt < 3.0) {
            if (game) {
                game.particles.emitExplosion(
                    this.x + this.width / 2, this.y + this.height / 2,
                    '#ffffff', 60
                );
                game.particles.emitConfetti(this.x + this.width / 2, this.y + this.height / 2, 50);
                game.camera.flash('#ffffff', 1.0);
                game.camera.shake(20, 0.5);
                game.audio.play('stageClear', 0.8);
                game.ui.showNotification('オニオンキングを倒した！');
            }
            this.active = false;
        }
    }

    draw(ctx, camera) {
        if (!this.active || this.boss === null) return;

        const sx = this.x + this.shakeX + camera.getDrawX();
        const sy = this.y + camera.getDrawY();

        if (this.defeated && this.defeatTimer >= 3.0) return;

        // 無敵時の点滅
        if (this.invincible && Math.floor(this.flashTimer * 15) % 2 === 0) return;

        ctx.save();

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sx + this.width / 2, sy + this.height + 10, 30, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        const cx = sx + this.width / 2;
        const cy = sy + this.height / 2;

        // ===== オニオンキング描画 =====

        // 体（玉ねぎ形状）
        const bodyGrd = ctx.createRadialGradient(cx, cy + 5, 5, cx, cy, 32);
        bodyGrd.addColorStop(0, '#FFFFCC');
        bodyGrd.addColorStop(0.5, '#EEDD88');
        bodyGrd.addColorStop(0.8, '#CCAA44');
        bodyGrd.addColorStop(1, '#AA8822');
        ctx.fillStyle = bodyGrd;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 5, 28, 24, 0, 0, Math.PI * 2);
        ctx.fill();

        // 玉ねぎの縦縞模様
        ctx.strokeStyle = 'rgba(180,150,60,0.3)';
        ctx.lineWidth = 2;
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.ellipse(cx + i * 8, cy + 5, 4, 22, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 頭のとんがり（玉ねぎの芽）
        ctx.fillStyle = '#66AA33';
        ctx.beginPath();
        ctx.moveTo(cx - 6, cy - 18);
        ctx.quadraticCurveTo(cx, cy - 45, cx + 3, cy - 38);
        ctx.quadraticCurveTo(cx + 6, cy - 25, cx + 6, cy - 18);
        ctx.closePath();
        ctx.fill();

        // 王冠
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.moveTo(cx - 15, cy - 15);
        ctx.lineTo(cx - 12, cy - 28);
        ctx.lineTo(cx - 6, cy - 20);
        ctx.lineTo(cx, cy - 32);
        ctx.lineTo(cx + 6, cy - 20);
        ctx.lineTo(cx + 12, cy - 28);
        ctx.lineTo(cx + 15, cy - 15);
        ctx.closePath();
        ctx.fill();

        // 王冠の宝石
        ctx.fillStyle = '#FF4444';
        ctx.beginPath();
        ctx.arc(cx, cy - 22, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4444FF';
        ctx.beginPath();
        ctx.arc(cx - 9, cy - 20, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 9, cy - 20, 2, 0, Math.PI * 2);
        ctx.fill();

        // 目
        const eyeY = cy + 2;
        const angryBrow = this.phase >= 2 ? 4 : (this.phase >= 1 ? 2 : 0);

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(cx - 10, eyeY, 7, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 10, eyeY, 7, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // 瞳（フェーズで色変化）
        const pupilColor = this.phase >= 2 ? '#FF0000' : (this.phase >= 1 ? '#CC4400' : '#442200');
        ctx.fillStyle = pupilColor;
        ctx.beginPath();
        ctx.ellipse(cx - 9, eyeY + 1, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 11, eyeY + 1, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // ハイライト
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx - 11, eyeY - 2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 9, eyeY - 2, 2, 0, Math.PI * 2);
        ctx.fill();

        // 怒り眉
        ctx.strokeStyle = '#663300';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 16, eyeY - 10 - angryBrow);
        ctx.lineTo(cx - 5, eyeY - 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + 16, eyeY - 10 - angryBrow);
        ctx.lineTo(cx + 5, eyeY - 8);
        ctx.stroke();

        // 口
        if (this.currentAttack === 'laser_sweep' || this.currentAttack === 'rain_fire') {
            // 大きく開いた口
            ctx.fillStyle = '#663300';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 16, 12, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FF6666';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 18, 6, 4, 0, 0, Math.PI);
            ctx.fill();
        } else {
            // 普通の口（ニヤリ）
            ctx.strokeStyle = '#663300';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy + 12, 8, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        // フェーズ2以上でオーラ
        if (this.phase >= 1) {
            const auraAlpha = Math.sin(this.animTimer * 3) * 0.15 + 0.15;
            const auraColor = this.phase >= 2 ? `rgba(255,0,0,${auraAlpha})` : `rgba(255,150,0,${auraAlpha})`;
            ctx.fillStyle = auraColor;
            ctx.beginPath();
            ctx.ellipse(cx, cy, 38, 34, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();

        // HPバー
        this._drawHPBar(ctx, sx, sy);
    }

    _drawHPBar(ctx, sx, sy) {
        const barWidth = 80;
        const barHeight = 8;
        const barX = sx + this.width / 2 - barWidth / 2;
        const barY = sy - 25;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX - 1, barY - 1, barWidth + 2, barHeight + 2);

        const hpRatio = this.hp / this.maxHp;
        const hpColor = hpRatio > 0.5 ? '#44ff44' : (hpRatio > 0.25 ? '#ffaa00' : '#ff4444');
        ctx.fillStyle = '#333';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        ctx.fillStyle = hpColor;
        ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight / 2);
    }

    isDefeated() {
        return this.defeated && this.defeatTimer >= 3.5;
    }
}


// ============================================================
// SECTION 24: 動く足場マネージャー
// ============================================================

class MovingPlatformManager {
    constructor() {
        this.platforms = [];
    }

    init(platformData) {
        this.platforms = platformData.map(p => ({ ...p, progress: 0, direction: 1 }));
    }

    update(dt, player) {
        for (const plat of this.platforms) {
            plat.progress += plat.direction * plat.speed * dt * 0.01;
            if (plat.progress >= 1) { plat.progress = 1; plat.direction = -1; }
            if (plat.progress <= 0) { plat.progress = 0; plat.direction = 1; }

            const prevX = plat.x;
            const prevY = plat.y;
            plat.x = MathUtils.lerp(plat.x1, plat.x2, plat.progress);
            plat.y = MathUtils.lerp(plat.y1, plat.y2, plat.progress);
            const dx = plat.x - prevX;
            const dy = plat.y - prevY;

            // プレイヤーが乗っているか
            if (player.alive &&
                player.x + player.width > plat.x &&
                player.x < plat.x + plat.width &&
                player.y + player.height >= plat.y - 2 &&
                player.y + player.height <= plat.y + 8 &&
                player.vy >= 0) {
                player.y = plat.y - player.height;
                player.x += dx;
                player.vy = 0;
                player.onGround = true;
                plat.carrying = true;
            } else {
                plat.carrying = false;
            }
        }
    }

    draw(ctx, camera) {
        const drawX = camera.getDrawX();
        const drawY = camera.getDrawY();

        for (const plat of this.platforms) {
            const sx = plat.x + drawX;
            const sy = plat.y + drawY;

            if (sx + plat.width < -10 || sx > GAME_WIDTH + 10) continue;

            // プラットフォーム描画
            const grd = ctx.createLinearGradient(sx, sy, sx, sy + plat.height);
            grd.addColorStop(0, '#CC9955');
            grd.addColorStop(0.5, '#BB8844');
            grd.addColorStop(1, '#AA7733');
            ctx.fillStyle = grd;
            ctx.fillRect(sx, sy, plat.width, plat.height);

            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(sx, sy, plat.width, 3);

            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(sx, sy + plat.height - 2, plat.width, 2);

            // ネジ風の装飾
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(sx + 8, sy + plat.height / 2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sx + plat.width - 8, sy + plat.height / 2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(sx + 0.5, sy + 0.5, plat.width - 1, plat.height - 1);
        }
    }
}


// ============================================================
// SECTION 25: メインゲームクラス
// ============================================================

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        if (!this.canvas) {
            throw new Error('gameCanvas が見つかりません。');
        }
        this.ctx = this.canvas.getContext('2d');
        if (!this.ctx) {
            throw new Error('2D コンテキストの取得に失敗しました。');
        }
        this.input = new InputManager();
        this.audio = new AudioManager();
        this.camera = new Camera();
        this.particles = new ParticleSystem();
        this.tileRenderer = new TileRenderer();
        this.background = new BackgroundRenderer();
        this.ui = new UIManager();
        this.enemyManager = new EnemyManager();
        this.trapManager = new TrapManager();
        this.bossManager = new BossManager();
        this.movingPlatforms = new MovingPlatformManager();
        this.events = new EventEmitter();

        this.state = STATE.LOADING;
        this.player = new Player();
        this.level = null;
        this.currentStage = 1;
        this.totalStages = 4;
        this.stageNames = ['', '草原ステージ', '地下ステージ', '空中ステージ', '城ステージ'];

        this.lastTime = 0;
        this.deltaTime = 0;
        this.accumulator = 0;
        this.frameCount = 0;
        this.fps = 0;
        this.fpsTimer = 0;
        this.gameTime = 0;

        this.deathRespawnDelay = 1.5;
        this.deathRespawnTimer = 0;
        this.creditsScrollY = 0;
        this.transitionTimer = 0;
        this.transitionCallback = null;
        this.stageIntroTimer = 0;

        this.debugMode = false;
    }

    async init() {
        try {
            this._showLoadingProgress(10);
            await this._delay(100);

            this._showLoadingProgress(30);
            await this._delay(100);

            this.audio.init();
            this._showLoadingProgress(60);
            await this._delay(100);

            this._showLoadingProgress(90);
            await this._delay(100);

            this._showLoadingProgress(100);
            await this._delay(300);

            const loadingScreen = document.getElementById('loadingScreen');
            if (loadingScreen) {
                loadingScreen.style.display = 'none';
            }
            this.state = STATE.TITLE;
            this.lastTime = performance.now();
            this._gameLoop(this.lastTime);
        } catch (error) {
            console.error('Game initialization failed:', error);
            this._showLoadingError(error);
        }
    }

    _delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    _showLoadingProgress(percent) {
        const fill = document.getElementById('loadingFill');
        if (fill) fill.style.width = percent + '%';
    }

    _showLoadingError(error) {
        const loadingScreen = document.getElementById('loadingScreen');
        if (!loadingScreen) return;
        const message = (error && error.message) ? error.message : String(error);
        loadingScreen.innerHTML =
            '<div style=\"color:#ff6b6b;font-weight:bold;margin-bottom:10px;\">起動エラー</div>' +
            `<div style=\"color:#ddd;font-size:14px;max-width:520px;word-break:break-word;\">${message}</div>` +
            '<div style=\"color:#aaa;font-size:12px;margin-top:10px;\">ブラウザを再読み込みしてください。</div>';
    }

    _gameLoop(timestamp) {
        requestAnimationFrame((t) => this._gameLoop(t));

        this.deltaTime = Math.min((timestamp - this.lastTime) / 1000, 0.05);
        this.lastTime = timestamp;

        this.frameCount++;
        this.fpsTimer += this.deltaTime;
        if (this.fpsTimer >= 1) {
            this.fps = this.frameCount;
            this.frameCount = 0;
            this.fpsTimer = 0;
        }

        this._update(this.deltaTime);
        this._draw();
        // 入力はフレーム末尾で更新し、isPressed 判定を取りこぼさないようにする
        this.input.update();
    }

    _update(dt) {
        switch (this.state) {
            case STATE.TITLE:
                this._updateTitle(dt);
                break;
            case STATE.PLAYING:
                this._updatePlaying(dt);
                break;
            case STATE.PAUSED:
                this._updatePaused(dt);
                break;
            case STATE.DEATH:
                this._updateDeath(dt);
                break;
            case STATE.STAGE_CLEAR:
                this._updateStageClear(dt);
                break;
            case STATE.STAGE_INTRO:
                this._updateStageIntro(dt);
                break;
            case STATE.CREDITS:
                this._updateCredits(dt);
                break;
            case STATE.TRANSITION:
                this._updateTransition(dt);
                break;
        }
    }

    _updateTitle(dt) {
        this.gameTime += dt;

        if (this.input.isPressed('enter') || this.input.isPressed(' ') || this.input.mouseClicked) {
            this.audio.init();
            this.audio.resume();
            this.audio.play('menu_confirm');
            this.currentStage = 1;
            this.player.lives = 0;
            this.player.score = 0;
            this.player.coins = 0;
            this._startStage(this.currentStage);
        }
    }

    _updatePlaying(dt) {
        this.gameTime += dt;

        // ポーズ
        if (this.input.isPressed('p') || this.input.isPressed('escape')) {
            this.state = STATE.PAUSED;
            this.audio.play('menu_select');
            return;
        }

        // デバッグ
        if (this.input.isPressed('f2')) {
            this.debugMode = !this.debugMode;
        }

        // プレイヤー更新
        this.player.update(dt, this.input, this.level, this);

        // 敵更新
        this.enemyManager.update(dt, this.player, this.level, this);

        // トラップ更新
        this.trapManager.update(dt, this.level, this.player, this);

        // ボス更新
        this.bossManager.update(dt, this.player, this.level, this);

        // 動く足場更新
        this.movingPlatforms.update(dt, this.player);

        // カメラ追従
        this.camera.follow(this.player.x, this.player.y);
        this.camera.update(dt);

        // タイルアニメーション
        this.tileRenderer.update(dt);

        // 背景更新
        this.background.update(dt);

        // パーティクル更新
        this.particles.update(dt);

        // UI更新
        this.ui.update(dt);

        // プレイヤー死亡チェック
        if (!this.player.alive && this.state === STATE.PLAYING) {
            this.state = STATE.DEATH;
            this.deathRespawnTimer = 0;
        }

        // ゴールチェック
        if (this.player.alive && this.player.x >= this.level.trueGoalX) {
            // ボスステージの場合、ボス撃破後のみクリア
            if (this.level.bossData && !this.bossManager.isDefeated()) {
                return;
            }
            this.state = STATE.STAGE_CLEAR;
            this.audio.play('stageClear', 0.8);
            this.audio.stopBGM();
            this.particles.emitConfetti(this.player.x, this.player.y - 30, 40);
            this.player.eyeState = 'happy';
        }
    }

    _updatePaused(dt) {
        if (this.input.isPressed('p') || this.input.isPressed('escape')) {
            this.state = STATE.PLAYING;
            this.audio.play('menu_select');
        }
    }

    _updateDeath(dt) {
        this.player.update(dt, this.input, this.level, this);
        this.particles.update(dt);
        this.camera.update(dt);

        this.deathRespawnTimer += dt;
        if (this.deathRespawnTimer >= this.deathRespawnDelay) {
            if (this.input.isPressed('enter') || this.input.isPressed(' ') ||
                this.input.isJumpPressed() || this.input.mouseClicked) {
                this._respawnPlayer();
            }
        }
    }

    _updateStageClear(dt) {
        this.particles.update(dt);
        this.camera.update(dt);
        this.gameTime += dt;

        if (this.gameTime > 2.0 && (this.input.isPressed('enter') || this.input.isPressed(' '))) {
            if (this.currentStage >= this.totalStages) {
                this.state = STATE.CREDITS;
                this.creditsScrollY = 0;
            } else {
                this.currentStage++;
                this._startStage(this.currentStage);
            }
        }
    }

    _updateStageIntro(dt) {
        this.stageIntroTimer -= dt;
        if (this.stageIntroTimer <= 0) {
            this.state = STATE.PLAYING;
            this.audio.playBGM(this.level.musicType);
        }
    }

    _updateCredits(dt) {
        this.creditsScrollY += dt * 40;
        this.particles.update(dt);

        if (this.input.isPressed('enter') || this.input.isPressed('escape')) {
            this.state = STATE.TITLE;
        }
    }

    _updateTransition(dt) {
        this.transitionTimer -= dt;
        if (this.transitionTimer <= 0 && this.transitionCallback) {
            this.transitionCallback();
            this.transitionCallback = null;
            this.camera.fadeTo(0, 0.03);
        }
    }

    _startStage(stageNum) {
        // レベル生成
        switch (stageNum) {
            case 1: this.level = generateStage1(); break;
            case 2: this.level = generateStage2(); break;
            case 3: this.level = generateStage3(); break;
            case 4: this.level = generateStage4(); break;
            default: this.level = generateStage1(); break;
        }

        // 初期化
        this.player.reset(this.level.playerStartX, this.level.playerStartY);
        this.camera.x = 0;
        this.camera.y = 0;
        this.camera.setBounds(0, 0, this.level.getWorldWidth() - GAME_WIDTH, 0);

        this.enemyManager.init(this.level.enemies);
        this.trapManager.reset();
        this.bossManager.init(this.level.bossData);
        this.movingPlatforms.init(this.level.movingPlatforms);
        this.background.init(this.level.bgType);
        this.particles.clear();

        this.state = STATE.STAGE_INTRO;
        this.stageIntroTimer = 2.5;
        this.gameTime = 0;
        this.ui.stageIntroTimer = 2.5;
    }

    _respawnPlayer() {
        this.player.reset(this.player.respawnX, this.player.respawnY);
        this.state = STATE.PLAYING;
        this.camera.flash('#fff', 0.3);

        // 敵をリスポーン
        this.enemyManager.init(this.level.enemies);
        this.trapManager.reset();
        this.particles.clear();
    }

    triggerBoss() {
        if (this.bossManager.boss) {
            this.bossManager.activate(this);
            // ボス部屋にロック（入口を閉じる）
            if (this.level) {
                for (let y = 15; y <= 16; y++) {
                    this.level.setTile(96, y, TILE.CASTLE_BRICK);
                }
            }
        }
    }

    // ===== 描画 =====

    _draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        switch (this.state) {
            case STATE.TITLE:
                this._drawTitle(ctx);
                break;
            case STATE.PLAYING:
            case STATE.DEATH:
            case STATE.PAUSED:
            case STATE.STAGE_CLEAR:
                this._drawGame(ctx);
                if (this.state === STATE.PAUSED) this.ui.drawPause(ctx);
                if (this.state === STATE.STAGE_CLEAR) this._drawStageClear(ctx);
                break;
            case STATE.STAGE_INTRO:
                this._drawGame(ctx);
                this.ui.drawStageIntro(ctx, this.currentStage, this.stageNames[this.currentStage]);
                break;
            case STATE.CREDITS:
                this.ui.drawCredits(ctx, this.creditsScrollY);
                break;
        }

        // カメラフラッシュ
        if (this.camera.flashAlpha > 0) {
            ctx.fillStyle = this.camera.flashColor;
            ctx.globalAlpha = this.camera.flashAlpha;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.globalAlpha = 1;
        }

        // フェード
        if (this.camera.fadeAlpha > 0) {
            ctx.fillStyle = this.camera.fadeColor;
            ctx.globalAlpha = this.camera.fadeAlpha;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.globalAlpha = 1;
        }

        // FPS表示（デバッグ）
        if (this.debugMode) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(GAME_WIDTH - 120, GAME_HEIGHT - 55, 115, 50);
            ctx.font = '12px monospace';
            ctx.fillStyle = '#0f0';
            ctx.textAlign = 'right';
            ctx.fillText(`FPS: ${this.fps}`, GAME_WIDTH - 10, GAME_HEIGHT - 38);
            ctx.fillText(`Particles: ${this.particles.count}`, GAME_WIDTH - 10, GAME_HEIGHT - 23);
            ctx.fillText(`Enemies: ${this.enemyManager.enemies.filter(e => e.alive).length}`, GAME_WIDTH - 10, GAME_HEIGHT - 8);
        }
    }

    _drawTitle(ctx) {
        // タイトル背景
        const grd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        grd.addColorStop(0, '#1a2a4a');
        grd.addColorStop(0.5, '#2a3a5a');
        grd.addColorStop(1, '#0a1a3a');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 装飾パーティクル
        for (let i = 0; i < 30; i++) {
            const t = this.gameTime || 0;
            const px = (Math.sin(t * 0.5 + i * 1.3) * 0.5 + 0.5) * GAME_WIDTH;
            const py = (Math.cos(t * 0.3 + i * 0.9) * 0.5 + 0.5) * GAME_HEIGHT;
            const alpha = Math.sin(t * 2 + i) * 0.3 + 0.3;
            ctx.fillStyle = `rgba(100,150,255,${alpha})`;
            ctx.beginPath();
            ctx.arc(px, py, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // タイトル文字
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // 影
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.font = 'bold 52px "Segoe UI", sans-serif';
        ctx.fillText('しょぼんのアクション', GAME_WIDTH / 2 + 3, 200 + 3);

        // メイン
        const titleGrd = ctx.createLinearGradient(0, 175, 0, 225);
        titleGrd.addColorStop(0, '#FFD700');
        titleGrd.addColorStop(0.5, '#FFF8DC');
        titleGrd.addColorStop(1, '#FFD700');
        ctx.fillStyle = titleGrd;
        ctx.font = 'bold 52px "Segoe UI", sans-serif';
        ctx.fillText('しょぼんのアクション', GAME_WIDTH / 2, 200);

        // サブタイトル
        ctx.font = 'bold 28px "Segoe UI", sans-serif';
        ctx.fillStyle = '#88BBFF';
        ctx.fillText('HD REMAKE', GAME_WIDTH / 2, 255);

        // しょぼん顔
        const faceY = 340;
        ctx.font = '60px "Segoe UI", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('(´・ω・`)', GAME_WIDTH / 2, faceY);

        // 点滅するスタート
        const blink = Math.sin((this.gameTime || 0) * 3) > 0;
        if (blink) {
            ctx.font = 'bold 24px "Segoe UI", sans-serif';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('Press ENTER or SPACE to Start', GAME_WIDTH / 2, 450);
        }

        // 操作説明
        ctx.font = '16px "Segoe UI", sans-serif';
        ctx.fillStyle = '#8899AA';
        ctx.fillText('← → : 移動　　↑ / Z / Space : ジャンプ　　P : ポーズ', GAME_WIDTH / 2, 530);
        ctx.fillText('Original: Chiku (2007) | HD Remake Edition', GAME_WIDTH / 2, 560);

        // 注意文
        ctx.font = 'bold 14px "Segoe UI", sans-serif';
        ctx.fillStyle = '#FF8888';
        ctx.fillText('※ 理不尽トラップ多数！覚悟してプレイしてください', GAME_WIDTH / 2, 590);
    }

    _drawGame(ctx) {
        // 背景
        this.background.draw(ctx, this.camera);

        ctx.save();

        // タイル描画
        this._drawTiles(ctx);

        // 動く足場
        this.movingPlatforms.draw(ctx, this.camera);

        // 敵描画
        this.enemyManager.draw(ctx, this.camera);

        // プレイヤー描画
        this.player.draw(ctx, this.camera);

        // ボス描画
        this.bossManager.draw(ctx, this.camera);

        // トラップオーバーレイ
        this.trapManager.drawOverlays(ctx, this.camera, this.level);

        // パーティクル
        this.particles.draw(ctx, this.camera);

        // フローティングテキスト
        this.ui.drawFloatingTexts(ctx, this.camera);

        ctx.restore();

        // HUD
        this.ui.drawHUD(ctx, this.player, this.currentStage);

        // 通知
        this.ui.drawNotifications(ctx);

        // 死亡時のリスポーンメッセージ
        if (this.state === STATE.DEATH && this.deathRespawnTimer >= this.deathRespawnDelay) {
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, GAME_HEIGHT / 2 - 30, GAME_WIDTH, 60);
            ctx.font = 'bold 24px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Press ENTER or SPACE to respawn', GAME_WIDTH / 2, GAME_HEIGHT / 2);
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.fillStyle = '#aaaaaa';
            ctx.fillText(`(´;ω;\`) Lives: ${this.player.lives}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 25);
        }
    }

    _drawTiles(ctx) {
        if (!this.level) return;
        const drawX = this.camera.getDrawX();
        const drawY = this.camera.getDrawY();
        const startCol = Math.max(0, Math.floor(-drawX / TILE_SIZE) - 1);
        const endCol = Math.min(this.level.width, startCol + TILE_COLS_VISIBLE + 2);
        const startRow = 0;
        const endRow = this.level.height;

        for (let row = startRow; row < endRow; row++) {
            for (let col = startCol; col < endCol; col++) {
                const tile = this.level.getTile(col, row);
                if (tile === TILE.EMPTY) continue;
                const data = this.level.getTileData(col, row);
                const x = col * TILE_SIZE + drawX;
                const y = row * TILE_SIZE + drawY;
                this.tileRenderer.drawTile(ctx, tile, x, y, data);
            }
        }
    }

    _drawStageClear(ctx) {
        ctx.save();
        const alpha = MathUtils.clamp(this.gameTime * 0.5, 0, 0.7);
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.font = 'bold 48px "Segoe UI", sans-serif';
        ctx.fillStyle = '#FFD700';
        ctx.fillText('STAGE CLEAR!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40);

        ctx.font = '24px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`(´・ω・\`)ノ やったね！`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);

        ctx.font = '20px "Segoe UI", sans-serif';
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText(`Score: ${this.player.score}  Coins: ${this.player.coins}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 45);

        if (this.gameTime > 2.0) {
            const blink = Math.sin(this.gameTime * 3) > 0;
            if (blink) {
                ctx.font = '18px "Segoe UI", sans-serif';
                ctx.fillStyle = '#88aacc';
                if (this.currentStage >= this.totalStages) {
                    ctx.fillText('Press ENTER to see credits', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 85);
                } else {
                    ctx.fillText('Press ENTER for next stage', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 85);
                }
            }
        }
        ctx.restore();
    }
}

class ExtendedTileRenderer {
    constructor(baseTileRenderer) {
        this.base = baseTileRenderer;
        this.animTime = 0;
    }

    update(dt) {
        this.animTime += dt;
    }

    drawTile(ctx, tileType, x, y, tileData) {
        switch (tileType) {
            case TILE_EX.FAKE_COIN: this._drawFakeCoin(ctx, x, y); break;
            case TILE_EX.QUICKSAND: this._drawQuicksand(ctx, x, y); break;
            case TILE_EX.DARK_ZONE: this._drawDarkZone(ctx, x, y); break;
            case TILE_EX.WIND_ZONE_LEFT:
            case TILE_EX.WIND_ZONE_RIGHT:
            case TILE_EX.WIND_ZONE_UP:
                this._drawWindZone(ctx, x, y, tileType); break;
            case TILE_EX.POISON_WATER: this._drawPoisonWater(ctx, x, y); break;
            case TILE_EX.FAKE_SPIKE: this._drawFakeSpike(ctx, x, y); break;
            case TILE_EX.ARROW_SIGN: this._drawArrowSign(ctx, x, y, tileData); break;
            case TILE_EX.FAKE_GOAL: this._drawFakeGoal(ctx, x, y, tileData); break;
            case TILE_EX.EXPLOSIVE_BRICK: this._drawExplosiveBrick(ctx, x, y, tileData); break;
            case TILE_EX.GHOST_BLOCK: this._drawGhostBlock(ctx, x, y, tileData); break;
            case TILE_EX.RAINBOW_BLOCK: this._drawRainbowBlock(ctx, x, y); break;
            case TILE_EX.MUSIC_BLOCK: this._drawMusicBlock(ctx, x, y, tileData); break;
            case TILE_EX.CRACKED_GROUND: this._drawCrackedGround(ctx, x, y, tileData); break;
            case TILE_EX.FAKE_PIPE: this._drawFakePipe(ctx, x, y); break;
            case TILE_EX.TRAP_DOOR: this._drawTrapDoor(ctx, x, y, tileData); break;
            case TILE_EX.FLAME_JET: this._drawFlameJet(ctx, x, y, tileData); break;
            case TILE_EX.SAWBLADE_RAIL: this._drawSawbladeRail(ctx, x, y, tileData); break;
            case TILE_EX.PRESSURE_PLATE: this._drawPressurePlate(ctx, x, y, tileData); break;
            case TILE_EX.GATE_BLOCK: this._drawGateBlock(ctx, x, y, tileData); break;
            case TILE_EX.SLIME_BLOCK: this._drawSlimeBlock(ctx, x, y); break;
            case TILE_EX.GRAVITY_FLIP: this._drawGravityFlip(ctx, x, y); break;
            case TILE_EX.ANTI_GRAVITY: this._drawAntiGravity(ctx, x, y); break;
            case TILE_EX.BOUNCE_WALL: this._drawBounceWall(ctx, x, y); break;
            case TILE_EX.TELEPORT_IN: this._drawTeleporter(ctx, x, y, '#4488ff', tileData); break;
            case TILE_EX.TELEPORT_OUT: this._drawTeleporter(ctx, x, y, '#ff8844', tileData); break;
            case TILE_EX.SHRINK_BLOCK: this._drawShrinkBlock(ctx, x, y, tileData); break;
            case TILE_EX.GROW_BLOCK: this._drawGrowBlock(ctx, x, y, tileData); break;
            case TILE_EX.TEXT_SIGN: this._drawTextSign(ctx, x, y, tileData); break;
            case TILE_EX.DECORATION_TORCH: this._drawTorch(ctx, x, y); break;
            case TILE_EX.ROTATING_PLATFORM: this._drawRotatingPlatform(ctx, x, y, tileData); break;
            case TILE_EX.PENDULUM_PLATFORM: this._drawPendulumPlatform(ctx, x, y, tileData); break;
            case TILE_EX.MIRROR_BLOCK: this._drawMirrorBlock(ctx, x, y); break;
            case TILE_EX.MAGNET_BLOCK: this._drawMagnetBlock(ctx, x, y, tileData); break;
            case TILE_EX.INVISIBLE_WALL: break; // 見えない
            case TILE_EX.KEY_BLOCK: this._drawKeyBlock(ctx, x, y, tileData); break;
            case TILE_EX.FAKE_ENEMY: this._drawFakeEnemy(ctx, x, y); break;
            default: break;
        }
    }

    _drawFakeCoin(ctx, x, y) {
        // 見た目はコインだが取ると死ぬ
        const bob = Math.sin(this.animTime * 3 + x * 0.1) * 2;
        const cx = x + TILE_SIZE / 2;
        const cy = y + TILE_SIZE / 2 + bob;
        const scaleX = Math.abs(Math.cos(this.animTime * 3));

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scaleX, 1);

        // 毒々しい緑がかった金色
        const grd = ctx.createRadialGradient(0, -2, 1, 0, 0, 10);
        grd.addColorStop(0, '#DDFF44');
        grd.addColorStop(0.7, '#AACC00');
        grd.addColorStop(1, '#668800');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // 毒マーク（微かに見える）
        ctx.fillStyle = 'rgba(100,0,100,0.15)';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☠', 0, 0);

        ctx.restore();
    }

    _drawQuicksand(ctx, x, y) {
        const wave1 = Math.sin(this.animTime * 1.5 + x * 0.05) * 2;
        const wave2 = Math.sin(this.animTime * 2.3 + x * 0.08) * 1.5;
        const grd = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
        grd.addColorStop(0, '#D4A843');
        grd.addColorStop(0.3, '#C4983A');
        grd.addColorStop(0.6, '#B48830');
        grd.addColorStop(1, '#A47825');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        // 波紋
        ctx.strokeStyle = 'rgba(180,140,60,0.4)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(x, y + 8 + i * 10 + wave1);
            ctx.quadraticCurveTo(x + TILE_SIZE / 2, y + 5 + i * 10 + wave2, x + TILE_SIZE, y + 8 + i * 10 + wave1);
            ctx.stroke();
        }

        // 泡
        const bubT = (this.animTime * 2 + x * 0.1) % 3;
        if (bubT < 0.8) {
            ctx.fillStyle = `rgba(200,170,80,${0.5 - bubT * 0.6})`;
            ctx.beginPath();
            ctx.arc(x + 12 + Math.sin(this.animTime) * 3, y + 6 - bubT * 6, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawDarkZone(ctx, x, y) {
        // 暗闘エリア
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        // 薄い光の粒
        const flicker = Math.sin(this.animTime * 5 + x + y) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(60,60,100,${flicker * 0.3})`;
        ctx.beginPath();
        ctx.arc(x + 16, y + 16, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawWindZone(ctx, x, y, type) {
        ctx.fillStyle = 'rgba(200,230,255,0.08)';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        // 風の線
        ctx.strokeStyle = 'rgba(150,200,255,0.25)';
        ctx.lineWidth = 1;
        const dir = type === TILE_EX.WIND_ZONE_LEFT ? -1 : (type === TILE_EX.WIND_ZONE_RIGHT ? 1 : 0);
        const upWind = type === TILE_EX.WIND_ZONE_UP;

        for (let i = 0; i < 3; i++) {
            const offset = (this.animTime * 60 * (dir || 1) + i * 12) % TILE_SIZE;
            ctx.beginPath();
            if (upWind) {
                const ly = y + TILE_SIZE - offset;
                ctx.moveTo(x + 4 + i * 10, ly);
                ctx.lineTo(x + 4 + i * 10 + Math.sin(ly * 0.2) * 3, ly - 8);
            } else {
                ctx.moveTo(x + offset, y + 6 + i * 10);
                ctx.lineTo(x + offset + dir * 10, y + 6 + i * 10 + Math.sin(offset * 0.3) * 2);
            }
            ctx.stroke();
        }
    }

    _drawPoisonWater(ctx, x, y) {
        const wave = Math.sin(this.animTime * 2.5 + x * 0.09) * 2;
        const grd = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
        grd.addColorStop(0, 'rgba(80,180,60,0.7)');
        grd.addColorStop(0.5, 'rgba(60,150,40,0.8)');
        grd.addColorStop(1, 'rgba(40,120,20,0.9)');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        // 泡
        ctx.fillStyle = 'rgba(120,220,80,0.5)';
        const bub = (this.animTime * 1.8 + x * 0.07) % 2.5;
        if (bub < 1) {
            ctx.beginPath();
            ctx.arc(x + 10, y + 10 - bub * 8 + wave, 2 + bub, 0, Math.PI * 2);
            ctx.fill();
        }

        // 骸骨マーク（水面に浮く）
        ctx.fillStyle = 'rgba(200,255,150,0.15)';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('☠', x + 16, y + 8 + wave);
    }

    _drawFakeSpike(ctx, x, y) {
        // 見た目はスパイクだが実は安全
        ctx.fillStyle = '#888888';
        ctx.fillRect(x, y + TILE_SIZE * 0.6, TILE_SIZE, TILE_SIZE * 0.4);
        const spikeCount = 4;
        const spikeWidth = TILE_SIZE / spikeCount;
        for (let i = 0; i < spikeCount; i++) {
            const sx = x + i * spikeWidth;
            // 少し色が薄い（ヒント）
            const grd = ctx.createLinearGradient(sx, y, sx, y + TILE_SIZE * 0.7);
            grd.addColorStop(0, '#cccccc');
            grd.addColorStop(0.5, '#bbbbbb');
            grd.addColorStop(1, '#999999');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.moveTo(sx, y + TILE_SIZE * 0.65);
            ctx.lineTo(sx + spikeWidth / 2, y + 4);
            ctx.lineTo(sx + spikeWidth, y + TILE_SIZE * 0.65);
            ctx.closePath();
            ctx.fill();
        }
    }

    _drawArrowSign(ctx, x, y, tileData) {
        ctx.fillStyle = '#AA8855';
        ctx.fillRect(x + 12, y + 16, 8, 16);
        ctx.fillStyle = '#DDCC88';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, 18);
        ctx.fillStyle = '#886633';
        ctx.strokeStyle = '#665522';
        ctx.lineWidth = 2;
        const dir = tileData && tileData.direction || 'right';
        ctx.beginPath();
        if (dir === 'right') {
            ctx.moveTo(x + 8, y + 6);
            ctx.lineTo(x + 24, y + 11);
            ctx.lineTo(x + 8, y + 16);
        } else if (dir === 'left') {
            ctx.moveTo(x + 24, y + 6);
            ctx.lineTo(x + 8, y + 11);
            ctx.lineTo(x + 24, y + 16);
        } else if (dir === 'up') {
            ctx.moveTo(x + 8, y + 16);
            ctx.lineTo(x + 16, y + 4);
            ctx.lineTo(x + 24, y + 16);
        } else {
            ctx.moveTo(x + 8, y + 4);
            ctx.lineTo(x + 16, y + 16);
            ctx.lineTo(x + 24, y + 4);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    _drawFakeGoal(ctx, x, y, tileData) {
        // 偽ゴール（触ると死ぬ旗）
        const poleX = x + TILE_SIZE / 2 - 2;
        ctx.fillStyle = '#999';
        ctx.fillRect(poleX, y, 4, TILE_SIZE);

        // 赤い旗（微妙にドクロ付き）
        const wave = Math.sin(this.animTime * 3) * 2;
        ctx.fillStyle = '#cc2222';
        ctx.beginPath();
        ctx.moveTo(poleX + 4, y + 4);
        ctx.lineTo(poleX + 22, y + 10 + wave);
        ctx.lineTo(poleX + 4, y + 18);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.font = '8px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('☠', poleX + 13, y + 13 + wave * 0.5);
    }

    _drawExplosiveBrick(ctx, x, y, tileData) {
        this.base._drawBrick(ctx, x, y);
        // 導火線
        const fuseGlow = Math.sin(this.animTime * 8) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(255,200,0,${fuseGlow})`;
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE / 2, y + 4, 3, 0, Math.PI * 2);
        ctx.fill();
        // TNTマーク
        ctx.fillStyle = 'rgba(255,0,0,0.4)';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('TNT', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
    }

    _drawGhostBlock(ctx, x, y, tileData) {
        const cycle = (this.animTime * 0.5) % 2;
        const alpha = cycle < 1 ? MathUtils.smoothStep(cycle) : MathUtils.smoothStep(2 - cycle);
        ctx.globalAlpha = alpha * 0.6 + 0.1;
        const grd = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
        grd.addColorStop(0, '#aaaaff');
