class LevelBuilder {
    static buildStage(stageNum) {
        const level = new Level();
        level.init(stageNum);

        switch (stageNum) {
            case 1: LevelBuilder._buildStage1(level); break;
            case 2: LevelBuilder._buildStage2(level); break;
            case 3: LevelBuilder._buildStage3(level); break;
            case 4: LevelBuilder._buildStage4(level); break;
            default: LevelBuilder._buildStage1(level); break;
        }

        return level;
    }

    static _fillRow(level, y, startX, endX, tile) {
        for (let x = startX; x <= endX; x++) {
            level.setTile(x, y, tile);
        }
    }

    static _fillRect(level, x1, y1, x2, y2, tile) {
        for (let y = y1; y <= y2; y++) {
            for (let x = x1; x <= x2; x++) {
                level.setTile(x, y, tile);
            }
        }
    }

    static _placePipe(level, x, topY, height) {
        level.setTile(x, topY, TILE.PIPE_TL);
        level.setTile(x + 1, topY, TILE.PIPE_TR);
        for (let i = 1; i < height; i++) {
            level.setTile(x, topY + i, TILE.PIPE_BL);
            level.setTile(x + 1, topY + i, TILE.PIPE_BR);
        }
    }

    static _buildStage1(level) {
        level.theme = 'overworld';
        const cols = 220;
        const rows = 20;
        level.setSize(cols, rows);
        level.playerStartX = 3 * TILE_SIZE;
        level.playerStartY = 16 * TILE_SIZE;

        // 地面 (行18-19)
        LevelBuilder._fillRect(level, 0, 18, 45, 19, TILE.GROUND);
        // 穴
        LevelBuilder._fillRect(level, 48, 18, 100, 19, TILE.GROUND);
        LevelBuilder._fillRect(level, 103, 18, 150, 19, TILE.GROUND);
        LevelBuilder._fillRect(level, 153, 18, 220, 19, TILE.GROUND);

        // === トラップ1: 最初のコインブロックが上昇する ===
        level.setTile(8, 14, TILE.RISING_BLOCK);

        // 普通のブロック
        level.setTile(10, 14, TILE.QUESTION);
        level.setTile(11, 14, TILE.BRICK);
        level.setTile(12, 14, TILE.QUESTION);
        level.setTile(13, 14, TILE.BRICK);
        level.setTile(14, 14, TILE.QUESTION);

        // === トラップ2: 落ちる地面 ===
        for (let x = 18; x <= 20; x++) {
            level.setTile(x, 18, TILE.FALLING_GROUND);
            level.setTile(x, 19, TILE.GROUND);
        }

        // === トラップ3: パイプからの驚き敵 ===
        LevelBuilder._placePipe(level, 24, 16, 4);
        level.addEnemy(new PiranhaPlant(24 * TILE_SIZE + 3, 14 * TILE_SIZE));

        // クリボー (通常)
        level.addEnemy(new Goomba(15 * TILE_SIZE, 16 * TILE_SIZE));

        // === トラップ4: 見えない地面が消える ===
        for (let x = 30; x <= 33; x++) {
            level.setTile(x, 18, TILE.FAKE_GROUND);
        }
        // 下にスパイク
        for (let x = 30; x <= 33; x++) {
            level.setTile(x, 18, TILE.GROUND);
        level.setTile(x, 19, TILE.GROUND);
    }

    // パイプ1（しょぼん名物：入れそうで入れないパイプ）
    level.setTile(31, 16, TILE.PIPE_TL);
    level.setTile(32, 16, TILE.PIPE_TR);
    level.setTile(31, 17, TILE.PIPE_BL);
    level.setTile(32, 17, TILE.PIPE_BR);

    // ★トラップ: 落ちる地面（見た目普通）
    for (let x = 34; x <= 36; x++) {
        level.setTile(x, 18, TILE.FAKE_GROUND);
        level.setTile(x, 19, TILE.GROUND);
        level.tileData[`${x},18`] = { fake: true, triggered: false, fallTimer: 0, fallDelay: 0.15, vy: 0 };
    }

    // 地面続き
    for (let x = 37; x <= 48; x++) {
        level.setTile(x, 18, TILE.GROUND);
        level.setTile(x, 19, TILE.GROUND);
    }

    // ?ブロック群（1つはスパイク、1つは上昇ブロック）
    level.setTile(38, 14, TILE.QUESTION);
    level.tileData['38,14'] = { contents: 'coin', used: false, bounceOffset: 0 };

    // ★トラップ: 叩くとスパイクが出る
    level.setTile(40, 14, TILE.SPIKE_BLOCK);
    level.tileData['40,14'] = { activated: false };

    // ★トラップ: 叩くと上に飛んでいく?ブロック（本家再現）
    level.setTile(42, 14, TILE.RISING_BLOCK);
    level.tileData['42,14'] = { used: false, bounceOffset: 0, rising: false, risingSpeed: 0 };

    level.setTile(44, 14, TILE.QUESTION);
    level.tileData['44,14'] = { contents: 'coin', used: false, bounceOffset: 0 };

    // 敵配置
    level.addEnemy(ENEMY_TYPE.GOOMBA, 37 * TILE_SIZE, 17 * TILE_SIZE, { dir: -1, patrolRange: 80 });
    level.addEnemy(ENEMY_TYPE.GOOMBA, 43 * TILE_SIZE, 17 * TILE_SIZE, { dir: -1, patrolRange: 96 });

    // ★トラップ: 頭上からサプライズ敵
    level.addEnemy(ENEMY_TYPE.SURPRISE_ENEMY, 41 * TILE_SIZE, 5 * TILE_SIZE, {
        triggerX: 41 * TILE_SIZE, triggerDistance: 80, hidden: true, spawnDir: 'down'
    });

    // ============ 穴セクション1 ============
    // x=49~51は穴（地面なし）

    // ブロック足場（穴の上）
    level.setTile(49, 15, TILE.BRICK);
    level.setTile(50, 15, TILE.BRICK);

    // ★トラップ: 真ん中は崩れるブロック
    level.setTile(50, 15, TILE.CRUMBLE_BRICK);
    level.tileData['50,15'] = { crumbling: false, crumbleProgress: 0, stepTimer: 0, stepDelay: 0.4 };

    // 穴後の地面再開
    for (let x = 52; x <= 65; x++) {
        level.setTile(x, 18, TILE.GROUND);
        level.setTile(x, 19, TILE.GROUND);
    }

    // パイプ2（高パイプ）
    level.setTile(54, 15, TILE.PIPE_TL);
    level.setTile(55, 15, TILE.PIPE_TR);
    level.setTile(54, 16, TILE.PIPE_BL);
    level.setTile(55, 16, TILE.PIPE_BR);
    level.setTile(54, 17, TILE.PIPE_BL);
    level.setTile(55, 17, TILE.PIPE_BR);

    // ★トラップ: パイプの裏に隠し敵
    level.addEnemy(ENEMY_TYPE.PIRANHA, 54 * TILE_SIZE + 16, 14 * TILE_SIZE, {

    // ★トラップ: 偽スター（取ると死ぬ）
    level.addEnemy(ENEMY_TYPE.TRAP_STAR, 52 * TILE_SIZE, 15 * TILE_SIZE, { hidden: false });

    // ファイアバー連続
    level.addEnemy(ENEMY_TYPE.FIRE_BAR, 55 * TILE_SIZE, 14 * TILE_SIZE, { length: 3, speed: 2.5, angle: 0 });
    level.addEnemy(ENEMY_TYPE.FIRE_BAR, 58 * TILE_SIZE, 14 * TILE_SIZE, { length: 3, speed: -2.5, angle: Math.PI });

    // チェックポイント
    level.setTile(60, 16, TILE.CHECKPOINT);
    level.tileData['60,16'] = { activated: false };
    level.checkpoints.push({ x: 60 * TILE_SIZE, y: 15 * TILE_SIZE, activated: false });

    // ★大トラップ: 追跡溶岩（後ろから溶岩が迫ってくる）
    level.risingLava = {
        startX: 65 * TILE_SIZE,
        active: false,
        lavaX: 0,
        lavaSpeed: 2.0
    };

    // スプリントセクション（溶岩から逃げる）
    for (let x = 65; x <= 95; x++) {
        level.setTile(x, 17, TILE.CASTLE_FLOOR);
    }

    // 障害物
    level.setTile(70, 15, TILE.CASTLE_BRICK);
    level.setTile(70, 16, TILE.CASTLE_BRICK);
    level.setTile(75, 14, TILE.CASTLE_BRICK);
    level.setTile(75, 15, TILE.CASTLE_BRICK);
    level.setTile(75, 16, TILE.CASTLE_BRICK);

    // 穴（ジャンプ必須）
    for (let x = 78; x <= 80; x++) {
        level.setTile(x, 17, TILE.EMPTY);
        level.setTile(x, 18, TILE.LAVA);
    }

    for (let x = 85; x <= 87; x++) {
        level.setTile(x, 17, TILE.EMPTY);
        level.setTile(x, 18, TILE.LAVA);
    }

    // ============ ボスエリア ============
    // ボス部屋入口
    for (let y = 2; y <= 17; y++) {
        level.setTile(96, y, TILE.CASTLE_BRICK);
    }
    // 入口ドア
    level.setTile(96, 15, TILE.EMPTY);
    level.setTile(96, 16, TILE.EMPTY);

    // ボス部屋
    for (let x = 97; x <= 130; x++) {
        level.setTile(x, 17, TILE.CASTLE_FLOOR);
    }

    // ボストリガー
    level.setTile(100, 16, TILE.BOSS_TRIGGER);
    level.tileData['100,16'] = { triggered: false };

    // ボス: オニオンキング
    level.bossData = {
        type: ENEMY_TYPE.ONION_KING,
        x: 120 * TILE_SIZE,
        y: 10 * TILE_SIZE,
        hp: 10,
        maxHp: 10,
        active: false,
        phase: 0,
        attackTimer: 0,
        patterns: ['jump_slam', 'throw_minions', 'charge', 'rain_fire', 'laser_sweep'],
        currentPattern: 0,
        patternTimer: 0,
        invincible: false,
        invincibleTimer: 0
    };

    // ボス撃破後のゴール
    level.trueGoalX = 128 * TILE_SIZE;
    level.goalData = { poleX: -1, trapType: 'none', triggered: false };

    return level;
}


// ============================================================
// SECTION 17: レベルクラス
// ============================================================

class Level {
    constructor(width, height, type) {
        this.width = width;
        this.height = height;
        this.type = type;
        this.tiles = new Array(width * height).fill(TILE.EMPTY);
        this.tileData = {};
        this.enemies = [];
        this.movingPlatforms = [];
        this.checkpoints = [];
        this.goalData = null;
        this.trueGoalX = 0;
        this.playerStartX = 2 * TILE_SIZE;
        this.playerStartY = 16 * TILE_SIZE;
        this.bgType = 'overworld';
        this.musicType = 'overworld';
        this.bossData = null;
        this.risingLava = null;
        this.scrollLock = null;
        this.triggers = [];
        this.decorations = [];
        this.eventFlags = {};
    }

    getTile(col, row) {
        if (col < 0 || col >= this.width || row < 0 || row >= this.height) return TILE.EMPTY;
        return this.tiles[row * this.width + col];
    }

    setTile(col, row, type) {
        if (col < 0 || col >= this.width || row < 0 || row >= this.height) return;
        this.tiles[row * this.width + col] = type;
    }

    getTileData(col, row) {
        return this.tileData[`${col},${row}`] || null;
    }

    setTileData(col, row, data) {
        this.tileData[`${col},${row}`] = data;
    }

    addEnemy(type, x, y, config = {}) {
        this.enemies.push({
            type, x, y, startX: x, startY: y,
            ...config,
            active: true, alive: true, vx: 0, vy: 0,
            animTimer: 0, stateTimer: 0
        });
    }

    addMovingPlatform(x1, y1, x2, y2, speed) {
        this.movingPlatforms.push({
            x1, y1, x2, y2, speed,
            x: x1, y: y1, progress: 0, direction: 1,
            width: TILE_SIZE * 3, height: 12,
            carrying: false
        });
    }

    isSolid(col, row) {
        const tile = this.getTile(col, row);
        const data = this.getTileData(col, row);
        if (data && data.fake && !data.triggered) return true;
        if (data && data.fake && data.triggered) return false;
        if (tile === TILE.INVISIBLE && data && data.solid && !data.revealed) return false;
        if (tile === TILE.VANISH_BLOCK && data && data.alpha <= 0) return false;
        if (tile === TILE.TIMED_BLOCK && data && data.phase >= 0.5) return false;
        if (tile === TILE.CRUMBLE_BRICK && data && data.crumbleProgress >= 1) return false;

        const solidTiles = [
            TILE.GROUND, TILE.BRICK, TILE.QUESTION, TILE.BLOCK,
            TILE.PIPE_TL, TILE.PIPE_TR, TILE.PIPE_BL, TILE.PIPE_BR,
            TILE.CASTLE_BRICK, TILE.CASTLE_WALL, TILE.CASTLE_FLOOR,
            TILE.ICE, TILE.UNDERGROUND_BRICK, TILE.CRUMBLE_BRICK,
            TILE.FALLING_GROUND, TILE.FAKE_GROUND, TILE.SPIKE_BLOCK,
            TILE.RISING_BLOCK, TILE.TRAP_COIN_BLOCK, TILE.VANISH_BLOCK,
            TILE.TIMED_BLOCK, TILE.CANNON, TILE.CONVEYOR_LEFT, TILE.CONVEYOR_RIGHT
        ];
        return solidTiles.includes(tile);
    }

    isOneWay(col, row) {
        const tile = this.getTile(col, row);
        return tile === TILE.ONEWAY_PLATFORM || tile === TILE.CLOUD_PLATFORM || tile === TILE.BRIDGE;
    }

    isDangerous(col, row) {
        const tile = this.getTile(col, row);
        return tile === TILE.SPIKE || tile === TILE.LAVA || tile === TILE.HIDDEN_SPIKE;
    }

    isLadder(col, row) {
        return this.getTile(col, row) === TILE.LADDER;
    }

    getWorldWidth() {
        return this.width * TILE_SIZE;
    }

    getWorldHeight() {
        return this.height * TILE_SIZE;
    }
}


// ============================================================
// SECTION 18: プレイヤークラス
// ============================================================

class Player {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.width = PLAYER_WIDTH;
        this.height = PLAYER_HEIGHT;
        this.onGround = false;
        this.onIce = false;
        this.onConveyor = 0;
        this.onLadder = false;
        this.facingRight = true;
        this.alive = true;
        this.deathTimer = 0;
        this.deathType = '';
        this.invincible = false;
        this.invincibleTimer = 0;
        this.lives = 0;  // しょぼん方式：マイナスになる
        this.coins = 0;
        this.score = 0;
        this.animFrame = 0;
        this.animTimer = 0;
        this.runAnimSpeed = 0.08;
        this.jumpSquash = 1.0;
        this.landSquash = 1.0;
        this.squashTimer = 0;
        this.eyeState = 'normal'; // normal, blink, surprised, dead, happy
        this.eyeTimer = 0;
        this.trailTimer = 0;
        this.coyoteTime = 0;
        this.jumpBufferTime = 0;
        this.wasOnGround = false;
        this.jumpHeld = false;
        this.maxJumpTime = 0.25;
        this.jumpTime = 0;
        this.wallSliding = false;
        this.wallDir = 0;
        this.respawnX = 0;
        this.respawnY = 0;
        this.deathAnimVY = 0;
        this.deathAnimTimer = 0;
        this.frozen = false;
        this.frozenTimer = 0;
        this.speedMultiplier = 1.0;
        this.bounceCount = 0;
        this.comboTimer = 0;
        this.comboCount = 0;
        this.dustTimer = 0;
        this.stepSoundTimer = 0;
        this.enteredPipe = false;
        this.pipeTimer = 0;
    }

    reset(startX, startY) {
        this.x = startX;
        this.y = startY;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.onIce = false;
        this.onConveyor = 0;
        this.onLadder = false;
        this.facingRight = true;
        this.alive = true;
        this.deathTimer = 0;
        this.deathType = '';
        this.invincible = false;
        this.invincibleTimer = 0;
        this.animFrame = 0;
        this.animTimer = 0;
        this.jumpSquash = 1.0;
        this.landSquash = 1.0;
        this.squashTimer = 0;
        this.eyeState = 'normal';
        this.coyoteTime = 0;
        this.jumpBufferTime = 0;
        this.wasOnGround = false;
        this.jumpHeld = false;
        this.jumpTime = 0;
        this.wallSliding = false;
        this.frozen = false;
        this.enteredPipe = false;
        this.respawnX = startX;
        this.respawnY = startY;
    }

    die(type = 'normal', game) {
        if (this.invincible || !this.alive) return;
        this.alive = false;
        this.deathType = type;
        this.deathTimer = 0;
        this.deathAnimVY = -8;
        this.deathAnimTimer = 0;
        this.lives--;
        this.eyeState = 'dead';

        if (game) {
            game.audio.play('death');
            game.camera.shake(8, 0.3);
            game.camera.flash('#ff0000', 0.3);
            game.particles.emitDeathEffect(this.x + this.width / 2, this.y + this.height / 2);
        }
    }

    update(dt, input, level, game) {
        if (!this.alive) {
            this._updateDeath(dt, game);
            return;
        }

        if (this.frozen) {
            this.frozenTimer -= dt;
            if (this.frozenTimer <= 0) this.frozen = false;
            return;
        }

        // 入力処理
        this._handleInput(dt, input, level, game);

        // 物理演算
        this._applyPhysics(dt, level, game);

        // コリジョン
        this._handleCollision(dt, level, game);

        // アニメーション更新
        this._updateAnimation(dt, input, game);

        // 状態更新
        this._updateState(dt, game);

        // 画面外落下チェック
        if (this.y > level.getWorldHeight() + 100) {
            this.die('fall', game);
        }
    }

    _handleInput(dt, input, level, game) {
        const speed = PLAYER_SPEED * this.speedMultiplier;
        const accel = this.onIce ? 0.15 : 0.5;
        const decel = this.onIce ? 0.02 : 0.2;

        // 左右移動
        if (input.isLeft()) {
            this.vx = MathUtils.lerp(this.vx, -speed, accel);
            this.facingRight = false;
        } else if (input.isRight()) {
            this.vx = MathUtils.lerp(this.vx, speed, accel);
            this.facingRight = true;
        } else {
            this.vx = MathUtils.lerp(this.vx, 0, decel);
            if (Math.abs(this.vx) < 0.1) this.vx = 0;
        }

        // コンベア影響
        if (this.onConveyor !== 0) {
            this.vx += this.onConveyor * 1.5;
        }

        // コヨーテタイム（地面離れた直後でもジャンプ可能）
        if (this.onGround) {
            this.coyoteTime = 0.1;
        } else {
            this.coyoteTime -= dt;
        }

        // ジャンプバッファ
        if (input.isJumpPressed()) {
            this.jumpBufferTime = 0.1;
        } else {
            this.jumpBufferTime -= dt;
        }

        // ジャンプ
        if (this.jumpBufferTime > 0 && this.coyoteTime > 0 && !this.onLadder) {
            this.vy = PLAYER_JUMP_FORCE;
            this.onGround = false;
            this.coyoteTime = 0;
            this.jumpBufferTime = 0;
            this.jumpHeld = true;
            this.jumpTime = 0;
            this.jumpSquash = 0.7;
            this.squashTimer = 0.15;

            if (game) {
                game.audio.play('jump', 0.5, MathUtils.randomRange(0.9, 1.1));
                game.particles.emitDustPuff(this.x + this.width / 2, this.y + this.height);
            }
        }

        // 可変ジャンプ高さ（長押しで高く）
        if (this.jumpHeld && input.isJumpDown()) {
            this.jumpTime += dt;
            if (this.jumpTime < this.maxJumpTime) {
                this.vy -= 0.5;
            }
        }
        if (!input.isJumpDown()) {
            this.jumpHeld = false;
            if (this.vy < -3) {
                this.vy *= 0.6;
            }
        }

        // はしご処理
        const col = Math.floor((this.x + this.width / 2) / TILE_SIZE);
        const row = Math.floor((this.y + this.height / 2) / TILE_SIZE);
        if (level.isLadder(col, row)) {
            if (input.isUp()) {
                this.onLadder = true;
                this.vy = -3;
                this.vx *= 0.5;
            } else if (input.isDown_key()) {
                this.onLadder = true;
                this.vy = 3;
                this.vx *= 0.5;
            }
        } else {
            this.onLadder = false;
        }

        // 下キーでパイプ入力
        if (input.isDown_key() && this.onGround) {
            const pCol = Math.floor((this.x + this.width / 2) / TILE_SIZE);
            const pRow = Math.floor((this.y + this.height) / TILE_SIZE);
            const tile = level.getTile(pCol, pRow - 1);
            if (tile === TILE.PIPE_TL || tile === TILE.PIPE_TR) {
                const data = level.getTileData(pCol, pRow - 1);
                if (data && data.warpTarget) {
                    this.enteredPipe = true;
                    this.pipeTimer = 0;
                    this.frozen = true;
                    this.frozenTimer = 1.0;
                    if (game) game.audio.play('pipe');
                }
            }
        }
    }

    _applyPhysics(dt, level, game) {
        // 重力
        if (!this.onLadder) {
            this.vy += GRAVITY;
            if (this.vy > MAX_FALL_SPEED) this.vy = MAX_FALL_SPEED;
        }
    }

    _handleCollision(dt, level, game) {
        this.onGround = false;
        this.onIce = false;
        this.onConveyor = 0;

        // X軸コリジョン
        this.x += this.vx;
        this._resolveCollisionX(level, game);

        // Y軸コリジョン
        this.y += this.vy;
        this._resolveCollisionY(level, game);

        // 壁制限
        if (this.x < 0) { this.x = 0; this.vx = 0; }
        if (this.x + this.width > level.getWorldWidth()) {
            this.x = level.getWorldWidth() - this.width;
            this.vx = 0;
        }
    }

    _resolveCollisionX(level, game) {
        const top = Math.floor(this.y / TILE_SIZE);
        const bottom = Math.floor((this.y + this.height - 1) / TILE_SIZE);
        const left = Math.floor(this.x / TILE_SIZE);
        const right = Math.floor((this.x + this.width - 1) / TILE_SIZE);

        for (let row = top; row <= bottom; row++) {
            for (let col = left; col <= right; col++) {
                if (level.isSolid(col, row)) {
                    if (this.vx > 0) {
                        this.x = col * TILE_SIZE - this.width;
                        this.vx = 0;
                    } else if (this.vx < 0) {
                        this.x = (col + 1) * TILE_SIZE;
                        this.vx = 0;
                    }
                }

                // 危険タイルチェック
                if (level.isDangerous(col, row)) {
                    this.die('spike', game);
                }
            }
        }
    }

    _resolveCollisionY(level, game) {
        const top = Math.floor(this.y / TILE_SIZE);
        const bottom = Math.floor((this.y + this.height - 1) / TILE_SIZE);
        const left = Math.floor(this.x / TILE_SIZE);
        const right = Math.floor((this.x + this.width - 1) / TILE_SIZE);

        for (let row = top; row <= bottom; row++) {
            for (let col = left; col <= right; col++) {
                const tile = level.getTile(col, row);
                const data = level.getTileData(col, row);

                if (level.isSolid(col, row)) {
                    if (this.vy > 0) {
                        // 着地
                        this.y = row * TILE_SIZE - this.height;
                        this.vy = 0;
                        if (!this.onGround) {
                            this._onLand(col, row, level, game);
                        }
                        this.onGround = true;

                        // 氷チェック
                        if (tile === TILE.ICE) this.onIce = true;
                        if (tile === TILE.CONVEYOR_LEFT) this.onConveyor = -1;
                        if (tile === TILE.CONVEYOR_RIGHT) this.onConveyor = 1;

                        // 落ちる地面トリガー
                        if ((tile === TILE.FAKE_GROUND || tile === TILE.FALLING_GROUND) && data) {
                            if (!data.triggered) {
                                data.triggered = true;
                                data.shaking = true;
                            }
                        }

                        // 崩れるブロックトリガー
                        if (tile === TILE.CRUMBLE_BRICK && data && !data.crumbling) {
                            data.stepTimer += dt;
                            if (data.stepTimer >= (data.stepDelay || 0.3)) {
                                data.crumbling = true;
                            }
                        }

                        // 消える雲トリガー
                        if (tile === TILE.CLOUD_PLATFORM && data && data.vanishOnStep && !data.vanishing) {
                            data.vanishing = true;
                        }

                    } else if (this.vy < 0) {
                        // 頭をぶつけた
                        this.y = (row + 1) * TILE_SIZE;
                        this.vy = 0;
                        this._onHeadHit(col, row, tile, data, level, game);
                    }
                }

                // ワンウェイプラットフォーム
                if (level.isOneWay(col, row) && !level.isSolid(col, row)) {
                    const platTop = row * TILE_SIZE;
                    if (this.vy > 0 && this.y + this.height - this.vy <= platTop + 4) {
                        this.y = platTop - this.height;
                        this.vy = 0;
                        if (!this.onGround) {
                            this._onLand(col, row, level, game);
                        }
                        this.onGround = true;

                        // 消える雲トリガー
                        if (tile === TILE.CLOUD_PLATFORM && data && data.vanishOnStep && !data.vanishing) {
                            data.vanishing = true;
                        }
                    }
                }

                // 危険タイルチェック
                if (level.isDangerous(col, row)) {
                    this.die('spike', game);
                }

                // スプリング/トランポリン
                if ((tile === TILE.SPRING || tile === TILE.TRAMPOLINE) && this.vy > 0 && data) {
                    const topY = row * TILE_SIZE;
                    if (this.y + this.height >= topY && this.y + this.height <= topY + 16) {
                        this.vy = data.bounceForce || -14;
                        this.onGround = false;
                        data.compressed = true;
                        data.bouncing = true;
                        if (game) {
                            game.audio.play('spring', 0.7);
                            game.particles.emitDustPuff(this.x + this.width / 2, topY);
                        }
                        setTimeout(() => {
                            if (data) { data.compressed = false; data.bouncing = false; }
                        }, 300);
                    }
                }

                // コインタイル
                if (tile === TILE.COIN) {
                    level.setTile(col, row, TILE.EMPTY);
                    this.coins++;
                    this.score += 100;
                    if (game) {
                        game.audio.play('coin', 0.5);
                        game.particles.emitCoinSparkle(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE + TILE_SIZE / 2);
                        game.ui.showFloatingText('+100', col * TILE_SIZE, row * TILE_SIZE, '#FFD700');
                    }
                }

                // チェックポイント
                if (tile === TILE.CHECKPOINT && data && !data.activated) {
                    data.activated = true;
                    this.respawnX = col * TILE_SIZE;
                    this.respawnY = (row - 1) * TILE_SIZE;
                    for (const cp of level.checkpoints) {
                        if (Math.abs(cp.x - col * TILE_SIZE) < TILE_SIZE) {
                            cp.activated = true;
                        }
                    }
                    if (game) {
                        game.audio.play('checkpoint', 0.6);
                        game.particles.emitConfetti(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE, 15);
                        game.ui.showFloatingText('CHECKPOINT!', col * TILE_SIZE, row * TILE_SIZE - 20, '#44ff44');
                    }
                }

                // ボストリガー
                if (tile === TILE.BOSS_TRIGGER && data && !data.triggered) {
                    data.triggered = true;
                    if (game) game.triggerBoss();
                }
            }
        }
    }

    _onLand(col, row, level, game) {
        this.landSquash = 1.3;
        this.squashTimer = 0.1;
        if (game) {
            game.particles.emitLandingDust(this.x + this.width / 2, this.y + this.height);
        }
    }

    _onHeadHit(col, row, tile, data, level, game) {
        if (game) game.audio.play('block', 0.4);

        // ?ブロック
        if (tile === TILE.QUESTION && data && !data.used) {
            data.used = true;
            data.bounceOffset = -6;
            if (data.contents === 'coin') {
                this.coins++;
                this.score += 100;
                if (game) {
                    game.audio.play('coin', 0.5);
                    game.particles.emitCoinSparkle(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE - 10);
                    game.ui.showFloatingText('+100', col * TILE_SIZE, row * TILE_SIZE - 20, '#FFD700');
                }
            }
        }

        // トラップコインブロック
        if (tile === TILE.TRAP_COIN_BLOCK && data && !data.used) {
            data.used = true;
            data.bounceOffset = -6;
            if (data.contents === 'trap_push') {
                this.vx = (data.pushDir || 1) * 8;
                if (game) {
                    game.audio.play('trap');
                    game.camera.shake(4, 0.2);
                }
            }
        }

        // スパイクブロック（叩くとスパイク出現）
        if (tile === TILE.SPIKE_BLOCK && data && !data.activated) {
            data.activated = true;
            if (game) {
                game.audio.play('trap');
                game.camera.shake(3, 0.15);
                game.particles.emitSpikeWarning(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE);
            }
        }

        // ★上昇ブロック（叩くと飛んでいく - 本家名物トラップ）
        if (tile === TILE.RISING_BLOCK && data && !data.rising) {
            data.rising = true;
            data.risingSpeed = -6;
            if (game) {
                game.audio.play('trap');
                game.ui.showFloatingText('!?', col * TILE_SIZE, row * TILE_SIZE - 20, '#ff4444');
            }
        }

        // レンガ破壊
        if (tile === TILE.BRICK) {
            level.setTile(col, row, TILE.EMPTY);
            if (game) {
                game.audio.play('break_block', 0.5);
                game.particles.emitBlockBreak(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE + TILE_SIZE / 2);
                game.camera.shake(2, 0.1);
            }
            this.score += 50;
        }

        // 見えないブロック出現
        if (tile === TILE.INVISIBLE && data && data.solid && !data.revealed) {
            data.revealed = true;
            level.setTile(col, row, TILE.BLOCK);
            if (game) {
                game.audio.play('block', 0.4);
                game.camera.shake(2, 0.1);
            }
        }
    }

    _updateDeath(dt, game) {
        this.deathTimer += dt;
        this.deathAnimTimer += dt;

        if (this.deathType === 'fall') {
            // 落下死は即リスポーン待ち
        } else {
            // 通常死亡アニメーション（上に跳ねてから落ちる）
            this.deathAnimVY += GRAVITY * 0.7;
            this.y += this.deathAnimVY;
        }
    }

    _updateAnimation(dt, input, game) {
        // 走りアニメーション
        if (this.onGround && Math.abs(this.vx) > 0.5) {
            this.animTimer += dt;
            if (this.animTimer >= this.runAnimSpeed) {
                this.animTimer = 0;
                this.animFrame = (this.animFrame + 1) % 4;
            }
            // 走りの砂埃
            this.dustTimer += dt;
            if (this.dustTimer >= 0.15) {
                this.dustTimer = 0;
                if (game) {
                    game.particles.emitTrailParticle(
                        this.x + (this.facingRight ? 0 : this.width),
                        this.y + this.height,
                        '#ccbb99'
                    );
                }
            }
        } else {
            this.animTimer = 0;
            this.animFrame = 0;
        }

        // スクワッシュ＆ストレッチ
        if (this.squashTimer > 0) {
            this.squashTimer -= dt;
            if (this.squashTimer <= 0) {
                this.jumpSquash = 1.0;
                this.landSquash = 1.0;
            }
        }

        // 瞬き
        this.eyeTimer += dt;
        if (this.eyeState === 'normal' && this.eyeTimer > 3 + Math.random() * 2) {
            this.eyeState = 'blink';
            this.eyeTimer = 0;
        } else if (this.eyeState === 'blink' && this.eyeTimer > 0.1) {
            this.eyeState = 'normal';
            this.eyeTimer = 0;
        }
    }

    _updateState(dt, game) {
        // 無敵時間
        if (this.invincible) {
            this.invincibleTimer -= dt;
            if (this.invincibleTimer <= 0) {
                this.invincible = false;
            }
        }

        // コンボ
        if (this.comboTimer > 0) {
            this.comboTimer -= dt;
            if (this.comboTimer <= 0) {
                this.comboCount = 0;
            }
        }
    }

    draw(ctx, camera) {
        const sx = this.x + camera.getDrawX();
        const sy = this.y + camera.getDrawY();

        if (sx < -50 || sx > GAME_WIDTH + 50) return;

        // 無敵時の点滅
        if (this.invincible && Math.floor(this.invincibleTimer * 10) % 2 === 0) return;

        ctx.save();

        const cx = sx + this.width / 2;
        const cy = sy + this.height / 2;
        ctx.translate(cx, cy);

        // スクワッシュ＆ストレッチ
        let scaleX = this.facingRight ? 1 : -1;
        let scaleY = 1;
        if (this.jumpSquash < 1) {
            scaleX *= (2 - this.jumpSquash);
            scaleY = this.jumpSquash;
        }
        if (this.landSquash > 1) {
            scaleX *= this.landSquash;
            scaleY = 2 - this.landSquash;
        }
        ctx.scale(scaleX, scaleY);

        // ----- しょぼん（猫キャラ）描画 -----
        const w = this.width;
        const h = this.height;
        const hw = w / 2;
        const hh = h / 2;

        // 死亡時は赤く
        if (!this.alive) {
            ctx.globalAlpha = Math.max(0, 1 - this.deathTimer);
        }

        // 体（白い猫）
        const bodyGrd = ctx.createRadialGradient(0, 2, 2, 0, 0, hw + 2);
        bodyGrd.addColorStop(0, '#FFFFFF');
        bodyGrd.addColorStop(0.8, '#F0F0F0');
        bodyGrd.addColorStop(1, '#E0E0E0');
        ctx.fillStyle = bodyGrd;

        // 体の丸み
        ctx.beginPath();
        ctx.ellipse(0, 2, hw, hh - 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // 耳
        ctx.fillStyle = '#F8F8F8';
        ctx.beginPath();
        ctx.moveTo(-hw + 2, -hh + 6);
        ctx.lineTo(-hw + 5, -hh - 4);
        ctx.lineTo(-hw + 12, -hh + 4);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(hw - 2, -hh + 6);
        ctx.lineTo(hw - 5, -hh - 4);
        ctx.lineTo(hw - 12, -hh + 4);
        ctx.closePath();
        ctx.fill();

        // 耳の内側（ピンク）
        ctx.fillStyle = '#FFB8C0';
        ctx.beginPath();
        ctx.moveTo(-hw + 4, -hh + 5);
        ctx.lineTo(-hw + 6, -hh - 1);
        ctx.lineTo(-hw + 10, -hh + 4);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(hw - 4, -hh + 5);
        ctx.lineTo(hw - 6, -hh - 1);
        ctx.lineTo(hw - 10, -hh + 4);
        ctx.closePath();
        ctx.fill();

        // 目
        const eyeY = -3;
        const eyeSpacing = 5;
        if (this.eyeState === 'dead') {
            // ×目
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-eyeSpacing - 3, eyeY - 3);
            ctx.lineTo(-eyeSpacing + 3, eyeY + 3);
            ctx.moveTo(-eyeSpacing + 3, eyeY - 3);
            ctx.lineTo(-eyeSpacing - 3, eyeY + 3);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(eyeSpacing - 3, eyeY - 3);
            ctx.lineTo(eyeSpacing + 3, eyeY + 3);
            ctx.moveTo(eyeSpacing + 3, eyeY - 3);
            ctx.lineTo(eyeSpacing - 3, eyeY + 3);
            ctx.stroke();
        } else if (this.eyeState === 'blink') {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-eyeSpacing - 3, eyeY);
            ctx.lineTo(-eyeSpacing + 3, eyeY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(eyeSpacing - 3, eyeY);
            ctx.lineTo(eyeSpacing + 3, eyeY);
            ctx.stroke();
        } else if (this.eyeState === 'surprised') {
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(-eyeSpacing, eyeY, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(eyeSpacing, eyeY, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(-eyeSpacing - 1, eyeY - 1, 1.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(eyeSpacing - 1, eyeY - 1, 1.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 通常の目 (´・ω・`) スタイル
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(-eyeSpacing, eyeY, 3, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(eyeSpacing, eyeY, 3, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // ハイライト
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(-eyeSpacing - 1, eyeY - 1, 1, 1.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(eyeSpacing - 1, eyeY - 1, 1, 1.5, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // 口 (ω 形状 - しょぼん顔再現)
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-4, 3);
        ctx.quadraticCurveTo(-2, 6, 0, 4);
        ctx.quadraticCurveTo(2, 6, 4, 3);
        ctx.stroke();

        // 足（走りアニメーション）
        ctx.fillStyle = '#F0F0F0';
        if (this.onGround && Math.abs(this.vx) > 0.5) {
            const legAnim = Math.sin(this.animFrame * Math.PI / 2) * 4;
            ctx.beginPath();
            ctx.ellipse(-5, hh + 1 + legAnim, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(5, hh + 1 - legAnim, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (!this.onGround) {
            // 空中の足
            ctx.beginPath();
            ctx.ellipse(-6, hh - 2, 4, 3, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(6, hh - 2, 4, 3, 0.3, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.ellipse(-5, hh + 1, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(5, hh + 1, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // しっぽ
        const tailWag = Math.sin(Date.now() * 0.005) * 0.3;
        ctx.strokeStyle = '#E0E0E0';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-hw + 2, 5);
        ctx.quadraticCurveTo(-hw - 6, 2 + tailWag * 10, -hw - 8, -2 + tailWag * 15);
        ctx.stroke();

        ctx.restore();
    }
}

// SECTION 19: 背景描画システム

class BackgroundRenderer {
    constructor() {
        this.clouds = [];
        this.hills = [];
        this.stars = [];
        this.particles = [];
        this.type = 'overworld';
        this.time = 0;
    }

    init(type) {
        this.type = type;
        this.clouds = [];
        this.hills = [];
        this.stars = [];

        if (type === 'overworld' || type === 'sky') {
            for (let i = 0; i < 20; i++) {
                this.clouds.push({
                    x: MathUtils.randomRange(0, 4000),
                    y: MathUtils.randomRange(20, 160),
                    w: MathUtils.randomRange(60, 140),
                    h: MathUtils.randomRange(25, 50),
                    speed: MathUtils.randomRange(0.1, 0.4),
                    alpha: MathUtils.randomRange(0.4, 0.8)
                });
            }
            for (let i = 0; i < 8; i++) {
                this.hills.push({
                    x: i * 500 + MathUtils.randomRange(-100, 100),
                    w: MathUtils.randomRange(200, 400),
                    h: MathUtils.randomRange(80, 180),
                    color: `hsl(${MathUtils.randomRange(100, 140)}, ${MathUtils.randomRange(30, 60)}%, ${MathUtils.randomRange(35, 55)}%)`
                });
            }
        }

        if (type === 'underground' || type === 'castle') {
            for (let i = 0; i < 50; i++) {
                this.particles.push({
                    x: MathUtils.randomRange(0, GAME_WIDTH),
                    y: MathUtils.randomRange(0, GAME_HEIGHT),
                    size: MathUtils.randomRange(1, 3),
                    speed: MathUtils.randomRange(0.2, 0.8),
                    alpha: MathUtils.randomRange(0.1, 0.3)
                });
            }
        }

        if (type === 'castle') {
            for (let i = 0; i < 30; i++) {
                this.stars.push({
                    x: MathUtils.randomRange(0, 3000),
                    y: MathUtils.randomRange(50, 300),
                    size: MathUtils.randomRange(0.5, 2),
                    twinkle: MathUtils.randomRange(0, Math.PI * 2),
                    speed: MathUtils.randomRange(1, 4)
                });
            }
        }
    }

    update(dt) {
        this.time += dt;
        for (const cloud of this.clouds) {
            cloud.x += cloud.speed;
            if (cloud.x > 5000) cloud.x = -200;
        }
        for (const p of this.particles) {
            p.y -= p.speed;
            if (p.y < -10) { p.y = GAME_HEIGHT + 10; p.x = MathUtils.randomRange(0, GAME_WIDTH); }
        }
    }

    draw(ctx, camera) {
        const drawX = camera.getDrawX();

        if (this.type === 'overworld') {
            this._drawOverworldBG(ctx, drawX);
        } else if (this.type === 'sky') {
            this._drawSkyBG(ctx, drawX);
        } else if (this.type === 'underground') {
            this._drawUndergroundBG(ctx, drawX);
        } else if (this.type === 'castle') {
            this._drawCastleBG(ctx, drawX);
        }
    }

    _drawOverworldBG(ctx, drawX) {
        // 空グラデーション
        const skyGrd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        skyGrd.addColorStop(0, '#5599FF');
        skyGrd.addColorStop(0.4, '#77BBFF');
        skyGrd.addColorStop(0.7, '#99DDFF');
        skyGrd.addColorStop(1, '#BBFFBB');
        ctx.fillStyle = skyGrd;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 丘
        for (const hill of this.hills) {
            const hx = hill.x + drawX * 0.3;
            ctx.fillStyle = hill.color;
            ctx.beginPath();
            ctx.ellipse(hx, GAME_HEIGHT - 50, hill.w / 2, hill.h, 0, Math.PI, 0);
            ctx.fill();
        }

        // 雲
        for (const cloud of this.clouds) {
            const cx = cloud.x + drawX * 0.15;
            if (cx < -200 || cx > GAME_WIDTH + 200) continue;
            ctx.globalAlpha = cloud.alpha;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(cx, cloud.y, cloud.w / 2, cloud.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx - cloud.w * 0.25, cloud.y + 5, cloud.w * 0.3, cloud.h * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + cloud.w * 0.25, cloud.y + 3, cloud.w * 0.25, cloud.h * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    _drawSkyBG(ctx, drawX) {
        const skyGrd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        skyGrd.addColorStop(0, '#3377DD');
        skyGrd.addColorStop(0.5, '#66AAFF');
        skyGrd.addColorStop(1, '#AADDFF');
        ctx.fillStyle = skyGrd;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        for (const cloud of this.clouds) {
            const cx = cloud.x + drawX * 0.1;
            if (cx < -200 || cx > GAME_WIDTH + 200) continue;
            ctx.globalAlpha = cloud.alpha * 0.6;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(cx, cloud.y + 200, cloud.w, cloud.h, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    _drawUndergroundBG(ctx, drawX) {
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        for (const p of this.particles) {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = '#446688';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    _drawCastleBG(ctx, drawX) {
        const grd = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
        grd.addColorStop(0, '#1a0a0a');
        grd.addColorStop(0.5, '#2a1515');
        grd.addColorStop(1, '#1a0505');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 炎のちらつき
        for (const star of this.stars) {
            const sx = star.x + drawX * 0.2;
            if (sx < -10 || sx > GAME_WIDTH + 10) continue;
            const twinkle = Math.sin(this.time * star.speed + star.twinkle) * 0.5 + 0.5;
            ctx.globalAlpha = twinkle * 0.4;
            ctx.fillStyle = '#ff6633';
            ctx.beginPath();
            ctx.arc(sx, star.y, star.size * (0.5 + twinkle), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // 溶岩のグロー（下部）
        const lavaGlow = ctx.createLinearGradient(0, GAME_HEIGHT - 100, 0, GAME_HEIGHT);
        lavaGlow.addColorStop(0, 'rgba(255,50,0,0)');
        lavaGlow.addColorStop(1, 'rgba(255,50,0,0.15)');
        ctx.fillStyle = lavaGlow;
        ctx.fillRect(0, GAME_HEIGHT - 100, GAME_WIDTH, 100);
    }
}

class UIManager {
    constructor() {
        this.floatingTexts = [];
        this.notifications = [];
        this.stageIntroTimer = 0;
        this.stageIntroText = '';
        this.gameOverAlpha = 0;
        this.pauseAlpha = 0;
    }

    showFloatingText(text, x, y, color = '#fff', size = 16) {
        this.floatingTexts.push({
            text, x, y, color, size,
            vy: -2, life: 0, maxLife: 1.0,
            alpha: 1.0
        });
    }

    showNotification(text, duration = 2.0) {
        this.notifications.push({
            text, life: 0, maxLife: duration,
            alpha: 0, targetAlpha: 1
        });
    }

    update(dt) {
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const ft = this.floatingTexts[i];
            ft.life += dt;
            ft.y += ft.vy;
            ft.alpha = Math.max(0, 1 - ft.life / ft.maxLife);
            if (ft.life >= ft.maxLife) {
                this.floatingTexts.splice(i, 1);
            }
        }

        for (let i = this.notifications.length - 1; i >= 0; i--) {
            const n = this.notifications[i];
            n.life += dt;
            if (n.life < 0.3) {
                n.alpha = n.life / 0.3;
            } else if (n.life > n.maxLife - 0.3) {
                n.alpha = (n.maxLife - n.life) / 0.3;
            } else {
                n.alpha = 1;
            }
            if (n.life >= n.maxLife) {
                this.notifications.splice(i, 1);
            }
        }

        if (this.stageIntroTimer > 0) {
            this.stageIntroTimer -= dt;
        }
    }

    drawHUD(ctx, player, stageNum) {
        // HUD背景
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(0, 0, GAME_WIDTH, 40);

        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        ctx.textBaseline = 'middle';

        // ステージ
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.fillText(`WORLD ${stageNum}`, 20, 20);

        // ライフ（マイナス表示可能）
        ctx.fillStyle = player.lives < 0 ? '#ff4444' : '#ffffff';
        ctx.fillText(`LIVES: ${player.lives}`, 180, 20);

        // コイン
        ctx.fillStyle = '#FFD700';
        ctx.fillText(`COIN: ${player.coins}`, 370, 20);

        // スコア
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`SCORE: ${player.score}`, 540, 20);

        // TIME表示（飾り）
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`(´・ω・\`)`, GAME_WIDTH - 20, 20);
    }

    drawFloatingTexts(ctx, camera) {
        const drawX = camera.getDrawX();
        const drawY = camera.getDrawY();

        for (const ft of this.floatingTexts) {
            ctx.save();
            ctx.globalAlpha = ft.alpha;
            ctx.font = `bold ${ft.size}px "Segoe UI", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#000';
            ctx.fillText(ft.text, ft.x + drawX + 1, ft.y + drawY + 1);
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, ft.x + drawX, ft.y + drawY);
            ctx.restore();
        }
    }

    drawNotifications(ctx) {
        let ny = GAME_HEIGHT - 80;
        for (const n of this.notifications) {
            ctx.save();
            ctx.globalAlpha = n.alpha;
            ctx.font = 'bold 20px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(GAME_WIDTH / 2 - 200, ny - 18, 400, 36);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(n.text, GAME_WIDTH / 2, ny);
            ctx.restore();
            ny -= 45;
        }
    }

    drawStageIntro(ctx, stageNum, stageName) {
        if (this.stageIntroTimer <= 0) return;
        const alpha = Math.min(1, this.stageIntroTimer);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.font = 'bold 48px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`WORLD ${stageNum}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 30);
        ctx.font = '24px "Segoe UI", sans-serif';
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText(stageName, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 20);
        ctx.font = '18px "Segoe UI", sans-serif';
        ctx.fillStyle = '#888888';
        ctx.fillText(`LIVES: ${0}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60);
        ctx.restore();
    }

    drawPause(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.font = 'bold 48px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PAUSE', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);
        ctx.font = '20px "Segoe UI", sans-serif';
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText('Press P or ESC to resume', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 30);
        ctx.restore();
    }

    drawGameOver(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.font = 'bold 56px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ff4444';
        ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 40);
        ctx.font = '20px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('(´;ω;`) しょぼーん...', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);
        ctx.font = '18px "Segoe UI", sans-serif';
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText('Press ENTER to continue (lives go negative!)', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);
        ctx.restore();
    }

    drawCredits(ctx, scrollY) {

            'Based on しょぼんのアクション',
            '(Syobon Action / Cat Mario)',

// ============================================================
// SECTION 21: 敵クラス群
// ============================================================

class EnemyManager {
    constructor() {
        this.enemies = [];
        this.projectiles = [];
    }

    init(enemyData) {
        this.enemies = enemyData.map(e => ({
            ...e,
            vx: (e.dir || -1) * 1.5,
            vy: 0,
            animTimer: 0,
            animFrame: 0,
            alive: true,
            active: e.hidden ? false : true,
            width: 28,
            height: 28,
            stompable: true,
            deathTimer: 0,
            stateTimer: 0,
            revealed: false
        }));
        this.projectiles = [];
    }

    update(dt, player, level, game) {
        for (const enemy of this.enemies) {
            if (!enemy.alive) {
                enemy.deathTimer += dt;
                continue;
            }

            // 隠し敵のトリガーチェック
            if (!enemy.active && enemy.hidden) {
                const dist = Math.abs(player.x - enemy.triggerX);
                if (dist < (enemy.triggerDistance || 80)) {
                    enemy.active = true;
                    enemy.hidden = false;
                    if (game) {
                        game.audio.play('trap', 0.5);
                        if (enemy.spawnDir === 'down') {
                            game.particles.emitDustPuff(enemy.x + 14, enemy.y + 14);
                        }
                    }
                }
                continue;
            }

            if (!enemy.active) continue;

            // タイプ別更新
            switch (enemy.type) {
                case ENEMY_TYPE.GOOMBA:
                    this._updateGoomba(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.KOOPA:
                    this._updateKoopa(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.PIRANHA:
                    this._updatePiranha(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.THWOMP:
                    this._updateThwomp(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.FIRE_BAR:
                    this._updateFireBar(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.BOO:
                    this._updateBoo(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.DRY_BONES:
                    this._updateDryBones(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.CHAIN_CHOMP:
                    this._updateChainChomp(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.HAMMER_BRO:
                    this._updateHammerBro(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.SURPRISE_ENEMY:
                    this._updateSurpriseEnemy(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.FAKE_POWERUP:
                    this._updateFakePowerup(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.TRAP_STAR:
                    this._updateTrapStar(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.FALLING_SPIKE:
                    this._updateFallingSpike(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.BLOOPER:
                    this._updateBlooper(enemy, dt, player, level, game);
                    break;
                case ENEMY_TYPE.BUZZY_BEETLE:
                    this._updateBuzzyBeetle(enemy, dt, player, level, game);
                    break;
                default:
                    this._updateGoomba(enemy, dt, player, level, game);
                    break;
            }

            // アニメーション
            enemy.animTimer += dt;
            if (enemy.animTimer >= 0.2) {
                enemy.animTimer = 0;
                enemy.animFrame = (enemy.animFrame + 1) % 2;
            }

            // プレイヤーとの衝突
            if (enemy.alive && player.alive && !player.invincible) {
                if (MathUtils.rectOverlap(
                    player.x, player.y, player.width, player.height,
                    enemy.x, enemy.y, enemy.width, enemy.height
                )) {
                    // 上から踏んだかチェック
                    if (player.vy > 0 && player.y + player.height < enemy.y + enemy.height * 0.6 && enemy.stompable) {
                        this._stompEnemy(enemy, player, game);
                    } else {
                        // プレイヤーダメージ
                        player.die('enemy', game);
                    }
                }
            }
        }

        // 弾丸更新
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            proj.x += proj.vx;
            proj.y += proj.vy;
            if (proj.gravity) proj.vy += proj.gravity;
            proj.life -= dt;

            if (proj.life <= 0) {
                this.projectiles.splice(i, 1);
                continue;
            }

            // プレイヤーとの衝突
            if (player.alive && !player.invincible) {
                if (MathUtils.rectOverlap(
                    player.x, player.y, player.width, player.height,
                    proj.x, proj.y, proj.width || 8, proj.height || 8
                )) {
                    player.die('projectile', game);
                    this.projectiles.splice(i, 1);
                }
            }
        }
    }

    _stompEnemy(enemy, player, game) {
        enemy.alive = false;
        enemy.deathTimer = 0;
        player.vy = -7;
        player.comboCount++;
        player.comboTimer = 1.0;
        const points = 100 * Math.pow(2, Math.min(player.comboCount - 1, 5));
        player.score += points;

        if (game) {
            game.audio.play('stomp', 0.6, 1.0 + player.comboCount * 0.1);
            game.particles.emitDustPuff(enemy.x + enemy.width / 2, enemy.y + enemy.height);
            game.ui.showFloatingText(`+${points}`, enemy.x, enemy.y - 10, '#ffffff');
            if (player.comboCount >= 3) {
                game.ui.showFloatingText(`${player.comboCount} COMBO!`, enemy.x, enemy.y - 30, '#ffff00', 20);
            }
        }
    }

    _updateGoomba(enemy, dt, player, level, game) {
        // 重力
        enemy.vy += GRAVITY;
        if (enemy.vy > MAX_FALL_SPEED) enemy.vy = MAX_FALL_SPEED;

        // 移動
        enemy.x += enemy.vx;
        enemy.y += enemy.vy;

        // 地面衝突
        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow) || level.isOneWay(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
        }

        // 壁衝突
        const leftCol = Math.floor(enemy.x / TILE_SIZE);
        const rightCol = Math.floor((enemy.x + enemy.width) / TILE_SIZE);
        const midRow = Math.floor((enemy.y + enemy.height / 2) / TILE_SIZE);
        if (level.isSolid(leftCol, midRow) || level.isSolid(rightCol, midRow)) {
            enemy.vx = -enemy.vx;
        }

        // 崖で反転
        if (enemy.patrolRange) {
            if (Math.abs(enemy.x - enemy.startX) > enemy.patrolRange) {
                enemy.vx = -enemy.vx;
            }
        }

        // 落下チェック
        if (enemy.y > level.getWorldHeight() + 100) {
            enemy.alive = false;
        }
    }

    _updateKoopa(enemy, dt, player, level, game) {
        this._updateGoomba(enemy, dt, player, level, game);
    }

    _updatePiranha(enemy, dt, player, level, game) {
        enemy.stateTimer += dt;
        const cycle = enemy.stateTimer % 4;
        if (cycle < 1.5) {
            enemy.y = enemy.startY - (cycle / 1.5) * (enemy.emergeHeight || 32);
        } else if (cycle < 2.5) {
            enemy.y = enemy.startY - (enemy.emergeHeight || 32);
        } else if (cycle < 4) {
            enemy.y = enemy.startY - (1 - (cycle - 2.5) / 1.5) * (enemy.emergeHeight || 32);
        } else {
            enemy.y = enemy.startY;
        }
    }

    _updateThwomp(enemy, dt, player, level, game) {
        if (!enemy.falling) {
            const dist = Math.abs(player.x - enemy.x);
            if (dist < (enemy.triggerDistance || 64) && player.y > enemy.y) {
                enemy.falling = true;
                enemy.vy = 0;
            }
        } else {
            enemy.vy += 0.8;
            enemy.y += enemy.vy;
            const bottomRow = Math.floor((enemy.y + 32) / TILE_SIZE);
            const col = Math.floor((enemy.x + 16) / TILE_SIZE);
            if (level.isSolid(col, bottomRow)) {
                enemy.y = bottomRow * TILE_SIZE - 32;
                enemy.vy = 0;
                enemy.falling = false;
                enemy.stateTimer = 0;
                if (game) {
                    game.audio.play('thwomp', 0.7);
                    game.camera.shake(5, 0.2);
                }
                // 一定時間後に戻る
                setTimeout(() => {
                    if (enemy.alive) {
                        enemy.y = enemy.startY;
                    }
                }, 2000);
            }
        }
    }

    _updateFireBar(enemy, dt, player, level, game) {
        enemy.angle = (enemy.angle || 0) + (enemy.speed || 2) * dt;
        enemy.stompable = false;
        // ファイアバーの衝突は各セグメントで判定
        const segCount = enemy.length || 4;
        for (let i = 1; i <= segCount; i++) {
            const sx = enemy.x + Math.cos(enemy.angle) * i * 16;
            const sy = enemy.y + Math.sin(enemy.angle) * i * 16;
            if (player.alive && !player.invincible) {
                if (MathUtils.distance(player.x + player.width / 2, player.y + player.height / 2, sx, sy) < 18) {
                    player.die('fire', game);
                }
            }
        }
    }

    _updateBoo(enemy, dt, player, level, game) {
        enemy.stompable = false;
        // プレイヤーが向いている方向チェック
        const playerFacingEnemy = (player.facingRight && enemy.x > player.x) ||
                                   (!player.facingRight && enemy.x < player.x);
        if (playerFacingEnemy) {
            // 停止
            enemy.vx = 0;
            enemy.vy = 0;
        } else {
            // 接近
            const angle = MathUtils.angle(enemy.x, enemy.y, player.x, player.y);
            const spd = enemy.speed || 1.5;
            enemy.vx = Math.cos(angle) * spd;
            enemy.vy = Math.sin(angle) * spd;
        }
        enemy.x += enemy.vx;
        enemy.y += enemy.vy;
    }

    _updateDryBones(enemy, dt, player, level, game) {
        if (enemy.collapsed) {
            enemy.stateTimer += dt;
            if (enemy.stateTimer >= 3.0) {
                enemy.collapsed = false;
                enemy.alive = true;
                enemy.stateTimer = 0;
            }
            return;
        }
        this._updateGoomba(enemy, dt, player, level, game);
    }

    _updateChainChomp(enemy, dt, player, level, game) {
        enemy.stompable = false;
        enemy.stateTimer += dt;
        const angle = Math.sin(enemy.stateTimer * 3) * Math.PI * 0.4;
        const chainLen = enemy.chainLength || 96;
        enemy.x = enemy.startX + Math.cos(angle) * chainLen;
        enemy.y = enemy.startY + Math.sin(angle) * chainLen * 0.3 - Math.abs(Math.sin(enemy.stateTimer * 6)) * 20;
    }

    _updateHammerBro(enemy, dt, player, level, game) {
        enemy.stateTimer += dt;

        // ジャンプ
        if (enemy.stateTimer % (enemy.jumpInterval || 2.0) < dt) {
            enemy.vy = -8;
        }

        // ハンマー投げ
        if (enemy.stateTimer % (enemy.throwInterval || 1.5) < dt) {
            const dir = player.x > enemy.x ? 1 : -1;
            this.projectiles.push({
                x: enemy.x + (dir > 0 ? enemy.width : 0),
                y: enemy.y,
                vx: dir * 3,
                vy: -5,
                gravity: 0.3,
                width: 12,
                height: 12,
                life: 3.0,
                type: 'hammer'
            });
        }

        enemy.vy += GRAVITY;
        enemy.y += enemy.vy;

        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
        }
    }

    _updateSurpriseEnemy(enemy, dt, player, level, game) {
        // アクティブ化後は通常クリボーとして動作
        enemy.vy += GRAVITY;
        enemy.y += enemy.vy;
        enemy.x += enemy.vx;

        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow) || level.isOneWay(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
            if (enemy.vx === 0) {
                enemy.vx = player.x > enemy.x ? 2 : -2;
            }
        }
    }

    _updateFakePowerup(enemy, dt, player, level, game) {
        // 見た目はパワーアップだが触ると死ぬ
        enemy.stompable = false;
        enemy.vy += GRAVITY * 0.5;
        enemy.y += enemy.vy;
        const bottomRow = Math.floor((enemy.y + enemy.height) / TILE_SIZE);
        const col = Math.floor((enemy.x + enemy.width / 2) / TILE_SIZE);
        if (level.isSolid(col, bottomRow)) {
            enemy.y = bottomRow * TILE_SIZE - enemy.height;
            enemy.vy = 0;
        }
    }

    _updateTrapStar(enemy, dt, player, level, game) {
        enemy.stompable = false;
        // 見た目はスターだが触ると死ぬ
        enemy.stateTimer += dt;
        enemy.y = enemy.startY + Math.sin(enemy.stateTimer * 3) * 5;
    }

    _updateFallingSpike(enemy, dt, player, level, game) {
        enemy.stompable = false;
        if (!enemy.falling) {
            const dist = Math.abs(player.x - enemy.x);
            if (dist < (enemy.triggerDistance || 64)) {
                enemy.falling = true;
                enemy.vy = 0;
                if (game) game.audio.play('warning', 0.3);
            }
        } else {
            enemy.vy += 0.5;
            enemy.y += enemy.vy;
            if (enemy.y > level.getWorldHeight()) {
                enemy.alive = false;
            }
        }
    }

    _updateBlooper(enemy, dt, player, level, game) {
        enemy.stateTimer += dt;
        const cycle = enemy.stateTimer % 2;
        if (cycle < 0.5) {
            enemy.vy = -2;
        } else {
            enemy.vy = 0.5;
        }
        enemy.y += enemy.vy;
        // 横方向はプレイヤー追尾
        if (player.x > enemy.x) enemy.x += 0.5;
        else enemy.x -= 0.5;
    }

    _updateBuzzyBeetle(enemy, dt, player, level, game) {
        this._updateGoomba(enemy, dt, player, level, game);
    }

    draw(ctx, camera) {
        const drawX = camera.getDrawX();
        const drawY = camera.getDrawY();

        for (const enemy of this.enemies) {
            if (!enemy.active && enemy.hidden) continue;
            const sx = enemy.x + drawX;
            const sy = enemy.y + drawY;
            if (sx < -50 || sx > GAME_WIDTH + 50 || sy < -50 || sy > GAME_HEIGHT + 50) continue;

            if (!enemy.alive) {
                if (enemy.deathTimer < 0.5) {
                    ctx.save();
                    ctx.globalAlpha = 1 - enemy.deathTimer * 2;
                    ctx.translate(sx + enemy.width / 2, sy + enemy.height / 2);
                    ctx.scale(1, -1);
                    this._drawEnemySprite(ctx, enemy, -enemy.width / 2, -enemy.height / 2);
                    ctx.restore();
                }
                continue;
            }

            this._drawEnemySprite(ctx, enemy, sx, sy);
        }

        // 弾丸描画
        for (const proj of this.projectiles) {
            const px = proj.x + drawX;
            const py = proj.y + drawY;
            if (proj.type === 'hammer') {
                ctx.save();
                ctx.translate(px + 6, py + 6);
                ctx.rotate(Date.now() * 0.01);
                ctx.fillStyle = '#886644';
                ctx.fillRect(-6, -3, 12, 6);
                ctx.fillStyle = '#aaaaaa';
                ctx.fillRect(-3, -6, 6, 4);
                ctx.restore();
            } else {
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(px + 4, py + 4, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    _drawEnemySprite(ctx, enemy, x, y) {
        switch (enemy.type) {
            case ENEMY_TYPE.GOOMBA:
            case ENEMY_TYPE.SURPRISE_ENEMY:
                this._drawGoomba(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.KOOPA:
                this._drawKoopa(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.PIRANHA:
                this._drawPiranha(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.THWOMP:
                this._drawThwomp(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.FIRE_BAR:
                this._drawFireBar(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.BOO:
                this._drawBoo(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.DRY_BONES:
                this._drawDryBones(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.CHAIN_CHOMP:
                this._drawChainChomp(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.HAMMER_BRO:
                this._drawHammerBro(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.FAKE_POWERUP:
                this._drawFakeP
                this._drawFakePowerup(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.TRAP_STAR:
                this._drawTrapStar(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.FALLING_SPIKE:
                this._drawFallingSpike(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.BLOOPER:
                this._drawBlooper(ctx, enemy, x, y);
                break;
            case ENEMY_TYPE.BUZZY_BEETLE:
                this._drawBuzzyBeetle(ctx, enemy, x, y);
                break;
            default:
                this._drawGoomba(ctx, enemy, x, y);
                break;
        }
    }

    _drawGoomba(ctx, enemy, x, y) {
        const w = enemy.width;
        const h = enemy.height;
        const cx = x + w / 2;
        const cy = y + h / 2;
        const legAnim = enemy.animFrame === 0 ? 2 : -2;

        // 体
        const bodyGrd = ctx.createRadialGradient(cx, cy - 2, 2, cx, cy, w / 2 + 2);
        bodyGrd.addColorStop(0, '#CC8844');
        bodyGrd.addColorStop(0.7, '#AA6622');
        bodyGrd.addColorStop(1, '#884411');
        ctx.fillStyle = bodyGrd;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 2, w / 2, h / 2 - 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // 足
        ctx.fillStyle = '#665533';
        ctx.beginPath();
        ctx.ellipse(cx - 6, y + h - 3 + legAnim, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 6, y + h - 3 - legAnim, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目（怒り目）
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(cx - 5, cy - 5, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 5, cy - 5, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 瞳
        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 4, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 6, cy - 4, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // 眉毛（怒り）
        ctx.strokeStyle = '#442200';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 8, cy - 10);
        ctx.lineTo(cx - 2, cy - 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + 8, cy - 10);
        ctx.lineTo(cx + 2, cy - 8);
        ctx.stroke();

        // 口
        ctx.strokeStyle = '#442200';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy + 3, 4, 0.1, Math.PI - 0.1);
        ctx.stroke();

        // しょぼん式デコ(顔文字風のω口にする場合)
        if (enemy.disguise === 'cloud') {
            // 雲の偽装
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(cx, cy, w / 2 + 4, h / 2 + 4, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawKoopa(ctx, enemy, x, y) {
        const w = enemy.width;
        const h = enemy.height;
        const cx = x + w / 2;
        const cy = y + h / 2;

        // 甲羅
        const shellGrd = ctx.createRadialGradient(cx, cy + 2, 2, cx, cy + 2, w / 2 + 2);
        shellGrd.addColorStop(0, '#44CC44');
        shellGrd.addColorStop(0.6, '#33AA33');
        shellGrd.addColorStop(1, '#227722');
        ctx.fillStyle = shellGrd;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, w / 2, h / 2 - 1, 0, 0, Math.PI * 2);
        ctx.fill();

        // 甲羅模様
        ctx.strokeStyle = '#226622';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, w / 2 - 3, h / 2 - 4, 0, 0, Math.PI * 2);
        ctx.stroke();

        // 頭
        ctx.fillStyle = '#FFDD88';
        ctx.beginPath();
        ctx.ellipse(cx, cy - h / 2 + 4, 8, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // 目
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(cx - 3, cy - h / 2 + 2, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy - h / 2 + 2, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(cx - 2, cy - h / 2 + 3, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - h / 2 + 3, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // 足
        ctx.fillStyle = '#FFBB55';
        const legAnim = enemy.animFrame === 0 ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(cx - 7, y + h - 2 + legAnim, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 7, y + h - 2 - legAnim, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    _drawPiranha(ctx, enemy, x, y) {
        const cx = x + 16;
        const cy = y + 16;

        // 茎
        ctx.fillStyle = '#33AA33';
        ctx.fillRect(cx - 3, cy, 6, 20);

        // 頭
        const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, 14);
        grd.addColorStop(0, '#FF4444');
        grd.addColorStop(0.7, '#CC2222');
        grd.addColorStop(1, '#991111');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 14, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // 白い斑点
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 3, 3, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 5, cy - 2, 2, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // 口（ギザギザ）
        ctx.fillStyle = '#FFFFFF';
        for (let i = -3; i <= 3; i++) {
            ctx.beginPath();
            ctx.moveTo(cx + i * 3 - 1, cy + 5);
            ctx.lineTo(cx + i * 3 + 1, cy + 5);
            ctx.lineTo(cx + i * 3, cy + 9);
            ctx.closePath();
            ctx.fill();
        }
    }

    _drawThwomp(ctx, enemy, x, y) {
        const w = 32;
        const h = 32;

        // 体
        const grd = ctx.createLinearGradient(x, y, x, y + h);
        grd.addColorStop(0, '#AAAAAA');
        grd.addColorStop(0.5, '#888888');
        grd.addColorStop(1, '#666666');
        ctx.fillStyle = grd;
        ctx.fillRect(x, y, w, h);

        // 凸凹テクスチャ
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        for (let dx = 2; dx < w; dx += 6) {
            for (let dy = 2; dy < h; dy += 6) {
                ctx.fillRect(x + dx, y + dy, 3, 3);
            }
        }

        // 怒り顔
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(x + 10, y + 12, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + 22, y + 12, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x + 10, y + 13, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 22, y + 13, 3, 0, Math.PI * 2);
        ctx.fill();

        // 怒り眉
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + 5, y + 6);
        ctx.lineTo(x + 14, y + 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 27, y + 6);
        ctx.lineTo(x + 18, y + 8);
        ctx.stroke();

        // 口
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(x + 8, y + 22);
        ctx.lineTo(x + 16, y + 26);
        ctx.lineTo(x + 24, y + 22);
        ctx.closePath();
        ctx.fill();

        // 牙
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(x + 10, y + h - 2);
        ctx.lineTo(x + 12, y + h + 4);
        ctx.lineTo(x + 14, y + h - 2);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + 18, y + h - 2);
        ctx.lineTo(x + 20, y + h + 4);
        ctx.lineTo(x + 22, y + h - 2);
        ctx.closePath();
        ctx.fill();
    }

    _drawFireBar(ctx, enemy, x, y) {
        const cx = x;
        const cy = y;
        const segCount = enemy.length || 4;

        // 中心のブロック
        ctx.fillStyle = '#888';
        ctx.fillRect(cx - 8, cy - 8, 16, 16);

        // 火の玉
        for (let i = 1; i <= segCount; i++) {
            const sx = cx + Math.cos(enemy.angle) * i * 16;
            const sy = cy + Math.sin(enemy.angle) * i * 16;
            const flicker = Math.sin(Date.now() * 0.01 + i) * 2;

            const fireGrd = ctx.createRadialGradient(sx, sy, 1, sx, sy, 8 + flicker);
            fireGrd.addColorStop(0, '#FFFF00');
            fireGrd.addColorStop(0.4, '#FF8800');
            fireGrd.addColorStop(0.8, '#FF4400');
            fireGrd.addColorStop(1, 'rgba(255,0,0,0)');
            ctx.fillStyle = fireGrd;
            ctx.beginPath();
            ctx.arc(sx, sy, 8 + flicker, 0, Math.PI * 2);
            ctx.fill();
        }

        // チェーン線
        ctx.strokeStyle = 'rgba(255,150,0,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(enemy.angle) * segCount * 16, cy + Math.sin(enemy.angle) * segCount * 16);
        ctx.stroke();
    }

    _drawBoo(ctx, enemy, x, y) {
        const cx = x + 14;
        const cy = y + 14;
        const wobble = Math.sin(Date.now() * 0.003) * 2;

        // 体（白い半透明）
        ctx.globalAlpha = 0.85;
        const grd = ctx.createRadialGradient(cx, cy + wobble, 2, cx, cy + wobble, 16);
        grd.addColorStop(0, '#FFFFFF');
        grd.addColorStop(0.7, '#EEEEFF');
        grd.addColorStop(1, '#CCCCEE');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.ellipse(cx, cy + wobble, 14, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // しっぽ
        ctx.beginPath();
