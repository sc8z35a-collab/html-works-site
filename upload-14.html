  // ===== PLAYER ACTIONS =====
  async playerAction(action) {
    if (this.isAnimating) return;
    this.isAnimating = true;
    document.getElementById('action-panel').classList.remove('show');
    this.hideDialogue();

    switch (action) {
      case 'attack': await this.doAttack(); break;
      case 'skill': await this.doSkillAttack(); break;
      case 'counter': await this.doCounterAttack(); break;
      case 'heal': await this.doHeal(); break;
    }

    // Check win condition
    if (this.somen.hp <= 0) {
      await this.doVictory();
      return;
    }

    // Enemy turn
    await sleep(800);
    await this.doEnemyTurn();

    // Check lose condition
    if (this.katsu.hp <= 0) {
      await this.doDefeat();
      return;
    }

    // Next player turn
    await sleep(500);
    this.startStoryPhase(5);
  },

  // --- Normal Attack ---
  async doAttack() {
    this.katsu.state = 'attack';
    this.showTurnIndicator('通常攻撃', '#FFD700', 1500);
    await sleep(500);

    const damage = 80 + Math.floor(Math.random() * 40);

    // Charge forward animation
    this.addAnimation({
      duration: 15,
      onUpdate: (t) => {
        this.katsu.x = lerp(this.katsu.targetX, this.somen.targetX - 120, easeOutBack(t));
      },
      onComplete: () => {}
    });

    this.audio.playCharge();
    await sleep(300);

    // Impact
    this.audio.playHit();
    this.screenShake(0.6, 8);
    this.flashScreen('#FFD700', 150);
    Effects.hitImpact(this.particleSystem, this.somen.x, this.somen.y);
    this.showDamageNumber(this.somen.x, this.somen.y - 70, `-${damage}`, '#FF4444');

    await this.animateHpChange('somen', this.somen.hp, this.somen.hp - damage, 800);
    this.somen.hp -= damage;

    // Return to position
    this.addAnimation({
      duration: 20,
      onUpdate: (t) => {
        this.katsu.x = lerp(this.somen.targetX - 120, this.katsu.targetX, easeInOut(t));
      }
    });

    this.katsu.combo++;
    this.showCombo(this.katsu.combo);
    this.katsu.state = 'powered';

    await this.showDialogue('カツカツ', '甘いな……！');
    await sleep(500);
  },

    await sleep(300);
  },

  async enemyTentacleAttack() {
    this.showSkillName('麺縛り・1位争奪', '10本の触手で拘束する', '#F5F5DC', '#DDD', 2500);
    this.audio.playCharge();

    await sleep(800);

    const damage = 45 + Math.floor(Math.random() * 25);
    const poisonDmg = 30;

    Effects.noodleTentacles(this.particleSystem, this.somen.x, this.somen.y);
    this.audio.playHeavyHit();

    await sleep(500);

    Effects.hitImpact(this.particleSystem, this.katsu.x, this.katsu.y);
    this.screenShake(0.4, 5);
    this.showDamageNumber(this.katsu.x, this.katsu.y - 70, `-${damage}`, '#FF4444');

    await this.animateHpChange('katsu', this.katsu.hp, this.katsu.hp - damage, 600);
    this.katsu.hp -= damage;

    await sleep(400);

    // Poison tick
    Effects.vinegarPoison(this.particleSystem, this.katsu.x, this.katsu.y);
    this.showDamageNumber(this.katsu.x, this.katsu.y - 50, `-${poisonDmg} 毒`, '#00FF00');
    this.flashScreen('#00FF00', 150);

    await this.animateHpChange('katsu', this.katsu.hp, this.katsu.hp - poisonDmg, 600);
    this.katsu.hp -= poisonDmg;

    await this.showDialogue('そうめんロボ', '麺の……縛りから……逃げられない……！');
    await sleep(300);
  },

  async enemyBerserkAttack() {
    this.showSkillName('暴走・デッドヒートフルバースト', '全エネルギー解放の狂気攻撃', '#FF0040', '#FF4444', 3000);
    this.audio.playCharge();
    this.screenShake(0.3, 20);

    // Long charge with warning
    for (let i = 0; i < 6; i++) {
      await sleep(300);
      this.particleSystem.addBurst(this.somen.x, this.somen.y, 25, {
        speed: 5, speedJitter: 3, size: 4, sizeEnd: 0,
        life: 20, color: randomColor(['#FF0040', '#00BFFF', '#FF6B00']),
        glow: 20, shape: 'circle'
      });
      this.audio.playTone(200 + i * 150, 0.15, 'sawtooth', 0.3);
    }

    await sleep(500);

    const damage = 100 + Math.floor(Math.random() * 50);
    const selfDamage = 40;

    // Massive beam
    for (let w = 0; w < 5; w++) {
      Effects.soumenBeam(this.particleSystem, this.somen.x - 40, this.somen.y - 20 + w * 10, this.katsu.x + 40, this.katsu.y - 20 + w * 10);
    }
    this.audio.playExplosion();
    this.screenShake(1.5, 15);
    this.flashScreen('#FF0040', 300);

    await sleep(500);

    Effects.heavyImpact(this.particleSystem, this.katsu.x, this.katsu.y);
    this.showDamageNumber(this.katsu.x, this.katsu.y - 80, `-${damage}`, '#FF0040');

    await this.animateHpChange('katsu', this.katsu.hp, this.katsu.hp - damage, 1000);
    this.katsu.hp -= damage;

    await sleep(500);

    // Self damage from berserk
    Effects.overheatSmoke(this.particleSystem, this.somen.x, this.somen.y);
    this.showDamageNumber(this.somen.x, this.somen.y - 70, `-${selfDamage} 暴走反動`, '#FF8888');

    await this.animateHpChange('somen', this.somen.hp, this.somen.hp - selfDamage, 600);
    this.somen.hp -= selfDamage;

    await this.showDialogue('そうめんロボ', 'ギギ……ギギギ……1位に……なるんだ……！！（オーバーヒート）');
    await sleep(300);
  },

  // ===== VICTORY / DEFEAT =====
  async doVictory() {
    this.somen.hp = 0;
    this.isAnimating = true;
    this.state = 'win';
    this.audio.stopBGM();

    this.setCutscene(true);
    this.updateHpBar('somen', 0, this.somen.maxHp);

    await sleep(500);

    // Final explosion on somen
    this.flashScreen('#FFD700', 800);
    this.audio.playExplosion();
    this.screenShake(3.0, 25);
    Effects.heavyImpact(this.particleSystem, this.somen.x, this.somen.y);

    await sleep(300);
    Effects.counterFlash(this.particleSystem, this.somen.x, this.somen.y);

    await sleep(800);

    this.somen.state = 'selfbind';

    await this.showDialogue('そうめんロボ', '1位が……取れ……なかった…………');

    await sleep(500);

    // Victory effects
    Effects.victoryExplosion(this.particleSystem, this.W, this.H);
    this.audio.playVictory();

    await sleep(1000);

    this.updateScoreboard('最終結果：1位 カツカツ【勝者】', 'そうめんロボ——機能停止');

    this.katsu.state = 'powered';

    await this.showDialogue('カツカツ', '勝つ。勝つ。勝つ。——それだけで十分だ。');

    await sleep(800);

    await this.showDialogue('ナレーション', '領域「ALL WINNER」——決着。カツカツの完全勝利。');

    await sleep(1000);

    // Show win screen
    document.getElementById('win-text').textContent = 'WINNER';
    document.getElementById('win-sub').textContent = 'カツカツ —— 永遠の1位';
    document.getElementById('win-screen').classList.add('show');

    // Continuous victory particles
    this.addAnimation({
      duration: 600,
      onUpdate: (t) => {
        if (Math.random() > 0.5) {
          this.particleSystem.add(Math.random() * this.W, -10, {
            vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3,
            size: 3 + Math.random() * 3, sizeEnd: 1,
            life: 100, color: randomColor(['#FFD700', '#FF6B00', '#FF0040', '#FFF']),
            glow: 10, shape: 'star', rotationSpeed: 0.1,
            oscillateX: 0.5, oscillateSpeed: 0.03
          });
        }
      }
    });
  },

  async doDefeat() {
    this.katsu.hp = 0;
    this.isAnimating = true;
    this.state = 'win';
    this.audio.stopBGM();

    this.setCutscene(true);
    this.updateHpBar('katsu', 0, this.katsu.maxHp);

    await sleep(500);

    this.flashScreen('#FF0040', 500);
    this.audio.playExplosion();
    this.screenShake(2.0, 20);
    Effects.heavyImpact(this.particleSystem, this.katsu.x, this.katsu.y);

    await sleep(800);

    await this.showDialogue('そうめんロボ', '1位は……私だ……！！');

    await sleep(500);

    this.updateScoreboard('最終結果：1位 そうめんロボ', 'まさかの逆転……！');

    await this.showDialogue('ナレーション', '領域「ALL WINNER」——まさかの逆転。そうめんロボの勝利。');

    await sleep(800);

    document.getElementById('win-text').textContent = 'DEFEAT';
    document.getElementById('win-text').style.color = '#FF0040';
    document.getElementById('win-text').style.textShadow = '0 0 50px #FF0040, 0 0 100px #FF0000';
    document.getElementById('win-sub').textContent = 'そうめんロボ —— 狂気の1位';
    document.getElementById('win-screen').classList.add('show');
  },

  // ============================================================================
  // SECTION 8: UI HELPER FUNCTIONS
  // ============================================================================

  showDialogue(speaker, text) {
    return new Promise((resolve) => {
      const box = document.getElementById('dialogue-box');
      const speakerEl = document.getElementById('dialogue-speaker');
      const textEl = document.getElementById('dialogue-text');

      // Set speaker color
      if (speaker === 'カツカツ') {
        speakerEl.style.color = '#FFD700';
      } else if (speaker === 'そうめんロボ') {
        speakerEl.style.color = '#00BFFF';
      } else {
        speakerEl.style.color = '#AAA';
      }

      speakerEl.textContent = speaker;
      textEl.textContent = '';
      box.classList.add('show');

      // Typewriter effect
      let charIndex = 0;
      const typeSpeed = 30;
      const typeInterval = setInterval(() => {
        if (charIndex < text.length) {
          textEl.textContent += text[charIndex];
          charIndex++;
          // Typing sound
          if (charIndex % 3 === 0) {
            this.audio.playTone(600 + Math.random() * 200, 0.03, 'sine', 0.05);
          }
        } else {
          clearInterval(typeInterval);
        }
      }, typeSpeed);

      this.dialogueCallback = () => {
        clearInterval(typeInterval);
        if (charIndex < text.length) {
          // Show all text immediately
          textEl.textContent = text;
          charIndex = text.length;
        } else {
          box.classList.remove('show');
          this.dialogueCallback = null;
          resolve();
        }
      };
    });
  },

  advanceDialogue() {
    if (this.dialogueCallback) {
      this.dialogueCallback();
    }
  },

  hideDialogue() {
    document.getElementById('dialogue-box').classList.remove('show');
    this.dialogueCallback = null;
  },

  updateHpBar(who, current, max) {
    const bar = document.getElementById(`hp-${who === 'katsu' ? 'katsu' : 'somen'}-bar`);
    const text = document.getElementById(`hp-${who === 'katsu' ? 'katsu' : 'somen'}-text`);
    const pct = Math.max(0, (current / max) * 100);
    bar.style.width = pct + '%';
    text.textContent = `${Math.max(0, Math.floor(current))}/${max}`;
  },

  animateHpChange(who, fromHp, toHp, duration) {
    return new Promise((resolve) => {
      const max = who === 'katsu' ? this.katsu.maxHp : this.somen.maxHp;
      const startTime = performance.now();
      const animate = (now) => {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const currentHp = lerp(fromHp, toHp, easeInOut(t));
        this.updateHpBar(who, currentHp, max);
        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          this.updateHpBar(who, toHp, max);
          resolve();
        }
      };
      requestAnimationFrame(animate);
    });
  },

  updateHpSub(who, text) {
    document.getElementById(`hp-${who === 'katsu' ? 'katsu' : 'somen'}-sub`).textContent = text;
  },

  updateScoreboard(rank, sub) {
    document.getElementById('scoreboard-rank').textContent = rank;
    document.getElementById('scoreboard-sub').textContent = sub;
  },

  showTurnIndicator(text, color, duration) {
    const el = document.getElementById('turn-indicator');
    el.textContent = text;
    el.style.color = color;
    el.style.textShadow = `0 0 30px ${color}, 0 0 60px ${color}`;
    el.style.opacity = '0';

    // Animate in
    let start = performance.now();
    const animate = (now) => {
      const t = (now - start) / duration;
      if (t < 0.2) {
        el.style.opacity = String(t / 0.2);
        el.style.transform = `translate(-50%, -50%) scale(${lerp(2, 1, t / 0.2)})`;
      } else if (t < 0.8) {
        el.style.opacity = '1';
        el.style.transform = 'translate(-50%, -50%) scale(1)';
      } else if (t < 1) {
        el.style.opacity = String(1 - (t - 0.8) / 0.2);
      } else {
        el.style.opacity = '0';
        return;
      }
      requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  },

  showSkillName(name, desc, color, descColor, duration) {
    const container = document.getElementById('skill-display');
    const nameEl = document.getElementById('skill-name');
    const descEl = document.getElementById('skill-desc');

    nameEl.textContent = name;
    nameEl.style.color = color;
    nameEl.style.textShadow = `0 0 20px ${color}, 0 0 40px ${color}`;
    descEl.textContent = desc;
    descEl.style.color = descColor;

    let start = performance.now();
    const animate = (now) => {
      const t = (now - start) / duration;
      if (t < 0.15) {
        container.style.opacity = String(t / 0.15);
        container.style.transform = `translate(-50%, -50%) scale(${lerp(0.5, 1.1, easeOutBack(t / 0.15))})`;
      } else if (t < 0.25) {
        container.style.opacity = '1';
        container.style.transform = `translate(-50%, -50%) scale(${lerp(1.1, 1, (t - 0.15) / 0.1)})`;
      } else if (t < 0.8) {
        container.style.opacity = '1';
        container.style.transform = 'translate(-50%, -50%) scale(1)';
      } else if (t < 1) {
        container.style.opacity = String(1 - (t - 0.8) / 0.2);
      } else {
        container.style.opacity = '0';
        return;
      }
      requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  },

  showDamageNumber(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'damage-number';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    el.style.fontSize = text.includes('+') ? '28px' : '36px';
    el.style.textShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
    document.getElementById('ui-overlay').appendChild(el);
    setTimeout(() => el.remove(), 1500);
  },

  showCombo(count) {
    if (count < 2) return;
    const el = document.getElementById('combo-display');
    el.textContent = `${count} COMBO!`;
    el.style.opacity = '1';
    el.style.transform = 'scale(1.3)';
    setTimeout(() => {
      el.style.transition = 'all 0.5s';
      el.style.transform = 'scale(1)';
    }, 100);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = '';
    }, 1500);
  },

  setCutscene(active) {
    document.getElementById('cutscene-top').classList.toggle('active', active);
    document.getElementById('cutscene-bottom').classList.toggle('active', active);
  },

  screenShake(duration, intensity) {
    this.screenShakeTimer = duration * 60;
    this.screenShakeIntensity = intensity;
  },

  flashScreen(color, duration) {
    const el = document.getElementById('screen-flash');
    el.style.backgroundColor = color;
    el.style.opacity = '0.6';
    setTimeout(() => { el.style.opacity = '0'; }, duration);
  },

  addAnimation(config) {
    config._frame = 0;
    config._maxFrame = config.duration || 60;
    this.animations.push(config);
  },

  // ============================================================================
  // SECTION 9: MAIN GAME LOOP
  // ============================================================================
  gameLoop() {
    this.frame++;
    const ctx = this.ctx;
    const W = this.W;
    const H = this.H;

    // Clear
    ctx.clearRect(0, 0, W, H);

    // Screen shake transform
    ctx.save();
    if (this.screenShakeTimer > 0) {
      this.screenShakeTimer--;
      const shakeX = (Math.random() - 0.5) * this.screenShakeIntensity;
      const shakeY = (Math.random() - 0.5) * this.screenShakeIntensity;
      ctx.translate(shakeX, shakeY);
      this.screenShakeIntensity *= 0.95;
    }

    // Draw arena background
    if (this.state === 'battle' || this.state === 'win') {
      this.arena.drawBackground(this.phase);
    } else if (this.state === 'domain_intro') {
      this.arena.drawBackground('domain');
    }

    // Ambient domain particles
    if (this.state === 'battle') {
      Effects.ambientDomain(this.particleSystem, W, H);
    }

    // Draw characters
    if (this.state === 'battle' || this.state === 'win') {
      // Smooth character movement
      this.katsu.x = lerp(this.katsu.x, this.katsu.targetX, 0.08);
      this.katsu.y = lerp(this.katsu.y, this.katsu.targetY, 0.08);
      this.somen.x = lerp(this.somen.x, this.somen.targetX, 0.08);
      this.somen.y = lerp(this.somen.y, this.somen.targetY, 0.08);

      CharacterRenderer.drawKatsuKatsu(ctx, this.katsu.x, this.katsu.y, this.katsu.scale, this.katsu.state, this.frame);
      CharacterRenderer.drawSomenRobo(ctx, this.somen.x, this.somen.y, this.somen.scale, this.somen.state, this.frame);
    }

    // Update and draw particles
    this.particleSystem.update();
    this.particleSystem.draw(ctx);

    // Update animations
    for (let i = this.animations.length - 1; i >= 0; i--) {
      const anim = this.animations[i];
      anim._frame++;
      const t = Math.min(1, anim._frame / anim._maxFrame);
      if (anim.onUpdate) anim.onUpdate(t);
      if (anim._frame >= anim._maxFrame) {
        if (anim.onComplete) anim.onComplete();
        this.animations.splice(i, 1);
      }
    }

    ctx.restore();

    // Particle count display (debug, subtle)
    ctx.save();
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillText(`Particles: ${this.particleSystem.count}`, 10, this.H - 10);
    ctx.restore();

    requestAnimationFrame(() => this.gameLoop());
  }
};

// ============================================================================
// SECTION 10: INITIALIZATION
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
  Game.init();
});

// Prevent context menu on long press (mobile)
document.addEventListener('contextmenu', (e) => e.preventDefault());

// Handle visibility change (pause/resume BGM)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    Game.audio.stopBGM();
  } else if (Game.state === 'battle') {
    Game.audio.playBGMLoop();
  }
});
</script>
