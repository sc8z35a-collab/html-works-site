    float D_GGX(float NdotH, float roughness) {
      float a = roughness * roughness;
      float a2 = a * a;
      float denom = NdotH * NdotH * (a2 - 1.0) + 1.0;
      return a2 / (3.14159265 * denom * denom);
    }

    // Schlick Fresnel
    vec3 F_Schlick(float cosTheta, vec3 F0) {
      return F0 + (1.0 - F0) * pow(1.0 - cosTheta, 5.0);
    }

    // Smith GGX geometry function
    float G_SmithGGX(float NdotV, float NdotL, float roughness) {
      float r = roughness + 1.0;
      float k = (r * r) / 8.0;
      float ggx1 = NdotV / (NdotV * (1.0 - k) + k);
      float ggx2 = NdotL / (NdotL * (1.0 - k) + k);
      return ggx1 * ggx2;
    }

    void main() {
      vec3 n = normalize(vNormal);
      vec3 viewDir = normalize(uCameraPos - vWorldPos);
      vec3 halfDir = normalize(uLightDir + viewDir);

      float NdotL = max(dot(n, uLightDir), 0.0);
      float NdotV = max(dot(n, viewDir), 0.0);
      float NdotH = max(dot(n, halfDir), 0.0);
      float HdotV = max(dot(halfDir, viewDir), 0.0);

      float shadow = shadowCalc(vLightSpacePos);
      float lightFactor = 1.0 - shadow * 0.6;

      // PBR parameters
      float roughness = max(uRoughness, 0.05);
      float metallic = uMetallic;
      vec3 albedo = vColor;
      vec3 F0 = mix(vec3(0.04), albedo, metallic);

      // Cook-Torrance BRDF
      float D = D_GGX(NdotH, roughness);
      vec3 F = F_Schlick(HdotV, F0);
      float G = G_SmithGGX(NdotV, NdotL, roughness);

      vec3 specular = (D * F * G) / max(4.0 * NdotV * NdotL, 0.001);
      vec3 kD = (1.0 - F) * (1.0 - metallic);

      // Toon-ish diffuse ramp (softer)
      float toonDiffuse = smoothstep(0.0, 0.12, NdotL) * 0.65 + smoothstep(0.35, 0.55, NdotL) * 0.35;

      // Hemisphere ambient
      float hemi = dot(n, vec3(0.0, 1.0, 0.0)) * 0.5 + 0.5;
      vec3 ambient = mix(uAmbientColor * 0.35, uAmbientColor * 1.2, hemi);

      // Combine
      vec3 Lo = (kD * albedo / 3.14159265 + specular) * uLightColor * toonDiffuse * lightFactor;
      vec3 color = ambient * albedo + Lo;

      // Emissive
      color += uEmissive;

      // Rim light (view-dependent)
      float rim = pow(1.0 - NdotV, 4.0);
      vec3 rimColor = mix(vec3(0.15, 0.2, 0.3), uLightColor * 0.3, NdotL);
      color += rimColor * rim * 0.25 * lightFactor;

      // Outline effect (darken edges based on normal vs view)
      float outline = smoothstep(0.1, 0.2, NdotV);
      color *= mix(0.6, 1.0, outline);

      // Fog
      float fogFactor = smoothstep(uFogNear, uFogFar, vFogDepth);
      color = mix(color, uFogColor, fogFactor);

      gl_FragColor = vec4(color, uAlpha);
    }
  `;

  renderer.createProgram(objectVS, objectFS, 'objectEnhanced');
}


// ============================================================
//  SECTION 22: ENHANCED SKY SHADER (clouds, stars, aurora)
// ============================================================
function createEnhancedSkyShader(renderer) {
  const skyVS = `
    attribute vec3 aPosition;
    uniform mat4 uProjection;
    uniform mat4 uView;
    varying vec3 vDir;
    void main() {
      vDir = aPosition;
      mat4 rotView = uView;
      rotView[3] = vec4(0.0, 0.0, 0.0, 1.0);
      vec4 pos = uProjection * rotView * vec4(aPosition * 500.0, 1.0);
      gl_Position = pos.xyww;
    }
  `;

  const skyFS = `
    precision highp float;
    varying vec3 vDir;
    uniform float uTime;
    uniform float uDayPhase;
    uniform vec3 uSunDir;
    uniform float uCloudCoverage;
    uniform float uWeatherIntensity;

    float hash(vec3 p) {
      p = fract(p * vec3(443.897, 441.423, 437.195));
      p += dot(p, p.yzx + 19.19);
      return fract((p.x + p.y) * p.z);
    }

    float noise3D(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
            mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
        mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
            mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z
      );
    }

    float fbmCloud(vec3 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 6; i++) {
        v += a * noise3D(p);
        p = p * 2.01 + vec3(0.01);
        a *= 0.5;
      }
      return v;
    }

    vec3 getSkyGradient(vec3 dir, float phase) {
      float y = dir.y * 0.5 + 0.5;

      // Color palettes for different times
      vec3 dayTop = vec3(0.22, 0.50, 0.92);
      vec3 dayMid = vec3(0.45, 0.68, 0.95);
      vec3 dayBot = vec3(0.65, 0.82, 1.0);

      vec3 sunriseTop = vec3(0.25, 0.25, 0.55);
      vec3 sunriseMid = vec3(0.85, 0.45, 0.25);
      vec3 sunriseBot = vec3(0.95, 0.65, 0.30);

      vec3 sunsetTop = vec3(0.15, 0.12, 0.35);
      vec3 sunsetMid = vec3(0.90, 0.35, 0.15);
      vec3 sunsetBot = vec3(1.0, 0.55, 0.15);

      vec3 nightTop = vec3(0.01, 0.01, 0.06);
      vec3 nightMid = vec3(0.02, 0.02, 0.08);
      vec3 nightBot = vec3(0.04, 0.04, 0.12);

      vec3 top, mid, bot;

      if (phase < 0.22) {
        // Night
        float t = smoothstep(0.15, 0.22, phase);
        top = mix(nightTop, sunriseTop, t);
        mid = mix(nightMid, sunriseMid, t);
        bot = mix(nightBot, sunriseBot, t);
      } else if (phase < 0.32) {
        // Sunrise
        float t = (phase - 0.22) / 0.1;
        top = mix(sunriseTop, dayTop, t);
        mid = mix(sunriseMid, dayMid, t);
        bot = mix(sunriseBot, dayBot, t);
      } else if (phase < 0.68) {
        // Day
        top = dayTop;
        mid = dayMid;
        bot = dayBot;
      } else if (phase < 0.78) {
        // Sunset begin
        float t = (phase - 0.68) / 0.1;
        top = mix(dayTop, sunsetTop, t);
        mid = mix(dayMid, sunsetMid, t);
        bot = mix(dayBot, sunsetBot, t);
      } else if (phase < 0.88) {
        // Sunset -> night
        float t = (phase - 0.78) / 0.1;
        top = mix(sunsetTop, nightTop, t);
        mid = mix(sunsetMid, nightMid, t);
        bot = mix(sunsetBot, nightBot, t);
      } else {
        // Night
        top = nightTop;
        mid = nightMid;
        bot = nightBot;
      }

      // Smooth gradient blend
      vec3 sky;
      if (y > 0.5) {
        sky = mix(mid, top, (y - 0.5) * 2.0);
      } else {
        sky = mix(bot, mid, y * 2.0);
      }

      return sky;
    }

    void main() {
      vec3 dir = normalize(vDir);
      vec3 sky = getSkyGradient(dir, uDayPhase);

      // === SUN ===
      float sunDot = max(dot(dir, uSunDir), 0.0);
      float sunDisc = pow(sunDot, 512.0) * 3.0;
      float sunGlow = pow(sunDot, 8.0) * 0.5;
      float sunHalo = pow(sunDot, 32.0) * 0.3;
      vec3 sunColor = vec3(1.0, 0.92, 0.75);
      if (uDayPhase > 0.7 || uDayPhase < 0.3) {
        sunColor = vec3(1.0, 0.6, 0.3);
      }
      sky += sunColor * (sunDisc + sunGlow + sunHalo);

      // === MOON ===
      vec3 moonDir = -uSunDir;
      moonDir.y = abs(moonDir.y);
      float moonDot = max(dot(dir, moonDir), 0.0);
      float moonDisc = pow(moonDot, 512.0) * 0.8;
      float moonGlow = pow(moonDot, 32.0) * 0.1;
      if (uDayPhase > 0.8 || uDayPhase < 0.2) {
        sky += vec3(0.8, 0.85, 0.95) * (moonDisc + moonGlow);
      }

      // === STARS ===
      float nightFactor = 0.0;
      if (uDayPhase > 0.82) nightFactor = smoothstep(0.82, 0.92, uDayPhase);
      else if (uDayPhase < 0.2) nightFactor = smoothstep(0.2, 0.1, uDayPhase);

      if (nightFactor > 0.01) {
        vec3 starDir = normalize(dir) * 300.0;
        float star = hash(floor(starDir));
        if (star > 0.996) {
          float twinkle = sin(uTime * 2.0 + star * 500.0) * 0.3 + 0.7;
          float brightness = (star - 0.996) * 250.0;
          vec3 starColor = vec3(0.9 + hash(floor(starDir + 1.0)) * 0.1);
          sky += starColor * brightness * nightFactor * twinkle;
        }

        // Milky way
        float milky = fbmCloud(dir * 5.0 + vec3(0.0, 0.0, uTime * 0.001));
        milky = smoothstep(0.35, 0.65, milky) * 0.08;
        float milkyMask = smoothstep(0.3, 0.8, abs(dir.y));
        sky += vec3(0.3, 0.35, 0.5) * milky * nightFactor * milkyMask;
      }

      // === CLOUDS ===
      if (dir.y > 0.0) {
        // Raycast to cloud plane
        float cloudHeight = 15.0;
        float t = cloudHeight / max(dir.y, 0.001);
        vec3 cloudPos = dir * t;

        // Multi-octave cloud noise
        vec2 cloudUV = cloudPos.xz * 0.003;
        cloudUV += uTime * vec2(0.008, 0.004);

        float cloud = fbmCloud(vec3(cloudUV * 5.0, uTime * 0.05));

        // Shape clouds
        float cloudShape = smoothstep(0.35 - uCloudCoverage * 0.2, 0.65, cloud);

        // Cloud lighting
        float cloudLight = max(dot(vec3(0.0, 1.0, 0.0), uSunDir), 0.0);
        vec3 cloudBright = mix(vec3(0.7, 0.72, 0.78), vec3(1.0, 0.98, 0.92), cloudLight);
        vec3 cloudDark = mix(vec3(0.25, 0.27, 0.35), vec3(0.5, 0.45, 0.4), cloudLight);

        // Cloud depth shading
        float cloudDepth = fbmCloud(vec3(cloudUV * 5.0 + 0.1, uTime * 0.05 + 10.0));
        vec3 cloudColor = mix(cloudDark, cloudBright, smoothstep(0.3, 0.6, cloudDepth));

        // Sunset colored clouds
        if (uDayPhase > 0.68 && uDayPhase < 0.85) {
          float sunsetT = smoothstep(0.68, 0.78, uDayPhase) * (1.0 - smoothstep(0.78, 0.85, uDayPhase));
          cloudColor = mix(cloudColor, vec3(1.0, 0.55, 0.25), sunsetT * 0.6);
        }
        if (uDayPhase > 0.18 && uDayPhase < 0.3) {
          float sunriseT = smoothstep(0.18, 0.24, uDayPhase) * (1.0 - smoothstep(0.24, 0.3, uDayPhase));
          cloudColor = mix(cloudColor, vec3(1.0, 0.65, 0.35), sunriseT * 0.5);
        }

        // Night clouds dimmed
        cloudColor *= mix(0.15, 1.0, smoothstep(0.2, 0.35, uDayPhase) * (1.0 - smoothstep(0.8, 0.95, uDayPhase)));

        // Apply clouds
        float cloudAlpha = cloudShape * smoothstep(0.0, 0.15, dir.y);
        sky = mix(sky, cloudColor, cloudAlpha * 0.85);
      }

      // === ATMOSPHERIC SCATTERING (Rayleigh approximation) ===
      float scatter = pow(max(1.0 - dir.y, 0.0), 5.0);
      vec3 scatterColor = mix(vec3(0.7, 0.4, 0.2), vec3(0.6, 0.75, 0.9), smoothstep(0.25, 0.75, uDayPhase));
      sky += scatterColor * scatter * 0.15;

      gl_FragColor = vec4(max(sky, vec3(0.0)), 1.0);
    }
  `;

  renderer.createProgram(skyVS, skyFS, 'skyEnhanced');
}


// ============================================================
//  SECTION 23: INTEGRATE ENHANCED SYSTEMS INTO GAME
// ============================================================

// Store original init and render
const _originalGameInit = Game.init;
const _originalGameRender = Game.render;
const _originalGameUpdate = Game.update;
const _originalPlayerUpdate = Player.prototype.update;

// Override Game.init to add new systems
Game.init = async function() {
  await _originalGameInit.call(this);

  // Initialize collision system
  this.collisionSystem = new CollisionSystem(this.world);
  this.collisionSystem.registerColliders();

  // Create enhanced shaders
  createEnhancedTerrainShader(this.renderer);
  createEnhancedWaterShader(this.renderer);
  createEnhancedObjectShader(this.renderer);
  createEnhancedSkyShader(this.renderer);

  // Initialize post-processing pipeline
  this.postProcess = new PostProcessPipeline(this.renderer);

  // High-res resize handler
  const oldResize = this.renderer.resize.bind(this.renderer);
  this.renderer.resize = () => {
    oldResize();
    if (this.postProcess) {
      this.postProcess.resize(this.renderer.canvas.width, this.renderer.canvas.height);
    }
  };
  this.renderer.resize();

  console.log('[Part 2] Enhanced graphics, collision, and post-processing initialized.');
};

// Override Player.update to integrate collision
Player.prototype.update = function(dt, input) {
  _originalPlayerUpdate.call(this, dt, input);

  // Apply collision resolution
  if (Game.collisionSystem) {
    Game.collisionSystem.resolvePlayerCollisions(this);
  }
};

// Override Game.render to use enhanced pipeline
Game.render = function() {
  const gl = this.renderer.gl;
  const r = this.renderer;
  const aspect = r.aspect;

  const sunDir = this.clock.getSunDirection();
  const ambientColor = this.clock.getAmbientColor();
  const lightColor = this.clock.getLightColor();
  const fogColor = this.clock.getFogColor();
  const dayPhase = this.clock.getDayPhase();

  const projMatrix = this.camera.getProjectionMatrix(aspect);
  const viewMatrix = this.camera.getViewMatrix();
  const lightMVP = this.camera.getLightMatrix(sunDir, this.player.position, 40);
  const identityModel = new Mat4();

  // ===== SHADOW PASS ===== (unchanged)
  gl.bindFramebuffer(gl.FRAMEBUFFER, r.shadowFB);
  gl.viewport(0, 0, r.shadowSize, r.shadowSize);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.cullFace(gl.FRONT);

  const shadowProg = r.useProgram('shadow');
  r.setUniformMat4(shadowProg, 'uLightMVP', lightMVP);

  const cs = this.world.chunkSize;
  const px = this.player.position.x / this.world.tileSize + this.world.size / 2;
  const pz = this.player.position.z / this.world.tileSize + this.world.size / 2;
  const playerChunkX = Math.floor(px / cs);
  const playerChunkZ = Math.floor(pz / cs);

  for (let cz = playerChunkZ - 3; cz <= playerChunkZ + 3; cz++) {
    for (let cx = playerChunkX - 3; cx <= playerChunkX + 3; cx++) {
      const key = this.world.getChunkKey(cx, cz);
      if (r.meshes[`terrain_${key}`]) {
        r.setUniformMat4(shadowProg, 'uModel', identityModel);
        r.bindMesh(r.meshes[`terrain_${key}`], shadowProg);
        r.drawMesh(r.meshes[`terrain_${key}`]);
      }
    }
  }

  r.setUniformMat4(shadowProg, 'uModel', this.player.getModelMatrix());
  if (r.meshes['player']) { r.bindMesh(r.meshes['player'], shadowProg); r.drawMesh(r.meshes['player']); }

  for (const npc of this.npcs) {
    r.setUniformMat4(shadowProg, 'uModel', npc.getModelMatrix());
    const mn = `npc_${npc.id}`;
    if (r.meshes[mn]) { r.bindMesh(r.meshes[mn], shadowProg); r.drawMesh(r.meshes[mn]); }
  }

  for (let i = 0; i < this.world.buildings.length; i++) {
    const b = this.world.buildings[i];
    const mn = `building_${i}`;
    if (r.meshes[mn]) {
      const bm = new Mat4();
      const bwx = (b.x - this.world.size / 2) * this.world.tileSize + b.width / 2;
      const bwz = (b.z - this.world.size / 2) * this.world.tileSize + b.depth / 2;
      const bwy = this.world.getHeightInterpolated(bwx, bwz);
      bm.translate(bwx, bwy + b.height / 2, bwz);
      r.setUniformMat4(shadowProg, 'uModel', bm);
      r.bindMesh(r.meshes[mn], shadowProg);
      r.drawMesh(r.meshes[mn]);
    }
  }

  gl.cullFace(gl.BACK);

  // ===== BEGIN POST-PROCESSING SCENE =====
  if (this.postProcess && this.postProcess.enabled) {
    this.postProcess.beginScene();
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, r.canvas.width, r.canvas.height);
  }

  const sc = fogColor;
  gl.clearColor(sc.r, sc.g, sc.b, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // ---- ENHANCED SKY ----
  gl.depthMask(false);
  const skyProg = r.programs['skyEnhanced'] ? r.useProgram('skyEnhanced') : r.useProgram('sky');
  r.setUniformMat4(skyProg, 'uProjection', projMatrix);
  r.setUniformMat4(skyProg, 'uView', viewMatrix);
  r.setUniform1f(skyProg, 'uTime', this.time);
  r.setUniform1f(skyProg, 'uDayPhase', dayPhase);
  r.setUniform3f(skyProg, 'uSunDir', sunDir.x, sunDir.y, sunDir.z);
  if (skyProg.uniforms['uCloudCoverage']) r.setUniform1f(skyProg, 'uCloudCoverage', this.weather.current === 'cloudy' || this.weather.current === 'rain' ? 0.7 : 0.3);
  if (skyProg.uniforms['uWeatherIntensity']) r.setUniform1f(skyProg, 'uWeatherIntensity', this.weather.intensity);
  if (r.meshes['sky']) { r.bindMesh(r.meshes['sky'], skyProg); r.drawMesh(r.meshes['sky']); }
  gl.depthMask(true);

  // ---- ENHANCED TERRAIN ----
  const tProg = r.programs['terrainEnhanced'] ? r.useProgram('terrainEnhanced') : r.useProgram('terrain');
  r.setUniformMat4(tProg, 'uProjection', projMatrix);
  r.setUniformMat4(tProg, 'uView', viewMatrix);
  r.setUniformMat4(tProg, 'uLightMVP', lightMVP);
  r.setUniform3f(tProg, 'uLightDir', sunDir.x, sunDir.y, sunDir.z);
  r.setUniform3f(tProg, 'uLightColor', lightColor.r, lightColor.g, lightColor.b);
  r.setUniform3f(tProg, 'uAmbientColor', ambientColor.r, ambientColor.g, ambientColor.b);
  r.setUniform1f(tProg, 'uTime', this.time);
  r.setUniform3f(tProg, 'uFogColor', fogColor.r, fogColor.g, fogColor.b);
  r.setUniform1f(tProg, 'uFogNear', CONFIG.FOG_NEAR);
  r.setUniform1f(tProg, 'uFogFar', CONFIG.FOG_FAR);
  r.setUniform1f(tProg, 'uWaterLevel', CONFIG.WATER_LEVEL);
  if (tProg.uniforms['uCameraPos']) r.setUniform3f(tProg, 'uCameraPos', this.camera.position.x, this.camera.position.y, this.camera.position.z);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, r.shadowTex);
  r.setUniform1i(tProg, 'uShadowMap', 0);

  const rd = CONFIG.RENDER_DISTANCE;
  for (let cz = playerChunkZ - rd; cz <= playerChunkZ + rd; cz++) {
    for (let cx = playerChunkX - rd; cx <= playerChunkX + rd; cx++) {
      const key = this.world.getChunkKey(cx, cz);
      const mn = `terrain_${key}`;
      if (r.meshes[mn]) {
        r.setUniformMat4(tProg, 'uModel', identityModel);
        r.bindMesh(r.meshes[mn], tProg);
        r.drawMesh(r.meshes[mn]);
      }
    }
  }

  // ---- ENHANCED OBJECTS ----
  const oProg = r.programs['objectEnhanced'] ? r.useProgram('objectEnhanced') : r.useProgram('object');
  r.setUniformMat4(oProg, 'uProjection', projMatrix);
  r.setUniformMat4(oProg, 'uView', viewMatrix);
  r.setUniformMat4(oProg, 'uLightMVP', lightMVP);
  r.setUniform3f(oProg, 'uLightDir', sunDir.x, sunDir.y, sunDir.z);
  r.setUniform3f(oProg, 'uLightColor', lightColor.r, lightColor.g, lightColor.b);
  r.setUniform3f(oProg, 'uAmbientColor', ambientColor.r, ambientColor.g, ambientColor.b);
  r.setUniform3f(oProg, 'uFogColor', fogColor.r, fogColor.g, fogColor.b);
  r.setUniform1f(oProg, 'uFogNear', CONFIG.FOG_NEAR);
  r.setUniform1f(oProg, 'uFogFar', CONFIG.FOG_FAR);
  r.setUniform1f(oProg, 'uAlpha', 1.0);
  r.setUniform1f(oProg, 'uTime', this.time);
  if (oProg.uniforms['uCameraPos']) r.setUniform3f(oProg, 'uCameraPos', this.camera.position.x, this.camera.position.y, this.camera.position.z);
  if (oProg.uniforms['uRoughness']) r.setUniform1f(oProg, 'uRoughness', 0.7);
  if (oProg.uniforms['uMetallic']) r.setUniform1f(oProg, 'uMetallic', 0.0);
  if (oProg.uniforms['uEmissive']) r.setUniform3f(oProg, 'uEmissive', 0, 0, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, r.shadowTex);
  r.setUniform1i(oProg, 'uShadowMap', 0);

  // Render world objects
  const viewRange = rd * cs;
  const startTX = Math.max(0, Math.floor(px - viewRange));
  const endTX = Math.min(this.world.size - 1, Math.floor(px + viewRange));
  const startTZ = Math.max(0, Math.floor(pz - viewRange));
  const endTZ = Math.min(this.world.size - 1, Math.floor(pz + viewRange));

  for (let tz = startTZ; tz <= endTZ; tz += 2) {
    for (let tx = startTX; tx <= endTX; tx += 2) {
      const idx = tz * this.world.size + tx;
      const obj = this.world.objectMap[idx];
      if (!obj) continue;

      let meshName = null;
      const model = new Mat4();
      model.translate(obj.x, obj.y, obj.z);
      let animType = 0;

      if (obj.type === 'tree') {
        const variant = (tx + tz) % 3;
        meshName = `tree_${obj.treeType}_${variant}`;
        animType = 1;
        if (oProg.uniforms['uRoughness']) r.setUniform1f(oProg, 'uRoughness', 0.8);
        if (oProg.uniforms['uMetallic']) r.setUniform1f(oProg, 'uMetallic', 0.0);
      } else if (obj.type === 'rock') {
        const variant = (tx + tz) % 3;
        meshName = `rock_${variant}`;
        model.scale(obj.size, obj.size, obj.size);
        animType = 0;
        if (oProg.uniforms['uRoughness']) r.setUniform1f(oProg, 'uRoughness', 0.9);
        if (oProg.uniforms['uMetallic']) r.setUniform1f(oProg, 'uMetallic', 0.1);
      } else if (obj.type === 'flower') {
        meshName = `flower_${obj.flowerType}`;
        animType = 2;
        if (oProg.uniforms['uRoughness']) r.setUniform1f(oProg, 'uRoughness', 0.6);
      } else if (obj.type === 'stump') {
        meshName = 'stump';
        animType = 0;
      }

      if (oProg.uniforms['uAnimType']) r.setUniform1i(oProg, 'uAnimType', animType);

      if (meshName && r.meshes[meshName]) {
        r.setUniformMat4(oProg, 'uModel', model);
        r.setUniform1f(oProg, 'uAlpha', 1.0);
        r.bindMesh(r.meshes[meshName], oProg);
        r.drawMesh(r.meshes[meshName]);
      }
    }
  }

  // Buildings
  if (oProg.uniforms['uAnimType']) r.setUniform1i(oProg, 'uAnimType', 0);
  if (oProg.uniforms['uRoughness']) r.setUniform1f(oProg, 'uRoughness', 0.7);
  if (oProg.uniforms['uMetallic']) r.setUniform1f(oProg, 'uMetallic', 0.0);
  for (let i = 0; i < this.world.buildings.length; i++) {
    const b = this.world.buildings[i];
    const mn = `building_${i}`;
    if (r.meshes[mn]) {
      const bm = new Mat4();
      const bwx = (b.x - this.world.size / 2) * this.world.tileSize + b.width / 2;
      const bwz = (b.z - this.world.size / 2) * this.world.tileSize + b.depth / 2;
      const bwy = this.world.getHeightInterpolated(bwx, bwz);
      bm.translate(bwx, bwy + b.height / 2, bwz);
      r.setUniformMat4(oProg, 'uModel', bm);
      r.setUniform1f(oProg, 'uAlpha', 1.0);

      // Emissive windows at night
      if (this.clock.isNight() && oProg.uniforms['uEmissive']) {
        r.setUniform3f(oProg, 'uEmissive', 0.15, 0.12, 0.05);
      } else if (oProg.uniforms['uEmissive']) {
        r.setUniform3f(oProg, 'uEmissive', 0, 0, 0);
      }

      r.bindMesh(r.meshes[mn], oProg);
      r.drawMesh(r.meshes[mn]);
    }
  }
  if (oProg.uniforms['uEmissive']) r.setUniform3f(oProg, 'uEmissive', 0, 0, 0);

  // Player
  if (oProg.uniforms['uAnimType']) r.setUniform1i(oProg, 'uAnimType', 0);
  if (oProg.uniforms['uRoughness']) r.setUniform1f(oProg, 'uRoughness', 0.6);
  r.setUniformMat4(oProg, 'uModel', this.player.getModelMatrix());
  r.setUniform1f(oProg, 'uAlpha', 1.0);
  if (r.meshes['player']) { r.bindMesh(r.meshes['player'], oProg); r.drawMesh(r.meshes['player']); }

  // NPCs
  if (oProg.uniforms['uAnimType']) r.setUniform1i(oProg, 'uAnimType', 3);
  if (oProg.uniforms['uRoughness']) r.setUniform1f(oProg, 'uRoughness', 0.65);
  for (const npc of this.npcs) {
    const dist = MathUtils.distance2D(npc.position.x, npc.position.z, this.player.position.x, this.player.position.z);
    if (dist > viewRange * this.world.tileSize) continue;
    const mn = `npc_${npc.id}`;
    if (r.meshes[mn]) {
      r.setUniformMat4(oProg, 'uModel', npc.getModelMatrix());
      r.setUniform1f(oProg, 'uAlpha', 1.0);
      r.bindMesh(r.meshes[mn], oProg);
      r.drawMesh(r.meshes[mn]);
    }
  }

  // Creatures
  if (oProg.uniforms['uAnimType']) r.setUniform1i(oProg, 'uAnimType', 0);
  for (const c of this.creatures) {
    if (!c.active) continue;
    const dist = MathUtils.distance2D(c.x, c.z, this.player.position.x, this.player.position.z);
    if (dist > 60) continue;
    const mn = c.type === 'bug' ? 'bug' : 'fish';
    if (r.meshes[mn]) {
      const cm = new Mat4();
      cm.translate(c.x, c.y, c.z);
      if (c.type === 'bug') { cm.scale(0.5, 0.5, 0.5); cm.rotateY(c.wanderAngle || 0); }
      else { cm.scale(c.size * 3, c.size * 3, c.size * 3); cm.rotateY(c.swimAngle || 0); }
      r.setUniformMat4(oProg, 'uModel', cm);
      r.setUniform1f(oProg, 'uAlpha', c.type === 'fish' ? 0.6 : 1.0);
      r.bindMesh(r.meshes[mn], oProg);
      r.drawMesh(r.meshes[mn]);
    }
  }

  // ---- ENHANCED WATER ----
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const wProg = r.programs['waterEnhanced'] ? r.useProgram('waterEnhanced') : r.useProgram('water');
  r.setUniformMat4(wProg, 'uProjection', projMatrix);
  r.setUniformMat4(wProg, 'uView', viewMatrix);
  r.setUniformMat4(wProg, 'uModel', identityModel);
  r.setUniform1f(wProg, 'uTime', this.time);
  r.setUniform3f(wProg, 'uFogColor', fogColor.r, fogColor.g, fogColor.b);
  r.setUniform1f(wProg, 'uFogNear', CONFIG.FOG_NEAR);
  r.setUniform1f(wProg, 'uFogFar', CONFIG.FOG_FAR);
  r.setUniform3f(wProg, 'uLightDir', sunDir.x, sunDir.y, sunDir.z);
  if (wProg.uniforms['uLightColor']) r.setUniform3f(wProg, 'uLightColor', lightColor.r, lightColor.g, lightColor.b);
  if (wProg.uniforms['uCameraPos']) r.setUniform3f(wProg, 'uCameraPos', this.camera.position.x, this.camera.position.y, this.camera.position.z);

  if (r.meshes['water']) {
    r.bindMesh(r.meshes['water'], wProg);
    r.drawMesh(r.meshes['water']);
  }

  // ---- PARTICLES ----
  const pData = this.particles.getBufferData();
  if (pData.count > 0) {
    const particleProg = r.useProgram('particle');
    r.setUniformMat4(particleProg, 'uProjection', projMatrix);
    r.setUniformMat4(particleProg, 'uView', viewMatrix);

    const pVBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, pVBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pData.positions), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(particleProg.attribs.aPosition);
    gl.vertexAttribPointer(particleProg.attribs.aPosition, 3, gl.FLOAT, false, 0, 0);

    const pCBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, pCBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pData.colors), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(particleProg.attribs.aColor);
    gl.vertexAttribPointer(particleProg.attribs.aColor, 4, gl.FLOAT, false, 0, 0);

    const pSBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, pSBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pData.sizes), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(particleProg.attribs.aSize);
    gl.vertexAttribPointer(particleProg.attribs.aSize, 1, gl.FLOAT, false, 0, 0);

    gl.drawArrays(gl.POINTS, 0, pData.count);
    gl.deleteBuffer(pVBO);
    gl.deleteBuffer(pCBO);
    gl.deleteBuffer(pSBO);
  }

  // ---- WEATHER PARTICLES (Rain, Snow, Storm) ----
  this.renderWeatherParticles(gl, r, projMatrix, viewMatrix);

  // ===== END POST-PROCESSING =====
  if (this.postProcess && this.postProcess.enabled) {
    this.postProcess.endScene(this.time, projMatrix);
  }
};


// ============================================================
//  SECTION 24: WEATHER PARTICLE RENDERING
// ============================================================
Game.weatherParticles = [];
Game.weatherParticleBuffer = null;
Game.maxWeatherParticles = 1500;

Game.renderWeatherParticles = function(gl, r, projMatrix, viewMatrix) {
  const weather = this.weather;
  if (!weather) return;

  const wType = weather.current;
  if (wType !== 'rain' && wType !== 'snow' && wType !== 'storm') return;

  const pPos = this.player.position;
  const particleProg = r.useProgram('particle');
  r.setUniformMat4(particleProg, 'uProjection', projMatrix);
  r.setUniformMat4(particleProg, 'uView', viewMatrix);

  // Generate / update weather particles
  const maxP = this.maxWeatherParticles;
  const intensity = weather.intensity;
  const spawnRate = wType === 'storm' ? 40 : wType === 'rain' ? 25 : 10;

  // Spawn new particles
  for (let i = 0; i < spawnRate; i++) {
    if (this.weatherParticles.length >= maxP) break;
    const spread = 40;
    const px2 = pPos.x + (Math.random() - 0.5) * spread * 2;
    const pz2 = pPos.z + (Math.random() - 0.5) * spread * 2;
    const py2 = pPos.y + 15 + Math.random() * 15;

    let particle;
    if (wType === 'snow') {
      particle = {
        x: px2, y: py2, z: pz2,
        vx: (Math.random() - 0.5) * 1.5 + weather.windSpeed * Math.cos(weather.windDir) * 0.3,
        vy: -1.0 - Math.random() * 1.5,
        vz: (Math.random() - 0.5) * 1.5 + weather.windSpeed * Math.sin(weather.windDir) * 0.3,
        r: 0.95, g: 0.95, b: 1.0, a: 0.8,
        size: 3 + Math.random() * 3,
        life: 8 + Math.random() * 5,
      };
    } else {
      // Rain / storm
      const windFactor = wType === 'storm' ? 3.0 : 0.5;
      particle = {
        x: px2, y: py2, z: pz2,
        vx: weather.windSpeed * Math.cos(weather.windDir) * windFactor,
        vy: -15 - Math.random() * 10 - (wType === 'storm' ? 10 : 0),
        vz: weather.windSpeed * Math.sin(weather.windDir) * windFactor,
        r: 0.6, g: 0.7, b: 0.85, a: 0.4 + intensity * 0.3,
        size: wType === 'storm' ? 2.5 : 1.5,
        life: 3 + Math.random() * 2,
      };
    }
    this.weatherParticles.push(particle);
  }

  // Update particles
  const dt = 1.0 / 60.0;
  const groundCheck = this.world;

  for (let i = this.weatherParticles.length - 1; i >= 0; i--) {
    const p = this.weatherParticles[i];
    p.life -= dt;
    if (p.life <= 0) {
      this.weatherParticles.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;

    // Snow: gentle sway
    if (wType === 'snow') {
      p.vx += (Math.random() - 0.5) * 0.5 * dt;
      p.vz += (Math.random() - 0.5) * 0.5 * dt;
    }

    // Ground check
    const gH = groundCheck.getHeightInterpolated(p.x, p.z);
    if (p.y <= gH) {
      this.weatherParticles.splice(i, 1);
      // Splash particle for rain
      if (wType === 'rain' || wType === 'storm') {
        this.particles.emit(p.x, gH + 0.1, p.z, 'splash', 1);
      }
      continue;
    }

    // Fade when far from player
    const distToPlayer = MathUtils.distance2D(p.x, p.z, pPos.x, pPos.z);
    if (distToPlayer > 45) {
      p.a *= 0.95;
    }
  }

  // Draw weather particles
  if (this.weatherParticles.length > 0) {
    const positions = [];
    const colors = [];
    const sizes = [];
    for (const p of this.weatherParticles) {
      positions.push(p.x, p.y, p.z);
      colors.push(p.r, p.g, p.b, p.a);
      sizes.push(p.size);
    }

    const wpVBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, wpVBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(particleProg.attribs.aPosition);
    gl.vertexAttribPointer(particleProg.attribs.aPosition, 3, gl.FLOAT, false, 0, 0);

    const wpCBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, wpCBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(particleProg.attribs.aColor);
    gl.vertexAttribPointer(particleProg.attribs.aColor, 4, gl.FLOAT, false, 0, 0);

    const wpSBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, wpSBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sizes), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(particleProg.attribs.aSize);
    gl.vertexAttribPointer(particleProg.attribs.aSize, 1, gl.FLOAT, false, 0, 0);

    gl.drawArrays(gl.POINTS, 0, this.weatherParticles.length);
    gl.deleteBuffer(wpVBO);
    gl.deleteBuffer(wpCBO);
    gl.deleteBuffer(wpSBO);
  }
};


// ============================================================
//  SECTION 25: HIGH-RESOLUTION MESH IMPROVEMENTS
// ============================================================

// Increase sphere segments for smoother character models
const _origCreateSphere = MeshGenerator.createSphere;
MeshGenerator.createSphereHQ = function(radius, segments, color) {
  // Use higher segment count for better quality
  return _origCreateSphere(radius, Math.max(segments, 14), color);
};

// Increase cylinder segments
const _origCreateCylinder = MeshGenerator.createCylinder;
MeshGenerator.createCylinderHQ = function(rTop, rBot, height, segments, color) {
  return _origCreateCylinder(rTop, rBot, height, Math.max(segments, 12), color);
};

// Enhanced player mesh with smoother geometry
MeshGenerator.createPlayerMeshHQ = function() {
  const parts = [];
  const skinColor = 0xFFDBAC;
  const hairColor = 0x5C3317;
  const shirtColor = 0x4ECDC4;
  const pantsColor = 0x556270;
  const shoeColor = 0x8B4513;

  // Body / Shirt (rounded box shape from sphere)
  const body = MeshGenerator.createSphereHQ(0.4, 14, shirtColor);
  for (let i = 0; i < body.vertices.length; i += 3) {
    body.vertices[i] *= 0.9; // slightly flatten X
    body.vertices[i + 1] = body.vertices[i + 1] * 0.85 + 0.55; // flatten Y and move up
    body.vertices[i + 2] *= 0.6; // flatten Z
  }
  parts.push(body);

  // Shirt collar detail
  const collar = MeshGenerator.createTorus(0.32, 0.04, 16, 6, MathUtils.colorLerp(shirtColor, 0xffffff, 0.3));
  for (let i = 0; i < collar.vertices.length; i += 3) {
    collar.vertices[i + 1] += 0.88;
  }
  parts.push(collar);

  // Head (smooth)
  const head = MeshGenerator.createSphereHQ(0.38, 16, skinColor);
  for (let i = 0; i < head.vertices.length; i += 3) head.vertices[i + 1] += 1.35;
  parts.push(head);

  // Hair (cap shape)
  const hair = MeshGenerator.createSphereHQ(0.42, 16, hairColor);
  for (let i = 0; i < hair.vertices.length; i += 3) {
    hair.vertices[i + 1] += 1.45;
    // Trim bottom half at front
    if (hair.vertices[i + 1] < 1.3 && hair.vertices[i + 2] > 0.1) {
      // Make transparent by collapsing
      const sr = (skinColor >> 16 & 0xff) / 255;
      const sg = (skinColor >> 8 & 0xff) / 255;
      const sb = (skinColor & 0xff) / 255;
      hair.colors[i] = sr;
      hair.colors[i + 1] = sg;
      hair.colors[i + 2] = sb;
    }
  }
  parts.push(hair);

  // Hair fringe (bangs)
  const bangs = MeshGenerator.createSphereHQ(0.15, 10, hairColor);
  for (let i = 0; i < bangs.vertices.length; i += 3) {
    bangs.vertices[i + 1] += 1.52;
    bangs.vertices[i + 2] += 0.3;
    bangs.vertices[i] *= 2.0; // widen
    bangs.vertices[i + 1] *= 0.5; // flatten
  }
  parts.push(bangs);

  // Eyes (whites)
  const eyeWL = MeshGenerator.createSphereHQ(0.075, 10, 0xFFFFFF);
  for (let i = 0; i < eyeWL.vertices.length; i += 3) { eyeWL.vertices[i] -= 0.14; eyeWL.vertices[i + 1] += 1.37; eyeWL.vertices[i + 2] += 0.3; }
  parts.push(eyeWL);
  const eyeWR = MeshGenerator.createSphereHQ(0.075, 10, 0xFFFFFF);
  for (let i = 0; i < eyeWR.vertices.length; i += 3) { eyeWR.vertices[i] += 0.14; eyeWR.vertices[i + 1] += 1.37; eyeWR.vertices[i + 2] += 0.3; }
  parts.push(eyeWR);

  // Pupils
  const pupilL = MeshGenerator.createSphereHQ(0.05, 8, 0x222222);

  parts.push(armR);

  // Shirt sleeves
  const sleeveL = MeshGenerator.createCylinderHQ(0.12, 0.11, 0.18, 10, shirtColor);
  for (let i = 0; i < sleeveL.vertices.length; i += 3) { sleeveL.vertices[i] -= 0.5; sleeveL.vertices[i + 1] += 0.78; }

  parts.push(shoeR);

  return MeshGenerator.merge(parts);

// Enhanced NPC mesh with smoother geometry
MeshGenerator.createNPCMeshHQ = function(npcData) {
  const color = npcData.color;
  const parts = [];

  // Body (rounder)
  const body = MeshGenerator.createSphereHQ(0.6, 14, color);
  parts.push(body);

  // Belly highlight
  const belly = MeshGenerator.createSphereHQ(0.42, 12, MathUtils.colorLerp(color, 0xffffff, 0.5));
  for (let i = 0; i < belly.vertices.length; i += 3) {
    belly.vertices[i + 2] += 0.25;
    belly.vertices[i + 1] += 0.05;
  }
  parts.push(belly);

  // Head
  const head = MeshGenerator.createSphereHQ(0.5, 14, color);
  for (let i = 0; i < head.vertices.length; i += 3) head.vertices[i + 1] += 1.15;
  parts.push(head);

  // Face (lighter front)
  const face = MeshGenerator.createSphereHQ(0.38, 12, MathUtils.colorLerp(color, 0xffffff, 0.35));
  for (let i = 0; i < face.vertices.length; i += 3) {
    face.vertices[i + 1] += 1.1;
    face.vertices[i + 2] += 0.2;

  parts.push(eyeWL);
  const eyeWR = MeshGenerator.createSphereHQ(0.1, 10, 0xFFFFFF);

  // Pupils (with color variation by personality)

  parts.push(pupilL);
  const pupilR = MeshGenerator.createSphereHQ(0.065, 8, pupilColor);
  for (let i = 0; i < pupilR.vertices.length; i += 3) { pupilR.vertices[i] += 0.16; pupilR.vertices[i + 1] += 1.23; pupilR.vertices[i + 2] += 0.42; }
  parts.push(pupilR);

  // Eye highlights
  const shL = MeshGenerator.createSphereHQ(0.03, 6, 0xFFFFFF);
  for (let i = 0; i < shL.vertices.length; i += 3) { shL.vertices[i] -= 0.14; shL.vertices[i + 1] += 1.26; shL.vertices[i + 2] += 0.44; }
  parts.push(shL);
  const shR = MeshGenerator.createSphereHQ(0.03, 6, 0xFFFFFF);
  for (let i = 0; i < shR.vertices.length; i += 3) { shR.vertices[i] += 0.18; shR.vertices[i + 1] += 1.26; shR.vertices[i + 2] += 0.44; }
  parts.push(shR);

  // Nose
  const nose = MeshGenerator.createSphereHQ(0.07, 8, 0x444444);

  parts.push(nose);

  // Mouth (smile)
  const mouthParts = [];
  for (let m = 0; m < 8; m++) {
    const angle = (m / 7) * Math.PI * 0.6 - Math.PI * 0.3;
    const mx = Math.sin(angle) * 0.1;
    const my = -Math.cos(angle) * 0.04;
    const dot = MeshGenerator.createSphereHQ(0.015, 4, 0x553333);

      dot.vertices[i] += mx;

  // Ears (species-specific shapes)

  if (species === 'ウサギ') {

    for (let i = 0; i < earL.vertices.length; i += 3) { earL.vertices[i] -= 0.2; earL.vertices[i + 1] += 1.9; }

    const earLInner = MeshGenerator.createCylinderHQ(0.035, 0.05, 0.5, 8, earColor);
    for (let i = 0; i < earLInner.vertices.length; i += 3) { earLInner.vertices[i] -= 0.2; earLInner.vertices[i + 1] += 1.9; earLInner.vertices[i + 2] += 0.02; }
    parts.push(earLInner);

    for (let i = 0; i < earR.vertices.length; i += 3) { earR.vertices[i] += 0.2; earR.vertices[i + 1] += 1.9; }
    parts.push(earR);
    const earRInner = MeshGenerator.createCylinderHQ(0.035, 0.05, 0.5, 8, earColor);
    for (let i = 0; i < earRInner.vertices.length; i += 3) { earRInner.vertices[i] += 0.2; earRInner.vertices[i + 1] += 1.9; earRInner.vertices[i + 2] += 0.02; }
    parts.push(earRInner);
  } else if (species === 'ネコ') {

    const earL = MeshGenerator.createCone(0.12, 0.25, 6, color);
    for (let i = 0; i < earL.vertices.length; i += 3) { earL.vertices[i] -= 0.28; earL.vertices[i + 1] += 1.7; }
    parts.push(earL);
    const earR = MeshGenerator.createCone(0.12, 0.25, 6, color);
    for (let i = 0; i < earR.vertices.length; i += 3) { earR.vertices[i] += 0.28; earR.vertices[i + 1] += 1.7; }
    parts.push(earR);
    // Inner ear
    const earLI = MeshGenerator.createCone(0.07, 0.18, 6, earColor);
    for (let i = 0; i < earLI.vertices.length; i += 3) { earLI.vertices[i] -= 0.28; earLI.vertices[i + 1] += 1.68; earLI.vertices[i + 2] += 0.02; }
    parts.push(earLI);
    const earRI = MeshGenerator.createCone(0.07, 0.18, 6, earColor);
    for (let i = 0; i < earRI.vertices.length; i += 3) { earRI.vertices[i] += 0.28; earRI.vertices[i + 1] += 1.68; earRI.vertices[i + 2] += 0.02; }
    parts.push(earRI);
  } else if (species === 'クマ') {
    // Round bear ears
    const earL = MeshGenerator.createSphereHQ(0.14, 8, color);
    for (let i = 0; i < earL.vertices.length; i += 3) { earL.vertices[i] -= 0.35; earL.vertices[i + 1] += 1.65; }
    parts.push(earL);
    const earR = MeshGenerator.createSphereHQ(0.14, 8, color);
    for (let i = 0; i < earR.vertices.length; i += 3) { earR.vertices[i] += 0.35; earR.vertices[i + 1] += 1.65; }
    parts.push(earR);
    const earLI = MeshGenerator.createSphereHQ(0.08, 6, earColor);
    for (let i = 0; i < earLI.vertices.length; i += 3) { earLI.vertices[i] -= 0.35; earLI.vertices[i + 1] += 1.65; earLI.vertices[i + 2] += 0.05; }
    parts.push(earLI);
    const earRI = MeshGenerator.createSphereHQ(0.08, 6, earColor);
    for (let i = 0; i < earRI.vertices.length; i += 3) { earRI.vertices[i] += 0.35; earRI.vertices[i + 1] += 1.65; earRI.vertices[i + 2] += 0.05; }
    parts.push(earRI);
  } else {
    // Default round ears
    const earL = MeshGenerator.createSphereHQ(0.16, 8, MathUtils.colorLerp(color, 0xffffff, 0.25));
    for (let i = 0; i < earL.vertices.length; i += 3) { earL.vertices[i] -= 0.32; earL.vertices[i + 1] += 1.68; }
    parts.push(earL);
    const earR = MeshGenerator.createSphereHQ(0.16, 8, MathUtils.colorLerp(color, 0xffffff, 0.25));
    for (let i = 0; i < earR.vertices.length; i += 3) { earR.vertices[i] += 0.32; earR.vertices[i + 1] += 1.68; }
    parts.push(earR);
  }

  // Arms (rounder)
  const armL = MeshGenerator.createCylinderHQ(0.1, 0.12, 0.48, 10, color);
  for (let i = 0; i < armL.vertices.length; i += 3) { armL.vertices[i] -= 0.68; armL.vertices[i + 1] += 0.45; }
  parts.push(armL);
  const armR = MeshGenerator.createCylinderHQ(0.1, 0.12, 0.48, 10, color);
  for (let i = 0; i < armR.vertices.length; i += 3) { armR.vertices[i] += 0.68; armR.vertices[i + 1] += 0.45; }
  parts.push(armR);

  // Hands (paws)
  const pawL = MeshGenerator.createSphereHQ(0.1, 8, MathUtils.colorLerp(color, 0x000000, 0.15));
  for (let i = 0; i < pawL.vertices.length; i += 3) { pawL.vertices[i] -= 0.68; pawL.vertices[i + 1] += 0.15; }
  parts.push(pawL);
  const pawR = MeshGenerator.createSphereHQ(0.1, 8, MathUtils.colorLerp(color, 0x000000, 0.15));
  for (let i = 0; i < pawR.vertices.length; i += 3) { pawR.vertices[i] += 0.68; pawR.vertices[i + 1] += 0.15; }
  parts.push(pawR);

  // Legs
  const legL = MeshGenerator.createCylinderHQ(0.12, 0.14, 0.38, 10, color);
  for (let i = 0; i < legL.vertices.length; i += 3) { legL.vertices[i] -= 0.22; legL.vertices[i + 1] -= 0.52; }
  parts.push(legL);
  const legR = MeshGenerator.createCylinderHQ(0.12, 0.14, 0.38, 10, color);
  for (let i = 0; i < legR.vertices.length; i += 3) { legR.vertices[i] += 0.22; legR.vertices[i + 1] -= 0.52; }

  // Feet
  const footL = MeshGenerator.createSphereHQ(0.12, 8, MathUtils.colorLerp(color, 0x000000, 0.15));
  for (let i = 0; i < footL.vertices.length; i += 3) {

    footL.vertices[i + 2] *= 1.3;

  parts.push(footL);

    parts.push(tail);
  } else if (species === 'ネコ') {
    const tailSegs = 6;
    for (let s = 0; s < tailSegs; s++) {
      const t = s / tailSegs;
      const tailSeg = MeshGenerator.createSphereHQ(0.05 - t * 0.015, 5, color);
      const curve = Math.sin(t * Math.PI) * 0.5;
      for (let i = 0; i < tailSeg.vertices.length; i += 3) {
        tailSeg.vertices[i + 1] += 0.2 + t * 0.6;
        tailSeg.vertices[i + 2] -= 0.55 - curve;
      }
      parts.push(tailSeg);
    }
  } else {
    // Simple round tail
    const tail = MeshGenerator.createSphereHQ(0.1, 6, color);

    parts.push(tail);
  }

  return MeshGenerator.merge(parts);
};


// ============================================================
//  SECTION 26: REBUILD HQ MESHES ON INIT
// ============================================================
const _origBuildObjectMeshes = Game.buildObjectMeshes;
Game.buildObjectMeshes = function() {
  // Call original first
  _origBuildObjectMeshes.call(this);

  // Rebuild player mesh with HQ version
  const playerMeshDataHQ = MeshGenerator.createPlayerMeshHQ();
  this.renderer.createMesh('player', playerMeshDataHQ.vertices, playerMeshDataHQ.normals,
    playerMeshDataHQ.colors, playerMeshDataHQ.indices, playerMeshDataHQ.texcoords);

  // Rebuild NPC meshes with HQ version
  for (const npc of this.npcs) {
    const npcMeshDataHQ = MeshGenerator.createNPCMeshHQ(npc.data);
    this.renderer.createMesh(`npc_${npc.id}`, npcMeshDataHQ.vertices, npcMeshDataHQ.normals,
      npcMeshDataHQ.colors, npcMeshDataHQ.indices, npcMeshDataHQ.texcoords);
  }

  // Rebuild trees with higher segment count
  const rng = new SeededRandom(this.world.seed + 200);
  const treeTypes = ['oak', 'pine', 'palm', 'fruit'];
  for (const type of treeTypes) {
    for (let variant = 0; variant < 3; variant++) {
      const parts = MeshGenerator.createTree(type, rng);
      const meshParts = [];
      for (const part of parts) {
        const data = part.mesh;
        for (let i = 0; i < data.vertices.length; i += 3) {
          data.vertices[i] += (part.x || 0);
          data.vertices[i + 1] += (part.y || 0);
          data.vertices[i + 2] += (part.z || 0);
        }
        meshParts.push(data);
      }
      const merged = MeshGenerator.merge(meshParts);
      this.renderer.createMesh(`tree_${type}_${variant}`, merged.vertices, merged.normals,
        merged.colors, merged.indices, merged.texcoords);
    }
  }

  // HQ rock meshes
  for (let variant = 0; variant < 3; variant++) {
    const rockSize = 0.5 + rng.nextFloat(0, 0.5);
    const rockData = MeshGenerator.createSphereHQ(rockSize, 12, 0x888888);
    // Deform for rocky look
    for (let i = 0; i < rockData.vertices.length; i += 3) {
      const x = rockData.vertices[i], y = rockData.vertices[i + 1], z = rockData.vertices[i + 2];
      const n1 = Math.sin(x * 5.3 + z * 3.1) * 0.12 * rockSize;
      const n2 = Math.cos(y * 4.7 + x * 2.3) * 0.08 * rockSize;
      const n3 = Math.sin((x + y + z) * 6.0) * 0.05 * rockSize;
      rockData.vertices[i] += n1;
      rockData.vertices[i + 1] += n2 - rockSize * 0.12;
      rockData.vertices[i + 2] += n3;
      // Color variation
      const shade = 0.45 + Math.sin(x * 8 + z * 6) * 0.08 + Math.random() * 0.08;
      rockData.colors[i] = shade + 0.05;
      rockData.colors[i + 1] = shade + 0.02;
      rockData.colors[i + 2] = shade;
    }
    // Recalculate normals
    const norms = new Float32Array(rockData.normals.length).fill(0);
    for (let i = 0; i < rockData.indices.length; i += 3) {
      const i0 = rockData.indices[i] * 3, i1 = rockData.indices[i + 1] * 3, i2 = rockData.indices[i + 2] * 3;
      const ax = rockData.vertices[i1] - rockData.vertices[i0];
      const ay = rockData.vertices[i1 + 1] - rockData.vertices[i0 + 1];
      const az = rockData.vertices[i1 + 2] - rockData.vertices[i0 + 2];
      const bx = rockData.vertices[i2] - rockData.vertices[i0];
      const by = rockData.vertices[i2 + 1] - rockData.vertices[i0 + 1];
      const bz = rockData.vertices[i2 + 2] - rockData.vertices[i0 + 2];
      const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      norms[i0] += nx; norms[i0 + 1] += ny; norms[i0 + 2] += nz;
      norms[i1] += nx; norms[i1 + 1] += ny; norms[i1 + 2] += nz;
      norms[i2] += nx; norms[i2 + 1] += ny; norms[i2 + 2] += nz;
    }
    for (let i = 0; i < norms.length; i += 3) {
      const len = Math.sqrt(norms[i] ** 2 + norms[i + 1] ** 2 + norms[i + 2] ** 2) || 1;
      rockData.normals[i] = norms[i] / len;
      rockData.normals[i + 1] = norms[i + 1] / len;
      rockData.normals[i + 2] = norms[i + 2] / len;
    }
    this.renderer.createMesh(`rock_${variant}`, rockData.vertices, rockData.normals,
      rockData.colors, rockData.indices, rockData.texcoords);
  }

  // HQ flower meshes
  const flowerTypes = ['rose_red', 'tulip_yellow', 'pansy_white', 'cosmos_pink', 'lily_orange', 'hyacinth_blue'];
  for (const type of flowerTypes) {
    const def = ITEM_DB[type];
    const flowerData = MeshGenerator.createFlower(def.color, rng);
    this.renderer.createMesh(`flower_${type}`, flowerData.vertices, flowerData.normals,
      flowerData.colors, flowerData.indices, flowerData.texcoords);
  }

  // HQ building meshes with more details
  for (let i = 0; i < this.world.buildings.length; i++) {
    const b = this.world.buildings[i];
    const houseData = MeshGenerator.createHouseHQ(b.width, b.height, b.depth, b.wallColor, b.roofColor, b.type);
    this.renderer.createMesh(`building_${i}`, houseData.vertices, houseData.normals,
      houseData.colors, houseData.indices, houseData.texcoords);
  }

  console.log('[Part 2] HQ meshes rebuilt.');
};


// ============================================================
//  SECTION 27: ENHANCED BUILDING MESH GENERATOR
// ============================================================
MeshGenerator.createHouseHQ = function(width, height, depth, wallColor, roofColor, buildingType) {
  const parts = [];
  const hw = width / 2, hh = height / 2, hd = depth / 2;

  // Main walls
  parts.push(MeshGenerator.createBox(width, height, depth, wallColor));

  // Foundation
  const foundColor = MathUtils.colorLerp(wallColor, 0x666666, 0.5);
  const found = MeshGenerator.createBox(width + 0.3, 0.2, depth + 0.3, foundColor);
  for (let i = 0; i < found.vertices.length; i += 3) found.vertices[i + 1] -= hh + 0.1;
  parts.push(found);

  // Roof (more detailed - hip roof with ridge)
  const roofOverhang = 0.4;
  const roofH = height * 0.45;

  // Roof base (flat extension)
  const roofBase = MeshGenerator.createBox(width + roofOverhang * 2, 0.1, depth + roofOverhang * 2, MathUtils.colorLerp(roofColor, 0x000000, 0.2));
  for (let i = 0; i < roofBase.vertices.length; i += 3) roofBase.vertices[i + 1] += hh + 0.05;
  parts.push(roofBase);

  // Roof slopes (left and right)
  const roofL = MeshGenerator.createBox(width * 0.55 + roofOverhang, 0.08, depth + roofOverhang * 2, roofColor);
  for (let i = 0; i < roofL.vertices.length; i += 3) {
    const localX = roofL.vertices[i];
    roofL.vertices[i] -= width * 0.25;
    roofL.vertices[i + 1] += hh + roofH * 0.5 - Math.abs(localX) * (roofH / (width * 0.55));
    // Tilt
    roofL.vertices[i + 1] += localX * 0.8;
  }
  parts.push(roofL);

  const roofR = MeshGenerator.createBox(width * 0.55 + roofOverhang, 0.08, depth + roofOverhang * 2, roofColor);
  for (let i = 0; i < roofR.vertices.length; i += 3) {
    const localX = roofR.vertices[i];
    roofR.vertices[i] += width * 0.25;
    roofR.vertices[i + 1] += hh + roofH * 0.5 + Math.abs(localX) * (roofH / (width * 0.55));
    roofR.vertices[i + 1] -= localX * 0.8;
  }
  parts.push(roofR);

  // Roof ridge
  const ridge = MeshGenerator.createBox(0.15, 0.15, depth + roofOverhang * 1.5, MathUtils.colorLerp(roofColor, 0xffffff, 0.2));
  for (let i = 0; i < ridge.vertices.length; i += 3) ridge.vertices[i + 1] += hh + roofH - 0.05;
  parts.push(ridge);

  // Door
  const doorW = width * 0.22, doorH = height * 0.48;
  const door = MeshGenerator.createBox(doorW, doorH, 0.06, 0x6B4226);
  for (let i = 0; i < door.vertices.length; i += 3) { door.vertices[i + 1] -= hh - doorH / 2; door.vertices[i + 2] += hd + 0.04; }
  parts.push(door);

  // Door handle
  const handle = MeshGenerator.createSphereHQ(0.03, 6, 0xCCAA44);
  for (let i = 0; i < handle.vertices.length; i += 3) { handle.vertices[i] += doorW * 0.3; handle.vertices[i + 1] -= hh - doorH * 0.45; handle.vertices[i + 2] += hd + 0.08; }
  parts.push(handle);

  // Door frame
  const frameColor = MathUtils.colorLerp(wallColor, 0xffffff, 0.3);
  const frameT = MeshGenerator.createBox(doorW + 0.1, 0.06, 0.04, frameColor);
  for (let i = 0; i < frameT.vertices.length; i += 3) { frameT.vertices[i + 1] -= hh - doorH; frameT.vertices[i + 2] += hd + 0.05; }
  parts.push(frameT);
  const frameL2 = MeshGenerator.createBox(0.06, doorH, 0.04, frameColor);
  for (let i = 0; i < frameL2.vertices.length; i += 3) { frameL2.vertices[i] -= doorW / 2 - 0.02; frameL2.vertices[i + 1] -= hh - doorH / 2; frameL2.vertices[i + 2] += hd + 0.05; }
  parts.push(frameL2);
  const frameR2 = MeshGenerator.createBox(0.06, doorH, 0.04, frameColor);
  for (let i = 0; i < frameR2.vertices.length; i += 3) { frameR2.vertices[i] += doorW / 2 - 0.02; frameR2.vertices[i + 1] -= hh - doorH / 2; frameR2.vertices[i + 2] += hd + 0.05; }
  parts.push(frameR2);

  // Windows (with frames and shutters)
  const winPositions = [
    { x: -width * 0.3, side: 'front' },
    { x: width * 0.3, side: 'front' },
  ];

  for (const wp of winPositions) {
    const winW = width * 0.16, winH = height * 0.2;
    // Window glass
    const win = MeshGenerator.createBox(winW, winH, 0.04, 0xAADDFF);
    for (let i = 0; i < win.vertices.length; i += 3) {
      win.vertices[i] += wp.x;
      win.vertices[i + 1] += height * 0.06;
      win.vertices[i + 2] += hd + 0.04;
    }
    parts.push(win);

    // Window cross bar
    const crossH = MeshGenerator.createBox(winW, 0.025, 0.05, frameColor);
    for (let i = 0; i < crossH.vertices.length; i += 3) { crossH.vertices[i] += wp.x; crossH.vertices[i + 1] += height * 0.06; crossH.vertices[i + 2] += hd + 0.06; }
    parts.push(crossH);
    const crossV = MeshGenerator.createBox(0.025, winH, 0.05, frameColor);
    for (let i = 0; i < crossV.vertices.length; i += 3) { crossV.vertices[i] += wp.x; crossV.vertices[i + 1] += height * 0.06; crossV.vertices[i + 2] += hd + 0.06; }
    parts.push(crossV);

    // Window frame
    const wfT = MeshGenerator.createBox(winW + 0.08, 0.04, 0.05, frameColor);
    for (let i = 0; i < wfT.vertices.length; i += 3) { wfT.vertices[i] += wp.x; wfT.vertices[i + 1] += height * 0.06 + winH / 2 + 0.02; wfT.vertices[i + 2] += hd + 0.05; }
    parts.push(wfT);
    const wfB = MeshGenerator.createBox(winW + 0.12, 0.06, 0.08, frameColor);
    for (let i = 0; i < wfB.vertices.length; i += 3) { wfB.vertices[i] += wp.x; wfB.vertices[i + 1] += height * 0.06 - winH / 2 - 0.03; wfB.vertices[i + 2] += hd + 0.05; }
    parts.push(wfB);
  }

  // Side windows
  const sideWin = MeshGenerator.createBox(0.04, height * 0.18, depth * 0.14, 0xAADDFF);
  for (let i = 0; i < sideWin.vertices.length; i += 3) { sideWin.vertices[i] += hw + 0.03; sideWin.vertices[i + 1] += height * 0.06; }
  parts.push(sideWin);
  const sideWin2 = MeshGenerator.createBox(0.04, height * 0.18, depth * 0.14, 0xAADDFF);
  for (let i = 0; i < sideWin2.vertices.length; i += 3) { sideWin2.vertices[i] -= hw + 0.03; sideWin2.vertices[i + 1] += height * 0.06; }
  parts.push(sideWin2);

  // Chimney (for houses)
  if (buildingType === 'player_house' || buildingType === 'npc_house') {
    const chimney = MeshGenerator.createBox(0.5, 1.0, 0.5, MathUtils.colorLerp(roofColor, 0x553322, 0.5));
    for (let i = 0; i < chimney.vertices.length; i += 3) {
      chimney.vertices[i] += width * 0.25;
      chimney.vertices[i + 1] += hh + roofH * 0.6;
    }
    parts.push(chimney);
    // Chimney top
    const chimTop = MeshGenerator.createBox(0.6, 0.08, 0.6, MathUtils.colorLerp(roofColor, 0x333333, 0.5));
    for (let i = 0; i < chimTop.vertices.length; i += 3) {
      chimTop.vertices[i] += width * 0.25;
      chimTop.vertices[i + 1] += hh + roofH * 0.6 + 0.5;
    }
    parts.push(chimTop);
  }

  // Mailbox (for player house)
  if (buildingType === 'player_house') {
    const mailPost = MeshGenerator.createCylinderHQ(0.04, 0.04, 0.8, 6, 0x6B4226);
    for (let i = 0; i < mailPost.vertices.length; i += 3) { mailPost.vertices[i] += hw + 1.0; mailPost.vertices[i + 1] -= hh - 0.4; mailPost.vertices[i + 2] += hd + 0.5; }
    parts.push(mailPost);
    const mailBox = MeshGenerator.createBox(0.3, 0.25, 0.2, 0x3366CC);
    for (let i = 0; i < mailBox.vertices.length; i += 3) { mailBox.vertices[i] += hw + 1.0; mailBox.vertices[i + 1] -= hh - 0.9; mailBox.vertices[i + 2] += hd + 0.5; }
    parts.push(mailBox);
  }

  // Shop sign
  if (buildingType === 'shop') {
    const signBoard = MeshGenerator.createBox(1.8, 0.6, 0.08, 0xFFF8DC);
    for (let i = 0; i < signBoard.vertices.length; i += 3) { signBoard.vertices[i + 1] += hh + 0.3; signBoard.vertices[i + 2] += hd + 0.15; }
    parts.push(signBoard);
    const signFrame = MeshGenerator.createBox(1.9, 0.7, 0.05, 0x8B6914);
    for (let i = 0; i < signFrame.vertices.length; i += 3) { signFrame.vertices[i + 1] += hh + 0.3; signFrame.vertices[i + 2] += hd + 0.12; }
    parts.push(signFrame);
  }

  // Museum columns
  if (buildingType === 'museum') {
    const colPositions = [-width * 0.35, -width * 0.12, width * 0.12, width * 0.35];
    for (const cx of colPositions) {
      const col = MeshGenerator.createCylinderHQ(0.15, 0.18, height * 0.9, 12, 0xD4C5A0);
      for (let i = 0; i < col.vertices.length; i += 3) { col.vertices[i] += cx; col.vertices[i + 1] -= hh * 0.05; col.vertices[i + 2] += hd + 0.2; }
      parts.push(col);
      // Column capital
      const cap = MeshGenerator.createBox(0.4, 0.12, 0.4, 0xE0D5B5);
      for (let i = 0; i < cap.vertices.length; i += 3) { cap.vertices[i] += cx; cap.vertices[i + 1] += hh * 0.85; cap.vertices[i + 2] += hd + 0.2; }
      parts.push(cap);
      // Column base
      const base2 = MeshGenerator.createBox(0.4, 0.1, 0.4, 0xE0D5B5);
      for (let i = 0; i < base2.vertices.length; i += 3) { base2.vertices[i] += cx; base2.vertices[i + 1] -= hh; base2.vertices[i + 2] += hd + 0.2; }
      parts.push(base2);
    }
    // Pediment
    const pediment = MeshGenerator.createBox(width * 0.85, 0.08, 0.15, 0xD4C5A0);
    for (let i = 0; i < pediment.vertices.length; i += 3) {
      const lx = pediment.vertices[i];
      pediment.vertices[i + 1] += hh + 0.2 - Math.abs(lx) * 0.3;
      pediment.vertices[i + 2] += hd + 0.2;
    }
    parts.push(pediment);
  }

  // Steps
  const stepCount = 3;
  for (let s = 0; s < stepCount; s++) {
    const stepW = width * 0.4 + s * 0.2;
    const step = MeshGenerator.createBox(stepW, 0.1, 0.3, MathUtils.colorLerp(wallColor, 0x888888, 0.3));
    for (let i = 0; i < step.vertices.length; i += 3) {
      step.vertices[i + 1] -= hh + 0.05 - s * 0.1;
      step.vertices[i + 2] += hd + 0.15 + s * 0.3;
    }
    parts.push(step);
  }

  // Flower pots at door
  const potPositions = [-(doorW * 0.5 + 0.3), doorW * 0.5 + 0.3];
  for (const ppx of potPositions) {
    const pot = MeshGenerator.createCylinderHQ(0.1, 0.12, 0.15, 8, 0xCC6633);
    for (let i = 0; i < pot.vertices.length; i += 3) {
      pot.vertices[i] += ppx;
      pot.vertices[i + 1] -= hh - 0.08;
      pot.vertices[i + 2] += hd + 0.3;
    }
    parts.push(pot);
    const plant = MeshGenerator.createSphereHQ(0.1, 6, 0x44AA44);
    for (let i = 0; i < plant.vertices.length; i += 3) {
      plant.vertices[i] += ppx;
      plant.vertices[i + 1] -= hh - 0.22;
      plant.vertices[i + 2] += hd + 0.3;
    }
    parts.push(plant);
  }

  return MeshGenerator.merge(parts);
};


// ============================================================
//  SECTION 28: HIGH-DPI / RESOLUTION SCALING
// ============================================================
class ResolutionManager {
  constructor(renderer) {
    this.renderer = renderer;
    this.targetDPR = Math.min(window.devicePixelRatio || 1, 2.5);
    this.currentDPR = this.targetDPR;
    this.qualityLevel = 2; // 0=low, 1=medium, 2=high, 3=ultra
    this.adaptiveEnabled = true;
    this.targetFPS = 55;
    this.fpsHistory = [];
    this.fpsHistorySize = 30;
    this.adjustTimer = 0;
    this.adjustInterval = 2.0;
  }

  update(dt, fps) {
    if (!this.adaptiveEnabled) return;

    this.fpsHistory.push(fps);
    if (this.fpsHistory.length > this.fpsHistorySize) {
      this.fpsHistory.shift();
    }

    this.adjustTimer += dt;
    if (this.adjustTimer >= this.adjustInterval && this.fpsHistory.length >= 10) {
      this.adjustTimer = 0;
      const avgFPS = this.fpsHistory.reduce((a, b) => a + b, 0) / this.fpsHistory.length;

      if (avgFPS < this.targetFPS - 10 && this.currentDPR > 0.75) {
        // Reduce resolution
        this.currentDPR = Math.max(0.75, this.currentDPR - 0.25);
        this.applyResolution();
      } else if (avgFPS > this.targetFPS + 5 && this.currentDPR < this.targetDPR) {
        // Increase resolution
        this.currentDPR = Math.min(this.targetDPR, this.currentDPR + 0.15);
        this.applyResolution();
      }
    }
  }

  applyResolution() {
    const canvas = this.renderer.canvas;
    canvas.width = Math.floor(canvas.clientWidth * this.currentDPR);
    canvas.height = Math.floor(canvas.clientHeight * this.currentDPR);
    this.renderer.gl.viewport(0, 0, canvas.width, canvas.height);
    this.renderer.aspect = canvas.width / canvas.height;

    if (Game.postProcess) {
      Game.postProcess.resize(canvas.width, canvas.height);
    }
  }

  setQuality(level) {
    this.qualityLevel = level;
    switch (level) {
      case 0: // Low
        this.currentDPR = 0.75;
        CONFIG.RENDER_DISTANCE = 3;
        CONFIG.SHADOW_MAP_SIZE = 1024;
        if (Game.postProcess) {
          Game.postProcess.bloomEnabled = false;
          Game.postProcess.ssaoEnabled = false;
          Game.postProcess.fxaaEnabled = true;
        }
        break;
      case 1: // Medium
        this.currentDPR = 1.0;
        CONFIG.RENDER_DISTANCE = 4;
        CONFIG.SHADOW_MAP_SIZE = 1536;
        if (Game.postProcess) {
          Game.postProcess.bloomEnabled = true;
          Game.postProcess.ssaoEnabled = false;
          Game.postProcess.fxaaEnabled = true;
        }
        break;
      case 2: // High
        this.currentDPR = Math.min(window.devicePixelRatio || 1, 2.0);
        CONFIG.RENDER_DISTANCE = 5;
        CONFIG.SHADOW_MAP_SIZE = 2048;
        if (Game.postProcess) {
          Game.postProcess.bloomEnabled = true;
          Game.postProcess.ssaoEnabled = true;
          Game.postProcess.fxaaEnabled = true;
          Game.postProcess.vignetteEnabled = true;
        }
        break;
      case 3: // Ultra
        this.currentDPR = Math.min(window.devicePixelRatio || 1, 2.5);
        CONFIG.RENDER_DISTANCE = 6;
        CONFIG.SHADOW_MAP_SIZE = 4096;
        if (Game.postProcess) {
          Game.postProcess.bloomEnabled = true;
          Game.postProcess.ssaoEnabled = true;
          Game.postProcess.fxaaEnabled = true;
          Game.postProcess.vignetteEnabled = true;
          Game.postProcess.bloomPasses = 6;
          Game.postProcess.ssaoSamples = 24;
        }
        break;
    }
    this.applyResolution();
  }
}

// Integrate resolution manager into game update
const _origGameUpdate = Game.update;
Game.update = function(dt) {
  _origGameUpdate.call(this, dt);

  // Initialize resolution manager if needed
  if (!this.resolutionManager && this.renderer) {
    this.resolutionManager = new ResolutionManager(this.renderer);
    this.resolutionManager.setQuality(2); // Default: High
  }

  // Adaptive resolution
  if (this.resolutionManager) {
    const fps = 1.0 / Math.max(dt, 0.001);
    this.resolutionManager.update(dt, fps);
  }
};


// ============================================================
//  SECTION 29: FPS COUNTER & DEBUG INFO (optional)
// ============================================================
(function() {
  const fpsDiv = document.createElement('div');
  fpsDiv.id = 'fpsCounter';
  fpsDiv.style.cssText = `
    position: fixed; bottom: 210px; right: 24px; z-index: 9999;
    background: rgba(0,0,0,0.5); color: #0f0; font-family: monospace;
    font-size: 12px; padding: 6px 10px; border-radius: 6px;
    pointer-events: none; line-height: 1.5;
  `;
  document.body.appendChild(fpsDiv);

  let frameCount2 = 0;
  let lastFPSTime = performance.now();
  let displayFPS = 0;

  function updateFPS() {
    frameCount2++;
    const now = performance.now();
    if (now - lastFPSTime >= 1000) {
      displayFPS = frameCount2;
      frameCount2 = 0;
      lastFPSTime = now;

      const r = Game.renderer;
      const triCount = r ? r.triangleCount : 0;
      const drawCalls2 = r ? r.drawCalls : 0;
      const dpr = Game.resolutionManager ? Game.resolutionManager.currentDPR.toFixed(2) : '?';
      const res = r ? `${r.canvas.width}x${r.canvas.height}` : '?';

      fpsDiv.innerHTML = `FPS: ${displayFPS} | Tris: ${(triCount / 1000).toFixed(1)}k | Draws: ${drawCalls2}<br>Res: ${res} | DPR: ${dpr}`;
    }
    requestAnimationFrame(updateFPS);
  }
  updateFPS();
})();
