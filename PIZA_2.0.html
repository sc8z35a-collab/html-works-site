<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIZA経営シミュレーション</title>
<style>
/* ===== RESET & BASE ===== */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#fff;overflow:hidden;user-select:none;}
/* ===== MAIN LAYOUT ===== */
#game-container{width:100vw;height:100vh;position:relative;overflow:hidden;}
#top-bar{position:absolute;top:0;left:0;right:0;height:54px;background:linear-gradient(90deg,#16213e,#0f3460);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:100;border-bottom:2px solid #e94560;}
#top-bar .stat{display:flex;align-items:center;gap:6px;font-size:13px;background:rgba(0,0,0,.3);padding:4px 12px;border-radius:12px;}
#top-bar .stat .label{color:#aaa;font-size:11px;}
#top-bar .stat .val{color:#fff;font-weight:700;}
.money-val{color:#4ecca3!important;}
#day-timer{color:#e94560;font-weight:700;font-size:15px;}
#main-view{position:absolute;top:54px;bottom:0;left:0;right:0;display:flex;}
/* Shop View */
#shop-view{flex:1;position:relative;background:linear-gradient(180deg,#2a1a0a 0%,#3d2b1f 40%,#4a3728 100%);overflow:hidden;}
#shop-canvas{width:100%;height:100%;}
/* Right Panel */
#right-panel{width:340px;background:#16213e;border-left:2px solid #0f3460;display:flex;flex-direction:column;overflow:hidden;}
#panel-tabs{display:flex;background:#0f3460;flex-shrink:0;}
#panel-tabs .tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;}
#panel-tabs .tab:hover{background:rgba(255,255,255,.05);}
#panel-tabs .tab.active{border-bottom-color:#e94560;color:#e94560;}
#panel-content{flex:1;overflow-y:auto;padding:10px;}
#panel-content::-webkit-scrollbar{width:6px;}
#panel-content::-webkit-scrollbar-thumb{background:#e94560;border-radius:3px;}
/* Cards */
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-bottom:10px;transition:.2s;}
.card:hover{border-color:#e94560;}
.card h3{font-size:13px;color:#e94560;margin-bottom:6px;}
.card p{font-size:11px;color:#bbb;line-height:1.5;}
/* Buttons */
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:4px;}
.btn:hover{transform:translateY(-1px);filter:brightness(1.2);}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#e94560,#c23152);color:#fff;}
.btn-success{background:linear-gradient(135deg,#4ecca3,#38b28a);color:#fff;}
.btn-warning{background:linear-gradient(135deg,#f0a500,#d4940a);color:#fff;}
.btn-info{background:linear-gradient(135deg,#00b4d8,#0096c7);color:#fff;}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-block{width:100%;justify-content:center;padding:8px;}
/* Progress bars */
.prog-bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin:4px 0;}
.prog-fill{height:100%;border-radius:4px;transition:width .3s;}
.prog-fill.green{background:linear-gradient(90deg,#4ecca3,#38b28a);}
.prog-fill.red{background:linear-gradient(90deg,#e94560,#c23152);}
.prog-fill.blue{background:linear-gradient(90deg,#00b4d8,#0096c7);}
.prog-fill.yellow{background:linear-gradient(90deg,#f0a500,#d4940a);}
/* Staff list */
.staff-item{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:.2s;}
.staff-item:hover{background:rgba(233,69,96,.15);}
.staff-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
.staff-info{flex:1;}
.staff-info .name{font-size:12px;font-weight:600;}
.staff-info .role{font-size:10px;color:#aaa;}
.staff-info .boost{font-size:10px;color:#4ecca3;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s;}
.modal{background:#1a1a2e;border:2px solid #e94560;border-radius:16px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;animation:slideUp .3s;}
.modal h2{color:#e94560;margin-bottom:12px;font-size:18px;}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Phone */
#phone-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:none;align-items:center;justify-content:center;}
#phone{width:320px;height:600px;background:#111;border-radius:36px;border:3px solid #333;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#111;border-radius:0 0 18px 18px;z-index:5;}
#phone-screen{position:absolute;top:12px;bottom:12px;left:12px;right:12px;background:#1a1a2e;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;}
#phone-statusbar{height:32px;background:#0f3460;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:10px;flex-shrink:0;}
#phone-body{flex:1;overflow-y:auto;padding:12px;}
#phone-body::-webkit-scrollbar{width:4px;}
#phone-body::-webkit-scrollbar-thumb{background:#e94560;border-radius:2px;}
#phone-navbar{height:48px;background:#0f3460;display:flex;align-items:center;justify-content:space-around;flex-shrink:0;}
.phone-app-icon{width:52px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s;margin:6px;font-size:9px;gap:2px;}
.phone-app-icon:hover{transform:scale(1.1);}
.phone-app-icon .icon{font-size:24px;}
.phone-nav-btn{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:8px;}
.phone-nav-btn:hover{color:#fff;}
/* message bubbles */
.msg-bubble{max-width:80%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:12px;line-height:1.4;animation:slideUp .2s;}
.msg-bubble.sent{background:#e94560;color:#fff;margin-left:auto;border-bottom-right-radius:4px;}
.msg-bubble.recv{background:#2a2a4a;color:#ddd;margin-right:auto;border-bottom-left-radius:4px;}
/* Settings */
#settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:700;display:none;align-items:center;justify-content:center;}
#settings-panel{background:#1a1a2e;border:2px solid #e94560;border-radius:16px;padding:24px;width:500px;max-height:80vh;overflow-y:auto;}
/* Notifications */
#notif-container{position:fixed;top:60px;right:10px;z-index:400;display:flex;flex-direction:column;gap:6px;}
.notif{padding:10px 16px;border-radius:10px;font-size:12px;animation:slideIn .3s;pointer-events:none;}
.notif.success{background:#4ecca3;color:#fff;}
.notif.error{background:#e94560;color:#fff;}
.notif.info{background:#00b4d8;color:#fff;}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
/* Ingredient grid */
.ingr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.ingr-item{background:rgba(0,0,0,.2);border-radius:8px;padding:8px;font-size:11px;}
.ingr-item .iname{font-weight:600;margin-bottom:2px;}
.ingr-item .istock{color:#4ecca3;}
/* Upgrade items */
.upgrade-item{display:flex;align-items:center;justify-content:space-between;padding:8px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:6px;}
.upgrade-item .uinfo{flex:1;}
.upgrade-item .uname{font-size:12px;font-weight:600;}
.upgrade-item .ulevel{font-size:10px;color:#f0a500;}
/* Ad plans */
.ad-plan{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:4px;cursor:pointer;transition:.2s;}
.ad-plan:hover{background:rgba(233,69,96,.15);}
.ad-plan.selected{border:1px solid #e94560;}
/* Furniture */
.furn-item{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:6px;}
.furn-preview{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;}
/* Review */
.review-item{padding:8px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:6px;}
.review-stars{color:#f0a500;font-size:12px;}
.review-text{font-size:11px;color:#bbb;margin-top:4px;}
.review-author{font-size:10px;color:#888;margin-top:2px;}
/* Loan info */
.loan-box{background:rgba(233,69,96,.1);border:1px solid #e94560;border-radius:8px;padding:10px;margin-bottom:8px;}
/* Tooltip */
.tooltip{position:absolute;background:#0f3460;border:1px solid #e94560;padding:6px 10px;border-radius:6px;font-size:11px;z-index:300;pointer-events:none;}
/* Bottom action bar */
#bottom-bar{position:absolute;bottom:0;left:0;right:340px;height:48px;background:rgba(15,52,96,.95);display:flex;align-items:center;justify-content:center;gap:8px;z-index:50;border-top:1px solid rgba(233,69,96,.3);}
.bb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:4px;}
.bb-btn:hover{background:rgba(233,69,96,.3);border-color:#e94560;}
/* Animations for people */
@keyframes walkRight{0%{transform:translateX(-30px)}100%{transform:translateX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes cookAnim{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes smokeAnim{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-20px) scale(1.5)}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.2)}}
/* Delivery animation */
@keyframes deliveryGo{0%{left:50%}100%{left:110%}}
/* Customer walk */
@keyframes custWalkIn{0%{transform:translateX(-100%);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes custWalkOut{0%{transform:translateX(0);opacity:1}100%{transform:translateX(100%);opacity:0}}
/* Star rating display */
.stars-display{display:inline-flex;gap:1px;}
.star{color:#555;font-size:14px;}
.star.filled{color:#f0a500;}
.star.half{background:linear-gradient(90deg,#f0a500 50%,#555 50%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
/* Hire modal */
.hire-candidate{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.1);}
.hire-candidate:hover{border-color:#4ecca3;}
/* Tab sub-sections */
.section-title{font-size:12px;color:#e94560;font-weight:700;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid rgba(233,69,96,.3);}
/* input */
.game-input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;width:100%;}
.game-input:focus{outline:none;border-color:#e94560;}
select.game-input{appearance:none;cursor:pointer;}
/* Delivery panel */
.delivery-stat{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.05);}
/* Compact layout helpers */
.flex{display:flex;}.gap4{gap:4px;}.gap8{gap:8px;}.gap12{gap:12px;}
.aic{align-items:center;}.jcsb{justify-content:space-between;}
.mt4{margin-top:4px;}.mt8{margin-top:8px;}.mb4{margin-bottom:4px;}.mb8{margin-bottom:8px;}
.fs10{font-size:10px;}.fs11{font-size:11px;}.fs12{font-size:12px;}.fs13{font-size:13px;}
.c-gray{color:#999;}.c-green{color:#4ecca3;}.c-red{color:#e94560;}.c-yellow{color:#f0a500;}
.fw700{font-weight:700;}
/* day end overlay */
#day-end-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:800;display:none;align-items:center;justify-content:center;}
#day-end-panel{background:#1a1a2e;border:2px solid #f0a500;border-radius:16px;padding:30px;width:480px;text-align:center;}
#day-end-panel h2{color:#f0a500;font-size:22px;margin-bottom:16px;}
.day-stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;}
</style>

<!-- hw-mobile-shim: smartphone support injected by hub build -->
<style id="hw-mobile-shim-style">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas,img,svg,video{max-width:100%}
input,select,textarea{font-size:16px}
@media (pointer:coarse){button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}}
</style>
<script id="hw-mobile-shim-script">
(function(){
  function setVh(){document.documentElement.style.setProperty("--hw-vh",(window.innerHeight*0.01)+"px");}
  setVh();window.addEventListener("resize",setVh);window.addEventListener("orientationchange",setVh);
  document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
})();
</script>
</head>
<body>
<div id="game-container">
  <!-- TOP BAR -->
  <div id="top-bar">
    <div style="display:flex;gap:10px;align-items:center;">
      <span style="font-size:18px;font-weight:800;color:#e94560;">🍕 PIZA経営</span>
      <div class="stat"><span class="label">資金</span><span class="val money-val" id="money-display">¥45,000</span></div>
      <div class="stat"><span class="label">日</span><span class="val" id="day-display">1日目</span></div>
      <div class="stat" id="day-timer"><span class="label">残り</span><span class="val" id="timer-display">40:00</span></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="stat"><span class="label">客数</span><span class="val" id="cust-count">0</span></div>
      <div class="stat"><span class="label">売上</span><span class="val c-green" id="sales-display">¥0</span></div>
      <div class="stat"><span class="label">配達</span><span class="val" id="deliv-count">0</span></div>
      <div class="stat"><span class="label">評判</span><span class="val c-yellow" id="rep-display">★5.0</span></div>
      <button class="bb-btn" onclick="togglePhone()" title="携帯電話">📱</button>
      <button class="bb-btn" onclick="toggleSettings()" title="設定">⚙️</button>
    </div>
  </div>

  <!-- MAIN VIEW -->
  <div id="main-view">
    <div id="shop-view">
      <canvas id="shop-canvas"></canvas>
    </div>
    <div id="right-panel">
      <div id="panel-tabs">
        <div class="tab active" data-tab="staff" onclick="switchTab('staff')">👨‍🍳スタッフ</div>
        <div class="tab" data-tab="kitchen" onclick="switchTab('kitchen')">🔧調理器具</div>
        <div class="tab" data-tab="ingredients" onclick="switchTab('ingredients')">🧀具材</div>
        <div class="tab" data-tab="furniture" onclick="switchTab('furniture')">🪑家具</div>
        <div class="tab" data-tab="ads" onclick="switchTab('ads')">📢広告</div>
        <div class="tab" data-tab="delivery" onclick="switchTab('delivery')">🛵配達</div>
        <div class="tab" data-tab="finance" onclick="switchTab('finance')">💰財務</div>
      </div>
      <div id="panel-content"></div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div id="bottom-bar">
    <button class="bb-btn" onclick="openHireModal()">👤 スタッフ雇用</button>
    <button class="bb-btn" onclick="expandShop()">🏗️ 店舗拡張</button>
    <button class="bb-btn" onclick="togglePhone()">📱 携帯電話</button>
    <button class="bb-btn" onclick="showDaySummary()">📊 日次レポート</button>
    <button class="bb-btn" id="pause-btn" onclick="togglePause()">⏸️ 一時停止</button>
  </div>

  <!-- NOTIF -->
  <div id="notif-container"></div>

  <!-- PHONE -->
  <div id="phone-overlay" onclick="if(event.target===this)togglePhone()">
    <div id="phone">
      <div id="phone-notch"></div>
      <div id="phone-screen">
        <div id="phone-statusbar">
          <span>🔋 87%</span><span id="phone-time">12:00</span><span>📶 PIZA-NET</span>
        </div>
        <div id="phone-body"></div>
        <div id="phone-navbar">
          <button class="phone-nav-btn" onclick="phoneHome()">🏠</button>
          <button class="phone-nav-btn" onclick="phoneBack()">◀</button>
          <button class="phone-nav-btn" onclick="togglePhone()">✕</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="settings-overlay" onclick="if(event.target===this)toggleSettings()">
    <div id="settings-panel">
      <h2 style="color:#e94560;margin-bottom:16px;">⚙️ 設定</h2>
      <div id="settings-content"></div>
      <button class="btn btn-primary btn-block mt8" onclick="toggleSettings()">閉じる</button>
    </div>
  </div>

  <!-- DAY END -->
  <div id="day-end-overlay" onclick="if(event.target===this)closeDayEnd()">
    <div id="day-end-panel"></div>
  </div>
</div>

<script>
// ============================================
// PART 1: CORE GAME STATE & DATA
// ============================================

const GAME_DAY_MS = 40 * 60 * 1000; // 40 minutes
const MAX_CUSTOMERS_DAY = 5000;
const MAX_DELIVERIES_DAY = 20000;
const MAX_STAFF = 31; // 1 initial + 30
const MAX_INGREDIENT_STOCK = 300;
const MAX_EQUIP_LEVEL = 50;
const MAX_STAFF_LEVEL = 20;
const MAX_LOAN = 2000000;
const LOAN_INTEREST_RATE = 0.05;

// INGREDIENTS
const INGREDIENTS = [
  {id:'cheese',name:'チーズ',icon:'🧀',costPer:80,basePrice:120},
  {id:'tomato',name:'トマトソース',icon:'🍅',costPer:40,basePrice:60},
  {id:'pepperoni',name:'ペパロニ',icon:'🥓',costPer:100,basePrice:150},
  {id:'mushroom',name:'マッシュルーム',icon:'🍄',costPer:60,basePrice:90},
  {id:'olive',name:'オリーブ',icon:'🫒',costPer:70,basePrice:100},
  {id:'basil',name:'バジル',icon:'🌿',costPer:30,basePrice:50},
  {id:'onion',name:'オニオン',icon:'🧅',costPer:35,basePrice:55},
  {id:'pepper',name:'ピーマン',icon:'🫑',costPer:45,basePrice:70},
  {id:'ham',name:'ハム',icon:'🍖',costPer:110,basePrice:160},
  {id:'shrimp',name:'エビ',icon:'🦐',costPer:150,basePrice:220},
  {id:'corn',name:'コーン',icon:'🌽',costPer:30,basePrice:50},
  {id:'anchovy',name:'アンチョビ',icon:'🐟',costPer:120,basePrice:170},
  {id:'sausage',name:'ソーセージ',icon:'🌭',costPer:90,basePrice:130}
];

// EQUIPMENT
const EQUIPMENT = [
  {id:'oven',name:'かまど',icon:'🔥',baseCost:5000,desc:'ピザを焼く。レベルUPで焼き時間短縮&品質UP'},
  {id:'stove',name:'コンロ',icon:'♨️',baseCost:3000,desc:'ソース調理。レベルUPで効率UP'},
  {id:'prep_table',name:'調理台',icon:'🪵',baseCost:2000,desc:'具材準備。レベルUPで速度UP'},
  {id:'mixer',name:'ミキサー',icon:'🌀',baseCost:4000,desc:'生地作り。レベルUPで品質UP'},
  {id:'fridge',name:'冷蔵庫',icon:'❄️',baseCost:6000,desc:'具材保存。レベルUPで鮮度保持UP'},
  {id:'cutter',name:'ピザカッター',icon:'🔪',baseCost:1500,desc:'カット速度UP'},
  {id:'dishwasher',name:'食洗機',icon:'💧',baseCost:3500,desc:'回転率UP'}
];

// FURNITURE TYPES (4 types, 8 variants each, 5 grades)
const FURNITURE_TYPES = ['table','chair','decor','light'];
const FURNITURE_DATA = {
  table:{name:'テーブル',icon:'🪑',variants:[
    {name:'木製テーブル',style:2},{name:'大理石テーブル',style:5},{name:'ガラステーブル',style:4},{name:'和風テーブル',style:3},
    {name:'モダンテーブル',style:5},{name:'レトロテーブル',style:3},{name:'カフェテーブル',style:4},{name:'VIPテーブル',style:6}
  ]},
  chair:{name:'椅子',icon:'💺',variants:[
    {name:'木製椅子',style:2},{name:'革張り椅子',style:4},{name:'ソファ席',style:5},{name:'スツール',style:2},
    {name:'ベンチ',style:3},{name:'デザイナーチェア',style:5},{name:'リクライニング',style:4},{name:'VIPソファ',style:6}
  ]},
  decor:{name:'装飾',icon:'🖼️',variants:[
    {name:'観葉植物',style:3},{name:'壁画',style:4},{name:'花瓶',style:3},{name:'イタリア国旗',style:2},
    {name:'ネオンサイン',style:5},{name:'アンティーク時計',style:4},{name:'水槽',style:5},{name:'彫刻',style:6}

function fmt(n) { return '¥' + Math.floor(n).toLocaleString(); }
function fmtN(n) { return Math.floor(n).toLocaleString(); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function rand(min, max) { return min + Math.random() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function notify(msg, type='info') {
  const el = document.createElement('div');

function starsHTML(rating, maxStars=10) {
  let html = '<span class="stars-display">';
  for (let i = 1; i <= maxStars; i++) {
    html += `<span class="star ${i <= Math.floor(rating) ? 'filled' : (i - 0.5 <= rating ? 'half' : '')}">${i <= Math.floor(rating) ? '★' : (i - 0.5 <= rating ? '★' : '☆')}</span>`;
  }
  html += '</span>';
  return html;
}

// ============================================
// GAME LOGIC
// ============================================
function getEquipBonus(eqId) {
  const lv = G.equipment[eqId] || 1;
  return 1 + (lv - 1) * 0.04; // 4% per level
}

function getTotalEquipQuality() {
  let total = 0;
  EQUIPMENT.forEach(eq => { total += getEquipBonus(eq.id); });
  return total / EQUIPMENT.length;
}

function getStaffEfficiency() {
  if (G.staff.length === 0) return 0.5;
  let total = 0;
  let active = 0;
  G.staff.forEach(s => {
    if (!s.working) return;
    let eff = 0.5 + (s.level / MAX_STAFF_LEVEL) * 0.5;
    eff *= (s.stamina / s.maxStamina);
    if (s.trait === 'working_hard') eff *= 1.15;
    if (s.trait === 'lazy' && s.stamina < s.maxStamina * 0.4) eff *= 0.6;
    if (s.trait === 'perfectionist') eff *= 1.08;
    total += eff;
    active++;
  });
  return active > 0 ? total / active : 0.3;
}

function getFurnitureScore() {
  let totalGrade = 0, totalStyle = 0;
  G.furniture.forEach(f => {
    totalGrade += f.grade;
    totalStyle += f.style * GRADE_MULTIPLIER[f.grade];
  });
  return { grade: totalGrade, style: totalStyle, combined: totalGrade * 2 + totalStyle };
}

function getCustomerAttraction() {
  let base = 1;
  // Furniture bonus
  const fScore = getFurnitureScore();
  base += fScore.combined * 0.01;
  // Ad bonus
  if (G.activeAd) base += G.activeAd.reach * 0.01;
  // Reputation
  base *= (G.baseGRating / 5.0);
  if (G.kx2Subscribed && G.kx2Rating > 0) {
    base *= (G.kx2Rating / 10.0);
  }
  // Shop level
  base *= (1 + (G.shopLevel - 1) * 0.3);
  return base;
}

function calcPizzaPrice(toppingCount, toppingQuality) {
  let base = 600;
  base += toppingCount * 120;
  base *= (0.8 + toppingQuality * 0.4);
  base *= getTotalEquipQuality();
  base *= (0.9 + getStaffEfficiency() * 0.3);
  return Math.floor(base);
}

function calcPizzaCost(toppings) {
  let cost = 0;
  toppings.forEach(t => {
    const ing = INGREDIENTS.find(i => i.id === t);
    if (ing) cost += ing.costPer;
  });
  return cost;
}

function servePizza(customer) {
  const tCount = customer.toppings.length;
  const quality = getTotalEquipQuality();
  const price = calcPizzaPrice(tCount, quality);
  const cost = calcPizzaCost(customer.toppings);
  
  // Deduct ingredients
  let canServe = true;
  customer.toppings.forEach(t => {
    if (G.ingredients[t] <= 0) canServe = false;
  });
  if (!canServe) return false;
  
  customer.toppings.forEach(t => { G.ingredients[t]--; });
  
  const profit = price - cost;
  G.money += price;
  G.totalSalesToday += price;
  G.totalExpensesToday += cost;
  
  // Customer satisfaction
  let sat = 5;
  sat += (quality - 1) * 3;
  sat += (getStaffEfficiency() - 0.5) * 2;
  sat += getFurnitureScore().combined * 0.02;
  sat = clamp(sat, 1, 10);
  customer.satisfaction = sat;
  
  // レビュー投稿確率 (評判・来客数に応じて動的に変化)
  let reviewChance = 0.45;
  if (G.totalCustomersToday < 20) reviewChance = 0.7; // 初期は投稿率高め
  if (G.baseGReviews.length > 200) reviewChance = 0.35;
  // 極端に良い・悪い体験はレビューされやすい
  if (sat >= 8.5 || sat <= 2.5) reviewChance += 0.2;
  if (Math.random() < reviewChance) {
    addReview(sat, customer);
  }  
  return true;
}

function addReview(sat, customer) {
  const review = generateDetailedReview(sat, customer);
  G.baseGReviews.unshift(review);
  if (G.baseGReviews.length > 500) G.baseGReviews.pop();

  // レビュー数に応じた重み付き平均で評価更新
  if (G.baseGReviews.length > 0) {
    let weightedSum = 0, weightTotal = 0;
    G.baseGReviews.forEach((r, idx) => {
      const weight = 1 / (1 + idx * 0.05); // 新しいレビューほど影響大
      weightedSum += r.stars * weight;
      weightTotal += weight;
    });
    G.baseGRating = clamp(weightedSum / weightTotal, 1, 10);
  }
}

function generateDetailedReview(sat, customer) {
  // ===== 詳細な満足度スコア計算 =====
  const equipQ = getTotalEquipQuality();
  const staffEff = getStaffEfficiency();
  const furnScore = getFurnitureScore();
  const workingStaff = G.staff.filter(s => s.working);
  const avgStaffStamina = workingStaff.length > 0
    ? workingStaff.reduce((a, s) => a + s.stamina / s.maxStamina, 0) / workingStaff.length : 0.3;

  // 味スコア (設備と具材の質に依存)
  const tasteScore = clamp(
    2 + equipQ * 2.5 + staffEff * 1.5 + (customer.toppings.length >= 3 ? 1 : 0) + Math.random() * 1.5 - 0.5
  , 1, 10);

  // サービススコア (スタッフの質と体力に依存)
  const serviceScore = clamp(
    2 + staffEff * 3 + avgStaffStamina * 2
    + (workingStaff.length >= 5 ? 1 : workingStaff.length <= 1 ? -2 : 0)
    + Math.random() * 1.5 - 0.5
  , 1, 10);

  // 雰囲気スコア (家具に依存)
  const atmosScore = clamp(
    2 + furnScore.combined * 0.04 + G.shopLevel * 0.8 + Math.random() * 1.5 - 0.5
  , 1, 10);

  // 配達スコア
  const isDelivery = Math.random() < (G.deliveryEnabled ? 0.3 : 0);
  const delivScore = isDelivery ? clamp(
    4 + staffEff * 2 + equipQ + Math.random() * 2 - 0.5
  , 1, 10) : null;

  // 価格スコア (具材コストと販売価格の比率)
  const price = calcPizzaPrice(customer.toppings.length, equipQ);
  const cost = calcPizzaCost(customer.toppings);
  const priceRatio = price / Math.max(cost * 2.5, 1);
  const priceScore = clamp(
    priceRatio < 1.5 ? 8 : priceRatio < 2 ? 6.5 : priceRatio < 3 ? 5 : priceRatio < 4 ? 3.5 : 2
    + Math.random() * 1.5 - 0.5
  , 1, 10);

  // 総合スコア（重み付き）
  let overall = tasteScore * 0.35 + serviceScore * 0.2 + atmosScore * 0.15 + priceScore * 0.15;
  if (delivScore !== null) overall = overall * 0.85 + delivScore * 0.15;
  else overall += (tasteScore * 0.15);
  overall = clamp(Math.round(overall * 10) / 10, 1, 10);

  // 星 (整数化するが0.5刻みの表現も)
  const stars = clamp(Math.round(overall * 2) / 2, 1, 10);

  // ===== コメント生成 =====
  const comments = [];

  // 味コメント (必ず付く)
  if (tasteScore >= 8) comments.push(pick(REVIEW_COMMENTS.taste.great));
  else if (tasteScore >= 6) comments.push(pick(REVIEW_COMMENTS.taste.good));
  else if (tasteScore >= 4) comments.push(pick(REVIEW_COMMENTS.taste.mid));
  else if (tasteScore >= 2.5) comments.push(pick(REVIEW_COMMENTS.taste.bad));
  else comments.push(pick(REVIEW_COMMENTS.taste.terrible));

  // サービスコメント (70%の確率)
  if (Math.random() < 0.7) {
    if (serviceScore >= 7) comments.push(pick(REVIEW_COMMENTS.service.great));
    else if (serviceScore >= 4.5) comments.push(pick(REVIEW_COMMENTS.service.good));
    else comments.push(pick(REVIEW_COMMENTS.service.bad));
  }

  // 雰囲気コメント (50%の確率)
  if (Math.random() < 0.5) {
    if (atmosScore >= 7) comments.push(pick(REVIEW_COMMENTS.atmosphere.great));
    else if (atmosScore >= 4.5) comments.push(pick(REVIEW_COMMENTS.atmosphere.good));
    else comments.push(pick(REVIEW_COMMENTS.atmosphere.bad));
  }

  // 配達コメント
  if (isDelivery) {
    if (delivScore >= 7) comments.push(pick(REVIEW_COMMENTS.delivery.great));
    else if (delivScore >= 4.5) comments.push(pick(REVIEW_COMMENTS.delivery.good));
    else comments.push(pick(REVIEW_COMMENTS.delivery.bad));
  }

  // 価格コメント (40%の確率)
  if (Math.random() < 0.4) {
    if (priceScore >= 7) comments.push(pick(REVIEW_COMMENTS.price.great));
    else if (priceScore >= 4.5) comments.push(pick(REVIEW_COMMENTS.price.good));
    else comments.push(pick(REVIEW_COMMENTS.price.bad));
  }

  // リピート意向 (60%の確率)
  if (Math.random() < 0.6) {
    if (overall >= 7.5) comments.push(pick(REVIEW_COMMENTS.repeat.yes));
    else if (overall >= 4.5) comments.push(pick(REVIEW_COMMENTS.repeat.maybe));
    else comments.push(pick(REVIEW_COMMENTS.repeat.no));
  }

  // 総評 (30%の確率)
  if (Math.random() < 0.3) {
    if (overall >= 8) comments.push(pick(REVIEW_COMMENTS.overall.amazing));
    else if (overall >= 6) comments.push(pick(REVIEW_COMMENTS.overall.good));
    else if (overall >= 4) comments.push(pick(REVIEW_COMMENTS.overall.average));
    else comments.push(pick(REVIEW_COMMENTS.overall.poor));
  }

  // 注文内容の言及 (20%の確率)
  if (Math.random() < 0.2 && customer.toppings.length > 0) {
    const mentionedIng = INGREDIENTS.find(i => i.id === pick(customer.toppings));
    if (mentionedIng) {
      const ingComments = [
        `${mentionedIng.name}が特に${tasteScore >= 6 ? '美味しかった' : 'イマイチだった'}`,
        `${mentionedIng.name}トッピングを${tasteScore >= 6 ? '追加して正解！' : '選んだのは失敗だったかも'}`,
        `${mentionedIng.name}の${tasteScore >= 7 ? '品質が高い' : '鮮度が気になった'}`
      ];
      comments.push(pick(ingComments));
    }
  }

  const fullComment = comments.join(' ');

  // ===== レビュアー名生成 =====
  const reviewerName = pick(REVIEW_NAMES_FIRST) + pick(REVIEW_NAME_SUFFIX);
  const reviewerIcon = pick(REVIEWER_ICONS);

  // ===== 具材名リスト =====
  const orderedItems = customer.toppings
    .map(t => INGREDIENTS.find(i => i.id === t))
    .filter(Boolean)
    .map(i => i.icon + i.name);

  return {
    stars,
    comment: fullComment,
    author: reviewerName,
    authorIcon: reviewerIcon,
    time: getGameTimeStr(),
    day: G.day,
    tasteScore: Math.round(tasteScore * 10) / 10,
    serviceScore: Math.round(serviceScore * 10) / 10,
    atmosScore: Math.round(atmosScore * 10) / 10,
    priceScore: Math.round(priceScore * 10) / 10,
    delivScore: delivScore ? Math.round(delivScore * 10) / 10 : null,
    overallScore: overall,
    orderedItems,
    isDelivery,
    helpful: Math.floor(Math.random() * 20),
    verified: Math.random() < 0.7
  };
}

function miniScoreBadge(label, score) {
  const color = score >= 7 ? '#4ecca3' : score >= 4.5 ? '#f0a500' : '#e94560';
  return `<span style="font-size:8px;padding:1px 5px;border-radius:3px;background:${color}22;color:${color};border:1px solid ${color}44;">${label} ${score.toFixed(1)}</span>`;
}

function sortReviews(mode) {
  if (mode === 'new') G.baseGReviews.sort((a, b) => b.day - a.day || 0);
  else if (mode === 'high') G.baseGReviews.sort((a, b) => b.stars - a.stars);
  else if (mode === 'low') G.baseGReviews.sort((a, b) => a.stars - b.stars);

  if (G.phoneScreen === 'baseg') {
    renderBaseG(document.getElementById('phone-body'));
  }
}

function getGameTimeStr() {
  const elapsed = GAME_DAY_MS - G.dayTimeLeft;
  const gameMinutes = (elapsed / GAME_DAY_MS) * 14 * 60; // 9:00 - 23:00
  const h = Math.floor(9 + gameMinutes / 60);
  const m = Math.floor(gameMinutes % 60);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
}

function spawnDeliveryOrder() {
  if (G.totalDeliveriesToday >= MAX_DELIVERIES_DAY) return;
  if (!G.deliveryEnabled) return;

  const ds = G.deliverySystem;
  // 配達員が全員出払っていたらスポーン不可
  const availableDrivers = ds.drivers.filter(d => d.status === 'idle');
  if (availableDrivers.length === 0) return;

  // 利用可能な車両
  const availableVehicles = ds.vehicles.filter(v => v.status === 'idle');
  if (availableVehicles.length === 0) return;

  // エリアからランダム選択（アンロック済みのみ）
  const unlockedZones = ds.zones.filter(z => z.unlocked);
  if (unlockedZones.length === 0) return;

  // 需要に応じた重み付きランダム
  let demandTotal = 0;
  unlockedZones.forEach(z => demandTotal += z.demand);
  let pick_rand = Math.random() * demandTotal;
  let selectedZone = unlockedZones[0];
  for (const z of unlockedZones) {
    pick_rand -= z.demand;
    if (pick_rand <= 0) { selectedZone = z; break; }
  }

  // プロモーション効果
  let orderBoost = 1;
  let feeModifier = 1;
  ds.promotions.forEach(p => {
    if (p.id === 'free_delivery') { feeModifier = 0; orderBoost *= 1.5; }
    if (p.id === 'bundle_deal') orderBoost *= 1.8;
    if (p.id === 'rain_special') { orderBoost *= 1.3; feeModifier *= 1.3; }
    if (p.id === 'weekend_rush') orderBoost *= 1.6;
    if (p.id === 'loyalty_program') orderBoost *= 1.4;
    if (p.id === 'late_night') orderBoost *= 1.2;
    if (p.id === 'new_area') orderBoost *= 2.0;
  });

  // ピーク時ボーナス（ゲーム時間で判定）
  const gameTime = getGameTimeStr();
  const hour = parseInt(gameTime.split(':')[0]);
  const isPeak = (hour >= 11 && hour <= 13) || (hour >= 18 && hour <= 21);
  if (isPeak) {
    orderBoost *= 1.4;
    ds.peakHourBonus = true;
  } else {
    ds.peakHourBonus = false;
  }

  if (Math.random() > orderBoost * 0.3) return; // 確率フィルター

  const toppingCount = randInt(2, 6);
  const toppings = [];
  for (let i = 0; i < toppingCount; i++) {
    toppings.push(pick(INGREDIENTS).id);
  }
  const uniqueToppings = [...new Set(toppings)];

  // 具材チェック
  let canMake = true;
  uniqueToppings.forEach(t => { if (G.ingredients[t] <= 0) canMake = false; });
  if (!canMake) return;

  // 特急注文判定
  const isExpress = ds.expressEnabled && Math.random() < 0.25;
  const expressSurcharge = isExpress ? 300 : 0;

  // バッチ配達判定：同エリア配達中があれば相乗り
  const isBatch = ds.batchEnabled && ds.activeOrders.some(o => o.zone.id === selectedZone.id && o.progress < 0.3);

  // 複数ピザ注文 (1〜3枚)
  const pizzaCount = Math.random() < 0.3 ? randInt(2, 3) : 1;

  // 価格計算
  const pricePerPizza = calcPizzaPrice(uniqueToppings.length, getTotalEquipQuality());
  const totalPizzaPrice = pricePerPizza * pizzaCount;
  const costPerPizza = calcPizzaCost(uniqueToppings);
  const totalCost = costPerPizza * pizzaCount;

  // 配達料計算
  const baseFee = selectedZone.fee * feeModifier;
  const distanceFee = selectedZone.dist * 80;
  const totalDeliveryFee = Math.floor(baseFee + distanceFee + expressSurcharge);

  // 手間賃・チップ
  const handling = Math.floor(G.deliveryHandling * (1 + ds.level * 0.05));
  const tipBase = G.deliveryTip * (1 + ds.level * 0.1);
  // ドライバーの性格によるチップ変動
  const driver = pick(availableDrivers);
  let tipMultiplier = 1;
  if (driver.trait === 'friendly') tipMultiplier = 1.3;
  const driverTip = Math.floor(tipBase * tipMultiplier * (0.7 + Math.random() * 0.6));

  // 梱包コスト
  const pkg = PACKAGING_LEVELS[ds.packagingLevel - 1];
  const packagingCost = pkg.cost * pizzaCount;

  // 燃料コスト
  const vehicle = pick(availableVehicles);
  const fuelCost = Math.floor(vehicle.fuelCost * selectedZone.dist * 0.5);

  // 顧客支払い総額
  const customerPays = totalPizzaPrice + totalDeliveryFee;
  // 当店コスト
  const ourCosts = totalCost + handling + packagingCost + fuelCost + Math.floor(driver.salary / 100);
  // 純利益
  const netProfit = customerPays + driverTip - ourCosts;

  // 具材消費
  for (let p = 0; p < pizzaCount; p++) {
    uniqueToppings.forEach(t => {
      if (G.ingredients[t] > 0) G.ingredients[t]--;
    });
  }

  G.money += customerPays + driverTip;
  G.totalSalesToday += customerPays;
  G.totalExpensesToday += ourCosts;
  G.totalDeliveriesToday++;
  ds.completedToday++;
  ds.totalRevToday += customerPays;
  ds.totalTipsToday += driverTip;
  ds.totalFeesToday += totalDeliveryFee;

  // 配達時間計算
  let deliveryTime = ds.estimatedTimeBase * selectedZone.dist * 1000;
  deliveryTime /= vehicle.speed;
  if (driver.trait === 'speed_demon') deliveryTime *= 0.75;
  if (driver.trait === 'careful') deliveryTime *= 1.1;
  if (driver.trait === 'local_expert') deliveryTime *= 0.85;
  if (driver.trait === 'veteran') deliveryTime *= 0.9;
  if (driver.trait === 'newbie') deliveryTime *= 1.15;
  if (isExpress) deliveryTime *= 0.5;
  if (isBatch) deliveryTime *= 0.7;
  deliveryTime = Math.max(3000, deliveryTime);

  // 配達品質予測
  let qualityScore = pkg.quality;
  qualityScore *= (0.8 + getTotalEquipQuality() * 0.2);
  if (ds.trackingEnabled) qualityScore += 0.2;
  DELIVERY_UPGRADES.forEach(u => {
    if (u.unlocked) {
      if (u.id === 'insulated_bag') qualityScore += 0.3;
      if (u.id === 'weather_proof') qualityScore += 0.15;
    }
  });

  // ドライバー・車両を使用中に
  driver.status = 'delivering';
  driver.currentDelivery = Date.now();
  driver.deliveryCount++;
  driver.totalEarnings += driverTip;
  vehicle.status = 'delivering';
  vehicle.totalTrips++;
  vehicle.mileage += selectedZone.dist * 2;

  const order = {
    id: Date.now() + Math.random(),
    zone: selectedZone,
    driver: driver,
    vehicle: vehicle,
    toppings: uniqueToppings,
    pizzaCount,
    pricePerPizza,
    totalPrice: customerPays,
    deliveryFee: totalDeliveryFee,
    tip: driverTip,
    handling,
    packagingCost,
    fuelCost,
    netProfit,
    isExpress,
    isBatch,
    timer: deliveryTime,
    maxTimer: deliveryTime,
    progress: 0,
    qualityScore,
    status: 'preparing',
    customerName: pick(STAFF_LAST_NAMES) + pick(['さん','様']),
    customerAddress: selectedZone.name + ' ' + randInt(1, 30) + '-' + randInt(1, 15),
    orderTime: getGameTimeStr(),
    estimatedArrival: '',
    rating: 0
  };

  ds.activeOrders.push(order);
}

function purchaseVehicle(typeId) {
  const vType = VEHICLE_TYPES.find(v => v.id === typeId);
  if (!vType) return;
  if (G.money < vType.cost) return notify('資金不足', 'error');
  G.money -= vType.cost;
  G.deliverySystem.vehicles.push({
    id: Date.now() + Math.random(),
    type: vType.id,
    name: vType.name,
    icon: vType.icon,
    speed: vType.speed,
    capacity: vType.capacity,
    maintenance: vType.maintenance,
    fuelCost: vType.fuelCost,
    status: 'idle',
    condition: 100,
    totalTrips: 0,
    mileage: 0
  });
  notify(`${vType.icon} ${vType.name}を購入！`, 'success');
  renderPanel();
}

function hireDriver() {
  const ds = G.deliverySystem;
  if (ds.drivers.length >= ds.maxFleet) return notify('配達員上限です', 'error');
  const hireCost = 3000 + ds.drivers.length * 500;
  if (G.money < hireCost) return notify('資金不足', 'error');
  G.money -= hireCost;
  const d = createDeliveryDriver();
  ds.drivers.push(d);
  ds.fleetSize = ds.drivers.length;
  notify(`${d.traitIcon} ${d.name}を配達員として雇用！`, 'success');
  renderPanel();
}

function unlockDeliveryZone(zoneId) {
  const zone = G.deliverySystem.zones.find(z => z.id === zoneId);
  if (!zone || zone.unlocked) return;
  if (G.money < zone.unlockCost) return notify('資金不足', 'error');
  G.money -= zone.unlockCost;
  zone.unlocked = true;
  notify(`${zone.icon} ${zone.name}を配達エリアに追加！`, 'success');
  renderPanel();
}

function upgradePackaging() {
  const ds = G.deliverySystem;
  if (ds.packagingLevel >= 5) return notify('最大レベル', 'error');
  const next = PACKAGING_LEVELS[ds.packagingLevel];
  const cost = next.level * 8000;
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  ds.packagingLevel++;
  notify(`梱包を${PACKAGING_LEVELS[ds.packagingLevel - 1].name}にアップグレード！`, 'success');
  renderPanel();
}

function purchaseDeliveryUpgrade(upgradeId) {
  const ug = DELIVERY_UPGRADES.find(u => u.id === upgradeId);
  if (!ug || ug.unlocked) return;
  if (G.money < ug.cost) return notify('資金不足', 'error');
  G.money -= ug.cost;
  ug.unlocked = true;
  const ds = G.deliverySystem;
  if (upgradeId === 'tracking') ds.trackingEnabled = true;
  if (upgradeId === 'express') ds.expressEnabled = true;
  if (upgradeId === 'batch') ds.batchEnabled = true;
  if (upgradeId === 'auto_dispatch') ds.autoDispatch = true;
  notify(`${ug.icon} ${ug.name}を導入！`, 'success');
  renderPanel();
}

function activatePromo(promoId) {
  const promo = DELIVERY_PROMOS.find(p => p.id === promoId);
  if (!promo) return;
  if (G.money < promo.cost) return notify('資金不足', 'error');
  const ds = G.deliverySystem;
  if (ds.promotions.find(p => p.id === promoId)) return notify('すでに実施中', 'error');
  G.money -= promo.cost;
  ds.promotions.push({ ...promo, daysLeft: promo.duration });
  notify(`${promo.icon} ${promo.name}を開始！`, 'success');
  renderPanel();
}

function upgradeDeliverySystem() {
  const ds = G.deliverySystem;
  if (ds.level >= 10) return notify('最大レベル', 'error');
  const cost = (ds.level + 1) * 15000;
  if (G.money < cost) return notify('資金不足', 'error');

function processKX2Visit() {
  if (!G.kx2Subscribed) return;
  if (G.day - G.kx2LastVisitDay < 5) return;
  if (Math.random() > 0.5) return; // Not every eligible day
  
  G.kx2LastVisitDay = G.day;
  G.kx2Visits++;
  
  // Calculate KX2 rating (out of 20)
  let rating = 0;
  rating += clamp(G.avgFoodQuality * 1.5, 0, 6); // taste & texture: max 6
  rating += clamp(getFurnitureScore().combined * 0.03, 0, 5); // interior: max 5
  rating += clamp(getStaffEfficiency() * 4, 0, 4); // staff attitude: max 4
  rating += clamp((G.money > 0 ? 3 : 0) + (G.totalSalesAllTime > 100000 ? 2 : G.totalSalesAllTime > 50000 ? 1 : 0), 0, 5); // business: max 5
  
  G.kx2Rating = clamp(Math.round(rating * 10) / 10, 0, 20);
  
  G.expertEvals.push({
    day: G.day,
    rating: G.kx2Rating,
    comment: G.kx2Rating >= 15 ? '素晴らしい経営です' : G.kx2Rating >= 10 ? 'まだ改善の余地があります' : '要改善点が多いです'
  });
  
  notify(`KX2専門家が来店！評価: ${G.kx2Rating}/20`, G.kx2Rating >= 12 ? 'success' : 'info');
}

  const unlockedZones = ds.zones.filter(z => z.unlocked);
  if (unlockedZones.length === 0) return;

  // 需要に応じた重み付きランダム
  let demandTotal = 0;
  unlockedZones.forEach(z => demandTotal += z.demand);
  let pick_rand = Math.random() * demandTotal;
  let selectedZone = unlockedZones[0];
  for (const z of unlockedZones) {
    pick_rand -= z.demand;
    if (pick_rand <= 0) { selectedZone = z; break; }
  }

  // プロモーション効果
  let orderBoost = 1;
  let feeModifier = 1;
  ds.promotions.forEach(p => {
    if (p.id === 'free_delivery') { feeModifier = 0; orderBoost *= 1.5; }
    if (p.id === 'bundle_deal') orderBoost *= 1.8;
    if (p.id === 'rain_special') { orderBoost *= 1.3; feeModifier *= 1.3; }
    if (p.id === 'weekend_rush') orderBoost *= 1.6;
    if (p.id === 'loyalty_program') orderBoost *= 1.4;
    if (p.id === 'late_night') orderBoost *= 1.2;
    if (p.id === 'new_area') orderBoost *= 2.0;
  });

  // ピーク時ボーナス（ゲーム時間で判定）
  const gameTime = getGameTimeStr();
  const hour = parseInt(gameTime.split(':')[0]);
  const isPeak = (hour >= 11 && hour <= 13) || (hour >= 18 && hour <= 21);
  if (isPeak) {
    orderBoost *= 1.4;
    ds.peakHourBonus = true;
  } else {
    ds.peakHourBonus = false;
  }

  if (Math.random() > orderBoost * 0.3) return; // 確率フィルター

  const toppingCount = randInt(2, 6);
  const toppings = [];
  for (let i = 0; i < toppingCount; i++) {
    toppings.push(pick(INGREDIENTS).id);
  }
  const uniqueToppings = [...new Set(toppings)];

  // 具材チェック
  let canMake = true;
  uniqueToppings.forEach(t => { if (G.ingredients[t] <= 0) canMake = false; });
  if (!canMake) return;

  // 特急注文判定
  const isExpress = ds.expressEnabled && Math.random() < 0.25;
  const expressSurcharge = isExpress ? 300 : 0;

  // バッチ配達判定：同エリア配達中があれば相乗り
  const isBatch = ds.batchEnabled && ds.activeOrders.some(o => o.zone.id === selectedZone.id && o.progress < 0.3);

  // 複数ピザ注文 (1〜3枚)
  const pizzaCount = Math.random() < 0.3 ? randInt(2, 3) : 1;

  // 価格計算
  const pricePerPizza = calcPizzaPrice(uniqueToppings.length, getTotalEquipQuality());
  const totalPizzaPrice = pricePerPizza * pizzaCount;
  const costPerPizza = calcPizzaCost(uniqueToppings);
  const totalCost = costPerPizza * pizzaCount;

  // 配達料計算
  const baseFee = selectedZone.fee * feeModifier;
  const distanceFee = selectedZone.dist * 80;
  const totalDeliveryFee = Math.floor(baseFee + distanceFee + expressSurcharge);

  // 手間賃・チップ
  const handling = Math.floor(G.deliveryHandling * (1 + ds.level * 0.05));
  const tipBase = G.deliveryTip * (1 + ds.level * 0.1);
  // ドライバーの性格によるチップ変動
  const driver = pick(availableDrivers);
  let tipMultiplier = 1;
  if (driver.trait === 'friendly') tipMultiplier = 1.3;
  const driverTip = Math.floor(tipBase * tipMultiplier * (0.7 + Math.random() * 0.6));

  // 梱包コスト
  const pkg = PACKAGING_LEVELS[ds.packagingLevel - 1];
  const packagingCost = pkg.cost * pizzaCount;

  // 燃料コスト
  const vehicle = pick(availableVehicles);
  const fuelCost = Math.floor(vehicle.fuelCost * selectedZone.dist * 0.5);

  // 顧客支払い総額
  const customerPays = totalPizzaPrice + totalDeliveryFee;
  // 当店コスト
  const ourCosts = totalCost + handling + packagingCost + fuelCost + Math.floor(driver.salary / 100);
  // 純利益
  const netProfit = customerPays + driverTip - ourCosts;

  // 具材消費
  for (let p = 0; p < pizzaCount; p++) {
    uniqueToppings.forEach(t => {
      if (G.ingredients[t] > 0) G.ingredients[t]--;
    });
  }

  G.money += customerPays + driverTip;
  G.totalSalesToday += customerPays;
  G.totalExpensesToday += ourCosts;
  G.totalDeliveriesToday++;
  ds.completedToday++;
  ds.totalRevToday += customerPays;
  ds.totalTipsToday += driverTip;
  ds.totalFeesToday += totalDeliveryFee;

  // 配達時間計算
  let deliveryTime = ds.estimatedTimeBase * selectedZone.dist * 1000;
  deliveryTime /= vehicle.speed;
  if (driver.trait === 'speed_demon') deliveryTime *= 0.75;
  if (driver.trait === 'careful') deliveryTime *= 1.1;
  if (driver.trait === 'local_expert') deliveryTime *= 0.85;
  if (driver.trait === 'veteran') deliveryTime *= 0.9;
  if (driver.trait === 'newbie') deliveryTime *= 1.15;
  if (isExpress) deliveryTime *= 0.5;
  if (isBatch) deliveryTime *= 0.7;
  deliveryTime = Math.max(3000, deliveryTime);

  // 配達品質予測
  let qualityScore = pkg.quality;
  qualityScore *= (0.8 + getTotalEquipQuality() * 0.2);
  if (ds.trackingEnabled) qualityScore += 0.2;
  DELIVERY_UPGRADES.forEach(u => {
    if (u.unlocked) {
      if (u.id === 'insulated_bag') qualityScore += 0.3;
      if (u.id === 'weather_proof') qualityScore += 0.15;
    }
  });

  // ドライバー・車両を使用中に
  driver.status = 'delivering';
  driver.currentDelivery = Date.now();
  driver.deliveryCount++;
  driver.totalEarnings += driverTip;
  vehicle.status = 'delivering';
  vehicle.totalTrips++;
  vehicle.mileage += selectedZone.dist * 2;

  const order = {
    id: Date.now() + Math.random(),
    zone: selectedZone,
    driver: driver,
    vehicle: vehicle,
    toppings: uniqueToppings,
    pizzaCount,
    pricePerPizza,
    totalPrice: customerPays,
    deliveryFee: totalDeliveryFee,
    tip: driverTip,
    handling,
    packagingCost,
    fuelCost,
    netProfit,
    isExpress,
    isBatch,
    timer: deliveryTime,
    maxTimer: deliveryTime,
    progress: 0,
    qualityScore,
    status: 'preparing',
    customerName: pick(STAFF_LAST_NAMES) + pick(['さん','様']),
    customerAddress: selectedZone.name + ' ' + randInt(1, 30) + '-' + randInt(1, 15),
    orderTime: getGameTimeStr(),
    estimatedArrival: '',
    rating: 0
  };

  ds.activeOrders.push(order);
}

function createDeliveryDriver(forceIdx) {
  const ds = G.deliverySystem;
  const fname = DRIVER_FIRST_NAMES[forceIdx !== undefined ? forceIdx : Math.floor(Math.random() * DRIVER_FIRST_NAMES.length)];
  const lname = pick(STAFF_LAST_NAMES);
  const traitData = pick(DRIVER_TRAITS);
  return {
    id: Date.now() + Math.random(),
    name: lname + ' ' + fname,
    trait: traitData.id,
    traitName: traitData.name,
    traitIcon: traitData.icon,
    traitEffect: traitData.effect,
    level: 1,
    exp: 0,
    expToNext: 80,
    maxLevel: 15,
    salary: 2000 + Math.floor(Math.random() * 1500),
    status: 'idle',
    stamina: 80 + Math.random() * 20,
    maxStamina: 80 + Math.random() * 20,
    deliveryCount: 0,
    totalEarnings: 0,
    rating: 5.0,
    ratingCount: 0,
    currentDelivery: null,
    color: `hsl(${Math.floor(Math.random() * 360)},55%,55%)`
  };
}

function purchaseVehicle(typeId) {
  const vType = VEHICLE_TYPES.find(v => v.id === typeId);
  if (!vType) return;
  if (G.money < vType.cost) return notify('資金不足', 'error');
  G.money -= vType.cost;
  G.deliverySystem.vehicles.push({
    id: Date.now() + Math.random(),
    type: vType.id,
    name: vType.name,
    icon: vType.icon,
    speed: vType.speed,
    capacity: vType.capacity,
    maintenance: vType.maintenance,
    fuelCost: vType.fuelCost,
    status: 'idle',
    condition: 100,
    totalTrips: 0,
    mileage: 0
  });
  notify(`${vType.icon} ${vType.name}を購入！`, 'success');
  renderPanel();
}

function hireDriver() {
  const ds = G.deliverySystem;
  if (ds.drivers.length >= ds.maxFleet) return notify('配達員上限です', 'error');
  const hireCost = 3000 + ds.drivers.length * 500;
  if (G.money < hireCost) return notify('資金不足', 'error');
  G.money -= hireCost;
  const d = createDeliveryDriver();
  ds.drivers.push(d);
  ds.fleetSize = ds.drivers.length;
  notify(`${d.traitIcon} ${d.name}を配達員として雇用！`, 'success');
  renderPanel();
}

function unlockDeliveryZone(zoneId) {
  const zone = G.deliverySystem.zones.find(z => z.id === zoneId);
  if (!zone || zone.unlocked) return;
  if (G.money < zone.unlockCost) return notify('資金不足', 'error');
  G.money -= zone.unlockCost;
  zone.unlocked = true;
  notify(`${zone.icon} ${zone.name}を配達エリアに追加！`, 'success');
  renderPanel();
}

function upgradePackaging() {
  const ds = G.deliverySystem;
  if (ds.packagingLevel >= 5) return notify('最大レベル', 'error');
  const next = PACKAGING_LEVELS[ds.packagingLevel];
  const cost = next.level * 8000;
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  ds.packagingLevel++;
  notify(`梱包を${PACKAGING_LEVELS[ds.packagingLevel - 1].name}にアップグレード！`, 'success');
  renderPanel();
}

function purchaseDeliveryUpgrade(upgradeId) {
  const ug = DELIVERY_UPGRADES.find(u => u.id === upgradeId);
  if (!ug || ug.unlocked) return;
  if (G.money < ug.cost) return notify('資金不足', 'error');
  G.money -= ug.cost;
  ug.unlocked = true;
  const ds = G.deliverySystem;
  if (upgradeId === 'tracking') ds.trackingEnabled = true;
  if (upgradeId === 'express') ds.expressEnabled = true;
  if (upgradeId === 'batch') ds.batchEnabled = true;
  if (upgradeId === 'auto_dispatch') ds.autoDispatch = true;
  notify(`${ug.icon} ${ug.name}を導入！`, 'success');
  renderPanel();
}

function activatePromo(promoId) {
  const promo = DELIVERY_PROMOS.find(p => p.id === promoId);
  if (!promo) return;
  if (G.money < promo.cost) return notify('資金不足', 'error');
  const ds = G.deliverySystem;
  if (ds.promotions.find(p => p.id === promoId)) return notify('すでに実施中', 'error');
  G.money -= promo.cost;
  ds.promotions.push({ ...promo, daysLeft: promo.duration });
  notify(`${promo.icon} ${promo.name}を開始！`, 'success');
  renderPanel();
}

function upgradeDeliverySystem() {
  const ds = G.deliverySystem;
  if (ds.level >= 10) return notify('最大レベル', 'error');
  const cost = (ds.level + 1) * 15000;
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  ds.level++;
  ds.estimatedTimeBase = Math.max(8, 20 - ds.level * 1.2);
  notify(`配達システムをLv.${ds.level}にアップグレード！`, 'success');
  renderPanel();
}

function fireDriver(idx) {
  const ds = G.deliverySystem;
  if (ds.drivers[idx].status === 'delivering') return notify('配達中は解雇できません', 'error');
  const name = ds.drivers[idx].name;
  ds.drivers.splice(idx, 1);
  ds.fleetSize = ds.drivers.length;
  notify(`${name}を解雇`, 'info');
  renderPanel();
}

function repairVehicle(idx) {
  const v = G.deliverySystem.vehicles[idx];
  const cost = Math.floor((100 - v.condition) * v.maintenance * 0.05);
  if (cost <= 0) return notify('修理不要です', 'info');
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  v.condition = 100;
  notify(`${v.icon} ${v.name}を修理 (${fmt(cost)})`, 'success');
  renderPanel();
}

function sellVehicle(idx) {
  const v = G.deliverySystem.vehicles[idx];
  if (v.status === 'delivering') return notify('使用中は売却不可', 'error');
  const vType = VEHICLE_TYPES.find(t => t.id === v.type);
  const sellPrice = Math.floor(vType.cost * 0.4 * (v.condition / 100));
  G.money += sellPrice;
  G.deliverySystem.vehicles.splice(idx, 1);
  notify(`${v.icon} ${v.name}を売却 (+${fmt(sellPrice)})`, 'info');
  renderPanel();
}

 // 配達システム日次処理
  if (G.deliveryEnabled) {

  G.totalSalesAllTime += G.totalSalesToday;

  processKX2Visit();

function gameLoop() {
  const now = Date.now();
  const dt = now - G.lastTick;
  G.lastTick = now;
  
  if (!G.paused) {
    G.dayTimeLeft -= dt;
    if (G.dayTimeLeft <= 0) {
      G.dayTimeLeft = 0;
      endDay();
    }
    
    G.animFrame++;
    
    // Customer spawning
    const attraction = getCustomerAttraction();
    const spawnRate = 2000 / attraction; // ms between spawns
    G.customerSpawnAccum += dt;
    while (G.customerSpawnAccum >= spawnRate && G.totalCustomersToday < MAX_CUSTOMERS_DAY) {
      G.customerSpawnAccum -= spawnRate;
      if (G.customersInShop.length < 20 + G.shopLevel * 5) {
        spawnCustomer();
      }
    }
    
    // Delivery spawning
    if (G.deliveryEnabled) {
      const delivRate = 5000 / attraction;
      G.deliverySpawnAccum += dt;
      while (G.deliverySpawnAccum >= delivRate && G.totalDeliveriesToday < MAX_DELIVERIES_DAY) {
        G.deliverySpawnAccum -= delivRate;
        spawnDeliveryOrder();
      }
    }
    
    // Update customers
    for (let i = G.customersInShop.length - 1; i >= 0; i--) {
      const c = G.customersInShop[i];
      c.timer += dt;
      c.walkFrame += dt * 0.005;
      
      if (c.entering) {
        c.x += (c.targetX - c.x) * 0.05;
        if (Math.abs(c.x - c.targetX) < 2) {
          c.entering = false;
        }
      }
      
      if (!c.served && !c.entering && c.timer > 2000) {
        if (servePizza(c)) {
          c.served = true;
          c.timer = 0;
        } else {
          // Can't serve - out of ingredients
          c.leaving = true;
          c.satisfaction = 1;
          if (Math.random() < 0.5) addReview(1, c);
        }
      }
      
      if (c.served && c.timer > 3000) {
        c.leaving = true;
      }
      
      if (c.leaving) {
        c.x += 4;
        if (c.x > 600) {
          G.customersInShop.splice(i, 1);
        }
      }
    }
    
    // ---- Update deliveries (大型配達システム) ----
    if (G.deliveryEnabled) {
      const ds = G.deliverySystem;
      for (let i = ds.activeOrders.length - 1; i >= 0; i--) {
        const order = ds.activeOrders[i];
        order.timer -= dt;
        order.progress = clamp(1 - (order.timer / order.maxTimer), 0, 1);

        // ステータス遷移
        if (order.progress < 0.15) order.status = 'preparing';
        else if (order.progress < 0.85) order.status = 'delivering';
        else if (order.progress < 1) order.status = 'arriving';

        // 完了処理
        if (order.timer <= 0) {
          order.status = 'completed';

          // 配達品質に基づく評価
          let rating = 3 + order.qualityScore * 1.5 + Math.random() * 1.5;
          if (order.isExpress) rating += 0.5;
          const pkg = PACKAGING_LEVELS[ds.packagingLevel - 1];
          if (pkg.keepWarm) rating += 0.3;
          rating = clamp(Math.round(rating * 10) / 10, 1, 10);
          order.rating = rating;

          // ドライバー経験・評価更新
          const driver = order.driver;
          driver.status = 'idle';
          driver.currentDelivery = null;
          driver.exp += 15 + order.zone.dist * 5;
          if (driver.exp >= driver.expToNext && driver.level < driver.maxLevel) {
            driver.level++;
            driver.exp = 0;
            driver.expToNext = driver.level * 100;
            driver.maxStamina += 3;
            notify(`🛵 ${driver.name}がLv.${driver.level}に！`, 'success');
          }
          driver.ratingCount++;
          driver.rating = ((driver.rating * (driver.ratingCount - 1)) + rating) / driver.ratingCount;
          driver.stamina = clamp(driver.stamina - order.zone.dist * 3, 0, driver.maxStamina);

          // 車両更新
          const vehicle = order.vehicle;
          vehicle.status = 'idle';
          vehicle.condition = clamp(vehicle.condition - order.zone.dist * 0.5, 0, 100);

          // 統計更新
          ds.stats.totalDelivered++;
          ds.stats.totalTips += order.tip;
          ds.stats.ratingCount++;
          ds.stats.avgRating = ((ds.stats.avgRating * (ds.stats.ratingCount - 1)) + rating) / ds.stats.ratingCount;
          if (ds.completedToday > ds.stats.bestDay) ds.stats.bestDay = ds.completedToday;

          // 配達レビュー（BASE Gへも反映）
          if (Math.random() < 0.25) {
            addReview(rating, { toppings: order.toppings, satisfaction: rating });
          }

          ds.activeOrders.splice(i, 1);
        }
      }

      // ドライバーの体力回復（アイドル時）
      ds.drivers.forEach(d => {
        if (d.status === 'idle') {
          d.stamina = clamp(d.stamina + dt * 0.002, 0, d.maxStamina);
        }
      });
    }

    // 旧配達キュー互換（古いsave対応）
    for (let i = G.deliveriesQueue.length - 1; i >= 0; i--) {
      G.deliveriesQueue[i].timer -= dt;
      if (G.deliveriesQueue[i].timer <= 0) G.deliveriesQueue.splice(i, 1);
    }    
    // Staff stamina drain
    G.staff.forEach(s => {
      if (s.working) {
        let drain = 0.001 * dt / 1000;
        if (s.trait === 'working_hard') drain *= 1.2;
        if (s.trait === 'lazy') drain *= 0.7;
        s.stamina = clamp(s.stamina - drain * s.maxStamina, 0, s.maxStamina);
        
        // Lazy staff might slack off
        if (s.trait === 'lazy' && s.stamina < s.maxStamina * 0.3 && Math.random() < 0.0001) {
          s.working = false;
          notify(`${s.name}がサボり始めた！`, 'error');
        }
        
        // EXP gain
        s.exp += dt * 0.005;
        if (s.exp >= s.expToNext && s.level < (G.staffLimitBreak ? 30 : MAX_STAFF_LEVEL)) {
          s.level++;
          s.exp = 0;
          s.expToNext = s.level * 120;
          s.maxStamina += 2;
          s.stamina = s.maxStamina;
          notify(`${s.name}がLv.${s.level}に上がった！`, 'success');
        }
      }
    });
    
    // Smoke particles
    if (G.animFrame % 30 === 0) {
      G.smokeParticles.push({
        x: 120 + Math.random() * 20,
        y: 100,
        life: 60,
        size: 3 + Math.random() * 4
      });
    }
    for (let i = G.smokeParticles.length - 1; i >= 0; i--) {
      G.smokeParticles[i].y -= 0.3;
      G.smokeParticles[i].life--;
      G.smokeParticles[i].size += 0.05;
      if (G.smokeParticles[i].life <= 0) G.smokeParticles.splice(i, 1);
    }
  }
  
  renderShop();
  updateTopBar();
  requestAnimationFrame(gameLoop);
}

// CANVAS RENDERING
const canvas = document.getElementById('shop-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
}
window.addEventListener('resize', resizeCanvas);

function renderShop() {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = canvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, W, H);
  
  // Background - Floor
  const floorGrad = ctx.createLinearGradient(0, H * 0.4, 0, H);
  floorGrad.addColorStop(0, '#5c4033');
  floorGrad.addColorStop(1, '#3e2723');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, H * 0.4, W, H * 0.6);
  
  // Floor tiles
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, H*0.4); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = H * 0.4; y < H; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  
  // Wall
  const wallGrad = ctx.createLinearGradient(0, 0, 0, H * 0.4);
  wallGrad.addColorStop(0, '#8B4513');
  wallGrad.addColorStop(0.5, '#A0522D');
  wallGrad.addColorStop(1, '#6B3410');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 0, W, H * 0.4);
  
  // Wall bricks
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  for (let row = 0; row < 6; row++) {
    const yy = row * (H * 0.4 / 6);
    const offset = row % 2 === 0 ? 0 : 35;
    for (let x = offset; x < W; x += 70) {
      ctx.strokeRect(x, yy, 70, H * 0.4 / 6);
    }
  }
  
  // Kitchen area (left side)
  drawKitchen(W, H);
  
  // Counter
  ctx.fillStyle = '#4a3728';
  ctx.fillRect(W * 0.3 - 5, H * 0.35, 10, H * 0.3);
  ctx.fillStyle = '#6B4226';
  ctx.fillRect(W * 0.05, H * 0.35, W * 0.25, 12);
  
  // Dining area (right side)
  drawDiningArea(W, H);
  
  // Furniture
  drawFurniture(W, H);
  
  // Staff in kitchen
  drawStaff(W, H);
  
  // Customers
  drawCustomers(W, H);
  
  // Smoke from oven
  drawSmoke(W, H);
  
  // Delivery bike (if enabled)
  if (G.deliveryEnabled && G.deliveriesQueue.length > 0) {
    drawDeliveryBike(W, H);
  }
  
  // Shop sign
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🍕 PIZA', W * 0.5, 25);
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#ddd';
  ctx.fillText(`Lv.${G.shopLevel} ・ スタッフ${G.staff.filter(s=>s.working).length}人`, W * 0.5, 42);
  ctx.textAlign = 'left';
}

function drawKitchen(W, H) {
  const kx = 20, ky = H * 0.15, kw = W * 0.25, kh = H * 0.55;
  
  // Oven (かまど)
  const ovenLv = G.equipment.oven || 1;
  ctx.fillStyle = '#444';
  ctx.fillRect(kx, ky, 70, 55);
  ctx.fillStyle = '#333';
  ctx.fillRect(kx + 5, ky + 5, 60, 35);
  // Fire inside oven
  const fireIntensity = 0.5 + Math.sin(G.animFrame * 0.1) * 0.3;
  ctx.fillStyle = `rgba(255,${100 + ovenLv * 3},0,${fireIntensity})`;
  ctx.fillRect(kx + 10, ky + 15, 50, 20);
  ctx.fillStyle = `rgba(255,200,0,${fireIntensity * 0.7})`;
  ctx.fillRect(kx + 15, ky + 20, 40, 10);
  ctx.fillStyle = '#aaa';
  ctx.font = '8px sans-serif';
  ctx.fillText(`かまど Lv.${ovenLv}`, kx, ky + 65);
  
  // Stove (コンロ)
  const stoveLv = G.equipment.stove || 1;
  ctx.fillStyle = '#555';
  ctx.fillRect(kx + 80, ky, 55, 45);
  // Burner
  const burnColor = stoveLv > 25 ? '#00aaff' : '#ff6600';
  ctx.beginPath();
  ctx.arc(kx + 107, ky + 22, 12, 0, Math.PI * 2);
  ctx.fillStyle = burnColor;
  ctx.globalAlpha = 0.4 + Math.sin(G.animFrame * 0.15) * 0.2;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#aaa';
  ctx.font = '8px sans-serif';
  ctx.fillText(`コンロ Lv.${stoveLv}`, kx + 80, ky + 55);
  
  // Prep table
  const prepLv = G.equipment.prep_table || 1;
  ctx.fillStyle = '#8B7355';
  ctx.fillRect(kx, ky + 75, 130, 35);
  ctx.fillStyle = '#A08060';
  ctx.fillRect(kx + 2, ky + 77, 126, 31);
  // Items on table
  ctx.font = '14px sans-serif';
  ctx.fillText('🍅', kx + 10, ky + 98);
  ctx.fillText('🧀', kx + 35, ky + 98);
  ctx.fillText('🔪', kx + 60, ky + 98);
  if (G.animFrame % 60 < 30) ctx.fillText('🫒', kx + 85, ky + 98);
  else ctx.fillText('🍄', kx + 85, ky + 98);
  ctx.fillStyle = '#aaa';
  ctx.font = '8px sans-serif';
  ctx.fillText(`調理台 Lv.${prepLv}`, kx, ky + 120);
  
  // Mixer
  const mixLv = G.equipment.mixer || 1;
  ctx.fillStyle = '#666';
  ctx.fillRect(kx + 140, ky + 20, 30, 40);
  const mixAngle = G.animFrame * 0.1;
  ctx.save();
  ctx.translate(kx + 155, ky + 40);
  ctx.rotate(mixAngle);
  ctx.fillStyle = '#888';
  ctx.fillRect(-8, -2, 16, 4);
  ctx.restore();
  ctx.fillStyle = '#aaa';
  ctx.font = '8px sans-serif';
  ctx.fillText(`ミキサー Lv.${mixLv}`, kx + 135, ky + 70);
  
  // Fridge
  ctx.fillStyle = '#ccc';
  ctx.fillRect(kx + 140, ky + 80, 35, 55);
  ctx.fillStyle = '#ddd';
  ctx.fillRect(kx + 142, ky + 82, 31, 25);
  ctx.fillRect(kx + 142, ky + 110, 31, 23);
  ctx.fillStyle = '#999';
  ctx.fillRect(kx + 170, ky + 92, 3, 8);
  ctx.fillRect(kx + 170, ky + 118, 3, 8);
  ctx.fillStyle = '#aaa';
  ctx.font = '8px sans-serif';
  ctx.fillText(`冷蔵庫 Lv.${G.equipment.fridge||1}`, kx + 137, ky + 145);
}

function drawDiningArea(W, H) {
  const dx = W * 0.35, dy = H * 0.45;
  // Default tables if no furniture
  if (G.furniture.length === 0) {
    for (let i = 0; i < 3; i++) {
      const tx = dx + i * 120;
      ctx.fillStyle = '#6B4226';
      ctx.fillRect(tx, dy, 60, 40);
      ctx.fillStyle = '#5a3520';
      ctx.fillRect(tx + 5, dy + 5, 50, 30);
    }
  }
  
  // Window
  ctx.fillStyle = '#87CEEB';
  ctx.globalAlpha = 0.4;
  ctx.fillRect(W * 0.6, 10, 100, H * 0.28);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#5a3520';
  ctx.lineWidth = 4;
  ctx.strokeRect(W * 0.6, 10, 100, H * 0.28);
  ctx.beginPath();
  ctx.moveTo(W * 0.6 + 50, 10);
  ctx.lineTo(W * 0.6 + 50, 10 + H * 0.28);
  ctx.stroke();
  
  // Door
  ctx.fillStyle = '#4a3020';
  ctx.fillRect(W * 0.85, H * 0.15, 50, H * 0.25);
  ctx.fillStyle = '#f0a500';
  ctx.beginPath();
  ctx.arc(W * 0.85 + 40, H * 0.15 + H * 0.125, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ddd';
  ctx.font = '9px sans-serif';
  ctx.fillText('EXIT', W * 0.85 + 12, H * 0.15 + H * 0.05);
}

function drawFurniture(W, H) {
  G.furniture.forEach((f, i) => {
    const fx = W * 0.35 + (i % 5) * 90 + 10;
    const fy = H * 0.45 + Math.floor(i / 5) * 70;
    const gColor = ['#666','#cd7f32','#c0c0c0','#ffd700','#b9f2ff','#ff69b4'][f.grade];
    
    ctx.fillStyle = gColor;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(fx - 4, fy - 4, 50, 40);
    ctx.globalAlpha = 1;
    
    if (f.type === 'table') {
      ctx.fillStyle = f.grade >= 3 ? '#A0522D' : '#6B4226';
      ctx.fillRect(fx, fy, 42, 32);
      ctx.fillStyle = f.grade >= 4 ? '#FFD700' : '#5a3520';
      ctx.fillRect(fx + 3, fy + 3, 36, 26);
    } else if (f.type === 'chair') {
      ctx.fillStyle = f.grade >= 3 ? '#8B0000' : '#5a3520';
      ctx.fillRect(fx + 8, fy + 5, 26, 24);
      ctx.fillRect(fx + 10, fy - 5, 22, 12);
    } else if (f.type === 'decor') {
      ctx.font = '22px sans-serif';
      ctx.fillText(f.grade >= 3 ? '🖼️' : '🌿', fx + 5, fy + 22);
    } else if (f.type === 'light') {
      ctx.beginPath();
      ctx.arc(fx + 21, fy + 10, 10, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,150,${0.5 + Math.sin(G.animFrame * 0.05) * 0.2})`;
      ctx.fill();
    }
    
    ctx.fillStyle = '#aaa';
    ctx.font = '7px sans-serif';
    ctx.fillText(`G${f.grade}`, fx, fy + 38);
  });
}

function drawStaff(W, H) {
  const kx = 20, ky = 0;
  G.staff.forEach((s, i) => {
    if (!s.working) return;
    const sx = kx + 30 + (i % 4) * 38;
    const sy = (W > 600 ? 280 : 240) + Math.floor(i / 4) * 45;
    const bobY = Math.sin(G.animFrame * 0.08 + i) * 2;
    
    // Body
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(sx, sy - 12 + bobY, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // Body
    ctx.fillRect(sx - 6, sy - 4 + bobY, 12, 16);
    
    // Hat (chef)
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx - 6, sy - 22 + bobY, 12, 6);
    ctx.fillRect(sx - 4, sy - 26 + bobY, 8, 6);
    
    // Arms animation (cooking)
    const armAngle = Math.sin(G.animFrame * 0.12 + i * 2) * 0.3;
    ctx.save();
    ctx.translate(sx - 6, sy + bobY);
    ctx.rotate(-0.3 + armAngle);
    ctx.fillStyle = s.color;
    ctx.fillRect(0, 0, -12, 3);
    ctx.restore();
    
    ctx.save();
    ctx.translate(sx + 6, sy + bobY);
    ctx.rotate(0.3 - armAngle);
    ctx.fillStyle = s.color;
    ctx.fillRect(0, 0, 12, 3);
    ctx.restore();
    
    // Stamina bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx - 10, sy + 14 + bobY, 20, 3);
    const stPct = s.stamina / s.maxStamina;
    ctx.fillStyle = stPct > 0.5 ? '#4ecca3' : stPct > 0.2 ? '#f0a500' : '#e94560';
    ctx.fillRect(sx - 10, sy + 14 + bobY, 20 * stPct, 3);
    
    // Name
    ctx.fillStyle = '#fff';
    ctx.font = '7px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s.name.split(' ')[1] || s.name, sx, sy + 24 + bobY);
    ctx.textAlign = 'left';
  });
}

function drawCustomers(W, H) {
  G.customersInShop.forEach(c => {
    const bobY = Math.sin(c.walkFrame) * 2;
    
    // Head
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(c.x + W * 0.3, c.y - 10 + bobY, 7, 0, Math.PI * 2);
    ctx.fill();
    
    // Body
    ctx.fillRect(c.x + W * 0.3 - 5, c.y + bobY, 10, 14);
    
    // Legs walking animation
    if (c.entering || c.leaving) {
      const legAnim = Math.sin(c.walkFrame * 3) * 4;
      ctx.fillStyle = '#555';
      ctx.fillRect(c.x + W * 0.3 - 3, c.y + 14 + bobY, 3, 8 + legAnim);
      ctx.fillRect(c.x + W * 0.3 + 1, c.y + 14 + bobY, 3, 8 - legAnim);
    } else {
      ctx.fillStyle = '#555';
      ctx.fillRect(c.x + W * 0.3 - 3, c.y + 14 + bobY, 3, 8);
      ctx.fillRect(c.x + W * 0.3 + 1, c.y + 14 + bobY, 3, 8);
    }
    
    // Served indicator
    if (c.served) {
      ctx.font = '12px sans-serif';
      ctx.fillText('😊', c.x + W * 0.3 - 6, c.y - 20 + bobY);
    } else if (!c.entering) {
      ctx.font = '12px sans-serif';
      ctx.fillText('🍕❓', c.x + W * 0.3 - 8, c.y - 20 + bobY);
    }
  });
}

function drawSmoke(W, H) {
  G.smokeParticles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,200,200,${p.life / 60 * 0.4})`;
    ctx.fill();
  });
}

function drawDeliveryBike(W, H) {
  const bx = W * 0.8;
  const by = H * 0.85;
  const bounce = Math.sin(G.animFrame * 0.15) * 2;
  
  // Bike
  ctx.fillStyle = '#e94560';
  ctx.fillRect(bx - 15, by - 10 + bounce, 30, 12);
  // Wheels
  ctx.beginPath();
  ctx.arc(bx - 10, by + 6 + bounce, 5, 0, Math.PI * 2);
  ctx.arc(bx + 10, by + 6 + bounce, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#333';
  ctx.fill();
  // Box
  ctx.fillStyle = '#f0a500';
  ctx.fillRect(bx - 8, by - 20 + bounce, 16, 12);
  ctx.fillStyle = '#fff';
  ctx.font = '6px sans-serif';
  ctx.fillText('PIZA', bx - 7, by - 12 + bounce);
  
  // Active delivery count
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.fillText(`配達中: ${G.deliveriesQueue.length}件`, bx - 20, by + 20);
}

let currentTab = 'staff';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#panel-tabs .tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  renderPanel();
}

function renderPanel() {
  const el = document.getElementById('panel-content');
  switch (currentTab) {
    case 'staff': el.innerHTML = renderStaffPanel(); break;
    case 'kitchen': el.innerHTML = renderKitchenPanel(); break;
    case 'ingredients': el.innerHTML = renderIngredientsPanel(); break;
    case 'furniture': el.innerHTML = renderFurniturePanel(); break;
    case 'ads': el.innerHTML = renderAdsPanel(); break;
    case 'delivery': el.innerHTML = renderDeliveryPanel(); break;
    case 'finance': el.innerHTML = renderFinancePanel(); break;
  }
}

function renderStaffPanel() {
  let html = `<div class="section-title">スタッフ一覧 (${G.staff.length}/${MAX_STAFF})</div>`;
  G.staff.forEach((s, i) => {
    const stPct = (s.stamina / s.maxStamina * 100).toFixed(0);
    const stColor = stPct > 50 ? 'green' : stPct > 20 ? 'yellow' : 'red';
    html += `
      <div class="staff-item" onclick="showStaffDetail(${i})">
        <div class="staff-avatar" style="background:${s.color}">${s.name[0]}</div>
        <div class="staff-info">
          <div class="name">${s.name} <span class="c-yellow fs10">Lv.${s.level}</span></div>
          <div class="role">${SPEC_NAMES[s.specialty]} (+${s.boostPct}%効率) ・ ${TRAIT_NAMES[s.trait]}</div>
          <div class="prog-bar"><div class="prog-fill ${stColor}" style="width:${stPct}%"></div></div>
          <div class="fs10 c-gray">体力 ${stPct}% ・ 給料 ${fmt(s.salary)}/日 ・ ${s.working?'<span class="c-green">勤務中</span>':'<span class="c-red">休憩中</span>'}</div>
          <div class="boost fs10">得意: ${SPEC_NAMES[s.specialty]} → +${s.boostPct}% 永続効率ブースト</div>
        </div>
      </div>`;
  });
  html += `<button class="btn btn-success btn-block mt8" onclick="openHireModal()">+ スタッフを雇用</button>`;
  return html;
}

function showStaffDetail(idx) {
  const s = G.staff[idx];
  const maxLv = G.staffLimitBreak ? 30 : MAX_STAFF_LEVEL;
  const upgradeCost = s.level * 500 + 1000;
  let html = `
    <div class="card">
      <h3>${s.name}</h3>
      <p>レベル: ${s.level}/${maxLv}<br>
      得意分野: ${SPEC_NAMES[s.specialty]} (+${s.boostPct}%永続効率ブースト)<br>
      性格: ${TRAIT_NAMES[s.trait]}<br>
      体力: ${(s.stamina/s.maxStamina*100).toFixed(0)}%<br>
      給料: ${fmt(s.salary)}/日<br>
      EXP: ${Math.floor(s.exp)}/${s.expToNext}</p>
      <div class="flex gap4 mt8">
        ${s.level < maxLv ? `<button class="btn btn-warning btn-sm" onclick="upgradeStaff(${idx})">レベルUP (${fmt(upgradeCost)})</button>` : '<span class="c-yellow fs11">最大レベル</span>'}
        <button class="btn btn-info btn-sm" onclick="toggleStaffWork(${idx})">${s.working ? '休憩させる' : '勤務させる'}</button>
        ${G.staff.length > 1 ? `<button class="btn btn-primary btn-sm" onclick="fireStaff(${idx})">解雇</button>` : ''}
      </div>
    </div>`;
  document.getElementById('panel-content').innerHTML = html + `<button class="btn btn-info btn-block mt4" onclick="renderPanel()">← 戻る</button>`;
}

function upgradeStaff(idx) {
  const s = G.staff[idx];
  const maxLv = G.staffLimitBreak ? 30 : MAX_STAFF_LEVEL;
  const cost = s.level * 500 + 1000;
  if (s.level >= maxLv) return notify('最大レベルです', 'error');
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  s.level++;
  s.maxStamina += 3;
  s.stamina = s.maxStamina;
  s.boostPct += 2;
  notify(`${s.name}をLv.${s.level}にアップグレード！`, 'success');
  showStaffDetail(idx);
}

function toggleStaffWork(idx) {
  G.staff[idx].working = !G.staff[idx].working;
  showStaffDetail(idx);
}

function fireStaff(idx) {
  if (G.staff.length <= 1) return notify('最低1人は必要です', 'error');
  const name = G.staff[idx].name;
  G.staff.splice(idx, 1);
  notify(`${name}を解雇しました`, 'info');
  renderPanel();
}

function renderKitchenPanel() {
  let html = '<div class="section-title">調理器具アップグレード</div>';
  EQUIPMENT.forEach(eq => {
    const lv = G.equipment[eq.id];
    const cost = Math.floor(eq.baseCost * (1 + lv * 0.5));
    const bonus = getEquipBonus(eq.id);
    html += `
      <div class="upgrade-item">
        <div class="uinfo">
          <div class="uname">${eq.icon} ${eq.name}</div>
          <div class="ulevel">Lv.${lv}/${MAX_EQUIP_LEVEL} ・ 効率 x${bonus.toFixed(2)}</div>
          <div class="fs10 c-gray">${eq.desc}</div>
          <div class="prog-bar"><div class="prog-fill blue" style="width:${(lv/MAX_EQUIP_LEVEL*100)}%"></div></div>
        </div>
        ${lv < MAX_EQUIP_LEVEL ?
          `<button class="btn btn-warning btn-sm" onclick="upgradeEquip('${eq.id}')">UP ${fmt(cost)}</button>` :
          '<span class="c-yellow fs10">MAX</span>'}
      </div>`;
  });
  return html;
}

function upgradeEquip(eqId) {
  const eq = EQUIPMENT.find(e => e.id === eqId);
  const lv = G.equipment[eqId];
  if (lv >= MAX_EQUIP_LEVEL) return notify('最大レベル', 'error');
  const cost = Math.floor(eq.baseCost * (1 + lv * 0.5));
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  G.equipment[eqId]++;
  notify(`${eq.name}をLv.${G.equipment[eqId]}にアップグレード！`, 'success');
  renderPanel();
}

function renderIngredientsPanel() {
  let html = '<div class="section-title">具材在庫 (最大各300)</div><div class="ingr-grid">';
  INGREDIENTS.forEach(ing => {
    const stock = G.ingredients[ing.id];
    const pct = (stock / MAX_INGREDIENT_STOCK * 100).toFixed(0);
    const restockCost = ing.costPer * 50;
    html += `
      <div class="ingr-item">
        <div class="iname">${ing.icon} ${ing.name}</div>
        <div class="istock">${stock}/${MAX_INGREDIENT_STOCK}</div>
        <div class="prog-bar"><div class="prog-fill ${stock > 100 ? 'green' : stock > 30 ? 'yellow' : 'red'}" style="width:${pct}%"></div></div>
        <button class="btn btn-success btn-sm mt4" onclick="restockIngredient('${ing.id}',50)">+50 (${fmt(restockCost)})</button>
      </div>`;
  });
  html += '</div>';
  html += `<button class="btn btn-warning btn-block mt8" onclick="restockAll()">全具材を補充</button>`;
  return html;
}

function restockIngredient(id, amount) {
  const ing = INGREDIENTS.find(i => i.id === id);
  const cost = ing.costPer * amount;
  if (G.money < cost) return notify('資金不足', 'error');
  const canAdd = Math.min(amount, MAX_INGREDIENT_STOCK - G.ingredients[id]);
  if (canAdd <= 0) return notify('在庫が満杯です', 'error');
  const actualCost = ing.costPer * canAdd;
  G.money -= actualCost;
  G.ingredients[id] += canAdd;
  G.totalExpensesToday += actualCost;
  notify(`${ing.name}を${canAdd}個補充 (${fmt(actualCost)})`, 'success');
  renderPanel();
}

function restockAll() {
  let totalCost = 0;
  INGREDIENTS.forEach(ing => {
    const need = MAX_INGREDIENT_STOCK - G.ingredients[ing.id];
    totalCost += need * ing.costPer;
  });
  if (G.money < totalCost) return notify(`全補充に${fmt(totalCost)}必要（資金不足）`, 'error');
  INGREDIENTS.forEach(ing => {
    const need = MAX_INGREDIENT_STOCK - G.ingredients[ing.id];
    G.ingredients[ing.id] = MAX_INGREDIENT_STOCK;
    G.totalExpensesToday += need * ing.costPer;
  });
  G.money -= totalCost;
  notify(`全具材を補充！(${fmt(totalCost)})`, 'success');
  renderPanel();
}

function buyFurniture(type, variantIdx) {
  const cost = GRADE_COSTS[1];
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  const v = FURNITURE_DATA[type].variants[variantIdx];
  G.furniture.push({ type, variantIdx, grade: 1, style: v.style, name: v.name });
  notify(`${v.name}を設置！`, 'success');
  renderPanel();
}

function upgradeFurniture(type, variantIdx) {
  const f = G.furniture.find(f => f.type === type && f.variantIdx === variantIdx);
  if (!f || f.grade >= 5) return;
  const cost = GRADE_COSTS[f.grade + 1];
  if (G.money < cost) return notify('資金不足', 'error');
  G.money -= cost;
  f.grade++;
  notify(`${f.name}を${GRADE_NAMES[f.grade]}にアップグレード！`, 'success');
  renderPanel();
}

function startDeliveryService() {
  if (G.money < 15000) return notify('資金不足 (¥15,000必要)', 'error');
  G.money -= 15000;
  G.deliveryEnabled = true;
  const ds = G.deliverySystem;
  ds.level = 1;
  // 初期配達員1名
  const firstDriver = createDeliveryDriver(0);
  firstDriver.name = '佐藤 大地';
  firstDriver.trait = 'local_expert';
  firstDriver.traitName = '地元の達人';
  firstDriver.traitIcon = '🗺️';
  firstDriver.traitEffect = '配達速度+15%、道迷いなし';
  ds.drivers.push(firstDriver);
  ds.fleetSize = 1;
  // 初期車両（自転車）1台
  const bikeType = VEHICLE_TYPES[0];
  ds.vehicles.push({
    id: Date.now(),
    type: bikeType.id,
    name: bikeType.name,
    icon: bikeType.icon,
    speed: bikeType.speed,
    capacity: bikeType.capacity,
    maintenance: bikeType.maintenance,
    fuelCost: bikeType.fuelCost,
    status: 'idle',
    condition: 100,
    totalTrips: 0,
    mileage: 0
  });
  notify('🛵 配達サービス開始！配達員1名と自転車1台で営業開始！', 'success');
  renderPanel();
}

      </div>` : ''}
    </div>`;
  
  // Day history
  if (G.dayHistory.length > 0) {

function takeLoan(amount) {
  if (G.loanAmount + amount > MAX_LOAN) return notify(`最大${fmt(MAX_LOAN)}まで`, 'error');
  G.loanAmount += amount;
  G.money += amount;
  notify(`${fmt(amount)}を借り入れ`, 'info');
  renderPanel();
}

function repayLoan(amount) {
  const repay = Math.min(amount, G.loanAmount, G.money);
  if (repay <= 0) return notify('返済不可', 'error');
  G.money -= repay;
  G.loanAmount -= repay;
  notify(`${fmt(repay)}を返済`, 'success');
  renderPanel();
}
