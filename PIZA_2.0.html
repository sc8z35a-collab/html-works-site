function openHireModal() {
  if (G.staff.length >= MAX_STAFF) return notify('スタッフ上限です', 'error');
  
  const candidates = [];
  for (let i = 0; i < 5; i++) {
    const c = createStaff();
    c.hired = false;
    c.hireCost = 2000 + Math.floor(Math.random() * 8000);
    candidates.push(c);
  }
  
  let html = `<div class="modal-overlay" id="hire-modal" onclick="if(event.target===this)closeHireModal()">
    <div class="modal" style="position:relative;">
      <h2>👤 スタッフ雇用</h2>
      <p class="fs11 c-gray mb8">候補者を選んで雇用しましょう (枠: ${G.staff.length}/${MAX_STAFF})</p>`;
  
  candidates.forEach((c, i) => {
    html += `<div class="hire-candidate">
      <div class="staff-avatar" style="background:${c.color}">${c.name[0]}</div>
      <div style="flex:1">
        <div class="fs12 fw700">${c.name}</div>
        <div class="fs10">得意: ${SPEC_NAMES[c.specialty]} (+${c.boostPct}%効率ブースト)</div>
        <div class="fs10">性格: ${TRAIT_NAMES[c.trait]} ・ 給料 ${fmt(c.salary)}/日</div>
      </div>
      <button class="btn btn-success btn-sm" onclick="hireStaff(${i})" id="hire-btn-${i}">雇用 ${fmt(c.hireCost)}</button>
    </div>`;
  });
  
  html += `<button class="btn btn-primary btn-block mt8" onclick="closeHireModal()">閉じる</button>
    </div></div>`;
  
  const div = document.createElement('div');
  div.id = 'hire-modal-wrapper';
  div.innerHTML = html;
  document.body.appendChild(div);
  
  window._hireCandidates = candidates;
}

function hireStaff(idx) {
  const c = window._hireCandidates[idx];
  if (!c || c.hired) return;
  if (G.staff.length >= MAX_STAFF) return notify('上限です', 'error');
  if (G.money < c.hireCost) return notify('資金不足', 'error');
  G.money -= c.hireCost;
  c.hired = true;
  c.working = true;
  G.staff.push(c);
  document.getElementById(`hire-btn-${idx}`).textContent = '雇用済';
  document.getElementById(`hire-btn-${idx}`).disabled = true;
  notify(`${c.name}を雇用！`, 'success');
  renderPanel();
}

function closeHireModal() {
  const w = document.getElementById('hire-modal-wrapper');
  if (w) w.remove();
}

function askBorrow(contactName, amount) {
  const contact = CONTACTS.find(c => c.name === contactName);
  const currentDebt = G.personalLoans[contactName] || 0;
  const thread = G.messageThreads[contactName];

  if (currentDebt + amount > contact.lendMax) {
    thread.messages.push({ from: 'me', text: `${fmt(amount)}貸してもらえないかな…？`, time: getGameTimeStr() });
    setTimeout(() => {
      thread.messages.push({ from: 'them', text: `ごめん、もうこれ以上は無理かな…（上限${fmt(contact.lendMax)}）`, time: getGameTimeStr() });
      if (G.phoneScreen === 'thread_' + contactName) openThread(contactName);
    }, 1000);
    openThread(contactName);
    return;
  }

  thread.messages.push({ from: 'me', text: `お願いがあるんだけど…${fmt(amount)}貸してもらえない？お店のためなんだ。`, time: getGameTimeStr() });

  setTimeout(() => {
    // Acceptance chance based on amount and existing debt
    const ratio = (currentDebt + amount) / contact.lendMax;
    const chance = ratio < 0.3 ? 0.95 : ratio < 0.6 ? 0.7 : ratio < 0.85 ? 0.45 : 0.2;

    if (Math.random() < chance) {
      G.personalLoans[contactName] = currentDebt + amount;
      G.money += amount;
      thread.messages.push({ from: 'them', text: `いいよ！${fmt(amount)}送るね。頑張って！でも返してね！`, time: getGameTimeStr() });
      notify(`${contactName}から${fmt(amount)}借りました`, 'success');
    } else {
      const rejects = [
        'ごめん、今ちょっと余裕がなくて…','うーん、ちょっと厳しいかな…',
        'もう少し経ってからまた相談して','今は無理かも…ごめんね'
      ];
      thread.messages.push({ from: 'them', text: pick(rejects), time: getGameTimeStr() });
      notify(`${contactName}に断られました`, 'error');
    }
    if (G.phoneScreen === 'thread_' + contactName) openThread(contactName);
  }, 1500 + Math.random() * 2000);

  openThread(contactName);
}

function repayPersonal(contactName) {
  const debt = G.personalLoans[contactName] || 0;
  if (debt <= 0) return notify('借入がありません', 'info');
  const repay = Math.min(debt, G.money);
  if (repay <= 0) return notify('資金不足', 'error');

  G.money -= repay;
  G.personalLoans[contactName] -= repay;
  const thread = G.messageThreads[contactName];
  thread.messages.push({ from: 'me', text: `${fmt(repay)}返すね！ありがとう！`, time: getGameTimeStr() });

  setTimeout(() => {
    const remaining = G.personalLoans[contactName];
    if (remaining <= 0) {
      thread.messages.push({ from: 'them', text: 'ありがとう！全額返してくれたんだね。よかった！', time: getGameTimeStr() });
    } else {
      thread.messages.push({ from: 'them', text: `ありがとう！残り${fmt(remaining)}だね。無理しないでね。`, time: getGameTimeStr() });
    }
    if (G.phoneScreen === 'thread_' + contactName) openThread(contactName);
  }, 800);

  openThread(contactName);
}

// SAVE / LOAD / RESET
// ============================================
function saveGame() {
  try {
    const saveData = JSON.stringify(G);
    localStorage.setItem('piza_save', saveData);
    notify('セーブしました！', 'success');
  } catch (e) {
    notify('セーブ失敗: ' + e.message, 'error');
  }
}

function loadGame() {
  try {
    const saveData = localStorage.getItem('piza_save');
    if (!saveData) return notify('セーブデータがありません', 'error');
    const loaded = JSON.parse(saveData);
    Object.assign(G, loaded);
    G.lastTick = Date.now();
    notify('ロードしました！', 'success');
    renderPanel();
  } catch (e) {
    notify('ロード失敗: ' + e.message, 'error');
  }
}

function resetGame() {
  localStorage.removeItem('piza_save');
  location.reload();
}

// ============================================
// ADVANCED GAME LOOP WITH SPEED MULTIPLIER
// ============================================
function advancedGameLoop() {
  const now = Date.now();
  let dt = now - G.lastTick;
  G.lastTick = now;
  dt *= gameSpeedMultiplier;

  if (!G.paused) {
    G.dayTimeLeft -= dt;
    if (G.dayTimeLeft <= 0) {
      G.dayTimeLeft = 0;
      endDay();
      renderShop();
      updateTopBar();
      requestAnimationFrame(advancedGameLoop);
      return;
    }

    G.animFrame++;

    // ---- Customer spawning ----
    const attraction = getCustomerAttraction();
    const baseSpawnInterval = 2200;
    const spawnRate = Math.max(200, baseSpawnInterval / attraction);
    G.customerSpawnAccum += dt;
    while (G.customerSpawnAccum >= spawnRate && G.totalCustomersToday < MAX_CUSTOMERS_DAY) {
      G.customerSpawnAccum -= spawnRate;
      const maxInShop = 15 + G.shopLevel * 8;
      if (G.customersInShop.length < maxInShop) {
        spawnCustomer();
      }
    }

    // ---- Delivery spawning ----
    if (G.deliveryEnabled) {
      const delivRate = Math.max(300, 4500 / attraction);
      G.deliverySpawnAccum += dt;
      while (G.deliverySpawnAccum >= delivRate && G.totalDeliveriesToday < MAX_DELIVERIES_DAY) {
        G.deliverySpawnAccum -= delivRate;
        spawnDeliveryOrder();
      }
    }

    // ---- Update customers ----
    for (let i = G.customersInShop.length - 1; i >= 0; i--) {
      const c = G.customersInShop[i];
      c.timer += dt;
      c.walkFrame += dt * 0.005;

      if (c.entering) {
        c.x += (c.targetX - c.x) * 0.06;
        if (Math.abs(c.x - c.targetX) < 2) {
          c.entering = false;
          c.timer = 0;
        }
      }

      if (!c.served && !c.entering && c.timer > 1800) {
        if (servePizza(c)) {
          c.served = true;
          c.timer = 0;
        } else {
          c.leaving = true;
          c.satisfaction = 1;
          if (Math.random() < 0.5) addReview(1, c);
        }
      }

      if (c.served && c.timer > 2500) {
        c.leaving = true;
      }

      if (c.leaving) {
        c.x += 5;
        if (c.x > 700) {
          G.customersInShop.splice(i, 1);
        }
      }
    }

    // ---- Update deliveries ----
    for (let i = G.deliveriesQueue.length - 1; i >= 0; i--) {
      G.deliveriesQueue[i].timer -= dt;
      if (G.deliveriesQueue[i].timer <= 0) {
        G.deliveriesQueue.splice(i, 1);
      }
    }

    // ---- Staff stamina, EXP, lazy behavior ----
    G.staff.forEach(s => {
      if (s.working) {
        let drain = 0.0008 * (dt / 1000) * s.maxStamina;
        if (s.trait === 'working_hard') drain *= 1.3;
        if (s.trait === 'lazy') drain *= 0.6;
        if (s.trait === 'perfectionist') drain *= 1.1;
        s.stamina = clamp(s.stamina - drain, 0, s.maxStamina);

        // Lazy staff may slack off
        if (s.trait === 'lazy' && s.stamina < s.maxStamina * 0.25 && Math.random() < 0.00005 * dt) {
          s.working = false;
          notify(`${s.name}がサボり始めた！`, 'error');
        }

        // EXP gain
        const expGain = dt * 0.003 * (s.trait === 'working_hard' ? 1.3 : s.trait === 'perfectionist' ? 1.2 : 1);
        s.exp += expGain;
        const maxLv = G.staffLimitBreak ? 30 : MAX_STAFF_LEVEL;
        if (s.exp >= s.expToNext && s.level < maxLv) {
          s.level++;
          s.exp = 0;
          s.expToNext = s.level * 130;
          s.maxStamina += 2.5;
          s.stamina = s.maxStamina;
          s.boostPct = Math.min(s.boostPct + 1, 60);
          notify(`${s.name}がLv.${s.level}に！`, 'success');
        }
      }
    });

    // ---- Smoke particles ----
    if (G.graphicsQuality !== 'low' && G.animFrame % 20 === 0) {
      G.smokeParticles.push({
        x: 55 + Math.random() * 25,
        y: 0,
        life: 50 + Math.random() * 20,
        size: 2 + Math.random() * 4,
        vx: (Math.random() - 0.5) * 0.3
      });
    }
    for (let i = G.smokeParticles.length - 1; i >= 0; i--) {
      const p = G.smokeParticles[i];
      p.y -= 0.4;
      p.x += p.vx || 0;
      p.life--;
      p.size += 0.04;
      if (p.life <= 0) G.smokeParticles.splice(i, 1);
    }
    if (G.smokeParticles.length > 60) G.smokeParticles.splice(0, G.smokeParticles.length - 60);
  }

  renderShop();
  updateTopBar();
  requestAnimationFrame(advancedGameLoop);
}

// ============================================
// ENHANCED RENDERING (replaces old renderShop)
// ============================================
function renderShop() {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  if (W <= 0 || H <= 0) return;

  ctx.save();
  ctx.clearRect(0, 0, W, H);

  const lowQ = G.graphicsQuality === 'low';
  const highQ = G.graphicsQuality === 'high';

  // ========== FLOOR ==========
  const floorY = H * 0.42;
  if (!lowQ) {
    const floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
    floorGrad.addColorStop(0, '#6d4c2e');
    floorGrad.addColorStop(0.4, '#5c3d24');
    floorGrad.addColorStop(1, '#3e2518');
    ctx.fillStyle = floorGrad;
  } else {
    ctx.fillStyle = '#5c3d24';
  }
  ctx.fillRect(0, floorY, W, H - floorY);

  // Floor tiles
  if (!lowQ) {
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    const tileSize = 45;
    for (let x = 0; x < W; x += tileSize) {
      ctx.beginPath(); ctx.moveTo(x, floorY); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = floorY; y < H; y += tileSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  // ========== WALL ==========
  if (!lowQ) {
    const wallGrad = ctx.createLinearGradient(0, 0, 0, floorY);
    wallGrad.addColorStop(0, '#9e6b45');
    wallGrad.addColorStop(0.5, '#b07850');
    wallGrad.addColorStop(1, '#7a5230');
    ctx.fillStyle = wallGrad;
  } else {
    ctx.fillStyle = '#9e6b45';
  }
  ctx.fillRect(0, 0, W, floorY);

  // Bricks on wall
  if (highQ) {
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 0.8;
    const brickH = floorY / 7;
    for (let row = 0; row < 7; row++) {
      const yy = row * brickH;
      const offset = row % 2 === 0 ? 0 : 33;
      for (let x = offset; x < W; x += 66) {
        ctx.strokeRect(x, yy, 66, brickH);
      }
    }
  }

  // Baseboard
  ctx.fillStyle = '#4a2e14';
  ctx.fillRect(0, floorY - 4, W, 8);

  // ========== KITCHEN AREA (left 30%) ==========
  const kAreaW = W * 0.3;
  // Kitchen background
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, kAreaW, H);

  // Kitchen back wall (tiles)
  if (!lowQ) {
    ctx.fillStyle = '#d4c4a8';
    ctx.fillRect(0, 0, kAreaW, floorY);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < kAreaW; x += 22) {
      for (let y = 0; y < floorY; y += 22) {
        ctx.strokeRect(x, y, 22, 22);
      }
    }
  }

  drawKitchenDetailed(W, H, kAreaW, floorY);

  // ========== DIVIDER / COUNTER ==========
  ctx.fillStyle = '#5a3a1e';
  ctx.fillRect(kAreaW - 3, floorY * 0.3, 8, H * 0.45);
  // Counter top
  if (!lowQ) {
    const counterGrad = ctx.createLinearGradient(0, floorY * 0.28, 0, floorY * 0.33);
    counterGrad.addColorStop(0, '#8B7355');
    counterGrad.addColorStop(1, '#6B5335');
    ctx.fillStyle = counterGrad;
  } else {
    ctx.fillStyle = '#7B6345';
  }
  ctx.fillRect(2, floorY * 0.28, kAreaW - 5, 10);

  // ========== WINDOW ==========
  const winX = W * 0.55, winY = 12, winW = W * 0.16, winH = floorY * 0.7;
  // Sky
  if (!lowQ) {
    const skyGrad = ctx.createLinearGradient(winX, winY, winX, winY + winH);
    skyGrad.addColorStop(0, '#87CEEB');
    skyGrad.addColorStop(1, '#b8e6ff');
    ctx.fillStyle = skyGrad;
  } else {
    ctx.fillStyle = '#87CEEB';
  }
  ctx.fillRect(winX, winY, winW, winH);

  // Clouds
  if (highQ) {
    const cloudX = winX + 15 + Math.sin(G.animFrame * 0.008) * 8;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(cloudX, winY + 20, 8, 0, Math.PI * 2);
    ctx.arc(cloudX + 10, winY + 18, 10, 0, Math.PI * 2);
    ctx.arc(cloudX + 20, winY + 20, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  // Window frame
  ctx.strokeStyle = '#4a2e14';
  ctx.lineWidth = 4;
  ctx.strokeRect(winX, winY, winW, winH);
  ctx.beginPath();
  ctx.moveTo(winX + winW / 2, winY);
  ctx.lineTo(winX + winW / 2, winY + winH);
  ctx.moveTo(winX, winY + winH / 2);
  ctx.lineTo(winX + winW, winY + winH / 2);
  ctx.stroke();

  // ========== DOOR ==========
  const doorX = W * 0.82, doorY = floorY * 0.15, doorW = W * 0.08, doorH = floorY * 0.82;
  ctx.fillStyle = '#3e2210';
  ctx.fillRect(doorX, doorY, doorW, doorH);
  if (!lowQ) {
    ctx.fillStyle = '#5a3a20';
    ctx.fillRect(doorX + 3, doorY + 3, doorW - 6, doorH * 0.45);
    ctx.fillRect(doorX + 3, doorY + doorH * 0.52, doorW - 6, doorH * 0.45);
  }
  // Door handle
  ctx.fillStyle = '#f0a500';
  ctx.beginPath();
  ctx.arc(doorX + doorW - 10, doorY + doorH * 0.5, 3, 0, Math.PI * 2);
  ctx.fill();
  // EXIT sign
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 8px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXIT', doorX + doorW / 2, doorY - 4);
  ctx.textAlign = 'left';

  // ========== DINING AREA FURNITURE ==========
  drawFurnitureDetailed(W, H, kAreaW, floorY);

  // ========== STAFF ==========
  drawStaffDetailed(W, H, kAreaW, floorY);

  // ========== CUSTOMERS ==========
  drawCustomersDetailed(W, H, kAreaW, floorY);

  // ========== SMOKE ==========
  if (!lowQ) {
    G.smokeParticles.forEach(p => {
      ctx.beginPath();
      const baseY = floorY * 0.2;
      ctx.arc(p.x, baseY + p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,220,220,${(p.life / 70) * 0.35})`;
      ctx.fill();
    });
  }

  // ========== DELIVERY BIKE ==========
  if (G.deliveryEnabled && G.deliveriesQueue.length > 0) {
    drawDeliveryDetailed(W, H);
  }

  // ========== HUD OVERLAY ==========
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(4, 4, 145, 44);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('🍕 PIZA Shop', 10, 20);
  ctx.fillStyle = '#ccc';
  ctx.font = '10px sans-serif';
  ctx.fillText(`Lv.${G.shopLevel} ・ ${G.staff.filter(s=>s.working).length}人稼働 ・ 客${G.customersInShop.length}人`, 10, 36);

  ctx.restore();
}

function drawKitchenDetailed(W, H, kAreaW, floorY) {
  const kx = 8;
  const kyBase = floorY * 0.12;

  // ===== OVEN (かまど) =====
  const ovenLv = G.equipment.oven || 1;
  const ovenW = 65, ovenH = 52;
  // Outer shell
  ctx.fillStyle = '#3a3a3a';
  roundRect(ctx, kx, kyBase, ovenW, ovenH, 4);
  ctx.fill();
  // Inner opening
  ctx.fillStyle = '#1a1a1a';
  roundRect(ctx, kx + 5, kyBase + 5, ovenW - 10, ovenH * 0.6, 3);
  ctx.fill();
  // Fire
  const fTime = G.animFrame * 0.12;
  for (let fi = 0; fi < 5; fi++) {
    const fx = kx + 12 + fi * 10;
    const fh = 8 + Math.sin(fTime + fi * 1.3) * 5;
    const fw = 5 + Math.sin(fTime + fi * 0.7) * 2;
    ctx.fillStyle = `rgba(255,${60 + ovenLv * 2},0,${0.6 + Math.sin(fTime + fi) * 0.2})`;
    ctx.beginPath();
    ctx.moveTo(fx, kyBase + ovenH * 0.55);
    ctx.quadraticCurveTo(fx + fw / 2, kyBase + ovenH * 0.55 - fh, fx + fw, kyBase + ovenH * 0.55);
    ctx.fill();
    // Yellow core
    ctx.fillStyle = `rgba(255,220,50,${0.4 + Math.sin(fTime + fi) * 0.15})`;
    ctx.beginPath();
    ctx.moveTo(fx + 1, kyBase + ovenH * 0.55);
    ctx.quadraticCurveTo(fx + fw / 2, kyBase + ovenH * 0.55 - fh * 0.6, fx + fw - 1, kyBase + ovenH * 0.55);
    ctx.fill();
  }
  // Oven door handle
  ctx.fillStyle = '#888';
  ctx.fillRect(kx + 15, kyBase + ovenH * 0.68, ovenW - 30, 3);
  // Level badge
  drawLevelBadge(ctx, kx + ovenW - 18, kyBase + ovenH - 12, ovenLv);
  ctx.fillStyle = '#ccc';
  ctx.font = '8px sans-serif';
  ctx.fillText('かまど', kx, kyBase + ovenH + 10);

  // ===== STOVE (コンロ) =====
  const stoveLv = G.equipment.stove || 1;
  const sx = kx + ovenW + 8, sy = kyBase;
  ctx.fillStyle = '#484848';
  roundRect(ctx, sx, sy, 52, 42, 3);
  ctx.fill();
  ctx.fillStyle = '#555';
  ctx.fillRect(sx + 2, sy + 2, 48, 28);
  // Burner rings
  for (let bi = 0; bi < 2; bi++) {
    const bx = sx + 14 + bi * 24;
    const by = sy + 16;
    ctx.strokeStyle = stoveLv > 25 ? '#4488ff' : '#ff6633';
    ctx.lineWidth = 1.5;
    const pulseR = 7 + Math.sin(G.animFrame * 0.15 + bi) * 1.5;
    ctx.beginPath();
    ctx.arc(bx, by, pulseR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(bx, by, pulseR * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    // Glow
    ctx.fillStyle = `rgba(${stoveLv > 25 ? '68,136,255' : '255,100,50'},0.15)`;
    ctx.beginPath();
    ctx.arc(bx, by, pulseR + 3, 0, Math.PI * 2);
    ctx.fill();
    // Pot on burner
    ctx.fillStyle = '#666';
    ctx.fillRect(bx - 6, by - 8, 12, 5);
    ctx.fillStyle = '#777';
    ctx.fillRect(bx - 5, by - 10, 10, 4);
  }
  drawLevelBadge(ctx, sx + 34, sy + 32, stoveLv);
  ctx.fillStyle = '#ccc';
  ctx.font = '8px sans-serif';
  ctx.fillText('コンロ', sx, sy + 52);

  // ===== PREP TABLE (調理台) =====
  const prepLv = G.equipment.prep_table || 1;
  const px = kx, py = kyBase + ovenH + 22;
  const ptW = kAreaW - 20, ptH = 32;
  // Table legs
  ctx.fillStyle = '#5a4530';
  ctx.fillRect(px + 4, py + ptH, 5, 15);
  ctx.fillRect(px + ptW - 9, py + ptH, 5, 15);
  // Table surface
  if (G.graphicsQuality === 'high') {
    const tGrad = ctx.createLinearGradient(px, py, px, py + ptH);
    tGrad.addColorStop(0, '#a08060');
    tGrad.addColorStop(1, '#8a6a4a');
    ctx.fillStyle = tGrad;
  } else {
    ctx.fillStyle = '#966e4e';
  }
  roundRect(ctx, px, py, ptW, ptH, 3);
  ctx.fill();
  // Wood grain
  if (G.graphicsQuality === 'high') {
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 0.5;
    for (let gx = px + 5; gx < px + ptW - 5; gx += 12) {
      ctx.beginPath();
      ctx.moveTo(gx, py + 3);
      ctx.lineTo(gx + 5, py + ptH - 3);
      ctx.stroke();
    }
  }
  // Items on prep table - animated
  const items = ['🍅','🧀','🔪','🫒','🍄','🧅','🌿'];
  const visibleItems = items.slice(0, 3 + Math.floor(prepLv / 10));
  visibleItems.forEach((item, idx) => {
    const ix = px + 8 + idx * 18;
    const iy = py + 20;
    const bounce = Math.sin(G.animFrame * 0.08 + idx * 1.5) * 1.5;
    ctx.font = '13px sans-serif';
    ctx.fillText(item, ix, iy + bounce);
  });
  // Chopping animation
  if (G.animFrame % 40 < 20) {
    ctx.font = '12px sans-serif';
    ctx.fillText('🔪', px + ptW - 25, py + 18);
  }
  drawLevelBadge(ctx, px + ptW - 20, py + ptH - 8, prepLv);
  ctx.fillStyle = '#ccc';
  ctx.font = '8px sans-serif';
  ctx.fillText('調理台', px, py + ptH + 22);

  // ===== MIXER (ミキサー) =====
  const mixLv = G.equipment.mixer || 1;
  const mx = kx + ptW - 35, my = py + ptH + 30;
  ctx.fillStyle = '#606060';
  roundRect(ctx, mx, my, 28, 35, 3);
  ctx.fill();
  ctx.fillStyle = '#707070';
  ctx.fillRect(mx + 3, my + 3, 22, 18);
  // Spinning blade
  ctx.save();
  ctx.translate(mx + 14, my + 12);
  ctx.rotate(G.animFrame * 0.2);
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
  ctx.moveTo(0, -7); ctx.lineTo(0, 7);
  ctx.stroke();
  ctx.restore();
  // Dough ball
  if (G.animFrame % 100 < 80) {
    ctx.fillStyle = '#f5deb3';
    const doughSize = 4 + Math.sin(G.animFrame * 0.06) * 1;
    ctx.beginPath();
    ctx.arc(mx + 14, my + 12, doughSize, 0, Math.PI * 2);
    ctx.fill();
  }
  drawLevelBadge(ctx, mx + 10, my + 28, mixLv);
  ctx.fillStyle = '#ccc';
  ctx.font = '8px sans-serif';
  ctx.fillText('ミキサー', mx - 5, my + 45);

  // ===== FRIDGE (冷蔵庫) =====
  const fridgeLv = G.equipment.fridge || 1;
  const fx = kx, fy = py + ptH + 28;
  ctx.fillStyle = '#d0d0d0';
  roundRect(ctx, fx, fy, 32, 52, 3);
  ctx.fill();
  // Door lines
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(fx, fy + 24);
  ctx.lineTo(fx + 32, fy + 24);
  ctx.stroke();
  // Handles
  ctx.fillStyle = '#999';
  ctx.fillRect(fx + 26, fy + 8, 3, 10);
  ctx.fillRect(fx + 26, fy + 30, 3, 10);
  // Frost effect
  if (G.graphicsQuality === 'high') {
    ctx.fillStyle = 'rgba(200,230,255,0.15)';
    ctx.fillRect(fx + 2, fy + 2, 28, 20);
  }
  // Cold mist
  if (G.animFrame % 120 < 20 && G.graphicsQuality !== 'low') {
    ctx.fillStyle = 'rgba(200,230,255,0.3)';
    ctx.beginPath();
    ctx.arc(fx + 16, fy + 54, 6 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  drawLevelBadge(ctx, fx + 14, fy + 44, fridgeLv);
  ctx.fillStyle = '#ccc';
  ctx.font = '8px sans-serif';
  ctx.fillText('冷蔵庫', fx, fy + 62);

  // ===== CUTTER & DISHWASHER (smaller items) =====
  const cutLv = G.equipment.cutter || 1;
  const dwLv = G.equipment.dishwasher || 1;
  // Cutter on prep table area
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#ccc';
  const cutY = fy + 16;
  ctx.fillText(`🔪Lv.${cutLv}`, fx + 40, cutY);
  ctx.fillText(`💧Lv.${dwLv}`, fx + 40, cutY + 16);
}

function drawLevelBadge(ctx, x, y, level) {
  const color = level >= 40 ? '#ff69b4' : level >= 25 ? '#ffd700' : level >= 10 ? '#c0c0c0' : '#cd7f32';
  ctx.fillStyle = color;
  ctx.font = 'bold 7px sans-serif';
  ctx.fillText(`${level}`, x, y);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawFurnitureDetailed(W, H, kAreaW, floorY) {
  if (G.furniture.length === 0) {
    // Default empty tables
    for (let i = 0; i < 2 + G.shopLevel; i++) {
      const tx = kAreaW + 30 + (i % 4) * (W * 0.14);
      const ty = floorY + 20 + Math.floor(i / 4) * 70;
      ctx.fillStyle = '#6B4226';
      roundRect(ctx, tx, ty, 50, 32, 3);
      ctx.fill();
      ctx.fillStyle = '#5a3520';
      ctx.fillRect(tx + 5, ty + 5, 40, 22);
    }
    return;
  }

  const cols = Math.min(5, 2 + G.shopLevel);
  G.furniture.forEach((f, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const fx = kAreaW + 20 + col * (W * 0.12);
    const fy = floorY + 15 + row * 65;
    const gColors = ['#666','#cd7f32','#c0c0c0','#ffd700','#e0f0ff','#ff69b4'];
    const gColor = gColors[f.grade] || '#666';

    // Glow effect for high-grade furniture
    if (f.grade >= 3 && G.graphicsQuality !== 'low') {
      ctx.fillStyle = `${gColor}22`;
      ctx.beginPath();
      ctx.arc(fx + 22, fy + 18, 28, 0, Math.PI * 2);
      ctx.fill();
    }

    if (f.type === 'table') {
      const tColors = ['#6B4226','#8B5A2B','#A0522D','#B87333','#DAA520','#FFD700'];
      ctx.fillStyle = tColors[f.grade] || '#6B4226';
      roundRect(ctx, fx, fy, 46, 30, 4);
      ctx.fill();
      // Table surface detail
      if (G.graphicsQuality === 'high') {
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(fx + 3, fy + 3, 40, 24);
      }
      // Table legs
      ctx.fillStyle = '#4a2e14';
      ctx.fillRect(fx + 4, fy + 30, 4, 10);
      ctx.fillRect(fx + 38, fy + 30, 4, 10);
      // Plate on table
      ctx.fillStyle = '#eee';
      ctx.beginPath();
      ctx.ellipse(fx + 23, fy + 14, 10, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (f.type === 'chair') {
      const cColors = ['#5a3520','#6B3A2A','#8B4513','#A0522D','#B8860B','#CD853F'];
      ctx.fillStyle = cColors[f.grade] || '#5a3520';
      // Seat
      roundRect(ctx, fx + 5, fy + 10, 28, 18, 3);
      ctx.fill();
      // Back
      ctx.fillRect(fx + 7, fy - 2, 24, 14);
      // Cushion for higher grades
      if (f.grade >= 3) {
        ctx.fillStyle = f.grade >= 4 ? '#8B0000' : '#A0522D';
        roundRect(ctx, fx + 8, fy + 12, 22, 12, 2);
        ctx.fill();
      }
      // Legs
      ctx.fillStyle = '#333';
      ctx.fillRect(fx + 8, fy + 28, 3, 8);
      ctx.fillRect(fx + 27, fy + 28, 3, 8);
    } else if (f.type === 'decor') {
      const decorEmojis = ['🌿','🌿','🖼️','🖼️','🎨','✨'];
      ctx.font = '20px sans-serif';
      ctx.fillText(decorEmojis[f.grade] || '🌿', fx + 5, fy + 24);
      // Frame for higher grades
      if (f.grade >= 2) {
        ctx.strokeStyle = gColor;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(fx + 2, fy, 34, 32);
      }
    } else if (f.type === 'light') {
      // Light fixture
      ctx.fillStyle = '#444';
      ctx.fillRect(fx + 16, fy - 5, 4, 10);
      // Bulb / fixture
      const glowIntensity = 0.4 + Math.sin(G.animFrame * 0.04 + i) * 0.15;
      const glowRadius = 10 + f.grade * 3;
      const gradient = ctx.createRadialGradient(fx + 18, fy + 10, 2, fx + 18, fy + 10, glowRadius);
      gradient.addColorStop(0, `rgba(255,255,200,${glowIntensity + 0.3})`);
      gradient.addColorStop(0.5, `rgba(255,240,150,${glowIntensity})`);
      gradient.addColorStop(1, 'rgba(255,220,100,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(fx + 18, fy + 10, glowRadius, 0, Math.PI * 2);
      ctx.fill();
      // Fixture body
      ctx.fillStyle = f.grade >= 4 ? '#ffd700' : f.grade >= 2 ? '#c0c0c0' : '#888';
      ctx.beginPath();
      ctx.moveTo(fx + 10, fy + 5);
      ctx.lineTo(fx + 26, fy + 5);
      ctx.lineTo(fx + 22, fy + 15);
      ctx.lineTo(fx + 14, fy + 15);
      ctx.closePath();
      ctx.fill();
    }

    // Grade label
    if (f.grade > 0) {
      ctx.fillStyle = gColor;
      ctx.font = 'bold 7px sans-serif';
      ctx.fillText(GRADE_NAMES[f.grade], fx, fy + 44);
    }
  });
}

function drawStaffDetailed(W, H, kAreaW, floorY) {
  const workingStaff = G.staff.filter(s => s.working);
  workingStaff.forEach((s, i) => {
    const col = i % 4;
    const row = Math.floor(i / 4);
    const sx = 18 + col * 36;
    const sy = floorY + 20 + row * 50;
    const bobY = Math.sin(G.animFrame * 0.07 + i * 1.1) * 2;
    const stPct = s.stamina / s.maxStamina;

    // Shadow
    if (G.graphicsQuality !== 'low') {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + 24 + bobY, 8, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Legs
    const legAnim = Math.sin(G.animFrame * 0.1 + i * 2) * (stPct > 0.3 ? 2 : 0.5);
    ctx.fillStyle = '#3a3a5a';
    ctx.fillRect(sx - 4, sy + 12 + bobY, 3, 10 + legAnim);
    ctx.fillRect(sx + 1, sy + 12 + bobY, 3, 10 - legAnim);

    // Shoes
    ctx.fillStyle = '#222';
    ctx.fillRect(sx - 5, sy + 21 + bobY + legAnim, 5, 3);
    ctx.fillRect(sx, sy + 21 + bobY - legAnim, 5, 3);

    // Body (apron)
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, sx - 6, sy - 2 + bobY, 12, 15, 2);
    ctx.fill();
    ctx.fillStyle = s.color;
    ctx.fillRect(sx - 5, sy - 2 + bobY, 10, 6);

    // Arms with cooking animation
    const armSwing = Math.sin(G.animFrame * 0.12 + i * 2.5) * 15 * Math.PI / 180;
    // Left arm
    ctx.save();
    ctx.translate(sx - 6, sy + 2 + bobY);
    ctx.rotate(-0.4 + armSwing);
    ctx.fillStyle = s.color;
    roundRect(ctx, -2, 0, 4, 11, 1);
    ctx.fill();
    ctx.restore();
    // Right arm
    ctx.save();
    ctx.translate(sx + 6, sy + 2 + bobY);
    ctx.rotate(0.4 - armSwing);
    ctx.fillStyle = s.color;
    roundRect(ctx, -2, 0, 4, 11, 1);
    ctx.fill();
    ctx.restore();

    // Head
    ctx.fillStyle = '#f5d0a9';
    ctx.beginPath();
    ctx.arc(sx, sy - 8 + bobY, 7, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#333';
    const blinkOpen = G.animFrame % 180 < 170;
    if (blinkOpen) {
      ctx.fillRect(sx - 3, sy - 9 + bobY, 2, 2);
      ctx.fillRect(sx + 1, sy - 9 + bobY, 2, 2);
    } else {
      ctx.fillRect(sx - 3, sy - 8 + bobY, 2, 1);
      ctx.fillRect(sx + 1, sy - 8 + bobY, 2, 1);
    }

    // Mouth - happy if stamina high, tired if low
    if (stPct > 0.5) {
      ctx.beginPath();
      ctx.arc(sx, sy - 5 + bobY, 2, 0, Math.PI);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(sx, sy - 3 + bobY, 2, Math.PI, 0);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Chef hat
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx - 6, sy - 17 + bobY, 12, 5);
    roundRect(ctx, sx - 5, sy - 22 + bobY, 10, 7, 2);
    ctx.fill();

    // Stamina bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, sx - 10, sy + 26 + bobY, 20, 3, 1);
    ctx.fill();
    ctx.fillStyle = stPct > 0.5 ? '#4ecca3' : stPct > 0.2 ? '#f0a500' : '#e94560';
    if (stPct > 0) {
      roundRect(ctx, sx - 10, sy + 26 + bobY, 20 * stPct, 3, 1);
      ctx.fill();
    }

    // Name tag
    ctx.fillStyle = '#ddd';
    ctx.font = '6px sans-serif';
    ctx.textAlign = 'center';
    const shortName = s.name.split(' ').pop();
    ctx.fillText(shortName, sx, sy + 35 + bobY);
    ctx.textAlign = 'left';

    // Specialty icon (small)
    const specIcons = {oven:'🔥',stove:'♨️',prep_table:'🪵',mixer:'🌀',delivery:'🛵',service:'😊',management:'📋'};
    ctx.font = '8px sans-serif';
    ctx.fillText(specIcons[s.specialty] || '', sx - 4, sy - 24 + bobY);

    // Lazy Z's
    if (s.trait === 'lazy' && stPct < 0.3) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '8px sans-serif';
      const zBob = Math.sin(G.animFrame * 0.05) * 3;
      ctx.fillText('💤', sx + 8, sy - 18 + bobY + zBob);
    }
  });
}

function drawCustomersDetailed(W, H, kAreaW, floorY) {
  G.customersInShop.forEach((c, ci) => {
    const cx = c.x + kAreaW;
    const cy = c.y;
    const bobY = Math.sin(c.walkFrame) * 1.5;
    const isMoving = c.entering || c.leaving;

    // Shadow
    if (G.graphicsQuality !== 'low') {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(cx, cy + 22 + bobY, 7, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Legs
    const legAnim = isMoving ? Math.sin(c.walkFrame * 3) * 3 : 0;
    ctx.fillStyle = '#444';
    ctx.fillRect(cx - 3, cy + 10 + bobY, 3, 10 + legAnim);
    ctx.fillRect(cx + 1, cy + 10 + bobY, 3, 10 - legAnim);

    // Body
    ctx.fillStyle = c.color;
    roundRect(ctx, cx - 5, cy - 4 + bobY, 11, 15, 2);
    ctx.fill();

    // Head
    ctx.fillStyle = '#f5d0a9';
    ctx.beginPath();
    ctx.arc(cx, cy - 10 + bobY, 6, 0, Math.PI * 2);
    ctx.fill();

    // Hair (random styles per customer)
    ctx.fillStyle = `hsl(${(c.id * 77) % 360}, 30%, 25%)`;
    ctx.beginPath();
    ctx.arc(cx, cy - 13 + bobY, 6, Math.PI, 0);
    ctx.fill();

    // Eyes
    const blinkOpen = (G.animFrame + c.id * 13) % 200 < 185;
    ctx.fillStyle = '#333';
    if (blinkOpen) {
      ctx.fillRect(cx - 3, cy - 11 + bobY, 1.5, 1.5);
      ctx.fillRect(cx + 1.5, cy - 11 + bobY, 1.5, 1.5);
    }

    // Expression based on status
    if (c.served) {
      // Happy
      ctx.beginPath();
      ctx.arc(cx, cy - 7 + bobY, 2, 0, Math.PI);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 0.5;
      ctx.stroke();
      // Satisfaction emoji
      const emojis = ['😐','😐','😊','😊','😄','😄','🤩','🤩','🤩','🤩'];
      const emoIdx = clamp(Math.floor(c.satisfaction) - 1, 0, 9);
      ctx.font = '10px sans-serif';
      ctx.fillText(emojis[emoIdx], cx - 5, cy - 22 + bobY);
    } else if (!c.entering && !c.leaving) {
      // Waiting - thought bubble with pizza
      if (G.graphicsQuality !== 'low') {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.arc(cx + 10, cy - 26 + bobY, 10, 0, Math.PI * 2);
        ctx.fill();
        // Tail
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 18 + bobY, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 7, cy - 21 + bobY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '10px sans-serif';
        ctx.fillText('🍕', cx + 5, cy - 23 + bobY);
      }
    }

    // Leaving with pizza
    if (c.leaving && c.served) {
      ctx.font = '9px sans-serif';
      const pizzaX = cx + (c.leaving ? 8 : 0);
      ctx.fillText('🍕', pizzaX, cy + bobY);
    }
  });
}

function drawDeliveryDetailed(W, H) {
  const ds = G.deliverySystem;
  if (!G.deliveryEnabled || !ds) return;

  const activeCount = ds.activeOrders.length;
  const baseX = W * 0.73;
  const baseY = H - 55;

  // 配達ステーション背景
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  roundRect(ctx, baseX - 35, baseY - 40, 120, 70, 6);
  ctx.fill();
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 8px sans-serif';
  ctx.fillText('🛵 配達ステーション', baseX - 30, baseY - 30);

  // 待機中の車両を描画
  const idleVehicles = ds.vehicles.filter(v => v.status === 'idle');
  idleVehicles.slice(0, 4).forEach((v, vi) => {
    const vx = baseX - 25 + vi * 25;
    const vy = baseY + 10;
    ctx.font = '14px sans-serif';
    ctx.fillText(v.icon, vx, vy);
    // コンディションバー
    const condColor = v.condition > 70 ? '#4ecca3' : v.condition > 30 ? '#f0a500' : '#e94560';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(vx, vy + 3, 16, 2);
    ctx.fillStyle = condColor;
    ctx.fillRect(vx, vy + 3, 16 * v.condition / 100, 2);
  });

  // 配達中のバイク/車をアニメーション
  ds.activeOrders.slice(0, 5).forEach((order, oi) => {
    const progress = order.progress;
    const laneY = baseY - 55 - oi * 18;
    const startX = baseX - 30;
    const endX = baseX + 85;
    const currentX = startX + (endX - startX) * progress;

    // 経路線
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(startX, laneY);
    ctx.lineTo(endX, laneY);
    ctx.stroke();
    ctx.setLineDash([]);

    // 進行済み線
    const statusColor = order.status === 'preparing' ? '#f0a500' : order.status === 'arriving' ? '#4ecca3' : '#00b4d8';
    ctx.strokeStyle = statusColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(startX, laneY);
    ctx.lineTo(currentX, laneY);
    ctx.stroke();

    // 車両アイコン
    const vIcon = order.vehicle ? order.vehicle.icon : '🛵';
    const bounce = Math.sin(G.animFrame * 0.15 + oi * 2) * 1.5;
    ctx.font = '11px sans-serif';
    ctx.fillText(vIcon, currentX - 6, laneY + 4 + bounce);

    // 特急マーク
    if (order.isExpress) {
      ctx.fillStyle = '#ff69b4';
      ctx.font = 'bold 6px sans-serif';
      ctx.fillText('⚡', currentX + 5, laneY - 4);
    }

    // 到着地点マーク
    ctx.font = '8px sans-serif';
    ctx.fillText('📍', endX, laneY + 3);
  });

  // 統計テキスト
  ctx.fillStyle = '#fff';
  ctx.font = '9px sans-serif';
  ctx.fillText(`配達中: ${activeCount}件`, baseX - 25, baseY - 18);
  ctx.fillStyle = '#4ecca3';
  ctx.fillText(`完了: ${ds.completedToday}件`, baseX + 30, baseY - 18);

  // ピーク時インジケーター
  if (ds.peakHourBonus) {
    ctx.fillStyle = `rgba(255,100,50,${0.5 + Math.sin(G.animFrame * 0.1) * 0.3})`;
    ctx.font = 'bold 7px sans-serif';
    ctx.fillText('🔥 PEAK TIME', baseX - 25, baseY - 6);
  }

  // 待機中ドライバー
  const idleDrivers = ds.drivers.filter(d => d.status === 'idle');
  idleDrivers.slice(0, 3).forEach((d, di) => {
    const dx = baseX + 55 + di * 14;
    const dy = baseY + 12;
    const bobY = Math.sin(G.animFrame * 0.06 + di * 1.5) * 1;
    // 小さいスタッフ風
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(dx, dy - 5 + bobY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(dx - 3, dy - 1 + bobY, 6, 8);
    ctx.font = '6px sans-serif';
    ctx.fillText(d.traitIcon, dx - 3, dy - 10 + bobY);
  });
}

// ============================================
// PERIODIC UI UPDATE
// ============================================
setInterval(() => {
  if (currentTab) renderPanel();
}, 3000);

// ============================================
// INITIALIZATION
// ============================================
function init() {
  resizeCanvas();
  renderPanel();
  G.lastTick = Date.now();
  advancedGameLoop();
  notify('PIZA経営シミュレーションへようこそ！', 'success');
  notify('右パネルでスタッフや設備を管理しましょう', 'info');
}

window.addEventListener('load', init);
</script>
