if(Math.abs(M.x-ox)<.0005&&Math.abs(M.y-oy)<.0005){if(canM(M.x+tdy/td*spd,M.y))M.x+=tdy/td*spd;else if(canM(M.x-tdy/td*spd,M.y))M.x-=tdy/td*spd;if(canM(M.x,M.y+tdx/td*spd))M.y+=tdx/td*spd;else if(canM(M.x,M.y-tdx/td*spd))M.y-=tdx/td*spd}
for(const s of spr)if(s.t===2){s.x=M.x;s.y=M.y}

function render(){buf.fill(0);
cdx=Math.cos(P.a);cdy=Math.sin(P.a);const pm=Math.tan(FOV/2);plx=-cdy*pm;ply=cdx*pm;
flickT+=16;const flick=Math.sin(flickT*.003)*Math.sin(flickT*.007)>.7?.55:1;const dm=flick*(1-nearM*.3);
const hh=RH>>1;
for(let y=hh+1;y<RH;y++){const r0x=cdx-plx,r0y=cdy-ply,r1x=cdx+plx,r1y=cdy+ply;
const p=y-hh,rd=(.5*RH)/p;const fsx=rd*(r1x-r0x)/RW,fsy=rd*(r1y-r0y)/RW;

buf[pi]=tex[7][ti]*dk;buf[pi+1]=tex[7][ti+1]*dk;buf[pi+2]=tex[7][ti+2]*dk;buf[pi+3]=255;
const cy2=RH-1-y;if(cy2>=0&&cy2<hh){pi=(cy2*RW+x)*4;buf[pi]=tex[8][ti]*dk;buf[pi+1]=tex[8][ti+1]*dk;buf[pi+2]=tex[8][ti+2]*dk;buf[pi+3]=255}}}
for(let x=0;x<RW;x++){const cx2=2*x/RW-1,rdx=cdx+plx*cx2,rdy=cdy+ply*cx2;
let mx=P.x|0,my=P.y|0;const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
let sx,sdx,sy,sdy;
if(rdx<0){sx=-1;sdx=(P.x-mx)*ddx}else{sx=1;sdx=(mx+1-P.x)*ddx}
if(rdy<0){sy=-1;sdy=(P.y-my)*ddy}else{sy=1;sdy=(my+1-P.y)*ddy}
let side,hit=false;for(let i=0;i<60&&!hit;i++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(mx>=0&&mx<MW&&my>=0&&my<MH&&mp[my][mx]>0)hit=true}
if(!hit){zb[x]=1e9;continue}
let pwd;if(side===0)pwd=(mx-P.x+(1-sx)/2)/rdx;else pwd=(my-P.y+(1-sy)/2)/rdy;
if(pwd<.01)pwd=.01;zb[x]=pwd;
const lh=(RH/pwd)|0;let ds=(-lh/2+hh)|0,de=(lh/2+hh)|0;
let wx;if(side===0)wx=P.y+pwd*rdy;else wx=P.x+pwd*rdx;wx-=wx|0;
let txX=(wx*TX)|0;if(txX>=TX)txX=TX-1;if(side===0&&rdx>0)txX=TX-1-txX;if(side===1&&rdy<0)txX=TX-1-txX;
const ti=mp[my][mx]-1,tD=tex[ti];if(!tD)continue;
const step=TX/lh;let tP=ds<0?-ds*step:0;if(ds<0)ds=0;if(de>=RH)de=RH-1;
const dk=Math.min(1,2.5/(1+pwd*pwd*.04))*dm*(side===1?.75:1);
for(let y=ds;y<=de;y++){const txY=(tP|0)&(TX-1);tP+=step;const si=(txY*TX+txX)*4,pi=(y*RW+x)*4;
buf[pi]=tD[si]*dk;buf[pi+1]=tD[si+1]*dk;buf[pi+2]=tD[si+2]*dk;buf[pi+3]=255}}
rSprites();
for(let y=0;y<RH;y++){const dy2=(y/RH-.5)*2,dy2s=dy2*dy2;for(let x=0;x<RW;x++){const dx2=(x/RW-.5)*2;const v=Math.max(0,1-(dx2*dx2+dy2s)*.4);const pi=(y*RW+x)*4;
let r=buf[pi]*v,g=buf[pi+1]*v,b=buf[pi+2]*v;
if(nearM>.1){r+=nearM*25;if(((x*7+y*13+flickT)&31)<nearM*8){const n=nearM*50;r+=n;g-=n*.3;b-=n*.3}}
buf[pi]=r>255?255:r<0?0:r;buf[pi+1]=g>255?255:g<0?0:g;buf[pi+2]=b>255?255:b<0?0:b}}
ct.putImageData(imgD,0,0);
if(nearM>.3){cv.style.transform=`translate(${(Math.random()-.5)*nearM*8|0}px,${(Math.random()-.5)*nearM*8|0}px)`}else cv.style.transform="translate(-50%,-50%)";
ct.fillStyle="#fff";ct.font="bold 10px monospace";ct.textAlign="left";
ct.fillText("鍵："+keysFound+"/"+NKEYS,8,15);
if(msgT>0){ct.globalAlpha=Math.min(1,msgT/500);ct.fillStyle="#fff";ct.font="bold 12px monospace";ct.textAlign="center";ct.fillText(curMsg,RW/2,RH-28);ct.textAlign="left";ct.globalAlpha=1}
const ms2=75,mmx=RW-ms2-5,mmy=5,sc=ms2/Math.max(MW,MH);

for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(mp[y][x]>0){ct.fillStyle="#333";ct.fillRect(mmx+x*sc,mmy+y*sc,Math.ceil(sc),Math.ceil(sc))}
ct.globalAlpha=1;ct.fillStyle="#0f0";ct.fillRect(mmx+P.x*sc-1,mmy+P.y*sc-1,3,3);

function rSprites(){const sd=[];for(const s of spr){if(s.t===1&&s.g)continue;const dx=s.x-P.x,dy=s.y-P.y;sd.push({s,d:dx*dx+dy*dy})}
sd.sort((a,b)=>b.d-a.d);const invD=1/(plx*cdy-cdx*ply);
for(const{s,d}of sd){if(d>800)continue;const sx=s.x-P.x,sy=s.y-P.y;

else{buf[pi]=tData[si]*dk;buf[pi+1]=tData[si+1]*dk;buf[pi+2]=tData[si+2]*dk;buf[pi+3]=255}}}}}
