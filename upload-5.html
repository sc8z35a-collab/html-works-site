// =====================================================
// PART 28-I: 高度な飛び火（Firebrand）物理エンジン
// =====================================================

class FirebrandPhysics {
    constructor() {
        this.firebrands = [];
        this.maxFirebrands = 15;
        this.dragCoefficient = 0.47;
        this.liftCoefficient = 0.3;
        this.airDensity = 1.225;
        this.combustionRate = 0.02;
        this.landingIgnitionChance = 0.4;
        this.turbulenceScale = 0.008;
        this.thermalColumnStrength = 2.5;
        this.thermalRadius = 80;
    }

    createFirebrand(x, y, sourceIntensity) {
        if (this.firebrands.length >= this.maxFirebrands) return null;

        const windMag = Math.sqrt(simulationState.windX ** 2 + simulationState.windY ** 2);
        const mass = randFloat(0.001, 0.05);
        const area = randFloat(0.0001, 0.002);

        const fb = {
            x: x,
            y: y,
            z: randFloat(0, 30),
            vx: simulationState.windX * randFloat(1.5, 4.0) + randFloat(-15, 15),
            vy: randFloat(-150, -60),
            vz: randFloat(-5, 5),
            mass: mass,
            crossSectionArea: area,
            temperature: randFloat(600, 1200),
            combustionFuel: randFloat(0.5, 1.0),
            burnRate: this.combustionRate * randFloat(0.5, 2.0),
            active: true,
            landed: false,
            trail: [],
            maxTrail: 12,
            glowSize: randFloat(2, 6),
            tumbleRate: randFloat(2, 10),
            tumblePhase: Math.random() * Math.PI * 2,
            sourceIntensity: sourceIntensity,
            age: 0,
            lofted: true,
            loftTimer: randFloat(0.5, 2.0)
        };

        this.firebrands.push(fb);
        return fb;
    }

    update(dt, time) {
        for (let i = this.firebrands.length - 1; i >= 0; i--) {
            const fb = this.firebrands[i];
            if (!fb.active) { this.firebrands.splice(i, 1); continue; }

            fb.age += dt;

            // Store trail point
            if (fb.trail.length >= fb.maxTrail) fb.trail.shift();
            fb.trail.push({ x: fb.x, y: fb.y, temp: fb.temperature });

            // Combustion
            fb.combustionFuel -= fb.burnRate * dt;
            fb.temperature = Math.max(200, fb.temperature * (0.998 - (1 - fb.combustionFuel) * 0.005));
            if (fb.combustionFuel <= 0) {
                fb.active = false;
                continue;
            }

            // Lofting phase (thermal updraft)
            if (fb.lofted) {
                fb.loftTimer -= dt;
                if (fb.loftTimer <= 0) fb.lofted = false;
                fb.vy -= this.thermalColumnStrength * fb.sourceIntensity * 80 * dt;
            }

            // Aerodynamic forces
            const relVx = fb.vx - simulationState.windX * 3;
            const relVy = fb.vy - simulationState.windY;
            const relSpeed = Math.sqrt(relVx * relVx + relVy * relVy);

            // Drag
            const dragForce = 0.5 * this.airDensity * relSpeed * relSpeed * this.dragCoefficient * fb.crossSectionArea;
            const dragDirX = relSpeed > 0.01 ? -relVx / relSpeed : 0;
            const dragDirY = relSpeed > 0.01 ? -relVy / relSpeed : 0;
            fb.vx += (dragForce * dragDirX / fb.mass) * dt;
            fb.vy += (dragForce * dragDirY / fb.mass) * dt;

            // Lift (tumbling creates lift)
            const tumble = Math.sin(fb.age * fb.tumbleRate + fb.tumblePhase);
            const liftForce = this.liftCoefficient * fb.crossSectionArea * relSpeed * relSpeed * 0.5 * this.airDensity * tumble * 0.3;
            fb.vy -= (liftForce / fb.mass) * dt;

            // Gravity
            fb.vy += 9.81 * fb.mass * 200 * dt;

            // Wind gusts & turbulence
            const turbX = noise.noise2D(fb.x * this.turbulenceScale, time * 2) * 60;
            const turbY = noise2.noise2D(fb.y * this.turbulenceScale, time * 2 + 500) * 30;
            fb.vx += turbX * dt;
            fb.vy += turbY * dt;

            // Thermal columns from burning trees
            for (let tree of trees) {
                if (!tree.burning) continue;
                const dx = fb.x - tree.x;
                const dy = fb.y - (tree.baseY - tree.height * 0.5);
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < this.thermalRadius * tree.burnIntensity && d > 5) {
                    const thermalStrength = (1 - d / (this.thermalRadius * tree.burnIntensity)) * this.thermalColumnStrength * tree.burnIntensity;
                    fb.vy -= thermalStrength * 50 * dt;
                    fb.vx += (dx / d) * thermalStrength * 10 * dt;
                }
            }

            // Integrate position
            fb.x += fb.vx * dt;
            fb.y += fb.vy * dt;

            // Ground collision
            if (fb.y >= simulationState.groundLevel + 10) {
                fb.y = simulationState.groundLevel + 10;
                fb.landed = true;
                fb.active = false;

                // Try to ignite nearby tree
                if (fb.temperature > 400) {
                    for (let tree of trees) {
                        if (tree.burning || tree.burned) continue;
                        const d = dist(fb.x, fb.y, tree.x, tree.baseY);
                        if (d < tree.width * 2) {
                            if (Math.random() < this.landingIgnitionChance * (fb.temperature / 1200)) {
                                tree.ignite();
                                simulationState.spreadCount++;
                                const emDist = dist(campfire ? campfire.x : 0, campfire ? campfire.y : 0, tree.x, tree.baseY);
                                if (emDist > 250) {
                                    showMessage('🔥', '遠距離飛び火！', `${Math.round(emDist)}m先の木に着火！林野火災が拡大中！`);
                                }
                            }
                            break;
                        }
                    }

                    // Ignite grass
                    for (let blade of grassBlades) {
                        if (!blade.burning && !blade.burned && dist(fb.x, fb.y, blade.x, blade.y) < 15) {
                            blade.burning = true;
                            break;
                        }
                    }
                }
            }

            // Off screen
            if (fb.x < -100 || fb.x > simulationState.canvasWidth + 100 || fb.y < -200) {
                fb.active = false;
            }
        }
    }

    render(ctx, time) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        for (let fb of this.firebrands) {
            if (!fb.active) continue;

            const tempFactor = clamp((fb.temperature - 200) / 1000, 0, 1);
            const baseAlpha = tempFactor * 0.9;

            // Trail
            if (fb.trail.length > 1) {
                for (let t = 1; t < fb.trail.length; t++) {
                    const trailAlpha = (t / fb.trail.length) * baseAlpha * 0.3;
                    const trailTemp = fb.trail[t].temp / 1200;
                    ctx.strokeStyle = `rgba(255,${Math.round(150 * trailTemp)},${Math.round(30 * trailTemp)},${trailAlpha})`;
                    ctx.lineWidth = fb.glowSize * (t / fb.trail.length) * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(fb.trail[t - 1].x, fb.trail[t - 1].y);
                    ctx.lineTo(fb.trail[t].x, fb.trail[t].y);
                    ctx.stroke();
                }
            }

            // Main glow
            const tumbleFlicker = Math.sin(fb.age * fb.tumbleRate + fb.tumblePhase) * 0.2 + 0.8;
            const glowR = fb.glowSize * tumbleFlicker * tempFactor;

            const glow = ctx.createRadialGradient(fb.x, fb.y, 0, fb.x, fb.y, glowR * 4);
            glow.addColorStop(0, `rgba(255,255,200,${baseAlpha * tumbleFlicker})`);
            glow.addColorStop(0.2, `rgba(255,200,80,${baseAlpha * 0.7 * tumbleFlicker})`);
            glow.addColorStop(0.5, `rgba(255,100,20,${baseAlpha * 0.3})`);
            glow.addColorStop(1, 'rgba(255,50,0,0)');
            ctx.fillStyle = glow;
            ctx.fillRect(fb.x - glowR * 4, fb.y - glowR * 4, glowR * 8, glowR * 8);

            // Bright core
            ctx.fillStyle = `rgba(255,255,230,${baseAlpha * tumbleFlicker * 0.8})`;
            ctx.beginPath();
            ctx.arc(fb.x, fb.y, glowR * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

const firebrandPhysics = new FirebrandPhysics();

// =====================================================
// PART 28-J: 動物・鳥の避難アニメーション
// =====================================================

class WildlifeSystem {
    constructor() {
        this.birds = [];
        this.maxBirds = 10;
        this.animals = [];
        this.maxAnimals = 2;
        this.panicRadius = 200;
        this.initialized = false;
    }

    initialize() {
        this.birds = [];
        this.animals = [];
        this.initialized = true;

        // Perching birds
        for (let i = 0; i < 4; i++) {
            const tree = trees[randInt(0, trees.length - 1)];
            if (!tree) continue;
            this.birds.push({
                x: tree.x + randFloat(-tree.width * 0.3, tree.width * 0.3),
                y: tree.baseY - tree.height * randFloat(0.5, 0.9),
                vx: 0,
                vy: 0,
                state: 'perching',
                perchTree: tree,
                wingPhase: Math.random() * Math.PI * 2,
                wingSpeed: randFloat(8, 15),
                size: randFloat(3, 7),
                color: { r: randInt(20, 60), g: randInt(20, 50), b: randInt(20, 40) },
                panicTimer: 0,
                fleeAngle: 0,
                bobPhase: Math.random() * Math.PI * 2
            });
        }

        // Ground animals (deer silhouettes)
        for (let i = 0; i < 1; i++) {
            this.animals.push({
                x: randFloat(100, simulationState.canvasWidth - 100),
                y: simulationState.groundLevel + randFloat(-5, 5),
                vx: 0,
                vy: 0,
                state: 'idle',
                size: randFloat(15, 30),
                legPhase: Math.random() * Math.PI * 2,
                legSpeed: 0,
                headBob: 0,
                panicTimer: 0,
                direction: Math.random() < 0.5 ? 1 : -1,
                type: 'deer'
            });
        }
    }

    update(dt, time) {
        if (!this.initialized) return;

        // Find nearest fire source
        let fireNear = false;
        let fireSources = [];
        if (campfire && campfire.active) {
            fireSources.push({ x: campfire.x, y: campfire.y, intensity: campfire.intensity });
        }
        for (let tree of trees) {
            if (tree.burning) {
                fireSources.push({ x: tree.x, y: tree.baseY, intensity: tree.burnIntensity });
            }
        }

        // Update birds
        for (let bird of this.birds) {
            let scared = false;
            let scareX = 0, scareY = 0;

            for (let src of fireSources) {
                const d = dist(bird.x, bird.y, src.x, src.y);
                if (d < this.panicRadius * src.intensity) {
                    scared = true;
                    scareX += (bird.x - src.x) / Math.max(d, 1) * src.intensity;
                    scareY += (bird.y - src.y) / Math.max(d, 1) * src.intensity;
                }
            }

            if (bird.state === 'perching') {
                // Bob gently while perching
                bird.bobPhase += dt * 2;
                bird.y += Math.sin(bird.bobPhase) * 0.3;

                // Check if perch tree is burning
                if (bird.perchTree && bird.perchTree.burning) {
                    scared = true;
                    scareX = (bird.x - bird.perchTree.x);
                    scareY = -50;
                }

                if (scared) {
                    bird.state = 'fleeing';
                    bird.panicTimer = randFloat(5, 15);
                    const scareLen = Math.sqrt(scareX * scareX + scareY * scareY) || 1;
                    bird.fleeAngle = Math.atan2(-1, scareX / scareLen);
                    bird.vx = Math.cos(bird.fleeAngle) * randFloat(80, 200);
                    bird.vy = -randFloat(40, 120);
                    bird.wingSpeed = randFloat(12, 22);
                }
            } else if (bird.state === 'fleeing') {
                bird.panicTimer -= dt;
                bird.wingPhase += dt * bird.wingSpeed;

                // Panic flight physics
                bird.vx += (Math.cos(bird.fleeAngle) * 120 + simulationState.windX * 2) * dt;
                bird.vy += (-80 + Math.sin(time * 3 + bird.wingPhase) * 40) * dt;

                // Flock behavior - steer towards average flee direction
                let avgFleeX = 0, avgFleeY = 0, fleeCount = 0;
                for (let other of this.birds) {
                    if (other === bird || other.state !== 'fleeing') continue;
                    const od = dist(bird.x, bird.y, other.x, other.y);
                    if (od < 100) {
                        avgFleeX += other.vx;
                        avgFleeY += other.vy;
                        fleeCount++;
                    }
                }
                if (fleeCount > 0) {
                    avgFleeX /= fleeCount;
                    avgFleeY /= fleeCount;
                    bird.vx = lerp(bird.vx, avgFleeX, 0.02);
                    bird.vy = lerp(bird.vy, avgFleeY, 0.02);
                }

                // Damping
                bird.vx *= 0.995;
                bird.vy *= 0.995;

                // Apply velocity
                bird.x += bird.vx * dt;
                bird.y += bird.vy * dt;

                // Keep on screen vertically (ceiling bounce)
                if (bird.y < 10) { bird.y = 10; bird.vy = Math.abs(bird.vy) * 0.3; }

                // Off screen - wrap or remove
                if (bird.x > simulationState.canvasWidth + 50) {
                    bird.x = -40;
                } else if (bird.x < -50) {
                    bird.x = simulationState.canvasWidth + 40;
                }

                if (bird.panicTimer <= 0 && fireSources.length === 0) {
                    bird.state = 'circling';
                    bird.panicTimer = randFloat(3, 8);
                }
            } else if (bird.state === 'circling') {
                bird.wingPhase += dt * bird.wingSpeed * 0.7;
                bird.panicTimer -= dt;

                const circleAngle = time * 0.8 + bird.wingPhase * 0.1;
                const circleRadius = 60 + Math.sin(time * 0.3) * 20;
                const targetX = bird.x + Math.cos(circleAngle) * 2;
                const targetY = simulationState.horizonLevel * 0.5 + Math.sin(circleAngle * 0.5) * 30;

                bird.vx = lerp(bird.vx, (targetX - bird.x) * 2, dt * 2);
                bird.vy = lerp(bird.vy, (targetY - bird.y) * 2, dt * 2);
                bird.x += bird.vx * dt;
                bird.y += bird.vy * dt;

                // Re-panic if fire nearby
                if (scared) {
                    bird.state = 'fleeing';
                    bird.panicTimer = randFloat(5, 12);
                    bird.fleeAngle = Math.atan2(scareY, scareX) + Math.PI;
                    bird.vx += Math.cos(bird.fleeAngle) * 100;
                    bird.vy -= 60;
                }

                if (bird.panicTimer <= 0) {
                    // Try to find a safe tree to perch on
                    let safest = null;
                    let maxDist = 0;
                    for (let tree of trees) {
                        if (tree.burning || tree.burned) continue;
                        let minFireDist = Infinity;
                        for (let src of fireSources) {
                            minFireDist = Math.min(minFireDist, dist(tree.x, tree.baseY, src.x, src.y));
                        }
                        if (minFireDist > maxDist) {
                            maxDist = minFireDist;
                            safest = tree;
                        }
                    }
                    if (safest && maxDist > this.panicRadius) {
                        bird.perchTree = safest;
                        bird.state = 'landing';
                        bird.panicTimer = 2;
                    } else {
                        bird.panicTimer = randFloat(3, 6);
                    }
                }
            } else if (bird.state === 'landing') {
                bird.wingPhase += dt * bird.wingSpeed * 0.5;
                bird.panicTimer -= dt;

                const targetX = bird.perchTree.x + randFloat(-bird.perchTree.width * 0.2, bird.perchTree.width * 0.2);
                const targetY = bird.perchTree.baseY - bird.perchTree.height * randFloat(0.6, 0.85);

                bird.vx = lerp(bird.vx, (targetX - bird.x) * 3, dt * 4);
                bird.vy = lerp(bird.vy, (targetY - bird.y) * 3, dt * 4);
                bird.x += bird.vx * dt;
                bird.y += bird.vy * dt;

                if (dist(bird.x, bird.y, targetX, targetY) < 5 || bird.panicTimer <= 0) {
                    bird.state = 'perching';
                    bird.vx = 0;
                    bird.vy = 0;
                    bird.x = targetX;
                    bird.y = targetY;
                }

                if (scared) {
                    bird.state = 'fleeing';
                    bird.panicTimer = randFloat(5, 10);
                    bird.fleeAngle = Math.atan2(-1, scareX);
                    bird.vx = Math.cos(bird.fleeAngle) * 150;
                    bird.vy = -100;
                }
            }
        }

        // Spawn additional panicked birds during wildfire
        if (simulationState.totalBurning > 2 && this.birds.length < this.maxBirds && Math.random() < 0.01 * dt * 60) {
            const side = Math.random() < 0.5 ? -20 : simulationState.canvasWidth + 20;
            this.birds.push({
                x: side,
                y: randFloat(20, simulationState.horizonLevel * 0.6),
                vx: side < 0 ? randFloat(50, 120) : randFloat(-120, -50),
                vy: randFloat(-30, 30),
                state: 'fleeing',
                perchTree: null,
                wingPhase: Math.random() * Math.PI * 2,
                wingSpeed: randFloat(10, 18),
                size: randFloat(3, 6),
                color: { r: randInt(20, 60), g: randInt(20, 50), b: randInt(20, 40) },
                panicTimer: randFloat(8, 20),
                fleeAngle: side < 0 ? randFloat(-0.5, 0.5) : randFloat(Math.PI - 0.5, Math.PI + 0.5),
                bobPhase: Math.random() * Math.PI * 2
            });
        }

        // Update animals
        for (let animal of this.animals) {
            let animalScared = false;
            let nearestFireDist = Infinity;
            let nearestFireX = 0;

            for (let src of fireSources) {
                const d = dist(animal.x, animal.y, src.x, src.y);
                if (d < this.panicRadius * 1.5 * src.intensity && d < nearestFireDist) {
                    animalScared = true;
                    nearestFireDist = d;
                    nearestFireX = src.x;
                }
            }

            if (animal.state === 'idle') {
                // Gentle grazing motion
                animal.headBob = Math.sin(time * 1.5 + animal.legPhase) * 3;
                animal.legPhase += dt * 0.5;

                // Occasional random movement
                if (Math.random() < 0.005) {
                    animal.direction = Math.random() < 0.5 ? 1 : -1;
                    animal.state = 'walking';
                    animal.legSpeed = 3;
                }

                if (animalScared) {
                    animal.state = 'running';
                    animal.direction = animal.x < nearestFireX ? -1 : 1;
                    animal.panicTimer = randFloat(5, 15);
                    animal.legSpeed = 12;
                }
            } else if (animal.state === 'walking') {
                animal.legPhase += dt * animal.legSpeed;
                animal.x += animal.direction * 20 * dt;
                animal.headBob = Math.sin(animal.legPhase) * 2;

                if (Math.random() < 0.02) {
                    animal.state = 'idle';
                    animal.legSpeed = 0;
                }

                if (animalScared) {
                    animal.state = 'running';
                    animal.direction = animal.x < nearestFireX ? -1 : 1;
                    animal.panicTimer = randFloat(5, 15);
                    animal.legSpeed = 14;
                }
            } else if (animal.state === 'running') {
                animal.panicTimer -= dt;
                animal.legPhase += dt * animal.legSpeed;
                animal.headBob = Math.sin(animal.legPhase * 2) * 5;

                // Running speed increases with panic
                const panicFactor = clamp(1 - nearestFireDist / (this.panicRadius * 2), 0.3, 1.0);
                const runSpeed = lerp(60, 180, panicFactor);
                animal.x += animal.direction * runSpeed * dt;

                // Bounce vertically when running
                animal.y = simulationState.groundLevel + Math.abs(Math.sin(animal.legPhase * 2)) * (-8 * panicFactor);

                // Update flee direction
                if (animalScared) {
                    animal.direction = animal.x < nearestFireX ? -1 : 1;
                    animal.panicTimer = Math.max(animal.panicTimer, 3);
                }

                // Wrap around screen
                if (animal.x > simulationState.canvasWidth + 60) {
                    animal.x = -50;
                } else if (animal.x < -60) {
                    animal.x = simulationState.canvasWidth + 50;
                }

                if (animal.panicTimer <= 0 && !animalScared) {
                    animal.state = 'idle';
                    animal.legSpeed = 0;
                    animal.y = simulationState.groundLevel;
                }
            }
        }
    }

    render(ctx, time) {
        if (!this.initialized) return;

        // Render birds
        for (let bird of this.birds) {
            ctx.save();
            ctx.translate(bird.x, bird.y);

            const isFlying = bird.state !== 'perching';
            const wingAngle = isFlying ? Math.sin(bird.wingPhase) * 0.8 : Math.sin(time * 0.5 + bird.bobPhase) * 0.05;
            const bodyAngle = isFlying ? Math.atan2(bird.vy, bird.vx) * 0.1 : 0;

            ctx.rotate(bodyAngle);

            const s = bird.size;
            const c = bird.color;

            // Body
            ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 1.2, s * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            const headSize = s * 0.4;
            ctx.beginPath();
            ctx.arc(s * 0.8, -s * 0.15, headSize, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(s * 1.0, -s * 0.2, headSize * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(s * 1.05, -s * 0.2, headSize * 0.15, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = `rgb(${Math.min(255, c.r + 120)},${Math.min(255, c.g + 60)},${c.b})`;
            ctx.beginPath();
            ctx.moveTo(s * 1.2, -s * 0.1);
            ctx.lineTo(s * 1.6, -s * 0.05);
            ctx.lineTo(s * 1.2, s * 0.05);
            ctx.closePath();
            ctx.fill();

            // Wings
            ctx.fillStyle = `rgb(${Math.max(0, c.r - 10)},${Math.max(0, c.g - 10)},${Math.max(0, c.b - 5)})`;

            // Left wing
            ctx.save();
            ctx.translate(0, -s * 0.2);
            ctx.rotate(-wingAngle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-s * 0.3, -s * 1.2, -s * 1.5, -s * 0.8);
            ctx.quadraticCurveTo(-s * 0.8, -s * 0.3, 0, 0);
            ctx.fill();
            ctx.restore();

            // Right wing
            ctx.save();
            ctx.translate(0, s * 0.2);
            ctx.rotate(wingAngle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-s * 0.3, s * 1.2, -s * 1.5, s * 0.8);
            ctx.quadraticCurveTo(-s * 0.8, s * 0.3, 0, 0);
            ctx.fill();
            ctx.restore();

            // Tail
            ctx.fillStyle = `rgb(${Math.max(0, c.r - 5)},${Math.max(0, c.g - 5)},${c.b})`;
            ctx.beginPath();
            ctx.moveTo(-s * 0.8, 0);
            ctx.lineTo(-s * 1.8, -s * 0.3);
            ctx.lineTo(-s * 1.6, 0);
            ctx.lineTo(-s * 1.8, s * 0.3);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Render animals
        for (let animal of this.animals) {
            this._renderDeer(ctx, animal, time);
        }
    }

    _renderDeer(ctx, animal, time) {
        ctx.save();
        ctx.translate(animal.x, animal.y);
        ctx.scale(animal.direction, 1);

        const s = animal.size;
        const isRunning = animal.state === 'running';
        const legAngle = Math.sin(animal.legPhase) * (isRunning ? 0.7 : 0.15);
        const bodyBob = isRunning ? Math.abs(Math.sin(animal.legPhase * 2)) * 3 : 0;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, 3, s * 0.8, s * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs (back pair)
        const legColor = 'rgb(90,65,40)';
        ctx.strokeStyle = legColor;
        ctx.lineWidth = s * 0.08;
        ctx.lineCap = 'round';

        // Back left leg
        ctx.beginPath();
        ctx.moveTo(-s * 0.3, -s * 0.15 - bodyBob);
        const bl1y = s * 0.3;
        const bl1x = -s * 0.3 + Math.sin(legAngle + Math.PI) * s * 0.3;
        ctx.lineTo(bl1x, bl1y - bodyBob);
        ctx.lineTo(bl1x + Math.sin(legAngle + Math.PI) * s * 0.1, 0);
        ctx.stroke();

        // Back right leg
        ctx.beginPath();
        ctx.moveTo(-s * 0.25, -s * 0.15 - bodyBob);
        const br1x = -s * 0.25 + Math.sin(legAngle) * s * 0.3;
        ctx.lineTo(br1x, bl1y - bodyBob);
        ctx.lineTo(br1x + Math.sin(legAngle) * s * 0.1, 0);
        ctx.stroke();

        // Body
        ctx.fillStyle = 'rgb(120,85,50)';
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.3 - bodyBob, s * 0.55, s * 0.22, -0.05, 0, Math.PI * 2);
        ctx.fill();

        // Body highlights
        ctx.fillStyle = 'rgba(160,120,70,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.35 - bodyBob, s * 0.4, s * 0.12, -0.05, 0, Math.PI * 2);
        ctx.fill();

        // Front legs
        ctx.strokeStyle = legColor;
        // Front left
        ctx.beginPath();
        ctx.moveTo(s * 0.3, -s * 0.15 - bodyBob);
        const fl1x = s * 0.3 + Math.sin(legAngle) * s * 0.3;
        ctx.lineTo(fl1x, bl1y - bodyBob);
        ctx.lineTo(fl1x + Math.sin(legAngle) * s * 0.1, 0);
        ctx.stroke();

        // Front right
        ctx.beginPath();
        ctx.moveTo(s * 0.35, -s * 0.15 - bodyBob);
        const fr1x = s * 0.35 + Math.sin(legAngle + Math.PI) * s * 0.3;
        ctx.lineTo(fr1x, bl1y - bodyBob);
        ctx.lineTo(fr1x + Math.sin(legAngle + Math.PI) * s * 0.1, 0);
        ctx.stroke();

        // Hooves
        const hoofPositions = [
            { x: bl1x + Math.sin(legAngle + Math.PI) * s * 0.1, y: 0 },
            { x: br1x + Math.sin(legAngle) * s * 0.1, y: 0 },
            { x: fl1x + Math.sin(legAngle) * s * 0.1, y: 0 },
            { x: fr1x + Math.sin(legAngle + Math.PI) * s * 0.1, y: 0 }
        ];
        ctx.fillStyle = 'rgb(40,30,20)';
        for (let hoof of hoofPositions) {
            ctx.beginPath();
            ctx.arc(hoof.x, Math.min(hoof.y, 0) - bodyBob, s * 0.04, 0, Math.PI * 2);
            ctx.fill();
        }

        // Neck
        const neckStartX = s * 0.4;
        const neckStartY = -s * 0.4 - bodyBob;
        const neckEndX = s * 0.6;
        const neckEndY = -s * 0.75 - bodyBob + animal.headBob;

        ctx.fillStyle = 'rgb(115,80,48)';
        ctx.beginPath();
        ctx.moveTo(neckStartX - s * 0.08, neckStartY);
        ctx.quadraticCurveTo(neckStartX + s * 0.1, (neckStartY + neckEndY) / 2, neckEndX - s * 0.05, neckEndY);
        ctx.lineTo(neckEndX + s * 0.05, neckEndY);
        ctx.quadraticCurveTo(neckStartX + s * 0.15, (neckStartY + neckEndY) / 2, neckStartX + s * 0.08, neckStartY);
        ctx.closePath();
        ctx.fill();

        // Head
        const headX = neckEndX + s * 0.1;
        const headY = neckEndY - s * 0.05;

        ctx.fillStyle = 'rgb(110,78,45)';
        ctx.beginPath();
        ctx.ellipse(headX, headY, s * 0.15, s * 0.1, -0.3, 0, Math.PI * 2);
        ctx.fill();

        // Nose/muzzle
        ctx.fillStyle = 'rgb(90,65,38)';
        ctx.beginPath();
        ctx.ellipse(headX + s * 0.12, headY + s * 0.02, s * 0.07, s * 0.06, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eye
        ctx.fillStyle = 'rgb(30,20,10)';
        ctx.beginPath();
        ctx.arc(headX + s * 0.04, headY - s * 0.04, s * 0.025, 0, Math.PI * 2);
        ctx.fill();
        // Eye glint
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(headX + s * 0.05, headY - s * 0.05, s * 0.01, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.fillStyle = 'rgb(105,75,42)';
        ctx.beginPath();
        ctx.ellipse(headX - s * 0.02, headY - s * 0.14, s * 0.03, s * 0.07, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(headX + s * 0.04, headY - s * 0.14, s * 0.03, s * 0.07, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Inner ears
        ctx.fillStyle = 'rgba(180,140,100,0.5)';
        ctx.beginPath();
        ctx.ellipse(headX - s * 0.02, headY - s * 0.13, s * 0.015, s * 0.04, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // Antlers (for some)
        if (animal.size > 20) {
            ctx.strokeStyle = 'rgb(160,130,80)';
            ctx.lineWidth = s * 0.04;
            ctx.lineCap = 'round';

            // Left antler
            ctx.beginPath();
            ctx.moveTo(headX - s * 0.02, headY - s * 0.15);
            ctx.quadraticCurveTo(headX - s * 0.15, headY - s * 0.4, headX - s * 0.1, headY - s * 0.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(headX - s * 0.08, headY - s * 0.32);
            ctx.lineTo(headX - s * 0.18, headY - s * 0.38);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(headX - s * 0.06, headY - s * 0.25);
            ctx.lineTo(headX + s * 0.02, headY - s * 0.33);
            ctx.stroke();

            // Right antler
            ctx.beginPath();
            ctx.moveTo(headX + s * 0.04, headY - s * 0.15);
            ctx.quadraticCurveTo(headX + s * 0.2, headY - s * 0.4, headX + s * 0.15, headY - s * 0.48);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(headX + s * 0.13, headY - s * 0.3);
            ctx.lineTo(headX + s * 0.22, headY - s * 0.36);
            ctx.stroke();
        }

        // Tail
        const tailWag = Math.sin(time * (isRunning ? 8 : 2) + animal.legPhase) * 0.3;
        ctx.fillStyle = 'rgb(200,180,140)';
        ctx.save();
        ctx.translate(-s * 0.5, -s * 0.35 - bodyBob);
        ctx.rotate(tailWag);
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.06, s * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // White belly marking
        ctx.fillStyle = 'rgba(200,180,140,0.25)';
        ctx.beginPath();
        ctx.ellipse(0, -s * 0.2 - bodyBob, s * 0.35, s * 0.1, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

const wildlife = new WildlifeSystem();

class PostProcessing {
    constructor() {
        this.vignetteStrength = 0.3;
        this.chromaticAberration = 0;
        this.heatDistortionStrength = 0;
        this.filmGrain = 0;
        this.colorGrading = {
            shadows: { r: 0, g: 0, b: 5 },
            midtones: { r: 0, g: 0, b: 0 },
            highlights: { r: 0, g: -2, b: -5 }
        };
        this.sharpenStrength = 0;
        this.bloomThreshold = 0.7;
        this.bloomIntensity = 0.1;
        this.fireflyParticles = [];
        this.maxFireflies = 8;
        this.lensFlares = [];
        this.dustMotes = [];
        this.maxDustMotes = 10;
        this._initDustMotes();
    }

    _initDustMotes() {
        this.dustMotes = [];
        for (let i = 0; i < this.maxDustMotes; i++) {
            this.dustMotes.push({
                x: Math.random() * 2000,
                y: Math.random() * 1200,
                vx: randFloat(-5, 5),
                vy: randFloat(-3, 3),
                size: randFloat(0.5, 2.5),
                opacity: randFloat(0.05, 0.2),
                phase: Math.random() * Math.PI * 2,
                driftSpeed: randFloat(0.5, 2),
                shimmerSpeed: randFloat(1, 5)
            });
        }
    }

    update(dt, time) {
        const fireInfluence = simulationState.skyFireInfluence;
        const burning = simulationState.totalBurning;

        // Adjust effects based on fire state
        this.heatDistortionStrength = lerp(0, 0.3, fireInfluence);
        this.chromaticAberration = lerp(0, 1.5, clamp(fireInfluence * 1.5, 0, 1));
        this.vignetteStrength = lerp(0.3, 0.6, fireInfluence);
        this.filmGrain = lerp(0.02, 0.05, fireInfluence);

        // Color grading shifts with fire
        this.colorGrading.shadows.r = Math.round(lerp(0, 15, fireInfluence));
        this.colorGrading.highlights.r = Math.round(lerp(0, 10, fireInfluence));
        this.colorGrading.highlights.b = Math.round(lerp(-5, -20, fireInfluence));

        // Fireflies (only when no fire)
        if (burning === 0 && !(campfire && campfire.active)) {
            if (this.fireflyParticles.length < this.maxFireflies && Math.random() < 0.02) {
                this.fireflyParticles.push({
                    x: randFloat(0, simulationState.canvasWidth),
                    y: randFloat(simulationState.groundLevel - 100, simulationState.groundLevel + 20),
                    phase: Math.random() * Math.PI * 2,
                    glowSpeed: randFloat(1, 4),
                    driftPhase: Math.random() * Math.PI * 2,
                    driftSpeed: randFloat(0.3, 1.5),
                    radius: randFloat(15, 40),
                    brightness: 0,
                    maxBrightness: randFloat(0.3, 0.8),
                    life: randFloat(5, 15)
                });
            }
        }

        for (let i = this.fireflyParticles.length - 1; i >= 0; i--) {
            const ff = this.fireflyParticles[i];
            ff.life -= dt;
            ff.phase += dt * ff.glowSpeed;
            ff.brightness = ff.maxBrightness * Math.max(0, Math.sin(ff.phase)) * Math.min(1, ff.life);
            ff.x += Math.sin(time * ff.driftSpeed + ff.driftPhase) * 10 * dt;
            ff.y += Math.cos(time * ff.driftSpeed * 0.7 + ff.driftPhase) * 5 * dt;
            ff.x += simulationState.windX * 0.1 * dt;

            if (ff.life <= 0 || burning > 0) {
                this.fireflyParticles.splice(i, 1);
            }
        }

        // Dust motes
        for (let mote of this.dustMotes) {
            mote.x += (mote.vx + simulationState.windX * 0.3) * dt;
            mote.y += (mote.vy + Math.sin(time * mote.driftSpeed + mote.phase) * 3) * dt;
            mote.opacity = (0.05 + Math.sin(time * mote.shimmerSpeed + mote.phase) * 0.05) * (1 + fireInfluence * 2);

            if (mote.x > simulationState.canvasWidth + 20) mote.x = -10;
            if (mote.x < -20) mote.x = simulationState.canvasWidth + 10;
            if (mote.y > simulationState.canvasHeight + 10) mote.y = -5;
            if (mote.y < -10) mote.y = simulationState.canvasHeight + 5;
        }

        // Lens flare from major fire
        this.lensFlares = [];
        if (fireInfluence > 0.3) {
            let brightestX = campfire ? campfire.x : simulationState.canvasWidth * 0.3;
            let brightestY = simulationState.groundLevel;
            let brightestIntensity = campfire ? campfire.intensity : 0;

            for (let tree of trees) {
                if (tree.burning && tree.burnIntensity > brightestIntensity) {
                    brightestIntensity = tree.burnIntensity;
                    brightestX = tree.x;
                    brightestY = tree.baseY - tree.height * 0.5;
                }
            }

            if (brightestIntensity > 0.3) {
                const cx = simulationState.canvasWidth / 2;
                const cy = simulationState.canvasHeight / 2;
                const dx = brightestX - cx;
                const dy = brightestY - cy;

                const flareCount = 5;
                for (let f = 0; f < flareCount; f++) {
                    const t = (f + 1) / (flareCount + 1) * 2 - 1;
                    this.lensFlares.push({
                        x: cx - dx * t,
                        y: cy - dy * t,
                        radius: (20 + f * 10) * brightestIntensity,
                        alpha: 0.03 * brightestIntensity * (1 - Math.abs(t) * 0.5),
                        color: f % 2 === 0
                            ? { r: 255, g: 180, b: 80 }
                            : { r: 255, g: 120, b: 200 }
                    });
                }
            }
        }
    }

    render(ctx, time) {
        const w = simulationState.canvasWidth;
        const h = simulationState.canvasHeight;

        // === Dust motes ===
        for (let mote of this.dustMotes) {
            const lightAt = lighting.getLightAt(mote.x, mote.y);
            const lightBoost = Math.max(lightAt.r, lightAt.g, lightAt.b);
            const finalOpacity = mote.opacity * (0.5 + lightBoost * 0.5);
            if (finalOpacity < 0.01) continue;

            ctx.fillStyle = `rgba(220,215,200,${finalOpacity})`;
            ctx.beginPath();
            ctx.arc(mote.x, mote.y, mote.size, 0, Math.PI * 2);
            ctx.fill();
        }

        // === Fireflies ===
        if (this.fireflyParticles.length > 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let ff of this.fireflyParticles) {
                if (ff.brightness < 0.01) continue;
                const glow = ctx.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, ff.radius * ff.brightness);
                glow.addColorStop(0, `rgba(180,255,100,${ff.brightness * 0.8})`);
                glow.addColorStop(0.3, `rgba(150,230,80,${ff.brightness * 0.4})`);
                glow.addColorStop(1, 'rgba(100,200,50,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(ff.x, ff.y, ff.radius * ff.brightness, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `rgba(200,255,150,${ff.brightness})`;
                ctx.beginPath();
                ctx.arc(ff.x, ff.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // === Lens flares ===
        if (this.lensFlares.length > 0) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let flare of this.lensFlares) {
                const grad = ctx.createRadialGradient(flare.x, flare.y, 0, flare.x, flare.y, flare.radius);
                grad.addColorStop(0, `rgba(${flare.color.r},${flare.color.g},${flare.color.b},${flare.alpha})`);
                grad.addColorStop(0.5, `rgba(${flare.color.r},${flare.color.g},${flare.color.b},${flare.alpha * 0.3})`);
                grad.addColorStop(1, `rgba(${flare.color.r},${flare.color.g},${flare.color.b},0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(flare.x, flare.y, flare.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // === Film grain ===
        if (this.filmGrain > 0.005) {
            ctx.save();
            ctx.globalAlpha = this.filmGrain;
            const grainSize = 3;
            const grainCols = Math.ceil(w / grainSize / 4);
            const grainRows = Math.ceil(h / grainSize / 4);
            for (let gy = 0; gy < grainRows; gy++) {
                for (let gx = 0; gx < grainCols; gx++) {
                    const v = Math.random() * 60;
                    ctx.fillStyle = `rgb(${v},${v},${v})`;
                    ctx.fillRect(gx * grainSize * 4, gy * grainSize * 4, grainSize, grainSize);
                }
            }
            ctx.restore();
        }

        // === Vignette ===
        if (this.vignetteStrength > 0.01) {
            const vGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.75);
            vGrad.addColorStop(0, 'rgba(0,0,0,0)');
            vGrad.addColorStop(0.6, `rgba(0,0,0,${this.vignetteStrength * 0.3})`);
            vGrad.addColorStop(1, `rgba(0,0,0,${this.vignetteStrength})`);
            ctx.fillStyle = vGrad;
            ctx.fillRect(0, 0, w, h);
        }

        // === Heat distortion hint (subtle color shift) ===
        if (this.heatDistortionStrength > 0.01) {
            ctx.save();
            ctx.globalCompositeOperation = 'overlay';
            const heatNoise = noise.noise2D(time * 2, 0) * this.heatDistortionStrength;
            ctx.fillStyle = `rgba(255,200,100,${heatNoise * 0.03})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();
        }
    }
}

const postProcessing = new PostProcessing();

// =====================================================
// PART 29: 拡張済みメインアップデートループ (上書き)
// =====================================================

// Store original update/render for reference
const _originalUpdate = update;
const _originalRender = render;

// Override update with enhanced version
let _enhancedFrameCount = 0;
function enhancedUpdate(dt, time) {
    if (!simulationState.running) return;
    _enhancedFrameCount++;

    simulationState.deltaTime = dt;
    simulationState.time = time;
    simulationState.elapsedTime += dt;

    // Wind system
    if (windSystem) {
        windSystem.update(dt, time);
        simulationState.windX = windSystem.getWindX();
        simulationState.windY = windSystem.getWindY();
    }

    // Campfire
    if (campfire) campfire.update(dt);

    // Trees
    for (let tree of trees) tree.update(dt, time);

    // Fluid smoke solver - every 4th frame only
    if (_enhancedFrameCount % 4 === 0) {
        if (campfire && campfire.active) {
            const gx = Math.floor(campfire.x / fluidSolver.cellSize);
            const gy = Math.floor(campfire.y / fluidSolver.cellSize);
            fluidSolver.addSource(gx, gy - 2, campfire.intensity * 3, campfire.intensity * 5,
                simulationState.windX * 0.01, -campfire.intensity * 0.05, 2);
        }
        fluidSolver.step(Math.min(dt * 4, 0.1));
    }

    // Lighting - only add lights, skip expensive lightMap computation
    lighting.clearLights();
    if (campfire && campfire.active) {
        lighting.addLight(campfire.x, campfire.y, 200 * campfire.intensity, campfire.intensity,
            1800, 0.3, 8);
    }
    let burningLightCount = 0;
    for (let tree of trees) {
        if (tree.burning && burningLightCount < 6) {
            lighting.addLight(tree.x, tree.baseY - tree.height * 0.4,
                150 * tree.burnIntensity, tree.burnIntensity * 0.8,
                1500 + tree.burnIntensity * 500, 0.25, 6);
            burningLightCount++;
        }
    }

    // Cloud system - every 2nd frame
    if (_enhancedFrameCount % 2 === 0) cloudSystem.update(dt * 2, time);

    // Visual sound - every 3rd frame
    if (_enhancedFrameCount % 3 === 0) visualSound.update(dt * 3, time);

    // Firebrand physics - reduced rate
    const totalWind = Math.sqrt(simulationState.windX ** 2 + simulationState.windY ** 2);
    if (campfire && campfire.active && totalWind > 5 && Math.random() < 0.008 * campfire.intensity) {
        firebrandPhysics.createFirebrand(
            campfire.x + randFloat(-10, 10),
            campfire.y - randFloat(5, 20),
            campfire.intensity
        );
    }
    if (_enhancedFrameCount % 2 === 0) {
        for (let tree of trees) {
            if (tree.burning && Math.random() < 0.005 * tree.burnIntensity * (totalWind / 10)) {
                firebrandPhysics.createFirebrand(
                    tree.x + randFloat(-tree.width * 0.3, tree.width * 0.3),
                    tree.baseY - tree.height * randFloat(0.3, 0.8),
                    tree.burnIntensity
                );
            }
        }
    }
    firebrandPhysics.update(dt, time);

    // Wildlife - every 3rd frame
    if (_enhancedFrameCount % 3 === 0) wildlife.update(dt * 3, time);

    // Post processing - every 4th frame
    if (_enhancedFrameCount % 4 === 0) postProcessing.update(dt * 4, time);

    // Emit particles
    emitCampfireParticles(dt);
    emitTreeFireParticles(dt);

    // Update particle pools
    fireParticles.updateAll(dt);
    smokeParticles.updateAll(dt);
    emberParticles.updateAll(dt);
    ashParticles.updateAll(dt);

    // Fire spread - every 2nd frame
    if (_enhancedFrameCount % 2 === 0) updateFireSpread(dt * 2);

    // UI updates - every 10th frame
    if (_enhancedFrameCount % 10 === 0) updateUI();
}

// Override render with enhanced version
function enhancedRender(time) {
    const w = simulationState.canvasWidth;
    const h = simulationState.canvasHeight;
    const ctx = mainCtx;

    ctx.clearRect(0, 0, w, h);

    // Layer 1: Sky
    renderSky(ctx, w, h, time);

    // Layer 2: Clouds
    cloudSystem.render(ctx, time);

    // Layer 3: Mountains
    renderMountains(ctx, w, time);

    // Layer 4: Ground (lightweight)
    renderGround(ctx, w, h, time);

    // Layer 5: Grass (original lightweight version)
    renderGrass(ctx, time);

    // Layer 6: Wildlife
    wildlife.render(ctx, time);

    // Layer 7: Trees (original lightweight renderer)
    for (let tree of trees) {
        renderTree(ctx, tree, time);
    }

    // Layer 8: Campfire
    renderCampfire(ctx, time);

    // Layer 9: Fire particles
    renderFireParticles(ctx, time);

    // Layer 10: Firebrand particles
    firebrandPhysics.render(ctx, time);

    // Layer 11: Ember particles
    renderEmberParticles(ctx, time);

    // Layer 12: Smoke particles
    renderSmokeParticles(ctx, time);

    // Layer 13: Ash particles
    renderAshParticles(ctx, time);

    // Layer 14: Visual sound effects
    visualSound.render(ctx, time);

    // Layer 15: Global fire overlay
    if (simulationState.skyFireInfluence > 0.01) {
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.fillStyle = `rgba(255,80,20,${simulationState.skyFireInfluence * 0.06})`;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
    }

    // Layer 16: Vignette only (skip film grain, dust motes, lens flares)
    if (postProcessing.vignetteStrength > 0.01) {
        const vGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.75);
        vGrad.addColorStop(0, 'rgba(0,0,0,0)');
        vGrad.addColorStop(0.6, `rgba(0,0,0,${postProcessing.vignetteStrength * 0.3})`);
        vGrad.addColorStop(1, `rgba(0,0,0,${postProcessing.vignetteStrength})`);
        ctx.fillStyle = vGrad;
        ctx.fillRect(0, 0, w, h);
    }
}

// =====================================================
// PART 30: 拡張済みゲームループ (上書き)
// =====================================================

function enhancedGameLoop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const rawDt = (timestamp - lastFrameTime) / 1000;
    const dt = Math.min(rawDt, 0.05);
    lastFrameTime = timestamp;

    const time = timestamp / 1000;

    fpsCounter++;
    fpsTimer += rawDt;
    if (fpsTimer >= 1.0) {
        simulationState.fps = fpsCounter;
        fpsCounter = 0;
        fpsTimer = 0;
    }

    enhancedUpdate(dt, time);
    enhancedRender(time);

    requestAnimationFrame(enhancedGameLoop);
}

// =====================================================
// PART 31: 拡張初期化 (上書き)
// =====================================================

function enhancedInit() {
    initCanvas();
    generateStars();
    generateMountains();

    const treeCount = Math.floor(lerp(
        CONFIG.MIN_TREE_COUNT, CONFIG.MAX_TREE_COUNT,
        parseInt(document.getElementById('density-slider').value) / 100
    ));
    generateTrees(treeCount);
    generateGrass();

    const campfireX = simulationState.canvasWidth * CONFIG.CAMPFIRE_BASE_X_RATIO;
    campfire = new Campfire(campfireX, simulationState.groundLevel);

    windSystem = new WindSystem();
    windSystem.baseSpeed = lerp(
        CONFIG.BASE_WIND_SPEED, CONFIG.MAX_WIND_SPEED,
        parseInt(document.getElementById('wind-slider').value) / 100
    );

    fireParticles = new ParticlePool(FireParticle, CONFIG.MAX_FIRE_PARTICLES);
    smokeParticles = new ParticlePool(SmokeParticle, CONFIG.MAX_SMOKE_PARTICLES);
    emberParticles = new ParticlePool(EmberParticle, CONFIG.MAX_EMBER_PARTICLES);
    ashParticles = new ParticlePool(AshParticle, CONFIG.MAX_ASH_PARTICLES);

    // Enhanced systems
    terrain.generate(simulationState.canvasWidth, simulationState.groundLevel, simulationState.canvasHeight);
    detailedGrass.initialize(grassBlades, simulationState.canvasWidth, simulationState.groundLevel, simulationState.canvasHeight);
    cloudSystem.initialize(simulationState.horizonLevel);
    lighting.initLightMap(simulationState.canvasWidth, simulationState.canvasHeight);
    wildlife.initialize();

    simulationState.phase = 'idle';
    simulationState.spreadCount = 0;
    simulationState.elapsedTime = 0;
    simulationState.fireStarted = false;
    simulationState._halfMessage = false;

    updateTreeDisplay();
}

// =====================================================
// PART 32: リセット関数の上書き
// =====================================================

const _originalReset = resetSimulation;
resetSimulation = function() {
    if (campfire) {
        campfire.stop();
        campfire.intensity = 0;
        campfire.active = false;
    }
    fireParticles.clear();
    smokeParticles.clear();
    emberParticles.clear();
    ashParticles.clear();
    fluidSolver.clear();
    firebrandPhysics.firebrands = [];
    visualSound.crackleParticles = [];
    visualSound.heatWaveRings = [];
    postProcessing.fireflyParticles = [];
    postProcessing.lensFlares = [];

    simulationState.fireStarted = false;
    simulationState.fireSpreadStarted = false;
    simulationState.spreadCount = 0;
    simulationState.elapsedTime = 0;
    simulationState.skyFireInfluence = 0;
    simulationState.phase = 'idle';
    simulationState._halfMessage = false;
    simulationState.messageQueue = [];

    const count = Math.floor(lerp(
        CONFIG.MIN_TREE_COUNT, CONFIG.MAX_TREE_COUNT,
        parseInt(document.getElementById('density-slider').value) / 100
    ));
    generateTrees(count);
    generateGrass();
    generateStars();

    terrain.generate(simulationState.canvasWidth, simulationState.groundLevel, simulationState.canvasHeight);
    detailedGrass.initialize(grassBlades, simulationState.canvasWidth, simulationState.groundLevel, simulationState.canvasHeight);
    cloudSystem.initialize(simulationState.horizonLevel);
    wildlife.initialize();

    document.getElementById('btn-start').classList.remove('active');
    showMessage('🔄', 'リセット完了', '新しい森が生成されました。');
};

// =====================================================
// PART 33: 密度スライダーの上書き
// =====================================================

const _originalUpdateDensity = updateDensity;
updateDensity = function(value) {
    const count = Math.floor(lerp(CONFIG.MIN_TREE_COUNT, CONFIG.MAX_TREE_COUNT, value / 100));
    generateTrees(count);
    generateGrass();
    detailedGrass.initialize(grassBlades, simulationState.canvasWidth, simulationState.groundLevel, simulationState.canvasHeight);
    wildlife.initialize();
    updateTreeDisplay();
};

// =====================================================
// PART 34: リサイズハンドラの拡張
// =====================================================

window.removeEventListener('resize', () => {});
let enhancedResizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(enhancedResizeTimeout);
    enhancedResizeTimeout = setTimeout(() => {
        initCanvas();
        generateStars();
        generateMountains();
        terrain.generate(simulationState.canvasWidth, simulationState.groundLevel, simulationState.canvasHeight);
        lighting.initLightMap(simulationState.canvasWidth, simulationState.canvasHeight);
        cloudSystem.initialize(simulationState.horizonLevel);
    }, 250);
});

// =====================================================
// PART 35: 高度なマウスインタラクション
// =====================================================

let mouseX = 0, mouseY = 0;
let mouseDown = false;
let mouseDragEmbers = false;

mainCanvas.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;

    // Wind indicator follows mouse slightly
    if (windSystem && mouseDown && mouseDragEmbers) {
        const centerX = simulationState.canvasWidth / 2;
        const centerY = simulationState.canvasHeight / 2;
        const dx = mouseX - centerX;
        const dy = mouseY - centerY;
        windSystem.direction = Math.atan2(dy * 0.1, dx);
    }
});

mainCanvas.addEventListener('mousedown', (e) => {
    mouseDown = true;
    const clickX = e.clientX;
    const clickY = e.clientY;

    // Click near ground to add fire point
    if (clickY > simulationState.groundLevel - 30 && simulationState.fireStarted) {
        // Create ember burst at click point
        for (let i = 0; i < 8; i++) {
            const em = emberParticles.acquire();
            if (em) {
                em.x = clickX;
                em.y = clickY;
                em.vx = randFloat(-60, 60);
                em.vy = randFloat(-100, -30);
                em.maxLife = randFloat(1, 3);
                em.canSpreadFire = true;
                em.gravity = 25;
            }
        }
    }
});

mainCanvas.addEventListener('mouseup', () => {
    mouseDown = false;
    mouseDragEmbers = false;
});

// Touch support
mainCanvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    mouseX = touch.clientX;
    mouseY = touch.clientY;
    mouseDown = true;
}, { passive: false });

mainCanvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    mouseX = touch.clientX;
    mouseY = touch.clientY;
}, { passive: false });

mainCanvas.addEventListener('touchend', (e) => {
    mouseDown = false;
});

// =====================================================
// PART 36: キーボードショートカット
// =====================================================

document.addEventListener('keydown', (e) => {
    switch (e.key.toLowerCase()) {
        case 'f':
            if (!simulationState.fireStarted) startFire();
            break;
        case 's':
            stopFire();
            break;
        case 'w':
            toggleWind();
            break;
        case 'r':
            resetSimulation();
            break;
        case ' ':
            e.preventDefault();
            simulationState.running = !simulationState.running;
            if (simulationState.running) {
                lastFrameTime = 0;
                requestAnimationFrame(enhancedGameLoop);
            }
            break;
        case 'arrowup':
            if (windSystem) {
                windSystem.baseSpeed = Math.min(CONFIG.MAX_WIND_SPEED, windSystem.baseSpeed + 1);
                document.getElementById('wind-slider').value = Math.round((windSystem.baseSpeed / CONFIG.MAX_WIND_SPEED) * 100);
                updateWind(document.getElementById('wind-slider').value);
            }
            break;
        case 'arrowdown':
            if (windSystem) {
                windSystem.baseSpeed = Math.max(0, windSystem.baseSpeed - 1);
                document.getElementById('wind-slider').value = Math.round((windSystem.baseSpeed / CONFIG.MAX_WIND_SPEED) * 100);
                updateWind(document.getElementById('wind-slider').value);
            }
            break;
    }
});

// =====================================================
// PART 37: スプラッシュスクリーン & 起動シーケンス
// =====================================================

function showSplashScreen() {
    const splash = document.createElement('div');
    splash.id = 'splash-screen';
    splash.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(ellipse at center, #1a0a00 0%, #000 100%);
        z-index: 10000; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 1.5s ease-out;
        font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    `;

    splash.innerHTML = `
        <div style="font-size: 72px; margin-bottom: 20px; animation: iconBounce 2s infinite;">🔥</div>
        <h1 style="
            font-size: 32px; color: #fff; margin-bottom: 8px;
            background: linear-gradient(90deg, #ff6b35, #ff4444, #ffaa00, #ff6b35);
            background-size: 200% 100%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
        ">林野火災シミュレーション</h1>
        <p style="color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 30px;">
            超高解像度 リアルタイムアニメーション
        </p>
        <div id="splash-loader" style="
            width: 200px; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden; margin-bottom: 20px;
        ">
            <div id="splash-progress" style="
                width: 0%; height: 100%; background: linear-gradient(90deg, #ff6b35, #ffaa00);
                border-radius: 2px; transition: width 0.3s;
            "></div>
        </div>
        <p id="splash-status" style="color: rgba(255,255,255,0.4); font-size: 11px;">
            システム初期化中...
        </p>
        <div style="
            position: absolute; bottom: 30px; color: rgba(255,255,255,0.3);
            font-size: 11px; text-align: center; line-height: 1.8;
        ">
            <div>🌲 風の強い日の焚き火は危険です 🌲</div>
            <div style="margin-top: 5px; font-size: 10px;">
                操作: [F] 焚き火 [S] 消火 [W] 突風 [R] リセット [Space] 一時停止
            </div>
        </div>
    `;

    const styleEl = document.createElement('style');
    styleEl.textContent = `
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    `;
    document.head.appendChild(styleEl);
    document.body.appendChild(splash);

    const progressBar = splash.querySelector('#splash-progress');
    const statusText = splash.querySelector('#splash-status');

    const loadingSteps = [
        { pct: 10, msg: '大気散乱テーブル構築中...' },
        { pct: 20, msg: '地形ハイトマップ生成中...' },
        { pct: 30, msg: '樹木パラメータ計算中...' },
        { pct: 40, msg: '流体力学ソルバー初期化中...' },
        { pct: 50, msg: 'パーティクルプール確保中...' },
        { pct: 60, msg: 'ライティングシステム構築中...' },
        { pct: 70, msg: '野生動物AI初期化中...' },
        { pct: 80, msg: '雲テクスチャ生成中...' },
        { pct: 90, msg: 'ポストプロセッシング準備中...' },
        { pct: 100, msg: '起動完了！' }
    ];

    let stepIdx = 0;
    const stepInterval = setInterval(() => {
        if (stepIdx >= loadingSteps.length) {
            clearInterval(stepInterval);
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.remove();
                    // Start the actual enhanced game loop
                    cancelAnimationFrame(gameLoop);
                    enhancedInit();
                    lastFrameTime = 0;
                    requestAnimationFrame(enhancedGameLoop);
                }, 1500);
            }, 500);
            return;
        }
        const step = loadingSteps[stepIdx];
        progressBar.style.width = step.pct + '%';
        statusText.textContent = step.msg;
        stepIdx++;
    }, 200);
}

// =====================================================
// PART 38: 最終起動
// =====================================================

// Cancel the basic gameLoop that was started earlier
// and launch with splash screen instead
(function() {
    // The original init() and requestAnimationFrame(gameLoop)
    // were called earlier. We override by launching splash.
    simulationState.running = false;
    setTimeout(() => {
        simulationState.running = true;
        showSplashScreen();
    }, 100);
})();
