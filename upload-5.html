            x: Math.random() * simulationState.canvasWidth,
            y: Math.random() * simulationState.horizonLevel,
            size: randFloat(0.5, 2.5),
            brightness: randFloat(0.3, 1.0),
            twinkleSpeed: randFloat(1, 5),
            twinklePhase: Math.random() * Math.PI * 2
        });
    }
}

function generateMountains() {
    mountains = [];
    const w = simulationState.canvasWidth;
    const ground = simulationState.groundLevel;
    const horizon = simulationState.horizonLevel;

    for (let layer = 0; layer < CONFIG.MOUNTAIN_LAYERS; layer++) {
        const layerRatio = layer / CONFIG.MOUNTAIN_LAYERS;
        const baseY = lerp(horizon, ground, layerRatio * 0.7 + 0.1);
        const maxHeight = lerp(200, 60, layerRatio);
        const points = [];
        const segmentCount = Math.floor(w / (20 + layer * 15));
        for (let i = 0; i <= segmentCount; i++) {
            const x = (i / segmentCount) * (w + 100) - 50;
            const n1 = noise.fbm(x * 0.002 + layer * 100, layer * 50, 4, 2.0, 0.5);
            const n2 = noise2.noise2D(x * 0.005 + layer * 200, layer * 30) * 0.3;
            const height = (n1 * 0.7 + n2 + 0.5) * maxHeight;
            points.push({ x: x, y: baseY - Math.max(0, height) });
        }

        const shade = lerp(0.12, 0.28, layerRatio);
        const blue = lerp(0.4, 0.15, layerRatio);

        mountains.push({
            points: points,
            baseY: baseY,
            color: {
                r: Math.round(shade * 200 * (1 - blue * 0.5)),
                g: Math.round(shade * 200 * (1 - blue * 0.3)),
                b: Math.round(shade * 200 * (1 + blue))
            },
            fogAmount: lerp(0.5, 0.1, layerRatio),
            layer: layer
        });
    }
}

function generateGrass() {
    grassBlades = [];
    const w = simulationState.canvasWidth;
    const ground = simulationState.groundLevel;

    for (let i = 0; i < CONFIG.GRASS_BLADE_COUNT; i++) {
        const x = randFloat(-20, w + 20);
        const yOffset = randFloat(0, simulationState.canvasHeight - ground);
        grassBlades.push({
            x: x,
            y: ground + yOffset,
            height: randFloat(CONFIG.GRASS_MIN_HEIGHT, CONFIG.GRASS_MAX_HEIGHT) * (1 - yOffset / (simulationState.canvasHeight - ground) * 0.5),
            width: randFloat(1, 3),
            phase: Math.random() * Math.PI * 2,
            speed: randFloat(1, 3),
            color: {
                r: randInt(30, 70),
                g: randInt(80, 140),
                b: randInt(15, 40)
            },
            burned: false,
            burning: false,
            burnProgress: 0
        });
    }
}

function generateTrees(count) {
    trees = [];
    const w = simulationState.canvasWidth;
    const ground = simulationState.groundLevel;
    const treeTypes = ['pine', 'oak', 'birch', 'cedar', 'bush'];
    const campfireX = w * CONFIG.CAMPFIRE_BASE_X_RATIO;

    for (let i = 0; i < count; i++) {
        let x;
        // Keep trees somewhat away from campfire initially, more trees on right side
        if (i < count * 0.3) {
            x = randFloat(campfireX + 100, w + 50);
        } else if (i < count * 0.6) {
            x = randFloat(campfireX + 50, w - 50);
        } else {
            x = randFloat(-50, w + 50);
            if (Math.abs(x - campfireX) < 60) x = campfireX + 80 + Math.random() * 100;
        }

        const groundVariation = randFloat(0, 40);
        const baseY = ground + groundVariation;
        const type = treeTypes[randInt(0, treeTypes.length - 1)];
        const height = randFloat(CONFIG.TREE_MIN_HEIGHT, CONFIG.TREE_MAX_HEIGHT) * (type === 'bush' ? 0.4 : 1.0);
        const width = randFloat(CONFIG.TREE_MIN_WIDTH, CONFIG.TREE_MAX_WIDTH) * (type === 'bush' ? 0.8 : 1.0);

        trees.push(new Tree(i, x, baseY, height, width, type));
    }

    // Sort by baseY for depth ordering
    trees.sort((a, b) => a.baseY - b.baseY);
}

function init() {
    initCanvas();
    generateStars();
    generateMountains();

    const treeCount = Math.floor(lerp(CONFIG.MIN_TREE_COUNT, CONFIG.MAX_TREE_COUNT, parseInt(document.getElementById('density-slider').value) / 100));
    generateTrees(treeCount);
    generateGrass();

    const campfireX = simulationState.canvasWidth * CONFIG.CAMPFIRE_BASE_X_RATIO;
    campfire = new Campfire(campfireX, simulationState.groundLevel);

    windSystem = new WindSystem();
    windSystem.baseSpeed = lerp(CONFIG.BASE_WIND_SPEED, CONFIG.MAX_WIND_SPEED, parseInt(document.getElementById('wind-slider').value) / 100);

    fireParticles = new ParticlePool(FireParticle, CONFIG.MAX_FIRE_PARTICLES);
    smokeParticles = new ParticlePool(SmokeParticle, CONFIG.MAX_SMOKE_PARTICLES);
    emberParticles = new ParticlePool(EmberParticle, CONFIG.MAX_EMBER_PARTICLES);
    ashParticles = new ParticlePool(AshParticle, CONFIG.MAX_ASH_PARTICLES);

    simulationState.phase = 'idle';
    simulationState.spreadCount = 0;
    simulationState.elapsedTime = 0;
    simulationState.fireStarted = false;

    updateTreeDisplay();
}

// =====================================================
// PART 10: SKY RENDERING
// =====================================================

function renderSky(ctx, w, h, time) {
    const fireInfluence = simulationState.skyFireInfluence;

    // Base sky gradient
    const topColor = lerpColor(
        CONFIG.SKY_TOP_COLOR_NORMAL,
        CONFIG.SKY_TOP_COLOR_FIRE,
        fireInfluence
    );
    const bottomColor = lerpColor(
        CONFIG.SKY_BOTTOM_COLOR_NORMAL,
        CONFIG.SKY_BOTTOM_COLOR_FIRE,
        fireInfluence
    );

    const skyGrad = ctx.createLinearGradient(0, 0, 0, simulationState.groundLevel);
    skyGrad.addColorStop(0, `rgb(${topColor.r},${topColor.g},${topColor.b})`);
    skyGrad.addColorStop(0.5, `rgb(${Math.round(lerp(topColor.r, bottomColor.r, 0.5))},${Math.round(lerp(topColor.g, bottomColor.g, 0.5))},${Math.round(lerp(topColor.b, bottomColor.b, 0.5))})`);
    skyGrad.addColorStop(1, `rgb(${bottomColor.r},${bottomColor.g},${bottomColor.b})`);

    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, simulationState.groundLevel);

    // Stars (fade with fire)
    const starAlpha = Math.max(0, 1.0 - fireInfluence * 2);
    if (starAlpha > 0.01) {
        for (let star of stars) {
            const twinkle = Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.3 + 0.7;
            const alpha = star.brightness * twinkle * starAlpha;
            ctx.fillStyle = `rgba(255,255,240,${alpha})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Moon
    if (starAlpha > 0.1) {
        const moonX = w * 0.8;
        const moonY = simulationState.horizonLevel * 0.3;
        const moonRadius = 25;

        ctx.save();
        ctx.globalAlpha = starAlpha * 0.9;

        // Moon glow
        const moonGlow = ctx.createRadialGradient(moonX, moonY, moonRadius, moonX, moonY, moonRadius * 4);
        moonGlow.addColorStop(0, 'rgba(200,210,255,0.15)');
        moonGlow.addColorStop(1, 'rgba(200,210,255,0)');
        ctx.fillStyle = moonGlow;
        ctx.fillRect(moonX - moonRadius * 4, moonY - moonRadius * 4, moonRadius * 8, moonRadius * 8);

        // Moon body
        ctx.fillStyle = '#e8edf5';
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
        ctx.fill();

        // Moon craters
        ctx.fillStyle = 'rgba(180,185,200,0.3)';
        ctx.beginPath();
        ctx.arc(moonX - 5, moonY - 3, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(moonX + 8, moonY + 5, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(moonX + 2, moonY + 10, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // Fire glow on sky
    if (fireInfluence > 0.01) {
        const glowX = campfire ? campfire.x : w * 0.3;

        // Count burning trees for extra glow sources
        let burnCenterX = glowX;
        let burnCenterY = simulationState.groundLevel;
        let burnCount = 0;

        for (let tree of trees) {
            if (tree.burning) {
                burnCenterX += tree.x;
                burnCenterY += tree.baseY - tree.height * 0.5;
                burnCount++;
            }
        }

        if (burnCount > 0) {
            burnCenterX = (burnCenterX) / (burnCount + 1);
            burnCenterY = (burnCenterY) / (burnCount + 1);
        }

        const skyGlow = ctx.createRadialGradient(
            burnCenterX, simulationState.groundLevel,
            10,
            burnCenterX, simulationState.groundLevel - 200,
            Math.min(w, 600 + fireInfluence * 400)
        );
        skyGlow.addColorStop(0, `rgba(255,100,20,${fireInfluence * 0.4})`);
        skyGlow.addColorStop(0.4, `rgba(255,60,10,${fireInfluence * 0.2})`);
        skyGlow.addColorStop(1, 'rgba(255,30,0,0)');
        ctx.fillStyle = skyGlow;
        ctx.fillRect(0, 0, w, simulationState.groundLevel);
    }
}

// =====================================================
// PART 11: MOUNTAIN RENDERING
// =====================================================

function renderMountains(ctx, w, time) {
    const fireInfluence = simulationState.skyFireInfluence;

    for (let m of mountains) {
        ctx.beginPath();
        ctx.moveTo(-50, m.baseY + 50);

        for (let i = 0; i < m.points.length; i++) {
            if (i === 0) {
                ctx.moveTo(m.points[i].x, m.points[i].y);
            } else {
                const cp1x = (m.points[i - 1].x + m.points[i].x) / 2;
                const cp1y = m.points[i - 1].y;
                const cp2x = cp1x;
                const cp2y = m.points[i].y;
                ctx.quadraticCurveTo(cp1x, (cp1y + cp2y) / 2, m.points[i].x, m.points[i].y);
            }
        }

        ctx.lineTo(w + 50, m.baseY + 50);
        ctx.closePath();

        // Color with fire influence
        const fireColor = {
            r: Math.round(lerp(m.color.r, m.color.r + 60, fireInfluence)),
            g: Math.round(lerp(m.color.g, m.color.g - 10, fireInfluence)),
            b: Math.round(lerp(m.color.b, m.color.b - 30, fireInfluence))
        };

        const grad = ctx.createLinearGradient(0, m.baseY - 200, 0, m.baseY + 20);
        grad.addColorStop(0, `rgb(${fireColor.r},${fireColor.g},${fireColor.b})`);
        grad.addColorStop(1, `rgb(${Math.round(fireColor.r * 0.7)},${Math.round(fireColor.g * 0.7)},${Math.round(fireColor.b * 0.7)})`);

        ctx.fillStyle = grad;
        ctx.fill();

        // Fog overlay
        if (m.fogAmount > 0) {
            const fogAlpha = m.fogAmount * (1 - fireInfluence * 0.5);
            ctx.fillStyle = `rgba(40,50,80,${fogAlpha * 0.3})`;
            ctx.fill();
        }
    }
}

// =====================================================
// PART 12: GROUND RENDERING
// =====================================================

function renderGround(ctx, w, h, time) {
    const ground = simulationState.groundLevel;
    const fireInfluence = simulationState.skyFireInfluence;

    // Main ground gradient
    const groundGrad = ctx.createLinearGradient(0, ground, 0, h);
    const g1r = Math.round(lerp(25, 50, fireInfluence));
    const g1g = Math.round(lerp(55, 35, fireInfluence));
    const g1b = Math.round(lerp(20, 15, fireInfluence));
    const g2r = Math.round(lerp(15, 30, fireInfluence));
    const g2g = Math.round(lerp(35, 20, fireInfluence));
    const g2b = Math.round(lerp(12, 10, fireInfluence));

    groundGrad.addColorStop(0, `rgb(${g1r},${g1g},${g1b})`);
    groundGrad.addColorStop(0.3, `rgb(${Math.round(lerp(g1r, g2r, 0.3))},${Math.round(lerp(g1g, g2g, 0.3))},${Math.round(lerp(g1b, g2b, 0.3))})`);
    groundGrad.addColorStop(1, `rgb(${g2r},${g2g},${g2b})`);

    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, ground, w, h - ground);

    // Ground texture (lightweight version - skip pixel manipulation)

    // Fire light on ground
    if (fireInfluence > 0.01) {
        let lightSources = [];
        if (campfire && campfire.active) {
            lightSources.push({ x: campfire.x, y: campfire.y, intensity: campfire.intensity });
        }
        for (let tree of trees) {
            if (tree.burning) {
                lightSources.push({
                    x: tree.x,
                    y: tree.baseY,
                    intensity: tree.burnIntensity * 0.7
                });
            }
        }

        for (let src of lightSources) {
            const lightGrad = ctx.createRadialGradient(
                src.x, src.y, 5,
                src.x, src.y + 30, 150 + src.intensity * 100
            );
            lightGrad.addColorStop(0, `rgba(255,120,30,${src.intensity * 0.25})`);
            lightGrad.addColorStop(0.5, `rgba(255,80,10,${src.intensity * 0.1})`);
            lightGrad.addColorStop(1, 'rgba(255,50,0,0)');
            ctx.fillStyle = lightGrad;
            ctx.fillRect(src.x - 300, ground, 600, h - ground);
        }
    }
}

// =====================================================
// PART 13: GRASS RENDERING
// =====================================================

function renderGrass(ctx, time) {
    const windEffect = simulationState.windX * 0.02;

    for (let blade of grassBlades) {
        if (blade.burned) continue;

        const sway = Math.sin(time * blade.speed + blade.phase) * 0.15 + windEffect;

        let r = blade.color.r;
        let g = blade.color.g;
        let b = blade.color.b;
        let alpha = 0.8;

        if (blade.burning) {
            blade.burnProgress += simulationState.deltaTime * 0.5;
            if (blade.burnProgress >= 1) {
                blade.burned = true;
                continue;
            }
            r = Math.round(lerp(r, 50, blade.burnProgress));
            g = Math.round(lerp(g, 20, blade.burnProgress));
            b = Math.round(lerp(b, 10, blade.burnProgress));
            alpha = lerp(0.8, 0.3, blade.burnProgress);
        }

        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.lineWidth = blade.width;
        ctx.beginPath();
        ctx.moveTo(blade.x, blade.y);

        const tipX = blade.x + sway * blade.height;
        const tipY = blade.y - blade.height;
        const cpX = blade.x + sway * blade.height * 0.6;
        const cpY = blade.y - blade.height * 0.6;
        ctx.quadraticCurveTo(cpX, cpY, tipX, tipY);
        ctx.stroke();
    }
}

// =====================================================
// PART 14: TREE RENDERING
// =====================================================

function renderTree(ctx, tree, time) {
    ctx.save();
    ctx.translate(tree.x, tree.baseY);

    // Apply sway rotation at base
    ctx.rotate(tree.currentSway || 0);

    const healthFactor = tree.health;
    const burnFactor = tree.burning ? tree.burnIntensity : 0;
    const isBurned = tree.burned;

    // --- Trunk ---
    let trunkR = isBurned ? 25 : Math.round(lerp(tree.trunkColor.r, 40, 1 - healthFactor));
    let trunkG = isBurned ? 20 : Math.round(lerp(tree.trunkColor.g, 20, 1 - healthFactor));
    let trunkB = isBurned ? 15 : Math.round(lerp(tree.trunkColor.b, 10, 1 - healthFactor));

    const trunkWidth = tree.width * 0.12;
    const trunkTaper = trunkWidth * 0.5;

    // Trunk gradient
    const trunkGrad = ctx.createLinearGradient(-trunkWidth / 2, 0, trunkWidth / 2, 0);
    trunkGrad.addColorStop(0, `rgb(${Math.round(trunkR * 0.7)},${Math.round(trunkG * 0.7)},${Math.round(trunkB * 0.7)})`);
    trunkGrad.addColorStop(0.3, `rgb(${trunkR},${trunkG},${trunkB})`);
    trunkGrad.addColorStop(0.7, `rgb(${Math.round(trunkR * 0.9)},${Math.round(trunkG * 0.9)},${Math.round(trunkB * 0.9)})`);
    trunkGrad.addColorStop(1, `rgb(${Math.round(trunkR * 0.6)},${Math.round(trunkG * 0.6)},${Math.round(trunkB * 0.6)})`);

    ctx.fillStyle = trunkGrad;
    ctx.beginPath();
    ctx.moveTo(-trunkWidth / 2, 0);
    ctx.lineTo(-trunkTaper / 2, -tree.height * 0.85);
    ctx.lineTo(trunkTaper / 2, -tree.height * 0.85);
    ctx.lineTo(trunkWidth / 2, 0);
    ctx.closePath();
    ctx.fill();

    // Trunk bark texture
    ctx.strokeStyle = `rgba(0,0,0,0.15)`;
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 5; i++) {
        const y = -tree.height * (0.1 + i * 0.15);
        const xOff = lerp(trunkWidth, trunkTaper, (0.1 + i * 0.15) / 0.85) * 0.5;
        ctx.beginPath();
        ctx.moveTo(-xOff * 0.4 + Math.random() * 2, y);
        ctx.lineTo(xOff * 0.4 + Math.random() * 2, y + randFloat(-3, 3));
        ctx.stroke();
    }

    // --- Branches ---
    for (let branch of tree.branches) {
        const by = -tree.height * branch.heightRatio;
        const bx = branch.side * branch.length;
        const branchAngle = branch.angle + (tree.currentSway || 0) * 0.5;

        ctx.strokeStyle = `rgb(${trunkR},${trunkG},${trunkB})`;
        ctx.lineWidth = branch.thickness * healthFactor;
        ctx.beginPath();
        ctx.moveTo(0, by);
        ctx.quadraticCurveTo(
            bx * 0.3, by - branch.length * 0.2,
            bx, by - branch.length * Math.sin(branchAngle)
        );
        ctx.stroke();
    }

    // --- Leaf Clusters ---
    if (!isBurned) {
        for (let cluster of tree.leafClusters) {
            let lr = tree.leafColor.r;
            let lg = tree.leafColor.g;
            let lb = tree.leafColor.b;
            let la = tree.leafDensity * healthFactor;

            if (tree.burning) {
                const burnLerp = Math.min(1, burnFactor * 1.5);
                lr = Math.round(lerp(lr, 200 + Math.random() * 55, burnLerp));
                lg = Math.round(lerp(lg, 50 + Math.random() * 50, burnLerp));
                lb = Math.round(lerp(lb, 0, burnLerp));
                la *= (1 - burnLerp * 0.3);
            }

            // Leaf cluster wobble
            const wobbleX = Math.sin(time * 1.5 + cluster.phase) * 2;
            const wobbleY = Math.cos(time * 1.2 + cluster.phase) * 1;

            const cx = cluster.ox + wobbleX;
            const cy = cluster.oy + wobbleY;

            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cluster.radius);
            grad.addColorStop(0, `rgba(${lr},${lg},${lb},${la})`);
            grad.addColorStop(0.6, `rgba(${lr},${lg},${lb},${la * 0.7})`);
            grad.addColorStop(1, `rgba(${lr},${lg},${lb},0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, cluster.radius, 0, Math.PI * 2);
            ctx.fill();

            // Secondary detail clusters
            if (cluster.density > 0.7) {
                const detailR = cluster.radius * 0.4;
                for (let d = 0; d < 3; d++) {
                    const dx = cx + Math.cos(d * 2.1 + time * 0.5) * cluster.radius * 0.5;
                    const dy = cy + Math.sin(d * 2.1 + time * 0.5) * cluster.radius * 0.3;
                    ctx.fillStyle = `rgba(${Math.max(0, lr - 15)},${Math.min(255, lg + 10)},${lb},${la * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(dx, dy, detailR, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
    } else {
        // Burned skeleton branches (charred remains)
        ctx.strokeStyle = 'rgba(30,25,20,0.8)';
        ctx.lineWidth = 1;
        for (let branch of tree.branches) {
            const by = -tree.height * branch.heightRatio * 0.7;
            const bx = branch.side * branch.length * 0.6;
            ctx.beginPath();
            ctx.moveTo(0, by);
            ctx.lineTo(bx, by - branch.length * 0.3);
            ctx.stroke();
        }
    }

    // Fire glow around burning tree
    if (tree.burning && tree.burnIntensity > 0.1) {
        const glowRadius = tree.height * 0.8 * tree.burnIntensity;
        const glow = ctx.createRadialGradient(0, -tree.height * 0.5, 5, 0, -tree.height * 0.5, glowRadius);
        glow.addColorStop(0, `rgba(255,150,30,${tree.burnIntensity * 0.2})`);
        glow.addColorStop(0.5, `rgba(255,80,10,${tree.burnIntensity * 0.1})`);
        glow.addColorStop(1, 'rgba(255,30,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(-glowRadius, -tree.height - glowRadius * 0.5, glowRadius * 2, tree.height + glowRadius);
    }

    ctx.restore();
}

// =====================================================
// PART 15: CAMPFIRE RENDERING
// =====================================================

function renderCampfire(ctx, time) {
    if (!campfire) return;

    ctx.save();
    ctx.translate(campfire.x, campfire.y);

    // Rocks circle
    for (let rock of campfire.rocks) {
        const shade = Math.round(rock.shade * 120);
        const fireLight = campfire.active ? campfire.intensity * 30 : 0;
        ctx.fillStyle = `rgb(${shade + fireLight},${shade + fireLight * 0.4},${shade})`;
        ctx.beginPath();
        ctx.ellipse(rock.x, rock.y, rock.size * rock.shape, rock.size / rock.shape, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(0,0,0,0.3)`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
    }

    // Logs
    for (let log of campfire.logs) {
        const burnColor = log.burnProgress;
        const r = Math.round(lerp(log.color.r, 40, burnColor));
        const g = Math.round(lerp(log.color.g, 20, burnColor));
        const b = Math.round(lerp(log.color.b, 10, burnColor));

        ctx.save();
        ctx.rotate(log.angle);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(-log.length / 2, -log.thickness / 2, log.length, log.thickness);

        // Glowing edges if burning
        if (campfire.active && log.burnProgress > 0.1) {
            const edgeGlow = `rgba(255,100,0,${log.burnProgress * 0.5})`;
            ctx.strokeStyle = edgeGlow;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-log.length / 2, -log.thickness / 2, log.length, log.thickness);
        }
        ctx.restore();
    }

    // Ground fire glow
    if (campfire.active) {
        const glowIntensity = campfire.getFlickerIntensity();
        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 120 * glowIntensity);
        glow.addColorStop(0, `rgba(255,180,50,${glowIntensity * 0.15})`);
        glow.addColorStop(0.3, `rgba(255,100,20,${glowIntensity * 0.08})`);
        glow.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(-150, -80, 300, 160);
    }

    ctx.restore();
}

// =====================================================
// PART 16: PARTICLE RENDERING
// =====================================================

function renderFireParticles(ctx, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    fireParticles.forEach((p) => {
        if (p.alpha <= 0.01) return;

        const colorIdx = Math.floor(p.colorIndex);
        const colorFrac = p.colorIndex - colorIdx;
        const c1 = CONFIG.FIRE_COLORS[Math.min(colorIdx, CONFIG.FIRE_COLORS.length - 1)];
        const c2 = CONFIG.FIRE_COLORS[Math.min(colorIdx + 1, CONFIG.FIRE_COLORS.length - 1)];
        const color = lerpColor(c1, c2, colorFrac);

        const alpha = p.alpha * color.a;
        if (alpha <= 0.01) return;

        // Inner bright core
        const innerSize = p.size * 0.4;
        const innerGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, innerSize);
        innerGrad.addColorStop(0, `rgba(255,255,255,${alpha * 0.8})`);
        innerGrad.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
        ctx.fillStyle = innerGrad;
        ctx.fillRect(p.x - innerSize, p.y - innerSize, innerSize * 2, innerSize * 2);

        // Outer glow
        const outerGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        outerGrad.addColorStop(0, `rgba(${color.r},${color.g},${color.b},${alpha})`);
        outerGrad.addColorStop(0.4, `rgba(${color.r},${color.g},${color.b},${alpha * 0.6})`);
        outerGrad.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
        ctx.fillStyle = outerGrad;
        ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
    });

    ctx.restore();
}

function renderSmokeParticles(ctx, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    smokeParticles.forEach((p) => {
        if (p.alpha <= 0.005) return;

        const lifeRatio = 1 - p.life;
        const cidx = Math.floor(lifeRatio * (CONFIG.SMOKE_COLORS.length - 1));
        const cfrac = lifeRatio * (CONFIG.SMOKE_COLORS.length - 1) - cidx;
        const c1 = CONFIG.SMOKE_COLORS[Math.min(cidx, CONFIG.SMOKE_COLORS.length - 1)];
        const c2 = CONFIG.SMOKE_COLORS[Math.min(cidx + 1, CONFIG.SMOKE_COLORS.length - 1)];
        const color = lerpColor(c1, c2, cfrac);

        const alpha = p.alpha * color.a;

        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        grad.addColorStop(0, `rgba(${color.r},${color.g},${color.b},${alpha})`);
        grad.addColorStop(0.5, `rgba(${color.r},${color.g},${color.b},${alpha * 0.5})`);
        grad.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();
}

function renderEmberParticles(ctx, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    emberParticles.forEach((p) => {
        if (p.alpha <= 0.01) return;

        const c = CONFIG.EMBER_COLOR;
        const intensity = p.glowIntensity;

        // Trail
        if (p.prevPositions.length > 1) {
            ctx.lineWidth = p.size * 0.5;
            for (let i = 1; i < p.prevPositions.length; i++) {
                const trailAlpha = (i / p.prevPositions.length) * p.alpha * intensity * 0.5;
                ctx.strokeStyle = `rgba(${c.r},${c.g},${Math.round(c.b * 0.5)},${trailAlpha})`;
                ctx.beginPath();
                ctx.moveTo(p.prevPositions[i - 1].x, p.prevPositions[i - 1].y);
                ctx.lineTo(p.prevPositions[i].x, p.prevPositions[i].y);
                ctx.stroke();
            }
        }

        // Ember body
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
        glow.addColorStop(0, `rgba(255,255,200,${p.alpha * intensity})`);
        glow.addColorStop(0.3, `rgba(${c.r},${c.g},${c.b},${p.alpha * intensity * 0.7})`);
        glow.addColorStop(1, `rgba(${c.r},${Math.round(c.g * 0.5)},0,0)`);
        ctx.fillStyle = glow;
        ctx.fillRect(p.x - p.size * 3, p.y - p.size * 3, p.size * 6, p.size * 6);

        // Sparkle
        if (p.sparkle > 0.7) {
            ctx.fillStyle = `rgba(255,255,255,${(p.sparkle - 0.7) * 3 * p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    ctx.restore();
}

function renderAshParticles(ctx, time) {
    ctx.save();

    ashParticles.forEach((p) => {
        if (p.alpha <= 0.01) return;

        const shade = Math.round(p.shade * 255);
        ctx.fillStyle = `rgba(${shade},${shade},${shade},${p.alpha})`;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
    });

    ctx.restore();
}

// =====================================================
// PART 17: WIND VISUALIZATION
// =====================================================

function renderWindStreamlines(ctx, time) {
    if (!windSystem) return;

    const totalWind = Math.sqrt(simulationState.windX * simulationState.windX + simulationState.windY * simulationState.windY);
    if (totalWind < 1) return;

    const alpha = clamp(totalWind / 15, 0.02, 0.2);

    ctx.save();
    ctx.strokeStyle = `rgba(200,210,230,${alpha})`;
    ctx.lineWidth = 1;

    for (let s of windSystem.streamlines) {
        const len = s.length * (totalWind / 10);
        const dx = Math.cos(windSystem.direction) * len;
        const dy = Math.sin(windSystem.direction) * len * 0.3;

        ctx.globalAlpha = s.opacity * (totalWind / 10);
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + dx, s.y + dy);
        ctx.stroke();
    }

    ctx.restore();
}

// =====================================================
// PART 18: PARTICLE EMISSION
// =====================================================

function emitCampfireParticles(dt) {
    if (!campfire || !campfire.active) return;

    const intensity = campfire.getFlickerIntensity();
    const rate = CONFIG.CAMPFIRE_PARTICLE_RATE * intensity;

    // Fire particles
    for (let i = 0; i < rate; i++) {
        if (Math.random() > intensity) continue;
        const p = fireParticles.acquire();
        if (!p) break;

        p.x = campfire.x + randFloat(-12, 12);
        p.y = campfire.y + randFloat(-8, 0);
        p.vx = randFloat(-15, 15) + simulationState.windX * 0.2;
        p.vy = randFloat(-80, -40);
        p.maxLife = CONFIG.FIRE_PARTICLE_LIFETIME * randFloat(0.6, 1.2);
        p.baseSize = randFloat(6, 18) * intensity;
        p.brightness = randFloat(0.7, 1.0);
        p.sourceId = -1;
    }

    // Smoke particles
    if (Math.random() < intensity * 0.5) {
        const s = smokeParticles.acquire();
        if (s) {
            s.x = campfire.x + randFloat(-8, 8);
            s.y = campfire.y - randFloat(20, 40);
            s.vx = randFloat(-5, 5) + simulationState.windX * 0.5;
            s.vy = randFloat(-30, -15);
            s.maxLife = CONFIG.SMOKE_PARTICLE_LIFETIME * randFloat(0.8, 1.4);
            s.initialSize = randFloat(8, 20);
            s.expansionRate = randFloat(0.8, 1.5);
            s.riseSpeed = randFloat(0.5, 1.5);
            s.sourceId = -1;
        }
    }

    // Embers from campfire (wind-carried)
    const totalWind = Math.sqrt(simulationState.windX * simulationState.windX + simulationState.windY * simulationState.windY);
    if (totalWind > 3 && Math.random() < CONFIG.EMBER_GENERATION_RATE * intensity * (totalWind / 8)) {
        const e = emberParticles.acquire();
        if (e) {
            e.x = campfire.x + randFloat(-10, 10);
            e.y = campfire.y - randFloat(10, 30);
            e.vx = simulationState.windX * randFloat(1.5, 4.0) + randFloat(-20, 20);
            e.vy = randFloat(-100, -50);
            e.maxLife = CONFIG.EMBER_PARTICLE_LIFETIME * randFloat(0.7, 1.5);
            e.gravity = randFloat(15, 40);
            e.canSpreadFire = true;
            e.sourceId = -1;
        }
    }
}

function emitTreeFireParticles(dt) {
    for (let tree of trees) {
        if (!tree.burning) continue;

        const intensity = tree.burnIntensity;
        const rate = Math.ceil(2 * intensity);

        // Fire from tree
        for (let i = 0; i < rate; i++) {
            const p = fireParticles.acquire();
            if (!p) break;

            const pos = tree.getCenterPosition();
            p.x = pos.x + randFloat(-tree.width * 0.4, tree.width * 0.4);
            p.y = pos.y + randFloat(-tree.height * 0.3, tree.height * 0.2);
            p.vx = randFloat(-20, 20) + simulationState.windX * 0.3;
            p.vy = randFloat(-100, -40);
            p.maxLife = CONFIG.FIRE_PARTICLE_LIFETIME * randFloat(0.5, 1.3);
            p.baseSize = randFloat(8, 25) * intensity;
            p.brightness = randFloat(0.6, 1.0);
            p.sourceId = tree.id;
        }

        // Smoke from tree
        if (Math.random() < intensity * 0.6) {
            const s = smokeParticles.acquire();
            if (s) {
                const top = tree.getTopPosition();
                s.x = top.x + randFloat(-tree.width * 0.3, tree.width * 0.3);
                s.y = top.y + randFloat(-20, 0);
                s.vx = simulationState.windX * randFloat(0.3, 1.0);
                s.vy = randFloat(-50, -20);
                s.maxLife = CONFIG.SMOKE_PARTICLE_LIFETIME * randFloat(1.0, 2.0);
                s.initialSize = randFloat(12, 30);
                s.expansionRate = randFloat(1.0, 2.5);
                s.riseSpeed = randFloat(0.8, 2.0);
                s.sourceId = tree.id;
            }
        }

        // Embers from burning tree
        const totalWind = Math.sqrt(simulationState.windX * simulationState.windX + simulationState.windY * simulationState.windY);
        const emberChance = CONFIG.EMBER_GENERATION_RATE * intensity * (0.5 + totalWind / 10);
        if (Math.random() < emberChance) {
            const e = emberParticles.acquire();
            if (e) {
                const top = tree.getTopPosition();
                e.x = top.x + randFloat(-tree.width * 0.3, tree.width * 0.3);
                e.y = top.y + randFloat(-10, 10);
                e.vx = simulationState.windX * randFloat(2.0, 5.0) + randFloat(-30, 30);
                e.vy = randFloat(-120, -50);
                e.maxLife = CONFIG.EMBER_PARTICLE_LIFETIME * randFloat(0.8, 1.6);
                e.gravity = randFloat(10, 35);
                e.canSpreadFire = true;
                e.sourceId = tree.id;
            }
        }

        // Ash particles
        if (Math.random() < intensity * 0.3) {
            const a = ashParticles.acquire();
            if (a) {
                a.x = tree.x + randFloat(-tree.width, tree.width);
                a.y = tree.baseY - randFloat(0, tree.height);
                a.vx = simulationState.windX * 0.5 + randFloat(-10, 10);
                a.vy = randFloat(-20, 5);
                a.maxLife = randFloat(3, 8);
                a.size = randFloat(1, 4);
                a.rotationSpeed = randFloat(-3, 3);
            }
        }
    }
}

// =====================================================
// PART 19: FIRE SPREAD LOGIC
// =====================================================

function updateFireSpread(dt) {
    if (!simulationState.fireStarted) return;

    // --- Campfire → Trees (proximity) ---
    if (campfire && campfire.active) {
        for (let tree of trees) {
            if (tree.burning || tree.burned) continue;
            const d = dist(campfire.x, campfire.y, tree.x, tree.baseY);
            if (d < CONFIG.FIRE_SPREAD_RADIUS * campfire.intensity) {
                const chance = CONFIG.FIRE_SPREAD_CHANCE * campfire.intensity * (1 - d / (CONFIG.FIRE_SPREAD_RADIUS * campfire.intensity));
                if (Math.random() < chance * dt * 60) {
                    if (tree.ignite()) {
                        simulationState.spreadCount++;
                        simulationState.fireSpreadStarted = true;
                        showMessage('⚠️', '飛び火した！', `風で焚き火の火が${tree.treeType === 'pine' ? '松の木' : '木'}に燃え移った！`);
                    }
                }
            }
        }
    }

    // --- Tree → Tree (proximity, optimized) ---
    const burningTrees = [];
    for (let i = 0; i < trees.length; i++) {
        if (trees[i].burning) burningTrees.push(trees[i]);
    }
    for (let bt of burningTrees) {
        const spreadRadius = CONFIG.FIRE_SPREAD_RADIUS * bt.burnIntensity;
        for (let j = 0; j < trees.length; j++) {
            if (trees[j].burning || trees[j].burned) continue;
            const dx = bt.x - trees[j].x;
            if (Math.abs(dx) > spreadRadius) continue;
            const d = dist(bt.x, bt.baseY, trees[j].x, trees[j].baseY);
            if (d < spreadRadius) {
                const chance = CONFIG.FIRE_SPREAD_CHANCE * 1.5 * bt.burnIntensity * (1 - d / spreadRadius);
                if (Math.random() < chance * dt * 60) {
                    if (trees[j].ignite()) {
                        simulationState.spreadCount++;
                    }
                }
            }
        }
    }

    // --- Ember → Tree (飛び火 long distance) ---
    emberParticles.forEach((ember) => {
        if (!ember.canSpreadFire || ember.hasSpread) return;

        for (let tree of trees) {
            if (tree.burning || tree.burned) continue;
            const d = dist(ember.x, ember.y, tree.x, tree.baseY - tree.height * 0.5);
            if (d < tree.width * 1.5 + 10) {
                if (Math.random() < 0.3) {
                    if (tree.ignite()) {
                        ember.hasSpread = true;
                        simulationState.spreadCount++;
                        const emDist = dist(campfire ? campfire.x : 0, campfire ? campfire.y : 0, tree.x, tree.baseY);
                        if (emDist > 200) {
                            showMessage('🔥', '飛び火で延焼！', '風に乗った火の粉が遠くの木に着火した！林野火災の危険！');
                        }
                    }
                }
            }
        }
    });

    // --- Burn grass near fire ---
    for (let blade of grassBlades) {
        if (blade.burning || blade.burned) continue;

        let shouldBurn = false;
        // Near campfire
        if (campfire && campfire.active) {
            if (dist(blade.x, blade.y, campfire.x, campfire.y) < 60 * campfire.intensity) {
                shouldBurn = Math.random() < 0.01;
            }
        }
        // Near burning tree
        if (!shouldBurn) {
            for (let tree of trees) {
                if (!tree.burning) continue;
                if (dist(blade.x, blade.y, tree.x, tree.baseY) < 50 * tree.burnIntensity) {
                    shouldBurn = Math.random() < 0.005;
                    break;
                }
            }
        }
        if (shouldBurn) blade.burning = true;
    }
}

// =====================================================
// PART 20: UI UPDATE
// =====================================================

function updateUI() {
    // Count stats
    let burning = 0, burned = 0, safe = 0;
    for (let tree of trees) {
        if (tree.burning) burning++;
        else if (tree.burned) burned++;
        else safe++;
    }
    simulationState.totalBurning = burning;
    simulationState.totalBurned = burned;
    simulationState.totalSafe = safe;

    document.getElementById('stat-particles').textContent =
        (fireParticles.activeCount + smokeParticles.activeCount + emberParticles.activeCount + ashParticles.activeCount).toLocaleString();
    document.getElementById('stat-burning').textContent = burning;
    document.getElementById('stat-burned').textContent = burned;
    document.getElementById('stat-safe').textContent = safe;
    document.getElementById('stat-spread').textContent = simulationState.spreadCount;
    document.getElementById('stat-fps').textContent = simulationState.fps;

    const elapsed = Math.floor(simulationState.elapsedTime);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    document.getElementById('stat-time').textContent = `${min}:${sec.toString().padStart(2, '0')}`;

    // Wind display
    if (windSystem) {
        document.getElementById('wind-display').textContent = `風速 ${windSystem.getSpeedDisplay()}m/s`;
    }

    // Danger meter
    const dangerRatio = (burning + burned * 0.3) / Math.max(1, trees.length);
    const windDanger = windSystem ? windSystem.currentSpeed / CONFIG.MAX_WIND_SPEED : 0;
    const danger = clamp((dangerRatio * 0.7 + windDanger * 0.3) * 100, 0, 100);
    simulationState.fireDanger = danger;

    document.getElementById('danger-fill').style.width = danger + '%';
    const dangerLabel = document.getElementById('danger-label');
    const dangerDetail = document.getElementById('danger-detail');

    if (danger < 10) {
        dangerLabel.textContent = '安全';
        dangerLabel.style.color = '#44ff88';
        dangerDetail.textContent = '火災リスクなし';
    } else if (danger < 30) {
        dangerLabel.textContent = '注意';
        dangerLabel.style.color = '#ffdd44';
        dangerDetail.textContent = '焚き火に注意';
    } else if (danger < 60) {
        dangerLabel.textContent = '警戒';
        dangerLabel.style.color = '#ffaa00';
        dangerDetail.textContent = '延焼リスクあり！';
    } else if (danger < 85) {
        dangerLabel.textContent = '危険';
        dangerLabel.style.color = '#ff6633';
        dangerDetail.textContent = '林野火災発生中！';
    } else {
        dangerLabel.textContent = '非常に危険';
        dangerLabel.style.color = '#ff2222';
        dangerDetail.textContent = '大規模林野火災！';
    }

    // Sky fire influence
    const targetInfluence = clamp((burning * 0.15 + (campfire && campfire.active ? campfire.intensity * 0.1 : 0)), 0, 1);
    simulationState.skyFireInfluence = lerp(simulationState.skyFireInfluence, targetInfluence, simulationState.deltaTime * 2);

    // Tree count display
    updateTreeDisplay();

    // Auto messages
    if (burning >= 3 && simulationState.phase !== 'wildfire') {
        simulationState.phase = 'wildfire';
        showMessage('🚨', '林野火災だ！', '火をやめて！風が強いから飛び火して大変なことに！消防に連絡を！');
    }
    if (burning >= Math.floor(trees.length * 0.5) && !simulationState._halfMessage) {
        simulationState._halfMessage = true;
        showMessage('😱', '半数以上が延焼！', '森林の半分以上が燃えています！手遅れになる前に消火を！');
    }
}

function updateTreeDisplay() {
    document.getElementById('tree-display').textContent = `樹木: ${trees.length}本`;
}

// =====================================================
// PART 21: MESSAGE SYSTEM
// =====================================================

function showMessage(icon, text, sub) {
    simulationState.messageQueue.push({ icon, text, sub });
    if (!simulationState.messageShowing) {
        displayNextMessage();
    }
}

function displayNextMessage() {
    if (simulationState.messageQueue.length === 0) {
        simulationState.messageShowing = false;
        return;
    }

    simulationState.messageShowing = true;
    const msg = simulationState.messageQueue.shift();
    const bubble = document.getElementById('message-bubble');
    bubble.querySelector('.msg-icon').textContent = msg.icon;
    bubble.querySelector('.msg-text').textContent = msg.text;
    bubble.querySelector('.msg-sub').textContent = msg.sub;
    bubble.classList.add('show');

    setTimeout(() => {
        bubble.classList.remove('show');
        setTimeout(() => displayNextMessage(), 200);
    }, 2200);
}

// =====================================================
// PART 22: MAIN UPDATE LOOP
// =====================================================

function update(dt, time) {
    if (!simulationState.running) return;

    simulationState.deltaTime = dt;
    simulationState.time = time;
    simulationState.elapsedTime += dt;

    // Update wind
    if (windSystem) {
        windSystem.update(dt, time);
        simulationState.windX = windSystem.getWindX();
        simulationState.windY = windSystem.getWindY();
    }

    // Update campfire
    if (campfire) {
        campfire.update(dt);
    }

    // Update trees
    for (let tree of trees) {
        tree.update(dt, time);
    }

    // Emit particles
    emitCampfireParticles(dt);
    emitTreeFireParticles(dt);

    // Update particles
    fireParticles.updateAll(dt);
    smokeParticles.updateAll(dt);
    emberParticles.updateAll(dt);
    ashParticles.updateAll(dt);

    // Fire spread
    updateFireSpread(dt);

    // Update UI every few frames
    if (Math.floor(time * 10) % 3 === 0) {
        updateUI();
    }
}

// =====================================================
// PART 23: MAIN RENDER LOOP
// =====================================================

function render(time) {
    const w = simulationState.canvasWidth;
    const h = simulationState.canvasHeight;
    const ctx = mainCtx;

    ctx.clearRect(0, 0, w, h);

    // Layer 1: Sky
    renderSky(ctx, w, h, time);

    // Layer 2: Mountains
    renderMountains(ctx, w, time);

    // Layer 3: Wind streamlines (behind ground)
    renderWindStreamlines(ctx, time);

    // Layer 4: Ground
    renderGround(ctx, w, h, time);

    // Layer 5: Grass (back)
    renderGrass(ctx, time);

    // Layer 6: Trees (sorted by depth)
    for (let tree of trees) {
        renderTree(ctx, tree, time);
    }

    // Layer 7: Campfire
    renderCampfire(ctx, time);

    // Layer 8: Fire particles
    renderFireParticles(ctx, time);

    // Layer 9: Ember particles
    renderEmberParticles(ctx, time);

    // Layer 10: Smoke particles
    renderSmokeParticles(ctx, time);

    // Layer 11: Ash particles
    renderAshParticles(ctx, time);

    // Layer 12: Global fire light overlay
    if (simulationState.skyFireInfluence > 0.01) {
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.fillStyle = `rgba(255,80,20,${simulationState.skyFireInfluence * 0.08})`;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
    }

    // Heat haze effect near fire
    renderHeatHaze(ctx, w, h, time);
}

function renderHeatHaze(ctx, w, h, time) {
    // Simplified heat haze - we render subtle distortion hints
    if (!campfire || (!campfire.active && simulationState.totalBurning === 0)) return;

    ctx.save();
    ctx.globalAlpha = 0.03;
    ctx.globalCompositeOperation = 'lighter';

    let sources = [];
    if (campfire && campfire.active) {
        sources.push({ x: campfire.x, y: campfire.y - 50, intensity: campfire.intensity });
    }
    for (let tree of trees) {
        if (tree.burning) {
            sources.push({ x: tree.x, y: tree.baseY - tree.height * 0.7, intensity: tree.burnIntensity });
        }
    }

    for (let src of sources) {
        for (let i = 0; i < 3; i++) {
            const hx = src.x + Math.sin(time * 3 + i * 2) * 20;
            const hy = src.y - i * 30 + Math.cos(time * 2 + i) * 10;
            const hSize = 30 + src.intensity * 40;

            const haze = ctx.createRadialGradient(hx, hy, 0, hx, hy, hSize);
            haze.addColorStop(0, `rgba(255,200,100,${src.intensity * 0.5})`);
            haze.addColorStop(1, 'rgba(255,200,100,0)');
            ctx.fillStyle = haze;
            ctx.fillRect(hx - hSize, hy - hSize, hSize * 2, hSize * 2);
        }
    }

    ctx.restore();
}

// =====================================================
// PART 24: ANIMATION FRAME LOOP
// =====================================================

function gameLoop(timestamp) {
    if (!lastFrameTime) lastFrameTime = timestamp;
    const rawDt = (timestamp - lastFrameTime) / 1000;
    const dt = Math.min(rawDt, 0.05); // Cap at 50ms
    lastFrameTime = timestamp;

    const time = timestamp / 1000;

    // FPS counter
    fpsCounter++;
    fpsTimer += rawDt;
    if (fpsTimer >= 1.0) {
        simulationState.fps = fpsCounter;
        fpsCounter = 0;
        fpsTimer = 0;
    }

    update(dt, time);
    render(time);

    requestAnimationFrame(gameLoop);
}

// =====================================================
// PART 25: USER CONTROLS
// =====================================================

function startFire() {
    if (simulationState.fireStarted) return;
    simulationState.fireStarted = true;
    simulationState.phase = 'campfire';
    campfire.start();
    showMessage('🔥', '焚き火を始めた！', 'でも今日は風が強い…大丈夫かな？');
    document.getElementById('btn-start').classList.add('active');
}

function stopFire() {
    if (campfire) {
        campfire.stop();
    }
    // Stop all tree fires
    for (let tree of trees) {
        if (tree.burning) {
            tree.burning = false;
            tree.burnIntensity = 0;
        }
    }
    // Clear particles
    fireParticles.clear();
    emberParticles.clear();

    simulationState.phase = 'stopped';
    simulationState.fireStarted = false;

    showMessage('🧯', '消火完了！', '火は消えた！もう焚き火はやめよう。風が強い日は危険だよ！');
    document.getElementById('btn-start').classList.remove('active');
}

function toggleWind() {
    if (windSystem) {
        windSystem.triggerSuddenGust(18);
        showMessage('💨', '突風が吹いた！', '強い風で火の粉が飛ばされる！飛び火に注意！');
        document.getElementById('btn-wind').classList.add('shake');
        setTimeout(() => {
            document.getElementById('btn-wind').classList.remove('shake');
        }, 600);
    }
}

function updateWind(value) {
    if (windSystem) {
        windSystem.baseSpeed = lerp(CONFIG.BASE_WIND_SPEED, CONFIG.MAX_WIND_SPEED, value / 100);
        const ms = windSystem.baseSpeed.toFixed(1);
        document.getElementById('wind-display').textContent = `風速 ${ms}m/s`;
    }
}

function updateDensity(value) {
    const count = Math.floor(lerp(CONFIG.MIN_TREE_COUNT, CONFIG.MAX_TREE_COUNT, value / 100));
    const campfireX = simulationState.canvasWidth * CONFIG.CAMPFIRE_BASE_X_RATIO;
    const hadFire = simulationState.fireStarted;
    const burningIds = new Set();
    const burnedIds = new Set();
    for (let t of trees) {
        if (t.burning) burningIds.add(t.id);
        if (t.burned) burnedIds.add(t.id);
    }
    generateTrees(count);
    generateGrass();
    updateTreeDisplay();
}

function resetSimulation() {
    if (campfire) {
        campfire.stop();
        campfire.intensity = 0;
        campfire.active = false;
    }
    fireParticles.clear();
    smokeParticles.clear();
    emberParticles.clear();
    ashParticles.clear();

    simulationState.fireStarted = false;
    simulationState.fireSpreadStarted = false;
    simulationState.spreadCount = 0;
    simulationState.elapsedTime = 0;
    simulationState.skyFireInfluence = 0;
    simulationState.phase = 'idle';
    simulationState._halfMessage = false;
    simulationState.messageQueue = [];

    const count = Math.floor(lerp(CONFIG.MIN_TREE_COUNT, CONFIG.MAX_TREE_COUNT, parseInt(document.getElementById('density-slider').value) / 100));
    generateTrees(count);
    generateGrass();
    generateStars();

    document.getElementById('btn-start').classList.remove('active');
    showMessage('🔄', 'リセット完了', '新しい森が生成されました。');
}

class AtmosphericScattering {
    constructor() {
        this.rayleighCoeff = { r: 0.0025, g: 0.0065, b: 0.0175 };
        this.mieCoeff = 0.003;
        this.mieDirectionality = 0.76;
        this.turbidity = 2.5;
        this.sunPosition = { x: 0.8, y: -0.2 };
        this.scatteringLUT = null;
        this.hdrExposure = 1.8;
        this.toneMapGamma = 2.2;
        this.airDensityAtGround = 1.0;
        this.scaleHeight = 8500;
        this.planetRadius = 6371000;
        this.atmosphereRadius = 6471000;
        this.lutResolution = 16;
        this.cachedSkyColors = null;
        this.cacheTime = -1;
        this.cacheInterval = 0.5;
        this.smokeScatteringFactor = 0;
        this.fireGlowIntensity = 0;
    }

    initialize() {
        this._buildScatteringLUT();
        this.cachedSkyColors = new Array(this.lutResolution);
        for (let i = 0; i < this.lutResolution; i++) {
            this.cachedSkyColors[i] = { r: 0, g: 0, b: 0 };
        }
    }

    _buildScatteringLUT() {
        this.scatteringLUT = new Float32Array(this.lutResolution * this.lutResolution * 3);
        for (let iy = 0; iy < this.lutResolution; iy++) {
            for (let ix = 0; ix < this.lutResolution; ix++) {
                const theta = (iy / this.lutResolution) * Math.PI;
                const phi = (ix / this.lutResolution) * Math.PI * 2;
                const scatter = this._computeScattering(theta, phi);
                const idx = (iy * this.lutResolution + ix) * 3;
                this.scatteringLUT[idx + 0] = scatter.r;
                this.scatteringLUT[idx + 1] = scatter.g;
                this.scatteringLUT[idx + 2] = scatter.b;
            }
        }
    }

    _computeScattering(theta, phi) {
        const cosTheta = Math.cos(theta);
        const rayleighPhase = 0.75 * (1.0 + cosTheta * cosTheta);
        const g = this.mieDirectionality;
        const miePhase = (1.0 - g * g) / (4.0 * Math.PI * Math.pow(1.0 + g * g - 2.0 * g * cosTheta, 1.5));

        const altitude = phi / (Math.PI * 2) * this.scaleHeight * 4;
        const density = Math.exp(-altitude / this.scaleHeight);

        const rScatter = this.rayleighCoeff.r * rayleighPhase * density * this.turbidity;
        const gScatter = this.rayleighCoeff.g * rayleighPhase * density * this.turbidity;
        const bScatter = this.rayleighCoeff.b * rayleighPhase * density * this.turbidity;

        const mieR = this.mieCoeff * miePhase * density;
        const mieG = this.mieCoeff * miePhase * density;
        const mieB = this.mieCoeff * miePhase * density * 0.8;

        return {
            r: Math.min(1.0, (rScatter + mieR) * 50),
            g: Math.min(1.0, (gScatter + mieG) * 50),
            b: Math.min(1.0, (bScatter + mieB) * 50)
        };
    }

    _toneMap(value) {
        const mapped = 1.0 - Math.exp(-value * this.hdrExposure);
        return Math.pow(mapped, 1.0 / this.toneMapGamma);
    }

    update(time, fireInfluence, smokeAmount) {
        this.smokeScatteringFactor = smokeAmount;
        this.fireGlowIntensity = fireInfluence;
        this.turbidity = lerp(2.5, 8.0, smokeAmount);
        this.mieCoeff = lerp(0.003, 0.02, fireInfluence);

        if (time - this.cacheTime > this.cacheInterval) {
            this.cacheTime = time;
            this._updateSkyColorCache(time);
        }
    }

    _updateSkyColorCache(time) {
        for (let i = 0; i < this.lutResolution; i++) {
            const t = i / (this.lutResolution - 1);
            const theta = t * Math.PI * 0.5;
            const baseIdx = (Math.floor(t * (this.lutResolution - 1)) * this.lutResolution) * 3;

            let r = this.scatteringLUT[baseIdx + 0];
            let g = this.scatteringLUT[baseIdx + 1];
            let b = this.scatteringLUT[baseIdx + 2];

            // Fire glow contamination
            r = lerp(r, Math.min(1.0, r + 0.4), this.fireGlowIntensity);
            g = lerp(g, g * 0.6, this.fireGlowIntensity);
            b = lerp(b, b * 0.3, this.fireGlowIntensity);

            // Smoke scattering (yellowish)
            r = lerp(r, Math.min(1.0, r + 0.15), this.smokeScatteringFactor);
            g = lerp(g, Math.min(1.0, g + 0.08), this.smokeScatteringFactor);

            this.cachedSkyColors[i] = {
                r: Math.round(this._toneMap(r) * 255),
                g: Math.round(this._toneMap(g) * 255),
                b: Math.round(this._toneMap(b) * 255)
            };
        }
    }

    getSkyColorAtHeight(normalizedHeight) {
        const idx = clamp(Math.floor(normalizedHeight * (this.lutResolution - 1)), 0, this.lutResolution - 1);
        return this.cachedSkyColors[idx] || { r: 0, g: 0, b: 0 };
    }

    getScatteringAtPoint(x, y, canvasWidth, canvasHeight) {
        const nx = x / canvasWidth;
        const ny = y / canvasHeight;
        const heightNorm = 1.0 - ny;
        const color = this.getSkyColorAtHeight(heightNorm);
        const distFromCenter = Math.abs(nx - 0.5) * 2;
        const edgeDarken = 1.0 - distFromCenter * 0.15;
        return {
            r: Math.round(color.r * edgeDarken),
            g: Math.round(color.g * edgeDarken),
            b: Math.round(color.b * edgeDarken)
        };
    }
}

// =====================================================
// PART 28-B: 超高精度 流体力学ベース煙シミュレーション
// =====================================================

class FluidSmokeSolver {
    constructor(gridW, gridH) {
        this.gridW = gridW;
        this.gridH = gridH;
        this.cellSize = 8;
        this.velocityX = new Float32Array(gridW * gridH);
        this.velocityY = new Float32Array(gridW * gridH);
        this.prevVelocityX = new Float32Array(gridW * gridH);
        this.prevVelocityY = new Float32Array(gridW * gridH);
        this.density = new Float32Array(gridW * gridH);
        this.prevDensity = new Float32Array(gridW * gridH);
        this.temperature = new Float32Array(gridW * gridH);
        this.pressure = new Float32Array(gridW * gridH);
        this.divergence = new Float32Array(gridW * gridH);
        this.curl = new Float32Array(gridW * gridH);
        this.viscosity = 0.00001;
        this.diffusion = 0.0001;
        this.buoyancy = 0.8;
        this.vorticityStrength = 0.35;
        this.dissipation = 0.995;
        this.temperatureDissipation = 0.99;
        this.jacobiIterations = 4;
    }

    _idx(x, y) {
        return clamp(y, 0, this.gridH - 1) * this.gridW + clamp(x, 0, this.gridW - 1);
    }

    _setBoundary(field, boundaryType) {
        const w = this.gridW;
        const h = this.gridH;
        for (let i = 1; i < w - 1; i++) {
            field[this._idx(i, 0)] = boundaryType === 2 ? -field[this._idx(i, 1)] : field[this._idx(i, 1)];
            field[this._idx(i, h - 1)] = boundaryType === 2 ? -field[this._idx(i, h - 2)] : field[this._idx(i, h - 2)];
        }
        for (let j = 1; j < h - 1; j++) {
            field[this._idx(0, j)] = boundaryType === 1 ? -field[this._idx(1, j)] : field[this._idx(1, j)];
            field[this._idx(w - 1, j)] = boundaryType === 1 ? -field[this._idx(w - 2, j)] : field[this._idx(w - 2, j)];
        }
        field[this._idx(0, 0)] = 0.5 * (field[this._idx(1, 0)] + field[this._idx(0, 1)]);
        field[this._idx(w - 1, 0)] = 0.5 * (field[this._idx(w - 2, 0)] + field[this._idx(w - 1, 1)]);
        field[this._idx(0, h - 1)] = 0.5 * (field[this._idx(1, h - 1)] + field[this._idx(0, h - 2)]);
        field[this._idx(w - 1, h - 1)] = 0.5 * (field[this._idx(w - 2, h - 1)] + field[this._idx(w - 1, h - 2)]);
    }

    _diffuse(field, prevField, diff, dt, boundaryType) {
        const a = dt * diff * this.gridW * this.gridH;
        const invDenom = 1.0 / (1.0 + 4.0 * a);
        for (let iter = 0; iter < this.jacobiIterations; iter++) {
            for (let j = 1; j < this.gridH - 1; j++) {
                for (let i = 1; i < this.gridW - 1; i++) {
                    const idx = this._idx(i, j);
                    field[idx] = (prevField[idx] + a * (
                        field[this._idx(i - 1, j)] + field[this._idx(i + 1, j)] +
                        field[this._idx(i, j - 1)] + field[this._idx(i, j + 1)]
                    )) * invDenom;
                }
            }
            this._setBoundary(field, boundaryType);
        }
    }

    _advect(field, prevField, velX, velY, dt, boundaryType) {
        const dt0x = dt * this.gridW;
        const dt0y = dt * this.gridH;
        for (let j = 1; j < this.gridH - 1; j++) {
            for (let i = 1; i < this.gridW - 1; i++) {
                const idx = this._idx(i, j);
                let x = i - dt0x * velX[idx];
                let y = j - dt0y * velY[idx];
                x = clamp(x, 0.5, this.gridW - 1.5);
                y = clamp(y, 0.5, this.gridH - 1.5);
                const i0 = Math.floor(x);
                const j0 = Math.floor(y);
                const i1 = i0 + 1;
                const j1 = j0 + 1;
                const sx = x - i0;
                const sy = y - j0;
                field[idx] =
                    (1 - sx) * ((1 - sy) * prevField[this._idx(i0, j0)] + sy * prevField[this._idx(i0, j1)]) +
                    sx * ((1 - sy) * prevField[this._idx(i1, j0)] + sy * prevField[this._idx(i1, j1)]);
            }
        }
        this._setBoundary(field, boundaryType);
    }

    _project() {
        const h = 1.0 / this.gridW;
        for (let j = 1; j < this.gridH - 1; j++) {
            for (let i = 1; i < this.gridW - 1; i++) {
                const idx = this._idx(i, j);
                this.divergence[idx] = -0.5 * h * (
                    this.velocityX[this._idx(i + 1, j)] - this.velocityX[this._idx(i - 1, j)] +
                    this.velocityY[this._idx(i, j + 1)] - this.velocityY[this._idx(i, j - 1)]
                );
                this.pressure[idx] = 0;
            }
        }
        this._setBoundary(this.divergence, 0);
        this._setBoundary(this.pressure, 0);

        for (let iter = 0; iter < this.jacobiIterations; iter++) {
            for (let j = 1; j < this.gridH - 1; j++) {
                for (let i = 1; i < this.gridW - 1; i++) {
                    const idx = this._idx(i, j);
                    this.pressure[idx] = (this.divergence[idx] +
                        this.pressure[this._idx(i - 1, j)] + this.pressure[this._idx(i + 1, j)] +
                        this.pressure[this._idx(i, j - 1)] + this.pressure[this._idx(i, j + 1)]
                    ) * 0.25;
                }
            }
            this._setBoundary(this.pressure, 0);
        }

        for (let j = 1; j < this.gridH - 1; j++) {
            for (let i = 1; i < this.gridW - 1; i++) {
                const idx = this._idx(i, j);
                this.velocityX[idx] -= 0.5 * this.gridW * (this.pressure[this._idx(i + 1, j)] - this.pressure[this._idx(i - 1, j)]);
                this.velocityY[idx] -= 0.5 * this.gridH * (this.pressure[this._idx(i, j + 1)] - this.pressure[this._idx(i, j - 1)]);
            }
        }
        this._setBoundary(this.velocityX, 1);
        this._setBoundary(this.velocityY, 2);
    }

    _computeVorticity() {
        for (let j = 1; j < this.gridH - 1; j++) {
            for (let i = 1; i < this.gridW - 1; i++) {
                const idx = this._idx(i, j);
                this.curl[idx] =
                    (this.velocityY[this._idx(i + 1, j)] - this.velocityY[this._idx(i - 1, j)]) * 0.5 -
                    (this.velocityX[this._idx(i, j + 1)] - this.velocityX[this._idx(i, j - 1)]) * 0.5;
            }
        }
    }

    _applyVorticityConfinement(dt) {
        this._computeVorticity();
        for (let j = 2; j < this.gridH - 2; j++) {
            for (let i = 2; i < this.gridW - 2; i++) {
                const idx = this._idx(i, j);
                const dxCurl = Math.abs(this.curl[this._idx(i + 1, j)]) - Math.abs(this.curl[this._idx(i - 1, j)]);
                const dyCurl = Math.abs(this.curl[this._idx(i, j + 1)]) - Math.abs(this.curl[this._idx(i, j - 1)]);
                const len = Math.sqrt(dxCurl * dxCurl + dyCurl * dyCurl) + 1e-5;
                const nx = dxCurl / len;
                const ny = dyCurl / len;
                this.velocityX[idx] += this.vorticityStrength * dt * (ny * this.curl[idx]);
                this.velocityY[idx] -= this.vorticityStrength * dt * (nx * this.curl[idx]);
            }
        }
    }

    _applyBuoyancy(dt) {
        for (let j = 1; j < this.gridH - 1; j++) {
            for (let i = 1; i < this.gridW - 1; i++) {
                const idx = this._idx(i, j);
                this.velocityY[idx] -= this.buoyancy * this.temperature[idx] * dt;
            }
        }
    }

    addSource(gridX, gridY, densityAmount, tempAmount, velX, velY, radius) {
        const r = radius || 3;
        for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d > r) continue;
                const falloff = 1.0 - d / r;
                const gx = Math.round(gridX + dx);
                const gy = Math.round(gridY + dy);
                if (gx < 0 || gx >= this.gridW || gy < 0 || gy >= this.gridH) continue;
                const idx = this._idx(gx, gy);
                this.density[idx] += densityAmount * falloff;
                this.temperature[idx] += tempAmount * falloff;
                this.velocityX[idx] += velX * falloff;
                this.velocityY[idx] += velY * falloff;
            }
        }
    }

    step(dt) {
        const swap = (a, b) => { return [b, a]; };

        // Velocity step
        [this.velocityX, this.prevVelocityX] = swap(this.velocityX, this.prevVelocityX);
        this._diffuse(this.velocityX, this.prevVelocityX, this.viscosity, dt, 1);
        [this.velocityY, this.prevVelocityY] = swap(this.velocityY, this.prevVelocityY);
        this._diffuse(this.velocityY, this.prevVelocityY, this.viscosity, dt, 2);
        this._project();

        [this.velocityX, this.prevVelocityX] = swap(this.velocityX, this.prevVelocityX);
        [this.velocityY, this.prevVelocityY] = swap(this.velocityY, this.prevVelocityY);
        this._advect(this.velocityX, this.prevVelocityX, this.prevVelocityX, this.prevVelocityY, dt, 1);
        this._advect(this.velocityY, this.prevVelocityY, this.prevVelocityX, this.prevVelocityY, dt, 2);
        this._project();

        // Apply forces
        this._applyBuoyancy(dt);
        this._applyVorticityConfinement(dt);

        // Density step
        [this.density, this.prevDensity] = swap(this.density, this.prevDensity);
        this._diffuse(this.density, this.prevDensity, this.diffusion, dt, 0);
        [this.density, this.prevDensity] = swap(this.density, this.prevDensity);
        this._advect(this.density, this.prevDensity, this.velocityX, this.velocityY, dt, 0);

        // Temperature advection
        const tempPrev = new Float32Array(this.temperature);
        this._advect(this.temperature, tempPrev, this.velocityX, this.velocityY, dt, 0);

        // Dissipation
        for (let i = 0; i < this.density.length; i++) {
            this.density[i] *= this.dissipation;
            this.temperature[i] *= this.temperatureDissipation;
        }

        // Add wind
        for (let j = 0; j < this.gridH; j++) {
            for (let i = 0; i < this.gridW; i++) {
                const idx = this._idx(i, j);
                this.velocityX[idx] += simulationState.windX * 0.001 * this.density[idx];
                this.velocityY[idx] += simulationState.windY * 0.0005 * this.density[idx];
            }
        }
    }

    getDensityAt(worldX, worldY) {
        const gx = worldX / this.cellSize;
        const gy = worldY / this.cellSize;
        const i = Math.floor(gx);
        const j = Math.floor(gy);
        if (i < 0 || i >= this.gridW - 1 || j < 0 || j >= this.gridH - 1) return 0;
        const sx = gx - i;
        const sy = gy - j;
        return (1 - sx) * ((1 - sy) * this.density[this._idx(i, j)] + sy * this.density[this._idx(i, j + 1)]) +
               sx * ((1 - sy) * this.density[this._idx(i + 1, j)] + sy * this.density[this._idx(i + 1, j + 1)]);
    }

    getTemperatureAt(worldX, worldY) {
        const gx = worldX / this.cellSize;
        const gy = worldY / this.cellSize;
        const i = Math.floor(gx);
        const j = Math.floor(gy);
        if (i < 0 || i >= this.gridW - 1 || j < 0 || j >= this.gridH - 1) return 0;
        const sx = gx - i;
        const sy = gy - j;
        return (1 - sx) * ((1 - sy) * this.temperature[this._idx(i, j)] + sy * this.temperature[this._idx(i, j + 1)]) +
               sx * ((1 - sy) * this.temperature[this._idx(i + 1, j)] + sy * this.temperature[this._idx(i + 1, j + 1)]);
    }

    clear() {
        this.velocityX.fill(0);
        this.velocityY.fill(0);
        this.prevVelocityX.fill(0);
        this.prevVelocityY.fill(0);
        this.density.fill(0);
        this.prevDensity.fill(0);
        this.temperature.fill(0);
        this.pressure.fill(0);
        this.divergence.fill(0);
        this.curl.fill(0);
    }
}
