class LightingSystem {
    constructor() {
        this.lights = [];
        this.ambientColor = { r: 15, g: 18, b: 35 };
        this.ambientIntensity = 0.15;
        this.lightMap = null;
        this.lightMapWidth = 0;
        this.lightMapHeight = 0;
        this.lightMapScale = 4;
        this.maxLights = 8;
        this.shadowRays = 2;
        this.bloomStrength = 0.15;
        this.bloomRadius = 10;
        this.volumetricLightIntensity = 0.1;
        this.volumetricRayCount = 4;
        this.volumetricRayLength = 150;
        this.colorTemperatureTable = this._buildColorTempTable();
    }

    _buildColorTempTable() {
        const table = [];
        for (let temp = 800; temp <= 8000; temp += 100) {
            let r, g, b;
            const t = temp / 100;
            if (t <= 66) {
                r = 255;
                g = 99.4708025861 * Math.log(t) - 161.1195681661;
                if (t <= 19) b = 0;
                else b = 138.5177312231 * Math.log(t - 10) - 305.0447927307;
            } else {
                r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
                g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
                b = 255;
            }
            table.push({
                temp: temp,
                r: clamp(Math.round(r), 0, 255),
                g: clamp(Math.round(g), 0, 255),
                b: clamp(Math.round(b), 0, 255)
            });
        }
        return table;
    }

    getColorForTemperature(kelvin) {
        const idx = clamp(Math.floor((kelvin - 800) / 100), 0, this.colorTemperatureTable.length - 1);
        return this.colorTemperatureTable[idx];
    }

    initLightMap(width, height) {
        this.lightMapWidth = Math.ceil(width / this.lightMapScale);
        this.lightMapHeight = Math.ceil(height / this.lightMapScale);
        this.lightMap = new Float32Array(this.lightMapWidth * this.lightMapHeight * 4);
    }

    clearLights() {
        this.lights = [];
    }

    addLight(x, y, radius, intensity, colorTemp, flickerAmount, flickerSpeed) {
        if (this.lights.length >= this.maxLights) return;
        const color = this.getColorForTemperature(colorTemp || 2000);
        this.lights.push({
            x: x,
            y: y,
            radius: radius || 100,
            intensity: intensity || 1.0,
            color: color,
            colorTemp: colorTemp || 2000,
            flickerAmount: flickerAmount || 0,
            flickerSpeed: flickerSpeed || 5,
            flickerPhase: Math.random() * Math.PI * 2,
            castsShadows: radius > 50,
            volumetric: intensity > 0.5
        });
    }

    computeLightMap(time) {
        if (!this.lightMap) return;
        this.lightMap.fill(0);

        for (let ly = 0; ly < this.lightMapHeight; ly++) {
            for (let lx = 0; lx < this.lightMapWidth; lx++) {
                const worldX = lx * this.lightMapScale;
                const worldY = ly * this.lightMapScale;
                const idx = (ly * this.lightMapWidth + lx) * 4;

                let totalR = this.ambientColor.r * this.ambientIntensity;
                let totalG = this.ambientColor.g * this.ambientIntensity;
                let totalB = this.ambientColor.b * this.ambientIntensity;

                for (let light of this.lights) {
                    const dx = worldX - light.x;
                    const dy = worldY - light.y;
                    const d = Math.sqrt(dx * dx + dy * dy);

                    if (d > light.radius * 1.5) continue;

                    let flicker = 1.0;
                    if (light.flickerAmount > 0) {
                        flicker = 1.0 - light.flickerAmount * 0.5 * (
                            Math.sin(time * light.flickerSpeed + light.flickerPhase) *
                            Math.sin(time * light.flickerSpeed * 0.7 + light.flickerPhase * 1.3) + 1
                        ) * 0.5;
                    }

                    const attenuation = Math.max(0, 1.0 - (d / light.radius));
                    const quadAtten = attenuation * attenuation;
                    const finalIntensity = quadAtten * light.intensity * flicker;

                    totalR += light.color.r * finalIntensity / 255;
                    totalG += light.color.g * finalIntensity / 255;
                    totalB += light.color.b * finalIntensity / 255;
                }

                this.lightMap[idx + 0] = Math.min(totalR, 3.0);
                this.lightMap[idx + 1] = Math.min(totalG, 3.0);
                this.lightMap[idx + 2] = Math.min(totalB, 3.0);
                this.lightMap[idx + 3] = 1.0;
            }
        }
    }

    getLightAt(worldX, worldY) {
        if (!this.lightMap) return { r: 1, g: 1, b: 1 };
        const lx = clamp(Math.floor(worldX / this.lightMapScale), 0, this.lightMapWidth - 1);
        const ly = clamp(Math.floor(worldY / this.lightMapScale), 0, this.lightMapHeight - 1);
        const idx = (ly * this.lightMapWidth + lx) * 4;
        return {
            r: this.lightMap[idx + 0],
            g: this.lightMap[idx + 1],
            b: this.lightMap[idx + 2]
        };
    }

    renderVolumetricLight(ctx, time) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        for (let light of this.lights) {
            if (!light.volumetric) continue;

            let flicker = 1.0;
            if (light.flickerAmount > 0) {
                flicker = 1.0 - light.flickerAmount * 0.3 * (
                    Math.sin(time * light.flickerSpeed + light.flickerPhase) + 1
                ) * 0.5;
            }

            const rayAlpha = this.volumetricLightIntensity * light.intensity * flicker * 0.3;
            if (rayAlpha < 0.005) continue;

            for (let r = 0; r < this.volumetricRayCount; r++) {
                const angle = (r / this.volumetricRayCount) * Math.PI * 2 +
                              Math.sin(time * 0.5 + r) * 0.3;
                const rayLen = this.volumetricRayLength * (0.5 + 0.5 * Math.sin(time * 2 + r * 1.5));
                const endX = light.x + Math.cos(angle) * rayLen;
                const endY = light.y + Math.sin(angle) * rayLen;

                const grad = ctx.createLinearGradient(light.x, light.y, endX, endY);
                grad.addColorStop(0, `rgba(${light.color.r},${light.color.g},${light.color.b},${rayAlpha})`);
                grad.addColorStop(0.3, `rgba(${light.color.r},${light.color.g},${light.color.b},${rayAlpha * 0.4})`);
                grad.addColorStop(1, `rgba(${light.color.r},${light.color.g},${light.color.b},0)`);

                ctx.strokeStyle = grad;
                ctx.lineWidth = 8 + Math.sin(time * 3 + r * 2) * 4;
                ctx.globalAlpha = rayAlpha;
                ctx.beginPath();
                ctx.moveTo(light.x, light.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
        }

        ctx.restore();
    }

    renderBloom(ctx, time) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        for (let light of this.lights) {
            if (light.intensity < 0.3) continue;

            let flicker = 1.0;
            if (light.flickerAmount > 0) {
                flicker = 1.0 - light.flickerAmount * 0.5 * (
                    Math.sin(time * light.flickerSpeed + light.flickerPhase) + 1
                ) * 0.5;
            }

            const bloomAlpha = this.bloomStrength * light.intensity * flicker;
            if (bloomAlpha < 0.01) continue;

            const sizes = [light.radius * 0.3, light.radius * 0.6, light.radius * 1.0];
            const alphas = [bloomAlpha * 0.5, bloomAlpha * 0.25, bloomAlpha * 0.1];

            for (let s = 0; s < sizes.length; s++) {
                const grad = ctx.createRadialGradient(
                    light.x, light.y, 0,
                    light.x, light.y, sizes[s]
                );
                grad.addColorStop(0, `rgba(${light.color.r},${light.color.g},${light.color.b},${alphas[s]})`);
                grad.addColorStop(0.5, `rgba(${light.color.r},${Math.round(light.color.g * 0.7)},${Math.round(light.color.b * 0.5)},${alphas[s] * 0.4})`);
                grad.addColorStop(1, `rgba(${light.color.r},0,0,0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(light.x, light.y, sizes[s], 0, Math.PI * 2);
                ctx.fill();
            }
        }

        ctx.restore();
    }
}

const lighting = new LightingSystem();

// =====================================================
// PART 28-D: 高度な地形生成エンジン
// =====================================================

class TerrainGenerator {
    constructor() {
        this.heightMap = null;
        this.normalMap = null;
        this.moistureMap = null;
        this.vegetationMap = null;
        this.erosionMap = null;
        this.resolution = 64;
        this.terrainWidth = 0;
        this.terrainHeight = 0;
        this.heightScale = 60;
        this.erosionIterations = 1;
        this.erosionDroplets = 30;
        this.detailNoiseLayers = [
            { frequency: 0.003, amplitude: 1.0, octaves: 6, lacunarity: 2.1, gain: 0.45 },
            { frequency: 0.01, amplitude: 0.3, octaves: 4, lacunarity: 2.0, gain: 0.5 },
            { frequency: 0.05, amplitude: 0.08, octaves: 3, lacunarity: 2.0, gain: 0.5 },
            { frequency: 0.15, amplitude: 0.02, octaves: 2, lacunarity: 2.0, gain: 0.5 }
        ];
        this.biomeColors = {
            deepSoil: { r: 40, g: 28, b: 18 },
            richSoil: { r: 60, g: 42, b: 25 },
            dryGrass: { r: 80, g: 75, b: 30 },
            greenGrass: { r: 45, g: 90, b: 25 },
            lushGrass: { r: 30, g: 110, b: 20 },
            moss: { r: 35, g: 80, b: 40 },
            rock: { r: 100, g: 95, b: 88 },
            gravel: { r: 120, g: 115, b: 105 },
            sand: { r: 160, g: 145, b: 100 },
            mud: { r: 55, g: 40, b: 28 }
        };
        this.texturePatterns = [];
    }

    generate(width, groundY, canvasHeight) {
        this.terrainWidth = width;
        this.terrainHeight = canvasHeight - groundY;
        this.heightMap = new Float32Array(this.resolution);
        this.normalMap = new Float32Array(this.resolution * 2);
        this.moistureMap = new Float32Array(this.resolution);
        this.vegetationMap = new Float32Array(this.resolution);
        this.erosionMap = new Float32Array(this.resolution);

        this._generateHeightMap();
        this._simulateErosion();
        this._generateMoistureMap();
        this._generateVegetationMap();
        this._computeNormals();
        this._generateTexturePatterns(groundY, canvasHeight);
    }

    _generateHeightMap() {
        for (let i = 0; i < this.resolution; i++) {
            const x = (i / this.resolution) * this.terrainWidth;
            let height = 0;
            for (let layer of this.detailNoiseLayers) {
                height += noise.fbm(x * layer.frequency, 0, layer.octaves, layer.lacunarity, layer.gain) * layer.amplitude;
            }
            height = (height + 1) * 0.5;
            this.heightMap[i] = clamp(height, 0, 1) * this.heightScale;
        }
    }

    _simulateErosion() {
        for (let iter = 0; iter < this.erosionIterations; iter++) {
            for (let d = 0; d < this.erosionDroplets; d++) {
                let pos = Math.random() * (this.resolution - 2) + 1;
                let vel = 0;
                let water = 1;
                let sediment = 0;
                const inertia = 0.05;
                const capacity = 4;
                const deposition = 0.3;
                const erosion = 0.3;
                const evaporation = 0.01;

                for (let step = 0; step < 30; step++) {
                    const i = Math.floor(pos);
                    if (i < 1 || i >= this.resolution - 1) break;

                    const gradient = this.heightMap[i + 1] - this.heightMap[i - 1];
                    vel = vel * inertia - gradient * (1 - inertia);

                    if (Math.abs(vel) < 0.001) break;

                    pos += Math.sign(vel);

                    const newI = Math.floor(pos);
                    if (newI < 0 || newI >= this.resolution) break;

                    const heightDiff = this.heightMap[newI] - this.heightMap[i];
                    const cap = Math.max(-heightDiff, 0.01) * Math.abs(vel) * water * capacity;

                    if (sediment > cap || heightDiff > 0) {
                        const deposit = heightDiff > 0 ?
                            Math.min(heightDiff, sediment) :
                            (sediment - cap) * deposition;
                        sediment -= deposit;
                        this.heightMap[i] += deposit;
                        this.erosionMap[i] -= deposit;
                    } else {
                        const erode = Math.min((cap - sediment) * erosion, -heightDiff);
                        sediment += erode;
                        this.heightMap[i] -= erode;
                        this.erosionMap[i] += erode;
                    }

                    water *= (1 - evaporation);
                }
            }
        }
    }

    _generateMoistureMap() {
        for (let i = 0; i < this.resolution; i++) {
            const x = (i / this.resolution) * this.terrainWidth;
            const baseMoisture = noise2.fbm(x * 0.005, 100, 3, 2.0, 0.5) * 0.5 + 0.5;
            const erosionEffect = clamp(this.erosionMap[i] * 0.1, -0.3, 0.3);
            this.moistureMap[i] = clamp(baseMoisture + erosionEffect, 0, 1);
        }
    }

    _generateVegetationMap() {
        for (let i = 0; i < this.resolution; i++) {
            const x = (i / this.resolution) * this.terrainWidth;
            const baseVeg = noise3.fbm(x * 0.008, 200, 4, 2.0, 0.5) * 0.5 + 0.5;
            const moistureBonus = this.moistureMap[i] * 0.3;
            this.vegetationMap[i] = clamp(baseVeg + moistureBonus, 0, 1);
        }
    }

    _computeNormals() {
        for (let i = 0; i < this.resolution; i++) {
            const prev = i > 0 ? this.heightMap[i - 1] : this.heightMap[i];
            const next = i < this.resolution - 1 ? this.heightMap[i + 1] : this.heightMap[i];
            const dx = (next - prev) * 0.5;
            const len = Math.sqrt(dx * dx + 1);
            this.normalMap[i * 2 + 0] = -dx / len;
            this.normalMap[i * 2 + 1] = 1 / len;
        }
    }

    _generateTexturePatterns(groundY, canvasHeight) {
        this.texturePatterns = [];
        const patternCount = 30;
        for (let i = 0; i < patternCount; i++) {
            this.texturePatterns.push({
                x: Math.random() * this.terrainWidth,
                y: groundY + Math.random() * (canvasHeight - groundY) * 0.5,
                radius: randFloat(5, 30),
                type: ['pebble', 'patch', 'crack', 'root'][randInt(0, 3)],
                color: {
                    r: randInt(30, 80),
                    g: randInt(25, 60),
                    b: randInt(10, 35)
                },
                rotation: Math.random() * Math.PI * 2
            });
        }
    }

    getHeightAt(worldX) {
        const t = clamp(worldX / this.terrainWidth, 0, 1);
        const fi = t * (this.resolution - 1);
        const i = Math.floor(fi);
        const frac = fi - i;
        if (i >= this.resolution - 1) return this.heightMap[this.resolution - 1];
        return lerp(this.heightMap[i], this.heightMap[i + 1], frac);
    }

    getColorAt(worldX, depth) {
        const t = clamp(worldX / this.terrainWidth, 0, 1);
        const idx = Math.floor(t * (this.resolution - 1));
        const moisture = this.moistureMap[clamp(idx, 0, this.resolution - 1)];
        const vegetation = this.vegetationMap[clamp(idx, 0, this.resolution - 1)];
        const erosionVal = this.erosionMap[clamp(idx, 0, this.resolution - 1)];

        const depthFactor = clamp(depth, 0, 1);
        let baseColor;

        if (depthFactor < 0.1) {
            if (vegetation > 0.6) baseColor = lerpColor(this.biomeColors.greenGrass, this.biomeColors.lushGrass, vegetation - 0.6);
            else if (vegetation > 0.3) baseColor = lerpColor(this.biomeColors.dryGrass, this.biomeColors.greenGrass, (vegetation - 0.3) / 0.3);
            else baseColor = lerpColor(this.biomeColors.sand, this.biomeColors.dryGrass, vegetation / 0.3);
        } else if (depthFactor < 0.4) {
            baseColor = lerpColor(this.biomeColors.richSoil, this.biomeColors.deepSoil, (depthFactor - 0.1) / 0.3);
        } else {
            baseColor = lerpColor(this.biomeColors.deepSoil, this.biomeColors.rock, (depthFactor - 0.4) / 0.6);
        }

        if (erosionVal > 0.5) {
            baseColor = lerpColor(baseColor, this.biomeColors.gravel, clamp(erosionVal - 0.5, 0, 0.5));
        }
        if (moisture > 0.7) {
            baseColor = lerpColor(baseColor, this.biomeColors.mud, (moisture - 0.7) * 0.5);
        }

        return baseColor;
    }

    renderDetailed(ctx, groundY, canvasWidth, canvasHeight, time) {
        const stripHeight = canvasHeight - groundY;
        const strips = 20;

        for (let s = 0; s < strips; s++) {
            const y0 = groundY + (s / strips) * stripHeight;
            const y1 = groundY + ((s + 1) / strips) * stripHeight;
            const depth = s / strips;

            ctx.beginPath();
            ctx.moveTo(0, y0);

            // Undulating terrain line
            for (let x = 0; x <= canvasWidth; x += 4) {
                const h = this.getHeightAt(x);
                const noiseOffset = noise.noise2D(x * 0.01 + s * 10, time * 0.05 + s) * 3;
                const yy = y0 + noiseOffset - (s === 0 ? h * 0.3 : 0);
                ctx.lineTo(x, yy);
            }

            ctx.lineTo(canvasWidth, y1);
            ctx.lineTo(0, y1);
            ctx.closePath();

            const color = this.getColorAt(canvasWidth * 0.5, depth);
            const noiseVar = noise2.noise2D(depth * 5, time * 0.02) * 8;

            ctx.fillStyle = `rgb(${clamp(color.r + noiseVar, 0, 255)},${clamp(color.g + noiseVar, 0, 255)},${clamp(color.b + noiseVar * 0.5, 0, 255)})`;
            ctx.fill();
        }

        // Render texture patterns (pebbles, patches, etc.)
        for (let pat of this.texturePatterns) {
            ctx.save();
            ctx.translate(pat.x, pat.y);
            ctx.rotate(pat.rotation);
            ctx.globalAlpha = 0.3;

            if (pat.type === 'pebble') {
                ctx.fillStyle = `rgb(${pat.color.r + 20},${pat.color.g + 15},${pat.color.b + 10})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, pat.radius, pat.radius * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = `rgba(0,0,0,0.2)`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            } else if (pat.type === 'patch') {
                const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, pat.radius);
                pg.addColorStop(0, `rgba(${pat.color.r},${pat.color.g},${pat.color.b},0.4)`);
                pg.addColorStop(1, `rgba(${pat.color.r},${pat.color.g},${pat.color.b},0)`);
                ctx.fillStyle = pg;
                ctx.fillRect(-pat.radius, -pat.radius, pat.radius * 2, pat.radius * 2);
            } else if (pat.type === 'crack') {
                ctx.strokeStyle = `rgba(${pat.color.r - 15},${pat.color.g - 10},${pat.color.b},0.25)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-pat.radius, 0);
                ctx.quadraticCurveTo(0, randFloat(-5, 5), pat.radius, randFloat(-3, 3));
                ctx.stroke();
            } else if (pat.type === 'root') {
                ctx.strokeStyle = `rgba(${pat.color.r + 10},${pat.color.g},${pat.color.b},0.2)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(
                    pat.radius * 0.3, -pat.radius * 0.5,
                    pat.radius * 0.7, pat.radius * 0.3,
                    pat.radius, 0
                );
                ctx.stroke();
            }

            ctx.restore();
        }
    }
}

const terrain = new TerrainGenerator();

// =====================================================
// PART 28-E: 超高精度 樹木描画エンジン (L-System ベース)
// =====================================================

class DetailedTreeRenderer {
    constructor() {
        this.branchDepthMax = 7;
        this.leafDetail = 'ultra';
        this.barkTextureResolution = 16;
        this.shadowQuality = 'high';
        this.windResponseCurve = [0, 0.1, 0.25, 0.45, 0.65, 0.8, 0.92, 1.0];
        this.leafShapes = {
            pine: 'needle',
            oak: 'broad',
            birch: 'small_round',
            cedar: 'scale',
            bush: 'oval'
        };
        this.seasonalTint = { r: 0, g: 0, b: 0 };
        this.barkPatterns = {};
        this._initBarkPatterns();
    }

    _initBarkPatterns() {
        this.barkPatterns = {
            pine: { ridgeFreq: 0.3, ridgeDepth: 0.4, color1: { r: 70, g: 45, b: 25 }, color2: { r: 90, g: 60, b: 35 } },
            oak: { ridgeFreq: 0.15, ridgeDepth: 0.6, color1: { r: 55, g: 38, b: 20 }, color2: { r: 80, g: 55, b: 30 } },
            birch: { ridgeFreq: 0.05, ridgeDepth: 0.1, color1: { r: 200, g: 195, b: 185 }, color2: { r: 170, g: 165, b: 155 } },
            cedar: { ridgeFreq: 0.25, ridgeDepth: 0.5, color1: { r: 85, g: 50, b: 30 }, color2: { r: 65, g: 40, b: 22 } },
            bush: { ridgeFreq: 0.2, ridgeDepth: 0.3, color1: { r: 60, g: 42, b: 22 }, color2: { r: 50, g: 35, b: 18 } }
        };
    }

    renderDetailedTree(ctx, tree, time, lightDir) {
        if (!tree) return;
        ctx.save();
        ctx.translate(tree.x, tree.baseY);
        ctx.rotate(tree.currentSway || 0);

        const healthFactor = tree.health;
        const isBurned = tree.burned;
        const isBurning = tree.burning;
        const burnIntensity = tree.burnIntensity;

        // === SHADOW ON GROUND ===
        this._renderTreeShadow(ctx, tree, time);

        // === TRUNK WITH BARK TEXTURE ===
        this._renderDetailedTrunk(ctx, tree, time, healthFactor, isBurned, isBurning);

        // === BRANCHES (RECURSIVE) ===
        if (!isBurned) {
            this._renderDetailedBranches(ctx, tree, time, healthFactor, isBurning, burnIntensity);
        } else {
            this._renderCharredSkeleton(ctx, tree, time);
        }

        // === LEAF CANOPY ===
        if (!isBurned) {
            this._renderDetailedLeaves(ctx, tree, time, healthFactor, isBurning, burnIntensity);
        }

        // === FIRE EFFECTS ON TREE ===
        if (isBurning) {
            this._renderTreeFireEffects(ctx, tree, time, burnIntensity);
        }

        // === BURNED GLOW ===
        if (isBurned) {
            this._renderBurnedGlow(ctx, tree, time);
        }

        ctx.restore();
    }

    _renderTreeShadow(ctx, tree, time) {
        ctx.save();
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = 'rgba(0,0,0,1)';

        const shadowStretch = 1.5 + Math.sin(time * 0.1) * 0.1;
        const shadowSkew = 0.4;

        ctx.transform(1, 0, shadowSkew, -0.15, 0, 0);
        ctx.beginPath();

        if (tree.treeType === 'pine' || tree.treeType === 'cedar') {
            ctx.moveTo(0, 0);
            ctx.lineTo(-tree.width * 0.5 * shadowStretch, 0);
            ctx.lineTo(tree.width * 0.1 * shadowStretch, tree.height * 0.15);
            ctx.lineTo(tree.width * 0.6 * shadowStretch, 0);
            ctx.closePath();
        } else if (tree.treeType === 'bush') {
            ctx.ellipse(tree.width * 0.2, 0, tree.width * 0.5 * shadowStretch, tree.height * 0.08, 0, 0, Math.PI * 2);
        } else {
            ctx.ellipse(tree.width * 0.2, 0, tree.width * 0.4 * shadowStretch, tree.height * 0.1, 0, 0, Math.PI * 2);
        }

        ctx.fill();
        ctx.restore();
    }

    _renderDetailedTrunk(ctx, tree, time, healthFactor, isBurned, isBurning) {
        const bark = this.barkPatterns[tree.treeType] || this.barkPatterns.oak;
        const trunkW = tree.width * 0.13;
        const trunkTaper = trunkW * 0.35;
        const segments = 12;

        for (let seg = 0; seg < segments; seg++) {
            const t0 = seg / segments;
            const t1 = (seg + 1) / segments;
            const y0 = -tree.height * 0.88 * t0;
            const y1 = -tree.height * 0.88 * t1;
            const w0 = lerp(trunkW, trunkTaper, t0);
            const w1 = lerp(trunkW, trunkTaper, t1);

            // Bark noise color
            const barkNoise = noise.noise2D(seg * bark.ridgeFreq * 10, tree.id * 7) * bark.ridgeDepth;
            let r, g, b;

            if (isBurned) {
                r = 20 + barkNoise * 15;
                g = 15 + barkNoise * 10;
                b = 10 + barkNoise * 5;
            } else {
                r = lerp(bark.color1.r, bark.color2.r, barkNoise + 0.5);
                g = lerp(bark.color1.g, bark.color2.g, barkNoise + 0.5);
                b = lerp(bark.color1.b, bark.color2.b, barkNoise + 0.5);

                if (isBurning) {
                    const burnT = tree.burnIntensity * clamp((1 - t0) * 1.5, 0, 1);
                    r = lerp(r, 80, burnT);
                    g = lerp(g, 25, burnT);
                    b = lerp(b, 10, burnT);
                }
            }

            // Left side (darker)
            const grad = ctx.createLinearGradient(-w0, y0, w0, y0);
            grad.addColorStop(0, `rgb(${Math.round(r * 0.6)},${Math.round(g * 0.6)},${Math.round(b * 0.6)})`);
            grad.addColorStop(0.25, `rgb(${Math.round(r * 0.85)},${Math.round(g * 0.85)},${Math.round(b * 0.85)})`);
            grad.addColorStop(0.45, `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`);
            grad.addColorStop(0.7, `rgb(${Math.round(r * 0.9)},${Math.round(g * 0.9)},${Math.round(b * 0.9)})`);
            grad.addColorStop(1, `rgb(${Math.round(r * 0.55)},${Math.round(g * 0.55)},${Math.round(b * 0.55)})`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-w0, y0);
            ctx.lineTo(-w1, y1);
            ctx.lineTo(w1, y1);
            ctx.lineTo(w0, y0);
            ctx.closePath();
            ctx.fill();

            // Bark texture lines
            if (seg % 2 === 0) {
                ctx.strokeStyle = `rgba(0,0,0,${0.1 + barkNoise * 0.15})`;
                ctx.lineWidth = 0.5;
                const lineY = (y0 + y1) * 0.5;
                const lineW = (w0 + w1) * 0.5;
                ctx.beginPath();
                ctx.moveTo(-lineW * 0.8, lineY + noise2.noise2D(seg * 5, tree.id) * 2);
                ctx.quadraticCurveTo(
                    0, lineY + noise.noise2D(seg * 3, tree.id * 2) * 3,
                    lineW * 0.8, lineY + noise2.noise2D(seg * 7, tree.id) * 2
                );
                ctx.stroke();
            }

            // Knot hole details
            if (Math.abs(noise.noise2D(tree.id * 3, seg * 5)) > 0.7 && seg > 2 && seg < segments - 2) {
                const knotX = noise2.noise2D(tree.id, seg) * w0 * 0.5;
                const knotY = (y0 + y1) * 0.5;
                const knotR = w0 * 0.2;
                ctx.fillStyle = `rgba(${Math.round(r * 0.3)},${Math.round(g * 0.3)},${Math.round(b * 0.3)},0.6)`;
                ctx.beginPath();
                ctx.ellipse(knotX, knotY, knotR, knotR * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Root flare at base
        if (tree.treeType !== 'bush') {
            for (let r = 0; r < 3; r++) {
                const rootAngle = (r / 3) * Math.PI - Math.PI * 0.5 + noise.noise2D(tree.id, r) * 0.5;
                const rootLen = trunkW * randFloat(1.5, 3.0);
                const rootW = trunkW * 0.3;
                ctx.fillStyle = `rgb(${Math.round(bark.color1.r * 0.7)},${Math.round(bark.color1.g * 0.7)},${Math.round(bark.color1.b * 0.7)})`;
                ctx.beginPath();
                ctx.moveTo(Math.cos(rootAngle) * trunkW * 0.3, 0);
                ctx.quadraticCurveTo(
                    Math.cos(rootAngle) * rootLen * 0.5, rootW * 0.3,
                    Math.cos(rootAngle) * rootLen, rootW * 0.1
                );
                ctx.lineTo(Math.cos(rootAngle) * rootLen, 0);
                ctx.closePath();
                ctx.fill();
            }
        }
    }

    _renderDetailedBranches(ctx, tree, time, healthFactor, isBurning, burnIntensity) {
        const bark = this.barkPatterns[tree.treeType] || this.barkPatterns.oak;

        for (let branch of tree.branches) {
            const startY = -tree.height * branch.heightRatio;
            const windResponse = this.windResponseCurve[Math.min(Math.floor(branch.heightRatio * 7), 7)];
            const dynamicAngle = branch.angle + (tree.currentSway || 0) * windResponse * 2;
            const branchLen = branch.length * healthFactor;

            // Multi-segment branch
            const segs = 4;
            let prevX = 0;
            let prevY = startY;

            for (let s = 0; s < segs; s++) {
                const t = (s + 1) / segs;
                const segAngle = dynamicAngle + Math.sin(time * 1.5 + branch.heightRatio * 5 + s) * 0.05 * t;
                const segLen = branchLen * (1 / segs);
                const nx = prevX + Math.cos(segAngle + Math.PI * 0.5 * branch.side) * segLen * branch.side;
                const ny = prevY - segLen * Math.sin(Math.abs(segAngle) + 0.3);

                const thickness = branch.thickness * (1 - t * 0.6) * healthFactor;

                let r = bark.color1.r;
                let g = bark.color1.g;
                let b = bark.color1.b;

                if (isBurning) {
                    const burnT = burnIntensity * t * 0.8;
                    r = lerp(r, 50, burnT);
                    g = lerp(g, 20, burnT);
                    b = lerp(b, 10, burnT);
                }

                ctx.strokeStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
                ctx.lineWidth = thickness;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(prevX, prevY);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                // Sub-branches
                if (s >= 1 && Math.random() < 0.6) {
                    const subAngle = segAngle + randFloat(-0.8, 0.8);
                    const subLen = segLen * 0.5;
                    const subX = nx + Math.cos(subAngle) * subLen * branch.side;
                    const subY = ny - subLen * 0.5;

                    ctx.lineWidth = thickness * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(nx, ny);
                    ctx.lineTo(subX, subY);
                    ctx.stroke();
                }

                prevX = nx;
                prevY = ny;
            }
        }
    }

    _renderCharredSkeleton(ctx, tree, time) {
        ctx.strokeStyle = 'rgba(25,20,15,0.85)';

        for (let branch of tree.branches) {
            const startY = -tree.height * branch.heightRatio * 0.65;
            const branchLen = branch.length * 0.5;
            const segs = 3;
            let prevX = 0;
            let prevY = startY;

            for (let s = 0; s < segs; s++) {
                const t = (s + 1) / segs;
                const nx = prevX + branch.side * branchLen * (1 / segs) * (1 - t * 0.3);
                const ny = prevY - branchLen * (1 / segs) * 0.3 + noise.noise2D(tree.id + s, branch.angle) * 3;

                ctx.lineWidth = branch.thickness * (1 - t * 0.7) * 0.6;
                ctx.beginPath();
                ctx.moveTo(prevX, prevY);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                prevX = nx;
                prevY = ny;
            }
        }

        // Ash/char falling hint
        if (Math.random() < 0.02) {
            const a = ashParticles.acquire();
            if (a) {
                a.x = tree.x + randFloat(-tree.width * 0.3, tree.width * 0.3);
                a.y = tree.baseY - tree.height * randFloat(0.2, 0.7);
                a.vx = simulationState.windX * 0.3;
                a.vy = 5;
                a.maxLife = 3;
                a.size = 2;
            }
        }
    }

    _renderDetailedLeaves(ctx, tree, time, healthFactor, isBurning, burnIntensity) {
        const leafShape = this.leafShapes[tree.treeType] || 'broad';

        for (let cluster of tree.leafClusters) {
            const wobbleX = Math.sin(time * 1.5 + cluster.phase) * 2.5;
            const wobbleY = Math.cos(time * 1.2 + cluster.phase) * 1.5;
            const cx = cluster.ox + wobbleX;
            const cy = cluster.oy + wobbleY;

            let lr = tree.leafColor.r;
            let lg = tree.leafColor.g;
            let lb = tree.leafColor.b;
            let la = tree.leafDensity * healthFactor;

            if (isBurning) {
                const burnLerp = Math.min(1, burnIntensity * 1.8);
                lr = Math.round(lerp(lr, 220 + Math.sin(time * 10 + cluster.phase) * 35, burnLerp));
                lg = Math.round(lerp(lg, 60 + Math.sin(time * 8 + cluster.phase * 1.3) * 40, burnLerp));
                lb = Math.round(lerp(lb, 5, burnLerp));
                la *= (1 - burnLerp * 0.4);
            }

            // Multi-layer leaf cluster for depth
            const layers = 3;
            for (let layer = 0; layer < layers; layer++) {
                const layerOffset = (layer - 1) * 3;
                const layerRadius = cluster.radius * (1 - layer * 0.15);
                const layerAlpha = la * (1 - layer * 0.2);
                const layerColorShift = layer * 8;

                const lx = cx + layerOffset;
                const ly = cy + layerOffset * 0.5;

                if (leafShape === 'needle') {
                    // Pine needle clusters - many small lines
                    const needleCount = Math.ceil(cluster.density * 8);
                    for (let n = 0; n < needleCount; n++) {
                        const na = (n / needleCount) * Math.PI * 2 + time * 0.2;
                        const nr = layerRadius * 0.8;
                        const nx = lx + Math.cos(na) * nr * randFloat(0.3, 1);
                        const ny = ly + Math.sin(na) * nr * 0.6 * randFloat(0.3, 1);
                        const nLen = randFloat(3, 8);

                        ctx.strokeStyle = `rgba(${clamp(lr - layerColorShift, 0, 255)},${clamp(lg + layerColorShift * 0.5, 0, 255)},${lb},${layerAlpha * 0.8})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(nx, ny);
                        ctx.lineTo(nx + Math.cos(na) * nLen, ny + Math.sin(na) * nLen * 0.5);
                        ctx.stroke();
                    }
                } else {
                    // Broad leaf clusters - radial gradient blobs
                    const grad = ctx.createRadialGradient(lx, ly, 0, lx, ly, layerRadius);
                    grad.addColorStop(0, `rgba(${clamp(lr - layerColorShift, 0, 255)},${clamp(lg + layerColorShift, 0, 255)},${lb},${layerAlpha})`);
                    grad.addColorStop(0.5, `rgba(${clamp(lr - layerColorShift * 0.5, 0, 255)},${clamp(lg + layerColorShift * 0.5, 0, 255)},${lb},${layerAlpha * 0.65})`);
                    grad.addColorStop(1, `rgba(${lr},${lg},${lb},0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(lx, ly, layerRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Individual leaf details for ultra quality
                if (cluster.density > 0.5 && layer === 0) {
                    const detailLeafCount = Math.ceil(cluster.density * 5);
                    for (let dl = 0; dl < detailLeafCount; dl++) {
                        const da = (dl / detailLeafCount) * Math.PI * 2 + time * 0.3 + cluster.phase;
                        const dr = layerRadius * randFloat(0.2, 0.9);
                        const dx = lx + Math.cos(da) * dr;
                        const dy = ly + Math.sin(da) * dr * 0.7;
                        const dSize = randFloat(2, 5);

                        ctx.fillStyle = `rgba(${clamp(lr + randFloat(-15, 15), 0, 255)},${clamp(lg + randFloat(-10, 20), 0, 255)},${clamp(lb + randFloat(-5, 10), 0, 255)},${layerAlpha * 0.7})`;

                        if (leafShape === 'small_round') {
                            ctx.beginPath();
                            ctx.arc(dx, dy, dSize, 0, Math.PI * 2);
                            ctx.fill();
                        } else if (leafShape === 'scale') {
                            ctx.beginPath();
                            ctx.ellipse(dx, dy, dSize, dSize * 0.5, da, 0, Math.PI * 2);
                            ctx.fill();
                        } else if (leafShape === 'oval') {
                            ctx.beginPath();
                            ctx.ellipse(dx, dy, dSize * 1.2, dSize * 0.7, da * 0.5, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            // broad leaf
                            ctx.save();
                            ctx.translate(dx, dy);
                            ctx.rotate(da);
                            ctx.beginPath();
                            ctx.moveTo(0, -dSize);
                            ctx.quadraticCurveTo(dSize, 0, 0, dSize);
                            ctx.quadraticCurveTo(-dSize, 0, 0, -dSize);
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                }
            }

            // Highlight specular on top leaves
            if (cluster.oy < -tree.height * 0.6) {
                const specAlpha = 0.06 * cluster.density * healthFactor;
                ctx.fillStyle = `rgba(255,255,220,${specAlpha})`;
                ctx.beginPath();
                ctx.arc(cx - cluster.radius * 0.2, cy - cluster.radius * 0.2, cluster.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    _renderTreeFireEffects(ctx, tree, time, burnIntensity) {
        // Intense glow halo
        const glowRadius = tree.height * burnIntensity;
        const glow = ctx.createRadialGradient(0, -tree.height * 0.45, 3, 0, -tree.height * 0.45, glowRadius);
        glow.addColorStop(0, `rgba(255,200,80,${burnIntensity * 0.15})`);
        glow.addColorStop(0.3, `rgba(255,120,30,${burnIntensity * 0.08})`);
        glow.addColorStop(0.6, `rgba(255,50,10,${burnIntensity * 0.03})`);
        glow.addColorStop(1, 'rgba(200,20,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(-glowRadius, -tree.height - glowRadius * 0.3, glowRadius * 2, tree.height + glowRadius * 0.6);

        // Flickering fire tongues along the canopy
        const tongueCount = Math.ceil(burnIntensity * 6);
        ctx.globalCompositeOperation = 'lighter';
        for (let t = 0; t < tongueCount; t++) {
            const tongueX = (t / tongueCount - 0.5) * tree.width * 0.8;
            const tongueBaseY = -tree.height * randFloat(0.3, 0.8);
            const tongueH = randFloat(15, 40) * burnIntensity;
            const flicker = Math.sin(time * (8 + t * 2) + t * 3) * 0.3 + 0.7;

            const tGrad = ctx.createLinearGradient(tongueX, tongueBaseY, tongueX + simulationState.windX * 0.3, tongueBaseY - tongueH);
            tGrad.addColorStop(0, `rgba(255,200,50,${0.5 * burnIntensity * flicker})`);
            tGrad.addColorStop(0.4, `rgba(255,100,20,${0.35 * burnIntensity * flicker})`);
            tGrad.addColorStop(1, `rgba(255,30,0,0)`);

            ctx.fillStyle = tGrad;
            ctx.beginPath();
            ctx.moveTo(tongueX - 4, tongueBaseY);
            ctx.quadraticCurveTo(
                tongueX + Math.sin(time * 6 + t) * 8 + simulationState.windX * 0.2,
                tongueBaseY - tongueH * 0.6,
                tongueX + Math.sin(time * 10 + t * 2) * 5 + simulationState.windX * 0.4,
                tongueBaseY - tongueH
            );
            ctx.quadraticCurveTo(
                tongueX + Math.sin(time * 7 + t) * 6,
                tongueBaseY - tongueH * 0.4,
                tongueX + 4, tongueBaseY
            );
            ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';

        // Heat distortion ring
        ctx.strokeStyle = `rgba(255,150,50,${burnIntensity * 0.04})`;
        ctx.lineWidth = 2;
        const heatRadius = tree.height * 0.6 * (1 + Math.sin(time * 3) * 0.1);
        ctx.beginPath();
        ctx.arc(0, -tree.height * 0.5, heatRadius, 0, Math.PI * 2);
        ctx.stroke();
    }

    _renderBurnedGlow(ctx, tree, time) {
        // Faint ember glow on charred trunk
        const glowPulse = Math.sin(time * 2 + tree.id) * 0.3 + 0.5;
        const emGrad = ctx.createRadialGradient(0, -tree.height * 0.3, 0, 0, -tree.height * 0.3, tree.height * 0.3);
        emGrad.addColorStop(0, `rgba(255,80,20,${0.03 * glowPulse})`);
        emGrad.addColorStop(1, `rgba(255,30,0,0)`);
        ctx.fillStyle = emGrad;
        ctx.fillRect(-tree.width, -tree.height, tree.width * 2, tree.height);

        // Occasional cinder spots
        if (Math.random() < 0.005) {
            const cinderX = randFloat(-tree.width * 0.3, tree.width * 0.3);
            const cinderY = -tree.height * randFloat(0.1, 0.6);
            ctx.fillStyle = `rgba(255,120,30,${randFloat(0.3, 0.6)})`;
            ctx.beginPath();
            ctx.arc(cinderX, cinderY, randFloat(1, 3), 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

const detailedTreeRenderer = new DetailedTreeRenderer();

// =====================================================
// PART 28-F: 高度な草・下草描画システム
// =====================================================

class DetailedGrassRenderer {
    constructor() {
        this.bladeSegments = 4;
        this.flowerChance = 0.03;
        this.mushroomChance = 0.01;
        this.wildflowerColors = [
            { r: 255, g: 200, b: 50 },
            { r: 220, g: 100, b: 200 },
            { r: 255, g: 255, b: 255 },
            { r: 180, g: 50, b: 50 },
            { r: 100, g: 150, b: 255 }
        ];
        this.undergrowthPatches = [];
        this.detailedBlades = [];
        this.initialized = false;
    }

    initialize(grassBlades, canvasWidth, groundLevel, canvasHeight) {
        this.initialized = true;
        this.detailedBlades = [];
        this.undergrowthPatches = [];

        for (let blade of grassBlades) {
            const detailed = {
                ...blade,
                segments: [],
                hasFlower: Math.random() < this.flowerChance,
                flowerColor: this.wildflowerColors[randInt(0, this.wildflowerColors.length - 1)],
                flowerSize: randFloat(2, 5),
                stiffness: randFloat(0.5, 1.5),
                thickness: randFloat(0.8, 2.5),
                tipColor: {
                    r: blade.color.r + randInt(-10, 20),
                    g: blade.color.g + randInt(-5, 30),
                    b: blade.color.b + randInt(-5, 10)
                }
            };

            const segCount = this.bladeSegments;
            for (let s = 0; s <= segCount; s++) {
                detailed.segments.push({
                    t: s / segCount,
                    offsetX: 0,
                    offsetY: 0
                });
            }

            this.detailedBlades.push(detailed);
        }

        // Generate undergrowth patches (moss, fallen leaves, etc.)
        const patchCount = 40;
        for (let i = 0; i < patchCount; i++) {
            this.undergrowthPatches.push({
                x: Math.random() * canvasWidth,
                y: groundLevel + Math.random() * Math.min(100, canvasHeight - groundLevel),
                radius: randFloat(10, 40),
                type: Math.random() < 0.5 ? 'moss' : 'leaves',
                color: Math.random() < 0.5
                    ? { r: randInt(30, 60), g: randInt(70, 110), b: randInt(25, 45) }
                    : { r: randInt(80, 130), g: randInt(60, 90), b: randInt(20, 40) },
                rotation: Math.random() * Math.PI * 2,
                density: randFloat(0.3, 0.8)
            });
        }
    }

    renderUndergrowth(ctx, time) {
        for (let patch of this.undergrowthPatches) {
            ctx.save();
            ctx.translate(patch.x, patch.y);
            ctx.rotate(patch.rotation);
            ctx.globalAlpha = patch.density * 0.4;

            if (patch.type === 'moss') {
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, patch.radius);
                grad.addColorStop(0, `rgba(${patch.color.r},${patch.color.g},${patch.color.b},0.5)`);
                grad.addColorStop(0.7, `rgba(${patch.color.r},${patch.color.g},${patch.color.b},0.2)`);
                grad.addColorStop(1, `rgba(${patch.color.r},${patch.color.g},${patch.color.b},0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, patch.radius, patch.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Fallen leaf cluster
                const leafCount = Math.ceil(patch.density * 5);
                for (let l = 0; l < leafCount; l++) {
                    const lx = randFloat(-patch.radius * 0.7, patch.radius * 0.7);
                    const ly = randFloat(-patch.radius * 0.3, patch.radius * 0.3);
                    const lr = randFloat(2, 5);
                    ctx.fillStyle = `rgba(${patch.color.r + randInt(-20, 20)},${patch.color.g + randInt(-15, 15)},${patch.color.b + randInt(-10, 10)},0.5)`;
                    ctx.beginPath();
                    ctx.ellipse(lx, ly, lr, lr * 0.6, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.restore();
        }
    }

    renderDetailedGrass(ctx, time) {
        if (!this.initialized) return;

        const windX = simulationState.windX;
        const windMag = Math.sqrt(windX * windX + simulationState.windY * simulationState.windY);

        for (let blade of this.detailedBlades) {
            if (blade.burned) continue;

            const baseSway = Math.sin(time * blade.speed + blade.phase) * 0.2;
            const windSway = windX * 0.025;
            const totalSway = baseSway + windSway;

            let r = blade.color.r;
            let g = blade.color.g;
            let b = blade.color.b;
            let alpha = 0.85;

            if (blade.burning) {
                blade.burnProgress += simulationState.deltaTime * 0.4;
                if (blade.burnProgress >= 1) {
                    blade.burned = true;
                    continue;
                }
                r = Math.round(lerp(r, 40, blade.burnProgress));
                g = Math.round(lerp(g, 15, blade.burnProgress));
                b = Math.round(lerp(b, 5, blade.burnProgress));
                alpha = lerp(0.85, 0.2, blade.burnProgress);

                // Fire on grass blade
                if (blade.burnProgress < 0.7 && Math.random() < 0.3) {
                    ctx.fillStyle = `rgba(255,${100 + Math.random() * 100},0,${0.3 * (1 - blade.burnProgress)})`;
                    ctx.beginPath();
                    ctx.arc(
                        blade.x + totalSway * blade.height * 0.5,
                        blade.y - blade.height * 0.5,
                        2 + Math.random() * 3,
                        0, Math.PI * 2
                    );
                    ctx.fill();
                }
            }

            // Multi-segment curved blade
            ctx.beginPath();
            ctx.moveTo(blade.x, blade.y);

            const pts = [];
            for (let s = 0; s <= this.bladeSegments; s++) {
                const t = s / this.bladeSegments;
                const curveFactor = t * t;
                const segSway = totalSway * curveFactor;
                const stiffnessEffect = blade.stiffness * (1 - t);

                const px = blade.x + segSway * blade.height * (1 + windMag * 0.01);
                const py = blade.y - blade.height * t;
                pts.push({ x: px, y: py });
            }

            // Draw as bezier
            if (pts.length >= 3) {
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length - 1; i++) {
                    const cpx = (pts[i].x + pts[i + 1].x) / 2;
                    const cpy = (pts[i].y + pts[i + 1].y) / 2;
                    ctx.quadraticCurveTo(pts[i].x, pts[i].y, cpx, cpy);
                }
                const last = pts[pts.length - 1];
                ctx.lineTo(last.x, last.y);
            }

            // Gradient along blade
            const tipR = blade.tipColor.r;
            const tipG = blade.tipColor.g;
            const tipB = blade.tipColor.b;

            const bladeGrad = ctx.createLinearGradient(blade.x, blade.y, pts[pts.length - 1].x, pts[pts.length - 1].y);
            bladeGrad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
            bladeGrad.addColorStop(0.7, `rgba(${Math.round(lerp(r, tipR, 0.7))},${Math.round(lerp(g, tipG, 0.7))},${Math.round(lerp(b, tipB, 0.7))},${alpha * 0.9})`);
            bladeGrad.addColorStop(1, `rgba(${tipR},${tipG},${tipB},${alpha * 0.7})`);

            ctx.strokeStyle = bladeGrad;
            ctx.lineWidth = blade.thickness;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Flower at tip
            if (blade.hasFlower && !blade.burning && !blade.burned) {
                const tipPt = pts[pts.length - 1];
                const fc = blade.flowerColor;
                ctx.fillStyle = `rgba(${fc.r},${fc.g},${fc.b},0.8)`;
                const petalCount = 5;
                for (let p = 0; p < petalCount; p++) {
                    const pa = (p / petalCount) * Math.PI * 2 + time * 0.2;
                    const pr = blade.flowerSize;
                    ctx.beginPath();
                    ctx.ellipse(
                        tipPt.x + Math.cos(pa) * pr * 0.6,
                        tipPt.y + Math.sin(pa) * pr * 0.4,
                        pr * 0.5, pr * 0.3,
                        pa, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
                // Center
                ctx.fillStyle = `rgba(255,220,50,0.9)`;
                ctx.beginPath();
                ctx.arc(tipPt.x, tipPt.y, blade.flowerSize * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
}

// =====================================================
// PART 28-G: 雲・大気エフェクトシステム
// =====================================================

class CloudSystem {
    constructor() {
        this.clouds = [];
        this.maxClouds = 6;
        this.cloudMinY = 20;
        this.cloudMaxY = 0;
        this.smokeCloudChance = 0.005;
        this.smokeClouds = [];
        this.maxSmokeClouds = 6;
    }

    initialize(horizonY) {
        this.cloudMaxY = horizonY * 0.8;
        this.clouds = [];
        for (let i = 0; i < this.maxClouds; i++) {
            this.clouds.push(this._createCloud());
        }
    }

    _createCloud() {
        const w = simulationState.canvasWidth;
        return {
            x: randFloat(-200, w + 200),
            y: randFloat(this.cloudMinY, this.cloudMaxY),
            width: randFloat(80, 250),
            height: randFloat(20, 60),
            speed: randFloat(2, 10),
            puffs: this._generatePuffs(randInt(4, 10)),
            opacity: randFloat(0.08, 0.25),
            type: 'normal'
        };
    }

    _generatePuffs(count) {
        const puffs = [];
        for (let i = 0; i < count; i++) {
            puffs.push({
                ox: randFloat(-0.5, 0.5),
                oy: randFloat(-0.4, 0.3),
                radius: randFloat(0.3, 0.8),
                phase: Math.random() * Math.PI * 2
            });
        }
        return puffs;
    }

    update(dt, time) {
        const w = simulationState.canvasWidth;

        for (let cloud of this.clouds) {
            cloud.x += (cloud.speed + simulationState.windX * 0.5) * dt;
            if (cloud.x > w + cloud.width) {
                cloud.x = -cloud.width - 50;
                cloud.y = randFloat(this.cloudMinY, this.cloudMaxY);
            }
            if (cloud.x < -cloud.width - 200) {
                cloud.x = w + 50;
            }
        }

        // Smoke clouds from fire
        if (simulationState.totalBurning > 0 && Math.random() < this.smokeCloudChance * simulationState.totalBurning) {
            if (this.smokeClouds.length < this.maxSmokeClouds) {
                let srcX = campfire ? campfire.x : w * 0.3;
                for (let tree of trees) {
                    if (tree.burning) { srcX = tree.x; break; }
                }
                this.smokeClouds.push({
                    x: srcX + randFloat(-30, 30),
                    y: simulationState.horizonLevel + randFloat(-50, 20),
                    width: randFloat(60, 180),
                    height: randFloat(15, 40),
                    speed: randFloat(5, 15),
                    opacity: randFloat(0.1, 0.35),
                    life: 1.0,
                    maxLife: randFloat(8, 20),
                    puffs: this._generatePuffs(randInt(3, 8)),
                    type: 'smoke'
                });
            }
        }

        for (let i = this.smokeClouds.length - 1; i >= 0; i--) {
            const sc = this.smokeClouds[i];
            sc.x += (sc.speed + simulationState.windX) * dt;
            sc.y -= 3 * dt;
            sc.life -= dt / sc.maxLife;
            sc.width += dt * 5;
            sc.opacity *= 0.998;
            if (sc.life <= 0 || sc.x > w + 300 || sc.x < -300) {
                this.smokeClouds.splice(i, 1);
            }
        }
    }

    render(ctx, time) {
        // Normal clouds
        for (let cloud of this.clouds) {
            this._renderCloud(ctx, cloud, time, false);
        }

        // Smoke clouds
        for (let sc of this.smokeClouds) {
            this._renderCloud(ctx, sc, time, true);
        }
    }

    _renderCloud(ctx, cloud, time, isSmoke) {
        ctx.save();

        for (let puff of cloud.puffs) {
            const px = cloud.x + puff.ox * cloud.width;
            const py = cloud.y + puff.oy * cloud.height + Math.sin(time * 0.5 + puff.phase) * 3;
            const pr = puff.radius * Math.min(cloud.width, cloud.height) * 0.5;

            let alpha = cloud.opacity * (isSmoke ? cloud.life : 1.0);
            let r, g, b;

            if (isSmoke) {
                const fireInf = simulationState.skyFireInfluence;
                r = Math.round(lerp(70, 100, fireInf));
                g = Math.round(lerp(65, 60, fireInf));
                b = Math.round(lerp(75, 50, fireInf));
            } else {
                const fireInf = simulationState.skyFireInfluence;
                r = Math.round(lerp(200, 220, fireInf));
                g = Math.round(lerp(205, 180, fireInf));
                b = Math.round(lerp(215, 160, fireInf));
            }

            const grad = ctx.createRadialGradient(px, py, 0, px, py, pr);
            grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
            grad.addColorStop(0.6, `rgba(${r},${g},${b},${alpha * 0.5})`);
            grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(px, py, pr, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

// =====================================================
// PART 28-H: サウンドビジュアライザー（視覚的音響表現）
// =====================================================

class VisualSoundSystem {
    constructor() {
        this.crackleParticles = [];
        this.maxCrackleParticles = 15;
        this.heatWaveRings = [];
        this.maxHeatWaveRings = 4;
        this.visualIntensity = 0;
        this.crackleRate = 0;
        this.roarIntensity = 0;
        this.windHowlVisual = 0;
    }

    update(dt, time) {
        const burning = simulationState.totalBurning;
        const campfireActive = campfire && campfire.active;
        const windSpeed = windSystem ? windSystem.currentSpeed : 0;

        // Calculate visual sound intensities
        this.crackleRate = (campfireActive ? campfire.intensity * 0.5 : 0) + burning * 0.1;
        this.roarIntensity = clamp(burning / 5, 0, 1);
        this.windHowlVisual = clamp(windSpeed / CONFIG.MAX_WIND_SPEED, 0, 1);
        this.visualIntensity = this.crackleRate + this.roarIntensity * 0.5;

        // Crackle sparks
        if (Math.random() < this.crackleRate * dt * 5) {
            let srcX, srcY;
            if (campfireActive && Math.random() < 0.5) {
                srcX = campfire.x + randFloat(-15, 15);
                srcY = campfire.y - randFloat(5, 20);
            } else {
                const burningTrees = trees.filter(t => t.burning);
                if (burningTrees.length > 0) {
                    const bt = burningTrees[randInt(0, burningTrees.length - 1)];
                    srcX = bt.x + randFloat(-bt.width * 0.3, bt.width * 0.3);
                    srcY = bt.baseY - bt.height * randFloat(0.2, 0.8);
                } else {
                    return;
                }
            }

            if (this.crackleParticles.length < this.maxCrackleParticles) {
                this.crackleParticles.push({
                    x: srcX,
                    y: srcY,
                    vx: randFloat(-60, 60),
                    vy: randFloat(-80, -20),
                    life: 1.0,
                    maxLife: randFloat(0.1, 0.4),
                    size: randFloat(1, 4),
                    brightness: randFloat(0.8, 1.0)
                });
            }
        }

        // Update crackle particles
        for (let i = this.crackleParticles.length - 1; i >= 0; i--) {
            const cp = this.crackleParticles[i];
            cp.life -= dt / cp.maxLife;
            cp.x += cp.vx * dt;
            cp.y += cp.vy * dt;
            cp.vy += 100 * dt;
            if (cp.life <= 0) {
                this.crackleParticles.splice(i, 1);
            }
        }

        // Heat wave rings
        if (this.roarIntensity > 0.2 && Math.random() < this.roarIntensity * dt * 2) {
            const burningTrees = trees.filter(t => t.burning);
            if (burningTrees.length > 0 && this.heatWaveRings.length < this.maxHeatWaveRings) {
                const bt = burningTrees[randInt(0, burningTrees.length - 1)];
                this.heatWaveRings.push({
                    x: bt.x,
                    y: bt.baseY - bt.height * 0.5,
                    radius: 5,
                    maxRadius: randFloat(80, 200),
                    life: 1.0,
                    speed: randFloat(60, 150)
                });
            }
        }

        for (let i = this.heatWaveRings.length - 1; i >= 0; i--) {
            const ring = this.heatWaveRings[i];
            ring.radius += ring.speed * dt;
            ring.life = 1.0 - ring.radius / ring.maxRadius;
            if (ring.life <= 0) {
                this.heatWaveRings.splice(i, 1);
            }
        }
    }

    render(ctx, time) {
        // Crackle sparks
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let cp of this.crackleParticles) {
            const alpha = cp.life * cp.brightness;
            ctx.fillStyle = `rgba(255,${Math.round(200 + cp.brightness * 55)},${Math.round(100 * cp.life)},${alpha})`;
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, cp.size * cp.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();

        // Heat wave rings
        for (let ring of this.heatWaveRings) {
            const alpha = ring.life * 0.08;
            ctx.strokeStyle = `rgba(255,120,30,${alpha})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Wind howl visual streaks
        if (this.windHowlVisual > 0.3) {
            ctx.save();
            ctx.globalAlpha = (this.windHowlVisual - 0.3) * 0.15;
            ctx.strokeStyle = 'rgba(180,200,230,0.5)';
            ctx.lineWidth = 1;

            for (let i = 0; i < 8; i++) {
                const y = Math.sin(time * 2 + i * 1.7) * simulationState.canvasHeight * 0.3 + simulationState.canvasHeight * 0.3;
                const x = (time * 100 * this.windHowlVisual + i * 200) % (simulationState.canvasWidth + 200) - 100;
                const len = 40 + this.windHowlVisual * 80;

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + len, y + Math.sin(time * 3 + i) * 10);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Fire roar visual: screen edge pulsing
        if (this.roarIntensity > 0.1) {
            const w = simulationState.canvasWidth;
            const h = simulationState.canvasHeight;
            const pulse = Math.sin(time * 4) * 0.3 + 0.7;
            const edgeAlpha = this.roarIntensity * 0.06 * pulse;

            const edgeGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.7);
            edgeGrad.addColorStop(0, 'rgba(255,50,0,0)');
            edgeGrad.addColorStop(1, `rgba(255,30,0,${edgeAlpha})`);
            ctx.fillStyle = edgeGrad;
            ctx.fillRect(0, 0, w, h);
        }
    }
}
