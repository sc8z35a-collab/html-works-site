  var params = new URLSearchParams(location.search);
  var src = params.get("src") || "upload.html";
  if (!WORKS.hasOwnProperty(src)) src = "upload.html";
  document.getElementById("title").textContent = WORKS[src];
  document.title = WORKS[src] + " | HTML Works Hub";
  document.getElementById("frame").src = "./" + src;
  document.getElementById("direct").href = "./" + src;

  var bar = document.getElementById("bar");
  var hint = document.getElementById("hint");
  var timer = null;
  function armHide(){
    clearTimeout(timer);
    bar.classList.remove("hide");
    timer = setTimeout(function(){ bar.classList.add("hide"); }, 3200);
  }
  document.addEventListener("pointermove", armHide);
  document.addEventListener("pointerdown", armHide);
  armHide();
  setTimeout(function(){ hint.classList.add("hide"); }, 5000);

  async function goFullscreenLandscape(){
    try {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(async function(){
          await document.documentElement.requestFullscreen();
        });
      }
    } catch(e) {}
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch(e) { /* iOS等ではロック不可。その場合は端末を横向きにしてください */ }
    hint.classList.add("hide");
    armHide();
  }
  document.getElementById("fsBtn").addEventListener("click", goFullscreenLandscape);
  document.addEventListener("fullscreenchange", function(){
    if (!document.fullscreenElement) armHide();
  });
