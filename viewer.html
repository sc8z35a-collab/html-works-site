<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b10">
<title>Viewer | HTML Works Hub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif}
  #frame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#000}
  #bar{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:8px;
    padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 6px calc(10px + env(safe-area-inset-left));
    background:linear-gradient(rgba(5,5,10,.88),rgba(5,5,10,.55) 70%,transparent);
    color:#f1f1f4;transition:opacity .35s;
  }
  #bar.hide{opacity:0;pointer-events:none}
  #bar .title{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{
    appearance:none;border:1px solid rgba(255,255,255,.25);background:rgba(20,20,30,.75);
    color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;
    text-decoration:none;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)
  }
  .btn.primary{background:#4da3ff;border-color:#4da3ff;color:#08131f}
  #hint{
    position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:10;background:rgba(10,10,16,.85);color:#dcdce6;border:1px solid rgba(255,255,255,.18);
    font-size:12px;padding:8px 14px;border-radius:999px;transition:opacity .4s;white-space:nowrap
  }
  #hint.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="bar">
  <a class="btn" href="./index.html">← ハブ</a>
  <div class="title" id="title">読み込み中…</div>
  <a class="btn" id="direct" href="#" target="_blank" rel="noopener">直接開く</a>
  <button class="btn primary" id="fsBtn" type="button">⛶ 全画面（横）</button>
</div>
<iframe id="frame" allowfullscreen allow="fullscreen; autoplay; gamepad"></iframe>
<div id="hint">「全画面（横）」を押すとスマホ横向き・全画面で表示します</div>
<script>
  var WORKS = {
    "upload.html":"YouTube",
    "3D.html":"3D Calculator - Ultra Realistic",
    "upload-4.html":"Ultra HD Premium Calculator Pro Max",
    "upload-3.html":"Super Stage Maker - Beautiful Edition",
    "SCP-1.html":"SCP-1-JP 「凌空」 収容シミュレーター",
    "SCP-2.html":"SCP-4721 Observation Chamber",
    "upload-2.html":"しょぼんのアクション - HD Remake",
    "3.1.html":"Infinite Voxel World",
    "upload-5.html":"林野火災シミュレーション",
    "AI.html":"AI GENESIS — 6日間の狂詩曲",
    "upload-6.html":"深夜の森 - The Chat Log",
    "2.html":"カロン & コレー — 雑談トーク",
    "upload-7.html":"三人の雑談 — 手書き × ドローン"
  };
  var params = new URLSearchParams(location.search);
  var src = params.get("src") || "upload.html";
  if (!WORKS.hasOwnProperty(src)) src = "upload.html";
  document.getElementById("title").textContent = WORKS[src];
  document.title = WORKS[src] + " | HTML Works Hub";
  document.getElementById("frame").src = "./" + src;
  document.getElementById("direct").href = "./" + src;

  var bar = document.getElementById("bar");
  var hint = document.getElementById("hint");
  var timer = null;
  function armHide(){
    clearTimeout(timer);
    bar.classList.remove("hide");
    timer = setTimeout(function(){ bar.classList.add("hide"); }, 3200);
  }
  document.addEventListener("pointermove", armHide);
  document.addEventListener("pointerdown", armHide);
  armHide();
  setTimeout(function(){ hint.classList.add("hide"); }, 5000);

  async function goFullscreenLandscape(){
    try {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(async function(){
          await document.documentElement.requestFullscreen();
        });
      }
    } catch(e) {}
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch(e) { /* iOS等ではロック不可。その場合は端末を横向きにしてください */ }
    hint.classList.add("hide");
    armHide();
  }
  document.getElementById("fsBtn").addEventListener("click", goFullscreenLandscape);
  document.addEventListener("fullscreenchange", function(){
    if (!document.fullscreenElement) armHide();
  });
</script>
</body>
</html>
