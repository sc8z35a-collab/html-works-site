<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カロン & コレー — 雑談トーク</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800;900&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ROOT VARIABLES & THEME SYSTEM
           ============================================================ */
        :root {
            /* Light Theme Colors */
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-chat: #e5e5ea;
            --bg-header: rgba(255, 255, 255, 0.92);
            --bg-sidebar: #ffffff;
            --bg-input: #ffffff;
            --bg-modal: rgba(0, 0, 0, 0.45);
            --bg-tooltip: rgba(30, 30, 30, 0.92);
            --bg-hover: rgba(0, 0, 0, 0.04);
            --bg-active: rgba(0, 0, 0, 0.08);
            --bg-skeleton: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);

            /* Bubble Colors */
            --bubble-charon: #ffffff;
            --bubble-charon-shadow: rgba(0, 0, 0, 0.06);
            --bubble-corey: #3b82f6;
            --bubble-corey-shadow: rgba(59, 130, 246, 0.2);
            --bubble-system: rgba(0, 0, 0, 0.05);

            /* Text Colors */
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --text-inverse: #ffffff;
            --text-link: #3b82f6;
            --text-charon: #1a1a1a;
            --text-corey: #ffffff;
            --text-system: #6b7280;
            --text-code: #e83e8c;
            --text-code-bg: rgba(232, 62, 140, 0.08);

            /* Accent Colors */
            --accent-charon: #f97316;
            --accent-charon-light: #fff7ed;
            --accent-charon-gradient: linear-gradient(135deg, #f97316, #fb923c);
            --accent-corey: #3b82f6;
            --accent-corey-light: #eff6ff;
            --accent-corey-gradient: linear-gradient(135deg, #3b82f6, #60a5fa);
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-purple: #8b5cf6;

            /* Border Colors */
            --border-primary: rgba(0, 0, 0, 0.08);
            --border-secondary: rgba(0, 0, 0, 0.04);
            --border-focus: #3b82f6;

            /* Shadows */
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.18);
            --shadow-inner: inset 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-bubble-charon: 0 1px 4px rgba(0, 0, 0, 0.06);
            --shadow-bubble-corey: 0 1px 4px rgba(59, 130, 246, 0.15);
            --shadow-header: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-float: 0 8px 30px rgba(0, 0, 0, 0.12);

            /* Typography */
            --font-primary: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-rounded: 'M PLUS Rounded 1c', var(--font-primary);
            --font-mono: 'Source Code Pro', 'SF Mono', 'Fira Code', monospace;
            --font-size-xs: 0.6875rem;
            --font-size-sm: 0.8125rem;
            --font-size-base: 0.9375rem;
            --font-size-md: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.3125rem;
            --font-size-2xl: 1.5rem;
            --font-size-3xl: 1.875rem;
            --line-height-tight: 1.35;
            --line-height-normal: 1.65;
            --line-height-relaxed: 1.8;
            --letter-spacing-tight: -0.01em;
            --letter-spacing-normal: 0.02em;

            /* Spacing */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-16: 4rem;

            /* Border Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
            --radius-bubble: 18px;
            --radius-bubble-tail-l: 18px 18px 18px 4px;
            --radius-bubble-tail-r: 18px 18px 4px 18px;

            /* Transitions */
            --transition-fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-bounce: 600ms cubic-bezier(0.68, -0.55, 0.265, 1.55);

            /* Z-Index Scale */
            --z-base: 1;
            --z-dropdown: 100;
            --z-sticky: 200;
            --z-header: 300;
            --z-overlay: 400;
            --z-modal: 500;
            --z-toast: 600;
            --z-tooltip: 700;
            --z-max: 9999;

            /* Layout */
            --header-height: 64px;
            --input-height: 60px;
            --sidebar-width: 340px;
            --max-bubble-width: 520px;
            --avatar-size: 40px;
            --avatar-size-sm: 32px;
            --avatar-size-lg: 48px;
        }

        /* ============================================================
           DARK THEME
           ============================================================ */
        [data-theme="dark"] {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-chat: #0f0f0f;
            --bg-header: rgba(26, 26, 26, 0.94);
            --bg-sidebar: #1a1a1a;
            --bg-input: #1a1a1a;
            --bg-modal: rgba(0, 0, 0, 0.65);
            --bg-tooltip: rgba(50, 50, 50, 0.95);
            --bg-hover: rgba(255, 255, 255, 0.06);
            --bg-active: rgba(255, 255, 255, 0.1);
            --bg-skeleton: linear-gradient(90deg, #2a2a2a 25%, #333 50%, #2a2a2a 75%);

            --bubble-charon: #262626;
            --bubble-charon-shadow: rgba(0, 0, 0, 0.2);
            --bubble-corey: #2563eb;
            --bubble-corey-shadow: rgba(37, 99, 235, 0.25);
            --bubble-system: rgba(255, 255, 255, 0.06);

            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-tertiary: #666666;
            --text-inverse: #ffffff;
            --text-charon: #f0f0f0;
            --text-corey: #ffffff;
            --text-system: #888888;
            --text-code: #f472b6;
            --text-code-bg: rgba(244, 114, 182, 0.12);

            --accent-charon-light: rgba(249, 115, 22, 0.1);
            --accent-corey-light: rgba(59, 130, 246, 0.1);

            --border-primary: rgba(255, 255, 255, 0.08);
            --border-secondary: rgba(255, 255, 255, 0.04);

            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.3);
            --shadow-bubble-charon: 0 1px 4px rgba(0, 0, 0, 0.3);
            --shadow-bubble-corey: 0 1px 4px rgba(37, 99, 235, 0.3);
            --shadow-header: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-float: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* ============================================================
           RESET & BASE STYLES
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-primary);
            font-size: var(--font-size-base);
            line-height: var(--line-height-normal);
            color: var(--text-primary);
            background-color: var(--bg-primary);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        button {
            font-family: inherit;
            font-size: inherit;
            border: none;
            background: none;
            cursor: pointer;
            outline: none;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        input, textarea {
            font-family: inherit;
            font-size: inherit;
            border: none;
            background: none;
            outline: none;
            color: inherit;
        }

        img, svg {
            display: block;
            max-width: 100%;
        }

        a {
            color: var(--text-link);
            text-decoration: none;
        }

        ::selection {
            background-color: rgba(59, 130, 246, 0.25);
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-tertiary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* ============================================================
           APP LAYOUT
           ============================================================ */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-slow), opacity var(--transition-slow);
            z-index: var(--z-sticky);
            position: relative;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-5);
            border-bottom: 1px solid var(--border-secondary);
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: var(--font-size-lg);
            font-weight: 700;
            letter-spacing: var(--letter-spacing-tight);
            color: var(--text-primary);
        }

        .sidebar-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .sidebar-action-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            transition: background var(--transition-fast);
            color: var(--text-secondary);
        }

        .sidebar-action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-search {
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--border-secondary);
            flex-shrink: 0;
        }

        .sidebar-search-input {
            width: 100%;
            height: 38px;
            padding: 0 var(--space-4);
            padding-left: 38px;
            background: var(--bg-primary);
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            color: var(--text-primary);
            transition: box-shadow var(--transition-fast);
            position: relative;
        }

        .sidebar-search-wrapper {
            position: relative;
        }

        .sidebar-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .sidebar-search-input:focus {
            box-shadow: 0 0 0 2px var(--border-focus);
        }

        .sidebar-search-input::placeholder {
            color: var(--text-tertiary);
        }

        .sidebar-conversations {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: var(--space-2) 0;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-5);
            cursor: pointer;
            transition: background var(--transition-fast);
            position: relative;
        }

        .conversation-item:hover {
            background: var(--bg-hover);
        }

        .conversation-item.active {
            background: var(--bg-active);
        }

        .conversation-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--accent-corey);
            border-radius: 0 var(--radius-full) var(--radius-full) 0;
        }

        .conversation-avatar-group {
            position: relative;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        .conversation-avatar-group .avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            position: absolute;
            border: 2px solid var(--bg-sidebar);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .conversation-avatar-group .avatar-mini:first-child {
            top: 0;
            left: 0;
            background: var(--accent-charon-gradient);
        }

        .conversation-avatar-group .avatar-mini:last-child {
            bottom: 0;
            right: 0;
            background: var(--accent-corey-gradient);
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .conversation-info-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
        }

        .conversation-name {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .conversation-preview {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .conversation-badge {
            position: absolute;
            top: var(--space-3);
            right: var(--space-5);
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            background: var(--accent-corey);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-footer {
            padding: var(--space-4) var(--space-5);
            border-top: 1px solid var(--border-secondary);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-shrink: 0;
        }

        .sidebar-user-avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: var(--font-size-sm);
            flex-shrink: 0;
        }

        .sidebar-user-info {
            flex: 1;
            min-width: 0;
        }

        .sidebar-user-name {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .sidebar-user-status {
            font-size: var(--font-size-xs);
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sidebar-user-status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: var(--radius-full);
            background: var(--accent-green);
            display: inline-block;
        }

        /* ============================================================
           MAIN CHAT AREA
           ============================================================ */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            position: relative;
            background: var(--bg-chat);
        }

        /* ============================================================
           CHAT HEADER
           ============================================================ */
        .chat-header {
            height: var(--header-height);
            background: var(--bg-header);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            padding: 0 var(--space-5);
            gap: var(--space-4);
            flex-shrink: 0;
            z-index: var(--z-header);
            box-shadow: var(--shadow-header);
        }

        .chat-header-back {
            display: none;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            transition: background var(--transition-fast);
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .chat-header-back:hover {
            background: var(--bg-hover);
        }

        .chat-header-avatar-group {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header-avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: var(--font-size-sm);
            color: #fff;
            border: 2px solid var(--bg-header);
            position: relative;
        }

        .chat-header-avatar.charon {
            background: var(--accent-charon-gradient);
            z-index: 2;
        }

        .chat-header-avatar.corey {
            background: var(--accent-corey-gradient);
            margin-left: -10px;
            z-index: 1;
        }

        .chat-header-avatar .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border: 2px solid var(--bg-header);
            border-radius: var(--radius-full);
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-title {
            font-size: var(--font-size-md);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: var(--letter-spacing-tight);
            line-height: 1.3;
        }

        .chat-header-subtitle {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: var(--space-1);
            line-height: 1.3;
        }

        .chat-header-subtitle .typing-status {
            color: var(--accent-green);
            font-weight: 500;
        }

        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            flex-shrink: 0;
        }

        .chat-header-action-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            transition: background var(--transition-fast), color var(--transition-fast);
            color: var(--text-secondary);
        }

        .chat-header-action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .chat-header-action-btn.active {
            color: var(--accent-corey);
            background: var(--accent-corey-light);
        }

        /* ============================================================
           EPISODE SELECTOR
           ============================================================ */
        .episode-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-3) var(--space-5);
            gap: var(--space-2);
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-secondary);
            flex-shrink: 0;
        }

        .episode-tab {
            padding: var(--space-2) var(--space-5);
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            cursor: pointer;
            position: relative;
            white-space: nowrap;
        }

        .episode-tab:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .episode-tab.active {
            color: var(--text-inverse);
            background: var(--accent-corey-gradient);
            box-shadow: var(--shadow-sm);
        }

        .episode-tab .tab-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            font-size: 10px;
            font-weight: 700;
            border-radius: var(--radius-full);
            margin-left: 4px;
            background: rgba(255, 255, 255, 0.2);
        }

        .episode-tab:not(.active) .tab-badge {
            background: var(--bg-active);
            color: var(--text-secondary);
        }

        /* ============================================================
           CHAT MESSAGES AREA
           ============================================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: var(--space-4) var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
            scroll-behavior: smooth;
            position: relative;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.3);
            border-radius: var(--radius-full);
        }

        /* Date Separator */
        .date-separator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4) 0;
            position: relative;
        }

        .date-separator-text {
            background: var(--bubble-system);
            backdrop-filter: blur(10px);
            padding: var(--space-1) var(--space-4);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 500;
            color: var(--text-system);
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        /* System Message */
        .system-message {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-2) 0;
        }

        .system-message-text {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
            font-style: italic;
            text-align: center;
            max-width: 80%;
        }

        /* ============================================================
           MESSAGE ROW
           ============================================================ */
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: var(--space-2);
            max-width: 85%;
            opacity: 0;
            transform: translateY(16px) scale(0.97);
            animation: messageAppear 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .message-row.left {
            align-self: flex-start;
        }

        .message-row.right {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row .message-avatar {
            width: var(--avatar-size-sm);
            height: var(--avatar-size-sm);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .message-row.show-avatar .message-avatar {
            opacity: 1;
        }

        .message-row:not(.show-avatar) .message-avatar {
            visibility: hidden;
        }

        .message-row.left .message-avatar {
            background: var(--accent-charon-gradient);
        }

        .message-row.right .message-avatar {
            background: var(--accent-corey-gradient);
        }

        .message-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .message-row.right .message-content-wrapper {
            align-items: flex-end;
        }

        .message-row.left .message-content-wrapper {
            align-items: flex-start;
        }

        .message-sender-name {
            font-size: var(--font-size-xs);
            font-weight: 600;
            padding: 0 var(--space-3);
            margin-bottom: 1px;
        }

        .message-row.left .message-sender-name {
            color: var(--accent-charon);
        }

        .message-row.right .message-sender-name {
            color: var(--accent-corey);
        }

        /* ============================================================
           MESSAGE BUBBLE
           ============================================================ */
        .message-bubble {
            padding: var(--space-3) var(--space-4);
            max-width: var(--max-bubble-width);
            font-size: var(--font-size-base);
            line-height: var(--line-height-normal);
            letter-spacing: var(--letter-spacing-normal);
            word-break: break-word;
            overflow-wrap: break-word;
            position: relative;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }

        .message-bubble:hover {
            transform: translateY(-1px);
        }

        .message-row.left .message-bubble {
            background: var(--bubble-charon);
            color: var(--text-charon);
            border-radius: var(--radius-bubble);
            box-shadow: var(--shadow-bubble-charon);
        }

        .message-row.left.show-avatar .message-bubble {
            border-bottom-left-radius: 4px;
        }

        .message-row.left:not(.show-avatar) .message-bubble {
            border-bottom-left-radius: 4px;
            border-top-left-radius: 4px;
        }

        .message-row.right .message-bubble {
            background: var(--bubble-corey);
            color: var(--text-corey);
            border-radius: var(--radius-bubble);
            box-shadow: var(--shadow-bubble-corey);
        }

        .message-row.right.show-avatar .message-bubble {
            border-bottom-right-radius: 4px;
        }

        .message-row.right:not(.show-avatar) .message-bubble {
            border-bottom-right-radius: 4px;
            border-top-right-radius: 4px;
        }

        /* Long message (Corey's technical explanations) */
        .message-bubble.long-message {
            max-width: 600px;
        }

        .message-bubble .technical-term {
            font-family: var(--font-mono);
            font-size: 0.88em;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 500;
        }

        .message-row.left .message-bubble .technical-term {
            background: var(--text-code-bg);
            color: var(--text-code);
        }

        .message-row.right .message-bubble .technical-term {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .message-bubble .emphasis {
            font-weight: 600;
        }

        .message-row.right .message-bubble .emphasis {
            color: #fde68a;
        }

        .message-row.left .message-bubble .emphasis {
            color: var(--accent-charon);
        }

        /* Message Meta (time, read status) */
        .message-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 var(--space-3);
            opacity: 0;
            transition: opacity var(--transition-base);
        }

        .message-row:hover .message-meta,
        .message-row.show-meta .message-meta {
            opacity: 1;
        }

        .message-time {
            font-size: 10px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        .message-read-status {
            display: flex;
            align-items: center;
            color: var(--accent-corey);
        }

        .message-read-status svg {
            width: 14px;
            height: 14px;
        }

        /* ============================================================
           TYPING INDICATOR
           ============================================================ */
        .typing-indicator-row {
            display: flex;
            align-items: flex-end;
            gap: var(--space-2);
            align-self: flex-start;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            max-width: 85%;
        }

        .typing-indicator-row.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .typing-indicator-row .message-avatar {
            width: var(--avatar-size-sm);
            height: var(--avatar-size-sm);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
        }

        .typing-indicator-row.charon .message-avatar {
            background: var(--accent-charon-gradient);
        }

        .typing-indicator-row.corey .message-avatar {
            background: var(--accent-corey-gradient);
        }

        .typing-indicator-bubble {
            padding: var(--space-3) var(--space-5);
            border-radius: var(--radius-bubble);
            border-bottom-left-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 42px;
        }

        .typing-indicator-row.charon .typing-indicator-bubble {
            background: var(--bubble-charon);
            box-shadow: var(--shadow-bubble-charon);
        }

        .typing-indicator-row.corey .typing-indicator-bubble {
            background: var(--bubble-corey);
            box-shadow: var(--shadow-bubble-corey);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: var(--radius-full);
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator-row.charon .typing-dot {
            background: var(--text-tertiary);
        }

        .typing-indicator-row.corey .typing-dot {
            background: rgba(255, 255, 255, 0.6);
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ============================================================
           SCROLL TO BOTTOM BUTTON
           ============================================================ */
        .scroll-bottom-btn {
            position: absolute;
            bottom: 80px;
            right: var(--space-5);
            width: 42px;
            height: 42px;
            border-radius: var(--radius-full);
            background: var(--bg-secondary);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            z-index: var(--z-base);
            opacity: 0;
            transform: scale(0.8) translateY(10px);
            pointer-events: none;
            transition: all var(--transition-base);
            border: 1px solid var(--border-primary);
        }

        .scroll-bottom-btn.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .scroll-bottom-btn:hover {
            background: var(--accent-corey);
            color: #fff;
            box-shadow: var(--shadow-xl);
        }

        .scroll-bottom-btn .new-msg-count {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: var(--accent-red);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-chat);
        }

        /* ============================================================
           CHAT INPUT AREA
           ============================================================ */
        .chat-input-area {
            padding: var(--space-3) var(--space-5);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-primary);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .chat-input-controls {
            display: flex;
            flex: 1;
            align-items: center;
            background: var(--bg-primary);
            border-radius: var(--radius-2xl);
            padding: 0 var(--space-2);
            border: 1px solid var(--border-primary);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            min-height: 46px;
        }

        .chat-input-controls:focus-within {
            border-color: var(--accent-corey);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .chat-input-controls .input-action {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            color: var(--text-tertiary);
            transition: color var(--transition-fast), background var(--transition-fast);
            flex-shrink: 0;
        }

        .chat-input-controls .input-action:hover {
            color: var(--text-secondary);
            background: var(--bg-hover);
        }

        .chat-input-text {
            flex: 1;
            padding: var(--space-3) var(--space-2);
            font-size: var(--font-size-base);
            line-height: 1.4;
            min-height: 24px;
            max-height: 120px;
            resize: none;
            color: var(--text-primary);
        }

        .chat-input-text::placeholder {
            color: var(--text-tertiary);
        }

        .chat-send-btn {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-full);
            background: var(--accent-corey-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), opacity var(--transition-fast);
            flex-shrink: 0;
            opacity: 0.5;
            pointer-events: none;
        }

        .chat-send-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .chat-send-btn:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-md);
        }

        .chat-send-btn:active {
            transform: scale(0.95);
        }

        /* ============================================================
           PLAYBACK CONTROLS
           ============================================================ */
        .playback-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-5);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-secondary);
            flex-shrink: 0;
        }

        .playback-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            transition: all var(--transition-fast);
            color: var(--text-secondary);
        }

        .playback-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .playback-btn.primary {
            width: 48px;
            height: 48px;
            background: var(--accent-corey-gradient);
            color: #fff;
            box-shadow: var(--shadow-md);
        }

        .playback-btn.primary:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-lg);
        }

        .playback-btn.primary:active {
            transform: scale(0.95);
        }

        .playback-progress {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .playback-progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-active);
            border-radius: var(--radius-full);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .playback-progress-fill {
            height: 100%;
            background: var(--accent-corey-gradient);
            border-radius: var(--radius-full);
            width: 0%;
            transition: width 0.1s linear;
        }

        .playback-progress-bar:hover .playback-progress-fill {
            height: 6px;
            margin-top: -1px;
        }

        .playback-progress-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .playback-current,
        .playback-total {
            font-size: 10px;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
        }

        .playback-speed-btn {
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 700;
            color: var(--text-secondary);
            background: var(--bg-hover);
            transition: all var(--transition-fast);
            min-width: 50px;
            text-align: center;
        }

        .playback-speed-btn:hover {
            background: var(--bg-active);
            color: var(--text-primary);
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes messageAppear {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes ripple {
            from { transform: scale(0); opacity: 0.5; }
            to { transform: scale(4); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ============================================================
           LOADING / SPLASH SCREEN
           ============================================================ */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: var(--z-max);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-8);
        }

        .splash-avatar {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        .splash-avatar.charon {
            background: var(--accent-charon-gradient);
            animation-delay: 0s;
        }

        .splash-avatar.corey {
            background: var(--accent-corey-gradient);
            animation-delay: 0.5s;
        }

        .splash-and {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .splash-title {
            font-size: var(--font-size-2xl);
            font-weight: 800;
            color: #fff;
            letter-spacing: var(--letter-spacing-tight);
            margin-bottom: var(--space-2);
            text-align: center;
        }

        .splash-subtitle {
            font-size: var(--font-size-sm);
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-bottom: var(--space-10);
        }

        .splash-loader {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
        }

        .splash-loader-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-charon), var(--accent-corey));
            border-radius: var(--radius-full);
            width: 0%;
            transition: width 0.3s ease;
        }

        .splash-stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .splash-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: var(--radius-full);
            animation: starTwinkle 2s ease-in-out infinite;
        }

        /* ============================================================
           MARS BACKGROUND EFFECT (for Episode 2)
           ============================================================ */
        .mars-bg-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .mars-bg-layer.visible {
            opacity: 1;
        }

        .mars-bg-layer .mars-gradient {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 80% 20%, rgba(249, 115, 22, 0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 20% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 60%);
        }

        .mars-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(249, 115, 22, 0.15);
            border-radius: var(--radius-full);
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
        }

        /* ============================================================
           RESPONSIVE DESIGN
           ============================================================ */
        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                z-index: var(--z-overlay);
                box-shadow: none;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: var(--shadow-2xl);
            }

            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: var(--bg-modal);
                z-index: calc(var(--z-overlay) - 1);
                opacity: 0;
                visibility: hidden;
                transition: opacity var(--transition-slow), visibility var(--transition-slow);
            }

            .sidebar-overlay.visible {
                opacity: 1;
                visibility: visible;
            }

            .chat-header-back {
                display: flex;
            }

            .message-row {
                max-width: 92%;
            }

            .message-bubble.long-message {
                max-width: 100%;
            }
        }

        @media (max-width: 640px) {
            :root {
                --header-height: 56px;
                --font-size-base: 0.875rem;
                --space-5: 1rem;
                --max-bubble-width: 100%;
                --avatar-size: 36px;
                --avatar-size-sm: 28px;
            }

            .message-row {
                max-width: 95%;
            }

            .chat-messages {
                padding: var(--space-3) var(--space-3);
            }

            .episode-selector {
                padding: var(--space-2) var(--space-3);
            }

            .episode-tab {
                padding: var(--space-2) var(--space-3);
                font-size: var(--font-size-xs);
            }

            .playback-bar {
                gap: var(--space-2);
                padding: var(--space-2) var(--space-3);
            }

            .playback-btn {
                width: 34px;
                height: 34px;
            }

            .playback-btn.primary {
                width: 42px;
                height: 42px;
            }
        }

        /* ============================================================
           MODAL / SETTINGS PANEL
           ============================================================ */
        .settings-modal {
            position: fixed;
            inset: 0;
            z-index: var(--z-modal);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow), visibility var(--transition-slow);
        }

        .settings-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .settings-modal-backdrop {
            position: absolute;
            inset: 0;
            background: var(--bg-modal);
        }

        .settings-modal-content {
            position: relative;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-2xl);
            width: 90%;
            max-width: 420px;
            padding: var(--space-8);
            transform: scale(0.95) translateY(10px);
            transition: transform var(--transition-slow);
        }

        .settings-modal.open .settings-modal-content {
            transform: scale(1) translateY(0);
        }

        .settings-modal-title {
            font-size: var(--font-size-xl);
            font-weight: 800;
            margin-bottom: var(--space-6);
            color: var(--text-primary);
        }

        .settings-group {
            margin-bottom: var(--space-6);
        }

        .settings-group-label {
            font-size: var(--font-size-xs);
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: var(--space-3);
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-3) 0;
        }

        .settings-row-label {
            font-size: var(--font-size-sm);
            color: var(--text-primary);
            font-weight: 500;
        }

        .toggle-switch {
            width: 48px;
            height: 28px;
            border-radius: var(--radius-full);
            background: var(--bg-active);
            position: relative;
            cursor: pointer;
            transition: background var(--transition-base);
        }

        .toggle-switch.active {
            background: var(--accent-corey);
        }

        .toggle-switch-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: var(--radius-full);
            background: #fff;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition-base);
        }

        .toggle-switch.active .toggle-switch-thumb {
            transform: translateX(20px);
        }

        .settings-close-btn {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: all var(--transition-fast);
        }

        .settings-close-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* ============================================================
           REACTION PICKER
           ============================================================ */
        .reaction-picker {
            position: absolute;
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-float);
            padding: var(--space-2) var(--space-3);
            display: flex;
            align-items: center;
            gap: var(--space-1);
            z-index: var(--z-dropdown);
            opacity: 0;
            transform: scale(0.8) translateY(8px);
            pointer-events: none;
            transition: all var(--transition-spring);
            border: 1px solid var(--border-primary);
        }

        .reaction-picker.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .reaction-emoji {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: var(--radius-full);
            transition: all var(--transition-fast);
            cursor: pointer;
        }

        .reaction-emoji:hover {
            background: var(--bg-hover);
            transform: scale(1.3);
        }

        .message-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .message-reaction {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-primary);
            background: var(--bg-secondary);
        }

        .message-reaction:hover {
            border-color: var(--accent-corey);
        }

        .message-reaction .reaction-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ============================================================
           NARRATOR TEXT / PROSE ENDING
           ============================================================ */
        .narrator-block {
            padding: var(--space-6) var(--space-8);
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
        }

        .narrator-text {
            font-size: var(--font-size-sm);
            color: var(--text-tertiary);
            line-height: var(--line-height-relaxed);
            font-style: italic;
            max-width: 500px;
            margin: 0 auto;
            font-family: var(--font-rounded);
        }

        .narrator-text .mars-emoji {
            font-style: normal;
        }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        .toast-container {
            position: fixed;
            top: var(--space-5);
            right: var(--space-5);
            z-index: var(--z-toast);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            pointer-events: none;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-float);
            padding: var(--space-3) var(--space-5);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            font-size: var(--font-size-sm);
            color: var(--text-primary);
            pointer-events: auto;
            opacity: 0;
            transform: translateX(30px);
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            max-width: 360px;
        }

        .toast.exit {
            animation: toastOut 0.3s ease forwards;
        }

        @keyframes toastIn {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            to { opacity: 0; transform: translateX(30px); }
        }

        .toast-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        /* ============================================================
           UTILITY CLASSES
           ============================================================ */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
