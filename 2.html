    const StateManager = {
        storageKey: 'charon-corey-state',

        save() {
            try {
                const data = {
                    episode: App.state.currentEpisode,
                    messageIndex: Playback.absoluteIndex,
                    senderCount: Playback.senderMessageCount,
                    speed: App.state.currentSpeedIndex,
                    sound: App.state.soundEnabled,
                    typing: App.state.typingAnimation,
                    bgEffects: App.state.bgEffects,
                    showNames: App.state.showNames,
                    showTimes: App.state.showTimes,
                    timestamp: Date.now(),
                };
                sessionStorage.setItem(this.storageKey, JSON.stringify(data));
            } catch (e) {
                // Silently fail (e.g., private browsing)
            }
        },

        load() {
            try {
                const raw = sessionStorage.getItem(this.storageKey);
                if (!raw) return null;
                const data = JSON.parse(raw);

                // Only restore if saved within the last 30 minutes
                if (Date.now() - data.timestamp > 30 * 60 * 1000) {
                    sessionStorage.removeItem(this.storageKey);
                    return null;
                }

                return data;
            } catch (e) {
                return null;
            }
        },

        clear() {
            try {
                sessionStorage.removeItem(this.storageKey);
            } catch (e) {
                // Silently fail
            }
        },

        /**
         * Initialize auto-save: save state periodically and on unload
         */
        init() {
            // Save on page unload
            window.addEventListener('beforeunload', () => {
                this.save();
            });

            // Also save periodically while playing
            setInterval(() => {
                if (Playback.isRunning || Playback.senderMessageCount > 0) {
                    this.save();
                }
            }, 5000);

            // Attempt to restore on start
            const saved = this.load();
            if (saved && saved.messageIndex > 0) {
                this.offerRestore(saved);
            }
        },

        offerRestore(data) {
            const epNames = { 1: '第1回', 2: '第2回' };
            const epName = epNames[data.episode] || '不明';

            setTimeout(() => {
                const container = Utils.$('toastContainer');
                if (!container) return;

                const toast = Utils.createElement('div', {
                    className: 'toast',
                    style: {
                        cursor: 'pointer',
                        pointerEvents: 'auto',
                    },
                });

                toast.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    <span>${epName}の続きから再開しますか？（${data.senderCount}メッセージ目）</span>
                `;

                toast.addEventListener('click', () => {
                    this.restoreState(data);
                    toast.classList.add('exit');
                    setTimeout(() => {
                        if (toast.parentNode) toast.parentNode.removeChild(toast);
                    }, 350);
                });

                container.appendChild(toast);

                // Auto-dismiss after 10 seconds
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.classList.add('exit');
                        setTimeout(() => {
                            if (toast.parentNode) toast.parentNode.removeChild(toast);
                        }, 350);
                    }
                }, 10000);
            }, 1500);
        },

        restoreState(data) {
            // Restore settings
            App.state.currentSpeedIndex = data.speed || 1;
            App.state.soundEnabled = data.sound !== false;
            App.state.typingAnimation = data.typing !== false;
            App.state.bgEffects = data.bgEffects !== false;
            App.state.showNames = data.showNames !== false;
            App.state.showTimes = data.showTimes !== false;

            // Update speed button
            const speedBtn = Utils.$('speedBtn');
            if (speedBtn) speedBtn.textContent = Utils.getSpeedLabel();

            // Switch to saved episode
            if (data.episode !== App.state.currentEpisode) {
                Playback.switchEpisode(data.episode);
            }

            // Batch render up to the saved position
            const messages = App.episodes[data.episode];
            if (messages && data.messageIndex >= 0 && data.messageIndex < messages.length) {
                Playback.absoluteIndex = data.messageIndex;
                Playback.senderMessageCount = data.senderCount;
                Renderer.batchRender(messages, data.messageIndex);
                Playback.updateProgressUI();

                ToastManager.show('再開しました', 'success', 2000);
            }
        },

                        last.focus();

            const observer = new MutationObserver(
                Utils.debounce(() => {
                    this.applyGroupSpacing(container);
                }, 50)
            );

            observer.observe(container, { childList: true });
        },

        applyGroupSpacing(container) {
            const rows = container.querySelectorAll('.message-row');
            let prevSender = null;

            rows.forEach((row, idx) => {
                const sender = row.dataset.sender;
                if (!sender) return;

                if (prevSender && prevSender !== sender) {
                    // Different sender — add extra margin
                    row.style.marginTop = '14px';
                } else if (idx > 0 && prevSender === sender) {
                    // Same sender — tighter spacing
                    row.style.marginTop = '2px';
                }

                prevSender = sender;
            });
        },
    };

    MessageGrouper.init();


    /**
     * ============================================================
     * SMOOTH SCROLL MOMENTUM
     * Enhances native scroll with custom momentum for desktop.
     * Uses passive event listeners for performance.
     * ============================================================
     */
    const SmoothScrollEnhancer = {
        init() {
            const container = Utils.$('chatMessages');
            if (!container) return;

            // Custom wheel handler for smoother scrolling on desktop
            let isScrolling = false;

            container.addEventListener('wheel', (e) => {
                // Let native scrolling handle it, but update
                // scroll button visibility after scrolling stops
                if (!isScrolling) {
                    isScrolling = true;
                    requestAnimationFrame(() => {
                        isScrolling = false;
                    });
                }
            }, { passive: true });
        },
    };

    SmoothScrollEnhancer.init();


    /**
     * ============================================================
     * DOUBLE TAP TO LIKE (Mobile)
     * Double-tap on a message to add a ❤️ reaction.
     * ============================================================
     */
    const DoubleTapLike = {
        lastTap: 0,
        lastTarget: null,

        init() {
            const container = Utils.$('chatMessages');
            if (!container) return;

            container.addEventListener('touchend', (e) => {
                const bubble = e.target.closest('.message-bubble');
                if (!bubble) return;

                const now = Date.now();
                const timeDiff = now - this.lastTap;

                if (timeDiff < 300 && this.lastTarget === bubble) {
                    // Double tap detected
                    const row = bubble.closest('.message-row');
                    if (row) {
                        const index = parseInt(row.dataset.index);
                        if (!isNaN(index)) {
                            ReactionSystem.addReaction(index, '❤️');
                            this.showHeartAnimation(bubble);
                        }
                    }
                    this.lastTap = 0;
                    this.lastTarget = null;
                } else {
                    this.lastTap = now;
                    this.lastTarget = bubble;
                }
            }, { passive: true });
        },

        showHeartAnimation(bubble) {
            const rect = bubble.getBoundingClientRect();
            const heart = Utils.createElement('div', {
                style: {
                    position: 'fixed',
                    left: `${rect.left + rect.width / 2 - 20}px`,
                    top: `${rect.top + rect.height / 2 - 20}px`,
                    fontSize: '40px',
                    zIndex: '10000',
                    pointerEvents: 'none',
                    animation: 'heartPop 0.8s ease-out forwards',
                    lineHeight: '1',
                },
            });
            heart.textContent = '❤️';
            document.body.appendChild(heart);

            setTimeout(() => {
                if (heart.parentNode) heart.parentNode.removeChild(heart);
            }, 900);
        },
    };

    DoubleTapLike.init();

    // Heart animation keyframe
    const heartStyle = document.createElement('style');
    heartStyle.textContent = `
        @keyframes heartPop {
            0% {
                transform: scale(0) rotate(-15deg);
                opacity: 1;
            }
            40% {
                transform: scale(1.4) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(1.8) translateY(-40px) rotate(10deg);
                opacity: 0;
            }
        }
    `;
    document.head.appendChild(heartStyle);


    /**
     * ============================================================
     * CONVERSATION EXPORT
     * Allows exporting the conversation as plain text.
     * ============================================================
     */
    const ConversationExport = {
        init() {
            // Add export via keyboard shortcut Ctrl+Shift+E
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'E') {
                    e.preventDefault();
                    this.exportCurrentEpisode();
                }
            });
        },

        exportCurrentEpisode() {
            const ep = App.state.currentEpisode;
            const messages = App.episodes[ep];

            if (!messages || messages.length === 0) {
                ToastManager.show('エクスポートするメッセージがありません', 'warning', 2000);
                return;
            }

            const epTitles = {
                1: 'カロンとコレーの雑談トーク 第1回：カフェとAI',
                2: 'カロンとコレーの雑談トーク 第2回：火星移住',
            };

            let output = `${epTitles[ep] || 'トーク'}\n`;
            output += '═'.repeat(50) + '\n\n';

            messages.forEach(msg => {
                if (msg.type === 'date') {
                    output += `\n─── ${msg.text} ───\n\n`;
                } else if (msg.type === 'system') {
                    output += `[ ${msg.text} ]\n\n`;
                } else if (msg.type === 'narrator') {
                    output += `\n（${msg.text}）\n`;
                } else if (msg.sender) {
                    const name = msg.sender === 'corey' ? 'コレー' : 'カロン';
                    const time = msg.time || '';
                    const plainText = msg.text.replace(/<[^>]*>/g, '');
                    output += `[${time}] ${name}:\n${plainText}\n\n`;
                }
            });

            // Create and download the file
            const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `charon-corey-ep${ep}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            ToastManager.show('テキストファイルをダウンロードしました', 'success', 3000);
        },
    };

    ConversationExport.init();


    /**
     * ============================================================
     * ADAPTIVE TIMING
     * Adjusts message delivery timing based on message length,
     * creating a more natural reading rhythm.
     * ============================================================
     */
    const AdaptiveTiming = {
        /**
         * Calculate a natural typing duration based on text length.
         * Average typing speed: ~6 chars/sec (displayed chars).
         * We add some randomness for realism.
         */
        calculateTypingDuration(text, baseDuration) {
            const plainText = text.replace(/<[^>]*>/g, '');
            const charCount = plainText.length;

            // Base: 150ms per character, capped
            const calculated = Math.min(
                Math.max(charCount * 25 + 300, 500),
                4000
            );

            // Blend with the authored baseDuration (70% authored, 30% calculated)
            return Math.round(baseDuration * 0.7 + calculated * 0.3);
        },

        /**
         * Calculate a natural reading pause between messages.
         * Longer messages get longer pauses after them.
         */
        calculateReadingPause(prevText, baseDelay) {
            if (!prevText) return baseDelay;

            const plainText = prevText.replace(/<[^>]*>/g, '');
            const wordCount = plainText.length;

            // Add extra pause for long messages (reading time)
            const extraPause = Math.min(wordCount * 3, 600);

            return Math.round(baseDelay + extraPause * 0.3);
        },

        init() {
            // Patch the playback loop to use adaptive timing
            const originalLoop = Playback.runPlaybackLoop.bind(Playback);

            Playback.runPlaybackLoop = async function () {
                const signal = Playback.abortController
                    ? Playback.abortController.signal
                    : null;

                let prevMsgText = null;

                while (
                    Playback.isRunning &&
                    Playback.absoluteIndex < Playback.currentMessages.length - 1
                ) {
                    Playback.absoluteIndex++;
                    const msg = Playback.currentMessages[Playback.absoluteIndex];

                    // Non-sender messages
                    if (msg.type === 'date' || msg.type === 'system') {
                        Renderer.renderMessage(msg, Playback.absoluteIndex);
                        await Playback.abortableSleep(
                            Utils.getAdjustedDelay(300),
                            signal
                        );
                        prevMsgText = null;
                        continue;
                    }

                    if (msg.type === 'narrator') {
                        const delay = msg.delay || 800;
                        await Playback.abortableSleep(
                            Utils.getAdjustedDelay(delay),
                            signal
                        );
                        Renderer.renderMessage(msg, Playback.absoluteIndex);
                        await Playback.abortableSleep(
                            Utils.getAdjustedDelay(1500),
                            signal
                        );
                        prevMsgText = null;
                        continue;
                    }

                    if (msg.sender) {
                        // Adaptive pre-delay
                        const adaptedDelay = AdaptiveTiming.calculateReadingPause(
                            prevMsgText,
                            msg.delay || 500
                        );
                        await Playback.abortableSleep(
                            Utils.getAdjustedDelay(adaptedDelay),
                            signal
                        );

                        // Show typing indicator
                        if (App.state.typingAnimation) {
                            Renderer.showTypingIndicator(msg.sender);

                            const adaptedTyping = AdaptiveTiming.calculateTypingDuration(
                                msg.text,
                                msg.typingDuration || 1000
                            );
                            await Playback.abortableSleep(
                                Utils.getAdjustedTypingDuration(adaptedTyping),
                                signal
                            );

                            Renderer.removeTypingIndicator();
                            await Playback.abortableSleep(
                                Utils.getAdjustedDelay(80),
                                signal
                            );
                        }

                        // Render message
                        Playback.senderMessageCount++;
                        Renderer.renderMessage(msg, Playback.absoluteIndex);
                        Playback.updateProgressUI();

                        prevMsgText = msg.text;
                    }
                }

                // Playback complete
                Playback.isRunning = false;
                App.state.isPlaying = false;
                Playback.updatePlayPauseIcon();

                if (Playback.absoluteIndex >= Playback.currentMessages.length - 1) {
                    Playback.markEpisodeComplete();
                }
            };
        },
    };

    AdaptiveTiming.init();


    /**
     * ============================================================
     * SMOOTH EPISODE TRANSITION
     * Adds a fade effect when switching between episodes.
     * ============================================================
     */
    const EpisodeTransition = {
        init() {
            const originalSwitch = Playback.switchEpisode.bind(Playback);

            Playback.switchEpisode = (episodeNumber) => {
                if (App.state.currentEpisode === episodeNumber && Playback.absoluteIndex < 0) {
                    return;
                }

                const container = Utils.$('chatMessages');
                if (!container) {
                    originalSwitch(episodeNumber);
                    return;
                }

                // Fade out
                container.style.transition = 'opacity 0.25s ease';
                container.style.opacity = '0';

                setTimeout(() => {
                    originalSwitch(episodeNumber);

                    // Fade in
                    requestAnimationFrame(() => {
                        container.style.opacity = '1';

                        setTimeout(() => {
                            container.style.transition = '';
                        }, 300);
                    });
                }, 250);
            };
        },
    };

    EpisodeTransition.init();


    /**
     * ============================================================
     * UNREAD COUNT BADGE SYSTEM
     * Updates the unread count badge on the conversation item
     * and browser tab title.
     * ============================================================
     */
    const UnreadBadge = {
        baseTitle: 'カロン & コレー — 雑談トーク',
        unreadCount: 0,

        init() {
            // Patch Renderer.renderMessage to count new messages
            const originalRender = Renderer.renderMessage.bind(Renderer);

            Renderer.renderMessage = (msgData, absIdx) => {
                originalRender(msgData, absIdx);

                if (msgData.sender && document.hidden) {
                    this.unreadCount++;
                    this.updateTitle();
                }
            };

            // Reset on visibility change
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && this.unreadCount > 0) {
                    this.unreadCount = 0;
                    this.updateTitle();
                }
            });
        },

        updateTitle() {
            if (this.unreadCount > 0) {
                document.title = `(${this.unreadCount}) ${this.baseTitle}`;
            } else {
                document.title = this.baseTitle;
            }
        },
    };

    UnreadBadge.init();


    /**
     * ============================================================
     * ANIMATED BACKGROUND GRADIENT
     * Subtle shifting gradient behind the chat area.
     * ============================================================
     */
    const BackgroundGradient = {
        init() {
            const chatMain = Utils.$('chatMain');
            if (!chatMain) return;

            const gradientStyle = document.createElement('style');
            gradientStyle.textContent = `
                .chat-main::before {
                    content: '';
                    position: absolute;
                    inset: 0;
                    pointer-events: none;
                    z-index: 0;
                    opacity: 0.3;
                    background:
                        radial-gradient(
                            ellipse 80% 50% at 20% 80%,
                            rgba(249, 115, 22, 0.015) 0%,
                            transparent 50%
                        ),
                        radial-gradient(
                            ellipse 60% 60% at 80% 20%,
                            rgba(59, 130, 246, 0.015) 0%,
                            transparent 50%
                        );
                    animation: bgGradientShift 30s ease-in-out infinite alternate;
                }

                @keyframes bgGradientShift {
                    0% {
                        opacity: 0.2;
                    }
                    50% {
                        opacity: 0.4;
                    }
                    100% {
                        opacity: 0.2;
                    }
                }

                [data-theme="dark"] .chat-main::before {
                    opacity: 0.5;
                    background:
                        radial-gradient(
                            ellipse 80% 50% at 20% 80%,
                            rgba(249, 115, 22, 0.02) 0%,
                            transparent 50%
                        ),
                        radial-gradient(
                            ellipse 60% 60% at 80% 20%,
                            rgba(59, 130, 246, 0.02) 0%,
                            transparent 50%
                        );
                }

                .chat-messages {
                    position: relative;
                    z-index: 1;
                }
            `;
            document.head.appendChild(gradientStyle);
        },
    };

    BackgroundGradient.init();


    /**
     * ============================================================
     * FONT SCALING OPTION
     * Allows users to adjust the chat font size.
     * ============================================================
     */
    const FontScaler = {
        currentScale: 1.0,
        scaleOptions: [0.85, 0.9, 1.0, 1.1, 1.2],
        currentIndex: 2,

        init() {
            // Ctrl/Cmd + Plus/Minus to scale
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
                    e.preventDefault();
                    this.scaleUp();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === '-') {
                    e.preventDefault();
                    this.scaleDown();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === '0') {
                    e.preventDefault();
                    this.resetScale();
                }
            });
        },

        scaleUp() {
            if (this.currentIndex < this.scaleOptions.length - 1) {
                this.currentIndex++;
                this.applyScale();
            }
        },

        scaleDown() {
            if (this.currentIndex > 0) {
                this.currentIndex--;
                this.applyScale();
            }
        },

        resetScale() {
            this.currentIndex = 2;
            this.applyScale();
        },

        applyScale() {
            this.currentScale = this.scaleOptions[this.currentIndex];

            const container = Utils.$('chatMessages');
            if (container) {
                container.style.fontSize = `${this.currentScale}em`;
            }

            ToastManager.show(
                `文字サイズ: ${Math.round(this.currentScale * 100)}%`,
                'info',
                1500
            );
        },
    };

    FontScaler.init();


    /**
     * ============================================================
     * FINAL CONSOLE BRANDING
     * ============================================================
     */
    const ConsoleBranding = {
        init() {
            const styles = [
                'color: #f97316; font-size: 14px; font-weight: bold;',
                'color: #3b82f6; font-size: 14px; font-weight: bold;',
                'color: #6b7280; font-size: 11px;',
                'color: #6b7280; font-size: 11px;',
                'color: #6b7280; font-size: 11px;',
            ];

            console.log(
                '%cカロン%c & %cコレー%c の雑談トーク\n' +
                '%c─────────────────────────────\n' +
                'キーボードショートカット: ? キーで表示\n' +
                'デバッグモード: URL末尾に ?debug=true\n' +
                'テキスト書き出し: Ctrl+Shift+E\n' +
                '─────────────────────────────',
                styles[0],
                'color: #6b7280; font-size: 14px;',
                styles[1],
                'color: #6b7280; font-size: 14px;',
                styles[2]
            );
        },
    };

    ConsoleBranding.init();


    /**
     * ============================================================
     * COMPREHENSIVE FEATURE CHECK
     * Logs supported features on init for debugging.
     * ============================================================
     */
    const FeatureCheck = {
        init() {
            if (new URLSearchParams(window.location.search).get('debug') !== 'true') return;

            const features = {
                'Web Audio API': !!(window.AudioContext || window.webkitAudioContext),
                'IntersectionObserver': 'IntersectionObserver' in window,
                'MutationObserver': 'MutationObserver' in window,
                'ResizeObserver': 'ResizeObserver' in window,
                'Clipboard API': !!(navigator.clipboard && navigator.clipboard.writeText),
                'Vibration API': 'vibrate' in navigator,
                'Service Worker': 'serviceWorker' in navigator,
                'CSS Backdrop Filter': CSS.supports('backdrop-filter', 'blur(10px)'),
                'CSS Scroll Behavior': CSS.supports('scroll-behavior', 'smooth'),
                'SessionStorage': (() => { try { sessionStorage.setItem('t', '1'); sessionStorage.removeItem('t'); return true; } catch(e) { return false; } })(),
                'LocalStorage': (() => { try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return true; } catch(e) { return false; } })(),
            };

            console.group('Feature Support');
            for (const [name, supported] of Object.entries(features)) {
                console.log(
                    `%c${supported ? '✓' : '✗'} ${name}`,
                    `color: ${supported ? '#22c55e' : '#ef4444'}`
                );
            }
            console.groupEnd();
        },
    };

    FeatureCheck.init();


    /**
     * ============================================================
     * COMPLETE MODULE REGISTRY
     * Documents all modules for reference.
     * ============================================================
     *
     * CORE MODULES:
     *   1.  App (State management)
     *   2.  SoundEngine (Web Audio API procedural sounds)
     *   3.  Utils (DOM helpers, debounce, throttle, sleep)
     *   4.  Renderer (Message DOM creation, typing indicator)
     *   5.  Playback (Play/pause/skip/seek engine)
     *
     * UI MODULES:
     *   6.  ToastManager (Notification toasts)
     *   7.  ReactionSystem (Emoji reactions on messages)
     *   8.  ThemeManager (Light/dark mode)
     *   9.  ScrollManager (Scroll-to-bottom button)
     *   10. MarsEffect (Episode 2 particle background)
     *   11. SplashScreen (Loading screen)
     *   12. SettingsPanel (Settings modal)
     *   13. SidebarController (Mobile sidebar toggle)
     *   14. ProgressBarSeek (Click-to-seek on progress bar)
     *   15. KeyboardShortcuts (Keyboard controls)
     *
     * INTERACTION MODULES:
     *   16. ChatInputHandler (User message input + auto-response)
     *   17. ContextMenuHandler (Right-click/long-press menu)
     *   18. TermTooltipSystem (Technical term dictionary tooltips)
     *   19. MessageSearch (Full-text search with navigation)
     *   20. StatsPanel (Conversation statistics)
     *   21. DoubleTapLike (Mobile double-tap heart reaction)
     *   22. ConversationExport (Export as text file)
     *
     * ENHANCEMENT MODULES:
     *   23. AdvancedPlayback (Reading mode, completion handlers)
     *   24. AdaptiveTiming (Natural typing/reading rhythm)
     *   25. MessageGrouper (Visual message grouping)
     *   26. EpisodeTransition (Fade effect on episode switch)
     *   27. EpisodeAutoAdvance (Next episode prompt)
     *   28. BackgroundGradient (Subtle animated gradient)
     *   29. FontScaler (Ctrl+/- font size adjustment)
     *   30. UnreadBadge (Tab title unread count)
     *   31. DynamicStyles (Runtime CSS injection)
     *
     * SYSTEM MODULES:
     *   32. StateManager (Session storage save/restore)
     *   33. HapticFeedback (Mobile vibration)
     *   34. IdleDetector (Idle hint display)
     *   35. VisibilityHandler (Tab visibility pause/resume)
     *   36. ResizeHandler (Viewport resize handling)
     *   37. ReducedMotionHandler (Accessibility: reduced motion)
     *   38. PageLifecycle (Page freeze/resume events)
     *   39. NetworkStatus (Online/offline notifications)
     *   40. ErrorBoundary (Global error handling)
     *
     * ACCESSIBILITY MODULES:
     *   41. AriaAnnouncer (Screen reader announcements)
     *   42. FocusTrap (Modal focus trapping)
     *   43. RelativeTime (Timestamp title attributes)
     *   44. ScrollAnimationObserver (IntersectionObserver animations)
     *
     * FUN MODULES:
     *   45. KonamiCode (Easter egg: emoji rain)
     *
     * DEBUG MODULES:
     *   46. PerfMonitor (FPS counter)
     *   47. ConsoleBranding (Console styling)
     *   48. FeatureCheck (Feature support logging)
     *   49. LinkDecorator (URL decoration in messages)
     *   50. SmoothScrollEnhancer (Scroll behavior)
     *   51. LazyMarsParticles (Lazy particle creation)
     *   52. PWAHelper (Service worker stub)
     *
     * DATA:
     *   - EPISODE_1_MESSAGES (88 messages)
     *   - EPISODE_2_MESSAGES (147 messages)
     *
     * Total unique modules: 52
     * Total conversation messages: 235
     * ============================================================
     */


    /**
     * ============================================================
     * RUNTIME INTEGRITY CHECK
     * Verifies all critical modules are loaded.
     * ============================================================
     */
    const IntegrityCheck = {
        init() {
            const criticalModules = [
                { name: 'App', obj: App },
                { name: 'Renderer', obj: Renderer },
                { name: 'Playback', obj: Playback },
                { name: 'SoundEngine', obj: SoundEngine },
                { name: 'ThemeManager', obj: ThemeManager },
                { name: 'Utils', obj: Utils },
            ];

            let allOk = true;
            criticalModules.forEach(({ name, obj }) => {
                if (!obj) {
                    console.error(`Critical module missing: ${name}`);
                    allOk = false;
                }
            });

            // Check data integrity
            const ep1Count = EPISODE_1_MESSAGES.length;
            const ep2Count = EPISODE_2_MESSAGES.length;

            if (ep1Count < 10 || ep2Count < 10) {
                console.error('Episode data appears incomplete');
                allOk = false;
            }

            if (allOk) {
                console.log(
                    `%c✓ All systems go. EP1: ${ep1Count} items, EP2: ${ep2Count} items.`,
                    'color: #22c55e;'
                );
            }
        },
    };

    IntegrityCheck.init();
    </script>
