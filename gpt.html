<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:'Segoe UI','Yu Gothic UI',sans-serif;width:100vw;height:100vh;background:#000;}

/* BOOT */
#boot{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:opacity 1.2s;}
.wlogo{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:88px;height:88px;animation:wSpin 2.5s ease-in-out;}
.wlogo div{border-radius:2px;}.w1{background:#F25022;}.w2{background:#7FBA00;}.w3{background:#00A4EF;}.w4{background:#FFB900;}
@keyframes wSpin{0%{transform:scale(.3) rotate(-180deg);opacity:0}40%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1);opacity:1}}
.boot-sub{color:#fff;font-size:12px;margin-top:50px;letter-spacing:4px;opacity:0;animation:bfu 1s 1.2s forwards;}
@keyframes bfu{to{opacity:.7;transform:translateY(0)}0%{transform:translateY(8px)}}
.boot-ring{margin-top:28px;width:28px;height:28px;border:3px solid transparent;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* LOCK */
#lock{position:fixed;inset:0;background:linear-gradient(160deg,#001a3a 0%,#003d7a 50%,#0055aa 100%);z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .8s;}
.lk-av{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#0078D4,#00BCF2);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.4);}
.lk-time{color:#fff;font-size:68px;font-weight:200;letter-spacing:2px;margin-bottom:4px;}
.lk-date{color:rgba(255,255,255,.65);font-size:16px;}
.lk-hint{color:rgba(255,255,255,.35);font-size:13px;margin-top:60px;animation:pls 2s infinite;}
@keyframes pls{0%,100%{opacity:.3}50%{opacity:.7}}

/* DESKTOP */
#desktop{position:fixed;inset:0;display:none;flex-direction:column;}
#wallpaper{position:absolute;inset:0;background:linear-gradient(160deg,#0078D4 0%,#004488 40%,#001a3a 100%);z-index:0;}
.desk{flex:1;position:relative;z-index:1;padding:14px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;}
.di{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;text-align:center;padding:8px 4px;border-radius:6px;cursor:pointer;user-select:none;}
.di:hover{background:rgba(255,255,255,.12)}.di:active{background:rgba(255,255,255,.22)}
.di-img{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.di-lbl{color:#fff;font-size:11px;text-shadow:0 1px 4px rgba(0,0,0,.9);line-height:1.2;}

/* TASKBAR */
#taskbar{height:48px;background:rgba(0,0,0,.85);backdrop-filter:blur(30px);display:flex;align-items:center;padding:0 8px;border-top:1px solid rgba(255,255,255,.07);position:relative;z-index:2;}
.ts{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:4px;}
.ts:hover{background:rgba(255,255,255,.1)}
.wls{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px;}.wls div{border-radius:1px;}
.tb-items{flex:1;display:flex;gap:2px;margin-left:8px;overflow:hidden;}
.tb-i{padding:5px 12px;background:rgba(255,255,255,.06);border:none;color:#ddd;font-size:11px;cursor:pointer;border-radius:4px;display:none;align-items:center;gap:6px;border-bottom:2px solid #6366f1;white-space:nowrap;}
.tb-i.vis{display:flex}.tb-i:hover{background:rgba(255,255,255,.12)}
.stray{display:flex;align-items:center;gap:10px;color:#fff;font-size:12px;margin-left:auto;padding-right:4px;}

/* START MENU */
#sm{position:fixed;bottom:48px;left:0;width:290px;background:rgba(20,20,20,.96);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.1);border-radius:8px 8px 0 0;padding:10px;display:none;z-index:5000;color:#fff;}
#sm.show{display:block}
.smi{padding:10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;}
.smi:hover{background:rgba(255,255,255,.08)}

/* APP WINDOW */
.aw{position:fixed;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6);display:none;flex-direction:column;overflow:hidden;z-index:1000;min-width:340px;min-height:260px;}
.aw.show{display:flex}.aw.mx{top:0!important;left:0!important;width:100vw!important;height:calc(100vh - 48px)!important;border-radius:0}
.tb{height:34px;display:flex;align-items:center;padding:0 4px 0 10px;flex-shrink:0;}
.tbdr{flex:1;display:flex;align-items:center;gap:8px;height:100%;cursor:move;user-select:none;}
.tbic{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;font-weight:800;}
.tbtx{font-size:12px;user-select:none;}
.wcs{display:flex;height:100%;}
.wc{width:46px;height:100%;border:none;background:transparent;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.wc:hover{background:rgba(255,255,255,.1)}.wc.cx:hover{background:#e81123;color:#fff!important}

.abody{flex:1;display:flex;overflow:hidden;}

/* SIDEBAR */
.sb{width:252px;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .2s;}
.sb.coll{width:0;min-width:0}
.sh{padding:10px;display:flex;gap:6px;}
.sbtn{padding:7px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px;border:none;}
.sbtn:hover{filter:brightness(1.15)}
.apib{padding:0 10px 8px;}
.apin{width:100%;padding:7px 10px;border-radius:6px;font-size:11px;outline:none;border:1px solid;font-family:monospace;}
.apst{font-size:10px;margin-top:3px;min-height:13px;}
.sts{display:flex;border-bottom:1px solid;}
.st{flex:1;padding:7px;text-align:center;font-size:11px;cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;transition:all .15s;}
.st.a{border-bottom-color:#6366f1}
.sc{flex:1;overflow-y:auto;padding:6px;}
.sf{padding:10px;border-top:1px solid;}

.ci{padding:8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;margin-bottom:1px;font-size:12px;gap:6px;}
.cit{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cim{opacity:0;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;font-size:14px;}
.ci:hover .cim{opacity:1}
.pi{padding:8px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:1px;}

/* MAIN */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ma{flex:1;overflow-y:auto;padding:16px;}
.wel{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.wt{font-size:22px;font-weight:600;margin-top:12px;margin-bottom:4px;}
.ws{font-size:13px;}

.mg{margin-bottom:16px;display:flex;gap:10px;max-width:740px;margin-left:auto;margin-right:auto;width:100%;}
.mav{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
.mc{flex:1;line-height:1.65;font-size:13px;padding-top:4px;white-space:pre-wrap;word-break:break-word;user-select:text;}

.ia{padding:12px 16px;border-top:1px solid;}
.iw{max-width:740px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;}
.ci-inp{flex:1;padding:10px 14px;border-radius:12px;font-size:13px;outline:none;resize:none;min-height:42px;max-height:120px;font-family:inherit;border:1px solid;user-select:text;}
.ci-inp::placeholder{opacity:.5}
.sndb{width:42px;height:42px;background:#6366f1;border:none;border-radius:12px;color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.sndb:hover{background:#4f46e5}.sndb:disabled{opacity:.35;cursor:not-allowed}

/* CTX MENU */
.ctx{position:fixed;border-radius:8px;padding:4px;min-width:170px;z-index:9999;display:none;}
.ctx.show{display:block}
.cxi{padding:7px 14px;font-size:12px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:8px;}
.cxd{height:1px;margin:3px 0;}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9998;}
.mo.show{display:flex}
.ml{border-radius:12px;padding:22px;min-width:280px;max-width:420px;width:90%;}
.mlt{font-size:16px;font-weight:600;margin-bottom:14px;}
.mli{width:100%;padding:9px 12px;border-radius:8px;font-size:13px;outline:none;margin-bottom:14px;border:1px solid;user-select:text;}
.mlbs{display:flex;gap:8px;justify-content:flex-end;}
.mlb{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-size:12px;}

.typ{display:flex;gap:4px;padding:4px 0;}.typ span{width:6px;height:6px;border-radius:50%;animation:tp 1.2s infinite;}
.typ span:nth-child(2){animation-delay:.2s}.typ span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* ===== DARK ===== */
.Td .aw{background:#1e1e1e}.Td .tb{background:#2a2a2a}.Td .tbtx{color:#bbb}.Td .wc{color:#888}

<script>
const S={key:'',th:'dark',chats:[],cur:null,pjs:[],tab:'c',ws:'closed',mx:false,pos:{x:50,y:25},sz:{w:900,h:530}};
let ci=0,pi=0,drg=false,dof={x:0,y:0};

window.onload=()=>{uC();setInterval(uC,1e3);uLT();
setTimeout(()=>{let b=document.getElementById('boot');b.style.opacity='0';
setTimeout(()=>{b.style.display='none';document.getElementById('lock').style.display='flex';},1200);},3500);};

document.getElementById('lock').onclick=()=>{let l=document.getElementById('lock');l.style.opacity='0';
setTimeout(()=>{l.style.display='none';document.getElementById('desktop').style.display='flex';},800);};

function uLT(){let n=new Date(),ds=['日','月','火','水','木','金','土'];
document.getElementById('lt').textContent=p(n.getHours())+':'+p(n.getMinutes());
document.getElementById('ld').textContent=`${n.getMonth()+1}月${n.getDate()}日（${ds[n.getDay()]}）`;setTimeout(uLT,1e4);}
function uC(){let n=new Date();document.getElementById('clk').textContent=p(n.getHours())+':'+p(n.getMinutes())+'  '+n.getFullYear()+'/'+p(n.getMonth()+1)+'/'+p(n.getDate());}
function p(v){return String(v).padStart(2,'0');}

function togSM(){document.getElementById('sm').classList.toggle('show');}
document.addEventListener('click',e=>{
if(!e.target.closest('#sm')&&!e.target.closest('.ts'))document.getElementById('sm').classList.remove('show');
if(!e.target.closest('.ctx')&&!e.target.closest('.cim'))document.getElementById('ctx').classList.remove('show');});

function openApp(){let w=document.getElementById('aw');w.classList.add('show');S.ws='open';
if(!S.mx){w.style.left=S.pos.x+'px';w.style.top=S.pos.y+'px';w.style.width=S.sz.w+'px';w.style.height=S.sz.h+'px';}
document.getElementById('tbgh').classList.add('vis');rSB();rM();}
function closeApp(){document.getElementById('aw').classList.remove('show');S.ws='closed';document.getElementById('tbgh').classList.remove('vis');}
function minApp(){document.getElementById('aw').classList.remove('show');S.ws='min';}
function restApp(){if(S.ws==='min'){document.getElementById('aw').classList.add('show');S.ws='open';}else if(S.ws==='open')minApp();else openApp();}
function maxApp(){let w=document.getElementById('aw');
if(S.mx){w.classList.remove('mx');w.style.left=S.pos.x+'px';w.style.top=S.pos.y+'px';w.style.width=S.sz.w+'px';w.style.height=S.sz.h+'px';document.getElementById('mxb').textContent='☐';S.mx=false;}
else{w.classList.add('mx');document.getElementById('mxb').textContent='❐';S.mx=true;}}

document.getElementById('tbdr').onmousedown=e=>{if(S.mx)return;drg=true;let w=document.getElementById('aw');dof.x=e.clientX-w.offsetLeft;dof.y=e.clientY-w.offsetTop;e.preventDefault();};
document.onmousemove=e=>{if(!drg)return;let w=document.getElementById('aw'),x=e.clientX-dof.x,y=Math.max(0,e.clientY-dof.y);w.style.left=x+'px';w.style.top=y+'px';S.pos.x=x;S.pos.y=y;};
document.onmouseup=()=>{drg=false;};
document.getElementById('tbdr').ondblclick=()=>maxApp();

document.getElementById('tbdr').addEventListener('touchstart',e=>{if(S.mx)return;drg=true;let w=document.getElementById('aw'),t=e.touches[0];dof.x=t.clientX-w.offsetLeft;dof.y=t.clientY-w.offsetTop;},{passive:true});
document.addEventListener('touchmove',e=>{if(!drg)return;let w=document.getElementById('aw'),t=e.touches[0],x=t.clientX-dof.x,y=Math.max(0,t.clientY-dof.y);w.style.left=x+'px';w.style.top=y+'px';S.pos.x=x;S.pos.y=y;},{passive:true});
document.addEventListener('touchend',()=>{drg=false;});

function togSB(){document.getElementById('sb').classList.toggle('coll');}

function togTh(){let w=document.getElementById('tw'),b=document.getElementById('thb');
if(S.th==='dark'){S.th='light';w.className='Tl';b.innerHTML='☀️ ライトモード';}
else{S.th='dark';w.className='Td';b.innerHTML='🌙 ダークモード';}}

function onApi(v){S.key=v;let e=document.getElementById('apst');
if(!v){e.textContent='';e.className='apst';return;}
if(v.startsWith('sk-')){e.textContent='✓ APIキーが設定されました';e.className='apst ok';}
else{e.textContent='sk- で始まるキーを入力してください';e.className='apst ng';}}

function newChat(pj){ci++;let c={id:ci,t:'新しいチャット',m:[],arc:false,pj:pj||null};
S.chats.unshift(c);S.cur=c.id;if(S.tab==='a')swT('c');rSB();rM();}
function sel(id){S.cur=id;rSB();rM();}
function cc(){return S.chats.find(c=>c.id===S.cur);}
function del(id){S.chats=S.chats.filter(c=>c.id!==id);if(S.cur===id)S.cur=S.chats.length?S.chats[0].id:null;rSB();rM();}
function arc(id){let c=S.chats.find(x=>x.id===id);if(c)c.arc=!c.arc;rSB();}

function expH(id){let c=S.chats.find(x=>x.id===id);if(!c)return;
let h=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(c.t)}</title><style>body{font-family:'Segoe UI',sans-serif;max-width:800px;margin:40px auto;padding:0 20px;background:#111;color:#eee}h1{border-bottom:2px solid #6366f1;padding-bottom:12px}.m{margin:14px 0;padding:14px 16px;border-radius:10px}.u{background:#6366f1}.a{background:#222;border:1px solid #444}.e{background:#330000;border:1px solid #660000}strong{display:block;margin-bottom:6px;font-size:13px;opacity:.7}</style></head><body><h1>💬 ${esc(c.t)}</h1>`;
c.m.forEach(m=>{let cl=m.r==='user'?'u':m.r==='error'?'e':'a',lb=m.r==='user'?'あなた':m.r==='error'?'エラー':'GH1.0';
h+=`<div class="m ${cl}"><strong>${lb}</strong><p>${esc(m.c).replace(/\n/g,'<br>')}</p></div>`;});
h+=`<p style="margin-top:40px;opacity:.3;font-size:11px;">Exported from GH1.0 — ${new Date().toLocaleString('ja-JP')}</p></body></html>`;
let bl=new Blob([h],{type:'text/html'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=c.t+'.html';a.click();URL.revokeObjectURL(u);}

function shCM(e,id){e.stopPropagation();let cm=document.getElementById('ctx'),c=S.chats.find(x=>x.id===id);
cm.innerHTML=`<div class="cxi" onclick="rnC(${id})">✏️ 名前を変更</div>
<div class="cxi" onclick="arc(${id});document.getElementById('ctx').classList.remove('show');">${c.arc?'📂 アーカイブ解除':'📁 アーカイブ'}</div>
<div class="cxi" onclick="expH(${id});document.getElementById('ctx').classList.remove('show');">💾 HTMLで保存</div>
<div class="cxd"></div>
<div class="cxi dg" onclick="del(${id});document.getElementById('ctx').classList.remove('show');">🗑️ 削除</div>`;
cm.style.left=Math.min(e.clientX,innerWidth-180)+'px';cm.style.top=Math.min(e.clientY,innerHeight-200)+'px';cm.classList.add('show');}

function rnC(id){document.getElementById('ctx').classList.remove('show');let c=S.chats.find(x=>x.id===id);
shMdl('チャット名を変更',c.t,v=>{if(v.trim()){c.t=v.trim();rSB();}});}

function newPj(){shMdl('新しいプロジェクト','',v=>{if(v.trim()){pi++;S.pjs.push({id:pi,n:v.trim()});rSB();}});}
function opPj(id){let pj=S.pjs.find(x=>x.id===id);if(!pj)return;
let cs=S.chats.filter(c=>c.pj===id);
let cl=cs.length?cs.map(c=>`<div style="padding:8px 10px;background:rgba(128,128,128,.1);border-radius:6px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px;">
<span style="cursor:pointer;flex:1" onclick="sel(${c.id});clMdl();swT('c')">💬 ${esc(c.t)}</span>
<button onclick="rmPj(${c.id},${id})" style="background:none;border:none;cursor:pointer;font-size:11px;opacity:.5;color:inherit">✕</button></div>`).join('')
:'<p style="opacity:.4;font-size:12px;padding:8px">チャットがありません。下の「＋ 新規チャット」で追加できます。</p>';
let m=document.getElementById('mdl');
m.innerHTML=`<div class="mlt">📂 ${esc(pj.n)}</div><div style="margin-bottom:14px;max-height:220px;overflow-y:auto">${cl}</div>
<div class="mlbs"><button class="mlb s" onclick="nCPj(${id})">＋ 新規チャット</button>
<button class="mlb s" onclick="rnPj(${id})">✏️ 名前変更</button>
<button class="mlb s" onclick="dlPj(${id});clMdl()">🗑️ 削除</button>
<button class="mlb p" onclick="clMdl()">閉じる</button></div>`;
document.getElementById('mdo').classList.add('show');}
function nCPj(pj){clMdl();newChat(pj);swT('c');}
function dlPj(id){S.pjs=S.pjs.filter(p=>p.id!==id);S.chats.forEach(c=>{if(c.pj===id)c.pj=null;});rSB();}
function rmPj(cid,pid){let c=S.chats.find(x=>x.id===cid);if(c)c.pj=null;opPj(pid);}
function rnPj(id){clMdl();let pj=S.pjs.find(x=>x.id===id);
shMdl('プロジェクト名を変更',pj.n,v=>{if(v.trim()){pj.n=v.trim();rSB();}});}

function shMdl(title,def,cb){window._mc=cb;let m=document.getElementById('mdl');
m.innerHTML=`<div class="mlt">${title}</div>
<input class="mli" id="mlin" value="${esc(def)}" placeholder="入力…" onkeydown="if(event.key==='Enter')document.getElementById('mok').click()">
<div class="mlbs"><button class="mlb s" onclick="clMdl()">キャンセル</button>
<button class="mlb p" id="mok" onclick="let v=document.getElementById('mlin').value;clMdl();window._mc&&window._mc(v);">確定</button></div>`;
document.getElementById('mdo').classList.add('show');setTimeout(()=>{let i=document.getElementById('mlin');if(i){i.focus();i.select();}},100);}
function clMdl(){document.getElementById('mdo').classList.remove('show');}

function swT(t){S.tab=t;document.querySelectorAll('.st').forEach(x=>x.classList.remove('a'));
document.getElementById(t==='c'?'t1':t==='a'?'t2':'t3').classList.add('a');rSB();}

function rSB(){let el=document.getElementById('scn');
if(S.tab==='c'){let cs=S.chats.filter(c=>!c.arc);
if(!cs.length){el.innerHTML='<div style="text-align:center;opacity:.35;padding:30px 10px;font-size:12px;line-height:1.8">💬<br>チャットがありません<br>「＋ 新規チャット」で開始</div>';return;}
el.innerHTML=cs.map(c=>`<div class="ci${c.id===S.cur?' act':''}" onclick="sel(${c.id})">
<span style="font-size:13px">${c.pj?'📂':'💬'}</span><span class="cit">${esc(c.t)}</span>
<button class="cim" onclick="shCM(event,${c.id})">⋯</button></div>`).join('');}
else if(S.tab==='a'){let cs=S.chats.filter(c=>c.arc);
if(!cs.length){el.innerHTML='<div style="text-align:center;opacity:.35;padding:30px 10px;font-size:12px;line-height:1.8">📁<br>アーカイブは空です</div>';return;}
el.innerHTML=cs.map(c=>`<div class="ci${c.id===S.cur?' act':''}" onclick="sel(${c.id})">
<span style="font-size:13px">📁</span><span class="cit">${esc(c.t)}</span>
<button class="cim" onclick="shCM(event,${c.id})">⋯</button></div>`).join('');}
else{let h='<div style="margin-bottom:8px"><button class="sbtn" style="width:100%" onclick="newPj()">＋ 新しいプロジェクト</button></div>';
if(!S.pjs.length)h+='<div style="text-align:center;opacity:.35;padding:30px 10px;font-size:12px;line-height:1.8">📂<br>プロジェクトがありません<br>上のボタンで作成</div>';
else h+=S.pjs.map(pj=>{let cnt=S.chats.filter(c=>c.pj===pj.id).length;
return `<div class="pi" onclick="opPj(${pj.id})"><span>📂</span><span style="flex:1">${esc(pj.n)}</span><span style="opacity:.45;font-size:11px">${cnt}件</span></div>`;}).join('');
el.innerHTML=h;}}

function rM(){let a=document.getElementById('ma'),c=cc();
if(!c||!c.m.length){a.innerHTML=`<div class="wel"><div style="font-size:56px">🤖</div><div class="wt">GH1.0</div><div class="ws">AIアシスタントとチャットを始めましょう</div>
<div style="margin-top:20px;opacity:.4;font-size:11px">サイドバーのAPIキー欄にOpenAI APIキーを入力してください</div></div>`;return;}
a.innerHTML=c.m.map(m=>{let av,cl;
if(m.r==='user'){av='<div class="mav" style="background:#6366f1">U</div>';cl='u';}
else if(m.r==='error'){av='<div class="mav" style="background:#ef4444">!</div>';cl='er';}
else{av='<div class="mav" style="background:#22c55e">GH</div>';cl='ai';}
return `<div class="mg">${av}<div class="mc ${cl}">${esc(m.c)}</div></div>`;}).join('');
a.scrollTop=a.scrollHeight;}

async function snd(){let inp=document.getElementById('cinp'),msg=inp.value.trim();if(!msg)return;
if(!cc())newChat();let c=cc();c.m.push({r:'user',c:msg});
if(c.t==='新しいチャット')c.t=msg.substring(0,30)+(msg.length>30?'…':'');
inp.value='';ah(inp);rM();rSB();

if(!S.key){c.m.push({r:'error',c:'APIキーを設定してください。サイドバーの入力欄にOpenAI APIキーを入力してください。'});rM();return;}

let a=document.getElementById('ma'),td=document.createElement('div');td.className='mg';
td.innerHTML='<div class="mav" style="background:#22c55e">GH</div><div class="mc ai"><div class="typ"><span></span><span></span><span></span></div></div>';
a.appendChild(td);a.scrollTop=a.scrollHeight;document.getElementById('sndb').disabled=true;

try{let am=c.m.filter(m=>m.r!=='error').map(m=>({role:m.r==='user'?'user':'assistant',content:m.c}));
let res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key},
body:JSON.stringify({model:'gpt-3.5-turbo',messages:am,max_tokens:2048})});
td.remove();
if(res.status===401||res.status===403){c.m.push({r:'error',c:'APIキーが無効です。'});
document.getElementById('apst').textContent='APIキーが無効です。';document.getElementById('apst').className='apst ng';}
else if(!res.ok){let ed=await res.json().catch(()=>({}));c.m.push({r:'error',c:'エラー: '+(ed.error?.message||res.statusText)});}
else{let d=await res.json();c.m.push({r:'assistant',c:d.choices[0].message.content});}}
catch(err){td.remove();c.m.push({r:'error',c:'接続エラー: '+err.message});}
document.getElementById('sndb').disabled=false;rM();}

function ik(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();snd();}}
function ah(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function esc(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML;}
rSB();rM();
</script>


</body></html>
